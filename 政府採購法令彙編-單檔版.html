lines":["(履約所供應或完成之標的)","廠商履約所供應或完成之標的，應符合契約規定，無減少或滅失價","值或不適於通常或約定使用之瑕疵。"]},{"no":"51","label":"第五十一點","ch":"","cat":"p","lines":["(查驗或驗收有瑕疵時之處理)","廠商履約結果經機關查驗或驗收有瑕疵者，機關得定相當期限，","要求廠商改善、拆除、重作、退貨或換貨 (以下簡稱改正) ，並","得訂明逾期未改正應繳納違約金。","廠商不於前項期限內改正、拒絕改正或其瑕疵不能改正者，","機關得採行下列措施之一：","(一) 自行或使第三人改正，並得向廠商請求償還改正必要之費用。","(二) 解除契約或減少契約價金。但瑕疵非重要者，機關不得解除契","約。","因可歸責於廠商之事由，致履約有瑕疵者，機關除依前二項","規定辦理外，並得請求損害賠償。"]},{"no":"52","label":"第五十二點","ch":"","cat":"p","lines":["(保固或瑕疵擔保期間之訂定)","契約得訂明廠商保固或瑕疵擔保期間。","前項期間內，採購標的因瑕疵致無法使用時，該期間得不予","計入。"]},{"no":"53","label":"第五十三點","ch":"","cat":"p","lines":["(消耗性零配件之價格)","機關得視採購性質及實際需要，於契約內訂明採購標的於使用期","間所需消耗性零配件之單價，或附記其參考價格或價格調整方式","。","第一年使用期間所需消耗性零配件，以附於採購標的合併採","購為原則，並載明其單價。"]},{"no":"54","label":"第五十四點","ch":"","cat":"p","lines":["(維修服務契約)","採購標的於使用期間有由原供應廠商提供維修服務之必要者，其","第一年使用期間之維修服務，以附於採購標的合併招標決標為原","則，並得視案件性質及實際需要調整該一年使用期間。","前項維修服務契約應訂明廠商須提供服務之事項、標價及價","金給付方式。","第一項維修服務，有於使用期間長期洽原供應廠商提供維修","服務之必要者，得於契約訂明廠商每年提供此一服務之費用上限","及廠商不得拒絕提供維修服務。","第二項服務事項，得包括定期維護保養、零配件供應或故障","修理等。"]},{"no":"55","label":"第五十五點","ch":"","cat":"p","lines":["(廠商對於第三人主張權利之責任)","得標廠商應擔保第三人就履約標的，對於機關不得主張任何權利","。","廠商履約，其有侵害第三人合法權益時，應由廠商負責處理","並承擔一切法律責任。"]},{"no":"56","label":"第五十六點","ch":"","cat":"p","lines":["(智慧財產權之歸屬)","廠商履約結果涉及智慧財產權者，機關得視需要於契約規定取得","部分或全部權利或取得授權。"]},{"no":"57","label":"第五十七點","ch":"","cat":"p","lines":["(第三人請求損害賠償之避免)","機關及廠商應採取必要之措施，以保障對方免於因本契約之履行","而遭第三人請求損害賠償。其有致第三人損害者，應由造成損害","原因之一方負責賠償。"]},{"no":"58","label":"第五十八點","ch":"","cat":"p","lines":["(損害賠償之請求)","機關得視採購之特性及實際需要，就第四十五點逾期違約金以外","之損害賠償責任，於契約中明定其賠償之項目、範圍或上限，並","得訂明其排除適用之情形。","廠商應負責之損害賠償金額，機關得自應付價金中扣抵；其","有不足者，得自保證金扣抵或通知廠商給付。"]},{"no":"59","label":"第五十九點","ch":"","cat":"p","lines":["(執行錯誤、不實或管理不善者之賠償責任)","契約應訂明一方執行錯誤、不實或管理不善，致他方遭受損害者","，應負賠償責任。","前項之損害，機關得視個案之特性及實際需要，於契約中明","定其賠償之項目、範圍或上限，並得訂明其排除適用之情形。"]},{"no":"60","label":"第六十點","ch":"","cat":"p","lines":["(機關不負賠償責任之事項)","機關對於廠商及其人員因履約所致之人體傷亡或財物損失，不負賠","償責任。","前項人體傷亡或財物損失之風險，廠商應投保必要之保險。"]},{"no":"61","label":"第六十一點","ch":"","cat":"p","lines":["(機關審查、認可或核准之效果)","廠商依契約規定應履行之責任，不因機關對於廠商履約事項之審","查、認可或核准行為而減少或免除。"]},{"no":"62","label":"第六十二點","ch":"","cat":"p","lines":["(保險之種類)","機關得視採購之特性及實際需要，就下列保險擇定廠商於履約期","間應辦理之保險，並載明於契約：","(一) 營造綜合保險，得包括第三人意外責任險。","(二) 安裝綜合保險，得包括第三人意外責任險。","(三) 雇主責任險。","(四) 汽機車或航空器等之第三人責任險。","(五) 營建機具綜合保險、機械保險、電子設備綜合保險或鍋爐保險","。","(六) 運輸險。","(七) 專業責任險。","(八) 其他必要之保險。"]},{"no":"63","label":"第六十三點","ch":"","cat":"p","lines":["(索賠所費時間)","廠商向保險人索賠所費時間，不得據以請求延長履約期限。"]},{"no":"64","label":"第六十四點","ch":"","cat":"p","lines":["(未保險之責任)","廠商未依契約規定辦理保險、保險範圍不足或未能自保險人獲得","足額理賠者，其損失或損害賠償，由廠商負擔。"]},{"no":"65","label":"第六十五點","ch":"","cat":"p","lines":["(終止或解除契約之情形)","契約得訂明機關得通知廠商終止或解除契約之情形。","契約得訂明終止或解除契約，屬可歸責於廠商之情形者，機","關得依其所認定之適當方式，自行或洽其他廠商完成被終止或解","除之契約；其所增加之費用，由原契約廠商負擔。"]},{"no":"66","label":"第六十六點","ch":"","cat":"p","lines":["(因政策變更之終止或解除契約)","契約因政策變更，廠商依契約繼續履行反而不符公共利益者，機","關得報經上級機關核准，終止或解除部分或全部契約。但應補償","廠商因此所生之損失。"]},{"no":"67","label":"第六十七點","ch":"","cat":"p","lines":["(終止契約後之契約價金給付)","依前點規定終止契約者，廠商於接獲機關通知前已完成且可使用","之履約標的，依契約價金給付；僅部分完成尚未能使用之履約標","的，機關得擇下列方式之一洽廠商為之：","(一) 繼續予以完成，依契約價金給付。","(二) 停止製造、供應或施作。但給付廠商已生之製造、供應或施作","費用及合理之利潤。"]},{"no":"68","label":"第六十八點","ch":"","cat":"p","lines":["(暫停執行)","契約得訂明廠商未依契約規定履約者，機關得隨時通知廠商部分","或全部暫停執行，至情況改正後方准恢復履約。","有前項情形者，契約應訂明廠商不得就暫停執行請求延長履","約期限或增加契約價金。"]},{"no":"69","label":"第六十九點","ch":"","cat":"p","lines":["(暫停執行之補償)","契約得訂明因非可歸責於廠商之情形，機關通知廠商部分或全部","暫停執行，得補償廠商因此而增加之必要費用。","前項暫停執行，機關得視情形，酌予延長履約期限。"]},{"no":"70","label":"第七十點","ch":"","cat":"p","lines":["(履約爭議之處理)","契約應訂明機關與廠商因履約而生爭議者，應依法令及契約規定，","考量公共利益及公平合理，本誠信和諧，盡力協調解決之。其未能","達成協議者，得以下列方式之一處理：","(一) 依本法第八十五條之一規定向採購申訴審議委員會申請調解。","(二) 符合本法第一百零二條規定情事，提出異議、申訴。","(三) 提付仲裁。","(四) 提起民事訴訟。","(五) 依其他法律申 (聲) 請調解。","(六) 契約雙方合意成立爭議處理小組協調爭議。","(七) 依契約或雙方合意之其他方式處理。","前項之爭議，機關亦得依本法第十一條之一規定，成立機關採","購工作及審查小組協助審查、諮詢。"]},{"no":"71","label":"第七十一點","ch":"","cat":"p","lines":["(受理履約爭議之機關)","契約應訂明下列受理履約爭議之機關名稱、地址及電話：","(一) 依本法第八十五條之一規定受理調解之採購申訴審議委員會。","(二) 依本法第一百零二條規定受理申訴之採購申訴審議委員會。"]},{"no":"72","label":"第七十二點","ch":"","cat":"p","lines":["(爭議發生後之履約)","契約應訂明履約爭議發生後，關於履約事項之下列處理原則：","(一) 與爭議無關或不受影響之部分應繼續履約。但經機關同意者不","在此限。","(二) 廠商因爭議而暫停履約，其經爭議處理結果被認定無理由者，","不得就暫停履約之部分要求延長履約期限或免除契約責任。"]},{"no":"73","label":"第七十三點","ch":"","cat":"p","lines":["(訴訟)","契約應訂明以中華民國法律為準據法，並記載訴訟時以機關所在","地之地方法院為第一審管轄法院。但有下列情形之一，無法徵得","廠商同意者，得記載以外國法律為準據法或以外國法院為管轄法","院：","(一) 向國際組織、外國政府或其授權機構辦理之採購。","(二) 以限制性招標辦理之採購。","(三) 依本法第一百零六條規定辦理之採購。","(四) 其他經機關認定確有必要者。"]},{"no":"74","label":"第七十四點","ch":"","cat":"p","lines":["(仲裁)","契約得訂明其爭議得依仲裁法以仲裁方式處理，並約定仲裁處所","。"]},{"no":"75","label":"第七十五點","ch":"","cat":"p","lines":["(繳納代金證明)","契約應訂明得標廠商其於國內員工總人數逾一百人，履約期間僱","用身心障礙者及原住民人數各應達國內員工總人數百分之一，並","均以整數為計算標準，未達整數部分不予計入。僱用不足依規定","應繳納代金者，應分別依規定向所在地之直轄市或縣 (市) 勞工","主管機關設立之身心障礙者就業基金專戶及原住民中央主管機關","設立之原住民族就業基金專戶，繳納上月之代金；並不得僱用外","籍勞工取代僱用不足額部分。","招標機關應將前項國內員工總人數逾一百人之廠商資料，依","政府採購公告及公報發行辦法第十四條規定彙送至主管機關之決","標資料庫，以供勞工及原住民主管機關查核代金繳納情形。"]}]},{"id":"GL000015","title":"各機關對新材料、新技術及新工法使用試辦作業要點","short":"新材料新技術試辦要點","date":"民國101年06月13日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000015","articles":[{"no":"1","label":"全文","ch":"","cat":"p","lines":["(訂定宗旨)","一、行政院公共工程委員會(下稱本會)為促進國內工程主辦機關（下稱各","機關）對新材料、新技術及新工法之使用，特訂定本作業要點。"]},{"no":"2","label":"（2）","ch":"","cat":"p","lines":["(適用範圍)","二、本試辦作業要點所稱新材料、新技術及新工法，係指國內無現行國家","標準或規範可依循，須經試辦以確認其功能或效益者。"]},{"no":"3","label":"（3）","ch":"","cat":"p","lines":["(試辦定義)","三、本作業要點所稱試辦，係指各機關採用新材料、新技術及新工法認有","必要確認其功能及效益項目，須進行現地試作，以追蹤評估成效者。"]},{"no":"4","label":"（4）","ch":"","cat":"p","lines":["(試辦計畫登錄)","四、各機關採用新材料、新技術及新工法之試辦工程，須於決標後1 個月","內至本會公共工程技術資料庫網站登錄「各機關對新材料、新技術及","新工法試辦工程之基本資料表」。"]},{"no":"5","label":"（5）","ch":"","cat":"p","lines":["(試辦過程紀錄)","五、各機關試辦過程應加強設計、施工、監造及驗收等管理作業，以確保","試辦工程品質，前述試辦過程紀錄應納入試辦成果報告書。"]},{"no":"6","label":"（6）","ch":"","cat":"p","lines":["(成果報告書審查方式)","六、前述成果報告書之審查，各機關應擇下列方式之一辦理：","（一）自行審查：簽報機關首長或其授權人員核定。","（二）開會審查：簽報機關首長或其授權人員召開審查會議，並得邀請專","家學者、廠商代表、規劃設計、監造單位與會協助。","（三）委託審查：委託第三專業機構審查。"]},{"no":"7","label":"（7）","ch":"","cat":"p","lines":["(成果報告書提送)","七、各機關應提送試辦成果報告書至本會，報告書內容至少須包含試辦過","程紀錄、分析、成果檢討及建議等資料，其格式得由各機關依個案需","求自行訂定。試辦成果報告書得依試辦工程特性，分階段提送，提送","時間由各機關另訂。"]},{"no":"8","label":"第八點","ch":"","cat":"p","lines":["試辦工程所需經費由各機關籌措辦理。對於積極辦理人員，本會得函","請機關優予敘獎。"]}]},{"id":"FL003734","title":"公共工程施工品質管理作業要點","short":"施工品質管理作業要點","date":"民國112年05月11日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL003734","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["行政院公共工程委員會（以下簡稱工程會）為提升公共工程施工品質","，確保公共工程施工成果符合其設計及規範之品質要求，並落實政府","採購法第七十條工程採購品質管理之規定，爰訂定本要點。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["行政院與所屬各級行政機關、公立學校及公營事業機構（以下簡稱機","關）辦理工程採購，其施工品質管理作業，除法令另有規定外，依本","要點之規定。","本要點所定工程金額係指採購標案預算金額，如為複數決標則為","各項預算金額；因契約變更致金額異動者，則為變更後之契約金額。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["機關辦理新臺幣一百五十萬元以上工程，應於招標文件內訂定廠商應","提報品質計畫。","品質計畫得視工程規模及性質，分整體品質計畫與分項品質計畫","二種。整體品質計畫應依契約規定提報，分項品質計畫得於各分項工","程施工前提報。未達新臺幣一千萬元之工程僅需提送整體品質計畫。","整體品質計畫之內容，除機關及監造單位另有規定外，應包括：","（一）新臺幣五千萬元以上工程：計畫範圍、管理權責及分工、施工要領","、品質管理標準、材料及施工檢驗程序、自主檢查表、不合格品之","管制、矯正與預防措施、內部品質稽核及文件紀錄管理系統等。","（二）新臺幣一千萬元以上未達五千萬元之工程：計畫範圍、管理權責及","分工、品質管理標準、材料及施工檢驗程序、自主檢查表及文件紀","錄管理系統等。","（三）新臺幣一百五十萬元以上未達一千萬元之工程：管理權責及分工、","材料及施工檢驗程序及自主檢查表等。","工程具運轉類機電設備者，並應增訂設備功能運轉檢測程序及標","準。","分項品質計畫之內容，除機關及監造單位另有規定外，應包括施","工要領、品質管理標準、材料及施工檢驗程序、自主檢查表等項目。","品質計畫內容之製作綱要，由工程會另定之。"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["機關辦理新臺幣二千萬元以上之工程，應於工程招標文件內依工程規","模及性質，訂定下列事項。但性質特殊之工程，得報經工程會同意後","不適用之：","（一）品質管理人員（以下簡稱品管人員）之資格、人數及其更換規定；","每一標案最低品管人員人數規定如下：","1.新臺幣二千萬元以上未達二億元之工程，至少一人。","2.新臺幣二億元以上之工程，至少二人。","（二）新臺幣五千萬元以上之工程，品管人員應專職，不得跨越其他標案","，且契約施工期間應在工地執行職務；新臺幣二千萬元以上未達五","千萬元之工程，品管人員得同時擔任其他法規允許之職務，但不得","跨越其他標案，且契約施工期間應在工地執行職務。","（三）廠商應於開工前，將品管人員之登錄表（如附表一）報監造單位審","查，並於經機關核定後，由機關填報於工程會資訊網路系統備查；","品管人員異動或工程竣工時，亦同。","（四）品管人員於進駐工地前一年內或執行業務期間，有因業務上相關之","犯罪行為，經判刑確定之情事者，廠商應主動更換人員提報；如未","提報，監造單位應通知廠商更換人員。","機關辦理未達新臺幣二千萬元之工程，得比照前項規定辦理。"]},{"no":"5","label":"第五點","ch":"","cat":"p","lines":["品管人員，應接受工程會或其委託訓練機構辦理之公共工程品質管理","訓練課程，並取得結業證書。","取得前項結業證書逾四年者，應再取得最近四年內之回訓證明，","始得擔任品管人員。但特殊情形，工程會有另定者，不在此限。","在職品管人員已報名回訓在案，因非可歸責於己之事由，致未能","於前項期間取得回訓證明者，經機關同意並檢具證明文件，得向工程","會申請展延回訓期限六個月。","第一項及第二項之訓練課程、時數及實施方式，及第二項回訓實","施期程，由工程會另定之。"]},{"no":"6","label":"第六點","ch":"","cat":"p","lines":["品管人員工作重點如下：","（一）依據工程契約、設計圖說、規範、相關技術法規及參考品質計畫製","作綱要等，訂定品質計畫，據以推動實施。","（二）執行內部品質稽核，如稽核自主檢查表之檢查項目、檢查結果是否","詳實記錄等。","（三）品管統計分析、矯正與預防措施之提出及追蹤改善。","（四）品質文件、紀錄之管理。","（五）其他提升工程品質事宜。"]},{"no":"7","label":"第七點","ch":"","cat":"p","lines":["機關辦理新臺幣一百五十萬元以上且適用營造業法規定之工程，應於","招標文件內訂定有關營造廠商專任工程人員（主任技師或主任建築師","）之下列事項：","（一）督察品管人員及現場施工人員，落實執行品質計畫，並填具督察紀","錄表（參考格式如附表二）。","（二）依據營造業法第三十五條規定，辦理相關工作，如督察按圖施工、","解決施工技術問題；查驗工程時到場說明，並於工程查驗文件簽名","或蓋章等。","（三）依據工程施工查核小組作業辦法規定於工程查核時，到場說明。","（四）未依上開各款規定辦理之處理規定。"]},{"no":"8","label":"第八點","ch":"","cat":"p","lines":["機關應視工程需要，指派具工程相關學經歷之適當人員或委託適當機","構負責監造。","新臺幣一百五十萬元以上工程，監造單位應提報監造計畫。","監造計畫之內容除機關另有規定外，應包括：","（一）新臺幣五千萬元以上工程：監造範圍、監造組織及權責分工、品質","計畫審查作業程序、施工計畫審查作業程序、材料與設備抽驗程序","及標準、施工抽查程序及標準、品質稽核、文件紀錄管理系統等。","（二）新臺幣一千萬元以上未達五千萬元之工程：監造範圍、監造組織及","權責分工、品質計畫審查作業程序、施工計畫審查作業程序、材料","與設備抽驗程序及標準、施工抽查程序及標準、文件紀錄管理系統","等。","（三）新臺幣一百五十萬元以上未達一千萬元之工程：監造組織及權責分","工、品質計畫審查作業程序、施工計畫審查作業程序、材料與設備","抽驗程序及標準、施工抽查程序及標準等。","工程具運轉類機電設備者，並應增訂設備功能運轉測試等抽驗程","序及標準。","監造計畫內容之製作綱要，由工程會另定之。"]},{"no":"9","label":"第九點","ch":"","cat":"p","lines":["機關委託監造，應於招標文件內訂定下列事項：","（一）監造單位派駐現場人員之資格及人數，並依據監造計畫執行監造作","業。其未能有效達成品質要求時，得隨時撤換之。","（二）廠商監造不實或管理不善，致機關遭受損害之責任及罰則。","（三）監造單位之建築師或技師，應依據工程施工查核小組作業辦法規定","，於工程查核時到場說明。","（四）未依前款規定辦理之處理規定。"]},{"no":"10","label":"第十點","ch":"","cat":"p","lines":["機關辦理新臺幣五千萬元以上之工程，其委託監造者，應於招標文件","內訂定下列事項。但性質特殊之工程，得報經工程會同意後不適用之","：","（一）監造單位應比照第五點規定，置受訓合格之現場人員；每一標案最","低人數規定如下：","1.新臺幣五千萬元以上未達二億元之工程，至少一人。","2.新臺幣二億元以上之工程，至少二人。","（二）前款現場人員應專職，不得跨越其他標案，且監造服務期間應在工","地執行職務。","（三）監造單位應於開工前，將其符合第一款規定之現場人員之登錄表（","如附表三）經機關核定後，由機關填報於工程會資訊網路系統備查","；上開人員異動或工程竣工時，亦同。","（四）第一款現場人員於進駐工地前一年內或執行業務期間，有因業務上","相關之犯罪行為，經判刑確定之情事者，監造單位應主動更換人員","提報；如未提報，機關應通知監造單位更換人員。","機關辦理未達新臺幣五千萬元之工程，得比照前項規定辦理。","機關自辦監造者，其現場人員之資格、人數、專職及登錄規定，","比照前二項規定辦理。但有特殊情形，得報經上級機關同意後不適用","之。"]},{"no":"11","label":"第十一點","ch":"","cat":"p","lines":["監造單位及其所派駐現場人員工作重點如下：","（一）訂定監造計畫，並監督、查證廠商履約。","（二）施工廠商之施工計畫、品質計畫、預定進度、施工圖、施工日誌","（參考格式如附表四）、器材樣品及其他送審案件之審核。","（三）重要分包廠商及設備製造商資格之審查。","（四）訂定檢驗停留點，辦理抽查施工作業及抽驗材料設備，並於抽查","（驗）紀錄表簽認。","（五）抽查施工廠商放樣、施工基準測量及各項測量之成果。","（六）發現缺失時，應即通知廠商限期改善，並確認其改善成果。","（七）督導施工廠商執行工地安全衛生、交通維持及環境保護等工作。","（八）履約進度及履約估驗計價之審核。","（九）履約界面之協調及整合。","（十）契約變更之建議及協辦。","（十一）機電設備測試及試運轉之監督。","（十二）審查竣工圖表、工程結算明細表及契約所載其他結算資料。","（十三）驗收之協辦。","（十四）協辦履約爭議之處理。","（十五）依規定填報監造報表（參考格式如附表五）。","（十六）其他工程監造事宜。","前項各款得依工程之特性及實際需要，擇項訂之。如屬委託監","造者，應訂定於招標文件內。"]},{"no":"12","label":"第十二點","ch":"","cat":"p","lines":["機關辦理新臺幣一百五十萬元以上工程，應於工程及委託監造招標","文件內，分別訂定下列事項：","（一）鋼筋、混凝土、瀝青混凝土及其他適當檢驗或抽驗項目，應由符","合CNS 17025（ISO/IEC 17025）規定之實驗室辦理，並出具檢驗","或抽驗報告。","（二）前款檢驗或抽驗報告，應印有依標準法授權之實驗室認證機構之","認可標誌。","自辦監造者，應比照前項規定辦理。"]},{"no":"13","label":"第十三點","ch":"","cat":"p","lines":["機關辦理新臺幣一百五十萬元以上工程，應於相關採購案之招標文","件內，依工程規模及性質編列品管費用及材料設備抽（檢）驗費用","。","品管費用內得包含品管人員及行政管理費用。","品管費用之編列，以招標文件內品管人員設置規定為依據，其","訂有專職及人數等規定者，以人月量化編列為原則；未訂有專職及","人數等規定者，以百分比法編列為原則。","前項品管費用之編列方式如下：","（一）人月量化編列：品管費用＝〔（品管人員薪資 ×人數）＋行政管","理費〕 ×工期。品管人員薪資得包含經常性薪資及非經常性薪資","；工期以品管人員執行契約約定職務之工作期間計算。","（二）百分比法編列：發包施工費（直接工程費）之百分之零點六至百","分之二。","材料設備抽（檢）驗費用應單獨量化編列。廠商所需之檢驗費","用應於工程招標文件內編列。監造單位所需之抽驗費用，機關委託","監造者，應於委託監造招標文件內編列；設計及監造一併委託者或","自辦監造者，應於相關工程管理預算內編列。以上抽（檢）驗費用","如係機關自行支付，得免於招標文件內編列。","契約規定以外之查驗、測試、抽驗或檢驗，其結果不符合契約","規定者，由廠商負擔所生之費用；結果相符者，由機關負擔費用。","機關除另有規定外，應依工程規模及性質於相關採購案之招標","文件內訂定材料設備之抽（檢）驗、實驗室遴選及抽（檢）驗費用","支付等規定：","（一）廠商應依品質計畫，辦理相關材料設備之檢驗，由廠商自行取樣","、送驗及判定檢驗結果；如涉及契約約定之檢驗，應由廠商會同","監造單位取樣、送驗，並由廠商及監造單位依序判定檢驗結果，","以作為估驗及驗收之依據。","（二）監造單位得於監造計畫明訂材料設備抽驗頻率，由監造單位會同","廠商取樣、送驗，並由監造單位判定抽驗結果。","（三）實驗室遴選得由機關指定或由機關審查核定；抽（檢）驗費用得","由機關、廠商或監造單位支付，或機關以代收代付方式辦理。"]},{"no":"14","label":"第十四點","ch":"","cat":"p","lines":["機關於新臺幣一百五十萬元以上工程開工時，應將工程基本資料填","報於工程會指定之資訊網路系統，並應於填具結算驗收證明文件後","二十日內，將結算資料填報於前開系統。"]},{"no":"15","label":"第十五點","ch":"","cat":"p","lines":["機關應隨時督導工程施工情形，並留存紀錄備查。機關或其上級機","關另得視工程需要設置工程督導小組，隨時進行施工品質督導工作","。","機關發現工程缺失時，應即以書面通知監造單位或廠商限期改","善。"]},{"no":"16","label":"第十六點","ch":"","cat":"p","lines":["機關應依第四點及第十點規定，於工程及委託監造招標文件內，分","別訂定品管人員或監造單位受訓合格之現場人員有下列情事之一者","，由機關通知廠商限期更換並調離工地，並由機關填報於工程會資","訊網路系統備查：","（一）未實際於工地執行品管或監造工作。","（二）未能確實執行品管或監造工作。","（三）工程經工程施工查核小組查核列為丙等，可歸責於品管人員或監造","單位受訓合格現場人員。","（四）於進駐工地前一年內或執行業務期間，有因業務上相關之犯罪行為","，經判刑確定之情事。"]},{"no":"17","label":"第十七點","ch":"","cat":"p","lines":["廠商有施工品質不良、監造不實或其他違反本要點之情事，機關得","依契約規定暫停發放工程估驗款、扣（罰）款或為其他適當之處置","，並得依政府採購法第一百零一條至第一百零三條規定處理。"]},{"no":"18","label":"第十八點","ch":"","cat":"p","lines":["各機關得依本要點，另訂定有關之作業規定。","直轄市政府、縣（市）政府及鄉（鎮、市）公所辦理工程採購","，其施工品質管理作業，除法令另有規定外，得比照本要點之規定","辦理。"]}]},{"id":"GL000091","title":"公共工程施工品質管理制度","short":"施工品質管理制度","date":"民國114年06月27日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000091","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["前言","加強公共工程品質之管理，提升工程建設之品質、建立有效之品質管","理系統，實有必要性。為期使參與實際工程施工任務之所有成員，均","能體認工程品質之重要性，在施工過程中，即當以系統化之管理，有","效之管制步驟，注意施工品質，使完成之工程建設品質完善，達到規","範標準及要求。","針對國內工程品管過程之缺失，訂定施工品質管制系統、施工品","質查證系統、工程施工查核共三個層次之工程施工品質管理制度，其","架構如附圖。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["施工廠商負責之品質管制系統","為達成工程品質目標，應由施工廠商建立施工品質管制系統。於工程","開工前施工廠商應依工程之特性及合約要求，擬定施工計畫，製作施","工圖，訂定施工要領，提出品質計畫，設立品管組織，訂定各項工程","品質管理標準、材料與設備及施工檢驗程序、自主檢查表，以及建立","文件紀錄管理系統等，俾便各級施工人員熟習圖說規範及各項品管作","業規定，以落實品質管制。","（一）成立品管組織","施工廠商應設立專責之品管組織，選派適當之人員負責執行品質計","畫，準備各種品管表單，推動各項品管工作，以確保施工作業品質","符合規範要求。","（二）訂定施工要領","施工廠商應視工程需要於施工前對模板、鋼筋、混凝土、鋼骨、基","礎、砌造、塗裝等各項作業分別訂定其施工要領，說明工程概要、","品質要求、施工進度、材料機具之使用、施工步驟及安全措施等，","使施工人員充分瞭解各項作業之品質需求及施工方法，並能掌握工","作重點。","（三）訂定施工品質管理標準","施工廠商應建立模板、鋼筋、鋼骨、混凝土、基樁、連續壁、防水","等各項工程之品質管理標準，說明工程各階段中應納入管理之項目","與管理之標準，檢查之時期、方法及頻率，不合標準時之處置等，","作為執行品管工作時之準據，使工程能確實依照規範要求施作。","（四）訂定材料與設備及施工檢驗程序","施工廠商應依據契約對工程使用之鋼材、五金、門窗等各種材料及","混凝土等各項作業，訂定材料與設備及施工檢驗程序表，對其檢驗","適用範圍、檢驗方法、設備、時機及檢驗紀錄等加以規定，並由品","管人員負責各項檢驗程序的執行，以確保使用之材料及各個作業項","目均能符合品質要求。","（五）訂定自主檢查表","施工廠商應就鋼筋紮配、模板組立、鋼骨焊接、混凝土澆置、玻璃","安裝等各項作業，訂定自主檢查表，標明工程作業過程的重點及最","可能產生問題的地方，由工地現場工程師或領工按表逐項進行檢查","，俾能及早發覺施工之缺失並予矯正，而不致有所遺漏。","（六）建立文件紀錄管理系統","施工廠商應對工程契約規範、施工圖說、材料與設備及施工檢驗、","自主檢查紀錄等品質相關文件妥為保存，建立制度化管理系統，以","作為評估品管績效之準據。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["主辦機關、專案管理單位及監造單位負責之品質查證系統","為確保工程的施工成果能符合設計及規範之品質目標，主辦機關、專","案管理單位或監造單位應建立施工品質查證系統，成立監造組織，訂","定監造計畫，執行監督施工及材料與設備之抽查（驗）作業，並對抽","查（驗）結果留存紀錄，檢討成效及缺失，經由不斷的修正改善，達","成全面提升工程品質之目標。","（一）建立監造組織","監造單位應於現有之監造體系內，建立監造組織，訂定工作職掌，","以利施工品質查證工作之推展。","（二）訂定監造計畫","監造單位應視工程特性訂定監造計畫，其內容除包含施工計畫審查","作業程序、品質計畫審查作業程序外，並依工程性質類別訂定材料","與設備抽驗程序及標準、施工抽查程序及標準，作為品質查證工作","之準則，以確保施工品質。","（三）查證材料及設備","監造單位應依據材料與設備抽驗程序及標準規定，對施工廠商提出","之出廠證明、檢驗文件、試驗報告等之內容、規格及有效日期予以","查證，並進行現場之比對抽驗確認，期使進場之材料及設備能符合","契約規定，查證之結果應填具材料∕設備品質抽驗紀錄表，如有缺","失，應即通知施工廠商負責改善。","（四）查證施工作業","監造單位應根據施工抽查程序及施工抽查標準之規定對鋼筋組立、","鋼骨焊接、混凝土澆置等施工作業，按施工抽查標準表之內容，藉","目視檢查、量測等方式實施查證簽認之工作，以確認施工作業品質","符合規定，其查證結果應填具施工抽查紀錄表，並通知施工廠商改","善缺失。","（五）紀錄建檔保存","監造單位應對各類證明文件、試驗紀錄及施工抽查紀錄表，留存紀","錄建檔保存，除做為工程驗收之憑證外，亦可提供後續工程訂定監","造計畫之參考。"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["工程施工查核","為確認工程品質管理工作執行之成效，工程主管機關可採行工程施工","查核，以客觀超然的方式，依適當之查核基準，評定品質優劣等級。","查核結果可供作為主辦機關考評之依據，並可作為改進施工廠商品管","作業及評選優良廠商之參考，藉以督促主辦機關、監造單位及施工廠","商落實品質管理，達成提升工程品質的目標。","施工查核之作業方式重點說明如下：","（一）辦理公共工程施工查核，以任務編組方式設立工程施工查核小組，","選擇適當之查核對象，並參照工程施工查核作業參考基準實施查核","。","（二）施工查核之內容以主體工程之品質為主，並包含進度、安全衛生及","環境之管理績效。由查核人員依據查核參考基準，以客觀之方式對","工程品質及進度予以評分。","（三）查核作業係由查核人員自公共工程中選擇適當工程項目進行查核，","並以隨機抽樣方式選取檢查點，以目視檢查或簡易工具量測方式進","行，並查核品管紀錄資料，藉資評定工程品質之優劣及品管作業之","嚴謹性。","（四）依據施工查核成果，對負責承辦之主辦機關、監造單位及施工廠商","予以適當獎懲，以督促主辦機關、監造單位及施工廠商加強施工品","質管理，落實品管作業。"]},{"no":"5","label":"第五點","ch":"","cat":"p","lines":["結論","公共建設工程品質之水準可謂衡量國家開發程度之指標，隨有關單位","參考本制度所列各項作法並確實執行以來，我國公共建設工程品質之","水準已躋身已開發國家之林。為提升我國公共建設工程品質，各有關","單位應持續推動公共工程施工品管制度，實施工程施工查核，並參考","本制度所列各項作法，建立管理體系並確實執行，以改善品質管理，","提升工程品質。"]}]},{"id":"FL026637","title":"工程施工查核小組績效考核作業要點","short":"施工查核績效考核要點","date":"民國113年02月06日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL026637","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["行政院公共工程委員會（以下簡稱本會）為促使行政院所屬部會行處","院及直轄市、縣（市）政府工程施工查核小組（以下簡稱查核小組）","，確實依政府採購法定期查核所屬（轄）機關工程品質及進度等事宜","，有效發揮查核功能，特依工程施工查核小組作業辦法第十一條第二","項規定，訂定本要點。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["本會設工程施工查核小組績效考核會（以下簡稱績效考核會），辦理","查核小組年度績效考核成績評比相關事宜。","績效考核會置委員七名至九名，由本會主任委員就本會高階人員","或自本會所建置之工程施工查核委員專家名單中派（聘）兼之，其中","一人為召集人。","查核小組績效考核（以下簡稱績效考核）幕僚作業，由中央查核","小組（以下簡稱本小組）辦理。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["績效考核作業，依下列規定辦理：","（一）初評作業：","1.本小組於每年五月、八月、十一月及次年二月底前，依各查核小","組彙送本會備查之查核結果，進行審查。其配分以百分之二十五","為原則。","2.本小組每年針對各查核小組進行查證，並採書面查證方式辦理，","必要時得進行實地查證。其配分以百分之六十五為原則。","3.為維持查核運作基本功能及效益，各查核小組應依一般績效項目","，於提報考核期程最後一季季報表時，併檢附相關佐證資料一併","敘明。其配分以百分之十為原則。","4.前開各查核小組提報查核結果、書面查證、一般績效項目及其相","關佐證資料之方式，採電子化方式辦理，必要時得採紙本方式提","報。","（二）複評作業：","1.績效考核會應就本小組初評結果進行審議並評分後，決定績效考","核等第。","2.複評作業各項配分，必要時得由績效考核會調整之。","3.績效考核會開會時，得視實際情況邀請受考機關列席陳述意見。","審查評分表、查證評分表、一般績效評分表及複評績效考核評分","表，如附表一至附表四。"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["績效考核成績之評比，按各部會行處院及地方之查核小組分別辦理。","前項各部會行處院之查核小組分三級評比，依工程施工查核小組","作業辦法第四條規定計算之年度應查核總件數四十五件以上者，為第","一級；十件以上未達四十五件者，為第二級；未達十件者，為第三級","。"]},{"no":"5","label":"第五點","ch":"","cat":"p","lines":["績效考核成績之等第種類如下：","（一）第一級、第二級各部會行處院查核小組、直轄市及縣（市）政府查","核小組：年度考核成績分優、甲、乙、丙、丁等五級，考核分數達","九十分以上者為優等；八十分以上未滿九十分者為甲等；七十分以","上未滿八十分者為乙等；六十分以上未滿七十分者為丙等；未滿六","十分者為丁等。","（二）第三級各部會行處院查核小組：年度考核成績分優、甲、乙、丙、","丁等五級，考核分數達八十分以上者為優等；七十分以上未滿八十","分者為甲等；六十分以上未滿七十分者為乙等；五十分以上未滿六","十分者為丙等；未滿五十分者為丁等。"]},{"no":"6","label":"第六點","ch":"","cat":"p","lines":["本會應將績效考核成績函送受考查核小組設立機關，設立機關得就考","核等第，依建議獎懲標準，並考量其個別貢獻度、機關之獎度標準、","查核小組成員之敘獎之平衡性等，核實辦理受考查核小組相關人員（","召集人、執行秘書、查核委員具有在職公務員資格者及工作人員或其","他實際參與工程施工查核業務等人員）之獎懲。","除設立機關另有獎懲規定外，建議獎懲標準如下：","（一）年度績效考核成績列優等者，最高得記功二次。","（二）年度績效考核成績列甲等者，最高得記嘉獎二次。","（三）年度績效考核成績列乙等者，不予獎勵。","（四）年度績效考核成績列丙等者，最高得記申誡一次。","（五）年度績效考核成績列丁等者，最高得記過一次。"]}]},{"id":"FL037176","title":"工程施工查核小組處理查核缺失改善逾期案件規定","short":"查核缺失逾期處理規定","date":"民國105年06月13日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL037176","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["依據工程施工查核小組作業辦法第九條及第十條規定辦理。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["缺失改善逾期之認定基準：","（一）工程主管機關工程施工查核小組（以下簡稱查核小組）查核之案件","，其缺失改善是否逾期，以工程主辦機關回函日期為準。各部會行","處局署院查核小組查核補助工程之案件，得比照之。","（二）中央查核小組查核之案件，其缺失改善是否逾期，以工程主辦機關","回函工程主管機關查核小組日期為準，其缺失審查是否逾期，以工","程主管機關查核小組回函日期為準。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["缺失改善逾期之申請展延：","（一）工程主辦機關應督導廠商（含專案管理、監造及施工等廠商）限期","提送查核缺失之改善結果。","（二）工程主管機關查核小組查核之案件，應依下列規定辦理；各部會行","處局署院查核小組查核補助工程之案件，得比照之：","1.工程主辦機關經檢討查核缺失，無法於期限內全部改善完成時，","應於期限前先將已改善完成部分先行回復工程主管機關查核小組","，並就無法如期改善部分，敘明原因申請同意展延期限。","2.工程主管機關查核小組應就工程主辦機關所提缺失改善展延期限","申請，審查是否同意展延。其同意展延者，應函請工程主辦機關","限期提報缺失改善結果，改善期限最長以不逾三星期（日曆天）","為原則；不同意展延者，依原訂時限檢討改善逾期之責任歸屬。","（三）中央查核小組查核之案件，應依下列規定辦理：","1.工程主辦機關經檢討查核缺失改善，無法於期限內全部改善完成","者：","（1）應於期限前先將已改善完成部分，先行回復工程主管機關查核","小組核可後轉中央查核小組備查。另就無法如期改善部分，敘","明原因報經工程主管機關查核小組同意，轉報中央查核小組申","請展延期限。","（2）中央查核小組應就工程主辦機關所提缺失改善展延期限申請，","審查是否同意展延。其同意展延者，應函請工程主管機關查核","小組轉知工程主辦機關限期提報缺失改善結果，改善期限最長","以不逾三星期（日曆天）為原則；不同意展延者，依原訂時限","檢討改善逾期之責任歸屬。","2.受查核案件部分未完全改善，經工程主管機關查核小組退回澄清","或補件者：","（1）工程主管機關查核小組應函請工程主辦機關補正缺失改善結果","，並副知中央查核小組；該副知函應檢附工程主辦機關改善結","果原件一份，供中央查核小組審核。中央查核小組若認仍須再","補正時，應函請工程主辦機關一併改善，並副知工程主管機關","查核小組。","（2）工程主辦機關於收到工程主管機關查核小組或中央查核小組退","回或補正通知後，應即依工程施工查核小組作業辦法規定，直","接函請中央查核小組同意展延缺失改善期限並副知工程主管機","關查核小組。","（3）中央查核小組同意工程主辦機關展延缺失改善期限時，應考量","改善時間及工程主管機關查核小組審查、函轉等作業時間，自","工程主管機關查核小組發函澄清或補件起合計以不逾三星期（","日曆天）為原則。"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["缺失改善逾期之處置：","（一）廠商缺失改善逾期，工程主辦機關應於一星期內（日曆天）依工程","施工查核小組作業辦法第十條第四項及契約規定，依責任歸屬對廠","商及相關人員予以適當處置，並副知辦理該次查核之查核小組。如","屬中央查核小組查核之案件，工程主辦機關應同時副知工程主管機","關查核小組；各部會行處局署院查核小組查核補助工程之案件，得","比照之。","（二）廠商缺失改善逾期提報，工程主辦機關未檢討責任者，查核小組應","依工程施工查核小組作業辦法第十條第五項規定辦理，並於二星期","內（日曆天）發函稽催。","（三）工程主辦機關應將查核缺失，列為工程驗收項目之參考，並得依契","約規定暫停發放估驗款或依約定之罰則辦理。","（四）工程主辦機關對缺失改善逾期之處置結果，應函請工程主管機關查","核小組備查，並上網登錄。","（五）中央查核小組查核之案件，工程主辦機關應先函請工程主管機關查","核小組審查後轉中央查核小組備查；中央查核小組就其查核之案件","函請工程主管機關查核小組轉工程主辦機關辦理。"]},{"no":"5","label":"第五點","ch":"","cat":"p","lines":["其他注意事項：","（一）缺失改善逾期之展期、補正改善結果及檢討責任時間，各以不逾三","星期（日曆天）為原則。","（二）查核小組對缺失改善逾期及責任檢討，得分別處理。缺失如已改善","完成，得准予先行結案，責任檢討部分則另案列管追蹤。","（三）查核小組處理缺失改善相關事宜，應考量內部文書作業期程，以免","逾期。"]}]},{"id":"FL024579","title":"因應國內鋼筋價格變動之物價調整處理原則","short":"鋼筋價格變動處理原則","date":"民國92年04月30日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL024579","articles":[{"no":"1","label":"壹、","ch":"","cat":"p","lines":["壹、處理措施","一、機關辦理查核金額以上之在建工程，因近期國內鋼筋價格劇烈變動，","廠商要求就鋼筋材料協議調整工程款者，機關得參考本處理原則，依","行政院主計處公布之台灣地區營造工程物價指數表材料類內之「金屬","製品類指數」 (以下簡稱金屬指數) 辦理物價調整 (含增加或扣減應","給付之契約價金) ，惟應先辦理契約變更，加列物價指數調整相關規","定；其屬增加契約價金者，應先考量機關經費支應能力。","二、機關依前點辦理契約變更，應參考採購契約要項第三十九點規定，並","載明下列事項：","(一) 未完成契約變更前已辦理估驗之工程款是否適用契約變更後加列之","物價指數調整規定。屬適用者，應載明其得追溯之期間，並得規定","溯及於九十一年六月一日。","(二) 逾履約期限之部分，如估驗當期金屬指數較契約規定履約期限當月","金屬指數為低者，應以估驗當期為調整依據。但逾期履約係可歸責","於機關者，不在此限。","(三) 鋼筋材料價款不得再以其他物價指數重複進行調整。","三、機關辦理未達查核金額之在建工程，因國內鋼筋價格劇烈變動而需就","鋼筋材料協議調整工程款者，準用本處理原則。","四、機關辦理在建工程，因國內鋼筋以外之金屬製品價格劇烈變動而需就","該等金屬製品協議調整工程款者，準用本處理原則。","五、各直轄市政府得依該府主計處調查公布之物價指數辦理物價調整。","六、機關依本處理原則辦理物價調整所增加之經費，應在工程標餘款或各","該計畫奉核定預算內勻支。"]},{"no":"2","label":"貳、","ch":"","cat":"p","lines":["貳、調整方式","一、當期估驗日與前一期估驗日之中間日當月金屬指數比較開標當月金屬","指數，其指數增減率之絕對值超過百分之五者，就漲跌幅超過百分之","五部分，於估驗完成後就估驗款中之鋼筋材料金額調整工程款 (百分","之五以內之部分不調整) ；指數增減率之絕對值在百分之五以內者，","不予調整。","指數增減率＝ (Ｂ／Ｃ－１) ×100 ％","其中  Ｂ＝當期估驗日與前一期估驗日之中間日當月金屬指數。 (1.","估驗日係指估驗內容之最後施工日；2.中間日有兩日者，","以日期較晚者為中間日；3.第一期估驗，以當期估驗日與","開工日之中間日認定之)","Ｃ＝開標當月金屬指數。但就契約新增單價項目之工程款，為","該項目議價完成日當月金屬指數。","指數增減率以計算至小數點以下第三位 (第四位四捨五入) 為原則。","二、依前項調整工程款時，每期估驗計價金額中含有鋼筋料之各工作項目","均以下列公式計算調整金額 (計算至元，元以下四捨五入) ：","Ａ× (１－Ｅ) ×Ｄ× (指數增減率之絕對值－ 5％) ×F","其中  Ａ＝該工作項目之當期工程估驗款。","Ｄ＝鋼筋價權重","＝工程預算書所列該工作項目每單位所含鋼筋材料 (不含任","何其他費用) 總價／工程預算書所列該工作項目每單位之","價格","Ｅ＝已付預付款佔契約總價之百分比","Ｆ＝ (1+營業稅率) 。營業稅率應核實計之。","三、指數增減率為正值者，就上開調整金額之合計金額給予補償﹔指數增","減率為負值者，就上開調整金額之合計金額自估驗款中扣減。","四、管理費、保險費、利潤及其他稅雜費 (不包括營業稅) 不予調整。"]},{"no":"3","label":"參、","ch":"","cat":"p","lines":["參、範例","某標工程已知條件 (所用數值為假設值)","一、開標 (90  年 8  月 8  日) 當月之台灣地區營造工程物價指數表 5","-1  內材料類之「金屬製品類指數」為 98.24。","二、92  年 3  月 5  日辦理估驗請款，當期估驗內容之最後施工日為同","年 3  月 2  日，且前一期估驗內容之最後施工日為同年 2  月 2","日，則當期估驗日與前一期估驗日之中間日為同年 2  月 16 日，查","92  年 2  月份當月之台灣地區營造工程物價指數表 5-1  內材料類","之「金屬製品類指數」為 129.67 。","三、機關已付預付款為契約總價之百分之 30 ％。","四、假設 92 年 2  月辦理估驗之工程款為 15,000,000 元，其中含鋼筋","料工作項目預鑄蓋版估驗款為 1,000,000  元﹔預壘樁估驗款為 3,0","00,000  元。鋼筋價各佔該工作項目之權重分別為 30.65  ％、19.0","6 ％ (計算方式詳附表) 。","則各工作項目鋼筋料價之物價調整計算如下：","1 指數增減率＝ (129.67/98.24-1) ×100 ％＝32.0％","2 預鑄蓋版","Ａ× (１－Ｅ) ×Ｄ× (指數增減率之絕對值－5 ％) ×F","＝1,000,000x(1-0.3)x0.3065x(0.320-0.05)x1.05=60,825 元","3 預壘樁","Ａ×(１－Ｅ)×Ｄ× (指數增減率之絕對值－5 ％) ×F","＝3,000,000x(1-0.3)x0.1906x(0.320-0.05)x1.05=113,474  元","4 當期估驗就鋼筋料價之物價調整金額為補償","60,825元＋113,474 元＝174,299 元"]}]},{"id":"GL000026","title":"公共工程開工要件注意事項","short":"開工要件注意事項","date":"民國112年03月24日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000026","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["行政院公共工程委員會為使公共工程計畫順利推展，避免發生開工後","即停工、終止或解除契約情形，期能有效執行政府預算並維護廠商權","益，特訂定本注意事項。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["政府機關、公立學校及公營事業（以下簡稱機關）辦理公共工程開工","條件檢核，除依法令完成相關事項外，應依本注意事項辦理。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["本注意事項所稱公共工程，指單一標案預算金額達新臺幣一百五十萬","元以上之工程。","機關辦理未達新臺幣一百五十萬元之工程，得比照本注意事項規","定辦理。","搶修、搶險工程、以開口契約或統包方式辦理之工程不適用本注","意事項，其執行過程得參照第四點附件一所列項目自行檢討。"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["機關辦理公共工程，應自規劃設計階段即預先檢討「公共工程開工管","制條件機關應辦事項檢核表」（以下簡稱機關應辦事項檢核表，格式","如附件一）所列項目，妥善排定作業時程，並於招標前確實辦理完成","並檢核。"]},{"no":"5","label":"第五點","ch":"","cat":"p","lines":["機關辦理公共工程招標前，應查填機關應辦事項檢核表，並經機關首","長或其授權人員核定，檢核作業流程如附件二。"]},{"no":"6","label":"第六點","ch":"","cat":"p","lines":["機關應辦事項檢核表如全部項目檢核結果為「無需辦理」或「已完成","」，機關可續行辦理招標工作；如有項目檢核結果為「未完成」，除","有個案特殊情形報經上級機關同意後始得進行招標外，應於完成後始","得招標。","前項所定報經上級機關同意後始得進行招標，上級機關得衡酌機","關作業能力及執行效率，授權機關自行辦理。"]}]},{"id":"GL000045","title":"預付款還款保證連帶保證書格式;預付款還款保證金不可撤銷擔保信用狀格式;預付款還款保證擔保信用狀格式;預付款還款保證連帶保證保險單條款","short":"預付款還款保證格式","date":"民國107年01月16日","kind":"令函釋示","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000045","articles":[{"no":"1","label":"全文","ch":"","cat":"p","lines":["行政院公共工程委員會令","發文日期：中華民國107年1月16日","發文字號：工程企字第10700012340號","修正「預付款還款保證連帶保證書格式」、「預付款還款保證金不可撤銷","擔保信用狀格式」、「預付款還款保證擔保信用狀格式」及「預付","款還款保證連帶保證保險單條款」，並自即日生效。","附修正「預付款還款保證連帶保證書格式」、「預付款還款保證金不可","撤銷擔保信用狀格式」、「預付款還款保證擔保信用狀格式」及「","預付款還款保證連帶保證保險單條款」","主任委員 吳澤成",":::","行政院公共工程委員會：11010臺北市信義區松仁路3號9樓","電話總機：","02-87897500","傳真電話：02-87897800","系統版本：114.11.28","系統更新日期：115.01.06","瀏覽人數：21,648,504","回上方","$(function () {","ChangeFunUrl();","$(window).resize(function () {","ChangeFunUrl();","});","});","function ChangeFunUrl() {","//功能頁面切換：依據頁面寬度切換功能","if ($(window).width() = 0xFF01 && charCode = 0xFFE0 && charCode","$(document).ready(function () {","$(document).on(\"keydown\", function (e) {","if (e.key === \"Enter\") {","var active = document.activeElement;","console.log(\"目前焦點元素：\", active.id);","if (active && active.id === \"keyword1\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm1();","e.preventDefault(); // 阻止預設送出表單","return false;","}","if (active && active.id === \"keyword2\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm2();","e.preventDefault(); // 阻止預設送出表單","return false;","}","}","});","});"]}]},{"id":"FL039842","title":"機關提報巨額採購使用情形及效益分析作業規定","short":"巨額採購效益分析規定","date":"民國100年06月29日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL039842","articles":[{"no":"1","label":"第一點","ch":"","cat":"z","lines":["機關依政府採購法（以下簡稱本法）第一百十一條逐年向主管機關提","報巨額採購之使用情形及其效益分析，應依本規定辦理。"]},{"no":"2","label":"第二點","ch":"","cat":"z","lines":["機關辦理巨額採購前，應就下列事項簽經機關首長或其授權人員核准","。其須經上級機關或目的事業主管機關核准者，從其規定：","（一）完成採購後之預期使用情形及其效益目標。","（二）評估使用情形及其效益之分析指標。如使用人數或次數、使用頻率","、工作人力、工作成果、產量、產能、投資報酬或收益、節省能源","數量、減少溫室氣體排放數量、減少消耗資源數量。","（三）預計採購期程、開始使用日期及使用年限。","機關對於前項預期使用情形及其效益，於完成採購前有調整必要或明","顯不符合預期者，應即檢討原因、責任歸屬並採行相關配套措施，重","行簽報核准。完成採購後，亦同。"]},{"no":"3","label":"第三點","ch":"","cat":"z","lines":["機關提報巨額採購之使用情形及其效益分析，應包括下列事項：","（一）採購案號、採購標的摘要、採購性質歸屬、預算金額、決標日期、","決標金額、結算金額、完成履約廠商名稱及地址、原規劃及實際啟","用日期、使用年限、機密等級及其理由。","（二）屬重要經建投資計畫、重要行政計畫、重要社會發展計畫或重大科","技計畫者，其計畫編號及名稱。","（三）提報使用期間起迄日期及提報次數。","（四）原規劃、設計或需求所欲達成之預期使用情形及其效益。有調整者","，其經過及內容。","（五）使用期間內之實際使用情形及其效益。","（六）實際使用情形及其效益與原規劃、設計或需求所欲達成者之比較及","差異原因。","（七）未依原規劃日期啟用之原因。","（八）結算金額與決標金額差異之原因。","（九）屬第二次提報者，與前一次使用情形及其效益分析之比較及差異分","析。屬第三次以後提報者，與前二次使用情形及其效益分析之比較","及差異分析。","（十）綜合說明與檢討。","（十一）其他經主管機關指定者。","前項提報，以由使用或接管單位提報為原則。但機關另有分工規定者","，從其規定。共同供應契約之採購，由訂約機關彙總提報；其因適用","機關眾多難以全面調查其使用情形及效益者，得以抽樣方式為之。"]},{"no":"4","label":"第四點","ch":"","cat":"z","lines":["前點提報，應自啟用每屆滿一年之次日起三個月內逐年為之。但驗收","後因故逾一年仍未啟用者，自驗收後每屆滿一年之次日起一個月內逐","年提報未啟用之原因。","前項提報涉及年度營業收入、淨盈虧計算者，得按年度提報。 　　勞務採購之使用期間為其契約約定之履約期間，除工作內容重複者外","，以契約工作完成後一次提報為原則。　　採購標的為土地，並於其上興建建築物或構造物，且已依計畫完成興","建者，得與建築物或構造物合併提報。　　第一項提報，於履約期間有終止契約或解除契約，或使用期間標的物","已滅失、不堪使用等情形者，得敘明理由後免提報或停止提報。"]},{"no":"5","label":"第五點","ch":"","cat":"z","lines":["第三點第一項第五款使用情形及其效益，機關應依採購案件之特性，","就下列資料擇定相關者詳實提報，並以量化方式輔助說明：","（一）屬工程或財物採購者：使用功效、使用人數或次數、交通流量、使","用頻率、產量、產能、閒置、中斷使用或停止使用情形、瑕疵、故","障、違約或發生事故情形、使用者滿意程度、維修情形、維修費用","、投資報酬、收益、虧損、節省費用、節省能源數量、減少溫室氣","體排放數量、減少消耗資源數量等。","（二）屬勞務採購者：使用功效、使用人數或次數、使用頻率、工作人力","、工作成果、閒置、中斷使用或停止使用情形、瑕疵、違約或發生","事故情形、使用者滿意程度、投資報酬、收益、虧損、節省費用、","節省能源數量、減少溫室氣體排放數量、減少消耗資源數量等。"]},{"no":"6","label":"第六點","ch":"","cat":"z","lines":["分批採購合併使用者，以合併提報使用情形及其效益分析為原則。","採部分驗收部分先行使用者，其啟用日期以該先行使用部分之啟用日","期為準。","採購標的之使用期間未逾一年者，於期間屆滿後提報使用情形及其效","益分析。使用期間未達二年者，得於期間截止後一次提報。","分屬不同年度預算而分期採購合併使用者，適用前三項規定。"]},{"no":"7","label":"第七點","ch":"","cat":"z","lines":["機關辦理採購之標的係與其他採購之標的混合、附合或合併製造成品","或提供服務，單獨提報使用情形及其效益分析有困難者，得彙總提報","。","前項採購為轉售或贈與民間機構使用，轉售或贈與前未使用者，不適","用本規定。轉售或贈與前未經製造程序者，亦同。"]},{"no":"8","label":"第八點","ch":"","cat":"z","lines":["機關向主管機關提報巨額採購之使用情形及其效益分析，得以電子化","方式為之，免另備書面文件通知主管機關，其辦理程序如下：","（一）備具使用情形及其效益分析後，連線至主管機關政府電子採購網","http://web.pcc.gov.tw，輸入機關使用代碼及密碼後，進入「採","購輔助/巨額效益/效益評估提報/進入效益評估提報功能」網頁。","（二）依網頁指示輸入相關資料後，傳送主管機關。","（三）採購標的已按原核定內容持續正常使用而無閒置、低度使用、虧損","情形，且使用情形及其效益與前次提報相較，並無明顯差異或異常","情形者，得就前次提報資料摘要補充說明後傳送。"]}]},{"id":"FL041711","title":"行政院公共工程委員會政府採購諮詢小組設置要點","short":"政府採購諮詢小組要點","date":"民國114年05月13日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL041711","articles":[{"no":"1","label":"第一點","ch":"","cat":"z","lines":["行政院公共工程委員會（以下簡稱本會）為協助解決廠商與機關間因","政府採購契約條款認知歧異之問題，加速推動公共建設及增進採購效","率，特設政府採購諮詢小組（以下簡稱本小組）。"]},{"no":"2","label":"第二點","ch":"","cat":"z","lines":["廠商與機關間依政府採購法辦理之採購，於履約階段因契約條款之認","知產生歧異，經雙方協調未能達成協議，有立即解決需要者，得以書","面向本小組申請諮詢。但不包括已向採購申訴審議委員會申請調解者","。","前項以外之履約爭議或涉違反契約約定情事者，依法令既定之程","序處理。"]},{"no":"3","label":"第三點","ch":"","cat":"z","lines":["本小組置召集人一人，由本會副主任委員兼任，綜理組務；置執行秘","書一人，由本會企劃處處長兼任，協助處理組務；置小組成員若干人","，由本會指派適當人員兼任。"]},{"no":"4","label":"第四點","ch":"","cat":"z","lines":["申請諮詢應具申請書，載明下列事項，並副知他造當事人（以下簡稱","當事人）：","（一）申請人名稱、地址、電話。","（二）當事人之名稱。","（三）標的案號及名稱。","（四）請求諮詢之事項、標的之法律關係與相關事實情節。","（五）其他相關文件。","前項申請書格式如附件。"]},{"no":"5","label":"第五點","ch":"","cat":"z","lines":["本小組收受申請書後，得通知當事人提出相關文件，以利諮詢會議之","進行。"]},{"no":"6","label":"第六點","ch":"","cat":"z","lines":["本小組為處理諮詢事項，得通知申請人及當事人召開諮詢會議，並作","出建議。但案情單純者，得僅就書面資料為之。"]},{"no":"7","label":"第七點","ch":"","cat":"z","lines":["本小組作成之建議，原則上以書面為之，通知各有關單位，並得以列","管。"]},{"no":"8","label":"第八點","ch":"","cat":"z","lines":["本小組開會時，得邀請專家、學者、與諮詢事項有關之中央目的事業","主管機關列席。"]},{"no":"9","label":"第九點","ch":"","cat":"z","lines":["本小組對外行文，以本會名義行之。"]},{"no":"10","label":"第十點","ch":"","cat":"z","lines":["本小組召集人、執行秘書及本會指派之其他成員均為無給職。"]}]},{"id":"GL000025","title":"機關獎勵優良採購人員實施要點","short":"獎勵優良採購人員要點","date":"民國109年06月09日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000025","articles":[{"no":"1","label":"第一點","ch":"","cat":"z","lines":["為利政府機關、公立學校及公營事業（以下簡稱機關）就其採購人員","辦理採購業務成效優良者（以下簡稱優良採購人員）予以獎勵，以激","勵採購人員士氣，特訂定本要點。"]},{"no":"2","label":"第二點","ch":"","cat":"z","lines":["獎勵對象：機關現職承辦採購人員，包括訂定招標文件、招標、開標","、審標、比價、議價、決標、訂約、履約管理、驗收或爭議處理之人","員，包含其主管，對於依政府採購法辦理採購著有貢獻，足堪獎勵者","。"]},{"no":"3","label":"第三點","ch":"","cat":"z","lines":["本要點之評審及獎勵作業，由機關視實際需要辦理。"]},{"no":"4","label":"第四點","ch":"","cat":"z","lines":["優良採購人員條件及資格：","（一）有下列情形之一，且有具體個案事證並具採購成效者，得列為優良","採購人員：","1.承辦採購業務公正專業嚴謹，兼顧採購效率、功能及品質。","2.妥善運用採購策略，包含採用電子化採購、協商措施、全生命週","期採購策略、循環經濟措施或新科技新工法等情形。","3.採購標的符合使用效益，包含符合預期或更佳、服務人民、促進","經濟發展、提高行政效能、解決社會問題、推動重大政策或促進","公共利益等情形。","4.提出採購興革意見或有積極作為，致有節省公帑、發揮預算支用","價值等情形。","5.採購程序或履約管理作業，其實際執行進度較預定期程超前。","6.達成目的事業主管機關規定之採購目標，包含節能減碳措施、採","購環境保護產品、採購身心障礙福利機構、團體或庇護工場之產","品或勞務等情形。","7.妥適處理遭遇之採購問題，未經採購申訴審議委員會審議判斷書","指明違反採購程序，或經採購稽核小組稽核監督結果無重大違失","。","8.其他經機關認定戮力辦理採購作業具有成效。","（二）有下列情形之一者，不得列為優良採購人員：","1.最近二年內有採購人員倫理準則第七條所列各款情形之一。","2.最近二年內辦理採購業務有明顯疏失，對機關或廠商造成損害。","3.辦理採購業務涉嫌不法，於調查、偵查中或已經起訴，或已受處","分、有罪判決或緩起訴處分確定。","4.其他經機關認定之不適宜情形。"]},{"no":"5","label":"第五點","ch":"","cat":"z","lines":["評審：為獎勵優良採購人員，機關成立評審會，負責評審工作。其評","審規定如下：","（一）評審組織：","1.評審會置委員五人以上，由機關人員或其他公正人士兼任。","2.評審會置召集人一人，由機關首長或其授權人員指定委員擔任，","或由委員互選產生之；召集人由機關內部人員擔任者，應由一級","主管以上人員任之。","3.評審委員有下列情形之一者，應行迴避：","（1）本人、配偶、二親等以內血親或姻親為受評人。","（2）本人或機關認其有不能公正執行職務之虞。","（二）評審方式：進行書面評審，必要時得通知受評人說明。","（三）評審作業程序：","1.評審會召開評審會議，就評審資料進行綜合評審，擇優審定優良","採購人員。","2.評審會議應有委員總額三分之二以上出席，其決議應經出席委員","過半數之同意行之。","（四）評審結果：評審會議結束後，於機關網站公布優良採購人員名單。"]},{"no":"6","label":"第六點","ch":"","cat":"z","lines":["獎勵方式：優良採購人員之任職機關，依其貢獻度及相關規定辦理敘","獎並優予考績。敘獎額度以記一大功為上限。"]},{"no":"7","label":"第七點","ch":"","cat":"z","lines":["其他：","（一）評審委員應公正行使職權，不得有下列之情形：","1.接受不當饋贈或招待。","2.藉評審之便，蒐集與評審無關之資訊或資料，或為其他不當之要","求。","3.洩漏因評審所獲應保密之資訊或資料。","4.未經召集人或評審會會議決定，自行辦理評審。","5.有不能公正執行職務之情事。","（二）其他未盡事宜，機關得視需要自行訂定相關作業規定。"]},{"no":"8","label":"第八點","ch":"","cat":"z","lines":["政府採購法主管機關得就具有特殊事蹟之優良採購人員辦理獎勵，其","評審作業得準用本要點規定。"]}]},{"id":"FL029468","title":"採購稽核小組績效考核作業要點","short":"稽核小組績效考核要點","date":"民國105年04月28日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL029468","articles":[{"no":"1","label":"第一點","ch":"","cat":"z","lines":["行政院公共工程委員會（以下簡稱主管機關）為促使行政院所屬部會","署及直轄市、縣市政府所設立採購稽核小組（以下簡稱部會署及地方","採購稽核小組）確實依政府採購法（以下簡稱本法）稽核監督採購事","宜，有效發揮採購稽核功能，特訂定本要點。"]},{"no":"2","label":"第二點","ch":"","cat":"z","lines":["採購稽核績效考核由主管機關逐年辦理，受考機關為部會署及地方採","購稽核小組；考核期程為每年一月一日起至十二月三十一日止。"]},{"no":"3","label":"第三點","ch":"","cat":"z","lines":["部會署及地方採購稽核小組應依採購稽核小組組織準則第四條第二項","規定，將每月稽核報表向主管機關彙報，以供考核。","前項彙報應於次月十五日前，利用主管機關建置之資訊系統，以","電子化方式傳輸至主管機關指定之電腦資料庫，且定期更新稽核案件","辦理情形。"]},{"no":"4","label":"第四點","ch":"","cat":"z","lines":["主管機關為辦理採購稽核績效考核，得指定中央採購稽核小組適當人","員數人組成績效考核專案小組，依據考核項目與部會署及地方採購稽","核小組彙送指定受考案件之相關書面資料，逐案討論後，依評分標準","核實評分，連同初評意見，提報中央採購稽核小組召集人核定，或送","交中央採購稽核小組稽核委員會議審定。","前項指定受考案件，指下列經主管機關於每年三月下旬後，以書","面通知受考機關限期彙送之文件：","（一）各受考機關上一年度依第三點規定按月彙報之案件，經主管機關抽","樣選取之專案稽核及書面稽核案之相關文件影本。","（二）監察、審計、檢察、調查機關及主管機關移案辦理之案件，其辦理","情形彙總表；或於必要時，通知併提供之相關文件影本。","（三）前項彙送文件未達規定數量者，相關考核項目或其分項，按實際送","達案件數比率給分；未依限送達或未依式彙送者，得視其情形，酌","予扣分。","為應考核需要，得洽請受考機關前來說明或以書面提出補充意見","，必要時，並得由中央採購稽核小組召集人指派稽核委員數人，率稽","查人員或工作人員數人，前往指定之受考機關實地查證。","考核項目配分及評分標準表，如附表。"]},{"no":"5","label":"第五點","ch":"","cat":"z","lines":["採購稽核績效考核成績之評比，按各部會署及地方之採購稽核小組分","別辦理。"]},{"no":"6","label":"第六點","ch":"","cat":"z","lines":["採購稽核績效考核成績分優、甲、乙、丙、丁等五級，考核分數達九","十分以上者為優等；八十分以上未滿九十分者為甲等；七十分以上未","滿八十分者為乙等；六十分以上未滿七十分者為丙等；未滿六十分者","為丁等。"]},{"no":"7","label":"第七點","ch":"","cat":"z","lines":["主管機關應將績效考核成績函送受考機關，受考機關得依建議敘獎標","準，考核等第或精進情形，考量稽核小組個別成員貢獻度及敘獎之平","衡性，核實辦理受考採購稽核小組相關成員（召集人、副召集人、執","行秘書及派兼稽核委員、稽查人員或其他實際參與採購稽核業務等人","員）之敘獎。如當年度因故未及完成敘獎程序者，得延至下一年度辦","理。","建議敘獎標準如下：","（一）考核成績列優等者，最高得記功二次。","（二）考核成績列甲等者，最高得記功一次。","考核成績列丙等或丁等之受考機關，應於接獲績效考核成績一個","月內，研提具體改善措施，函送主管機關備查。"]}]},{"id":"FL039840","title":"行政院公共工程委員會重大採購事件效益評估作業要點","short":"重大採購效益評估要點","date":"民國92年12月23日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL039840","articles":[{"no":"1","label":"第一點","ch":"","cat":"z","lines":["行政院公共工程委員會（以下簡稱本會）為落實政府採購法（以下簡","稱本法）第一百十一條第二項重大採購事件之效益評估，特訂定本要","點。"]},{"no":"2","label":"第二點","ch":"","cat":"z","lines":["本會對於機關提報使用情形及效益分析之巨額採購，其符合下列情形","之一者，得簽請一級主管以上人員核定後，列為重大採購事件：","（一）採購金額在下列金額以上，且非屬招標期限標準第十條第二款至第","四款所定採購者：","1.工程採購二十億元。","2.財物採購十億元。","3.勞務採購一億元。","（二）與國家重大政策或民生福利有密切關係者。","（三）機關提報使用情形及其效益分析顯示效益明顯不符合預期者。","（四）其他有列為重大採購事件之必要者。","符合前項第一款及第二款情形之採購，機關提報使用情形及其效","益分析正常者，得不列為重大採購事件。","本會已作出效益評估之重大採購事件，得免重複列為重大採購事","件。"]},{"no":"3","label":"第三點","ch":"","cat":"z","lines":["本會對於重大採購事件，應於接獲機關提報巨額採購之使用情形及其","效益分析後四個月內作出效益評估，必要時得視個案情形延長之。"]},{"no":"4","label":"第四點","ch":"","cat":"z","lines":["重大採購事件經本會作出效益評估後，除應秘密者外，應刊登於政府","採購公報，並函送審計機關、提報機關及其上級機關。","前項評估結果，效益明顯不符合預期者，應通知提報機關檢討原","因、責任歸屬及採行改善措施，並予列管。"]},{"no":"5","label":"第五點","ch":"","cat":"z","lines":["本會辦理重大採購事件效益評估，得就機關提報之資料書面為之。必","要時得視個案情形組成評估小組（以下簡稱本小組）實地為之，或通","知機關至本會專案報告。"]},{"no":"6","label":"第六點","ch":"","cat":"z","lines":["本小組置組員三人至七人，就具有與採購案相關專門知識之本會人員","或專家、學者派兼或聘兼之。其中外聘專家、學者人數至少一人。","本小組置召集人一人，由本會一級主管以上人員指定組員擔任。"]},{"no":"7","label":"第七點","ch":"","cat":"z","lines":["本小組組員之遴選及外聘專家、學者得給付之費用、辭職、解聘，準","用採購評選委員會組織準則第四條至第五條、採購評選委員會審議規","則第十四條之規定。"]},{"no":"8","label":"第八點","ch":"","cat":"z","lines":["重大採購事件經本會評估為效益卓著者，本會得函請機關就有功人員","予以獎勵。"]},{"no":"9","label":"第九點","ch":"","cat":"z","lines":["本會依本法第一百十一條第一項規定派員查核機關提報使用情形及其","效益分析，其非屬重大採購事件者，得準用本作業要點之規定。"]}]},{"id":"ERRPAT","title":"政府採購錯誤行為態樣","short":"錯誤行為態樣","date":"民國113年12月05日","kind":"函頒","multi":true,"url":"https://planpe.pcc.gov.tw/prms/explainLetter/readPrmsExplainLetterContentDetail?pkPrmsRuleContent=75003100","articles":[{"no":"1-0","label":"作業指引","ch":"一、準備招標文件","cat":"b","xc":[],"lines":["機關準備招標文件，應包括投標廠商提交投標書所需之一切必要資料（政府採購法〈下稱採購法〉第29條第3項），並注意不得有招標文件資料錯誤（例如：數量或數據有誤；前後矛盾；引用過時或失效之資料）之情形；採購契約以採用行政院公共工程委員會（以下簡稱工程會）訂定之範本為原則（採購法第63條第1項）；採評選（評審）方式辦理者，應依最有利標評選辦法規定訂定評選（評審）項目及其配分或權重；採購金額應依採購法施行細則（以下簡稱施行細則）第6條規定計算；屬巨額採購者，招標前應簽准預期使用情形、效益目標及效益分析指標、預計採購期程、開始使用日期及使用年限（機關提報巨額採購使用情形及效益分析作業規定第2點）；屬巨額工程採購者，應成立採購工作及審查小組，協助審查採購需求與經費、採購策略及招標文件等事項（採購法第11條之1）。"]},{"no":"1-1","label":"一（一）","ch":"一、準備招標文件","cat":"b","lines":["漏記法規要求應載明於招標文件之文字，例如：漏記採購法第63條第2項、第70條第1項、第70條之1第2項、施行細則第38條等應於招標文件載明之規定。","【相關法令及函釋】採購法第63條、第70條第1項、第70條之1第2項，施行細則第38條。"]},{"no":"1-2","label":"一（二）","ch":"一、準備招標文件","cat":"b","lines":["曲解法規規定，例如：曲解採購法第58條之執行程序，於招標文件中規定，廠商未繳交差額保證金者，其所繳納之押標金不予發還。","【相關法令及函釋】採購法第58條。"]},{"no":"1-3","label":"一（三）","ch":"一、準備招標文件","cat":"b","lines":["違反法規規定，例如：對於機關之決定不得異議。","【相關法令及函釋】採購法第74條、第75條。"]},{"no":"1-4","label":"一（四）","ch":"一、準備招標文件","cat":"b","lines":["不當增列法規所無之規定，例如於招標文件規定廠商之投標文件有下列情形之一者，為不合格標：標封封口未蓋騎縫章；投標文件未逐頁蓋章；投標文件之編排、字體大小、裝訂方式、正副本標示或份數與招標文件規定不符；投標文件未檢附願繳納差額保證金之切結書；投標文件之頁數或紙張大小與招標文件規定不符；不分段開標之投標文件未依招標文件規定分置資格、規格或價格標封；投標文件未使用機關提供之封套。","【相關法令及函釋】工程會96年5月8日工程企字第09600182560號令、97年2月15日工程企字第09700061010號令。"]},{"no":"1-5","label":"一（五）","ch":"一、準備招標文件","cat":"b","lines":["招標文件中之履約條款違反公平合理原則，例如：履約期限過短；逾期違約金過高。","【相關法令及函釋】採購法第6條。"]},{"no":"1-6","label":"一（六）","ch":"一、準備招標文件","cat":"b","lines":["意圖規避法規之適用而將案件化整為零招標，例如：辦理採購案時，已知後續有類案採購且有預算，並無得分別辦理之法令依據，而違法分批辦理。","【相關法令及函釋】採購法第14條，施行細則第13條，中央機關未達公告金額採購招標辦法第6條，工程會113年5月7日工程企字第11200138971號函訂定「機關辦理小額採購作業指引」之參、一。"]},{"no":"1-7","label":"一（七）","ch":"一、準備招標文件","cat":"b","lines":["認定採購金額之方式錯誤，例如：分批辦理採購，未依各批合計總金額認定其採購金額；未將含有選購或後續擴充項目金額計入；廠商報價金額包括機關支出及收入金額者，逕以收支相抵認定採購金額，而未以支出所需金額認定。","【相關法令及函釋】施行細則第6條。"]},{"no":"1-8","label":"一（八）","ch":"一、準備招標文件","cat":"b","lines":["不當限制競爭，例如：限廠商代表於開標當時必須攜帶與投標文件所用相同之印鑑，否則無權出席。","【相關法令及函釋】採購法第6條、第37條。"]},{"no":"1-9","label":"一（九）","ch":"一、準備招標文件","cat":"b","lines":["製造不必要之陷阱，例如：可在標價欄位印上「整」字卻不印，而規定廠商未寫「整」字即為無效標。"]},{"no":"1-10","label":"一（十）","ch":"一、準備招標文件","cat":"b","lines":["無正當理由而未採用主管機關（即工程會）訂定之契約範本，或任意刪減或修改工程會契約範本條款，例如：未規定廠商投保必要之保險；未載明終止或解除契約條件。","【相關法令及函釋】採購法第63條，採購契約要項第1點，工程會111年7月29日工程企字第11100036841號函。"]},{"no":"1-11","label":"一（一、準備招標文件一、準備招標文件（十一）","ch":"一、準備招標文件","cat":"b","lines":["以單價決標者，未載明預估數量或採購金額上限；標的2項以上未採分項決標者，未以分項單價乘以預估數量後之總和決定最低標。","【相關法令及函釋】施行細則第6條第5款、第64條之1。"]},{"no":"1-12","label":"一（十二）","ch":"一、準備招標文件","cat":"b","lines":["辦理巨額採購，招標前未簽准預期使用情形、效益目標及效益分析指標、預計採購期程、開始使用日期及使用年限。","【相關法令及函釋】採購法第111條，機關提報巨額採購使用情形及效益分析作業規定第2點。"]},{"no":"1-13","label":"一（十三）","ch":"一、準備招標文件","cat":"b","lines":["機關辦理巨額工程採購，未成立採購工作及審查小組，協助審查採購需求與經費、採購策略及招標文件等事項。","【相關法令及函釋】採購法第11條之1。"]},{"no":"1-14","label":"一（十四）","ch":"一、準備招標文件","cat":"b","lines":["等標期違反規定，例如：未考慮案件之複雜度逕依等標期法定下限訂定等標期；等標期包含假日，未考量廠商準備及遞送投標文件所需時間合理訂定。","【相關法令及函釋】採購法第28條，招標期限標準。"]},{"no":"1-15","label":"一（十五）","ch":"一、準備招標文件","cat":"b","lines":["不適用採購法之案件(例如：財物出租、財物變賣；契約約定性質，係由廠商自負盈虧、自行承擔風險，而不具有償委任性質；適用促進民間參與公共建設法之案件)，誤用採購法辦理；或未註明依採購法第99條辦理。","【相關法令及函釋】採購法第2條、第7條。"]},{"no":"1-16","label":"一（十六）","ch":"一、準備招標文件","cat":"b","lines":["招標文件標示之主要部分過於廣泛，未注意其與投標廠商資格之關聯性，造成廠商自行履行困難(例如：招標文件訂定主要部分為鋼構工程，致其鋼構組件之吊裝、組立、焊接、防火被覆、油漆等作業，均須由得標廠商自行履行)。","【相關法令及函釋】工程會98年10月21日工程企字第09800468030號函"]},{"no":"2-0","label":"作業指引","ch":"二、訂定廠商資格","cat":"b","xc":[],"lines":["機關訂定投標廠商資格，應依採購法第36條、第37條及「投標廠商資格與特殊或巨額採購認定標準」（以下簡稱資格標準）之規定辦理；不得不當限制競爭，並以與提供招標標的有關或確認廠商具備履行契約所必須之能力者為限。"]},{"no":"2-1","label":"二（一）","ch":"二、訂定廠商資格","cat":"b","lines":["訂定之廠商資格為資格標準所無或較該標準更嚴格之規定。","【相關法令及函釋】採購法第36條、第37條，資格標準。"]},{"no":"2-2","label":"二（二）","ch":"二、訂定廠商資格","cat":"b","lines":["非屬特殊或巨額採購卻規定特定資格，例如：限取得CNS12681（ISO 9001）驗證者。","【相關法令及函釋】採購法第36條第2項，資格標準第5條。"]},{"no":"2-3","label":"二（三）","ch":"二、訂定廠商資格","cat":"b","lines":["訂定特定資格未依資格標準評估廠商家數及檢討有無不當限制競爭。","【相關法令及函釋】資格標準第13條。"]},{"no":"2-4","label":"二（四）","ch":"二、訂定廠商資格","cat":"b","lines":["過當之資格，例如：乙等營造業承攬限額內之工程卻限甲等營造業方可投標。","【相關法令及函釋】採購法第37條第1項，資格標準第3條第3項。"]},{"no":"2-5","label":"二（五）","ch":"二、訂定廠商資格","cat":"b","lines":["以非屬法規規定（例如：某協會之會員；得規定依工業團體法或商業團體法加入工業或商業團體之證明）之團體之會員為資格條件。","【相關法令及函釋】採購法第37條第1項，資格標準第3條至第5條。"]},{"no":"2-6","label":"二（六）","ch":"二、訂定廠商資格","cat":"b","lines":["不當限制特定公會之會員方可投標，例如：1採購案有2以上公會會員皆可承做，而招標機關僅限其1公會會員始可投標。","【相關法令及函釋】採購法第37條第1項，資格標準第3條第1項第3款、第6項。"]},{"no":"2-7","label":"二（七）","ch":"二、訂定廠商資格","cat":"b","lines":["限特定地區公會之會員。"]},{"no":"2-8","label":"二（八）","ch":"二、訂定廠商資格","cat":"b","lines":["限國內或公部門(政府機關、公營事業、公立學校)之實績。","【相關法令及函釋】資格標準第14條。"]},{"no":"2-9","label":"二（九）","ch":"二、訂定廠商資格","cat":"b","lines":["廠商不及提出最近一期營業稅繳稅證明者，未允許以前一期之納稅證明代之，而一律限當期。","【相關法令及函釋】資格標準第3條第5項。"]},{"no":"2-10","label":"二（十）","ch":"二、訂定廠商資格","cat":"b","lines":["資本額限公告日前者。","【相關法令及函釋】資格標準第5條第1項第3款。"]},{"no":"2-11","label":"二（十一）","ch":"二、訂定廠商資格","cat":"b","lines":["超出法令規定，限投標當時即必須於指定地區設有分公司或維護站。","【相關法令及函釋】資格標準第4條第1項第4款。"]},{"no":"2-12","label":"二（十二）","ch":"二、訂定廠商資格","cat":"b","lines":["於法令未規定之情形，限定投標廠商之所在地。","【相關法令及函釋】資格標準第15條。"]},{"no":"2-23","label":"二（二、訂定廠商資格二、訂定廠商資格（十三）","ch":"二、訂定廠商資格","cat":"b","lines":["超出法令規定，限投標當時即必須擁有指定之設備。","【相關法令及函釋】資格標準第5條第1項第4款。"]},{"no":"2-14","label":"二（十四）","ch":"二、訂定廠商資格","cat":"b","lines":["不考慮資格文件之性質而規定廠商檢附正本；限開標當時必須攜帶資格文件正本，而未允許一定期限通知廠商提出正本供查驗。","【相關法令及函釋】採購法第36條、第37條，資格標準第10條第1項。"]},{"no":"2-15","label":"二（十五）","ch":"二、訂定廠商資格","cat":"b","lines":["限投標時即須檢附原廠代理證明、原廠願意供應證明。（註：可要求廠商履約時提出）","【相關法令及函釋】非屬資格標準第2條至第5條規定範圍，採購法第37條。"]},{"no":"2-16","label":"二（十六）","ch":"二、訂定廠商資格","cat":"b","lines":["限定國內廠商投標時須檢附與國外廠商技術合作之證明。(註:招標文件如未作強制規定，而係由投標廠商自行決定之合作，非屬此一情形）","【相關法令及函釋】採購法第37條第1項，資格標準第3條至第5條。"]},{"no":"3-0","label":"作業指引","ch":"三、訂定技術規格","cat":"b","xc":[],"lines":["機關訂定採購技術規格，按採購法第26條、第26條之1，與施行細則第24條、第25條、第25條之1及「政府採購法第二十六條執行注意事項」（以下簡稱注意事項）規定，應依功能或效益訂定招標文件，在目的及效果上均不得限制競爭。另依注意事項第2點及第3點規定，機關所定技術規格，應以達成機關於功能、效益或特性等需求所必須者為限；如有採購較佳之功能、效益或特性等之標的之必要，宜採最有利標決標或依施行細則第63條規定辦理。其在目的或效果上有無限制競爭，應以有無逾機關所必須者認定之，而不以符合該規格之廠商家數多寡作為判斷依據；其屬專屬權利、獨家製造或供應，無其他合適之替代標的者，可依採購法第22條第1項第2款規定辦理。"]},{"no":"3-1","label":"三（一）","ch":"三、訂定技術規格","cat":"b","lines":["未考量機關實際需求，逕自訂定或抄襲特定廠商型錄或規格資料。","【相關法令及函釋】採購法第26條、第26條之1，施行細則第24條、第25條、第25條之1，注意事項。"]},{"no":"3-2","label":"三（二）","ch":"三、訂定技術規格","cat":"b","lines":["公告金額以上之採購，無法以精確方式說明招標需求者，依需求指定特定廠牌之規格或型號或特定國家或協會之標準，而未允許同等品。","【相關法令及函釋】採購法第26條第3項，施行細則第25條。"]},{"no":"3-3","label":"三（三、訂定技術規格三、訂定技術規格（三）","ch":"三、訂定技術規格","cat":"b","lines":["未注意型錄之目的為佐證廠商交付履約標的符合機關招標文件所訂技術規格，卻要求型錄須蓋代理廠商之章；型錄須為正本；限型錄上之規格必須與招標規格一字不差。","【相關法令及函釋】採購法第26條。"]},{"no":"3-4","label":"三（四）","ch":"三、訂定技術規格","cat":"b","lines":["非屬必要卻限不同組件須由相同廠牌所組成。","【相關法令及函釋】採購法第26條，注意事項。"]},{"no":"3-5","label":"三（五）","ch":"三、訂定技術規格","cat":"b","lines":["於無法以精確之方式說明招標要求時，限取得正字標記而未允許同等品競標；或以ISO9000系列驗證證書作為產品規範(註：ISO 9000或CNS 12681，屬資格條件，非規格條件)。","【相關法令及函釋】採購法第26條第3項，工程會 88年10月27日工程企字第8816968號函。"]},{"no":"3-6","label":"三（六）","ch":"三、訂定技術規格","cat":"b","lines":["不允許我國產品，而指定進口品。","【相關法令及函釋】採購法第26條。"]},{"no":"3-7","label":"三（七）","ch":"三、訂定技術規格","cat":"b","lines":["引用已停止使用之內政部71台內營字第77679\n號函及74台內營字第357438號函「有關建材同等品之定義及使用時機案」之規定。","【相關法令及函釋】採購法第3條。"]},{"no":"3-8","label":"三（八）","ch":"三、訂定技術規格","cat":"b","lines":["限投標時即須檢附原廠製造證明、原廠品質保證書，規定投標廠商投標時須取得特定材料供應商之授權同意書。","【相關法令及函釋】採購法第26條。"]},{"no":"4-0","label":"作業指引","ch":"四、押標金保證金","cat":"b","xc":[],"lines":["機關辦理招標，除有採購法第30條第1項但書各款情形之一，應於招標文件中規定投標廠商須繳納押標金；得標廠商須繳納保證金或提供或併提供其他擔保。其繳納種類、額度、繳納、退還及終止方式，應依採購法第30條第2項及押標金保證金暨其他擔保作業辦法（以下簡稱押保辦法）規定辦理。"]},{"no":"4-1","label":"四（一）","ch":"四、押標金保證金","cat":"b","lines":["違反或限縮採購法第30條第2項所定押標金保證金繳納之方式。","【相關法令及函釋】採購法第30條第2項。"]},{"no":"4-2","label":"四（二）","ch":"四、押標金保證金","cat":"b","lines":["押標金金額逾規定上限。","【相關法令及函釋】押保辦法第9條。"]},{"no":"4-3","label":"四（三）","ch":"四、押標金保證金","cat":"b","lines":["拒絕接受未載明受款人之票據。","【相關法令及函釋】押保辦法第7條第1項。"]},{"no":"4-4","label":"四（四）","ch":"四、押標金保證金","cat":"b","lines":["受款人與機關名稱未完全相符，未洽銀行確認可否兌現，即逕為認定合格或不合格標。"]},{"no":"4-5","label":"四（五）","ch":"四、押標金保證金","cat":"b","lines":["招標文件未載明廠商以現金繳納押標金收受處所或帳戶。","【相關法令及函釋】押保辦法第6條第1項。"]},{"no":"4-6","label":"四（六）","ch":"四、押標金保證金","cat":"b","lines":["截止投標期限後允許廠商補繳納押標金。"]},{"no":"4-7","label":"四（七）","ch":"四、押標金保證金","cat":"b","lines":["廠商有採購法第31條第2項各款情形之一，機關未依規定不發還或追繳押標金。","【相關法令及函釋】採購法第31條第2項。"]},{"no":"5-0","label":"作業指引","ch":"五、決定招標方式","cat":"b","xc":[],"lines":["機關辦理公告金額以上採購，依採購法第19條規定，除符合採購法第20條各款情形之一得採選擇性招標，或符合採購法第22條第1項各款情形之一得採限制性招標外，應公開招標；未達公告金額之採購，得依採購法第49條或中央機關未達公告金額採購招標辦法規定辦理。"]},{"no":"5-1","label":"五（一）","ch":"五、決定招標方式","cat":"b","lines":["自創法規所無之招標方式，例如：以公開招標方式評選優勝廠商議價；以公開評選方式評選廠商後辦理比價。(註：依採購法第22條第1項第9款至第11款規定採限制性招標，準用最有利標之評選規定，按優勝序位，依序與優勝廠商辦理議價後決標)","【相關法令及函釋】採購法第18條至第23條。"]},{"no":"5-2","label":"五（二）","ch":"五、決定招標方式","cat":"b","lines":["誤用招標方式，非選擇性招標卻就資格標單獨招標。","【相關法令及函釋】採購法第18條至第23條，施行細則第44條第1項。"]},{"no":"5-3","label":"五（三）","ch":"五、決定招標方式","cat":"b","lines":["未符採購法第22條、第23條及中央機關未達公告金額採購招標辦法規定，邀廠商以議價或比價方式辦理。","【相關法令及函釋】採購法第22條、第23條，中央機關未達公告金額採購招標辦法第2條第1項。"]},{"no":"5-4","label":"五（四）","ch":"五、決定招標方式","cat":"b","lines":["依中央機關未達公告金額採購招標辦法第2條第1項第2款規定辦理，以通案簽報機關首長或其授權人員核准，或以個案簽報但未敘明邀請指定廠商比價或議價之適當理由。","【相關法令及函釋】採購法第49條，中央機關未達公告金額採購招標辦法第2條第1項。"]},{"no":"6-0","label":"作業指引","ch":"六、刊登招標公告","cat":"b","xc":[],"lines":["機關辦理公開招標、選擇性招標或依採購法第22條第1項第9款至第11款辦理經公開評選或公開徵求之限制性招標，應公開於工程會政府電子採購網，並刊登政府採購公報；其公告內容、公告日數及公告方法，應依政府採購公告及公報發行辦法(以下簡稱公報發行辦法)規定辦理；其自公告日或邀標日起至截止投標或收件日止之等標期，應依採購法第28條、施行細則第27條及招標期限標準規定，視案件性質與廠商準備及遞送投標文件所需時間合理訂定。"]},{"no":"6-1","label":"六（一）","ch":"六、刊登招標公告","cat":"b","lines":["漏刊公告，例如：依採購法第22條第1項第9款至第11款辦理限制性招標，未刊登公告。","【相關法令及函釋】採購法第27條，公報發行辦法第4條。"]},{"no":"6-2","label":"六（二）","ch":"六、刊登招標公告","cat":"b","lines":["誤刊公告，例如：招標公告誤刊為公開徵求廠商提供參考資料公告，或經公開評選或公開徵求之限制性招標誤刊為「公開取得報價單或企劃書」公告；未達公告金額之採購，以「公開取得」3家廠商之書面報價或企劃書方式辦理者，於辦理公告上網作業時，應選擇「公開取得報價單或企劃書」選項，卻誤選「公開招標」之選項。","【相關法令及函釋】採購法第27條，公報發行辦法。"]},{"no":"6-3","label":"六（三）","ch":"六、刊登招標公告","cat":"b","lines":["公告內容未完全符合公報發行辦法，應登載事項之規定，例如：漏填、錯填、未詳實填寫(以「詳招標文件」一語帶過)。"]},{"no":"6-4","label":"六（四）","ch":"六、刊登招標公告","cat":"b","lines":["採購案之屬性歸類錯誤，例如：工程保險誤登為工程案，致適用較高之查核或巨額採購金額，或使廠商遺漏參與機會；工程案誤登為財物案，致漏未適用工程品質管理或工程施工查核。","【相關法令及函釋】採購法第7條。"]},{"no":"6-5","label":"六（五）","ch":"六、刊登招標公告","cat":"b","lines":["招標文件載有得後續擴充，卻未於招標公告載明後續擴充之期間、金額或數量。","【相關法令及函釋】採購法第22條第1項第7款。"]},{"no":"6-6","label":"六（六）","ch":"六、刊登招標公告","cat":"b","lines":["流標或廢標後，變更或補充招標文件內容屬重大改變情形，重行招標卻仍依採購法第48條第2項規定以第2次招標處理。(註：前揭「重大改變」，應依是否影響廠商投標意願之原則判斷之)","【相關法令及函釋】施行細則第56條，工程會107年2月13日工程企字第10700047490號函。"]},{"no":"6-7","label":"六（七）","ch":"六、刊登招標公告","cat":"b","lines":["公告內容與招標文件之內容不一致，例如：截止投標期限不一致。","【相關法令及函釋】行政疏失。"]},{"no":"6-8","label":"六（八）","ch":"六、刊登招標公告","cat":"b","lines":["上網傳輸公告未確定傳輸成功，致實際傳輸失敗未刊登公告。","【相關法令及函釋】採購法第27條，公報發行辦法。"]},{"no":"7-0","label":"作業指引","ch":"七、領標投標程序","cat":"b","xc":[],"lines":["機關發售招標文件，不得登記領標廠商之名稱（採購法第29條第1項後段），其收費應以人工、材料、郵遞等工本費為限（施行細則第28條之1）。廠商投標方式及投標期限，應依採購法第33條規定辦理。"]},{"no":"7-1","label":"七（一）","ch":"七、領標投標程序","cat":"b","lines":["招標文件未能於等標期內供廠商領標，例如：延後開始領標時間；縮短領標時間；以招標文件售罄為由妨礙廠商領標。","【相關法令及函釋】採購法第29條第1項。"]},{"no":"7-2","label":"七（二）","ch":"七、領標投標程序","cat":"b","lines":["僅標示供投標之郵政信箱。"]},{"no":"7-3","label":"七（三）","ch":"七、領標投標程序","cat":"b","lines":["詢問或登載領標廠商名稱。"]},{"no":"7-4","label":"七（四）","ch":"七、領標投標程序","cat":"b","lines":["限使用機關之標封否則投標無效。","【相關法令及函釋】採購法第6條、第33條第1項，施行細則第29條。"]},{"no":"7-5","label":"七（五）","ch":"七、領標投標程序","cat":"b","lines":["招標文件訂價過高。","【相關法令及函釋】施行細則第28條之1。"]},{"no":"7-6","label":"七（六）","ch":"七、領標投標程序","cat":"b","lines":["除機關自行變更或補充招標文件內容，且該變更或補充將影響廠商投標文件內容者外，允許廠商於開標前領回投標文件或開啟標封更改其內容。","【相關法令及函釋】採購法第33條第3項，施行細則第32條，工程會96年3月2日工程企字第09600064690號函。"]},{"no":"8-0","label":"作業指引","ch":"八、開標程序","cat":"d","xc":[],"lines":["機關辦理公開招標、選擇性招標、經公開評選或公開徵求之限制性招標(採購法第22條第1項第9款至第11款)，及招標文件已標示開標時點地點之公開取得廠商書面報價或企劃書(採購法第49條)者，其開標作業，應依招標文件公告之時間及地點公開為之，開啟廠商投標文件之標封，宣布投標廠商之名稱或代號、家數及其他招標文件規定之事項。有標價者，並宣布之。但應注意採購法第57條第1款及施行細則第76條規定應予保密之情形。","主持開標人員應由機關首長或其授權人員指派適當人員擔任，其分工為主持開標程序、負責開標現場處置及有關決定。開標紀錄應依施行細則第51條規定記載相關事項，由辦理開標人員及監辦人員會同簽認。"]},{"no":"8-1","label":"八（一）","ch":"八、開標程序","cat":"d","lines":["開標前之應辦程序未辦妥，例如：漏通知上級機關監辦。","【相關法令及函釋】採購法第3條、第12條。"]},{"no":"8-2","label":"八（二）","ch":"八、開標程序","cat":"d","lines":["開標當場宣布補充規定或變更招標文件內容。","【相關法令及函釋】採購法第27條、第41條。"]},{"no":"8-3","label":"八（三）","ch":"八、開標程序","cat":"d","lines":["開標紀錄記載不全。","【相關法令及函釋】施行細則第51條。"]},{"no":"8-4","label":"八（四）","ch":"八、開標程序","cat":"d","lines":["廠商未依通知出席開標，或未依機關通知期限辦理說明或減價，機關將其視為無效標。","【相關法令及函釋】採購法第60條，施行細則第83條。"]},{"no":"8-5","label":"八（五）","ch":"八、開標程序","cat":"d","lines":["機關於招標文件載明廠商應派員出席，未派員即視為廠商放棄說明、減價之權利。","【相關法令及函釋】採購法第60條。"]},{"no":"8-6","label":"八（六）","ch":"八、開標程序","cat":"d","lines":["採分段開標，卻先辦理價格標後再審查資格或規格標。","【相關法令及函釋】施行細則第44條。"]},{"no":"8-7","label":"八（七）","ch":"八、開標程序","cat":"d","lines":["訂定底價時機不符合規定，例如：限制性招標之議價前未參考該議價廠商之報價或估價即訂定底價。","【相關法令及函釋】採購法第46條，施行細則第54條。"]},{"no":"8-8","label":"八（八）","ch":"八、開標程序","cat":"d","lines":["採行協商措施，未依規定秘密開標、審標。","【相關法令及函釋】採購法第57條第1款。"]},{"no":"9-0","label":"作業指引","ch":"九、審標程序","cat":"d","xc":[],"lines":["依採購法第51條規定，機關應依招標文件規定之條件，審查廠商投標文件，對其內容有疑義時，得通知投標廠商提出說明。又依採購法第51條及施行細則第60條規定，發現其內容有不明確、不一致或明顯打字或書寫錯誤之情形者，得通知投標廠商提出說明，以確認其正確之內容；投標文件內明顯打字或書寫錯誤，與標價無關，機關得允許廠商更正。依採購法第51條及施行細則第61條規定，機關應將審標結果通知投標廠商，且必須告知救濟途徑、期間與受理機關等教示內容(工程會113年9月26日工程企字第1130100288號函)。"]},{"no":"9-1","label":"九（一）","ch":"九、審標程序","cat":"d","lines":["未依招標文件之規定確實審查，對於不同廠商有不同審查標準。","【相關法令及函釋】採購法第50條、第51條。"]},{"no":"9-2","label":"九（二）","ch":"九、審標程序","cat":"d","lines":["不必公開審標卻公開審標，致洩漏個別廠商應保密資料。","【相關法令及函釋】採購法第34條第4項。"]},{"no":"9-3","label":"九（三）","ch":"九、審標程序","cat":"d","lines":["投標文件審查結果，未通知投標廠商。","【相關法令及函釋】採購法第51條第2項，施行細則第61條。"]},{"no":"9-4","label":"九（四）","ch":"九、審標程序","cat":"d","lines":["私下洽投標廠商協助審查其他廠商之投標文件，或允許投標廠商查看其他廠商之投標文件。","【相關法令及函釋】採購法第34條第4項、第51條。"]},{"no":"9-5","label":"九（五）","ch":"九、審標程序","cat":"d","lines":["審標程序錯亂，例如：決標後，方審查投標時提出之樣本規格或投標文件所載廠牌設備、材料之規格。","【相關法令及函釋】採購法第52條，施行細則第44條。"]},{"no":"10-0","label":"作業指引","ch":"十、決標程序","cat":"d","xc":[],"lines":["採最低標決標者，除有採購法第58條規定情形外，最低標廠商標價在底價以內（包括平底價），應予決標。採適用最有利標者，經機關首長或評選委員會過半數之決定者為最有利標；將評選結果簽報機關首長或其授權人員核定後辦理決標，無議價程序。採準用最有利標者，經機關首長或評選委員會過半數之決定者為優勝廠商，將評選結果簽報機關首長或其授權人員核定後，按優勝序位依序與廠商辦理議價後，再行決標；招標文件載明固定費用或費率者，議價程序仍不得免除（無須議減價格，可議定其他內容，但不得更改原招標文件之規定，或降低廠商投標文件所承諾之內容，且不應強制廠商修正投標文件內容）。"]},{"no":"10-1","label":"十（一）","ch":"十、決標程序","cat":"d","lines":["未依採購法第61條及第62條刊登或傳輸決標資訊，或傳輸之資料錯誤或不完整，例如：以單價決標時未傳輸預估總價；未登載廠商是否為中小企業；採限制性招標於決標後未依採購法第61條及第62條刊登或傳輸決標資訊；得標廠商為外國廠商卻登載係我國之中小企業。","【相關法令及函釋】採購法第61條、第62條，施行細則第84條，公報發行辦法第13條至第15條。"]},{"no":"10-2","label":"十（二）","ch":"十、決標程序","cat":"d","lines":["開標後因故廢標者，未依施行細則第57條第2項規定保留廠商投標文件之影本或其中1份。(註：依採購法第107條規定，機關辦理採購之文件，除依會計法或其他法律規定保存者外，應另備具1份，保存於主管機關指定之場所)","【相關法令及函釋】採購法第107條，施行細則第57條。"]},{"no":"10-23","label":"十（十、決標程序十、決標程序（三）","ch":"十、決標程序","cat":"d","lines":["招標標的在2項以上而未採分項決標者，以單價和決標，而未以各項單價及其預估需求數量之乘積加總計算，決定最低標。","【相關法令及函釋】施行細則第64條之1。"]},{"no":"10-4","label":"十（四）","ch":"十、決標程序","cat":"d","lines":["標價偏低，而未依採購法第58條規定辦理。","【相關法令及函釋】採購法第58條。"]},{"no":"10-5","label":"十（五）","ch":"十、決標程序","cat":"d","lines":["訂有底價之採購，廠商報價已在底價之內（包括平底價），機關未予決標，而要求廠商減價。","【相關法令及函釋】採購法第52條，施行細則第69條、第72條第2項。"]},{"no":"10-6","label":"十（六）","ch":"十、決標程序","cat":"d","lines":["未更改招標文件內容而重行訂定之底價，除有正當理由外（例如匯率或物價大幅波動影響底價之訂定；合格廠商之最低標價有採購法第58條所稱總標價偏低之情形），較廢標前合格廠商之最低標價為高。","【相關法令及函釋】採購法第6條、第46條第1項。"]},{"no":"10-7","label":"十（七）","ch":"十、決標程序","cat":"d","lines":["決標紀錄記載不全。","【相關法令及函釋】施行細則第68條。"]},{"no":"10-8","label":"十（八）","ch":"十、決標程序","cat":"d","lines":["依採購法第105條辦理採購者，未刊登決標公告或定期彙送決標資料。","【相關法令及函釋】採購法第61條、第62條，特別採購招標決標處理辦法第2條。"]},{"no":"10-9","label":"十（九）","ch":"十、決標程序","cat":"d","lines":["誤以為審標結果必須至少有3家廠商合格方得決標。","【相關法令及函釋】採購法第48條第1項。"]},{"no":"11-0","label":"作業指引","ch":"十一、履約程序","cat":"p","xc":[],"lines":["機關應確實依契約約定辦理履約管理及驗收作業。契約內容須變更者，應依據契約約定程序及「採購契約變更或加減價核准監辦備查規定一覽表」檢討辦理；如發現廠商有採購法第65條所稱轉包情事者，得解除或終止契約、沒收履約保證金、通知刊登政府採購公報拒絕往來，並得要求損害賠償（採購法第66條及第101條第1項第11款）；驗收結果與契約、圖說、貨樣規定不符者，應通知廠商限期改善；未於限期內改善完成者，應依契約所訂罰則，課予責任及處罰；如擬採減價收受，應符合採購法第72條第2項規定。"]},{"no":"11-1","label":"十一（一）","ch":"十一、履約程序","cat":"p","lines":["未確實辦理履約管理，例如：機關發現廠商有下列情形而未處理：廠商使用非法運輸工具；使用非法外勞；未落實職業安全；亂倒廢棄物；違反目的事業法規（如電業法）經營業務；未依契約約定繳交原廠製造證明或檢(試)驗報告等文件；繳交契約禁止之大陸地區或大陸廠牌貨品；出具之進口報單或原廠證明文件，未按進口報單或原廠證明之制式格式排版或偽變造其文書內容。","【相關法令及函釋】採購法第3條、第63條、第70條、第70條之1。"]},{"no":"11-2","label":"十一（二）","ch":"十一、履約程序","cat":"p","lines":["查驗或驗收作業不實，例如：依廠商建議之區域鑽心取樣。","【相關法令及函釋】採購法第63條、第70條、第72條。"]},{"no":"11-3","label":"十一（三）","ch":"十一、履約程序","cat":"p","lines":["對於轉包行為視若無睹，例如：履約階段由非得標廠商代為履行契約之全部或其主要部分。","【相關法令及函釋】採購法第65條、第66條、第101條第1項第11款，施行細則第87條。"]},{"no":"11-4","label":"十一（四）","ch":"十一、履約程序","cat":"p","lines":["契約允許使用同等品，廠商提出同等品，無正當理由而不同意。","【相關法令及函釋】採購法第26條、第88條，施行細則第25條，採購契約要項第21點，注意事項。"]},{"no":"11-5","label":"十一（五）","ch":"十一、履約程序","cat":"p","lines":["無正當理由不同意廠商提報分包商。","【相關法令及函釋】採購法第67條。"]},{"no":"11-26","label":"十一（十一、履約程序十一、履約程序（六）","ch":"十一、履約程序","cat":"p","lines":["非屬契約約定廠商得要求契約變更之事由，而任意允許廠商辦理契約變更。","【相關法令及函釋】採購法第6條，採購契約要項第21點。"]},{"no":"11-7","label":"十一（七）","ch":"十一、履約程序","cat":"p","lines":["補助(藝文採購除外)或委託機關未盡到監督法人或團體依採購法辦理之責任。","【相關法令及函釋】採購法第4條、第5條，施行細則第2條至第4條。"]},{"no":"11-8","label":"十一（八）","ch":"十一、履約程序","cat":"p","lines":["未依規定期限辦理驗收或付款。","【相關法令及函釋】採購法第6條、第71條第1項、第73條之1，施行細則第92條至第95條。"]},{"no":"11-9","label":"十一（九）","ch":"十一、履約程序","cat":"p","lines":["不考慮廠商單價是否合理而強以機關預算單價調整廠商單價。","【相關法令及函釋】工程會98年5月11日工程企字第09800157960號函。"]},{"no":"12-0","label":"作業指引","ch":"十二、其他可能有圍標之嫌或宜注意之現象","cat":"b","xc":["s"],"lines":["機關辦理開標及審標作業，應注意投標廠商是否有借牌圍標行為；如發現投標廠商有下列所列情形，應依行政程序法規定啟動行政調查程序，無須等待刑事起訴或判決，並依個案實際情形審認核處。"]},{"no":"12-1","label":"十二（一）","ch":"十二、其他可能有圍標之嫌或宜注意之現象","cat":"b","lines":["不明人士蒐集領標廠商名稱。","【相關法令及函釋】採購法第29條、第34條第2項。"],"xc":["s"]},{"no":"12-2","label":"十二（二）","ch":"十二、其他可能有圍標之嫌或宜注意之現象","cat":"b","lines":["投標文件內容由同一人或同一廠商繕寫或備具；押標金由同一人或同一廠商繳納或申請退還；投標標封或通知機關信函號碼連號，顯係同一人或同一廠商所為；廠商地址、電話號碼、傳真機號碼、聯絡人或電子郵件網址相同；廠商投標文件所載負責人為同一人；其他顯係同一人或同一廠商所為之情形。","【相關法令及函釋】採購法第50條第1項，工程會91年11月27日工程企字第09100516820號令，工程會105年3月21日工程企字第10500080180號令。"],"xc":["s"]},{"no":"12-3","label":"十二（三）","ch":"十二、其他可能有圍標之嫌或宜注意之現象","cat":"b","lines":["不同投標廠商參與投標，卻由同一廠商之人員代表出席開標、評審、評選、決標等會議。","【相關法令及函釋】採購法第50條第1項，工程會97年2月14日工程企字第09700060670號令。"],"xc":["s"]},{"no":"12-4","label":"十二（四）","ch":"十二、其他可能有圍標之嫌或宜注意之現象","cat":"b","lines":["有3家以上合格廠商投標，開標後有2家以上廠商有下列情形之一，致僅餘1家廠商符合招標文件規定：一、押標金未附或不符合規定。二、投標文件為空白文件、無關文件或標封內空無一物。三、資格、規格或價格文件未附或不符合規定。四、標價高於公告之預算或公告之底價。五、其他疑似刻意造成不合格標之情形。","【相關法令及函釋】採購法第50條第1項，工程會95年7月25日工程企字第09500256920號令。"],"xc":["s"]},{"no":"12-5","label":"十二（五）","ch":"十二、其他可能有圍標之嫌或宜注意之現象","cat":"b","lines":["不同投標廠商之領標網路位址（IP）相同。","【相關法令及函釋】採購法第48條第1項、第50條第1項。"],"xc":["s"]},{"no":"12-6","label":"十二（六）","ch":"十二、其他可能有圍標之嫌或宜注意之現象","cat":"b","lines":["履約階段代表廠商出席會議之人員為未得標廠商之人員。","【相關法令及函釋】採購法第48條第1項、第50條第1項。"],"xc":["s"]},{"no":"12-7","label":"十二（七）","ch":"十二、其他可能有圍標之嫌或宜注意之現象","cat":"b","lines":["不同投標廠商之押標金由同一廠商之員工領回；退還未得標廠商押標金之雙掛號郵件，其郵件簽收證明之收件人欄位卻蓋得標廠商公司戳章；廠商投標文件所載人員之勞工保險或全民健康保險投保單位為其他投標廠商。"],"xc":["s"]},{"no":"12-8","label":"十二（八）","ch":"十二、其他可能有圍標之嫌或宜注意之現象","cat":"b","lines":["得標廠商履約期間所提送之施工、品質或職業安全衛生管理計畫書等文件，與未得標廠商於同一採購案所提送之文件內容及格式相同；部分契約項目由未得標廠商代為履行。"],"xc":["s"]},{"no":"12-9","label":"十二（九）","ch":"十二、其他可能有圍標之嫌或宜注意之現象","cat":"b","lines":["最低標廠商總標價偏低顯不合理，機關依採購法第58條規定洽其說明後，最低標廠商無故不提出說明或故意提出不合理之說明。","【相關法令及函釋】採購法第50條第1項、第58條。"],"xc":["s"]}]}],"quiz":[{"c":"g","q":"政府採購法所稱「採購」，不包括下列何者？","o":["工程之定作","財物之買受、定製、承租","勞務之委任或僱傭","機關多餘不用堪用財物之無償讓與"],"a":3,"e":"§2 所稱採購指工程之定作、財物之買受、定製、承租及勞務之委任或僱傭等。堪用財物無償讓與規定在 §100Ⅱ，不屬「採購」。","r":"A0030057#2"},{"c":"g","q":"下列何者非政府採購法第 3 條所稱之「機關」？","o":["政府機關","公立學校","公營事業","私立大學"],"a":3,"e":"§3 明定機關指政府機關、公立學校、公營事業三者。私立大學若受補助達 §4 要件才適用本法。","r":"A0030057#3"},{"c":"g","q":"法人或團體接受機關補助辦理採購，須同時具備何種要件始適用本法？","o":["補助金額占採購金額半數以上，且補助金額在公告金額以上","補助金額占採購金額三分之一以上，且採購金額在公告金額以上","補助金額占採購金額半數以上，或補助金額在公告金額以上","補助金額在查核金額以上"],"a":0,"e":"§4Ⅰ 兩要件須「且」同時具備：占採購金額半數以上 **且** 補助金額在公告金額以上。","r":"A0030057#4"},{"c":"g","q":"受機關補助之「藝文採購」，其適用情形為何？","o":["完全不受監督","不適用 §4Ⅰ，但應受補助機關監督，辦法由文化部定之","一律適用本法全部規定","由主管機關（工程會）另定辦法"],"a":1,"e":"§4Ⅱ：藝文採購不適用 §4Ⅰ，但仍應受補助機關監督；辦理原則、適用範圍及監督管理辦法由**文化部**定之。","r":"A0030057#4"},{"c":"g","q":"本法所稱「工程」，下列敘述何者錯誤？","o":["指在地面上下新建、增建、改建、修建、拆除構造物與其所屬設備","包括改變自然環境之行為","包括建築、土木、水利、環境、交通、機械、電氣、化工","生鮮農漁產品之採購亦屬工程"],"a":3,"e":"§7Ⅰ 定義工程；生鮮農漁產品是被排除在「財物」定義之外（§7Ⅱ），與工程無關。","r":"A0030057#7"},{"c":"g","q":"採購兼有工程、財物、勞務二種以上性質，難以認定歸屬時，應如何處理？","o":["一律認定為工程","按其性質所占預算金額比率最高者歸屬之","由機關首長裁量","報請主管機關認定"],"a":1,"e":"§7Ⅳ：按其性質所占**預算金額比率最高**者歸屬之。","r":"A0030057#7"},{"c":"g","q":"本法所稱「上級機關」，指下列何者？","o":["行政院","辦理採購機關直屬之上一級機關","主管機關","審計機關"],"a":1,"e":"§9Ⅱ：上級機關指辦理採購機關**直屬之上一級**機關；其無上級機關者，由該機關自行執行上級機關職權。","r":"A0030057#9"},{"c":"g","q":"機關辦理查核金額以上採購之開標、比價、議價、決標及驗收，應如何處理？","o":["由主（會）計單位會同監辦","於規定期限內檢送相關文件報請上級機關派員監辦","報請審計機關派員監辦","報請主管機關核准"],"a":1,"e":"§12Ⅰ：查核金額以上→報請**上級機關**派員監辦；上級機關得訂授權條件由機關自辦。","r":"A0030057#12"},{"c":"g","q":"機關辦理未達查核金額之採購，其決標金額達查核金額者，應如何處理？","o":["重新招標","補具相關文件送上級機關備查","報請上級機關核准後決標","無須任何處理"],"a":1,"e":"§12Ⅱ：決標金額或契約變更後金額達查核金額者，應**補具文件送上級機關備查**。","r":"A0030057#12"},{"c":"g","q":"關於公告金額，下列敘述何者正確？","o":["公告金額應高於查核金額","公告金額應低於查核金額，由主管機關參酌國際標準定之","公告金額由行政院定之","公告金額由各機關自行訂定"],"a":1,"e":"§13Ⅲ：公告金額應**低於**查核金額，由主管機關**參酌國際標準**定之。","r":"A0030057#13"},{"c":"g","q":"現行公告金額為新臺幣多少元？","o":["100 萬元","150 萬元","200 萬元","1,000 萬元"],"a":1,"e":"公告金額自民國 112 年 1 月 1 日起調整為新臺幣 **150 萬元**（工程、財物、勞務均同）。","r":"A0030057#13"},{"c":"g","q":"現行查核金額，工程及財物採購為多少？勞務採購為多少？","o":["工程財物 5,000 萬、勞務 1,000 萬","工程財物 1 億、勞務 2,000 萬","工程財物 5,000 萬、勞務 2,000 萬","工程財物 2 億、勞務 1,000 萬"],"a":0,"e":"現行查核金額：工程及財物採購 **5,000 萬元**；勞務採購 **1,000 萬元**。","r":"A0030057#12"},{"c":"g","q":"依投標廠商資格與特殊或巨額採購認定標準，巨額採購之金額為何？","o":["工程 2 億、財物 1 億、勞務 2,000 萬","工程 1 億、財物 2 億、勞務 2,000 萬","工程 2 億、財物 1 億、勞務 1,000 萬","工程 5,000 萬、財物 5,000 萬、勞務 1,000 萬"],"a":0,"e":"認定標準 §8：工程 **2 億元**、財物 **1 億元**、勞務 **2,000 萬元**。","r":"A0030099#8"},{"c":"g","q":"機關不得意圖規避本法之適用而分批辦理公告金額以上之採購，若有分批必要應如何？","o":["報主管機關核准","經上級機關核准，並依其總金額核計採購金額","由機關首長核准即可","一律禁止分批"],"a":1,"e":"§14：有分批必要並經**上級機關核准**者，應依其**總金額**核計採購金額，分別按公告金額或查核金額以上之規定辦理。","r":"A0030057#14"},{"c":"g","q":"機關承辦、監辦採購人員離職後多久內，不得為本人或代理廠商向原任職機關接洽處理離職前多久內與職務有關之事務？","o":["離職後 2 年內、離職前 3 年內","離職後 3 年內、離職前 5 年內","離職後 5 年內、離職前 3 年內","離職後 1 年內、離職前 1 年內"],"a":1,"e":"§15Ⅰ：離職後**三年**內、離職前**五年**內。記法「離三回五」。","r":"A0030057#15"},{"c":"g","q":"機關人員對於與採購有關事項，涉及下列何者之利益時應行迴避？","o":["本人、配偶、二親等以內親屬或共同生活家屬","本人、配偶、三親等以內親屬","本人及配偶","本人、配偶、四親等以內親屬"],"a":0,"e":"§15Ⅱ：涉及本人、配偶、**二親等以內親屬**，或**共同生活家屬**之利益時應迴避。","r":"A0030057#15"},{"c":"g","q":"關於請託或關說，下列敘述何者正確？","o":["一律禁止並處罰","宜以書面為之或作成紀錄，且不得作為評選之參考","僅限機關首長得受理","應報請上級機關核准"],"a":1,"e":"§16：請託或關說**宜以書面為之或作成紀錄**；政風機構得調閱；且**不得作為評選之參考**。","r":"A0030057#16"},{"c":"g","q":"外國廠商參與各機關採購，應依何規定辦理？","o":["一律依本法","依我國締結之條約或協定之規定辦理","依外國廠商所屬國法令","由機關自行決定"],"a":1,"e":"§17Ⅰ：外國廠商參與採購，應依**我國締結之條約或協定**辦理；其以外情形，依主管機關訂定之處理辦法。","r":"A0030057#17"},{"c":"g","q":"外國法令限制或禁止我國廠商或產品服務參與採購者，主管機關得如何處理？","o":["提交 WTO 爭端解決","得限制或禁止該國廠商或產品服務參與採購","報請行政院決定","無任何處理方式"],"a":1,"e":"§17Ⅲ：主管機關得**限制或禁止**該國廠商或產品服務參與採購（互惠原則）。","r":"A0030057#17"},{"c":"g","q":"機關辦理巨額工程採購，依法應成立下列何者？","o":["採購評選委員會","採購工作及審查小組","採購稽核小組","工程施工查核小組"],"a":1,"e":"§11-1Ⅰ：機關辦理**巨額工程採購**，應成立**採購工作及審查小組**，協助審查採購需求與經費、採購策略、招標文件等。","r":"A0030057#11-1"},{"c":"g","q":"主管機關應設立採購資訊中心，其任務不包括下列何者？","o":["統一蒐集共通性商情及同等品分類資訊","建立工程價格資料庫","供各機關採購預算編列及底價訂定之參考","代各機關辦理招標決標"],"a":3,"e":"§11Ⅰ 規定資訊中心之任務；代辦招標決標是 §40 代辦採購的範疇，非資訊中心任務。","r":"A0030057#11"},{"c":"g","q":"本法所稱主管機關為何？","o":["行政院","行政院採購暨公共工程委員會","行政院主計總處","審計部"],"a":1,"e":"§9Ⅰ：主管機關為**行政院採購暨公共工程委員會**，以政務委員一人兼任主任委員。","r":"A0030057#9"},{"c":"g","q":"下列何者非主管機關依 §10 掌理之事項？","o":["政府採購法令之研訂、修正及解釋","標準採購契約之檢討及審定","中央各機關採購申訴之處理","地方機關採購申訴之處理"],"a":3,"e":"§10 第 7 款為「**中央**各機關採購申訴之處理」；地方機關申訴由直轄市或縣（市）政府所設申訴會處理（§76Ⅰ）。","r":"A0030057#10"},{"c":"g","q":"機關採購委託法人或團體代辦者，其法律效果為何？","o":["不適用本法","適用本法，該法人團體並受委託機關之監督","僅適用部分規定","應報主管機關核准"],"a":1,"e":"§5：委託代辦之採購**適用本法**，該法人或團體並**受委託機關監督**。","r":"A0030057#5"},{"c":"g","q":"關於辦理採購人員之裁量，下列敘述何者正確？","o":["一律不得裁量","於不違反本法規定之範圍內，得基於公共利益、採購效益或專業判斷為適當之採購決定","僅機關首長得裁量","須報上級機關核准始得裁量"],"a":1,"e":"§6Ⅱ：於不違反本法規定之範圍內，得基於**公共利益、採購效益或專業判斷**之考量為適當之採購決定。","r":"A0030057#6"},{"c":"g","q":"機關辦理採購，對廠商之基本原則為何？","o":["得依採購金額為差別待遇","應以維護公共利益及公平合理為原則，不得為無正當理由之差別待遇","得優先照顧本地廠商","得依廠商規模為差別待遇"],"a":1,"e":"§6Ⅰ：應以維護公共利益及公平合理為原則，對廠商**不得為無正當理由之差別待遇**。","r":"A0030057#6"},{"c":"g","q":"本法所稱「廠商」，不包括下列何者？","o":["公司","合夥或獨資之工商行號","得提供工程財物勞務之自然人","外國政府本身"],"a":3,"e":"§8：廠商指公司、合夥或獨資之工商行號及其他得提供工程財物勞務之自然人、法人、機構或團體。","r":"A0030057#8"},{"c":"g","q":"機關辦理工程採購之預算金額達一定金額以上者，應於決標後將何種資料傳輸至工程價格資料庫？","o":["底價資料","得標廠商之單價資料","所有投標廠商標價","契約全文"],"a":1,"e":"§11Ⅱ：應於決標後將**得標廠商之單價資料**傳輸至工程價格資料庫。","r":"A0030057#11"},{"c":"g","q":"關於本法之施行日期，下列敘述何者正確？","o":["自公布日施行","自公布後一年施行；修正條文自公布日施行","自公布後六個月施行","由行政院定之"],"a":1,"e":"§114Ⅰ：本法自**公布後一年**施行；Ⅱ 修正條文自**公布日**施行。","r":"A0030057#114"},{"c":"g","q":"司法、監察機關對採購機關或人員之調查、起訴、審判等，得如何？","o":["逕行認定違法","洽請主管機關協助、鑑定或提供專業意見","無須任何程序","應先報請行政院同意"],"a":1,"e":"§6Ⅲ：得**洽請主管機關協助、鑑定或提供專業意見**。","r":"A0030057#6"},{"c":"b","q":"機關辦理公告金額以上之採購，除依 §20 及 §22 辦理者外，原則上應採何種招標方式？","o":["選擇性招標","限制性招標","公開招標","公開評選"],"a":2,"e":"§19：公告金額以上之採購，除得依 §20 選擇性招標或 §22 限制性招標者外，**應公開招標**。","r":"A0030057#19"},{"c":"b","q":"下列何者非 §20 得採選擇性招標之情形？","o":["經常性採購","投標文件審查須費時長久始能完成","廠商準備投標需高額費用","遇有不可預見之緊急事故"],"a":3,"e":"「不可預見之緊急事故」是 §22Ⅰ③ **限制性招標**事由。§20 五款為：經常性採購／審查費時長久／準備投標需高額費用／資格條件複雜／研究發展事項。","r":"A0030057#20"},{"c":"b","q":"機關辦理選擇性招標之「經常性採購」，應建立幾家以上之合格廠商名單？","o":["三家以上","五家以上","六家以上","十家以上"],"a":2,"e":"§21Ⅲ：經常性採購應建立**六家以上**之合格廠商名單。","r":"A0030057#21"},{"c":"b","q":"關於限制性招標之定義，下列敘述何者正確？","o":["不經公告程序，邀請二家以上廠商比價或僅邀請一家廠商議價","經公告程序，邀請二家以上廠商比價","不經公告程序，僅得邀請一家廠商議價","經公告程序，邀請不特定廠商投標"],"a":0,"e":"§18Ⅳ：限制性招標指**不經公告程序**，邀請**二家以上**廠商**比價**或**僅邀請一家**廠商**議價**。","r":"A0030057#18"},{"c":"b","q":"依 §22Ⅰ⑥ 因未能預見之情形必須追加契約以外之工程而洽原訂約廠商辦理者，其金額限制為何？","o":["未逾原主契約金額 30%","未逾原主契約金額 50%","未逾原主契約金額 20%","無金額限制"],"a":1,"e":"§22Ⅰ⑥：必須追加契約以外之工程，非洽原訂約廠商不能達契約目的，且**未逾原主契約金額百分之五十**者。","r":"A0030057#22"},{"c":"b","q":"依 §22Ⅰ⑦ 原有採購之後續擴充得採限制性招標，其要件為何？","o":["金額未逾原契約 50%","已於原招標公告及招標文件敘明擴充之期間、金額或數量","經上級機關核准","經主管機關認定"],"a":1,"e":"§22Ⅰ⑦：須**已於原招標公告及招標文件敘明**擴充之期間、金額或數量。","r":"A0030057#22"},{"c":"b","q":"政府採購法 §22Ⅰ 第 13 款、第 14 款之限制性招標，有何特別限制？","o":["僅適用工程採購","不適用工程採購","僅適用財物採購","須經上級機關核准"],"a":1,"e":"§22Ⅳ 明定第 13 款（學術研究發展）及第 14 款（文化藝術）**不適用工程採購**。","r":"A0030057#22"},{"c":"b","q":"未達公告金額之招標方式，在中央由何者訂定？","o":["各機關自行訂定","主管機關","行政院","審計部"],"a":1,"e":"§23：未達公告金額之招標方式，在中央由**主管機關**定之；在地方由直轄市或縣（市）政府定之，地方未定者比照中央。","r":"A0030057#23"},{"c":"b","q":"未達公告金額但逾公告金額十分之一之採購，除 §22Ⅰ 各款情形外，仍應如何辦理？","o":["逕洽廠商採購","公開取得三家以上廠商之書面報價或企劃書","公開招標","報請上級機關核准"],"a":1,"e":"§49：仍應**公開取得三家以上廠商之書面報價或企劃書**。","r":"A0030057#49"},{"c":"b","q":"公告金額十分之一以下之採購（小額採購），依中央機關未達公告金額採購招標辦法，得如何辦理？","o":["仍應公開招標","得不經公告程序，逕洽廠商採購，免提供報價或企劃書","應取得三家報價","應報上級機關核准"],"a":1,"e":"未達公告金額採購招標辦法 §5：公告金額十分之一以下之招標，**得不經公告程序，逕洽廠商採購，免提供報價或企劃書**。","r":"A0030067#5"},{"c":"b","q":"依中央機關未達公告金額採購招標辦法 §2，符合 §22Ⅰ 第 16 款情形者，有何特別規定？","o":["仍須報經主管機關認定","敘明理由簽報機關首長或授權人員核准，免報經主管機關認定","須報上級機關核准","不得採限制性招標"],"a":1,"e":"招標辦法 §2Ⅰ②：符合 §22Ⅰ⑯ 者，敘明適當理由簽報機關首長或其授權人員核准，得採限制性招標，**免報經主管機關認定**。","r":"A0030067#2"},{"c":"b","q":"機關辦理採購，其招標文件於公告前應如何處理？","o":["應予公開","應予保密，但須公開說明或藉以公開徵求參考資料者不在此限","得任意提供廠商參考","應送主管機關備查"],"a":1,"e":"§34Ⅰ：招標文件於公告前**應予保密**；但須公開說明或藉以公開徵求廠商提供參考資料者，不在此限。","r":"A0030057#34"},{"c":"b","q":"關於底價之保密，下列敘述何者錯誤？","o":["機關辦理招標，不得於開標前洩漏底價","底價於開標後至決標前仍應保密","決標後除有特殊情形外應予公開","機關不得於招標文件中公告底價"],"a":3,"e":"§34Ⅲ 但書：機關依實際需要，**得於招標文件中公告底價**。","r":"A0030057#34"},{"c":"b","q":"機關辦理採購，應於何時訂定底價？（公開招標）","o":["公告前","開標前","決標前","簽約前"],"a":1,"e":"§46Ⅱ①：公開招標應於**開標前**定之；選擇性招標於資格審查後之下一階段開標前；限制性招標於議價或比價前。","r":"A0030057#46"},{"c":"b","q":"下列何種採購，機關得不訂底價？","o":["所有工程採購","訂定底價確有困難之特殊或複雜案件、以最有利標決標之採購、小額採購","所有勞務採購","公告金額以上之採購"],"a":1,"e":"§47Ⅰ 三款：①訂定底價確有困難之特殊或複雜案件 ②以最有利標決標之採購 ③小額採購。","r":"A0030057#47"},{"c":"b","q":"小額採購之金額，在中央由主管機關定之，但不得逾多少？","o":["公告金額十分之一","公告金額五分之一","查核金額十分之一","新臺幣 10 萬元"],"a":0,"e":"§47Ⅲ：小額採購金額**不得逾公告金額十分之一**。","r":"A0030057#47"},{"c":"b","q":"機關辦理招標，原則上應於招標文件中規定投標廠商須繳納押標金，下列何者非 §30 之免收情形？","o":["勞務採購，以免收押標金、保證金為原則","未達公告金額之工程、財物採購，得免收","以議價方式辦理之採購，得免收押標金","公告金額以上之工程採購，得免收"],"a":3,"e":"§30Ⅰ 四款免收情形不含「公告金額以上之工程採購」。第 3 款「議價得免收」僅針對**押標金**。","r":"A0030057#30"},{"c":"b","q":"押標金之額度，依押標金保證金暨其他擔保作業辦法規定，其上限為何？","o":["預算金額 5%，且不得逾 3,000 萬元","標價 5%，且不得逾 5,000 萬元","預算金額 10%，且不得逾 5,000 萬元","契約金額 10%"],"a":1,"e":"辦法 §9Ⅱ：一定金額不逾預算或預估採購總額 **5%**；一定比率不逾標價 **5%**；但**不得逾新臺幣 5,000 萬元**。","r":"A0030079#9"},{"c":"b","q":"履約保證金之額度上限為何？","o":["契約金額 5%","契約金額 10%","契約金額 15%","契約金額 20%"],"a":1,"e":"辦法 §15Ⅱ：一定金額不逾預算或預估採購總額 10%；一定比率不逾**契約金額 10%**。","r":"A0030079#15"},{"c":"b","q":"下列何者非 §31Ⅱ 押標金不予發還並追繳之事由？","o":["以虛偽不實之文件投標","得標後拒不簽約","得標後未於規定期限內繳足保證金或提供擔保","驗收不合格情節重大"],"a":3,"e":"「驗收不合格情節重大」是 §101Ⅰ⑧ 停權事由，非 §31Ⅱ 追繳押標金事由。","r":"A0030057#31"},{"c":"b","q":"追繳押標金之請求權，因幾年間不行使而消滅？","o":["2 年","5 年","10 年","15 年"],"a":1,"e":"§31Ⅳ：請求權因**五年**間不行使而消滅；§31Ⅵ 另定自不予開標、不予決標、廢標或決標日起逾 **15 年**者不得行使。","r":"A0030057#31"},{"c":"b","q":"機關辦理公開招標，公告金額以上未達查核金額之採購，其等標期不得少於幾日？","o":["7 日","10 日","14 日","21 日"],"a":2,"e":"招標期限標準 §2Ⅱ：未達公告金額 7 日／公告金額以上未達查核金額 **14 日**／查核金額以上未達巨額 21 日／巨額 28 日。","r":"A0030093#2"},{"c":"b","q":"巨額採購之公開招標，等標期不得少於幾日？","o":["14 日","21 日","28 日","35 日"],"a":2,"e":"招標期限標準 §2Ⅱ④：巨額之採購 **28 日**。","r":"A0030093#2"},{"c":"b","q":"選擇性招標之廠商資格預先審查，巨額採購之等標期不得少於幾日？","o":["7 日","10 日","14 日","21 日"],"a":2,"e":"招標期限標準 §3Ⅱ：未達公告金額 7 日／公告金額以上未達巨額 10 日／巨額 **14 日**。","r":"A0030093#3"},{"c":"b","q":"依 §42Ⅱ 辦理後續階段之邀標，其等標期不得少於幾日？","o":["3 日","7 日","10 日","14 日"],"a":1,"e":"招標期限標準 §2Ⅲ：依本法 §42Ⅱ 辦理後續階段邀標，等標期由機關合理訂定，但**不得少於 7 日**。","r":"A0030093#2"},{"c":"b","q":"機關辦理招標，其技術規格之訂定，下列敘述何者錯誤？","o":["有國際標準或國家標準者應從其規定","不得於目的及效果上限制競爭","不得要求或提及特定商標、商名、專利、設計或型式","無法精確說明時，仍不得註明「或同等品」"],"a":3,"e":"§26Ⅲ 但書：無法以精確方式說明招標要求，而已在招標文件內註明「**或同等品**」字樣者，不在此限。","r":"A0030057#26"},{"c":"b","q":"機關辦理公告金額以上之採購，應依何者訂定招標文件？","o":["最低價格","功能或效益","廠商建議","過去決標紀錄"],"a":1,"e":"§26Ⅰ：應依**功能或效益**訂定招標文件；有國際標準或國家標準者，應從其規定。","r":"A0030057#26"},{"c":"b","q":"關於統包，下列敘述何者正確？","o":["指二家以上廠商共同具名投標","指將工程或財物採購中之設計與施工、供應、安裝或一定期間之維修等併於同一採購契約辦理招標","指將採購項目分割為數案辦理","指多個機關共同辦理採購"],"a":1,"e":"§24Ⅱ 統包之定義。二家以上共同具名投標是**共同投標**（§25）。","r":"A0030057#24"},{"c":"b","q":"關於共同投標，下列敘述何者錯誤？","o":["指二家以上廠商共同具名投標，得標後共同具名簽約","共同投標廠商連帶負履行採購契約之責","以能增加競爭或無不當限制競爭者為限","共同投標協議書得於得標後補送"],"a":3,"e":"§25Ⅴ：共同投標廠商應於**投標時**檢附共同投標協議書。","r":"A0030057#25"},{"c":"b","q":"同業共同投標應符合下列何項規定？","o":["公平交易法第 15 條第 1 項但書各款","公司法關係企業規定","民法合夥規定","無特別規定"],"a":0,"e":"§25Ⅳ：同業共同投標應符合**公平交易法第 15 條第 1 項但書**各款之規定。","r":"A0030057#25"},{"c":"b","q":"機關得於招標文件中規定允許廠商提出替代方案，其要件為何？","o":["降低原有功能以減省經費","在不降低原有功能條件下，就技術、工法、材料或設備提出可縮減工期、減省經費或提高效率之方案","任意變更契約內容","僅限工程採購"],"a":1,"e":"§35：須在**不降低原有功能條件下**，就技術、工法、材料或設備提出可縮減工期、減省經費或提高效率之替代方案。","r":"A0030057#35"},{"c":"b","q":"關於投標廠商資格，下列敘述何者正確？","o":["機關得任意訂定資格以限制競爭","特殊或巨額之採購，得另規定投標廠商之特定資格","廠商財力資格不得以保證代之","外國廠商資格不得另行規定"],"a":1,"e":"§36Ⅱ：**特殊或巨額**之採購得另定特定資格。§37Ⅱ 但書允許財力資格以銀行或保險公司之連帶保證、連帶保證保險單代之。","r":"A0030057#36"},{"c":"b","q":"訂定投標廠商資格之界限為何？","o":["以確認廠商具備履行契約所必須之能力者為限，且不得不當限制競爭","得依機關偏好訂定","以廠商資本額為唯一標準","應從嚴訂定"],"a":0,"e":"§37Ⅰ：不得不當限制競爭，並以確認廠商具備**履行契約所必須之能力**者為限。","r":"A0030057#37"},{"c":"b","q":"關於政黨及其關係企業廠商參與投標，下列敘述何者正確？","o":["得參與投標","不得參與投標","經主管機關核准得參與","僅得參與未達公告金額之採購"],"a":1,"e":"§38Ⅰ：政黨及與其具關係企業關係之廠商，**不得參與投標**；關係企業準用公司法規定。","r":"A0030057#38"},{"c":"b","q":"承辦專案管理之廠商，其負責人或合夥人有何限制？","o":["不得同時為規劃、設計、施工或供應廠商之負責人或合夥人","得同時擔任但應報備","無限制","僅工程採購有限制"],"a":0,"e":"§39Ⅱ：不得同時為規劃、設計、施工或供應廠商之負責人或合夥人；Ⅲ 亦不得為關係企業或同一其他廠商之關係企業。","r":"A0030057#39"},{"c":"b","q":"廠商對招標文件內容有疑義者，應如何處理？","o":["得隨時以口頭反映","應於招標文件規定之日期前，以書面向招標機關請求釋疑","應直接向申訴會提出","應於開標後提出"],"a":1,"e":"§41Ⅰ：應於招標文件規定之日期前，以**書面**向招標機關請求釋疑。","r":"A0030057#41"},{"c":"b","q":"機關對招標文件疑義之處理結果，若涉及變更或補充招標文件內容者，原則上應如何？","o":["僅通知請求釋疑之廠商","應另行公告，並視需要延長等標期","無須任何處理","應重新招標"],"a":1,"e":"§41Ⅱ：除選擇性招標之規格標與價格標及限制性招標得以書面通知各廠商外，**應另行公告，並視需要延長等標期**。","r":"A0030057#41"},{"c":"b","q":"機關辦理分段開標，其公告義務為何？","o":["每一階段均應公告","除第一階段應公告外，後續階段之邀標得免予公告","均免予公告","應報上級機關核准後免公告"],"a":1,"e":"§42Ⅱ：除**第一階段應公告**外，後續階段之邀標得免予公告。","r":"A0030057#42"},{"c":"b","q":"廠商之投標文件，原則上應如何遞送？","o":["以書面密封，於投標截止期限前以郵遞或專人送達","一律以電子方式遞送","得於開標後補送","得以口頭報價"],"a":0,"e":"§33Ⅰ：應以**書面密封**，於投標截止期限前以郵遞或專人送達；Ⅱ 招標文件已訂明者始得以電子資料傳輸遞送。","r":"A0030057#33"},{"c":"b","q":"機關得於招標文件中規定允許廠商於開標前補正何種文件？","o":["所有文件","非契約必要之點之文件","押標金","投標標價"],"a":1,"e":"§33Ⅲ：得規定允許廠商於開標前補正**非契約必要之點**之文件。","r":"A0030057#33"},{"c":"b","q":"機關辦理公開招標或選擇性招標，其招標公告應如何處理？","o":["僅公開於機關網站","刊登於政府採購公報並公開於資訊網路","僅刊登於報紙","僅通知特定廠商"],"a":1,"e":"§27Ⅰ：應將招標公告或資格審查公告**刊登於政府採購公報並公開於資訊網路**；公告內容修正時亦同。","r":"A0030057#27"},{"c":"b","q":"公開招標之招標文件，應自何時起至何時止公開發給、發售及郵遞？","o":["自公告日起至截止投標日或收件日止","自公告日起至開標日止","自決標日起","由機關自行決定"],"a":0,"e":"§29Ⅰ：應自**公告日起至截止投標日或收件日止**公開發給、發售及郵遞；且**不得登記領標廠商之名稱**。","r":"A0030057#29"},{"c":"b","q":"機關辦理招標，關於領標廠商名稱之處理，下列敘述何者正確？","o":["應登記以利管理","不得登記領標廠商之名稱","得選擇性登記","應公告領標廠商名單"],"a":1,"e":"§29Ⅰ 後段：發給、發售或郵遞時，**不得登記領標廠商之名稱**（防止圍標）。","r":"A0030057#29"},{"c":"b","q":"機關辦理查核金額以上之採購，依政府採購招標文件公開閱覽制度實施要點，應於何時辦理公開閱覽？","o":["決標後","公告招標前","開標後","驗收前"],"a":1,"e":"公開閱覽制度實施要點第二點：機關辦理查核金額以上之採購，應於**公告招標前**辦理招標文件之公開閱覽。","r":"FL029347#2"},{"c":"b","q":"軍事機關辦理武器、彈藥、作戰物資採購，因應國家面臨戰爭、戰備動員或發生戰爭者，其法律效果為何？","o":["仍應完全適用本法","得不適用本法之規定","僅得不適用招標規定","應報立法院核准"],"a":1,"e":"§104Ⅰ①：因應國家面臨戰爭、戰備動員或發生戰爭者，**得不適用本法之規定**。","r":"A0030057#104"},{"c":"b","q":"軍事機關辦理機密或極機密之採購，得不適用下列何條規定？","o":["§27、§45、§61","§26、§28、§36","§30、§31","§75、§76"],"a":0,"e":"§104Ⅰ②：機密或極機密之採購，得不適用 **§27（公報公告）、§45（公開開標）、§61（決標公告）**。","r":"A0030057#104"},{"c":"b","q":"機關辦理採購，得洽由其他具有專業能力之機關代辦，其法源為何？","o":["§5","§39","§40","§105"],"a":2,"e":"§40Ⅰ：機關之採購得洽由其他具有專業能力之機關代辦；Ⅱ 上級機關得命未具專業採購能力之機關洽請代辦。","r":"A0030057#40"},{"c":"b","q":"機關得視採購特性及實際需要，以促進自然資源保育與環境保護為目的擬定技術規格，其法源為何？","o":["§26","§26-1","§96","§84"],"a":1,"e":"§26-1Ⅰ：得以促進自然資源保育與環境保護為目的擬定技術規格及節能減碳措施；增加經費者應併入計畫報核編列預算。","r":"A0030057#26-1"},{"c":"b","q":"機關辦理採購時，關於預算及預計金額之公開，下列敘述何者正確？","o":["一律不得公開","得於招標公告中一併公開","應一律公開","僅得於決標後公開"],"a":1,"e":"§27Ⅲ：機關應估計採購案件之件數及每件之預計金額；預算及預計金額**得於招標公告中一併公開**。","r":"A0030057#27"},{"c":"b","q":"關於選擇性招標之合格廠商名單，下列敘述何者錯誤？","o":["機關得預先辦理資格審查建立名單","應隨時接受廠商資格審查之請求","應定期檢討修正合格廠商名單","未列入名單之廠商一律不得參加特定招標"],"a":3,"e":"§21Ⅱ：未列入名單之廠商請求參加特定招標時，機關於不妨礙招標作業並能適時完成資格審查者，**於審查合格後邀其投標**。","r":"A0030057#21"},{"c":"b","q":"關於押標金及保證金之繳納方式，下列何者非 §30Ⅱ 所列？","o":["現金、金融機構簽發之本票或支票","政府公債、設定質權之金融機構定期存款單","銀行開發或保兌之不可撤銷擔保信用狀","不動產設定抵押權"],"a":3,"e":"§30Ⅱ 列舉方式不含不動產抵押；另可取具銀行書面連帶保證或保險公司連帶保證保險單。","r":"A0030057#30"},{"c":"d","q":"機關依本法辦理招標，有幾家以上合格廠商投標，即應依招標文件所定時間開標決標？","o":["二家","三家","五家","六家"],"a":1,"e":"§48Ⅰ：有**三家以上**合格廠商投標，即應依招標文件所定時間開標決標（除該條八款不予開標決標情形外）。","r":"A0030057#48"},{"c":"d","q":"第一次開標因未滿三家而流標者，第二次招標有何特別規定？","o":["仍須三家以上","等標期間得予縮短，並得不受三家廠商之限制","應改採限制性招標","應報上級機關核准"],"a":1,"e":"§48Ⅱ：第二次招標之**等標期得縮短**，並**得不受三家廠商之限制**。","r":"A0030057#48"},{"c":"d","q":"下列何者非 §48Ⅰ 不予開標決標之情形？","o":["變更或補充招標文件內容","發現有足以影響採購公正之違法或不當行為","因應突發事故","投標廠商僅有三家"],"a":3,"e":"三家即應開標決標，非不予開標事由。八款包括變更補充文件、影響公正之違法不當、§82 暫緩開標、§84 暫停程序、§85 另為處置、突發事故、採購計畫變更或取銷、主管機關認定之特殊情形。","r":"A0030057#48"},{"c":"d","q":"投標廠商有下列何種情形，經機關於開標前發現者，其所投之標應不予開標？","o":["標價高於底價","不同投標廠商間之投標文件內容有重大異常關聯","資本額不足","未參加投標前說明會"],"a":1,"e":"§50Ⅰ⑤：不同投標廠商間之投標文件內容有**重大異常關聯**者，開標前發現不予開標、開標後發現不決標。","r":"A0030057#50"},{"c":"d","q":"決標或簽約後發現得標廠商於決標前有 §50Ⅰ 情形者，機關應如何處理？","o":["一律不處理","應撤銷決標、終止契約或解除契約，並得追償損失","僅得請求損害賠償","應報主管機關決定"],"a":1,"e":"§50Ⅱ：應撤銷決標、終止或解除契約，並得追償損失；但反不符公共利益並經**上級機關核准**者，不在此限。","r":"A0030057#50"},{"c":"d","q":"§50Ⅰ 不予開標或不予決標，致採購程序無法繼續進行者，機關得如何？","o":["逕行決標","宣布廢標","改採限制性招標","報請主管機關處理"],"a":1,"e":"§50Ⅲ：致採購程序無法繼續進行者，機關得**宣布廢標**。","r":"A0030057#50"},{"c":"d","q":"機關辦理採購之決標原則，下列何者非 §52Ⅰ 所列？","o":["訂有底價之最低標","未訂底價之最低標","最有利標","抽籤決標"],"a":3,"e":"§52Ⅰ 四款：訂有底價之最低標、未訂底價之最低標、最有利標、複數決標。","r":"A0030057#52"},{"c":"d","q":"機關辦理公告金額以上之專業服務、技術服務、資訊服務、社會福利服務或文化創意服務，其決標原則為何？","o":["以訂有底價之最低標為原則","以不訂底價之最有利標為原則","以複數決標為原則","由機關自行決定"],"a":1,"e":"§52Ⅱ：以**不訂底價之最有利標**為原則。","r":"A0030057#52"},{"c":"d","q":"合於招標文件規定之最低標價超過底價時，機關得如何處理？","o":["直接廢標","洽該最低標廠商減價一次；仍超過底價時，得由所有合格廠商重新比減價格，不得逾三次","洽最低標廠商減價三次","逕行報上級機關核准決標"],"a":1,"e":"§53Ⅰ：減價**一次** → 全體比減價格，**比減價格不得逾三次**。","r":"A0030057#53"},{"c":"d","q":"依 §53Ⅱ，最低標價仍超過底價而不逾預算數額，機關確有緊急情事需決標時，其決標價格上限為何？","o":["不得超過底價 4%","不得超過底價 8%","不得超過底價 10%","不得超過預算數額"],"a":1,"e":"§53Ⅱ：經原底價核定人或其授權人員核准，**不得超過底價百分之八**；查核金額以上之採購**超過底價 4%** 者，應先報經上級機關核准後決標。","r":"A0030057#53"},{"c":"d","q":"查核金額以上之採購，超過底價多少比率決標，應先報經上級機關核准？","o":["2%","4%","8%","10%"],"a":1,"e":"§53Ⅱ 但書：查核金額以上之採購，超過底價**百分之四**者，應先報經上級機關核准後決標。","r":"A0030057#53"},{"c":"d","q":"未訂底價之採購，最低標價逾評審委員會建議金額或預算金額，經減價及比減價格後仍逾越者，應如何？","o":["報上級機關核准後決標","應予廢標","改採最有利標","洽次低標議價"],"a":1,"e":"§54：辦理結果最低標價仍逾越上開金額時，**應予廢標**。","r":"A0030057#54"},{"c":"d","q":"關於最有利標之綜合評選，下列敘述何者錯誤？","o":["應依招標文件所規定之評審標準辦理","得就技術、品質、功能、商業條款或價格作序位或計數之綜合評選","未列入之項目仍得作為評選之參考","綜合評選不得逾三次"],"a":2,"e":"§56Ⅰ：**未列入之項目，不得做為評選之參考**。","r":"A0030057#56"},{"c":"d","q":"機關採最有利標決標者，程序上應如何？","o":["報主管機關備查","應先報經上級機關核准","由機關首長逕行核定","應經審計機關同意"],"a":1,"e":"§56Ⅲ：機關採最有利標決標者，**應先報經上級機關核准**。","r":"A0030057#56"},{"c":"d","q":"機關辦理評選，應成立評選委員會，其人數及專家學者比例為何？","o":["三人以上，專家學者不得少於二分之一","五人以上，專家學者不得少於三分之一","五人以上，專家學者不得少於二分之一","七人以上，專家學者不得少於三分之一"],"a":1,"e":"§94Ⅰ：應成立**五人以上**之評選委員會，專家學者人數**不得少於三分之一**。","r":"A0030057#94"},{"c":"d","q":"採購評選委員會之專家學者，有何資格限制？","o":["須具博士學位","不得為政府機關之現職人員","須為採購專業人員","須具十年以上經驗"],"a":1,"e":"§94Ⅱ：所稱專家學者，**不得為政府機關之現職人員**。","r":"A0030057#94"},{"c":"d","q":"機關辦理最低標決標，認為最低標廠商總標價或部分標價偏低顯不合理，得如何處理？","o":["逕行不決標","限期通知該廠商提出說明或擔保；未提出合理說明或擔保者，得不決標予該廠商","逕行廢標","洽次低標議價"],"a":1,"e":"§58：得限期通知提出說明或擔保；未於期限內提出合理說明或擔保者，得不決標予該廠商，並以次低標廠商為最低標廠商。","r":"A0030057#58"},{"c":"d","q":"廠商以差額保證金作為 §58 之擔保，總標價偏低者其擔保金額如何計算？","o":["總標價與底價之差額","總標價與底價百分之八十之差額","總標價與底價百分之七十之差額","總標價之百分之十"],"a":1,"e":"押標金保證金辦法 §30Ⅰ①：總標價偏低者，擔保金額為總標價與**底價之百分之八十**之差額。","r":"A0030079#30"},{"c":"d","q":"部分標價偏低者，其差額保證金之擔保金額如何計算？","o":["該部分標價與該部分底價百分之八十之差額","該部分標價與該部分底價百分之七十之差額","該部分標價之百分之十","總標價與底價之差額"],"a":1,"e":"押標金保證金辦法 §30Ⅰ②：部分標價偏低者，擔保金額為該部分標價與**該部分底價之百分之七十**之差額。","r":"A0030079#30"},{"c":"d","q":"廠商以支付佣金、比例金、仲介費、後謝金或其他不正利益為條件促成契約成立者，機關得如何處理？","o":["僅得終止契約","得終止或解除契約，並將二倍之不正利益自契約價款中扣除","得將一倍之不正利益扣除","應移送檢察機關偵辦後再處理"],"a":1,"e":"§59Ⅱ：機關得終止或解除契約，並將**二倍**之不正利益自契約價款中扣除；未能扣除者通知廠商限期給付。","r":"A0030057#59"},{"c":"d","q":"機關通知廠商說明、減價、比減價格、協商或重新報價，廠商未依通知期限辦理者，其效果為何？","o":["得展延期限","視同放棄","應予廢標","視為同意原報價"],"a":1,"e":"§60：廠商未依通知期限辦理者，**視同放棄**。","r":"A0030057#60"},{"c":"d","q":"機關辦理公告金額以上採購之招標，決標結果應如何處理？","o":["僅通知得標廠商","於決標後一定期間內將決標結果公告刊登政府採購公報，並以書面通知各投標廠商","僅刊登公報無須通知","無須公告"],"a":1,"e":"§61：應於決標後一定期間內公告刊登政府採購公報，並以書面通知各投標廠商；**無法決標者亦同**。","r":"A0030057#61"},{"c":"d","q":"機關辦理以最低標決標之採購，採行協商措施之要件為何？","o":["機關首長核准即可","經報上級機關核准，並於招標公告及招標文件內預告","經評選委員會同意","無須任何要件"],"a":1,"e":"§55：經**報上級機關核准**，並於**招標公告及招標文件內預告**者，得於依 §53、§54 無法決標時採行協商措施。","r":"A0030057#55"},{"c":"d","q":"採行協商措施時，下列原則何者錯誤？","o":["開標、投標、審標程序及內容均應予保密","協商時應平等對待所有合於招標文件規定之投標廠商","原招標文件未標示得更改之項目亦得納入協商","協商結束後應予廠商依協商結果修改投標文件重行遞送之機會"],"a":2,"e":"§57③：**原招標文件已標示得更改項目之內容，始得納入協商**。","r":"A0030057#57"},{"c":"d","q":"公開招標及選擇性招標之開標，原則上應如何進行？","o":["得不公開","依招標文件公告之時間及地點公開為之","由機關自行決定時間地點","僅通知得標廠商到場"],"a":1,"e":"§45：除法令另有規定外，應依招標文件公告之時間及地點**公開**為之。","r":"A0030057#45"},{"c":"d","q":"機關辦理採購決標時，是否須通知投標廠商到場？","o":["一律應通知到場","決標時得不通知投標廠商到場，其結果應通知各投標廠商","僅通知最低標廠商","應通知所有領標廠商"],"a":1,"e":"§52Ⅲ：決標時**得不通知投標廠商到場**，其結果應通知各投標廠商。","r":"A0030057#52"},{"c":"d","q":"機關依 §51 審查廠商投標文件，對不合格之廠商應如何？","o":["無須通知","應通知並敘明其原因","僅公告即可","通知但無須敘明原因"],"a":1,"e":"§51Ⅱ：審查結果應通知投標廠商，對不合格之廠商**並應敘明其原因**。","r":"A0030057#51"},{"c":"d","q":"機關辦理採購，得對國內產製加值達百分之五十之財物或國內供應之工程勞務，優先決標予國內廠商，其一定比率及優惠期限上限為何？","o":["比率不得逾 3%、期限不得逾 5 年","比率不得逾 5%、期限不得逾 3 年","比率不得逾 10%、期限不得逾 5 年","比率不得逾 3%、期限不得逾 3 年"],"a":0,"e":"§44Ⅱ：一定比率**不得逾百分之三**，優惠期限**不得逾五年**；且以合於就業或產業發展政策者為限。","r":"A0030057#44"},{"c":"d","q":"依 §43①，機關要求投標廠商採購國內貨品比率、技術移轉等作為採購評選項目，其比率上限為何？","o":["不得逾三分之一","不得逾二分之一","不得逾百分之三","不得逾百分之十"],"a":0,"e":"§43①：作為採購評選之項目，其比率**不得逾三分之一**。","r":"A0030057#43"},{"c":"d","q":"§43、§44 之優惠措施，有何前提限制？","o":["須經上級機關核准","除我國締結之條約或協定另有禁止規定者外","僅適用於工程採購","僅適用於巨額採購"],"a":1,"e":"§43、§44 均以「**除我國締結之條約或協定另有禁止規定者外**」為前提——即條約協定採購不得適用。","r":"A0030057#43"},{"c":"d","q":"機關得於招標文件中規定優先採購取得政府認可環境保護標章之產品，並得允許多少以下之價差？","o":["百分之三","百分之五","百分之十","百分之十五"],"a":2,"e":"§96Ⅰ：得允許**百分之十以下**之價差。","r":"A0030057#96"},{"c":"d","q":"關於複數決標，下列敘述何者正確？","o":["機關得任意組合決標","機關得於招標文件中公告保留採購項目或數量選擇之組合權利，但應合於最低價格或最有利標之競標精神","複數決標無須載明於招標文件","複數決標僅適用工程採購"],"a":1,"e":"§52Ⅰ④：得於招標文件中公告保留之採購項目或數量選擇之組合權利，但應合於**最低價格或最有利標**之競標精神。","r":"A0030057#52"},{"c":"d","q":"各機關就具有共通需求特性之財物或勞務與廠商簽訂之契約，稱為？","o":["統包契約","共同投標契約","共同供應契約","複數決標契約"],"a":2,"e":"§93Ⅰ：各機關得就具有**共通需求特性**之財物或勞務，與廠商簽訂**共同供應契約**。","r":"A0030057#93"},{"c":"d","q":"機關辦理採購之決標資料，應如何處理？","o":["自行保存即可","應定期彙送主管機關","應送審計機關","應公開於機關網站"],"a":1,"e":"§62：機關辦理採購之決標資料，應**定期彙送主管機關**。","r":"A0030057#62"},{"c":"d","q":"依採購評選委員會組織準則，評選委員會之成立時機為何？","o":["決標後","於辦理評選之採購案件招標文件公告前成立","開標時","簽約前"],"a":1,"e":"評選委員會應於招標文件公告前成立，以審定招標文件之評選項目、評審標準及評定方式。","r":"A0030103#4"},{"c":"d","q":"機關辦理公告金額以上採購之開標、比價、議價、決標及驗收，除有特殊情形外，應由何者會同監辦？","o":["上級機關","主（會）計及有關單位","審計機關","政風單位"],"a":1,"e":"§13Ⅰ：應由其**主（會）計及有關單位**會同監辦。","r":"A0030057#13"},{"c":"d","q":"§13 之會同監辦採購辦法，由何者訂定？","o":["主管機關單獨訂定","主管機關會同行政院主計處定之","行政院定之","各機關自行訂定"],"a":1,"e":"§13Ⅳ：第一項會同監辦採購辦法，由**主管機關會同行政院主計處**定之。","r":"A0030057#13"},{"c":"p","q":"各類採購契約之訂定原則為何？","o":["由機關自行擬定","以採用主管機關訂定之範本為原則","由廠商提供","應報主管機關核准"],"a":1,"e":"§63Ⅰ：各類採購契約以採用**主管機關訂定之範本**為原則，其要項及內容由主管機關參考國際及國內慣例定之。","r":"A0030057#63"},{"c":"p","q":"採購契約因政策變更，廠商依契約繼續履行反而不符公共利益者，機關得如何？","o":["逕行終止契約且無須補償","報經上級機關核准，終止或解除部分或全部契約，並補償廠商因此所生之損失","僅得減少契約數量","應由廠商自行承擔損失"],"a":1,"e":"§64：得**報經上級機關核准**終止或解除部分或全部契約，並**補償**廠商因此所生之損失。","r":"A0030057#64"},{"c":"p","q":"得標廠商違反 §65 轉包規定時，機關得如何處理？","o":["僅得要求改正","得解除契約、終止契約或沒收保證金，並得要求損害賠償","僅得沒收保證金","應報主管機關處理"],"a":1,"e":"§66Ⅰ：得**解除契約、終止契約或沒收保證金**，並得要求損害賠償。","r":"A0030057#66"},{"c":"p","q":"轉包廠商與得標廠商對機關之責任為何？","o":["各自負責","負連帶履行及賠償責任，再轉包者亦同","僅得標廠商負責","僅轉包廠商負責"],"a":1,"e":"§66Ⅱ：轉包廠商與得標廠商對機關負**連帶履行及賠償責任**；再轉包者亦同。","r":"A0030057#66"},{"c":"p","q":"分包廠商就其分包部分，與得標廠商負何種責任？","o":["連帶履行責任","連帶負瑕疵擔保責任","不負任何責任","補充責任"],"a":1,"e":"§67Ⅲ：分包廠商就其分包部分，與得標廠商**連帶負瑕疵擔保責任**。","r":"A0030057#67"},{"c":"p","q":"得標廠商就採購契約對於機關之價金或報酬請求權，得否為權利質權之標的？","o":["不得","其全部或一部得為權利質權之標的","僅全部得為之","須經機關同意始得為之"],"a":1,"e":"§68：其**全部或一部**得為權利質權之標的。","r":"A0030057#68"},{"c":"p","q":"中央及直轄市、縣（市）政府應成立何種組織，定期查核所屬（轄）機關工程品質及進度？","o":["採購稽核小組","工程施工查核小組","採購工作及審查小組","採購評選委員會"],"a":1,"e":"§70Ⅲ：應成立**工程施工查核小組**，定期查核所屬（轄）機關工程品質及進度等事宜。","r":"A0030057#70"},{"c":"p","q":"工程施工查核小組進行查核時，應以何種方式為主？","o":["書面審查為主","現場查核為主、書面審查為輔","抽樣檢驗為主","廠商自主檢查"],"a":1,"e":"工程施工查核小組作業辦法 §2：應以**現場查核為主**，書面審查為輔。","r":"D0070080#2"},{"c":"p","q":"機關辦理工程採購，於廠商履約過程得辦理何種程序，其結果並得供驗收之用？","o":["分段查驗","全面複驗","第三方認證","廠商自主檢查"],"a":0,"e":"§70Ⅱ：機關於廠商履約過程，得辦理**分段查驗**，其結果並得供驗收之用。","r":"A0030057#70"},{"c":"p","q":"機關辦理工程、財物採購之驗收，關於主驗人之規定，下列何者正確？","o":["由承辦採購單位人員擔任","機關承辦採購單位之人員不得為所辦採購之主驗人或樣品及材料之檢驗人","由廠商指派","由上級機關指派"],"a":1,"e":"§71Ⅲ：機關**承辦採購單位之人員不得**為所辦採購之主驗人或樣品及材料之檢驗人。","r":"A0030057#71"},{"c":"p","q":"驗收結果與契約、圖說、貨樣規定不符者，機關應如何處理？","o":["一律解除契約","通知廠商限期改善、拆除、重作、退貨或換貨","逕行減價收受","沒收保證金"],"a":1,"e":"§72Ⅰ：應通知廠商**限期改善、拆除、重作、退貨或換貨**。","r":"A0030057#72"},{"c":"p","q":"機關辦理減價收受，其核准層級為何？","o":["一律由機關首長核准","查核金額以上應先報經上級機關核准；未達查核金額經機關首長或其授權人員核准","一律報上級機關核准","由主計單位核准"],"a":1,"e":"§72Ⅱ：在**查核金額以上**之採購應先報經**上級機關**核准；未達查核金額之採購應經機關首長或其授權人員核准。","r":"A0030057#72"},{"c":"p","q":"減價收受之要件，下列何者錯誤？","o":["驗收結果與規定不符","不妨礙安全及使用需求","無減少通常效用或契約預定效用","不論拆換是否困難均得減價收受"],"a":3,"e":"§72Ⅱ：須經機關檢討**不必拆換或拆換確有困難**者，始得於必要時減價收受。","r":"A0030057#72"},{"c":"p","q":"工程竣工後，監造單位應於竣工後幾日內將竣工圖表、工程結算明細表等資料送請機關審核？","o":["3 日","7 日","15 日","30 日"],"a":1,"e":"施行細則 §92Ⅱ：監造單位應於竣工後**七日**內送請機關審核。","r":"A0030058#92"},{"c":"p","q":"有初驗程序者，機關應於收受全部資料之日起幾日內辦理初驗？","o":["15 日","20 日","30 日","45 日"],"a":2,"e":"施行細則 §92Ⅱ：機關應於收受全部資料之日起**三十日**內辦理初驗，並作成初驗紀錄。","r":"A0030058#92"},{"c":"p","q":"採購之驗收有初驗程序者，初驗合格後，除契約另有規定外，機關應於幾日內辦理驗收？","o":["10 日","15 日","20 日","30 日"],"a":2,"e":"施行細則 §93：初驗合格後，機關應於**二十日**內辦理驗收，並作成驗收紀錄。","r":"A0030058#93"},{"c":"p","q":"採購之驗收無初驗程序者，機關應於接獲廠商通知備驗或可得驗收之程序完成後幾日內辦理驗收？","o":["15 日","20 日","30 日","45 日"],"a":2,"e":"施行細則 §94：無初驗程序者，機關應於**三十日**內辦理驗收。","r":"A0030058#94"},{"c":"p","q":"廠商應於工程預定竣工日前或竣工當日書面通知監造單位及機關後，機關應於收到通知之日起幾日內會同核對竣工項目及數量？","o":["3 日","7 日","14 日","30 日"],"a":1,"e":"施行細則 §92Ⅰ：機關應於收到書面通知之日起**七日**內會同監造單位及廠商核對竣工項目及數量。","r":"A0030058#92"},{"c":"p","q":"機關辦理驗收，廠商未依通知派代表參加者，其效果為何？","o":["應延期辦理","仍得為之","視為驗收合格","應重新通知三次"],"a":1,"e":"施行細則 §96Ⅱ：機關辦理驗收，廠商未依通知派代表參加者，**仍得為之**；驗收前之檢查、檢驗、查驗或初驗亦同。","r":"A0030058#96"},{"c":"p","q":"機關辦理工程採購之付款，定期估驗或分階段付款者，應於廠商提出證明文件後幾日內完成審核程序？","o":["7 日","10 日","15 日","30 日"],"a":2,"e":"§73-1Ⅰ①：應於廠商提出估驗或階段完成之證明文件後**十五日**內完成審核程序，並於接到請款單據後**十五日**內付款。","r":"A0030057#73-1"},{"c":"p","q":"機關辦理工程採購付款，應向上級機關申請核撥補助款者，其付款期限為幾日？","o":["15 日","20 日","30 日","45 日"],"a":2,"e":"§73-1Ⅰ③：應向上級機關申請核撥補助款者，為**三十日**。","r":"A0030057#73-1"},{"c":"p","q":"§73-1 所稱付款及審核程序之日數，其計算方式為何？","o":["指日曆天","指實際工作日，不包括例假日、特定假日及退請受款人補正之日數","指工作日但包括例假日","由契約自行約定"],"a":1,"e":"§73-1Ⅱ：係指**實際工作日**，不包括例假日、特定假日及退請受款人補正之日數。","r":"A0030057#73-1"},{"c":"p","q":"機關辦理付款及審核程序，發現廠商文件不符、不足或有疑義而需補正或澄清者，應如何？","o":["得分次通知","應一次通知澄清或補正，不得分次辦理","應退回重新申請","應逕行拒絕付款"],"a":1,"e":"§73-1Ⅲ：應**一次通知**澄清或補正，**不得分次辦理**。","r":"A0030057#73-1"},{"c":"p","q":"機關辦理工程規劃、設計，關於安全衛生之義務為何？","o":["由廠商自行負責","應分析潛在施工危險，編製符合職業安全衛生法規之安全衛生圖說及規範，並量化編列安全衛生費用","僅須於契約中要求廠商注意","僅巨額採購有此義務"],"a":1,"e":"§70-1Ⅰ：應依工程規模及特性分析潛在施工危險，編製安全衛生圖說及規範，並**量化編列安全衛生費用**。","r":"A0030057#70-1"},{"c":"p","q":"工程、財物採購經驗收完畢後，應由何人於結算驗收證明書上簽認？","o":["僅主驗人","驗收及監驗人員分別簽認","機關首長","廠商代表"],"a":1,"e":"§73Ⅰ：應由**驗收及監驗人員**於結算驗收證明書上分別簽認；勞務驗收準用之。","r":"A0030057#73"},{"c":"p","q":"機關依 §72Ⅰ 通知廠商限期改善，該限期於契約未規定時由何人定之？","o":["機關首長","主驗人","監造單位","廠商"],"a":1,"e":"施行細則 §97Ⅱ：前項限期，契約未規定者，由**主驗人**定之。","r":"A0030058#97"},{"c":"p","q":"機關依 §72Ⅰ 辦理部分驗收，其支付之部分價金有何限制？","o":["得支付全部價金","以支付該部分驗收項目者為限，並得視不符部分之情形酌予保留","不得支付任何價金","應支付百分之八十"],"a":1,"e":"施行細則 §98Ⅰ：以支付該部分驗收項目者為限，並**得視不符部分之情形酌予保留**。","r":"A0030058#98"},{"c":"p","q":"得標廠商於國內員工總人數逾一百人者，應於履約期間僱用身心障礙者及原住民之比例為何？","o":["不得低於總人數 1%","不得低於總人
