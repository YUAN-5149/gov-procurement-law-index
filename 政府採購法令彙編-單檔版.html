開標程序、負責開標現場處置及有關決定。","二、承辦開標人員：辦理開標作業及製作紀錄等事項。","主持開標人員，由機關首長或其授權人員指派適當人員擔任。","主持開標人員得兼任承辦開標人員。","承辦審標、評審或評選事項之人員，必要時得協助開標。","有監辦開標人員者，其工作事項為監視開標程序。","機關辦理比價、議價或決標，準用前五項規定。"]},{"no":"51","label":"第51條","ch":"第三章決標","cat":"d","lines":["機關辦理開標時應製作紀錄，記載下列事項，由辦理開標人員會同簽認；有監辦開標人員者，亦應會同簽認：","一、有案號者，其案號。","二、招標標的之名稱及數量摘要。","三、投標廠商名稱。","四、有標價者，各投標廠商之標價。","五、開標日期。","六、其他必要事項。","流標時應製作紀錄，其記載事項，準用前項規定，並應記載流標原因。"]},{"no":"52","label":"第52條","ch":"第三章決標","cat":"d","lines":["機關訂定底價，得基於技術、品質、功能、履約地、商業條款、評分或使用效益等差異，訂定不同之底價。"]},{"no":"53","label":"第53條","ch":"第三章決標","cat":"d","lines":["機關訂定底價，應由規劃、設計、需求或使用單位提出預估金額及其分析後，由承辦採購單位簽報機關首長或其授權人員核定。但重複性採購或未達公告金額之採購，得由承辦採購單位逕行簽報核定。"]},{"no":"54","label":"第54條","ch":"第三章決標","cat":"d","lines":["公開招標採分段開標者，其底價應於第一階段開標前定之。","限制性招標之比價，其底價應於辦理比價之開標前定之。","限制性招標之議價，訂定底價前應先參考廠商之報價或估價單。","依本法第四十九條採公開取得三家以上廠商之書面報價或企劃書者，其底價應於進行比價或議價前定之。"]},{"no":"54-1","label":"第54-1條","ch":"第三章決標","cat":"d","lines":["機關辦理採購，依本法第四十七條第一項第一款及第二款規定不訂底價者，得於招標文件預先載明契約金額或相關費率作為決標條件。"]},{"no":"55","label":"第55條","ch":"第三章決標","cat":"d","lines":["本法第四十八條第一項所稱三家以上合格廠商投標，指機關辦理公開招標，有三家以上廠商投標，且符合下列規定者：","一、依本法第三十三條規定將投標文件送達於招標機關或其指定之場所。","二、無本法第五十條第一項規定不予開標之情形。","三、無第三十三條第一項及第二項規定不予開標之情形。","四、無第三十八條第一項規定不得參加投標之情形。"]},{"no":"56","label":"第56條","ch":"第三章決標","cat":"d","lines":["廢標後依原招標文件重行招標者，準用本法第四十八條第二項關於第二次招標之規定。"]},{"no":"57","label":"第57條","ch":"第三章決標","cat":"d","lines":["機關辦理公開招標，因投標廠商家數未滿三家而流標者，得發還投標文件。廠商要求發還者，機關不得拒絕。","機關於開標後因故廢標，廠商要求發還投標文件者，機關得保留其中一份，其餘發還，或僅保留影本。採分段開標者，尚未開標之部分應予發還。"]},{"no":"58","label":"第58條","ch":"第三章決標","cat":"d","lines":["機關依本法第五十條第二項規定撤銷決標或解除契約時，得依下列方式之一續行辦理：","一、重行辦理招標。","二、原係採最低標為決標原則者，得以原決標價依決標前各投標廠商標價之順序，自標價低者起，依序洽其他合於招標文件規定之未得標廠商減至該決標價後決標。其無廠商減至該決標價者，得依本法第五十二條第一項第一款、第二款及招標文件所定決標原則辦理決標。","三、原係採最有利標為決標原則者，得召開評選委員會會議，依招標文件規定重行辦理評選。","四、原係採本法第二十二條第一項第九款至第十一款規定辦理者，其評選為優勝廠商或經勘選認定適合需要者有二家以上，得依序遞補辦理議價。","前項規定，於廠商得標後放棄得標、拒不簽約或履約、拒繳保證金或拒提供擔保等情形致撤銷決標、解除契約者，準用之。"]},{"no":"59","label":"第59條","ch":"第三章決標","cat":"d","lines":["機關發現廠商投標文件所標示之分包廠商，於截止投標或截止收件期限前屬本法第一百零三條第一項規定期間內不得參加投標或作為決標對象或分包廠商之廠商者，應不決標予該投標廠商。","廠商投標文件所標示之分包廠商，於投標後至決標前方屬本法第一百零三條第一項規定期間內不得參加投標或作為決標對象或分包廠商之廠商者，得依原標價以其他合於招標文件規定之分包廠商代之，並通知機關。","機關於決標前發現廠商有前項情形者，應通知廠商限期改正；逾期未改正者，應不決標予該廠商。"]},{"no":"60","label":"第60條","ch":"第三章決標","cat":"d","lines":["機關審查廠商投標文件，發現其內容有不明確、不一致或明顯打字或書寫錯誤之情形者，得通知投標廠商提出說明，以確認其正確之內容。","前項文件內明顯打字或書寫錯誤，與標價無關，機關得允許廠商更正。"]},{"no":"61","label":"第61條","ch":"第三章決標","cat":"d","lines":["機關依本法第五十一條第二項規定將審查廠商投標文件之結果通知各該廠商者，應於審查結果完成後儘速通知，最遲不得逾決標或廢標日十日。","前項通知，經廠商請求者，得以書面為之。"]},{"no":"62","label":"第62條","ch":"第三章決標","cat":"d","lines":["機關採最低標決標者，二家以上廠商標價相同，且均得為決標對象時，其比減價格次數已達本法第五十三條或第五十四條規定之三次限制者，逕行抽籤決定之。","前項標價相同，其比減價格次數未達三次限制者，應由該等廠商再行比減價格一次，以低價者決標。比減後之標價仍相同者，抽籤決定之。"]},{"no":"63","label":"第63條","ch":"第三章決標","cat":"d","lines":["機關採最低標決標，廠商之標價依招標文件規定之計算方式，有依投標標的之性能、耐用年限、保固期、能源使用效能或維修費用等之差異，就標價予以加價或減價以定標價之高低序位者，以加價或減價後之標價決定最低標。"]},{"no":"64","label":"第64條","ch":"第三章決標","cat":"d","lines":["投標廠商之標價幣別，依招標文件規定在二種以上者，由機關擇其中一種或以新台幣折算總價，以定標序及計算是否超過底價。","前項折算總價，依辦理決標前一辦公日臺灣銀行外匯交易收盤即期賣出匯率折算之。"]},{"no":"64-1","label":"第64-1條","ch":"第三章決標","cat":"d","lines":["機關依本法第五十二條第一項第一款或第二款規定採最低標決標，其因履約期間數量不確定而於招標文件規定以招標標的之單價決定最低標者，並應載明履約期間預估需求數量。招標標的在二項以上而未採分項決標者，並應以各項單價及其預估需求數量之乘積加總計算，決定最低標。"]},{"no":"64-2","label":"第64-2條","ch":"第三章決標","cat":"d","lines":["機關依本法第五十二條第一項第一款或第二款辦理採購，得於招標文件訂定評分項目、各項配分、及格分數等審查基準，並成立審查委員會及工作小組，採評分方式審查，就資格及規格合於招標文件規定，且總平均評分在及格分數以上之廠商開價格標，採最低標決標。","依前項方式辦理者，應依下列規定辦理：","一、分段開標，最後一段為價格標。","二、評分項目不包括價格。","三、審查委員會及工作小組之組成、任務及運作，準用採購評選委員會組織準則、採購評選委員會審議規則及最有利標評選辦法之規定。"]},{"no":"65","label":"第65條","ch":"第三章決標","cat":"d","lines":["機關依本法第五十二條第一項第四款採用複數決標方式者，應依下列原則辦理：","一、招標文件訂明得由廠商分項報價之項目，或依不同數量報價之項目及數量之上、下限。","二、訂有底價之採購，其底價依項目或數量分別訂定。","三、押標金、保證金及其他擔保得依項目或數量分別繳納。","四、得分項報價者，分項決標；得依不同數量報價者，依標價及可決標之數量依序決標，並得有不同之決標價。","五、分項決標者，得分項簽約及驗收；依不同數量決標者，得分別簽約及驗收。"]},{"no":"66","label":"第66條","ch":"第三章決標","cat":"d","lines":["（刪除）"]},{"no":"67","label":"第67條","ch":"第三章決標","cat":"d","lines":["機關辦理決標，合於決標原則之廠商無需減價或已完成減價或綜合評選程序者，得不通知投標廠商到場。"]},{"no":"68","label":"第68條","ch":"第三章決標","cat":"d","lines":["機關辦理決標時應製作紀錄，記載下列事項，由辦理決標人員會同簽認；有監辦決標人員或有得標廠商代表參加者，亦應會同簽認：","一、有案號者，其案號。","二、決標標的之名稱及數量摘要。","三、審標結果。","四、得標廠商名稱。","五、決標金額。","六、決標日期。","七、有減價、比減價格、協商或綜合評選者，其過程。","八、超底價決標者，超底價之金額、比率及必須決標之緊急情事。","九、所依據之決標原則。","十、有尚未解決之異議或申訴事件者，其處理情形。","廢標時應製作紀錄，其記載事項，準用前項規定，並應記載廢標原因。"]},{"no":"69","label":"第69條","ch":"第三章決標","cat":"d","lines":["機關辦理減價或比減價格結果在底價以內時，除有本法第五十八條總標價或部分標價偏低之情形者外，應即宣布決標。"]},{"no":"70","label":"第70條","ch":"第三章決標","cat":"d","lines":["機關於第一次比減價格前，應宣布最低標廠商減價結果；第二次以後比減價格前，應宣布前一次比減價格之最低標價。","機關限制廠商比減價格或綜合評選之次數為一次或二次者，應於招標文件中規定或於比減價格或採行協商措施前通知參加比減價格或協商之廠商。","參加比減價格或協商之廠商有下列情形之一者，機關得不通知其參加下一次之比減價格或協商：","一、未能減至機關所宣布之前一次減價或比減價格之最低標價。","二、依本法第六十條規定視同放棄。"]},{"no":"71","label":"第71條","ch":"第三章決標","cat":"d","lines":["機關辦理查核金額以上之採購，擬決標之最低標價超過底價百分之四未逾百分之八者，得先保留決標，並應敘明理由連同底價、減價經過及報價比較表或開標紀錄等相關資料，報請上級機關核准。","前項決標，上級機關派員監辦者，得由監辦人員於授權範圍內當場予以核准，或由監辦人員簽報核准之。"]},{"no":"72","label":"第72條","ch":"第三章決標","cat":"d","lines":["機關依本法第五十三條第一項及第五十四條規定辦理減價及比減價格，參與之廠商應書明減價後之標價。","合於招標文件規定之投標廠商僅有一家或採議價方式辦理採購，廠商標價超過底價或評審委員會建議之金額，經洽減結果，廠商書面表示減至底價或評審委員會建議之金額，或照底價或評審委員會建議之金額再減若干數額者，機關應予接受。比減價格時，僅餘一家廠商書面表示減價者，亦同。"]},{"no":"73","label":"第73條","ch":"第三章決標","cat":"d","lines":["合於招標文件規定之投標廠商僅有一家或採議價方式辦理，須限制減價次數者，應先通知廠商。","前項減價結果，適用本法第五十三條第二項超過底價而不逾預算數額需決標，或第五十四條逾評審委員會建議之金額或預算金額應予廢標之規定。"]},{"no":"74","label":"第74條","ch":"第三章決標","cat":"d","lines":["決標依本法第五十二條第一項第二款規定辦理者，除小額採購外，應成立評審委員會，其成員由機關首長或其授權人員就對於採購標的之價格具有專門知識之機關職員或公正人士派兼或聘兼之。","前項評審委員會之成立時機，準用本法第四十六條第二項有關底價之訂定時機。","第一項評審委員會，機關得以本法第九十四條成立之評選委員會代之。"]},{"no":"75","label":"第75條","ch":"第三章決標","cat":"d","lines":["決標依本法第五十二條第一項第二款規定辦理且設有評審委員會者，應先審查合於招標文件規定之最低標價後，再由評審委員會提出建議之金額。但標價合理者，評審委員會得不提出建議之金額。","評審委員會提出建議之金額，機關依本法第五十四條規定辦理減價或比減價格結果在建議之金額以內時，除有本法第五十八條總標價或部分標價偏低之情形外，應即宣布決標。","第一項建議之金額，於決標前應予保密，決標後除有第三十五條之情形者外，應予公開。"]},{"no":"76","label":"第76條","ch":"第三章決標","cat":"d","lines":["本法第五十七條第一款所稱審標，包括評選及洽個別廠商協商。","本法第五十七條第一款應保密之內容，決標後應即解密。但有繼續保密之必要者，不在此限。","本法第五十七條第一款之適用範圍，不包括依本法第五十五條規定採行協商措施前之採購作業。"]},{"no":"77","label":"第77條","ch":"第三章決標","cat":"d","lines":["機關依本法第五十七條規定採行協商措施時，參與協商之廠商依據協商結果重行遞送之投標文件，其有與協商無關或不受影響之項目者，該項目應不予評選，並以重行遞送前之內容為準。"]},{"no":"78","label":"第78條","ch":"第三章決標","cat":"d","lines":["機關採行協商措施，應注意下列事項：","一、列出協商廠商之待協商項目，並指明其優點、缺點、錯誤或疏漏之處。","二、擬具協商程序。","三、參與協商人數之限制。","四、慎選協商場所。","五、執行保密措施。","六、與廠商個別進行協商。","七、不得將協商廠商投標文件內容、優缺點及評分，透露於其他廠商。","八、協商應作成紀錄。"]},{"no":"79","label":"第79條","ch":"第三章決標","cat":"d","lines":["本法第五十八條所稱總標價偏低，指下列情形之一：","一、訂有底價之採購，廠商之總標價低於底價百分之八十者。","二、未訂底價之採購，廠商之總標價經評審或評選委員會認為偏低者。","三、未訂底價且未設置評審委員會或評選委員會之採購，廠商之總標價低於預算金額或預估需用金額之百分之七十者。預算案尚未經立法程序者，以預估需用金額計算之。"]},{"no":"80","label":"第80條","ch":"第三章決標","cat":"d","lines":["本法第五十八條所稱部分標價偏低，指下列情形之一：","一、該部分標價有對應之底價項目可供比較，該部分標價低於相同部分項目底價之百分之七十者。","二、廠商之部分標價經評審或評選委員會認為偏低者。","三、廠商之部分標價低於其他機關最近辦理相同採購決標價之百分之七十者。","四、廠商之部分標價低於可供參考之一般價格之百分之七十者。"]},{"no":"81","label":"第81條","ch":"第三章決標","cat":"d","lines":["廠商投標文件內記載金額之文字與號碼不符時，以文字為準。"]},{"no":"82","label":"第82條","ch":"第三章決標","cat":"d","lines":["本法第五十九條第一項不適用於因正當商業行為所為之給付。"]},{"no":"83","label":"第83條","ch":"第三章決標","cat":"d","lines":["廠商依本法第六十條規定視同放棄說明、減價、比減價格、協商、更改原報內容或重新報價，其不影響該廠商成為合於招標文件規定之廠商者，仍得以該廠商為決標對象。","依本法第六十條規定視同放棄而未決標予該廠商者，仍應發還押標金。"]},{"no":"84","label":"第84條","ch":"第三章決標","cat":"d","lines":["本法第六十一條所稱特殊情形，指符合下列情形之一：","一、為商業性轉售或用於製造產品、提供服務以供轉售目的所為之採購，其決標內容涉及商業機密，經機關首長或其授權人員核准者。","二、有本法第一百零四條第一項第二款情形者。","三、前二款以外之機密採購。","四、其他經主管機關認定者。","前項第一款決標內容涉及商業機密者，機關得不將決標內容納入決標結果之公告及對各投標廠商之書面通知。僅部分內容涉及商業機密者，其餘部分仍應公告及通知。","本法第六十一條所稱決標後一定期間，為自決標日起三十日。","依本法第六十一條規定未將決標結果之公告刊登於政府採購公報，或僅刊登一部分者，機關仍應將完整之決標資料傳送至主管機關指定之電腦資料庫，或依本法第六十二條規定定期彙送主管機關。"]},{"no":"85","label":"第85條","ch":"第三章決標","cat":"d","lines":["機關依本法第六十一條規定將決標結果以書面通知各投標廠商者，其通知應包括下列事項：","一、有案號者，其案號。","二、決標標的之名稱及數量摘要。","三、得標廠商名稱。","四、決標金額。","五、決標日期。","無法決標者，機關應以書面通知各投標廠商無法決標之理由。"]},{"no":"86","label":"第86條","ch":"第三章決標","cat":"d","lines":["本法第六十二條規定之決標資料，機關應利用電腦蒐集程式傳送至主管機關指定之電腦資料庫。","決標結果已依本法第六十一條規定於一定期間內將決標金額傳送至主管機關指定之電腦資料庫者，得免再行傳送。"]},{"no":"87","label":"第87條","ch":"第四章履約管理","cat":"p","lines":["本法第六十五條第二項所稱主要部分，指下列情形之一：","一、招標文件標示為主要部分者。","二、招標文件標示或依其他法規規定應由得標廠商自行履行之部分。"]},{"no":"88","label":"第88條","ch":"第四章履約管理","cat":"p","lines":["（刪除）"]},{"no":"89","label":"第89條","ch":"第四章履約管理","cat":"p","lines":["機關得視需要於招標文件中訂明得標廠商應將專業部分或達一定數量或金額之分包情形送機關備查。"]},{"no":"90","label":"第90條","ch":"第五章驗收","cat":"p","lines":["機關依本法第七十一條第一項規定辦理下列工程、財物採購之驗收，得由承辦採購單位備具書面憑證採書面驗收，免辦理現場查驗：","一、公用事業依一定費率所供應之財物。","二、即買即用或自供應至使用之期間甚為短暫，現場查驗有困難者。","三、小額採購。","四、分批或部分驗收，其驗收金額不逾公告金額十分之一。","五、經政府機關或公正第三人查驗，並有相關品質或數量之證明文書者。","六、其他經主管機關認定者。","前項第四款情形於各批或全部驗收完成後，應將各批或全部驗收結果彙總填具結算驗收證明書。"]},{"no":"90-1","label":"第90-1條","ch":"第五章驗收","cat":"p","lines":["勞務驗收，得以書面或召開審查會方式辦理；其書面驗收文件或審查會紀錄，得視為驗收紀錄。"]},{"no":"91","label":"第91條","ch":"第五章驗收","cat":"p","lines":["機關辦理驗收人員之分工如下：","一、主驗人員：主持驗收程序，抽查驗核廠商履約結果有無與契約、圖說或貨樣規定不符，並決定不符時之處置。","二、會驗人員：會同抽查驗核廠商履約結果有無與契約、圖說或貨樣規定不符，並會同決定不符時之處置。但採購事項單純者得免之。","三、協驗人員：協助辦理驗收有關作業。但採購事項單純者得免之。","會驗人員，為接管或使用機關（單位）人員。","協驗人員，為設計、監造、承辦採購單位人員或機關委託之專業人員或機構人員。","法令或契約載有驗收時應辦理丈量、檢驗或試驗之方法、程序或標準者，應依其規定辦理。","有監驗人員者，其工作事項為監視驗收程序。"]},{"no":"92","label":"第92條","ch":"第五章驗收","cat":"p","lines":["廠商應於工程預定竣工日前或竣工當日，將竣工日期書面通知監造單位及機關。除契約另有規定者外，機關應於收到該書面通知之日起七日內會同監造單位及廠商，依據契約、圖說或貨樣核對竣工之項目及數量，確定是否竣工；廠商未依機關通知派代表參加者，仍得予確定。","工程竣工後，除契約另有規定者外，監造單位應於竣工後七日內，將竣工圖表、工程結算明細表及契約規定之其他資料，送請機關審核。有初驗程序者，機關應於收受全部資料之日起三十日內辦理初驗，並作成初驗紀錄。","財物或勞務採購有初驗程序者，準用前二項規定。"]},{"no":"93","label":"第93條","ch":"第五章驗收","cat":"p","lines":["採購之驗收，有初驗程序者，初驗合格後，除契約另有規定者外，機關應於二十日內辦理驗收，並作成驗收紀錄。"]},{"no":"94","label":"第94條","ch":"第五章驗收","cat":"p","lines":["採購之驗收，無初驗程序者，除契約另有規定者外，機關應於接獲廠商通知備驗或可得驗收之程序完成後三十日內辦理驗收，並作成驗收紀錄。"]},{"no":"95","label":"第95條","ch":"第五章驗收","cat":"p","lines":["前三條所定期限，其有特殊情形必須延期者，應經機關首長或其授權人員核准。"]},{"no":"96","label":"第96條","ch":"第五章驗收","cat":"p","lines":["機關依本法第七十二條第一項規定製作驗收之紀錄，應記載下列事項，由辦理驗收人員會同簽認。有監驗人員或有廠商代表參加者，亦應會同簽認：","一、有案號者，其案號。","二、驗收標的之名稱及數量。","三、廠商名稱。","四、履約期限。","五、完成履約日期。","六、驗收日期。","七、驗收結果。","八、驗收結果與契約、圖說、貨樣規定不符者，其情形。","九、其他必要事項。","機關辦理驗收，廠商未依通知派代表參加者，仍得為之。驗收前之檢查、檢驗、查驗或初驗，亦同。"]},{"no":"97","label":"第97條","ch":"第五章驗收","cat":"p","lines":["機關依本法第七十二條第一項通知廠商限期改善、拆除、重作或換貨，廠商於期限內完成者，機關應再行辦理驗收。","前項限期，契約未規定者，由主驗人定之。"]},{"no":"98","label":"第98條","ch":"第五章驗收","cat":"p","lines":["機關依本法第七十二條第一項辦理部分驗收，其所支付之部分價金，以支付該部分驗收項目者為限，並得視不符部分之情形酌予保留。","機關依本法第七十二條第二項辦理減價收受，其減價計算方式，依契約規定。契約未規定者，得就不符項目，依契約價金、市價、額外費用、所受損害或懲罰性違約金等，計算減價金額。"]},{"no":"99","label":"第99條","ch":"第五章驗收","cat":"p","lines":["機關辦理採購，有部分先行使用之必要或已履約之部分有減損滅失之虞者，應先就該部分辦理驗收或分段查驗供驗收之用，並得就該部分支付價金及起算保固期間。"]},{"no":"100","label":"第100條","ch":"第五章驗收","cat":"p","lines":["驗收人對工程或財物隱蔽部分拆驗或化驗者，其拆除、修復或化驗費用之負擔，依契約規定。契約未規定者，拆驗或化驗結果與契約規定不符，該費用由廠商負擔；與規定相符者，該費用由機關負擔。"]},{"no":"101","label":"第101條","ch":"第五章驗收","cat":"p","lines":["公告金額以上之工程或財物採購，除符合第九十條第一項第一款或其他經主管機關認定之情形者外，應填具結算驗收證明書或其他類似文件。未達公告金額之工程或財物採購，得由機關視需要填具之。","前項結算驗收證明書或其他類似文件，機關應於驗收完畢後十五日內填具，並經主驗及監驗人員分別簽認。但有特殊情形必須延期，經機關首長或其授權人員核准者，不在此限。"]},{"no":"102","label":"第102條","ch":"第六章爭議處理","cat":"r","lines":["廠商依本法第七十五條第一項規定以書面向招標機關提出異議，應以中文書面載明下列事項，由廠商簽名或蓋章，提出於招標機關。其附有外文資料者，應就異議有關之部分備具中文譯本。但招標機關得視需要通知其檢具其他部分之中文譯本：","一、廠商之名稱、地址、電話及負責人之姓名。","二、有代理人者，其姓名、性別、出生年月日、職業、電話及住所或居所。","三、異議之事實及理由。","四、受理異議之機關。","五、年、月、日。","前項廠商在我國無住所、事務所或營業所者，應委任在我國有住所、事務所或營業所之代理人為之。","異議不合前二項規定者，招標機關得不予受理。但其情形可補正者，應定期間命其補正；逾期不補正者，不予受理。"]},{"no":"103","label":"第103條","ch":"第六章爭議處理","cat":"r","lines":["機關處理異議，得通知提出異議之廠商到指定場所陳述意見。"]},{"no":"104","label":"第104條","ch":"第六章爭議處理","cat":"r","lines":["本法第七十五條第一項第二款及第三款所定期限之計算，其經機關通知及公告者，廠商接獲通知之日與機關公告之日不同時，以日期在後者起算。"]},{"no":"104-1","label":"第104-1條","ch":"第六章爭議處理","cat":"r","lines":["異議及申訴之提起，分別以受理異議之招標機關及受理申訴之採購申訴審議委員會收受書狀之日期為準。","廠商誤向非管轄之機關提出異議或申訴者，以該機關收受之日，視為提起之日。"]},{"no":"105","label":"第105條","ch":"第六章爭議處理","cat":"r","lines":["異議逾越法定期間者，應不予受理，並以書面通知提出異議之廠商。"]},{"no":"105-1","label":"第105-1條","ch":"第六章爭議處理","cat":"r","lines":["招標機關處理異議為不受理之決定時，仍得評估其事由，於認其異議有理由時，自行撤銷或變更原處理結果或暫停採購程序之進行。"]},{"no":"106","label":"第106條","ch":"第六章爭議處理","cat":"r","lines":["（刪除）"]},{"no":"107","label":"第107條","ch":"第七章附則","cat":"s","lines":["本法第九十八條所稱國內員工總人數，依身心障礙者權益保障法第三十八條第三項規定辦理，並以投保單位為計算基準；所稱履約期間，自訂約日起至廠商完成履約事項之日止。但下列情形，應另計之：","一、訂有開始履約日或開工日者，自該日起算。兼有該二日者，以日期在後者起算。","二、因機關通知全面暫停履約之期間，不予計入。","三、一定期間內履約而日期未預先確定，依機關通知再行履約者，依實際履約日數計算。","依本法第九十八條計算得標廠商於履約期間應僱用之身心障礙者及原住民之人數時，各應達國內員工總人數百分之一，並均以整數為計算標準，未達整數部分不予計入。"]},{"no":"108","label":"第108條","ch":"第七章附則","cat":"s","lines":["得標廠商僱用身心障礙者及原住民之人數不足前條第二項規定者，應於每月十日前依僱用人數不足之情形，分別向所在地之直轄市或縣（市）勞工主管機關設立之身心障礙者就業基金專戶及原住民中央主管機關設立之原住民族就業基金專戶，繳納上月之代金。","前項代金之金額，依差額人數乘以每月基本工資計算；不足一月者，每日以每月基本工資除以三十計。"]},{"no":"109","label":"第109條","ch":"第七章附則","cat":"s","lines":["機關依本法第九十九條規定甄選投資興建、營運之廠商，其係以廠商承諾給付機關價金為決標原則者，得於招標文件規定以合於招標文件規定之下列廠商為得標廠商：","一、訂有底價者，在底價以上之最高標廠商。","二、未訂底價者，標價合理之最高標廠商。","三、以最有利標決標者，經機關首長或評選委員會過半數之決定所評定之最有利標廠商。","四、採用複數決標者，合於最高標或最有利標之競標精神者。","機關辦理採購，招標文件規定廠商報價金額包括機關支出及收入金額，或以使用機關財物或權利為對價而無其他支出金額，其以廠商承諾給付機關價金為決標原則者，準用前項規定。"]},{"no":"109-1","label":"第109-1條","ch":"第七章附則","cat":"s","lines":["機關依本法第一百零一條第三項規定給予廠商陳述意見之機會，應以書面告知，廠商於送達之次日起十日內，以書面或口頭向機關陳述意見。","廠商依本法第一百零一條第三項規定以口頭方式向機關陳述意見時，應至機關指定場所陳述，機關應以文字、錄音或錄影等方式記錄。","機關依本法第一百零一條第一項規定將其事實、理由及依第一百零三條第一項所定期間通知廠商時，應附記廠商如認為機關所為之通知違反本法或不實者，得於接獲通知之次日起二十日內，以書面向招標機關提出異議；未提出異議者，將刊登政府採購公報。","機關依本法第一百零二條規定將異議處理結果以書面通知提出異議之廠商時，應附記廠商如對該處理結果不服，得於收受異議處理結果之次日起十五日內，以書面向採購申訴審議委員會提出申訴。"]},{"no":"110","label":"第110條","ch":"第七章附則","cat":"s","lines":["廠商有本法第一百零一條第一項第六款之情形，經判決無罪確定者，自判決確定之日起，得參加投標及作為決標對象或分包廠商。"]},{"no":"111","label":"第111條","ch":"第七章附則","cat":"s","lines":["（刪除）"]},{"no":"112","label":"第112條","ch":"第七章附則","cat":"s","lines":["（刪除）"]},{"no":"112-1","label":"第112-1條","ch":"第七章附則","cat":"s","lines":["本法第一百零三條第一項第三款所定通知日，為機關通知廠商有本法第一百零一條第一項各款情形之一之發文日期。","本法第一百零三條第二項所稱特殊需要，指符合下列情形之一，且基於公共利益考量確有必要者：","一、有本法第二十二條第一項第一款、第二款、第四款或第六款情形之一者。","二、依本法第五十三條或第五十四條規定辦理減價結果，廢標二次以上，且未調高底價或建議減價金額者。","三、依本法第一百零五條第一項第一款或第二款辦理者。","四、其他經主管機關認定者。"]},{"no":"112-2","label":"第112-2條","ch":"第七章附則","cat":"s","lines":["本法第一百零七條所稱採購之文件，指採購案件自機關開始計劃至廠商完成契約責任期間所產生之各類文字或非文字紀錄資料及其附件。"]},{"no":"113","label":"第113條","ch":"第七章附則","cat":"s","lines":["本細則自中華民國八十八年五月二十七日施行。","本細則修正條文自發布日施行。"]}]},{"id":"A0030065","title":"政府採購公告及公報發行辦法","short":"公告及公報辦法","date":"民國97年05月20日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030065","articles":[{"no":"1","label":"第1條","ch":"","cat":"b","lines":["本辦法依政府採購法（以下簡稱本法）第二十七條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"b","lines":["政府採購公報（以下簡稱採購公報），由主管機關發行，並得以電子化方式為之。","前項發行工作，主管機關得委託機關（構）或廠商辦理。"]},{"no":"3","label":"第3條","ch":"","cat":"b","lines":["採購公報除星期例假日、放假日及特殊情形外，按日發行。"]},{"no":"4","label":"第4條","ch":"","cat":"b","lines":["下列政府採購資訊應刊登採購公報一日，並公開於主管機關之政府採購資訊網站（以下簡稱採購網站）：","一、本法第二十二條第一項第九款至第十一款、第十四款規定之公開評選、公開徵求或審查之公告。","二、本法第二十七條第一項規定之招標公告及辦理資格審查之公告。","三、本法第四十一條第二項規定之變更或補充招標文件內容之公告及必要之釋疑公告。","四、本法第六十一條規定之決標結果或無法決標之公告。","五、本法第七十五條第二項規定應另行辦理之變更或補充招標文件內容之公告。","六、本法第一百零二條第三項規定之廠商名稱與相關情形。","七、本法第一百零三條第一項規定之註銷公告。","八、本法第一百十一條第二項規定之年度重大採購事件之效益評估。","九、我國締結之條約或協定規定公告之事項。","十、前列各款之更正公告。","前項第九款公告之事項，我國締結之條約或協定未規定應刊登採購公報者，得僅公開於採購網站。"]},{"no":"5","label":"第5條","ch":"","cat":"b","lines":["下列政府採購資訊應公開於採購網站，必要時並得刊登採購公報：","一、機關委託研究發展作業辦法第四條第二項規定之公告。","二、本法第三十四條第一項但書規定之公開說明或公開徵求廠商提供參考資料之公告。","三、本法第四十九條公開取得廠商書面報價或企劃書之公告。","四、本法第一百條第二項多餘不用堪用財物之無償讓與公告。","五、本法施行細則第二十一條第二項第二款邀請所有符合資格廠商投標之公告。","六、其他經主管機關指定者。"]},{"no":"6","label":"第6條","ch":"","cat":"b","lines":["下列資訊得公開於採購網站，必要時並得刊登採購公報：","一、本法第八十二條第一項採購申訴審議委員會之審議判斷。","二、本法第八十五條之一採購申訴審議委員會之調解文書。","三、未達公告金額採購之決標公告。","四、與政府採購有關之法令、司法裁判、訴願決定、仲裁判斷或宣導資訊。","五、財物之變賣或出租公告。","六、須為公示送達而刊登之政府採購有關文書或其節本。","七、其他與政府採購有關之資訊。"]},{"no":"7","label":"第7條","ch":"","cat":"b","lines":["依本法第二十七條第一項規定辦理之招標公告，應登載下列事項：","一、有案號者，其案號。","二、機關之名稱、地址、聯絡人（或單位）及聯絡電話。","三、招標標的之名稱及數量摘要。有保留未來後續擴充之權利者，其擴充之期間、金額或數量。","四、招標文件之領取地點、方式、售價及購買該文件之付款方式。","五、收受投標文件之地點及截止期限。","六、公開開標者，其時間及地點。","七、須押標金者，其額度。","八、履約期限。","九、投標文件應使用之文字。","十、招標與決標方式及是否可能採行協商措施。","十一、是否屬公告金額以上之採購。","十二、是否適用我國所締結之條約或協定。","十三、廠商資格條件摘要。","十四、財物採購，其性質係購買、租賃、定製或兼具二種以上之性質。","十五、是否屬公共工程實施技師簽證者。","十六、其他經主管機關指定者。"]},{"no":"8","label":"第8條","ch":"","cat":"b","lines":["下列政府採購公告應登載之事項，準用前條之規定：","一、依本法第二十二條第一項第九款至第十一款規定辦理公開評選或公開徵求之公告。","二、依本法第四十九條規定於採購公報公開邀請廠商提供書面報價或企劃書之公告。","三、依本法施行細則第二十一條第二項第二款規定邀請所有符合資格廠商投標之公告。"]},{"no":"9","label":"第9條","ch":"","cat":"b","lines":["依本法第二十七條第一項規定辦理資格審查之公告，以建立本法第二十一條合格廠商名單者，應登載下列事項：","一、有案號者，其案號。","二、機關之名稱、地址、聯絡人（或單位）及聯絡電話。","三、擬建立名單之名稱及未來將對名單廠商邀標之標的名稱或其類別。","四、辦理資格審查文件之領取地點、方式、售價及購買該文件之付款方式。","五、收受資格文件之地點及截止期限。","六、名單之有效期限及展期手續。","七、資格文件應使用之文字。","八、廠商列入該等名單所應符合之條件及機關查證各項條件之方法。","九、是否適用我國所締結之條約或協定。","十、是否屬公告金額以上之採購。","十一、是否屬公共工程實施技師簽證者。","十二、其他經主管機關指定者。","前項名單有效期限內之預估採購總額，得於公告中一併公開。"]},{"no":"10","label":"第10條","ch":"","cat":"b","lines":["依本法第二十七條第一項規定辦理資格審查之公告，以供個案採購使用者，應登載下列事項：","一、有案號者，其案號。","二、機關之名稱、地址、聯絡人（或單位）及聯絡電話。","三、擬向合格廠商邀標之標的名稱及數量摘要。若有保留未來後續擴充之權利者，其擴充之期間、金額或數量。","四、辦理資格審查文件之領取地點、方式、售價及購買該文件之付款方式。","五、收受資格文件之地點及截止期限。","六、公開開標者，其時間及地點。","七、資格文件應使用之文字。","八、廠商資格條件摘要。","九、是否適用我國所締結之條約或協定。","十、是否屬公告金額以上之採購。","十一、其他經主管機關指定者。"]},{"no":"11","label":"第11條","ch":"","cat":"b","lines":["機關依投標廠商資格與特殊或巨額採購認定標準第五條第三項規定辦理者，應於招標公告或招標文件公開預算金額。","機關辦理前項以外之公告金額以上採購，應於招標公告公開預算金額。但有下列情形之一者，不在此限：","一、轉售或供製造、加工後轉售之採購。","二、預算金額涉及商業機密。","三、機關認為不宜公開。","前二項以外之採購之預算及預計金額，得於招標公告中一併公開。"]},{"no":"12","label":"第12條","ch":"","cat":"b","lines":["依本法第四十一條第二項規定辦理變更或補充招標文件內容之公告及必要之釋疑公告，或本法第七十五條第二項規定應另行辦理之變更或補充招標文件內容之公告，應登載下列事項：","一、有案號者，其案號。","二、機關之名稱、地址、聯絡人（或單位）及聯絡電話。","三、採購標的之名稱及數量摘要。","四、變更或補充文件及必要之釋疑文件之領取地點、方式、售價及購買該文件之付款方式。","五、原刊登採購公報日期。","六、變更、補充、釋疑事項或其摘要。","七、其他經主管機關指定者。"]},{"no":"13","label":"第13條","ch":"","cat":"b","lines":["依本法第六十一條規定辦理決標結果之公告，應登載下列事項：","一、有案號者，其案號。","二、決標機關之名稱、地址、聯絡人（或單位）及聯絡電話。","三、決標標的之名稱及數量摘要。","四、決標日期。","五、得標廠商之名稱、地址及聯絡電話。","六、決標金額。以單價決標者，為單價乘以預估數量之總金額或預估採購總金額。","七、有底價或評審委員會建議之金額或預算金額，且應予公開者，其金額。不予公開者，其理由。","八、招標及決標方式。","九、有招標公告或辦理資格審查公告者，其刊登採購公報日期。","十、採限制性招標者，其依據之法條。","十一、採購金額。","十二、採最有利標或準用最有利標決標，得標廠商之總評分或總序位。","十三、其他經主管機關指定者。","以轉售為目的之採購，其決標金額涉及商業機密者，得不公告決標金額，但應附記不公告之理由。","採用複數決標之方式者，其每一次決標及不同標的或底價之項目，應分別刊登決標公告。","未達公告金額採購之決標公告，準用前三項之規定。"]},{"no":"14","label":"第14條","ch":"","cat":"b","lines":["機關依本法第六十二條規定彙送至主管機關之決標資料，除前條第一項規定應登載之事項外，應另包含下列事項：","一、投標廠商家數及未得標廠商名稱。","二、屬公共工程實施技師簽證者，其簽證範圍、項目及承辦技師科別、姓名、執業執照字號。","三、預估分包予中小企業之金額。","四、得標廠商於投標時在我國境內員工總人數逾一百人者，其總人數、僱用身心障礙者及原住民之人數。","五、其他經主管機關指定者。","公告金額十分之一以下之採購，得不適用前項規定。"]},{"no":"15","label":"第15條","ch":"","cat":"b","lines":["依本法第六十一條規定辦理無法決標之公告，應登載下列事項：","一、有案號者，其案號。","二、機關之名稱、地址、聯絡人（或單位）及聯絡電話。","三、招標標的之名稱及數量摘要。","四、所使用之招標方式。","五、無法決標之事由。","六、未來是否繼續辦理採購。","七、原招標公告或辦理資格審查公告之刊登採購公報日期。","八、其他經主管機關指定者。","前項公告，應於廢標後、重行招標前刊登，並不得超過廢標後二星期。","取消採購或未達公告金額採購無法決標之公告，準用前二項之規定。","本法第二十二條第一項第九款至第十一款規定之公開評選或公開徵求而無法決標之公告，準用前三項之規定。"]},{"no":"16","label":"第16條","ch":"","cat":"b","lines":["依本法第一百零二條第三項規定辦理廠商名稱與相關情形之公告，應登載下列事項：","一、有案號者，其案號。","二、機關之名稱、地址、聯絡人（或單位）及聯絡電話。","三、採購標的摘要。","四、廠商名稱及地址。","五、符合本法第一百零一條第一項各款所列之情形。","六、本法第一百零三條第一項規定之期間。","七、其他經主管機關指定者。"]},{"no":"17","label":"第17條","ch":"","cat":"b","lines":["依本法第一百零三條第一項規定辦理註銷之公告，應登載下列事項：","一、有案號者，其案號。","二、機關之名稱、地址、聯絡人（或單位）及聯絡電話。","三、採購標的摘要。","四、廠商名稱及地址。","五、原刊登符合本法第一百零一條第一項各款所列之情形。","六、原刊登採購公報日期。","七、註銷之事由。","八、其他經主管機關指定者。"]},{"no":"18","label":"第18條","ch":"","cat":"b","lines":["依本法第一百十一條第二項規定辦理年度重大採購事件之效益評估公告，應登載下列事項：","一、有案號者，其案號。","二、機關之名稱、地址、聯絡人（或單位）及聯絡電話。","三、採購標的摘要。","四、廠商名稱及地址。","五、啟用日期。","六、使用年限。","七、機關之使用情形及其效益分析。","八、主管機關之效益評估。","九、其他經主管機關指定者。"]},{"no":"19","label":"第19條","ch":"","cat":"b","lines":["依第四條第一項第九款辦理之公告，其屬招標公告或資格審查公告者，應另以英文刊登下列事項；其屬其他公告者，依條約或協定之規定。","一、有案號者，其案號。","二、機關之名稱、地址、聯絡人（或單位）及聯絡電話。","三、相關文件之領取地點、方式、售價及購買該文件之付款方式。","四、收受投標文件或資格文件之地點及截止期限。","五、標的摘要。","六、條約或協定規定之其他事項。","七、其他經主管機關指定者。","前項規定於辦理更正公告時準用之。"]},{"no":"20","label":"第20條","ch":"","cat":"b","lines":["機關依第四條及第五條刊登採購公報之資訊及辦理主管機關指定蒐集或統計之採購資訊，應依一定格式及內容，傳送至主管機關指定之電腦資料庫；傳送資訊內容由機關自行檢核，如有錯誤，應辦理更正。電腦資料庫不提供網路傳輸功能之項目，機關應以電子數位資料方式提供。","前項資訊傳送作業方式及駐國外機構辦理方式，由主管機關定之。"]},{"no":"21","label":"第21條","ch":"","cat":"b","lines":["採購網站所蒐集之採購公告資訊，除有特殊情形經主管機關調整者外，其刊登採購公報之時程如下：","一、星期一刊登上星期四下午及星期五上午所傳送之資料。","二、星期二刊登上星期五下午及本星期一上午所傳送之資料。","三、星期三刊登星期一下午及星期二上午所傳送之資料。","四、星期四刊登星期二下午及星期三上午所傳送之資料。","五、星期五刊登星期三下午及星期四上午所傳送之資料。","前項刊登時程，遇假日、停止上班日或特殊情形無法發行採購公報者，順延之；以電子化方式發行採購公報者，得提前之。","前項無法發行採購公報之情形係屬不可預見者，機關應視需要於恢復上班或特殊情形消失後，依前二項時程辦理更正公告。","第一項傳送資料之時間，依採購網站所登錄之傳送時間認定。"]},{"no":"22","label":"第22條","ch":"","cat":"b","lines":["銷售採購公報及提供採購網站資訊服務，得向採購公報訂戶及資訊服務使用者收費；其收費標準，由主管機關定之。"]},{"no":"23","label":"第23條","ch":"","cat":"b","lines":["本辦法自發布日施行。"]}]},{"id":"A0030064","title":"共同投標辦法","short":"共同投標辦法","date":"民國96年05月22日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030064","articles":[{"no":"1","label":"第1條","ch":"","cat":"b","lines":["本辦法依政府採購法（以下簡稱本法）第二十五條第六項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"b","lines":["共同投標，包括下列情形：","一、同業共同投標：參加共同投標之廠商均屬同一行業者。","二、異業共同投標：參加共同投標之廠商均為不同行業者。","參加共同投標之廠商有二家以上屬同一行業者，視同同業共同投標。"]},{"no":"3","label":"第3條","ch":"","cat":"b","lines":["本法第二十五條第一項所稱個別採購之特性，為下列情形之一：","一、允許共同投標有利工作界面管理者。","二、允許共同投標可促進競爭者。","三、允許共同投標，以符合新工法引進或專利使用之需要者。","四、其他經主管機關認定者。","機關依前項採購之特性允許共同投標，其有同業共同投標之情形者，應符合本法第二十五條第四項之規定。"]},{"no":"4","label":"第4條","ch":"","cat":"b","lines":["機關於招標文件中規定允許一定家數內之廠商共同投標者，以不超過五家為原則。機關並得就共同投標廠商各成員主辦事項之金額，於其共同投標協議書所載之比率下限予以限制。","機關於招標文件中規定允許共同投標時，應並載明廠商得單獨投標。"]},{"no":"5","label":"第5條","ch":"","cat":"b","lines":["機關允許共同投標時，得於招標文件中規定共同投標廠商各成員及代表廠商之基本資格。"]},{"no":"6","label":"第6條","ch":"","cat":"b","lines":["機關辦理特殊或巨額之採購，允許共同投標時，得於招標文件中規定共同投標廠商各成員及代表廠商之特定資格。"]},{"no":"7","label":"第7條","ch":"","cat":"b","lines":["機關允許共同投標時，應於招標文件中規定共同投標廠商之成員，不得對同一採購另行提出投標文件或為另一共同投標廠商之成員。但有下列情形之一者，不在此限：","一、該採購涉及專利或特殊之工法或技術，為使擁有此等專利或工法、技術之廠商得為不同共同投標廠商之成員，以增加廠商競爭者。","二、預估合於招標文件規定之投標廠商競爭不足，規定廠商不得為不同共同投標廠商之成員反不利競爭者。","三、其他經主管機關認定者。"]},{"no":"8","label":"第8條","ch":"","cat":"b","lines":["機關允許共同投標時，應於招標文件中規定共同投標廠商之投標文件應由各成員共同具名，或由共同投標協議書指定之代表人簽署。投標文件之補充或更正及契約文件之簽訂、補充或更正，亦同。"]},{"no":"9","label":"第9條","ch":"","cat":"b","lines":["機關允許共同投標時，應於招標文件中規定，由共同投標廠商共同繳納押標金及保證金，或由共同投標協議書所指定之代表廠商繳納。其並須提供擔保者，亦同。"]},{"no":"10","label":"第10條","ch":"","cat":"b","lines":["共同投標廠商於投標時應檢附由各成員之負責人或其代理人共同具名，且經公證或認證之共同投標協議書，載明下列事項，於得標後列入契約：","一、招標案號、標的名稱、機關名稱及共同投標廠商各成員之名稱、地址、電話、負責人。","二、共同投標廠商之代表廠商、代表人及其權責。","三、各成員之主辦項目及所占契約金額比率。","四、各成員於得標後連帶負履行契約責任。","五、契約價金請（受）領之方式、項目及金額。","六、成員有破產或其他重大情事，致無法繼續共同履約者，同意將其契約之一切權利義務由其他成員另覓之廠商或其他成員繼受。","七、招標文件規定之其他事項。","前項協議書內容與契約規定不符者，以契約規定為準。","第一項協議書內容，非經機關同意不得變更。"]},{"no":"11","label":"第11條","ch":"","cat":"b","lines":["有前條第一項第六款之情事者，共同投標廠商之其他成員得經機關同意，共同提出與該成員原資格條件相當之廠商，共同承擔契約之一切權利義務。機關非有正當理由，不得拒絕。"]},{"no":"12","label":"第12條","ch":"","cat":"b","lines":["機關允許共同投標時，應於招標文件中規定共同投標協議書以中文書寫。但招標文件規定允許廠商共同投標，且該採購係外國廠商得參與者，涉及外國廠商之共同投標協議書，得以外文書寫，附經公證或認證之中文譯本，並於招標文件中訂明。"]},{"no":"13","label":"第13條","ch":"","cat":"b","lines":["機關允許共同投標時，應於招標文件中規定其對共同投標廠商之代表人之通知，與對共同投標廠商所有成員之通知具同等效力。"]},{"no":"14","label":"第14條","ch":"","cat":"b","lines":["機關允許共同投標時，應於招標文件中規定共同投標廠商於投標文件敘明契約價金由代表廠商統一請（受）領，或由各成員分別請（受）領；其屬分別請（受）領者，並應載明各成員分別請（受）領之項目及金額。"]},{"no":"15","label":"第15條","ch":"","cat":"b","lines":["共同投標廠商得標後各成員之履約實績，依各成員於共同投標協議書所標示之主辦項目及金額認定之。但由共同投標廠商於驗收後提出各成員實際履約實績者，得依其所提履約實績認定之。"]},{"no":"16","label":"第16條","ch":"","cat":"b","lines":["共同投標廠商之成員有本法第一百零一條第一項各款情形之一者，機關應視可歸責之事由，對各該應負責任之成員個別為通知。"]},{"no":"17","label":"第17條","ch":"","cat":"b","lines":["本辦法自中華民國八十八年五月二十七日施行。"]}]},{"id":"A0030314","title":"機關辦理涉及國家安全採購之廠商資格限制條件及審查作業辦法","short":"國安採購資格辦法","date":"民國108年11月20日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030314","articles":[{"no":"1","label":"第1條","ch":"","cat":"b","lines":["本辦法依政府採購法第十七條第四項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"b","lines":["機關辦理涉及國家安全之採購，其不適用我國締結之條約或協定者，得於招標文件對我國或外國廠商資格訂定限制條件；其適用我國締結之條約或協定者，得依其特別規定排除適用，並於招標文件對我國或外國廠商資格訂定限制條件。有分包廠商者，其資格限制條件亦同。","機關依前項規定訂定廠商資格限制條件，應由需求、使用或承辦採購單位敘明限制之理由及其必要性，簽報機關首長或其授權人員核准。"]},{"no":"3","label":"第3條","ch":"","cat":"b","lines":["機關依前條規定對廠商資格訂定限制條件，得依採購案件之特性及實際需要，就下列事項擇定之：","一、廠商之國籍或其設立登記所依據之法律。","二、廠商之代表人、董事、監察人、監事、經理人或持有股份總數或資本總額逾百分之十之股東之國籍。","三、廠商之資金來源及其比率限制。","四、其他法令規定或經主管機關認定者。","機關依前項規定訂定限制條件者，應一併載明廠商應檢附之證明文件。"]},{"no":"4","label":"第4條","ch":"","cat":"b","lines":["機關應於招標文件規定，廠商投標文件附具之前條第二項證明文件相關內容於投標後如有異動，應主動通知機關，並檢附異動後之證明文件供機關審查；有不符招標文件規定之情形者，應不決標予該廠商。","機關得於契約約定廠商得標後，有招標文件所定資格限制條件之情形者，得終止契約或解除契約，並得追償損失。"]},{"no":"5","label":"第5條","ch":"","cat":"b","lines":["機關依本辦法對廠商資格訂定限制條件及審查廠商之證明文件，如有疑義，得洽請相關目的事業主管機關提供意見。"]},{"no":"6","label":"第6條","ch":"","cat":"b","lines":["本辦法自發布日施行。"]}]},{"id":"A0030079","title":"押標金保證金暨其他擔保作業辦法","short":"押標金保證金辦法","date":"民國108年11月18日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030079","articles":[{"no":"1","label":"第1條","ch":"第一章總則","cat":"b","lines":["本辦法依政府採購法（以下簡稱本法）第三十條第三項規定訂定之。"]},{"no":"2","label":"第2條","ch":"第一章總則","cat":"b","lines":["本法第三十條第二項之用詞定義如下：","一、金融機構：指經中央目的事業主管機關核准得辦理本票、支票或定期存款單之銀行、信用合作社、農會信用部、漁會信用部及中華郵政股份有限公司。","二、金融機構本票：指金融機構簽發一定之金額，於指定之到期日由自己或分支機構無條件支付與受款人或執票人之票據。","三、金融機構支票：指金融機構簽發一定之金額，委託其他金融機構或由其自己於見票時無條件支付與受款人或執票人之票據。","四、金融機構保付支票：指金融機構於支票上記載照付或保付或其他同義字樣並簽名之票據。","五、郵政匯票：指由中華郵政股份有限公司所簽發及兌付之匯票。","六、政府公債：指我國政府機關所發行之公債；其屬記名者，應辦理設定質權登記或公務保證登記。","七、設定質權之金融機構定期存款單：指設定質權予招標機關之金融機構定期存款單，或無記名可轉讓金融機構定期存款單。","八、銀行：依銀行法第二條之規定。","九、銀行保兌之不可撤銷擔保信用狀：指未在我國境內登記營業之外國銀行所開發之不可撤銷擔保信用狀經銀行保兌者。","十、銀行書面連帶保證：指由銀行開具連帶保證書並負連帶保證責任者。","十一、保險公司：指依保險法經設立許可及核發營業執照者。"]},{"no":"3","label":"第3條","ch":"第一章總則","cat":"b","lines":["機關辦理採購，除得免收押標金、保證金外，應於招標文件中規定廠商應繳納押標金、保證金或其他擔保之種類、額度、繳納、退還及終止方式。","機關允許外國廠商參與之採購，其得以等值外幣繳納押標金及保證金者，應於招標文件中訂明外幣種類及其繳納方式。","前項等值外幣，除招標文件另有規定外，以繳納日前一辦公日臺灣銀行外匯交易收盤即期買入匯率折算之。"]},{"no":"4","label":"第4條","ch":"第一章總則","cat":"b","lines":["押標金及保證金應以投標廠商或得標廠商名義繳納。"]},{"no":"5","label":"第5條","ch":"第一章總則","cat":"b","lines":["廠商得以本法第三十條第二項規定之二種以上方式繳納押標金或保證金。其己繳納者，並得經機關同意更改繳納方式。"]},{"no":"6","label":"第6條","ch":"第一章總則","cat":"b","lines":["招標文件規定廠商須繳納押標金者，應一併載明廠商應於截止投標期限前繳納至指定之收受處所或金融機構帳號。除現金外，廠商並得將其押標金附於投標文件內遞送。","招標文件規定廠商須繳納保證金或提供其他擔保者，應一併載明繳納期限及收受處所或金融機構帳號。","押標金或保證金以設定質權之金融機構定期存款單繳納者，應不受特定存款金融機構之限制；其向金融機構申請設定質權時，無需質權人會同辦理。","押標金及保證金，得以主管機關核定之電子化方式繳納。"]},{"no":"7","label":"第7條","ch":"第一章總則","cat":"b","lines":["押標金或保證金以金融機構本票、支票、保付支票或郵政匯票繳納者，應為即期並以機關為受款人。未填寫受款人者，以執票之機關為受款人。","押標金或保證金以設定質權之金融機構定期存款單、銀行開發或保兌之不可撤銷擔保信用狀、銀行書面連帶保證、保險公司之保證保險單或其他擔保繳納者，依其性質，應分別記載機關為質權人、受益人、被保證人或被保險人。"]},{"no":"8","label":"第8條","ch":"第一章總則","cat":"b","lines":["保證金之種類如下：","一、履約保證金。保證廠商依契約規定履約之用。","二、預付款還款保證。保證廠商返還預先支領而尚未扣抵之預付款之用。","三、保固保證金。保證廠商履行保固責任之用。","四、差額保證金。保證廠商標價偏低不會有降低品質、不能誠信履約或其他特殊情形之用。","五、其他經主管機關認定者。"]},{"no":"9","label":"第9條","ch":"第二章押標金","cat":"b","lines":["押標金之額度，得為一定金額或標價之一定比率，由機關於招標文件中擇定之。","前項一定金額，以不逾預算金額或預估採購總額之百分之五為原則；一定比率，以不逾標價之百分之五為原則。但不得逾新臺幣五千萬元。","採單價決標之採購，押標金應為一定金額。"]},{"no":"9-1","label":"第9-1條","ch":"第二章押標金","cat":"b","lines":["機關得於招標文件規定採電子投標之廠商，其押標金得予減收一定金額或比率。其減收額度以不逾押標金金額之百分之十為限。"]},{"no":"10","label":"第10條","ch":"第二章押標金","cat":"b","lines":["廠商以銀行開發或保兌之不可撤銷擔保信用狀、銀行之書面連帶保證或保險公司之保證保險單繳納押標金者，除招標文件另有規定外，其有效期應較招標文件規定之報價有效期長三十日。廠商延長報價有效期者，其所繳納押標金之有效期應一併延長之。"]},{"no":"11","label":"第11條","ch":"第二章押標金","cat":"b","lines":["廠商得將繳納押標金之單據附於下列投標文件檢送。但現金應繳納至指定之收受處所或金融機構帳號。","一、公開招標附於投標文件。屬分段開標者，附於第一階段開標之投標文件。","二、選擇性招標附於資格審查後之下一階段投標文件。","三、限制性招標附於議價或比價文件。比價採分段開標者，附於第一階段開標之投標文件。"]},{"no":"12","label":"第12條","ch":"第二章押標金","cat":"b","lines":["投標廠商或採購案有下列情形之一者，相關廠商所繳納之押標金應予發還。但依本法第三十一條第二項規定不予發還者，不在此限：","一、未得標之廠商。","二、因投標廠商家數未滿三家而流標。","三、機關宣布廢標或因故不予開標、決標。","四、廠商投標文件已確定為不合於招標規定或無得標機會，經廠商要求先予發還。","五、廠商報價有效期已屆，且拒絕延長。","六、廠商逾期繳納押標金或繳納後未參加投標或逾期投標。","七、已決標之採購，得標廠商已依規定繳納保證金。"]},{"no":"13","label":"第13條","ch":"第二章押標金","cat":"b","lines":["依本法第五十二條第一項第四款採用複數決標並以項目分別決標之採購，廠商得依其所投標之項目分別或合併繳納押標金。其屬合併者，應為所投標項目應繳押標金之和。","前項合併繳納押標金者，得依所投標之項目分別發還之。"]},{"no":"14","label":"第14條","ch":"第二章押標金","cat":"b","lines":["得標廠商以其原繳納之押標金轉為履約保證金者，押標金金額如超出招標文件規定之履約保證金金額，超出之部分應發還得標廠商。","廠商繳納之押標金有不予發還之情形者，扣除溢繳之金額後全部不予發還。但採用複數決標之採購，廠商依其所投標之項目合併繳納押標金者，其不予發還之金額應依個別項目計算之。"]},{"no":"15","label":"第15條","ch":"第三章履約保證金","cat":"b","lines":["履約保證金之額度，得為一定金額或契約金額之一定比率，由機關於招標文件中擇定之。","前項一定金額，以不逾預算金額或預估採購總額之百分之十為原則；一定比率，以不逾契約金額之百分之十為原則。","採單價決標之採購，履約保證金應為一定金額。"]},{"no":"16","label":"第16條","ch":"第三章履約保證金","cat":"b","lines":["契約金額於履約期間有增減者，履約保證金之金額得依增減比率調整之。"]},{"no":"17","label":"第17條","ch":"第三章履約保證金","cat":"b","lines":["廠商以銀行開發或保兌之不可撤銷擔保信用狀、銀行之書面連帶保證或保險公司之保證保險單繳納履約保證金者，除招標文件另有規定外，其有效期應較契約規定之最後施工、供應或安裝期限長九十日。","廠商未能依契約規定期限履約或因可歸責於廠商之事由致無法於前項有效期內完成驗收者，履約保證金之有效期應按遲延期間延長之。"]},{"no":"18","label":"第18條","ch":"第三章履約保證金","cat":"b","lines":["履約保證金之繳納期限，由機關視案件性質及實際需要，於招標文件中合理訂定之。查核金額以上之採購，應訂定十四日以上之合理期限。","廠商未依規定期限繳納履約保證金，或繳納之額度不足或不合規定程式者，不予受理。但其情形可以補正者，機關應定期命其補正；逾期不補正者，不予受理。","機關辦理簽約，得不以廠商先繳納履約保證金為條件。"]},{"no":"19","label":"第19條","ch":"第三章履約保證金","cat":"b","lines":["履約保證金之發還，得以履約進度、驗收、維修或保固期間等條件，一次或分次發還，由機關視案件性質及實際需要，於招標文件中訂明。","履約保證金，除契約另有規定或有得不予發還之情形者外，於符合發還條件且無待解決事項後發還。其因不可歸責於廠商之事由，致終止或解除契約或暫停履約者，得提前發還之。但屬暫停履約者，於暫停原因消滅後應重新繳納履約保證金。","依本法第五十二條第一項第四款採用複數決標之採購，廠商依其得標項目合併繳納履約保證金者，依前二項規定分別發還之。"]},{"no":"20","label":"第20條","ch":"第三章履約保證金","cat":"b","lines":["履約保證金及其孳息得不予發還之情形，由機關視案件性質及實際需要，於招標文件中訂明。","機關得於招標文件中規定，廠商所繳納之履約保證金（含其孳息，本項以下同），得部分或全部不發還之情形如下：","一、有本法第五十條第一項第三款至第五款、第七款情形之一，依同條第二項前段得追償損失者，與追償金額相等之保證金。","二、違反本法第六十五條規定轉包者，全部保證金。","三、擅自減省工料，其減省工料及所造成損失之金額，自待付契約價金扣抵仍有不足者，與該不足金額相等之保證金。","四、因可歸責於廠商之事由，致部分終止或解除契約者，依該部分所占契約金額比率計算之保證金；全部終止或解除契約者，全部保證金。","五、查驗或驗收不合格，且未於通知期限內依規定辦理，其不合格部分及所造成損失、額外費用或懲罰性違約金之金額，自待付契約價金扣抵仍有不足者，與該不足金額相等之保證金。","六、未依契約規定期限或機關同意之延長期限履行契約之一部或全部，其逾期違約金之金額，自待付契約價金扣抵仍有不足者，與該不足金額相等之保證金。","七、須返還已支領之契約價金而未返還者，與未返還金額相等之保證金。","八、未依契約規定延長保證金之有效期者，其應延長之保證金。","九、其他因可歸責於廠商之事由，致機關遭受損害，其應由廠商賠償而未賠償者，與應賠償金額相等之保證金。","前項不予發還之履約保證金，於依契約規定分次發還之情形，得為尚未發還者；不予發還之孳息，為不予發還之履約保證金於繳納後所生者。","同一契約有第二項二款以上情形者，應分別適用之。但其合計金額逾履約保證金總金額者，以總金額為限。"]},{"no":"21","label":"第21條","ch":"第四章預付款還款保證","cat":"b","lines":["機關得視案件性質及實際需要，於招標文件中規定得標廠商得支領預付款及其金額，並訂明廠商支領預付款前應先提供同額預付款還款保證。","機關必要時得通知廠商就支領預付款後之使用情形提出說明。"]},{"no":"22","label":"第22條","ch":"第四章預付款還款保證","cat":"b","lines":["預付款還款保證，得依廠商已履約部分所占進度或契約金額之比率遞減，或於驗收合格後一次發還，由機關視案件性質及實際需要，於招標文件中訂明。","廠商未依契約規定履約或契約經終止或解除者，機關得就預付款還款保證尚未遞減之部分加計利息隨時要求返還或折抵機關尚待支付廠商之價金。","前項利息之計算方式及機關得要求返還之條件，應於招標文件中訂明，並記載於預付款還款保證內。"]},{"no":"23","label":"第23條","ch":"第四章預付款還款保證","cat":"b","lines":["廠商以銀行開發或保兌之不可撤銷擔保信用狀、銀行之書面連帶保證或保險公司之保證保險單繳納預付款還款保證者，除招標文件另有規定外，其有效期應較契約規定之最後施工、供應或安裝期限長九十日。","廠商未能依契約規定期限履約或因可歸責於廠商之事由致無法於前項有效期內完成驗收者，預付款還款保證之有效期應按遲延期間延長之。"]},{"no":"24","label":"第24條","ch":"第五章保固保證金","cat":"b","lines":["機關得視案件性質及實際需要，於招標文件中規定得標廠商於履約標的完成驗收付款前應繳納保固保證金。其屬分段起算保固期者，並得分段繳納。","前項保固保證金，得以相當額度之履約保證金或應付契約價金代之。"]},{"no":"25","label":"第25條","ch":"第五章保固保證金","cat":"b","lines":["保固保證金之額度，得為一定金額或契約金額之一定比率，由機關於招標文件中擇定之。","前項一定金額，以不逾預算金額或預估採購總金額之百分之三為原則；一定比率，以不逾契約金額之百分之三為原則。"]},{"no":"26","label":"第26條","ch":"第五章保固保證金","cat":"b","lines":["廠商以銀行開發或保兌之不可撤銷擔保信用狀、銀行之書面連帶保證或保險公司之保證保險單繳納保固保證金者，除招標文件另有規定外，其有效期應較契約規定之保固期長九十日。"]},{"no":"27","label":"第27條","ch":"第五章保固保證金","cat":"b","lines":["保固保證金之發還，得以保固期間內完成保固事項或階段為條件，一次或分次發還，由機關視案件性質及實際需要，於招標文件中訂明。"]},{"no":"28","label":"第28條","ch":"第五章保固保證金","cat":"b","lines":["保固保證金及其孳息得不予發還之情形，由機關視案件性質及實際需要，於招標文件中訂明。","保固保證金及其孳息得不予發還之情形，準用第二十條第二項第二款至第九款之規定。","保固保證金，除有不予發還之情形者外，於保固期限屆滿且無待解決事項後發還之。"]},{"no":"29","label":"第29條","ch":"第六章其他保證及擔保","cat":"b","lines":["廠商依本法第三十七條第二項規定提出銀行或保險公司之履約及賠償連帶保證責任或連帶保證保險單者，依下列規定辦理：","一、連帶保證責任或連帶保證保險金額應不少於總標價。","二、連帶保證責任或連帶保證保險單應附於資格文件一併提出。","三、連帶保證責任或連帶保證保險單之有效期、內容、發還及不發還等事項，準用履約保證金之規定。","前項第一款所稱總標價，得為下列情形之一：","一、以總價決標者，指投標廠商之總標價。","二、以單價決標者，指招標文件載明之預估採購總額或廠商所報單價與招標文件載明之預估採購量之乘積。","三、辦理選擇性招標資格審查者，由廠商依招標標的或機關預估採購總額預估之，或以招標文件規定之一定金額代之。","連帶保證責任或連帶保證保險金額逾決標價者，依決標價調整之。"]},{"no":"30","label":"第30條","ch":"第六章其他保證及擔保","cat":"b","lines":["廠商以差額保證金作為本法第五十八條規定之擔保者，依下列規定辦理：","一、總標價偏低者，擔保金額為總標價與底價之百分之八十之差額，或為總標價與本法第五十四條評審委員會建議金額之百分之八十之差額。","二、部分標價偏低者，擔保金額為該部分標價與該部分底價之百分之七十之差額。該部分無底價者，以該部分之預算金額或評審委員會之建議金額代之。","三、廠商未依規定提出差額保證金者，得不決標予該廠商。","差額保證金之繳納，應訂定五日以上之合理期限。其有效期、內容、發還及不發還等事項，準用履約保證金之規定。"]},{"no":"31","label":"第31條","ch":"第六章其他保證及擔保","cat":"b","lines":["廠商依本法第七十二條第一項通知廠商限期改善或換貨，其須將已付款之標的運出機關場所者，得規定廠商繳納與標的等值之保證金。保固期間內有將標的運出機關場所改善或換貨之情形者，亦同。","前項保證金，準用履約保證金之有關規定。"]},{"no":"32","label":"第32條","ch":"第六章其他保證及擔保","cat":"b","lines":["機關提供財物供廠商加工或維修，其須將標的運出機關場所者，得視實際需要規定廠商繳納與標的等值或一定金額之保證金。","前項保證金，準用履約保證金之有關規定。"]},{"no":"33","label":"第33條","ch":"第六章其他保證及擔保","cat":"b","lines":["未達公告金額之採購，機關得於招標文件中規定得標廠商應繳納之履約保證金或保固保證金，得以符合招標文件所定投標廠商資格條件之其他廠商之履約及賠償連帶保證代之。"]},{"no":"33-1","label":"第33-1條","ch":"第六章其他保證及擔保","cat":"b","lines":["公告金額以上之採購，機關得於招標文件中規定得標廠商提出符合招標文件所定投標廠商資格條件之其他廠商之履約及賠償連帶保證者，其應繳納之履約保證金或保固保證金得予減收。","前項減收額度，得為一定金額或比率，由招標機關於招標文件中擇定之。其額度以不逾履約保證金或保固保證金額度之百分之五十為限。"]},{"no":"33-2","label":"第33-2條","ch":"第六章其他保證及擔保","cat":"b","lines":["機關依前二條規定允許保證金得以連帶保證代之或減收者，其提出連帶保證廠商文件之期限，準用履約保證金及保固保證金之規定；機關並應於招標文件規定，連帶保證廠商之連帶保證責任，不因分次發還保證金而遞減。","保證金有不發還之情形者，得標廠商及連帶保證廠商應向機關補繳該不發還金額中原由連帶保證代之或減收之金額。但依其情形可由連帶保證廠商履約而免補繳者，應先洽該廠商履約。"]},{"no":"33-3","label":"第33-3條","ch":"第六章其他保證及擔保","cat":"b","lines":["第三十三條及第三十三條之一連帶保證廠商應以依法得為保證、未參與投標，且無本法第一百零三條第一項不得參加投標或作為決標對象或分包廠商之情形者為限。"]},{"no":"33-4","label":"第33-4條","ch":"第六章其他保證及擔保","cat":"b","lines":["機關應於招標文件中規定，同一廠商同時作為各機關採購契約之連帶保證廠商者，以二契約為限。","機關辦理採購有前項連帶保證廠商情形者，應將連帶保證廠商及相關資料傳輸至主管機關指定之資料庫予以公告。"]},{"no":"33-5","label":"第33-5條","ch":"第六章其他保證及擔保","cat":"b","lines":["機關辦理採購，得於招標文件中規定優良廠商應繳納之押標金、履約保證金或保固保證金金額得予減收，其額度以不逾原定應繳總額之百分之五十為限。繳納後方為優良廠商者，不溯及適用減收規定；減收後獎勵期間屆滿者，免補繳減收之金額。","前項優良廠商，指經主管機關或相關中央目的事業主管機關就其主管法令所適用之廠商，依其所定獎勵措施、獎勵期間及政府採購契約履約成果評定為優良廠商，並於評定後三個月內檢附相關資料，報主管機關，經認定而於指定之資料庫公告，且在獎勵期間內者。獎勵期間自資料庫公告日起逾二年者，以二年為限；無獎勵期間者，自資料庫公告日起一年。機關並得於招標文件就個案所適用之優良廠商種類予以限制。","第一項得予減收之情形，機關應於招標文件規定，其有不發還押標金或保證金之情形者，廠商應就不發還金額中屬減收之金額補繳之。其經主管機關或相關中央目的事業主管機關取消優良廠商資格，或經各機關依本法第一百零二條第三項規定刊登政府採購公報，且尚在本法第一百零三條第一項所定期限內者，亦同。","經直轄市或縣（市）政府比照第二項之規定評為優良之廠商，於各該政府及所屬機關所辦理之採購，得準用第一項及前項之規定，並免報主管機關及於指定之資料庫公告。","依其他法令得予減收押標金、履約保證金或保固保證金金額，而該法令未明定需於招標文件規定或於主管機關指定之資料庫公告者，從其規定。"]},{"no":"33-6","label":"第33-6條","ch":"第六章其他保證及擔保","cat":"b","lines":["機關辦理非條約協定採購，得於招標文件中規定全球化廠商應繳納之押標金、履約保證金或保固保證金金額得予減收，其額度以不逾各原定應繳總額之百分之三十為限，不併入前條減收額度計算。繳納後方為全球化廠商者，不溯及適用減收規定；減收後獎勵期間屆滿者，免補繳減收之金額。","前項全球化廠商，指我國廠商得標我國以外之政府採購標案累計決標金額達世界貿易組織政府採購協定我國中央機關門檻金額以上，於決標後一年內經相關中央目的事業主管機關審定登錄於主管機關指定之資料庫公告，且在獎勵期間內者。獎勵期間自資料庫公告日起一年。","第一項得予減收之情形，機關應於招標文件規定，其有不發還押標金或保證金之情形者，廠商應就不發還金額中屬減收之金額補繳之。其經相關中央目的事業主管機關因前項我國以外之政府採購標案有重大違約情形而取消全球化廠商資格，或經各機關依本法第一百零二條第三項規定刊登政府採購公報，且尚在本法第一百零三條第一項所定期限內者，亦同。"]},{"no":"34","label":"第34條","ch":"第七章附則","cat":"b","lines":["本辦法有關之押標金、保證金及其他擔保之格式，由主管機關定之。"]},{"no":"35","label":"第35條","ch":"第七章附則","cat":"b","lines":["本辦法自中華民國八十八年五月二十七日施行。","本辦法修正條文自發布日施行。"]}]},{"id":"A0030093","title":"招標期限標準","short":"招標期限標準","date":"民國98年08月31日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030093","articles":[{"no":"1","label":"第1條","ch":"","cat":"b","lines":["本標準依政府採購法（以下簡稱本法）第二十八條規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"b","lines":["機關辦理公開招標，其公告自刊登政府採購公報日起至截止投標日止之等標期，應視案件性質與廠商準備及遞送投標文件所需時間合理訂定之。","前項等標期，除本標準或我國締結之條約或協定另有規定者外，不得少於下列期限：","一、未達公告金額之採購：七日。","二、公告金額以上未達查核金額之採購：十四日。","三、查核金額以上未達巨額之採購：二十一日。","四、巨額之採購：二十八日。","依本法第四十二條第二項規定辦理後續階段之邀標，其等標期由機關視需要合理訂定之。但不得少於七日。"]},{"no":"3","label":"第3條","ch":"","cat":"b","lines":["機關辦理選擇性招標之廠商資格預先審查，其公告自刊登政府採購公報日起至截止收件日止之等標期，應視案件性質與廠商準備及遞送資格文件所需時間合理訂定之。","前項等標期，除本標準或我國締結之條約或協定另有規定者外，不得少於下列期限：","一、未達公告金額之採購：七日。","二、公告金額以上未達巨額之採購：十日。","三、巨額之採購：十四日。","機關邀請第一項符合資格之廠商投標，其自邀標日起至截止投標日止之等標期，準用前條第二項規定。"]},{"no":"4","label":"第4條","ch":"","cat":"b","lines":["機關依本法第二十二條第一項第九款或第十款規定辦理公開評選，其自公告日起至截止收件日止之等標期，準用第二條規定。","機關依本法第二十二條第一項第十一款規定辦理公開徵求，其自公告日起至截止收件日止之等標期，應訂定十日以上之合理期限。第二次以後公開徵求之期限，由機關視需要合理訂定之。但不得少於五日。"]},{"no":"4-1","label":"第4-1條","ch":"","cat":"b","lines":["機關辦理公告金額以上之採購，因應緊急情事，依第二條至第四條所定期限辦理不符合實際需要者，等標期得予縮短。但縮短後不得少於十日；其併第九條規定情形縮短者，亦同。"]},{"no":"5","label":"第5條","ch":"","cat":"b","lines":["機關依本法第四十九條之規定公開徵求廠商之書面報價或企劃書者，其自公告日起至截止收件日止之等標期，應訂定五日以上之合理期限。"]},{"no":"6","label":"第6條","ch":"","cat":"b","lines":["機關辦理限制性招標，其未經公開評選或公開徵求程序者，等標期由機關視需要合理訂定之。"]},{"no":"7","label":"第7條","ch":"","cat":"b","lines":["機關於等標期截止前變更或補充招標文件內容者，應視需要延長等標期。","前項變更或補充，其非屬重大改變，且於原定截止日前五日公告或書面通知各廠商者，得免延長等標期。"]},{"no":"8","label":"第8條","ch":"","cat":"b","lines":["機關於等標期截止前取消或暫停招標，並於取消或暫停後六個月內重行或續行招標且招標文件內容未經重大改變者，重行或續行招標之等標期，得考量取消或暫停前已公告或邀標之日數，依原定期限酌予縮短。但重行或續行招標之等標期，未達公告金額之採購不得少於三日，公告金額以上之採購不得少於七日。","機關於等標期截止後流標、廢標、撤銷決標或解除契約，並於其後三個月內重行招標且招標文件內容未經重大改變者，準用前項之規定。"]},{"no":"9","label":"第9條","ch":"","cat":"b","lines":["機關辦理採購，除我國締結之條約或協定另有規定者外，其等標期得依下列情形縮短之：","一、於招標前將招標文件稿辦理公開閱覽且招標文件內容未經重大改變者，等標期得縮短五日。但縮短後不得少於十日。","二、依本法第九十三條之一規定辦理電子領標並於招標公告敘明者，等標期得縮短三日。但縮短後不得少於五日。","三、依本法第九十三條之一規定辦理電子投標並於招標公告或招標文件敘明者，等標期得縮短二日。但縮短後不得少於五日。"]},{"no":"10","label":"第10條","ch":"","cat":"b","lines":["機關辦理採購，除我國締結之條約或協定另有規定者外，有下列情形之一者，經機關首長或其授權人員核准，其等標期得視案件之特性及實際需要合理訂定之：","一、依本法第二十一條以預先建立之合格廠商名單，邀請符合資格之廠商投標，於辦理廠商資格審查之文件中另有載明者。","二、公營事業為商業性轉售或用於製造產品、提供服務以供轉售目的所為之採購，基於採購案件之特性或實際需要，有縮短等標期之必要者。","三、採購原料、物料或農礦產品，其市場行情波動不定者。","四、採購標的屬廠商於市場普遍銷售且招標及投標文件內容簡單者。"]},{"no":"11","label":"第11條","ch":"","cat":"b","lines":["本標準所定等標期或截止收件期限，其敘明自公告日或邀標日起算者，應將公告或邀標之當日算入。","前項等標期或截止收件期限，招標文件規定之截止投標日或截止收件日，以當日下班時間為其截止投標或收件時間者，始算一日；未達下班時間者，該日不算入。","截止投標日或截止收件日為星期例假日、國定假日或其他休息日者，以其休息日之次日代之。","截止投標日或截止收件日為辦公日，而該日因故停止辦公致未達原定截止投標或收件時間者，以其次一辦公日之同一截止投標或收件時間代之。","休息日在期間中而非末日者，算一日。"]},{"no":"12","label":"第12條","ch":"","cat":"b","lines":["本標準自發布日施行。"]}]},{"id":"A0030074","title":"機關指定地區採購房地產作業辦法","short":"指定地區房地產辦法","date":"民國114年11月20日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030074","articles":[{"no":"1","label":"第1條","ch":"","cat":"b","lines":["本辦法依政府採購法（以下簡稱本法）第二十二條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"b","lines":["機關指定地區公開徵求房地產，採購金額在公告金額以上者，其作業依本辦法之規定。"]},{"no":"3","label":"第3條","ch":"","cat":"b","lines":["機關指定地區採購房地產，應先編擬計畫依規定層報核定。","前項計畫應包括採購房地產及指定地區採購之理由及其必要性，並參照政府公定或評定價格及附近買賣實例或其他徵信資料，詳估採購金額及其效益。"]},{"no":"4","label":"第4條","ch":"","cat":"b","lines":["機關辦理下列公告金額以上房地產之採購，得免公開徵求：","一、毗鄰房地產或畸零地之採購，係與現有房地產合併，以應業務需要者。","二、符合本法第二十二條第一項第二款、第三款、第七款或第八款之情形者。","三、其他經主管機關認定者。"]},{"no":"5","label":"第5條","ch":"","cat":"b","lines":["機關公開徵求房地產，應將公告刊登於政府採購公報並公開於資訊網路。"]},{"no":"6","label":"第6條","ch":"","cat":"b","lines":["機關公開徵求房地產之徵選文件，除法令另有規定者外，得視個案特性及實際需要載明下列事項：","一、房地產之需求條件，包括面積、面臨道路寬度、交通情形、土地使用分區及其他相關條件等。需求面積得酌定彈性範圍。","二、指定之地區與其理由及必要性。","三、廠商應提出之文件，如房地產所有權狀影本、位置略圖、地籍圖謄本、土地登記簿謄本、建築改良物登記簿謄本、都市計畫套繪圖、建物測量成果圖、土地使用分區證明、使用執照影本、目前使用狀況說明、讓售或出租同意書或其他相關資料。","四、廠商應於應徵文件內標示其房地產之土地標示、面積、房屋座落、門牌號碼、各樓層合法使用面積及總面積。","五、廠商應於應徵文件內標示其房地產之讓售或出租單價及總價，房屋及土地總價應分開填列。如另有補償費用，並應逐項標示其項目及金額。","六、實地勘查時，應由廠商提出之文件。","七、勘選評估及決選原則。","八、移轉登記及付款條件。賣方將房地產產權移轉過戶予買方，並由買方取得房地產所有權狀後，依契約規定給付部分價金，驗收無誤後，再依產權移轉後房地產所有權狀所載面積及契約規定給付其餘價金。但徵選文件另有規定者，不在此限。","九、交地、交屋期限或標的物點交期限。","十、稅費負擔。土地增值稅及產權移轉前各期地價稅、房屋稅、工程受益費等一切稅費，以及買賣土地之複丈分割費用，均由賣方負擔。契稅由買方負擔。產權移轉登記費用依照法令規定，由買賣雙方各自負擔。但徵選文件另有規定者，不在此限。","十一、地政士之委託及費用負擔方式。","十二、如有出租、產權糾紛、被他人佔用或已設定他項權利，應由賣方限期負責解決，所需費用並由賣方負擔。","十三、地上物，包括建築改良物、農作改良物、墳墓及一切附著地上物，除徵選文件另有規定外，由賣方負責清除或放棄，如另有補償費用，應徵廠商應逐項標示其項目及金額。","十四、變更使用用途之申請。擬購之土地如需辦理變更編定，機關得視個案需要於徵選文件中載明按下列情形之一辦理：","（一）先行簽訂買賣契約，俟直轄市或縣（市）政府同意分割、移轉及變更使用後，再依契約辦理產權移轉登記。但契約應載明直轄市或縣（市）政府不同意時，解除契約。","（二）俟直轄市或縣（市）政府同意分割、移轉及變更使用後，再簽訂買賣契約。","十五、其他必要事項。"]},{"no":"7","label":"第7條","ch":"","cat":"b","lines":["機關採購房地產訂有底價者，訂定底價時應考量當地近期買賣實例、實價登錄資訊、政府公定價格、評定價格或標售之價格、房地漲跌趨勢及當地工商業榮枯等情形；並得委託不動產估價師或其他依法律得從事不動產估價業務者估價。","前項底價，得依第十條於認定符合需要之廠商後訂定。"]},{"no":"8","label":"第8條","ch":"","cat":"b","lines":["參加房地產應徵之廠商，應為房地產之所有權人或其委託代理人。屬代理人者，應於決標前提出由所有權人出具且經公證或認證之委託書。但屬租用且租用之標的為共有者，得依相關法令規定辦理。"]},{"no":"9","label":"第9條","ch":"","cat":"b","lines":["廠商文件經審查符合者，機關應辦理實地勘查。","前項實地勘查，得視個案特性及實際需要，擇下列事項蒐集或查證相關資料，作成勘查紀錄，必要時並拍照存證：","一、土地部分：","（一）依應徵土地地號、地籍圖謄本及土地登記簿謄本，查核土地之地段、地號及土地使用分區（都市計畫地區）或區域計畫使用分區（非都市計畫地區）、容積率、建蔽率限制等資料。","（二）依地籍圖謄本，向當地直轄市或縣（市）政府建管單位查對都市計畫情形，對所覓土地內有無道路、學校、公園或其他公共設施等之預定用地計畫。如在都市計畫地區外，應查明有無禁建、禁用或限建等限制使用規定","（三）應徵土地周圍環境情形是否有影響使用品質之設施及其距離，與鐵路或主要公路之距離，及其對外交通、噪音或污染等情形是否影響需求等資料。","（四）應徵土地之地形、地勢、位置及面積是否符合計畫用途。面臨道路現有寬度、計畫拓寬寬度與其對人員及必須進出之車輛、物料及引進之地下管線等之出入有無不便或阻礙等情形。","（五）應徵土地內地上物（如房屋、違建、果樹、水稻等農作物、高壓線或橫越桿線等）及地下物（如電力、電信設施、油管、自來水管、地下管道或地下運輸系統等管線等）之種類，對土地之使用有無影響。","（六）應徵土地內應查明有無未登記土地、畸零地、水利地、排水溝或既成道路等，及其嗣後變更處理有無困難。","（七）應徵土地之水電供應、電信設施、排水及廢棄物處理情形是否良好。","二、房屋部分：","（一）建築面積、構造型式及門牌號碼。","（二）建築年月及房屋現狀與使用情形。","（三）附屬建物情形。","（四）建築設計圖說（含水、電及其附屬工程圖）或平面圖。","三、產權部分：","（一）房地所有權無論係單獨所有或共有者，均應取得權利人之同意書。但依公寓大廈管理條例或土地法規定辦理者，不在此限。","（二）如有租賃情形或設定有典權、抵押權、地上權、不動產役權、農育權等擔保、用益物權或依法有優先承購權人時，應取得承租人、其他物權人或優先承購權人放棄權利並取得書面證明。","（三）產權如有糾紛或被他人佔用，除機關同意廠商限期解決者外，不予接受。","（四）如屬耕者有其田之放領地，被放領人應繳清地價；如屬三七五減租地，出租人應提出核准撤銷租約之證明或承諾於簽訂買賣契約前提出。","（五）查閱建築改良物登記簿謄本及房屋使用執照，是否為合法建築及是否有特殊用途限制。","四、價格部分：","（一）向地政機關查明土地公告地價，最近一期公告現值。","（二）調查市場行情：向地政事務所、鄉（鎮、市、區）公所、稅捐機關、不動產經紀人、地政士或經管公產機關查詢鄰近房地產交易案例或一般市場行情。","（三）依據建物結構，分析房屋本身之造價，並儘量蒐集同地段同結構之房屋買賣價格資料。","五、繪圖部分：","（一）向有關單位申請相關部分都市計畫圖。","（二）繪具擬購土地地形平面圖，註明長寬尺寸。如同一地號係分割地，應註明位置；如有房屋等地上物，應標明配置情形；如為都市計畫區，應附附近都市計畫圖；如非都市計畫地區，應註明鄰接道路情形。","（三）視需要繪製房屋配置圖，標示應徵房屋之全部基地及房屋位置，以及周圍道路位置及其寬度。","（四）視需要繪製房屋各樓層平面圖，依照比例尺繪出房間之尺寸位置（含樓梯及浴廁等），以及設施分布情形。"]},{"no":"10","label":"第10條","ch":"","cat":"b","lines":["機關辦理實地勘查後，應依廠商應徵文件及勘查紀錄，就房地情況、交通情形、環境衛生、價格、發展潛力、有無現存或潛在糾紛或效益分析等，認定適合需要者。","前項適合需要者之認定，準用本法有關最有利標之評選規定。"]},{"no":"11","label":"第11條","ch":"","cat":"b","lines":["機關與認定適合需要者之議價，應依下列方式辦理，並載明於徵選文件：","一、適合需要者為一家者，以議價方式辦理。","二、適合需要者有二家以上者，依適合需要順序，自最適合需要者起，依序以議價方式辦理。但有二家以上廠商為同一適合需要順序者，以標價低者優先議價。"]},{"no":"12","label":"第12條","ch":"","cat":"b","lines":["應徵之房地產如係法令規定禁止或無法變更使用以符合需要者，應不予接受。"]},{"no":"13","label":"第13條","ch":"","cat":"b","lines":["機關依本辦法洽廠商議價或協商時，應規定廠商代表攜帶身分證、印鑑、產權憑證正本及其他相關資料親自出席或委託代理人出席。"]},{"no":"14","label":"第14條","ch":"","cat":"b","lines":["本辦法自發布日施行。"]}]},{"id":"A0030075","title":"替代方案實施辦法","short":"替代方案辦法","date":"民國91年06月19日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030075","articles":[{"no":"1","label":"第1條","ch":"","cat":"b","lines":["本辦法依政府採購法（以下簡稱本法）第三十五條規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"b","lines":["機關於招標文件中規定允許投標廠商於截止投標期限前提出替代方案者，招標文件應訂明下列事項：","一、廠商得提出替代方案之技術、工法、材料或設備之項目。","二、替代方案應包括之內容。","三、替代方案標封於主方案經審查合於招標文件規定後，再予開封及審查。","四、替代方案不予審查之情形。","五、採用替代方案決標之條件。","六、以替代方案決標後得標廠商應遵循之事項。","七、得標廠商未能依替代方案履約之處置方式。","八、廠商提出替代方案應遵循之其他事項。","前項招標之等標期，機關應視案件之性質及廠商準備替代方案所需時間合理訂定之。"]},{"no":"3","label":"第3條","ch":"","cat":"b","lines":["廠商依前條規定提出替代方案者，替代方案應單獨密封，標封外標示其為替代方案，且每一項目以提出一個替代方案為限，並須依招標文件之規定提出主方案。"]},{"no":"4","label":"第4條","ch":"","cat":"b","lines":["依第二條第一項第二款所定替代方案之內容，應包括下列事項：","一、替代方案之項目及其詳細說明。","二、替代方案與主方案差異之處。","三、替代方案確可縮減工期、減省經費或提高效率等效益之理由。","四、替代方案可能涉及之各種有利與不利情形及效益分析。","五、招標文件規定之其他事項。"]},{"no":"5","label":"第5條","ch":"","cat":"b","lines":["依第二條第一項第四款所定替代方案不予審查之情形如下：","一、廠商未依招標文件之規定提出主方案者。","二、主方案經審查不合於招標文件之規定者。","三、廠商提出之替代方案與招標文件中規定允許提出替代方案之項目無關者。","四、廠商提出之替代方案不合規定程式者。"]},{"no":"6","label":"第6條","ch":"","cat":"b","lines":["依第二條第一項第五款採用替代方案決標者，應不降低招標文件所規定之原有功能條件，且與主方案比較結果確能縮減工期、減省經費或提高效率。","替代方案有下列情形之一者，應不予採用。但招標文件規定得協商更改之項目或廠商提出之替代方案經綜合評估各有利不利情形，其總體效益更有利於機關者，不在此限。","一、降低招標文件所規定之原有功能條件。","二、延長主方案之工期。","三、增加主方案之經費。","四、降低主方案之效率。","五、對機關辦理之其他採購有造成類似前四款情形之一之虞。","六、替代方案可縮減工期、減省經費、提高效率或其他效益之情形，低於招標文件所定條件。","七、替代方案顯不可行。","前項第三款經費之計算，應考量後續使用或營運成本、維修成本、殘值、報廢處理費用等。"]},{"no":"7","label":"第7條","ch":"","cat":"b","lines":["依第二條第一項第六款採用替代方案決標者，廠商於決標後須提出之資料及提出時限，應預留機關所定審查作業之時間。廠商履行替代方案所需之調查、研究、試驗、設計等費用，由廠商負擔或包含於標價中。機關實施替代方案所增加之必要費用，亦同。"]},{"no":"8","label":"第8條","ch":"","cat":"b","lines":["得標廠商未能依投標時提出之替代方案履約，或履行替代方案有第六條第二項各款情形之一者，機關應撤銷決標、終止契約或解除契約，並得追償損失。但廠商願以替代方案之標價改以合於招標文件規定之主方案履約，且原決標係以合於招標文件規定之最低標方式辦理者，不在此限。","前項改依主方案履約者，其履約期限之計算，應自原替代方案開始履約日起算，且不得扣除履行替代方案所費時間。"]},{"no":"9","label":"第9條","ch":"","cat":"b","lines":["機關允許廠商於得標後提出替代方案者，招標文件應訂明下列事項：","一、替代方案應包括之內容。","二、替代方案不予審查之情形。","三、採用替代方案之條件。","四、採用替代方案後，廠商應遵循之事項。","五、廠商未能依替代方案履約之處置方式。","六、廠商提出替代方案應遵循之其他事項。"]},{"no":"10","label":"第10條","ch":"","cat":"b","lines":["廠商依前條規定提出替代方案者，應於使用前提出，並預留機關所定審查作業所需時間。其提出、審查、採用或不採用替代方案所費時間，不得因而延長履約期限。","機關審查替代方案所需費用，由廠商負擔。"]},{"no":"11","label":"第11條","ch":"","cat":"b","lines":["依第九條第一款至第四款所定事項，準用第四條至第七條規定。"]},{"no":"12","label":"第12條","ch":"","cat":"b","lines":["廠商於得標後提出替代方案，而未能依替代方案履約，或履行替代方案有第六條第二項各款情形之一者，機關應終止或解除契約，並得追償損失。但廠商願改以合於招標文件規定之主方案或其他對機關更有利之方式履約者，不在此限。","前項改依主方案或其他方式履約者，機關為處理該方案所增加之必要費用，由廠商負擔。其履約期限之計算，應自原契約開始履約日起算，且不得扣除履行替代方案所費時間。"]},{"no":"13","label":"第13條","ch":"","cat":"b","lines":["機關於招標文件中規定允許廠商於得標後提出替代方案且定有獎勵措施者，其獎勵額度，以不逾所減省契約價金之百分之五十為限。所減省之契約價金，並應扣除機關為處理替代方案所增加之必要費用。"]},{"no":"14","label":"第14條","ch":"","cat":"b","lines":["機關審查替代方案，得視個案情形成立審查小組為之，並得邀請專家、學者、規劃設計者與會協助。必要時並得將替代方案之一部或全部委託審查。"]},{"no":"15","label":"第15條","ch":"","cat":"b","lines":["本辦法自發布日施行。"]}]},{"id":"A0030067","title":"中央機關未達公告金額採購招標辦法","short":"未達公告金額招標辦法","date":"民國107年03月08日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030067","articles":[{"no":"1","label":"第1條","ch":"","cat":"b","lines":["本辦法依政府採購法（以下簡稱本法）第二十三條規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"b","lines":["未達公告金額採購之招標，其金額逾公告金額十分之一者，得以下列方式之一辦理：","一、符合本法第二十二條第一項第一款至第十五款所定情形之一者，得採限制性招標。","二、符合本法第二十二條第一項第十六款所定情形，經需求、使用或承辦採購單位就個案敘明邀請指定廠商比價或議價之適當理由，簽報機關首長或其授權人員核准者，得採限制性招標，免報經主管機關認定。","三、依本法第四十九條之規定，將公開徵求廠商提供書面報價或企劃書之公告，公開於主管機關之資訊網路或刊登於政府採購公報，以取得三家以上廠商之書面報價或企劃書，擇符合需要者辦理比價或議價。","上級機關對於機關依前項第二款規定辦理者，得視需要訂定較嚴格之適用規定或授權條件。","第一項第三款規定情形，機關得於公告或招標文件中訂明開標時間地點，並於開標後當場審查，逕行辦理決標。"]},{"no":"3","label":"第3條","ch":"","cat":"b","lines":["機關依前條第一項第三款規定辦理第一次公告結果，未能取得三家以上廠商之書面報價或企劃書者，得經機關首長或其授權人員核准，改採限制性招標。其辦理第二次公告者，得不受三家廠商之限制。"]},{"no":"4","label":"第4條","ch":"","cat":"b","lines":["機關邀請廠商提出書面報價或企劃書，其於主管機關資訊網路之公告已包括廠商提出書面報價或企劃書所需之一切資料者，得免另備招標文件；其於擇定符合需要者進行比價或議價前之程序，除公告或招標文件已訂明開標時間地點者外，不適用本法開標及監辦程序。","機關邀請廠商提出書面報價或企劃書，得允許廠商以傳真或電子資料傳輸方式遞送，並視需要於審查後通知擇定之廠商遞送正式文件。","前項通知結果，遞送正式文件之廠商未達三家者，得經機關首長或其授權人員核准，改採限制性招標。"]},{"no":"5","label":"第5條","ch":"","cat":"b","lines":["公告金額十分之一以下採購之招標，得不經公告程序，逕洽廠商採購，免提供報價或企劃書。"]},{"no":"5-1","label":"第5-1條","ch":"","cat":"b","lines":["機關辦理位於原住民地區未達公告金額之採購，應符合原住民族工作權保障法第十一條之規定。"]},{"no":"6","label":"第6條","ch":"","cat":"b","lines":["機關不得意圖規避本辦法之適用，分批辦理未達公告金額但逾公告金額十分之一之採購。"]},{"no":"7","label":"第7條","ch":"","cat":"b","lines":["本辦法自中華民國八十八年五月二十七日施行。","本辦法修正條文自發布日施行。"]}]},{"id":"A0030070","title":"特別採購招標決標處理辦法","short":"特別採購辦法","date":"民國98年08月27日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030070","articles":[{"no":"1","label":"第1條","ch":"","cat":"b","lines":["本辦法依政府採購法（以下簡稱本法）第一百零五條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"b","lines":["本法第一百零五條第一項所稱得不適用之本法招標及決標規定，指本法第二章及第三章之規定。但不包括本法第三十四條、第五十條及第五十八條至第六十二條之規定。"]},{"no":"3","label":"第3條","ch":"","cat":"b","lines":["本法第一百零五條第一項第三款所稱公務機關，指政府機關；所稱雙方直屬上級機關，指雙方分別隸屬之上級機關。"]},{"no":"4","label":"第4條","ch":"","cat":"b","lines":["機關辦理本法第一百零五條第一項第一款之採購，應先確認國家遇有戰爭、天然災害、癘疫或財政經濟上有重大變故，總統業依憲法發布緊急命令，且該採購業經機關首長或其授權人員核准確有緊急處置之必要。","前項核准文件應記載本法招標及決標規定中因緊急處置得不適用之條文；其未記載者，仍應適用本法之規定。"]},{"no":"5","label":"第5條","ch":"","cat":"b","lines":["機關辦理本法第一百零五條第一項第二款之採購，應先確認人民之生命、身體、健康或財產遭遇緊急危難，且該採購業經機關首長或其授權人員核准確有緊急處置之必要。","前項核准文件應記載本法招標及決標規定中因緊急處置得不適用之條文；其未記載者，仍應適用本法之規定。"]},{"no":"6","label":"第6條","ch":"","cat":"b","lines":["機關依本法第一百零五條第一項第一款及第二款辦理採購之決標，應符合下列原則：","一、不及與廠商簽訂契約者，應先有書面、電報或傳真協議。","二、不及與廠商確定契約總價者，應先確定單價及工作範圍。","三、付款條件應能維護公款支用之安全性。"]},{"no":"6-1","label":"第6-1條","ch":"","cat":"b","lines":["公務機關間財物或勞務之取得，依本法第一百零五條第一項第三款辦理者，應符合下列情形之一：","一、非屬一般廠商所能製造或供應者。","二、於國家安全或機密有必要者。","三、依本法辦理公告結果，無廠商投標或提供書面報價或企劃書者。","四、未達公告金額之採購。","五、其他經主管機關認定者。"]},{"no":"7","label":"第7條","ch":"","cat":"b","lines":["機關依本法第一百零五條辦理之採購，應將其所依據之情形記載於依本法第六十一條刊登之決標公告及依本法第六十二條彙送之決標資料。"]},{"no":"8","label":"第8條","ch":"","cat":"b","lines":["公務機關依本法第一百零五條第一項第三款提供財物或勞務予其他機關之年度總額達巨額採購金額，且占該公務機關年收入之百分之五十以上者，其上級機關應檢討該公務機關年度內提供財物或勞務予其他機關之成本效益。","前項成本效益分析結果欠佳，且有其他廠商能以更優惠之價格或條件提供相同或更佳之財物或勞務者，上級機關應避免核准所屬公務機關依本法第一百零五條第一項第三款辦理採購。"]},{"no":"8-1","label":"第8-1條","ch":"","cat":"b","lines":["公立學校及公營事業向政府機關採購財物或勞務，得準用本辦法之規定。"]},{"no":"9","label":"第9條","ch":"","cat":"b","lines":["本辦法自中華民國八十八年五月二十七日施行。","本辦法修正條文自發布日施行。"]}]},{"id":"A0030063","title":"統包實施辦法","short":"統包實施辦法","date":"民國101年09月24日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030063","articles":[{"no":"1","label":"第1條","ch":"","cat":"b","lines":["本辦法依政府採購法（以下簡稱本法）第二十四條第三項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"b","lines":["（刪除）"]},{"no":"3","label":"第3條","ch":"","cat":"b","lines":["機關以統包辦理招標，其併於同一採購契約辦理招標之範圍如下：","一、工程採購，含細部設計及施工，並得包含基本設計、測試、訓練、一定期間之維修或營運等事項。","二、財物採購，含細部設計、供應及安裝，並得包含基本設計、測試、訓練、一定期間之維修或營運等事項。"]},{"no":"4","label":"第4條","ch":"","cat":"b","lines":["機關以統包辦理招標，應依其屬工程或財物之採購，於招標文件規定投標廠商應符合下列情形之一：","一、屬負責細部設計及施工之廠商。","二、屬負責細部設計或施工之廠商。","三、屬負責細部設計、供應及安裝之廠商。","四、屬負責細部設計或供應及安裝之廠商。","前項招標，機關得於招標文件中規定允許一定家數內之廠商共同投標。"]},{"no":"5","label":"第5條","ch":"","cat":"b","lines":["機關以統包辦理招標，得依實際需要，於招標文件中規定投標廠商或其分包廠商關於設計之履約能力資格。"]},{"no":"6","label":"第6條","ch":"","cat":"b","lines":["機關以統包辦理招標，除法令另有規定者外，應於招標文件載明下列事項：","一、統包工作之範圍。","二、統包工作完成後所應達到之功能、效益、標準、品質或特性。","三、設計、施工、安裝、供應、測試、訓練、維修或營運等所應遵循或符合之規定、設計準則及時程。","四、主要材料或設備之特殊規範。","五、甄選廠商之評審標準。","六、投標廠商於投標文件須提出之設計、圖說、主要工作項目之時程、數量、價格或計畫內容等。"]},{"no":"7","label":"第7條","ch":"","cat":"b","lines":["機關以統包辦理招標，招標文件所規定之評審標準，應包括廠商之技術能力、設計與計畫之完整性及可行性。"]},{"no":"8","label":"第8條","ch":"","cat":"b","lines":["機關以統包辦理招標，應於招標文件規定下列事項：","一、得標廠商之設計應送機關或其指定機構審查後，始得據以施工或供應、安裝。","二、設計有變更之必要者，應經機關同意或依機關之通知辦理。其變更係不可歸責於廠商者，廠商得向機關請求償付履約所增加之必要費用。","三、設計結果不符合契約規定或無法依機關之通知變更者，機關得終止或解除契約。"]},{"no":"9","label":"第9條","ch":"","cat":"b","lines":["機關以統包辦理招標，應於招標文件規定得標廠商設計成果之智慧財產權歸屬及侵害第三人合法權益時由廠商負責處理並承擔一切法律責任。","前項權利，機關得視需要取得部分或全部權利或取得授權。"]},{"no":"10","label":"第10條","ch":"","cat":"b","lines":["機關以統包辦理招標並規定廠商於投標時提出設計圖者，得就審查達一定分數或名次之未得標廠商，依招標文件之規定，發給獎勵金。"]},{"no":"11","label":"第11條","ch":"","cat":"b","lines":["本辦法自中華民國八十八年五月二十七日施行。","本辦法修正條文自發布日施行。"]}]},{"id":"A0030099","title":"投標廠商資格與特殊或巨額採購認定標準","short":"資格暨巨額標準","date":"民國104年10月29日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030099","articles":[{"no":"1","label":"第1條","ch":"","cat":"b","lines":["本標準依政府採購法（以下簡稱本法）第三十六條第四項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"b","lines":["機關辦理採購，得依採購案件之特性及實際需要，就下列事項訂定投標廠商之基本資格，並載明於招標文件：","一、與提供招標標的有關者。","二、與履約能力有關者。"]},{"no":"3","label":"第3條","ch":"","cat":"b","lines":["機關依前條第一款訂定與提供招標標的有關之基本資格時，得依採購案件之特性及實際需要，就下列事項擇定廠商應附具之證明文件：","一、廠商登記或設立之證明。如公司登記或商業登記證明文件、非屬營利事業之法人、機構或團體依法須辦理設立登記之證明文件、工廠登記證明文件、許可登記證明文件、執業執照、開業證明、立案證明或其他由政府機關或其授權機構核發該廠商係合法登記或設立之證明文件。","二、廠商納稅之證明。如營業稅或所得稅。","三、廠商依工業團體法或商業團體法加入工業或商業團體之證明。如會員證。","前項第一款證明，廠商得以列印公開於目的事業主管機關網站之資料代之。廠商附具之證明文件，其內容與招標文件之規定有異，但截止投標前公開於目的事業主管機關網站之該廠商最新資料符合招標文件規定者，機關得允許廠商列印該最新資料代之。","第一項第一款證照，依法令係按一定條件發給不同等級之證照或並定承包限額者，依其規定。","第一項第一款登記或設立之證明，機關規定須具有特定營業項目方可參與投標者，其所規定之營業項目，不得不當限制競爭，並應以經濟部編訂之公司行號營業項目代碼表所列之大類、中類、小類或細類項目為基準。該特定營業項目非屬許可業務者，廠商所營事業之登記，如載明除許可業務外，得經營法令非禁止或限制之業務者，視為包括該特定營業項目。","第一項第二款納稅證明，其屬營業稅繳稅證明者，為營業稅繳款書收據聯或主管稽徵機關核章之最近一期營業人銷售額與稅額申報書收執聯。廠商不及提出最近一期證明者，得以前一期之納稅證明代之。新設立且未屆第一期營業稅繳納期限者，得以營業稅主管稽徵機關核發之核准設立登記公函代之；經核定使用統一發票者，應一併檢附申領統一發票購票證相關文件。營業稅或所得稅之納稅證明，得以與上開最近一期或前一期證明相同期間內主管稽徵機關核發之無違章欠稅之查復表代之。","第一項第三款加入工業或商業團體之證明，除法令另有規定外，不得限制由特定區域之團體出具；投標廠商為外國廠商者，得免附具。"]},{"no":"4","label":"第4條","ch":"","cat":"b","lines":["機關依第二條第二款訂定與履約能力有關之基本資格時，得依採購案件之特性及實際需要，就下列事項擇定廠商應附具之證明文件或物品：","一、廠商具有製造、供應或承做能力之證明。如曾完成與招標標的類似之製造、供應或承做之文件、招標文件規定之樣品、現有或得標後可取得履約所需設備、技術、財力、人力或場所之說明或品質管制能力文件等。","二、廠商具有如期履約能力之證明。如迄投標日止正履行中之所有契約尚未完成部分之總量說明、此等契約有逾期履約情形者之清單、逾期情形及逾期責任之說明、律師所出具之迄投標日止廠商涉及賠償責任之訴訟中案件之清單及說明或廠商如得標則是否確可如期履約及如何能如期履約之說明等。","三、廠商或其受雇人、從業人員具有專門技能之證明。如政府機關或其授權機構核發之專業、專技或特許證書、執照、考試及格證書、合格證書、檢定證明或其他類似之文件。","四、廠商具有維修、維護或售後服務能力之證明。如維修人員經專業訓練之證明、設立或具有或承諾於得標後一定期間內建立自有或特約維修站或場所之證明等。","五、廠商信用之證明。如票據交換機構或受理查詢之金融機構於截止投標日之前半年內所出具之非拒絕往來戶及最近三年內無退票紀錄證明、會計師簽證之財務報表或金融機構或徵信機構出具之信用證明等。","六、其他法令規定或經主管機關認定者。","前項第三款證明，除依法令就一定專門技能人員之人數為規定者外，不得對其人數予以限制。","第一項第五款無退票紀錄證明，如有退票但已辦妥清償註記者，視同無退票紀錄。機關有證據顯示廠商於截止投標期限前，係拒絕往來戶或有退票紀錄者，依證據處理。"]},{"no":"5","label":"第5條","ch":"","cat":"b","lines":["機關辦理特殊或巨額採購，除依第二條規定訂定基本資格外，得視採購案件之特性及實際需要，就下列事項擇定投標廠商之特定資格，並載明於招標文件：","一、具有相當經驗或實績者。其範圍得包括於截止投標日前五年內，完成與招標標的同性質或相當之工程、財物或勞務契約，其單次契約金額或數量不低於招標標的預算金額或數量之五分之二，或累計金額或數量不低於招標標的預算金額或數量，並得含採購機關（構）出具之驗收證明或啟用後功能正常之使用情形證明。","二、具有相當人力者。其範圍得包括投標廠商現有與承包招標標的有關之專業或一般人力證明。","三、具有相當財力者。其範圍得包括實收資本額不低於招標標的預算金額之十分之一，或經會計師簽證或審計機關審定之上一會計年度或最近一年度財務報告及其所附報表，其內容合於下列規定者：","（一）權益不低於招標標的預算金額十二分之一。","（二）流動資產不低於流動負債。","（三）總負債金額不超過權益四倍。但配合民營化政策之公營事業參加投標者，不在此限。","四、具有相當設備者。其範圍得包括完成與招標標的同性質或相當之工程、財物或勞務所需之自有設備。其尚無自有者，得以租賃、租賃承諾證明或採購中或得標後承諾採購證明代之。","五、具有符合國際或國家品質管理之驗證文件者。","六、其他經主管機關認定者。","前項第一款及第三款所定期間、數量、金額或比例，機關不得縮限。但得視採購之性質及需要予以放寬；第三款所稱實收資本額，於有限公司、無限公司或兩合公司指資本總額。第三款第三目之總負債金額，應扣除依其他法律政府獎勵民間投資金額。","機關依第一項第一款及第三款以預算金額訂定資格條件者，應於招標公告或招標文件載明預算金額。履約期間逾一年之勞務採購，其以提供勞力為主，且工作內容重複者，以第一年之預算金額訂定資格條件。"]},{"no":"6","label":"第6條","ch":"","cat":"b","lines":["工程採購有下列情形之一者，為特殊採購：","一、興建構造物，地面高度超過五十公尺或地面樓層超過十五層者。","二、興建構造物，單一跨徑在五十公尺以上者。","三、開挖深度在十五公尺以上者。","四、興建隧道，長度在一千公尺以上者。","五、於地面下或水面下施工者。","六、使用特殊施工方法或技術者。","七、古蹟構造物之修建或拆遷。","八、其他經主管機關認定者。"]},{"no":"7","label":"第7條","ch":"","cat":"b","lines":["財物或勞務採購有下列情形之一，為特殊採購：","一、採購標的之規格、製程、供應或使用性質特殊者。","二、採購標的需要特殊專業或技術人才始能完成者。","三、採購標的需要特殊機具、設備或技術始能完成者。","四、藝術品或具有歷史文化紀念價值之古物。","五、其他經主管機關認定者。"]},{"no":"7-1","label":"第7-1條","ch":"","cat":"b","lines":["採購兼有工程、財物或勞務二種以上性質，而以其中之一認定其歸屬者，其他性質符合前二條情形之一，得以該其他性質於該採購所占比例或相關部分訂定特定資格。"]},{"no":"8","label":"第8條","ch":"","cat":"b","lines":["採購金額在下列金額以上者，為巨額採購：","一、工程採購，為新台幣二億元。","二、財物採購，為新台幣一億元。","三、勞務採購，為新台幣二千萬元。"]},{"no":"9","label":"第9條","ch":"","cat":"b","lines":["機關採複數決標或分批辦理巨額採購，其個別項目或數量或分批採購之預算金額未達前條巨額採購認定標準者，不適用巨額採購有關廠商資格之規定。"]},{"no":"10","label":"第10條","ch":"","cat":"b","lines":["投標廠商應提出之資格證明文件，除招標文件另有規定者外，以影本為原則。但機關得通知投標廠商提出正本供查驗。","前項影本之尺寸與正本不一致，或未載明與正本相符、未加蓋廠商印章等情事，而不影響辨識其內容或真偽者，機關不得拒絕。","第一項證明文件，得以目的事業主管機關核准之電子資料替代。"]},{"no":"11","label":"第11條","ch":"","cat":"b","lines":["採購標的內之重要項目，有就該等項目訂定分包廠商資格之必要者，適用本法有關投標廠商資格之規定。"]},{"no":"12","label":"第12條","ch":"","cat":"b","lines":["機關辦理外國廠商得參與之採購，招標文件規定投標廠商應提出之資格文件，外國廠商依該國情形提出有困難者，得於投標文件內敘明其情形或以其所具有之相當資格代之。"]},{"no":"13","label":"第13條","ch":"","cat":"b","lines":["機關訂定投標廠商之特定資格時，應先評估可能符合特定資格之廠商家數，並檢討有無不當限制競爭之情形。"]},{"no":"14","label":"第14條","ch":"","cat":"b","lines":["廠商履行契約所必須具備之財務、商業或技術資格條件，應就廠商在我國或外國之商業活動為整體考量，不以其為政府機關、公立學校或公營事業所完成者為限。"]},{"no":"15","label":"第15條","ch":"","cat":"b","lines":["機關訂定招標文件，對於投標廠商之設立地或所在地，除其他法令另有規定者外，不應予以限制。","對於外國廠商之設立地或所在地之限制，應依本法第十七條規定辦理。"]},{"no":"16","label":"第16條","ch":"","cat":"b","lines":["依政府機關組織法律組成之非公司組織事業機構，依法令免申請核發許可登記證明文件、公司登記或商業登記證明文件、承攬或營業手冊、繳稅證明文件或加入商業團體者，參加投標時，得免繳驗該等證明文件。"]},{"no":"17","label":"第17條","ch":"","cat":"b","lines":["本標準自中華民國八十八年五月二十七日施行。","本標準修正條文自發布日施行。"]}]},{"id":"A0030076","title":"機關委託專業服務廠商評選及計費辦法","short":"專業服務評選辦法","date":"民國114年05月23日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030076","articles":[{"no":"1","label":"第1條","ch":"","cat":"d","lines":["本辦法依政府採購法（以下簡稱本法）第二十二條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"d","lines":["機關以公開客觀評選方式委託廠商提供專業服務，服務費用在公告金額以上者，其廠商評選與服務費用之計算方式，依本辦法之規定。"]},{"no":"3","label":"第3條","ch":"","cat":"d","lines":["本法第二十二條第一項第九款所稱專業服務，指提供專門知識或技藝之服務；包括法律、會計、財務、地政、醫療、保健、防疫或病蟲害防治、文化藝術、研究發展及其他與提供專門知識或技藝有關之服務。"]},{"no":"4","label":"第4條","ch":"","cat":"d","lines":["機關委託廠商承辦專業服務，除法令另有規定者外，其招標文件得視個案特性及實際需要載明下列事項：","一、服務之項目及工作範圍。","二、應徵廠商之資格條件及應檢附之文件。","三、服務之提供方式。","四、工作時程。","五、涉及材料或設備之供應者，其規格。","六、服務之工作範圍及內容明確者，其績效衡量指標、驗收項目及標準。","七、廠商應提出之專業服務建議書及應含之內容。如主要工作項目之時程、數量、價格、計畫內容、章節次序或頁數限制等。","八、智慧財產權之歸屬。","九、評審項目、評審標準及評選方式。","十、與評選優勝廠商議價及決標原則。","十一、計價及付款方式。","十二、招標須知及契約條款。","十三、廠商於評選時須提出簡報者，其進行方式。","十四、預算或預計金額。","十五、其他必要事項。"]},{"no":"5","label":"第5條","ch":"","cat":"d","lines":["前條第九款評審項目，除法令另有規定者外，得視個案特性及實際需要載明下列事項：","一、廠商所具備之專業人力、經驗或實績等資格。","二、計畫主持人及主要工作人員之經驗及能力。","三、計畫執行方式。","四、如期履約能力。","五、價格。","六、建議書之完整性、可行性及對服務事項之瞭解程度。","七、其他必要事項。"]},{"no":"6","label":"第6條","ch":"","cat":"d","lines":["機關公開徵選廠商承辦專業服務之審查，其招標文件訂有廠商資格者，應先審查資格文件。資格不合於招標文件之規定者，其他部分不予審查。","機關評選結果應通知廠商，對未獲選者並應敘明其原因。"]},{"no":"7","label":"第7條","ch":"","cat":"d","lines":["採購評選委員會評選優勝廠商，得不以一家為限。","前項評選作業，準用本法有關最有利標之評選規定。"]},{"no":"8","label":"第8條","ch":"","cat":"d","lines":["機關與評選優勝廠商之議價，應依下列方式辦理，並載明於招標文件：","一、優勝廠商為一家者，以議價方式辦理。","二、優勝廠商有二家以上者，依優勝順序，自最優勝者起，依序以議價方式辦理。但有二家以上廠商為同一優勝順序者，擇配分最高之評選項目之得分合計值較高者，優先議價；如配分最高之評選項目有兩項以上者，以該等項目得分合計值較高者，優先議價；得分仍相同者，就該等廠商再進行綜合評選一次，以總評分最高、價格與總評分之商數最低或序位合計值最低者，優先議價；其再次相同者，抽籤決定之。"]},{"no":"9","label":"第9條","ch":"","cat":"d","lines":["機關依前條辦理議價之決標，應依下列規定之一辦理：","一、招標文件已訂明固定服務費用或費率者，依該服務費用或費率決標。","二、招標文件未訂明固定服務費用或費率者，其超底價決標或廢標適用本法第五十三條第二項及第五十四條之規定。","機關訂定前項第二款之底價，適用本法第四十六條規定。議價廠商之報價合理且在預算金額以內者，機關得依其報價訂定底價，照價決標。"]},{"no":"10","label":"第10條","ch":"","cat":"d","lines":["機關委託廠商承辦專業服務，其服務費用之計算，應視專業服務之類別、性質、規模、工作範圍及內容或工作期間等情形，就下列方式擇符合需要者訂明於契約：","一、總包價法或單價計算法。","二、按月、按日或按時計酬法。","三、服務成本加公費法。","依前項計算之服務費用，應參酌一般收費情形核實議定。其必須核實另支費用者，應於契約內訂明項目及費用範圍；契約未規定者，不得另為任何給付。"]},{"no":"11","label":"第11條","ch":"","cat":"d","lines":["總包價法或單價計算法，適用於工作範圍及內容明確，服務費用之總價可以正確估計或可按服務項目之單價計算其總價者。"]},{"no":"12","label":"第12條","ch":"","cat":"d","lines":["按月、按日或按時計酬法，適用於工作範圍小，僅需少數專業工作人員作時間短暫之服務，或工作範圍及內容無法明確界定，致總費用難以正確估計者。","前項服務費用，薪資之計算得為下列方式之一；薪資以外之其他費用，可另行計算給付。","一、採按月計酬法者，每月薪資可按契約所載工作人員月薪計算。","二、採按日計酬法者，每日薪資可按契約所載工作人員日薪計算。","三、採按時計酬法者，每時薪資可按契約所載工作人員時薪計算。"]},{"no":"13","label":"第13條","ch":"","cat":"d","lines":["服務成本加公費法，適用於計畫性質複雜，服務費用不易確實預估或履約成果不確定之服務案件。","前項服務費用，得包括下列各款費用：","一、直接費用：","（一）直接薪資：包括契約所載直接從事專業服務工作人員之實際薪資，另加實際薪資之一定比率作為工作人員不扣薪假與特別休假之薪資費用；非經常性給與之獎金；及依法應由雇主負擔之勞工保險費、積欠工資墊償基金提繳費、全民健康保險費、勞工退休金。","（二）管理費用：包括未在直接薪資項下開支之管理及會計人員之薪資、保險費及退休金、辦公室費用、水電及冷暖氣費用、機器設備及傢俱等之折舊或租金、辦公事務費、機器設備之搬運費、郵電費、業務承攬費、廣告費、準備及結束工作所需費用、參加國內外專業會議費用、業務及人力發展費用、研究費用或專業聯繫費用及有關之稅捐等。但全部管理費用不得超過直接薪資扣除非經常性給與之獎金後之百分之一百。","（三）其他直接費用：包括執行委辦案件工作時所需直接薪資以外之各項直接費用。如差旅費、加班費、資料收集費、專利費、外聘顧問之報酬、電腦軟體費、圖表報告之複製印刷費及有關之各項稅捐、會計師簽證費用等。","二、公費：指廠商提供專業服務所得之報酬，包括風險、利潤及有關之稅捐等。","三、營業稅。","前項第一款第一目工作人員不扣薪假與特別休假之薪資費用，得由機關依實際需要於招標文件明定為實際薪資之一定比率及給付條件，免檢據核銷。但不得超過實際薪資之百分之十六。","第二項第一款第一目非經常性給與之獎金，得由機關依實際需要於招標文件明定為實際薪資之一定比率及給付條件，檢據核銷。但不得超過實際薪資之百分之三十。","第二項第一款第一目依法應由雇主負擔之勞工保險費、積欠工資墊償基金提繳費、全民健康保險費、勞工退休金，由機關核實給付。","第二項第二款公費，應為定額，不得按直接薪資及管理費之金額依一定比率增加，且全部公費不得超過直接薪資扣除非經常性給與之獎金後與管理費用合計金額之百分之二十五。"]},{"no":"14","label":"第14條","ch":"","cat":"d","lines":["機關委託廠商承辦專業服務，得於招標文件規定得標廠商服務費用降低或實際績效提高時，得依其情形給付廠商獎勵性報酬。","前項獎勵性報酬之給付方式如下，由機關於招標文件中訂明：","一、屬服務費用降低者，為所減省之契約價金金額之一定比率。","二、屬實際績效提高者，依契約所載計算方式給付。","前項第一款一定比率，以不逾百分之五十為限；第二款給付金額，以不逾契約價金總額或契約價金上限之百分之十為限。"]},{"no":"15","label":"第15條","ch":"","cat":"d","lines":["機關採服務成本加公費法者，應於契約訂明下列事項：","一、廠商應記錄各項費用並提出憑證，機關並得至廠商處所辦理查核。","二、成本上限及逾上限時之處理。","前項第一款憑證，應包括各項費用之發票、收據、紀錄或報表；除契約另有規定外，憑證得為影本。"]},{"no":"16","label":"第16條","ch":"","cat":"d","lines":["廠商之服務費用，得於契約規定於訂約後預付一部分，其餘按月或分期支付。但各次付款金額及條件應予訂明。","前項預付一部分者，以不逾契約總額或預估給付總額之百分之三十為原則。"]},{"no":"17","label":"第17條","ch":"","cat":"d","lines":["機關委託廠商承辦專業服務，其履約期間在一年以上者，得於契約內訂明自第二年起得隨物價指數調整契約價金，並敘明其所適用之調整項目、調整方式及調整金額上限。"]},{"no":"18","label":"第18條","ch":"","cat":"d","lines":["機關委託廠商承辦專業服務，應於徵選文件規定得標廠商專業服務成果之智慧財產權歸屬及侵害第三人合法權益時由廠商負責處理並承擔一切法律責任。","前項權利，機關得視需要取得部分或全部權利或取得授權。"]},{"no":"19","label":"第19條","ch":"","cat":"d","lines":["機關委託廠商承辦專業服務，非依本法第二十二條第一項第九款辦理者，得準用本辦法之規定。"]},{"no":"20","label":"第20條","ch":"","cat":"d","lines":["本辦法自中華民國八十八年五月二十七日施行。","本辦法修正條文自發布日施行。"]}]},{"id":"A0030077","title":"機關委託技術服務廠商評選及計費辦法","short":"技術服務評選辦法","date":"民國114年05月23日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030077","articles":[{"no":"1","label":"第1條","ch":"第一章總則","cat":"d","lines":["本辦法依政府採購法（以下簡稱本法）第二十二條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"第一章總則","cat":"d","lines":["機關依本法第二十二條第一項第九款以公開客觀評選方式委託廠商提供技術服務，其廠商評選與服務費用之計算方式，依本辦法之規定。"]},{"no":"3","label":"第3條","ch":"第一章總則","cat":"d","lines":["本辦法所稱技術服務，指工程技術顧問公司、技師事務所、建築師事務所及其他依法令規定得提供技術性服務之自然人或法人所提供與技術有關之可行性研究、規劃、設計、監造、專案管理或其他服務。","前項技術服務，依法令應由專門職業及技術人員或法定機構提供者，不得由其他人員或機構提供。"]},{"no":"4","label":"第4條","ch":"第一章總則","cat":"d","lines":["機關委託廠商辦理可行性研究，得依採購案件之特性及實際需要，就下列服務項目擇定之：","一、計畫概要之研擬。","二、初步踏勘及現況調查。","三、研究工址相關範圍既有地形圖、測量、地質、土壤、水文氣象、材料等資料蒐集及其他調查、試驗或勘測。","四、都市計畫、區域計畫等之調查及研究。","五、計畫需求調查及分析。","六、計畫相關資料之分析、整理及評估。","七、方案研擬及比較評估。","八、計畫成本之初估及經濟效益評估。","九、財務之分析及建議。","十、風險及不定性分析。","十一、經營管理方式之研究。","十二、初步運輸及交通衝擊評估。","十三、可行性報告及建議。","十四、其他與可行性研究有關且載明於招標文件或契約之技術服務。"]},{"no":"5","label":"第5條","ch":"第一章總則","cat":"d","lines":["機關委託廠商辦理規劃，得依採購案件之特性及實際需要，就下列服務項目擇定之：","一、勘察工程基地。","二、繪製工程基地位置圖。","三、可行性研究結果之檢討及建議。","四、測量、地質調查、鑽探及試驗、土壤調查及試驗、水文氣象觀測及調查、材料調查及試驗、模型試驗及其他調查、試驗或勘測。","五、計畫相關資料之補充、分析及評估。","六、運輸規劃。","七、製作規劃圖說。如配置圖、平面圖、立面圖及具代表性之剖面圖等草案構想。","八、製作工程計畫書。如設計準則、規範等級說明、構造物型式及施工法（含特殊構造物方案及比較）、材料種類、結構及設備系統概要說明、構造物耐震及防蝕對策、營建土石方處理、工程計畫期程、工程經費概算等初步建議。","九、都市計畫、區域計畫等之規劃。","十、施工計畫、交通維持計畫、監測及緊急應變等初步規劃。","十一、使用期限規劃及維護管理策略。","十二、規劃報告。","十三、其他與規劃有關且載明於招標文件或契約之技術服務。"]},{"no":"6","label":"第6條","ch":"第一章總則","cat":"d","lines":["機關委託廠商辦理設計，得依採購案件之特性及實際需要，就下列服務項目擇定之：","一、基本設計：","（一）規劃報告及設計標的相關資料之檢討及建議。","（二）非與已辦項目重複之詳細測量、詳細地質調查、鑽探及試驗及招標文件所載其他詳細調查、試驗或勘測。","（三）基本設計圖文資料：","1.構造物及其環境配置規劃設計圖。","2.基本設計圖。如平面圖、立面圖、剖面圖及招標文件所載其他基本設計圖。","3.結構及設備系統研擬。","4.工程材料方案評估比較。","5.構造物型式及工法方案評估比較。","6.特殊構造物方案評估比較。","7.構造物耐震對策評估報告。","8.構造物防蝕對策評估報告。","9.綱要規範。","（四）量體計算分析及法規之檢討。","（五）細部設計準則之研擬。","（六）營建剩餘土石方之處理方案。","（七）施工規劃及施工初步時程之擬訂。","（八）成本概估。","（九）採購策略及分標原則之研訂。","（十）基本設計報告。","二、細部設計：","（一）非與已辦項目重複之補充測量、補充地質調查、補充鑽探及試驗及其他必要之補充調查、試驗。","（二）細部設計圖文資料：","1.工程圖文資料。如配置圖、平面圖、立面圖、剖面圖、排水配置圖、地質柱狀圖等。","2.結構圖文資料。如結構詳圖、結構計算書等。","3.設備圖文資料。如水、電、空調、消防、電信、機械、儀控等設備詳圖、計算書、規範等。","（三）施工或材料規範之編擬。","（四）工程或材料數量之估算及編製。","（五）成本分析及估算。","（六）施工計畫及交通維持計畫之擬訂。","（七）分標計畫及施工進度之擬訂及整合。","（八）發包預算及招標文件之編擬。","三、代辦申請建築執照與水、電、空調、消防或電信之工程設計圖說資料送審。","四、協辦下列招標及決標有關事項：","（一）各項招標作業，包括參與標前會議、設計、施工說明會。","（二）招標文件之釋疑、變更或補充。","（三）投標廠商、分包廠商、設備製造廠商資格之審查及諮詢。","（四）開標、審標及提供決標建議。","（五）契約之簽訂。","（六）招標、開標、審標或決標爭議之處理。","五、其他與設計有關且載明於招標文件或契約之技術服務。","前項設計，應符合節省能源、減少溫室氣體排放、保護環境、節約資源、經濟耐用等目的，並考量景觀、自然生態、生活美學及性別、身心障礙、高齡、兒童等使用者友善環境。"]},{"no":"7","label":"第7條","ch":"第一章總則","cat":"d","lines":["機關委託廠商辦理監造，得依採購案件之特性及實際需要，就下列服務項目擇定之：","一、擬訂監造計畫並依核定之計畫內容據以執行。","二、派遣人員留駐工地，持續性監督施工廠商按契約及設計圖說施工及查證施工廠商履約。","三、施工廠商之施工計畫、品質計畫、預定進度、施工圖、器材樣品、趕工計畫、工期展延與其他送審案件之審查及管制。","四、重要分包廠商及設備製造商資格之審查。","五、施工廠商放樣、施工基準測量及各項測量之校驗。","六、監督及查驗施工廠商辦理材料及設備之品質管理工作。","七、監督施工廠商執行工地安全衛生、交通維持及環境保護等工作。","八、履約進度查證與管理及履約估驗計價之審查。","九、有關履約界面之協調及整合。","十、契約變更之建議及協辦。","十一、機電設備測試及試運轉之監督。","十二、審查竣工圖表、工程結算明細表及契約所載其他結算資料。","十三、驗收之協辦。","十四、協辦履約爭議之處理。","十五、其他與監造有關且載明於招標文件或契約之技術服務。","前項第二款派遣人員之資格、人數、是否專任、留駐工地期間及權責分工，應於委託契約載明。","監造建築師、技師或其他專門職業及技術人員執行監造業務或監造簽證事項，其屬法令規定或契約約定應親自赴現場查驗、勘驗、初驗、驗收、會勘或出席會議者，應配合到場辦理、說明、會辦。"]},{"no":"8","label":"第8條","ch":"第一章總則","cat":"d","lines":["機關委託廠商辦理第四條至第七條之服務，得依個案特性及實際需要，擇定下列服務項目，併案招標，或另案辦理招標：","一、有關專業技術之資料與報告之研究、評審及補充。","二、替代方案、工程設計及施工可行性之審查及建議。","三、各階段環境影響評估及相關說明書、報告書之編製及送審。","四、水土保持計畫之辦理及送審。","五、申請公有建築物候選綠建築證書或綠建築標章。","六、特殊設備之設計、審查、監造、檢驗及安裝之監督。","七、操作及維護人員之訓練。","八、協辦有關器材、設備及零件之採購。","九、關於生產及營運技術之改善。","十、設施安全之評估。","十一、協辦設備之操作及營運管理。","十二、操作及維護手冊之編擬。","十三、價值工程分析。","十四、協助處理民眾抗爭、災害搶救或管線遷移等事項。","十五、其他與技術服務有關且載明於招標文件或契約之事項。"]},{"no":"9","label":"第9條","ch":"第一章總則","cat":"d","lines":["機關委託廠商辦理專案管理，得依採購案件之特性及實際需要，就下列服務項目擇定之：","一、可行性研究之諮詢及審查：","（一）計畫需求之評估。","（二）可行性報告、環境影響說明書及環境影響評估報告書之審查。","（三）方案之比較研究或評估。","（四）財務分析及財源取得方式之建議。","（五）初步預算之擬訂。","（六）計畫綱要進度表之編擬。","（七）設計需求之評估及建議。","（八）專業服務及技術服務廠商之甄選建議及相關文件之擬訂。","（九）用地取得及拆遷補償分析。","（十）資源需求來源之評估。","（十一）其他與可行性研究有關且載明於招標文件或契約之專案管理服務。","二、規劃之諮詢及審查：","（一）規劃圖說及概要說明書之諮詢及審查。","（二）都市計畫、區域計畫或水土保持計畫等規劃之諮詢及審查。","（三）設計準則之審查。","（四）規劃報告之諮詢及審查。","（五）其他與規劃有關且載明於招標文件或契約之專案管理服務。","三、設計之諮詢及審查：","（一）專業服務及技術服務廠商之工作成果審查、工作協調及督導。","（二）材料、設備系統選擇及採購時程之建議。","（三）計畫總進度表之編擬。","（四）設計進度之管理及協調。","（五）設計、規範（含綱要規範）與圖樣之審查及協調。","（六）設計工作之品管及檢核。","（七）施工可行性之審查及建議。","（八）專業服務及技術服務廠商服務費用計價作業之審核。","（九）發包預算之審查。","（十）發包策略及分標原則之研訂或建議，或分標計畫之審查。","（十一）文件檔案及工程管理資訊系統之建立。","（十二）其他與設計有關且載明於招標文件或契約之專案管理服務。","四、招標、決標之諮詢及審查：","（一）招標文件之準備或審查。","（二）協助辦理招標作業之招標文件之說明、澄清、補充或修正。","（三）協助辦理投標廠商資格之訂定及審查作業。","（四）協助辦理投標文件之審查及評比。","（五）協助辦理契約之簽訂。","（六）協助辦理器材、設備、零件之採購。","（七）其他與招標、決標有關且載明於招標文件或契約之專案管理服務。","五、施工督導與履約管理之諮詢及審查：","（一）各工作項目界面之協調及整合。","（二）施工計畫、品管計畫、預訂進度、施工圖、器材樣品及其他送審資料之審查或複核。","（三）重要分包廠商及設備製造商資歷之審查或複核。","（四）施工品質管理工作之督導或稽核。","（五）工地安全衛生、交通維持及環境保護之督導或稽核。","（六）施工進度之查核、分析、督導及改善建議。","（七）施工估驗計價之審查或複核。","（八）契約變更之處理及建議。","（九）契約爭議與索賠案件之協助處理。但不包括擔任訴訟代理人。","（十）竣工圖及結算資料之審定或複核。","（十一）給排水、機電設備、管線、各種設施測試及試運轉之督導及建議。","（十二）協助辦理工程驗收、移交作業。","（十三）設備運轉及維護人員訓練。","（十四）維護及運轉手冊之編擬或審定。","（十五）特殊設備圖樣之審查、監造、檢驗及安裝之監督。","（十六）計畫相關資料之彙整、評估及補充。","（十七）其他與施工督導及履約管理有關且載明於招標文件或契約之專案管理服務。","機關委託廠商辦理前項專案管理，得視工程性質及實際需要，將第七條第一項之監造服務項目，與前項第五款之服務項目整合，並排除重複及利益衝突情形後，一併委託辦理。"]},{"no":"10","label":"第10條","ch":"第一章總則","cat":"d","lines":["機關因專業人力或能力不足，需委託廠商辦理前條專案管理者，應先擬具委託專案管理計畫，載明下列事項，循預算程序編列核定後辦理：","一、計畫之特性及執行困難度。","二、必須委託專案管理之理由。","三、委託服務項目及所需經費概估。","四、廠商資格條件或評選項目。","五、委託專案管理預期達成之效益。"]},{"no":"11","label":"第11條","ch":"第二章評選及議價","cat":"d","lines":["機關委託廠商辦理技術服務，除法令另有規定者外，其招標文件得依個案特性及實際需要載明下列事項：","一、服務之項目、工作內容及需求計畫。","二、廠商所應具備之專任技術人員及此等人員所應持有之證照或資格，或其他與提供服務有關之資格條件。","三、服務工作完成後所應達到之目標或成果。","四、服務之提供涉及材料、設備或場所之供應者，其規格。","五、廠商應提出之服務建議書及其應含之內容。","六、廠商或其主要工作人員所應具備與招標案性質相同或相當之服務經驗。","七、收受服務建議書之地點及截止期限。","八、評選項目、評審標準及評定方式。","九、智慧財產權之歸屬。","十、與優勝者議價之方式及決標原則。","十一、計費及付款方式。","十二、投標須知及契約條款。","十三、廠商於評選時須提出簡報者，其進行方式。","十四、對於未獲選者之獎勵方式及其作品之處理方式。","十五、委託服務費用之預算、預估金額或固定服務費用或費率。","十六、其他必要事項。","廠商承辦技術服務屬第九條之專案管理者，其專案管理人員至少應有二分之一為該廠商之專任職員。"]},{"no":"12","label":"第12條","ch":"第二章評選及議價","cat":"d","lines":["前條第一項第一款需求計畫，其內容得包括計畫緣起、需求說明、基地現況、地質資料、工程經費上限、預計提供技術服務之期程等。"]},{"no":"13","label":"第13條","ch":"第二章評選及議價","cat":"d","lines":["第十一條第一項第五款服務建議書及其應含之內容，得包括下列事項：","一、計畫概述及作業流程。","二、基地環境現況及相關法令分析。","三、整體工作進度及主要工作項目之時程。","四、服務費用（採固定服務費用者，提供服務費用分析）。","五、規劃設計理念及構想說明（例如節省能源、減少溫室氣體排放、保護環境、節約資源、經濟耐用、景觀、自然生態、生活美學、住民參與及性別、身心障礙、高齡、兒童等使用者友善環境等）。","六、設計圖，包括比例尺、大小、尺寸、圖說張數及裱裝等表現方式。","七、設計採用之材料、構造說明。","八、相關法令應提計畫書圖項目等。","九、工程經費概算及主要工程項目之經費分析。","十、營建計畫分析。","十一、品管計畫（含技術服務及重要工程施工項目）。","十二、服務計畫內容、圖說、服務建議書之章節次序等。","十三、工作組織及主要工作人員學經歷、專長。","十四、廠商信譽及實績。","前項第五款至第十款，於委託監造或專案管理技術服務時得免載明。"]},{"no":"14","label":"第14條","ch":"第二章評選及議價","cat":"d","lines":["第十一條第一項第十二款契約條款，應符合公平合理原則，並得包括下列事項：","一、契約文字以中文（正體字）為之，並得附外文譯本；中文與譯文有出入時，以中文為準。","二、契約條款之解釋及適用，以我國法律為準據法；其有特殊情形者，從其約定。","三、解決糾紛之爭議處理程序，並視需要訂明仲裁機構、管轄法院。","四、稅負事前約定，並依我國法律所定納稅義務人為納稅人。","五、廠商所應負之責任及良好服務之保證。","六、廠商應投保「專業責任保險」，所需保險費包含於服務費用項目之內。有關保險範圍、金額、期限、保單自負額之限制，由機關依服務案件特性定之。","七、服務項目、履約期限及計費方式。","八、各期進度規定，計算進度方式、付款方式及數額。","九、服務範圍包括代辦訓練操作或維護人員者，機關受訓人員之旅費及生活費，應由機關自行支給，不包括在服務費用項目之內。","十、廠商受委託所設計之計畫書及圖樣，其智慧財產權之歸屬。","十一、廠商規劃設計錯誤、監造不實或管理不善，致機關遭受損害之責任。","十二、廠商對於委辦案件應秘密之事項及洩密之罰則。","十三、廠商承辦監造服務時應提出之監造計畫。","十四、廠商應依工作性質及約定專業服務項目向機關提出定期報表（日報、週報或月報），包括工作進度、工作人數及時數、異常狀況之分析及因應對策等，以供查核。","十五、逾期與其他違約事項之規定及逾期違約金上限。","十六、契約終止、解除及結算規定。","前項第十一款之損害，機關得依個案特性及實際需要，於契約中明定其賠償之項目、範圍或上限，並得訂明其排除適用之情形。"]},{"no":"15","label":"第15條","ch":"第二章評選及議價","cat":"d","lines":["機關委託廠商辦理技術服務，應於招標文件規定得標廠商技術服務成果之智慧財產權歸屬及侵害第三人合法權益時由廠商負責處理並承擔一切法律責任。","前項權利，機關得視需要取得授權，或取得部分或全部權利。"]},{"no":"16","label":"第16條","ch":"第二章評選及議價","cat":"d","lines":["機關委託廠商辦理技術服務，涉及廠商於投標時須提出設計圖或服務建議書者，應於招標文件載明機關對其他得獎圖說之使用條件及其範圍或權限，並得於招標文件規定經評選達一定分數或名次之未獲選廠商，發給一定金額之獎勵金。","前項經評選達一定分數或名次之未獲選廠商所提出之設計圖或服務建議書，機關得依需要給與合理報酬後，取得授權，或取得全部或部分權利。"]},{"no":"17","label":"第17條","ch":"第二章評選及議價","cat":"d","lines":["機關委託廠商辦理可行性研究、規劃、設計或監造，其評選項目，除法令另有規定者外，得載明下列事項：","一、廠商於技術服務項目之經驗及信譽。得包括優良、不良紀錄或事蹟。","二、服務建議書之完整性、可行性及對服務事項之瞭解程度。","三、工作計畫、預定進度及如期如質履約能力。得包括主要工作人數及尚在履約之契約件數、金額及是否逾期等情形。","四、計畫主持人及主要工作人員之經驗、專長、最近三年之服務紀錄及主要工作人員具備本法專業知識之情形。得包括該等人員之優良、不良紀錄或事蹟。","五、廠商之資源及其他支援能力。","六、控制合理興建費用之方式。","七、標的完成後使用及維護、營運管理之說明。","八、服務費用、工程造價分析。","九、住民參與、景觀設計、自然生態、節省能源、減少溫室氣體排放、保護環境、節約資源、經濟耐用、生活美學及性別、身心障礙、高齡、兒童等使用者友善環境等之說明。","十、環境影響及工程風險之評估。","十一、優良技術、工法及產品之採用。","十二、廠商最近五年曾獲與評選案性質相同或類似之獎勵情形及過去履約績效。","十三、其他與招標標的有關之事項。","前項評選含競圖者，其評選項目得包括下列事項：","一、設計作品之設計理念。","二、設計作品之創意性及符合在地文化、生活美學程度。","三、設計作品反映對機關需求之瞭解程度。","第一項第一款及第四款所稱廠商或其計畫主持人或主要工作人員之優良、不良紀錄或事蹟，除廠商提出者外，機關得自行蒐集或至本法主管機關網站查詢。"]},{"no":"18","label":"第18條","ch":"第二章評選及議價","cat":"d","lines":["機關委託廠商辦理專案管理，其評選項目，除法令另有規定者外，得視個案特性及實際需要載明下列事項：","一、廠商於專案管理技術服務項目之經驗與信譽。得包括優良、不良紀錄或事蹟。","二、服務建議書之完整性、可行性及對服務事項之瞭解程度。","三、工作計畫、預定進度及如期如質履約能力。得包括主要工作人數及尚在履約之契約件數、金額及是否逾期等情形。","四、計畫主持人及主要工作人員之經驗、能力、最近三年服務紀錄及主要工作人員具備本法專業知識之情形。得包括該等人員之優良、不良紀錄或事蹟。","五、廠商之資源及其他支援能力。","六、服務費用。","七、廠商最近五年曾獲與評選案性質相同或類似之獎勵情形及過去履約績效。","八、其他與招標標的有關之事項。","前項第一款及第四款所稱廠商或其計畫主持人或主要工作人員之優良、不良紀錄或事蹟，除廠商提出者外，機關得自行蒐集或至本法主管機關網站查詢。"]},{"no":"19","label":"第19條","ch":"第二章評選及議價","cat":"d","lines":["機關委託廠商辦理新建建築物之技術服務，其服務費用之採購金額在新臺幣五百萬元以上，且服務項目包括規劃、設計者，應要求廠商提出服務建議書及規劃、設計構想圖說（配置圖、平面圖、立面圖、剖面圖、透視圖等），並應辦理競圖。","技術服務涉及競圖者，招標文件除依第十一條規定者外，應另載明下列事項：","一、計畫之目標及原則。","二、工程名稱及地點。","三、基地資料，包括土地權屬地籍圖謄本、都市計畫圖說、地形圖或現況實測圖、地質調查資料、可能存在之淹水、斷層等資料及其他相關資料。","四、規劃、設計內容，包括室內外空間用途、數量、使用人數或面積、使用方式、設備需求、特殊需求及其他需求。","五、允許增減面積比率。","六、工程經費概算。","七、工程期限。","八、圖說內容、比例尺、大小尺寸、張數及裱裝方式等。","九、表現方式，包括模型、透視圖及顏色需求等。","十、其他必要事項。","技術服務金額未達新臺幣五百萬元之規劃、設計採購，其採競圖方式辦理者，準用前項規定。但得不要求製作模型及彩繪透視圖。"]},{"no":"20","label":"第20條","ch":"第二章評選及議價","cat":"d","lines":["機關辦理前條競圖，得採一階段或兩階段評選；其採兩階段評選者，辦理原則如下：","一、第一階段評選以規劃及構想內容為限，第二階段評選包括實質設計內容。","二、第一階段評選免廠商簡報程序。","三、通過第一階段評選者，方得參與第二階段評選。","四、第二階段評選除圖面及文字說明外，並得要求提供建築模型或彩繪透視圖。"]},{"no":"21","label":"第21條","ch":"第二章評選及議價","cat":"d","lines":["機關委託廠商辦理技術服務之評選，應先審查資格文件。資格不合於招標文件之規定者，其他部分不予審查。","機關評選結果應通知廠商，對未獲選者並應敘明其原因。"]},{"no":"22","label":"第22條","ch":"第二章評選及議價","cat":"d","lines":["採購評選委員會評選優勝廠商，得不以一家為限。","前項評選作業，準用本法有關最有利標之評選規定。"]},{"no":"23","label":"第23條","ch":"第二章評選及議價","cat":"d","lines":["機關與評選優勝廠商之議價，應依下列方式辦理，並載明於招標文件：","一、優勝廠商為一家者，以議價方式辦理。","二、優勝廠商有二家以上者，依優勝順序，自最優勝者起，依序以議價方式辦理。但有二家以上廠商為同一優勝順序者，擇配分最高之評選項目之得分合計值較高者，優先議價；如配分最高之評選項目有兩項以上者，以該等項目得分合計值較高者，優先議價；得分仍相同者，就該等廠商再進行綜合評選一次，以總評分最高、價格與總評分之商數最低或序位合計值最低者，優先議價；其再次相同者，抽籤決定之。","前項議價，不得降低或刪減招標文件之要求及廠商投標文件所承諾之事項。"]},{"no":"24","label":"第24條","ch":"第二章評選及議價","cat":"d","lines":["機關依前條辦理議價之決標，應依下列規定之一辦理：","一、招標文件已訂明固定服務費用或費率者，依該服務費用或費率決標。","二、招標文件未訂明固定服務費用或費率者，其超底價決標或廢標適用本法第五十三條第二項及第五十四條之規定。","機關訂定前項第二款之底價，適用本法第四十六條規定。議價廠商之報價合理且在預算金額以內者，機關得依其報價訂定底價，照價決標。","招標文件得訂明部分服務項目採固定服務費用或費率。"]},{"no":"25","label":"第25條","ch":"第三章計費方法","cat":"d","lines":["機關委託廠商辦理技術服務，其服務費用之計算，應視技術服務類別、性質、規模、工作範圍、工作區域、工作環境或工作期限等情形，就下列方式擇定一種或二種以上符合需要者訂明於契約：","一、服務成本加公費法。","二、建造費用百分比法。","三、按月、按日或按時計酬法。","四、總包價法或單價計算法。","依前項計算之服務費用，應參酌一般收費情形核實議定。其必須核實另支費用者，應於契約內訂明項目及費用範圍。"]},{"no":"25-1","label":"第25-1條","ch":"第三章計費方法","cat":"d","lines":["機關委託廠商辦理技術服務，其服務費用得就履約期間各種技術服務工作事項所需人力之類別、人數、工作時間、薪資，及人力以外之其他相關費用，合理估算後編列預算，並作為擇定前條服務費用計算方式之參考。"]},{"no":"26","label":"第26條","ch":"第三章計費方法","cat":"d","lines":["機關委託廠商辦理技術服務，服務費用採服務成本加公費法者，其服務費用，得包括下列各款費用：","一、直接費用：","（一）直接薪資：包括直接從事委辦案件工作之建築師、技師、工程師、規劃、經濟、財務、法律、管理或營運等各種專家及其他工作人員之實際薪資，另加實際薪資之一定比率作為工作人員不扣薪假與特別休假之薪資費用；非經常性給與之獎金；及依法應由雇主負擔之勞工保險費、積欠工資墊償基金提繳費、全民健康保險費、勞工退休金。","（二）管理費用：包括未在直接薪資項下開支之管理及會計人員之薪資、保險費及退休金、辦公室費用、水電及冷暖氣費用、機器設備及傢俱等之折舊或租金、辦公事務費、機器設備之搬運費、郵電費、業務承攬費、廣告費、準備及結束工作所需費用、參加國內外職業及技術會議費用、業務及人力發展費用、研究費用或專業聯繫費用及有關之稅捐等。但全部管理費用不得超過直接薪資扣除非經常性給與之獎金後之百分之一百。","（三）其他直接費用：包括執行委辦案件工作時所需直接薪資以外之各項直接費用。如差旅費、工地津貼、加班費、專業責任保險費、專案或工地辦公室及工地試驗室設置費、工地車輛費用、資料收集費、專利費、操作及維護人員之代訓費、電腦軟體製作費或使用費、測量、探查及試驗費或圖表報告之複製印刷費、外聘專家顧問報酬及有關之各項稅捐、會計師簽證費用等。","二、公費：指廠商提供技術服務所得之報酬，包括風險、利潤及有關之稅捐等。","三、營業稅。","前項第一款第一目工作人員不扣薪假與特別休假之薪資費用，得由機關依實際需要於招標文件明定為實際薪資之一定比率及給付條件，免檢據核銷。但不得超過實際薪資之百分之十六。","第一項第一款第一目非經常性給與之獎金，得由機關依實際需要於招標文件明定為實際薪資之一定比率及給付條件，檢據核銷。但不得超過實際薪資之百分之三十。","第一項第一款第一目依法應由雇主負擔之勞工保險費、積欠工資墊償基金提繳費、全民健康保險費、勞工退休金，由機關核實給付。","第一項第二款公費，應為定額，不得按直接薪資及管理費之金額依一定比率增加，且全部公費不得超過直接薪資扣除非經常性給與之獎金後與管理費用合計金額之百分之二十五。"]},{"no":"27","label":"第27條","ch":"第三章計費方法","cat":"d","lines":["機關委託廠商辦理技術服務，服務費用採服務成本加公費法者，得於招標文件規定得標廠商服務費用降低或實際績效提高時，得依其情形給付廠商獎勵性報酬。","前項獎勵性報酬之給付方式如下，由機關於招標文件中訂明：","一、屬服務費用降低者，為所減省之契約價金金額之一定比率。","二、屬實際績效提高者，依契約所載計算方式給付。","前項第一款一定比率，以不逾百分之五十為限；第二款給付金額，以不逾契約價金總額或契約價金上限之百分之十為限。"]},{"no":"28","label":"第28條","ch":"第三章計費方法","cat":"d","lines":["機關委託廠商辦理技術服務，服務費用採服務成本加公費法者，應於契約訂明下列事項：","一、廠商應記錄各項費用並備具憑證，機關視需要得自行或委託專業第三人至廠商處所辦理查核。","二、成本上限及逾上限時之處理。","前項第一款憑證，應包括各項費用之發票、收據、紀錄或報表；除契約另有規定外，憑證得為影本。","機關委託廠商辦理技術服務，服務費用採建造費用百分比法計費者，其服務費率應按工程內容、服務項目及難易度，參考附表一至附表四，訂定建造費用之費率級距及各級費率，簽報機關首長或其授權人員核定，並於招標文件中載明。服務項目屬附表所載不包括者，其費用不含於建造費用百分比法計費範圍，應單獨列項供廠商報價，或參考第二十五條之一規定估算結果，於招標文件中載明固定費用。","前項建造費用，指經機關核定之工程採購底價金額或評審委員會建議金額，不包括規費、規劃費、設計費、監造費、專案管理費、物價指數調整工程款、營業稅、土地及權利費用、法律費用、主辦機關所需工程管理費、承包商辦理工程之各項利息、保險費及招標文件所載其他除外費用。","工程採購無底價且無評審委員會建議金額者，第一項建造費用以工程預算代之。但應扣除前項不包括之費用及稅捐等。","第一項工程於履約期間有契約變更、終止或解除契約之情形者，服務費用得視實際情形協議增減之。其費用之計算由雙方協議依第二十五條規定之方式辦理。"]},{"no":"30","label":"第30條","ch":"第三章計費方法","cat":"d","lines":["機關委託廠商辦理技術服務，服務費用採按月、按日或按時計酬法者，其薪資之計算得為下列方式之一；薪資以外之其他費用，可另行計算給付。","一、採按月計酬法者，每月薪資可按契約所載工作人員月薪計算。","二、採按日計酬法者，每日薪資可按契約所載工作人員日薪計算。","三、採按時計酬法者，每時薪資可按契約所載工作人員時薪計算。"]},{"no":"31","label":"第31條","ch":"第三章計費方法","cat":"d","lines":["服務費用有下列情形之一者，應予另加：","一、於設計核准後須變更者。","二、超出技術服務契約或工程契約規定施工期限所需增加之監造、專案管理及相關費用。","三、修改招標文件重行招標之服務費用。","四、超過契約內容之設計報告製圖、送審、審圖等相關費用。","前項各款另加之費用，得按服務成本加公費法計算或與廠商另行議定。","第一項各款另加之費用，以不可歸責於廠商之事由，且經機關審查同意者為限。"]},{"no":"32","label":"第32條","ch":"第三章計費方法","cat":"d","lines":["機關委託辦理之技術服務，係在部分完成之狀態下由廠商接辦時，其所餘未完成部分之服務費用，除依第二十五條所定方式之一計算外，並應加計檢討已完成部分所需費用。但以經機關審查同意者為限。"]},{"no":"33","label":"第33條","ch":"第三章計費方法","cat":"d","lines":["服務須縮短時間完成者，得按縮短時間之程度酌增費用，其所增費用得專案議定。","重覆性工程服務採用相同之設計圖說者，其設計費用應酌予折減給付。"]},{"no":"34","label":"第34條","ch":"第三章計費方法","cat":"d","lines":["廠商因不可歸責於其本身之事由，應機關要求對同一服務事項依不同條件辦理多次規劃或設計者，其重複規劃或設計之部分，機關應核實另給服務費用。但以經機關審查同意者為限。"]},{"no":"35","label":"第35條","ch":"第三章計費方法","cat":"d","lines":["機關因故必須變更部分委託服務內容時，得就服務事項或數量之增減情形，調整服務費用及工作期限。但已工作部分之服務費用且機關審查同意者，應核實給付。"]},{"no":"36","label":"第36條","ch":"第三章計費方法","cat":"d","lines":["廠商之服務費用，得於契約規定於訂約後預付一部分，其餘按月或分期支付。但各次付款金額及條件應予訂明。","前項預付一部分者，以不逾契約價金總額或契約價金上限之百分之三十為原則。","第一項服務費用按月或分期支付，且保留部分價金於完成全部服務項目後支付者，其保留額度以不逾契約價金之百分之二十為原則。"]},{"no":"37","label":"第37條","ch":"第三章計費方法","cat":"d","lines":["機關委託廠商辦理技術服務，其履約期間在一年以上者，得於契約內訂明自第二年起得隨臺灣地區專業、科學及技術服務業受雇員工平均經常性薪資指數逐月計算調整契約價金，並敘明其所適用之調整項目、調整方式及調整金額上限。"]},{"no":"38","label":"第38條","ch":"第四章附則","cat":"d","lines":["廠商承辦技術服務，其實際提供服務人員應於完成之圖樣及書表上簽署。其依法令須由執（開）業之專門職業及技術人員辦理者，應交由各該人員辦理，並依法辦理簽證。","前項所稱圖樣及書表，包括其工作提出之預算書、設計圖、規範、施工說明書及其他依法令及契約應提出之文件。"]},{"no":"39","label":"第39條","ch":"第四章附則","cat":"d","lines":["機關委託廠商辦理技術服務，非依本法第二十二條第一項第九款辦理者，得準用本辦法之規定。"]},{"no":"40","label":"第40條","ch":"第四章附則","cat":"d","lines":["本辦法自發布後三個月施行。","本辦法修正條文自發布日施行。"]}]},{"id":"A0030080","title":"最有利標評選辦法","short":"最有利標辦法","date":"民國114年01月21日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030080","articles":[{"no":"1","label":"第1條","ch":"","cat":"d","lines":["本辦法依政府採購法（以下簡稱本法）第五十六條第四項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"d","lines":["（刪除）"]},{"no":"3","label":"第3條","ch":"","cat":"d","lines":["本辦法所稱總滿分，指招標文件所列各評選項目滿分之合計總分數。","本辦法所稱總評分，指採購評選委員會（以下簡稱評選委員會）依招標文件所列評選項目之配分，評審廠商投標文件，核給各評選項目之得分，再將各項得分合計後之分數。","本辦法所稱序位，指評選委員會依招標文件所列評比項目之重要性或權重，評審廠商投標文件後所核給之序位。"]},{"no":"4","label":"第4條","ch":"","cat":"d","lines":["機關採最有利標決標者，除法令另有規定者外，應於招標文件載明下列事項：","一、以合於招標文件規定之最有利標為得標廠商。","二、評選項目及評審標準。其有子項者，亦應載明。","三、評定最有利標之方式。","四、投標文件經審查合於招標文件規定者，始得為協商及評選之對象。","五、得採行協商措施者，協商時得更改之項目。","六、有應予淘汰或不予評比之情形者，其情形。","七、投標文件有依評選項目分別標示及編頁之必要者，其情形。","八、其他必要事項。"]},{"no":"5","label":"第5條","ch":"","cat":"d","lines":["最有利標之評選項目及子項，得就下列事項擇定之：","一、技術。如技術規格性能、專業或技術人力、專業能力、如期履約能力、技術可行性、設備資源、訓練能力、維修能力、施工方法、經濟性、標準化、輕薄短小程度、使用環境需求、環境保護程度、景觀維護、文化保存、自然生態保育、減少溫室氣體排放、考量弱勢使用者之需要、計畫之完整性或對本採購之瞭解程度等。","二、品質。如品質管制能力、檢驗測試方法、偵錯率、操作容易度、維修容易度、精密度、安全性、穩定性、可靠度、美觀、使用舒適度、故障率、耐用性、耐久性或使用壽命等。","三、功能。如產能、便利性、多樣性、擴充性、相容性、前瞻性或特殊效能等。","四、管理。如組織架構、人員素質及組成、工作介面處理、期程管理、履約所需採購作業管理、工地管理、安全衛生管理、安全維護、會計制度、財務狀況、財務管理、計畫管理能力或分包計畫等。","五、商業條款。如履約期限、付款條件、廠商承諾給付機關情形、維修服務時間、售後服務、保固期或文件備置等。","六、過去履約績效。如履約紀錄、經驗、實績、法令之遵守、使用者評價、如期履約效率、履約成本控制紀錄、勞雇關係、人為災害事故、投標廠商負責人或以其為負責人之其他廠商遭機關依本法第一百零二條第三項規定刊登政府採購公報等情形。","七、價格。如總標價及其組成之正確性、完整性、合理性、超預算或超底價情形、折讓、履約成本控制方式、後續使用或營運成本、維修成本、殘值、報廢處理費用或成本效益等。","八、財務計畫。如本法第九十九條開放廠商投資興建、營運案件之營運收支預估、資金籌措計畫、分年現金流量或投資效益分析等。","九、其他與採購之功能或效益相關之事項。"]},{"no":"6","label":"第6條","ch":"","cat":"d","lines":["機關應依下列規定，擇定前條之評選項目及子項：","一、與採購目的有關。","二、與決定最有利標之目的有關。","三、與分辨廠商差異有關。","四、明確、合理及可行。","五、不重複擇定子項。","機關訂定評選項目、子項及其評審標準，不得以有利或不利於特定廠商為目的。"]},{"no":"7","label":"第7條","ch":"","cat":"d","lines":["機關訂定評選項目及子項之配分或權重，應能適當反應該項目或子項之重要性。"]},{"no":"8","label":"第8條","ch":"","cat":"d","lines":["機關辦理評選，對於評選項目及子項之計分，應符合下列規定；其訂有計分基準者，應載明於招標文件：","一、依差異情形區分級距計分者，每一計分級距所代表之差異應明確。","二、依廠商優劣情形計分者，優劣差異與計分高低應有合理之比例。","三、計分應具客觀性，不得與採購目的無關，並不得以部分或全部投標廠商之投標文件內容為計分基準。","機關訂定評選項目及子項之序位評比方式，準用前項規定。"]},{"no":"9","label":"第9條","ch":"","cat":"d","lines":["招標文件未訂明固定費用或費率，而由廠商於投標文件載明標價者，應規定廠商於投標文件內詳列報價內容，並納入評選。","招標文件已訂明固定費用或費率者，仍得規定廠商於投標文件內詳列組成該費用或費率之內容，並納入評選。"]},{"no":"10","label":"第10條","ch":"","cat":"d","lines":["評選最有利標，為利評選委員對廠商於各評選項目之表現為更深入之瞭解，得輔以廠商簡報及現場詢答。","前項廠商簡報及現場詢答，應與評選項目有關；其列為評選項目者，所占配分或權重不得逾百分之二十。","第一項簡報不得更改廠商投標文件內容。廠商另外提出變更或補充資料者，該資料應不納入評選。","投標廠商未出席簡報及現場詢答者，不影響其投標文件之有效性。"]},{"no":"11","label":"第11條","ch":"","cat":"d","lines":["機關評定最有利標，應依下列方式之一辦理，並載明於招標文件：","一、總評分法。","二、評分單價法。","三、序位法。","四、其他經主管機關認定之方式。","前項評定方式，其分階段辦理評選及淘汰不合格廠商者，不得就分數或權重較低之階段先行評選；並以二階段為原則。"]},{"no":"12","label":"第12條","ch":"","cat":"d","lines":["採總評分法評定最有利標者，應依下列方式之一辦理，並載明於招標文件：","一、價格納入評分，以總評分最高，且經機關首長或評選委員會過半數之決定者為最有利標。","二、價格不納入評分，綜合考量廠商之總評分及價格，以整體表現經機關首長或評選委員會過半數決定最優者為最有利標。","三、依招標文件載明之固定價格給付，以總評分最高，且經機關首長或評選委員會過半數之決定者為最有利標。"]},{"no":"13","label":"第13條","ch":"","cat":"d","lines":["採評分單價法評定最有利標者，價格不納入評分，以價格與總評分之商數最低者為最有利標。"]},{"no":"14","label":"第14條","ch":"","cat":"d","lines":["依第十二條第一款、第三款或前條方式評定最有利標，總評分最高或價格與總評分之商數最低之廠商，有二家以上相同，且均得為決標對象時，得以下列方式之一決定最有利標廠商。但其綜合評選次數已達本法第五十六條規定之三次限制者，逕行抽籤決定之。","一、對總評分或商數相同廠商再行綜合評選一次，以總評分最高或價格與總評分之商數最低者決標。綜合評選後之總評分或商數仍相同者，抽籤決定之。","二、擇配分最高之評選項目之得分較高者決標。得分仍相同者，抽籤決定之。"]},{"no":"15","label":"第15條","ch":"","cat":"d","lines":["採序位法評定最有利標者，應依下列方式之一辦理，並載明於招標文件：","一、價格納入評比，以序位第一，且經機關首長或評選委員會過半數之決定者為最有利標。","二、價格不納入評比，綜合考量廠商之評比及價格，以整體表現經機關首長或評選委員會過半數決定序位第一者為最有利標。","三、依招標文件載明之固定價格給付，以序位第一，且經機關首長或評選委員會過半數之決定者為最有利標。","評選委員辦理序位評比，應就各評選項目分別評分後予以加總，並依加總分數高低轉換為序位。","前項評選委員各評選項目之分項評分加總轉換為序位後，應彙整合計各廠商之序位，以合計值最低者為序位第一。"]},{"no":"15-1","label":"第15-1條","ch":"","cat":"d","lines":["依前條第一項第一款或第三款評定最有利標，序位第一之廠商有二家以上，且均得為決標對象時，得以下列方式之一決定最有利標廠商。但其綜合評選次數已達本法第五十六條規定之三次限制者，逕行抽籤決定之。","一、對序位合計值相同廠商再行綜合評選一次，以序位合計值最低者決標。綜合評選後之序位合計值仍相同者，抽籤決定之。","二、擇配分最高之評選項目之得分合計值較高者決標。得分仍相同者，抽籤決定之。","三、擇獲得評選委員評定序位第一較多者決標；仍相同者，抽籤決定之。"]},{"no":"16","label":"第16條","ch":"","cat":"d","lines":["評定最有利標涉及評分者，招標文件應載明下列事項：","一、各評選項目之配分。其子項有配分者，亦應載明。","二、總滿分及其合格分數，或各評選項目之合格分數。","三、總評分不合格者，不得作為協商對象或最有利標。","個別子項不合格即不得作為協商對象或最有利標者，應於招標文件載明。","價格納入評分者，其所占總滿分之比率，不得低於百分之二十，且不得逾百分之五十。"]},{"no":"17","label":"第17條","ch":"","cat":"d","lines":["評定最有利標涉及序位評比者，招標文件應載明下列事項：","一、各評比項目之權重。其子項有權重者，亦應載明。","二、序位評比結果或各評選項目之評比結果合格或不合格情形。","三、序位評比結果不合格者，不得作為協商對象或最有利標。","個別子項不合格即不得作為協商對象或最有利標者，應於招標文件載明。","價格納入評比者，其所占全部評選項目之權重，不得低於百分之二十，且不得逾百分之五十。"]},{"no":"18","label":"第18條","ch":"","cat":"d","lines":["公開招標及限制性招標，評選項目及子項之配分或權重，應載明於招標文件。分段投標者，應載明於第一階段招標文件。","選擇性招標以資格為評選項目之一者，與資格有關部分之配分或權重，應載明於資格審查文件；其他評選項目及子項之配分或權重，應載明於資格審查後之下一階段招標文件。"]},{"no":"19","label":"第19條","ch":"","cat":"d","lines":["評選委員會評選最有利標，應依招標文件載明之評選項目、子項及其配分或權重辦理，不得變更。"]},{"no":"20","label":"第20條","ch":"","cat":"d","lines":["機關評定最有利標後，應於決標公告公布最有利標之標價及總評分或序位評比結果，並於主管機關之政府採購資訊網站公開下列資訊：","一、評選委員會全部委員姓名及職業。","二、評選委員會評定最有利標會議之出席委員姓名。","評選委員會之會議紀錄及機關於委員評選後彙總製作之總表，除涉及個別廠商之商業機密者外，投標廠商並得申請閱覽、抄寫、複印或攝影。","各出席委員之評分或序位評比表，除法令另有規定外，應保守秘密，不得申請閱覽、抄寫、複印或攝影。","機關評定最有利標後，對於合於招標文件規定但未得標之廠商，應通知其最有利標之標價與總評分或序位評比結果及該未得標廠商之總評分或序位評比結果。"]},{"no":"21","label":"第21條","ch":"","cat":"d","lines":["依本法第五十六條第一項及第五十七條採行協商措施者，應就所有合於招標文件規定之投標廠商分別協商，並予參與協商之廠商依據協商結果，就協商項目於一定期間內修改該部分之投標文件重行遞送之機會。價格須依協商項目調整者，亦同。","前項重行遞送之投標文件，機關應再作綜合評選。但重行遞送之投標文件，有與協商無關或不受影響之項目者，該項目應不予評選，並以重行遞送前之內容為準。","評選委員會辦理第二次綜合評選時，其未參與第一次綜合評選之委員，不得參與。第三次綜合評選亦同。","評選委員會辦理第二次綜合評選，應就廠商因協商而更改之項目重行評分（比），與其他未更改項目之原評分（比）結果，合併計算，以評定最有利標。第三次綜合評選亦同。"]},{"no":"22","label":"第22條","ch":"","cat":"d","lines":["機關採最有利標決標，以不訂底價為原則；其訂有底價，而廠商報價逾底價須減價者，於採行協商措施時洽減之，並適用本法第五十三條第二項之規定。"]},{"no":"23","label":"第23條","ch":"","cat":"d","lines":["機關評選最有利標之過程中，各次會議均應作成紀錄，載明下列事項：","一、評選委員會之組成、協助評選之人員及其工作事項。","二、評選方式。","三、投標廠商名稱。","四、評選過程紀要。","五、各投標廠商評選結果。","六、有評定最有利標者，其理由。","七、個別委員要求納入紀錄之意見。","有協商紀錄者，應附於評選紀錄中。"]},{"no":"24","label":"第24條","ch":"","cat":"d","lines":["本辦法自發布日施行。"]}]},{"id":"A0030083","title":"機關主會計及有關單位會同監辦採購辦法","short":"會同監辦辦法","date":"民國99年11月29日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030083","articles":[{"no":"1","label":"第1條","ch":"","cat":"d","lines":["本辦法依政府採購法（以下簡稱本法）第十三條第四項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"d","lines":["機關主（會）計及有關單位會同監辦公告金額以上採購之開標、比價、議價、決標及驗收，依本辦法之規定。"]},{"no":"3","label":"第3條","ch":"","cat":"d","lines":["本法第十三條第一項所稱有關單位，由機關首長或其授權人員就機關內之政風、監查（察）、督察、檢核或稽核單位擇一指定之。"]},{"no":"4","label":"第4條","ch":"","cat":"d","lines":["監辦人員會同監辦採購，應實地監視或書面審核機關辦理開標、比價、議價、決標及驗收是否符合本法規定之程序。但監辦人員採書面審核監辦，應經機關首長或其授權人員核准。","前項會同監辦，不包括涉及廠商資格、規格、商業條款、底價訂定、決標條件及驗收方法等採購之實質或技術事項之審查。但監辦人員發現該等事項有違反法令情形者，仍得提出意見。"]},{"no":"5","label":"第5條","ch":"","cat":"d","lines":["本法第十三條第一項所稱特殊情形，指合於下列情形之一，且經機關首長或其授權人員核准者，得不派員監辦：","一、未設主（會）計單位及有關單位。","二、依本法第四十條規定洽由其他具有專業能力之機關代辦之採購，已洽請代辦機關之類似單位代辦監辦。","三、以書面或電子化方式進行開標、比價、議價、決標及驗收程序，而以會簽主（會）計及有關單位方式處理。","四、另有重要公務需處理，致無人員可供分派。","五、地區偏遠，無人員可供分派。","六、重複性採購，同一年度內已有監辦前例。","七、因不可預見之突發事故，確無法監辦。","八、依公告、公定或管制價格或費率採購財物或勞務，無減價之可能。","九、即買即用或自供應至使用之期間甚為短暫，實地監辦驗收有困難。","十、辦理分批或部分驗收，其驗收金額未達公告金額。","十一、經政府機關或公正第三人查驗，並有相關規格、品質、數量之證明文書供驗收。","十二、依本法第四十八條第二項前段或招標文件所定家數規定流標。","十三、無廠商投標而流標。"]}
