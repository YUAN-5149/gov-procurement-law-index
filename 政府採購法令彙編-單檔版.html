<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>政府採購法令彙編</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --bg2:#fffdf9; --panel:#ffffff; --ink:#1c1a17; --ink2:#4a463f; --ink3:#7c766c;
  --line:#e3ded3; --line2:#cfc8b8; --accent:#8a1f2b; --accent2:#b8323f; --accent-soft:#fbeeef;
  --gold:#9a7429; --gold-soft:#fdf6e6; --blue:#1f4f7a; --blue-soft:#eaf2f8;
  --mark:#ffe08a; --mark-ink:#4a3500;
  --shadow:0 1px 2px rgba(30,25,15,.06),0 8px 24px rgba(30,25,15,.06);
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sans:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC",Georgia,"PMingLiU",serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --bg:#14161a; --bg2:#1a1d23; --panel:#1e2229; --ink:#e9e6e0; --ink2:#b6b1a8; --ink3:#8a857c;
  --line:#2c313a; --line2:#3d434e; --accent:#e2707c; --accent2:#f2909a; --accent-soft:#2e1f22;
  --gold:#d6ad5c; --gold-soft:#2a2418; --blue:#7fb3dd; --blue-soft:#17242f;
  --mark:#6b5416; --mark-ink:#ffe9a8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
  }
}
[data-theme="dark"]{
  --bg:#14161a; --bg2:#1a1d23; --panel:#1e2229; --ink:#e9e6e0; --ink2:#b6b1a8; --ink3:#8a857c;
  --line:#2c313a; --line2:#3d434e; --accent:#e2707c; --accent2:#f2909a; --accent-soft:#2e1f22;
  --gold:#d6ad5c; --gold-soft:#2a2418; --blue:#7fb3dd; --blue-soft:#17242f;
  --mark:#6b5416; --mark-ink:#ffe9a8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;
  -webkit-font-smoothing:antialiased}
a{color:inherit}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
mark{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px;font-weight:500}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.side{background:var(--bg2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;z-index:30}
.main{min-width:0;display:flex;flex-direction:column}

.brand{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:17px;font-weight:900;letter-spacing:.02em;line-height:1.3}
.brand .sub{font-size:11.5px;color:var(--ink3);margin-top:3px;letter-spacing:.06em}
.brand .seal{display:inline-block;width:9px;height:9px;background:var(--accent);border-radius:2px;margin-right:7px;vertical-align:1px}

.navwrap{flex:1;overflow-y:auto;padding:10px 10px 30px}
.navsec{margin-bottom:2px}
.navcat{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;
  font-weight:700;font-size:13.5px;color:var(--ink2);transition:.13s}
.navcat:hover{background:var(--accent-soft);color:var(--accent)}
.navcat.on{background:var(--accent);color:#fff}
.navcat .ci{width:22px;height:22px;flex:0 0 22px;border-radius:6px;display:grid;place-items:center;
  font-size:11px;font-weight:900;background:var(--line);color:var(--ink2)}
.navcat.on .ci{background:rgba(255,255,255,.22);color:#fff}
.navcat .cn{flex:1;min-width:0}
.navcat .cc{font-size:10.5px;color:var(--ink3);font-family:var(--mono)}
.navcat.on .cc{color:rgba(255,255,255,.75)}
.navlaws{padding:2px 0 6px 12px;margin-left:20px;border-left:1px solid var(--line)}
.navlaw{display:block;width:100%;text-align:left;padding:5px 9px;border-radius:6px;font-size:12.5px;
  color:var(--ink3);line-height:1.45;transition:.12s}
.navlaw:hover{background:var(--accent-soft);color:var(--accent)}
.navlaw.on{background:var(--accent-soft);color:var(--accent);font-weight:700}

.top{position:sticky;top:0;z-index:25;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:11px 22px}
.topin{display:flex;gap:10px;align-items:center;max-width:1180px;margin:0 auto}
.searchbox{flex:1;position:relative;min-width:0}
.searchbox input{width:100%;padding:11px 96px 11px 40px;border:1.5px solid var(--line2);border-radius:var(--radius);
  background:var(--panel);color:var(--ink);font-size:14.5px;font-family:var(--sans);outline:none;transition:.15s}
.searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none;font-size:15px}
.searchbox .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;gap:4px;pointer-events:none}
.kbd b{font:600 10.5px/1 var(--mono);color:var(--ink3);background:var(--bg);border:1px solid var(--line2);
  border-bottom-width:2px;border-radius:4px;padding:4px 5px}
.tbtn{padding:9px 12px;border:1.5px solid var(--line2);border-radius:var(--radius);background:var(--panel);
  font-size:12.5px;font-weight:700;color:var(--ink2);white-space:nowrap;transition:.13s}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}

.scoperow{display:flex;gap:6px;align-items:center;max-width:1180px;margin:9px auto 0;flex-wrap:wrap}
.chip{padding:4px 11px;border-radius:999px;border:1px solid var(--line2);font-size:11.5px;font-weight:700;
  color:var(--ink3);background:var(--panel);transition:.12s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.scoperow .lbl{font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:.08em;margin-right:2px}

.content{max-width:1180px;margin:0 auto;padding:26px 22px 120px;width:100%}
.crumb{font-size:12px;color:var(--ink3);margin-bottom:6px;letter-spacing:.04em}
.crumb b{color:var(--accent);font-weight:700}
.lawhead{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:22px}
.lawhead h2{margin:0;font-size:26px;font-weight:900;letter-spacing:.01em;line-height:1.3}
.lawmeta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink3);align-items:center}
.lawmeta span b{color:var(--ink2);font-weight:700}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;
  background:var(--gold-soft);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent)}
.pill.b{background:var(--blue-soft);color:var(--blue);border-color:color-mix(in srgb,var(--blue) 30%,transparent)}
.pill.r{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}

.chdiv{display:flex;align-items:center;gap:12px;margin:34px 0 16px}
.chdiv:first-child{margin-top:4px}
.chdiv h3{margin:0;font-size:15px;font-weight:900;color:var(--accent);letter-spacing:.06em;white-space:nowrap}
.chdiv .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}

.art{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 18px;
  margin-bottom:11px;scroll-margin-top:140px;transition:.18s;position:relative}
.art:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.art.flash{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.art.marked{border-left:4px solid var(--gold)}
.arthd{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.artno{font-weight:900;font-size:15px;color:var(--accent);letter-spacing:.02em}
.artch{font-size:11px;color:var(--ink3);background:var(--bg);border:1px solid var(--line);
  padding:1px 8px;border-radius:999px}
.artacts{margin-left:auto;display:flex;gap:4px;opacity:.25;transition:.15s}
.art:hover .artacts,.art:focus-within .artacts{opacity:1}
.art.marked .artacts{opacity:1}
.iact{width:27px;height:27px;border-radius:7px;display:grid;place-items:center;color:var(--ink3);
  border:1px solid transparent;font-size:13px;transition:.12s}
.iact:hover{background:var(--bg);border-color:var(--line2);color:var(--accent)}
.iact.act{color:var(--gold)}
.artbody{font-family:var(--serif);font-size:15.5px;line-height:1.95;color:var(--ink)}
.artbody p{margin:0 0 7px;position:relative}
.artbody p:last-child{margin-bottom:0}
.artbody p.num{padding-left:26px}
.artbody p.num::before{content:attr(data-n);position:absolute;left:0;top:.35em;font:700 10.5px/1 var(--mono);
  color:var(--ink3);background:var(--bg);border:1px solid var(--line);border-radius:5px;
  width:19px;height:19px;display:grid;place-items:center}
.xref{color:var(--blue);border-bottom:1px dotted var(--blue);cursor:pointer;font-weight:600}
.xref:hover{background:var(--blue-soft)}
.relbar{margin-top:11px;padding-top:9px;border-top:1px dashed var(--line);display:flex;gap:6px;
  flex-wrap:wrap;align-items:center}
.relbar .rl{font-size:10.5px;font-weight:800;color:var(--ink3);letter-spacing:.08em;margin-right:2px}
.relchip{font-size:11px;padding:2px 9px;border-radius:6px;background:var(--blue-soft);color:var(--blue);
  border:1px solid color-mix(in srgb,var(--blue) 22%,transparent);font-weight:600;transition:.12s}
.relchip:hover{background:var(--blue);color:#fff}

.rescount{font-size:12.5px;color:var(--ink3);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rescount b{color:var(--accent);font-weight:900;font-size:15px}
.resgrp{margin-bottom:20px}
.resgrp h4{margin:0 0 8px;font-size:13px;font-weight:900;color:var(--ink2);display:flex;align-items:center;gap:8px}
.resgrp h4 .n{font:700 10.5px/1 var(--mono);color:var(--ink3);background:var(--bg);
  border:1px solid var(--line);padding:3px 6px;border-radius:5px}
.res{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:11px 14px;margin-bottom:6px;transition:.13s}
.res:hover{border-color:var(--accent);background:var(--accent-soft)}
.res .rno{font-weight:900;color:var(--accent);font-size:13px;margin-right:8px}
.res .rch{font-size:10.5px;color:var(--ink3)}
.res .rtx{font-family:var(--serif);font-size:13.5px;color:var(--ink2);line-height:1.7;margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;padding:70px 20px;color:var(--ink3)}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.4}
.empty h3{margin:0 0 6px;font-size:16px;color:var(--ink2)}
.empty p{margin:0;font-size:13px;line-height:2}
.empty code{background:var(--panel);border:1px solid var(--line);padding:1px 6px;border-radius:4px;
  font-family:var(--mono);font-size:12px;color:var(--accent)}

.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid>.card.wide{grid-column:1/-1}

/* 表格式（ASCII）條文 */
.mono{font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre;overflow-x:auto;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0}

/* 概念比較 */
.cmptbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.cmptbl th{position:sticky;top:0;background:var(--panel);text-align:left;font-size:11.5px;font-weight:900;
  color:var(--accent);padding:9px 11px;border-bottom:2px solid var(--accent);white-space:nowrap;z-index:2}
.cmptbl th:first-child{color:var(--ink3);border-bottom-color:var(--line2)}
.cmptbl td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.7}
.cmptbl td:first-child{font-weight:800;color:var(--ink2);white-space:nowrap;background:var(--bg);
  font-size:12px;border-right:1px solid var(--line)}
.cmptbl tr:last-child td{border-bottom:none}
.cmptbl tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.cmptbl tbody tr:hover td:first-child{background:var(--accent-soft)}
.cmpnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}

/* 選擇題 */
.mcq{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 24px 20px;
  box-shadow:var(--shadow)}
.mcq .qn{font:800 11px/1 var(--mono);color:var(--ink3);letter-spacing:.1em;margin-bottom:10px}
.mcq .qt{font-family:var(--serif);font-size:16.5px;line-height:1.85;font-weight:600;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;padding:11px 14px;
  border:1.5px solid var(--line2);border-radius:9px;background:var(--panel);transition:.13s;line-height:1.7;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt .lt{flex:0 0 22px;height:22px;border-radius:6px;display:grid;place-items:center;
  font:800 11px/1 var(--mono);background:var(--bg);border:1px solid var(--line2);color:var(--ink3);margin-top:2px}
.opt.right{border-color:#2f7d52;background:color-mix(in srgb,#2f7d52 12%,transparent)}
.opt.right .lt{background:#2f7d52;border-color:#2f7d52;color:#fff}
.opt.wrong{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong .lt{background:var(--accent);border-color:var(--accent);color:#fff}
.expl{margin-top:16px;padding:13px 15px;border-radius:9px;background:var(--gold-soft);
  border:1px solid color-mix(in srgb,var(--gold) 28%,transparent);font-size:13.5px;line-height:1.85}
.expl .lb{font-size:10.5px;font-weight:900;letter-spacing:.1em;color:var(--gold);margin-bottom:5px}
.expl b{color:var(--ink)}
.score{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:14px;
  font-size:12.5px;color:var(--ink3);font-family:var(--mono);flex-wrap:wrap}
.score b{font-size:15px}
.score .ok{color:#2f7d52}
.score .ng{color:var(--accent)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:8px;height:8px;border-radius:2px;background:var(--accent);flex:0 0 8px}
.card .hint{font-size:11.5px;color:var(--ink3);margin:0 0 12px;line-height:1.7}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.06em;color:var(--ink3);font-weight:800;
  padding:7px 9px;border-bottom:1.5px solid var(--line2);white-space:nowrap}
table.t td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.65}
table.t tr:last-child td{border-bottom:none}
table.t tbody tr:hover{background:var(--bg)}
table.t td.k{font-weight:700;color:var(--ink);white-space:nowrap}
.ref{font-family:var(--mono);font-size:11px;color:var(--blue);cursor:pointer;white-space:nowrap}
.ref:hover{text-decoration:underline}
.tablewrap{overflow-x:auto}
.mnemo{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 28%,transparent);
  border-radius:9px;padding:11px 14px;margin-top:11px}
.mnemo .lb{font-size:10.5px;font-weight:900;letter-spacing:.1em;color:var(--gold);margin-bottom:4px}
.mnemo p{margin:0;font-size:13px;line-height:1.85;color:var(--ink2)}
.note{font-size:11.5px;color:var(--ink3);line-height:1.8;background:var(--bg);border-left:3px solid var(--line2);
  padding:9px 12px;border-radius:0 7px 7px 0;margin-top:12px}

.fcwrap{max-width:660px;margin:0 auto}
.fc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px 26px;min-height:280px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
.fc .q{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--accent);margin-bottom:14px}
.fc .body{font-family:var(--serif);font-size:16px;line-height:1.95}
.fc .ans{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line2)}
.fc .ans .big{font-size:22px;font-weight:900;color:var(--accent)}
.fc .ans .lw{font-size:12.5px;color:var(--ink3);margin-top:3px}
.fcbar{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.fcstat{text-align:center;font-size:12px;color:var(--ink3);margin-top:12px;font-family:var(--mono)}
.blank{display:inline-block;min-width:56px;border-bottom:2px solid var(--accent);color:transparent;
  user-select:none;text-align:center;font-weight:900}
.blank.show{color:var(--accent);border-bottom-color:transparent}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:13px;align-items:start}
.cmpcol h4{margin:0 0 9px;font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--ink3);
  padding-bottom:6px;border-bottom:1.5px solid var(--line2)}
@media(max-width:860px){.cmp{grid-template-columns:1fr}}

.sectitle{font-size:20px;font-weight:900;margin:0 0 4px}
.secsub{font-size:12.5px;color:var(--ink3);margin:0 0 20px;line-height:1.8}
.hidden{display:none!important}
.sk{position:fixed;bottom:18px;right:18px;z-index:60;display:flex;gap:8px}
.fab{width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);
  box-shadow:var(--shadow);display:grid;place-items:center;font-size:15px;color:var(--ink2);transition:.15s}
.fab:hover{border-color:var(--accent);color:var(--accent)}
.mobtoggle{display:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:29;display:none}
.scrim.on{display:block}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:280px;transform:translateX(-100%);transition:.22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .mobtoggle{display:grid;place-items:center;width:38px;height:38px;flex:0 0 38px;
    border:1.5px solid var(--line2);border-radius:var(--radius);background:var(--panel)}
  .content{padding:18px 14px 110px}
  .lawhead h2{font-size:21px}
  .top{padding:9px 14px}
  .searchbox .kbd{display:none}
  .searchbox input{padding-right:14px}
}
@media print{
  .side,.top,.sk,.artacts,.relbar,.scrim{display:none!important}
  .app{display:block}
  .art{break-inside:avoid;border:none;border-bottom:1px solid #ccc;border-radius:0;box-shadow:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <h1><span class="seal"></span>政府採購法令彙編</h1>
      <div class="sub">GOVERNMENT PROCUREMENT ACT · 學習索引</div>
    </div>
    <nav class="navwrap" id="nav"></nav>
  </aside>

  <div class="main">
    <header class="top">
      <div class="topin">
        <button class="mobtoggle" id="mob" title="目錄">☰</button>
        <div class="searchbox">
          <span class="ic">🔍</span>

<script>
window.LAW = {"meta":{"generated":"2026-09-01","source":"全國法規資料庫（法務部）· 工程會主管法規共用系統","note":"法律與法規命令條文擷取自全國法規資料庫（law.moj.gov.tw）；工程會訂頒之行政規則擷取自「行政院公共工程委員會主管法規共用系統」（lawweb.pcc.gov.tw），均為現行有效版本。速記卡、概念比較、WTO GPA 導讀與選擇題為學習用整理及自製練習題，非法規原文亦非官方考古題；引用金額、期限請以最新法規及主管機關公告為準。已廢止或停止適用之法規未收錄。「採購契約要項」及各類採購契約範本係以函頒方式發布，不在上述兩個法規資料庫中，故未收錄。"},"cats":[{"id":"g","code":"壹","name":"總則","desc":"適用範圍、主管機關、採購金額級距、監辦、迴避與資訊公開。"},{"id":"b","code":"貳","name":"招標","desc":"招標方式、招標文件、資格與規格、公告、等標期、押標金。"},{"id":"d","code":"參","name":"決標","desc":"開標審標、底價、決標原則、最有利標、評選委員會。"},{"id":"p","code":"肆","name":"履約管理","desc":"契約、轉包分包、施工查核、驗收與減價收受。（含第五章驗收）"},{"id":"r","code":"伍","name":"爭議處理","desc":"異議、申訴、審議判斷、履約爭議調解與仲裁。"},{"id":"s","code":"陸","name":"罰則·附則","desc":"刑事責任、停權、共同供應契約、優先採購、扶助中小企業。"},{"id":"z","code":"柒","name":"綜合","desc":"採購人員倫理與專業資格、稽核小組、電子採購、採購工作及審查小組。"},{"id":"w","code":"捌","name":"WTO政府採購協定","desc":"條約協定採購、GPA 架構與門檻、外國廠商參與規範。","intro":"\n<p><b>一、GPA 的性質</b>：世界貿易組織《政府採購協定》(Agreement on Government Procurement, GPA) 屬\n<b>複邊協定</b>，只拘束簽署國，而非全體 WTO 會員。其開放範圍不是全面開放，而是逐一載明於各國的\n<b>市場開放清單</b>（適用機關、適用標的、門檻金額、保留條件）。我國之縣（市）政府及鄉鎮市公所不在開放範圍。</p>\n<p><b>二、我國的銜接方式</b>：我國於民國 88 年 5 月 27 日施行政府採購法，即是為配合 GPA 而制定；\n其招標方式（公開／選擇性／限制性）、等標期、異議申訴制度均對應 GPA 的架構。實際適用時，\n採購法<button class=\"ref\" data-go=\"A0030057#17\">§17</button>、\n<button class=\"ref\" data-go=\"A0030057#43\">§43</button>、\n<button class=\"ref\" data-go=\"A0030057#44\">§44</button>、\n<button class=\"ref\" data-go=\"A0030057#105\">§105</button>、\n<button class=\"ref\" data-go=\"A0030057#106\">§106</button>\n為主要的條約協定條款；未達門檻或不屬條約協定範圍者，則回到\n<b>外國廠商參與非條約協定採購處理辦法</b>處理。</p>\n<p><b>三、GPA 條文架構</b>：協定本身含序文及 24 條條文，另以附錄列出各國開放清單。主要規範事項為：\n適用對象及範圍、門檻金額與案件金額計算、<b>國民待遇與不歧視原則</b>、招標方式、邀標公告與決標資訊公開、\n招標文件與技術規範、廠商資格條件、等標期下限、投開決標程序、協商、\n<b>禁止以補償交易(Offset)作為資格條件或決標要件</b>、原產地認定、廠商申訴程序、國與國爭端解決、\n資訊提供義務、除外情況（國防安全等）、對開發中國家之特別待遇、政府採購委員會。</p>\n<div class=\"note\">本導讀係依行政院公共工程委員會全球資訊網「認識 WTO 政府採購協定」之內容整理，屬<b>學習用摘要</b>，\n非法規原文。GPA 另有 2012 年修正版（GPA 2012），門檻金額以特別提款權(SDR)計價、每兩年換算檢討一次，\n最新數值請以工程會「政府採購條約協定／我國門檻金額」公告為準。</div>\n"}],"memo":[{"wide":true,"t":"三大金額級距（最高頻考點）","h":"採購法本身不寫金額，金額由主管機關依 §12Ⅲ、§13Ⅲ 另行公告；巨額採購則規定於認定標準。","table":{"head":["級距","現行金額","法源","主要法律效果"],"rows":[["小額採購","新臺幣 <b>15 萬元</b>以下<br><span style=\"color:var(--ink3)\">（公告金額十分之一）</span>","<button class=\"ref\" data-go=\"A0030067#5\">未達公告金額招標辦法§5</button>","得不經公告程序，逕洽廠商採購；免適用公告及等標期規定。"],["公告金額","工程、財物、勞務均為<br>新臺幣 <b>150 萬元</b>","<button class=\"ref\" data-go=\"A0030057#13\">採購法§13Ⅲ</button>","① 應公開招標（<button class=\"ref\" data-go=\"A0030057#19\">§19</button>）② 主（會）計及有關單位<b>會同監辦</b>（<button class=\"ref\" data-go=\"A0030057#13\">§13</button>）③ 得提申訴（<button class=\"ref\" data-go=\"A0030057#76\">§76</button>）④ 應刊登政府採購公報。"],["查核金額","工程、財物 <b>5,000 萬元</b><br>勞務 <b>1,000 萬元</b>","<button class=\"ref\" data-go=\"A0030057#12\">採購法§12Ⅲ</button>","開標、比價、議價、決標及驗收應報請<b>上級機關派員監辦</b>；超底價 4% 決標須報上級核准（<button class=\"ref\" data-go=\"A0030057#53\">§53</button>）。"],["巨額採購","工程 <b>2 億元</b><br>財物 <b>1 億元</b><br>勞務 <b>2,000 萬元</b>","<button class=\"ref\" data-go=\"A0030099#8\">認定標準§8</button>","① 等標期 28 日 ② 廠商資格得從嚴（<button class=\"ref\" data-go=\"A0030099#5\">認定標準§5</button>）③ 應逐年提報使用情形及效益分析（<button class=\"ref\" data-go=\"A0030057#111\">§111</button>）。"]]},"mnemo":"<b>小十五 · 公一五○ · 查五千（勞一千）· 巨二億／一億／二千萬</b><br>公告金額必須<b>低於</b>查核金額（§13Ⅲ 明文）；小額採購＝公告金額的 <b>1/10</b>。","note":"公告金額自民國 112 年 1 月 1 日起由 100 萬元調整為 150 萬元；查核金額、小額採購金額未隨之調整。（行政院公共工程委員會「政府採購法之查核金額、公告金額及中央機關小額採購金額」修正案）"},{"t":"招標方式三分法","h":"採購法<button class=\"ref\" data-go=\"A0030057#18\">§18</button>的定義是選擇題最愛考的地方，注意「公告」與「家數」兩個關鍵字。","table":{"head":["方式","定義（§18）","適用情形"],"rows":[["公開招標","以<b>公告</b>方式邀請<b>不特定</b>廠商投標","公告金額以上採購之<b>原則</b>（<button class=\"ref\" data-go=\"A0030057#19\">§19</button>）。"],["選擇性招標","以<b>公告</b>方式<b>預先</b>依一定資格條件辦理廠商資格審查後，再邀請<b>符合資格</b>之廠商投標","<button class=\"ref\" data-go=\"A0030057#20\">§20</button> 五款：①經常性採購 ②審查須費時長久 ③準備投標需高額費用 ④資格條件複雜 ⑤研究發展事項。<br>經常性採購應建立<b>六家以上</b>合格名單（<button class=\"ref\" data-go=\"A0030057#21\">§21</button>）。"],["限制性招標","<b>不經公告</b>程序，邀請<b>二家以上</b>廠商<b>比價</b>，或僅邀請<b>一家</b>廠商<b>議價</b>","<button class=\"ref\" data-go=\"A0030057#22\">§22</button> 十六款情形之一（詳見下一張卡）。"]]},"mnemo":"<b>「公開＝公告＋不特定；選擇性＝公告＋先審資格；限制性＝不公告，二家比價／一家議價」</b><br>未達公告金額之招標方式：中央由主管機關定、地方由直轄市或縣（市）政府定（<button class=\"ref\" data-go=\"A0030057#23\">§23</button>）。"},{"wide":true,"t":"§22 限制性招標 十六款 · 分群記憶","h":"死背十六款很痛苦，依「為什麼不能競爭」分成六群記，考試時再回想款次。","table":{"head":["群組","款次","內容要旨"],"rows":[["① 無法competition","1、2、8","1 招標結果無廠商投標或無合格標（原條件未重大改變）／2 專屬權利、獨家製造供應、藝術品、秘密諮詢／8 集中交易或公開競價市場採購財物"],["② 緊急必要","3","遇不可預見之緊急事故，無法適時辦理公開或選擇性招標"],["③ 延續既有","4、6、7","4 後續維修、零配件、更換或擴充（相容互通需要）／6 原招標目的範圍內追加契約外工程，<b>未逾原主契約金額 50%</b>／7 原招標公告及文件<b>已敘明</b>擴充之期間、金額或數量"],["④ 評選優勝","9、10、11、13、14","9 委託專業／技術／資訊／社會福利服務，公開客觀評選優勝／10 設計競賽／11 指定地區採購房地產／13 專業領先自然人或學術、非營利機構之研究發展／14 文化藝術專業人士、機構、團體"],["⑤ 政策扶助","12","身心障礙者、原住民、受刑人個人及相關機構、監獄工場、慈善機構、庇護工場之非營利產品或勞務"],["⑥ 商業與兜底","15、16","15 公營事業為商業性轉售或製造供轉售之採購／16 其他經主管機關認定"]]},"mnemo":"<b>「無競爭、急、延續、評選、扶助、轉售＋兜底」</b><br>特別注意：第 13 款、第 14 款<b>不適用工程採購</b>（§22Ⅳ）；第 6 款的 <b>50%</b> 與第 7 款的「已敘明」是常考陷阱。"},{"wide":true,"t":"等標期下限一覽（招標期限標準）","h":"等標期＝自刊登政府採購公報日起至截止投標日止。四個級距，級距與金額級距一致。","table":{"head":["採購金額","公開招標<br>等標期（§2）","選擇性招標<br>資格審查（§3）"],"rows":[["未達公告金額","<b>7 日</b>","<b>7 日</b>"],["公告金額以上未達查核金額","<b>14 日</b>","<b>10 日</b><br><span style=\"color:var(--ink3)\">（公告金額以上未達巨額）</span>"],["查核金額以上未達巨額","<b>21 日</b>","同上 10 日"],["巨額採購","<b>28 日</b>","<b>14 日</b>"]]},"mnemo":"公開招標：<b>7 → 14 → 21 → 28</b>（等差 7 日）。<br>選擇性招標資格審查：<b>7 → 10 → 14</b>（只分三級，界線在巨額）。<br>§42Ⅱ 後續階段邀標之等標期由機關合理訂定，<b>但不得少於 7 日</b>。","note":"另有縮短等標期之規定（電子領標、電子投標、公開閱覽等），詳見<button class=\"ref\" data-go=\"A0030093#9\">招標期限標準§9</button>以下各條。"},{"wide":true,"t":"未達公告金額採購之招標方式","h":"中央機關依<button class=\"ref\" data-go=\"A0030057#23\">§23</button>授權訂定<button class=\"ref\" data-go=\"A0030067#1\">未達公告金額採購招標辦法</button>；以「公告金額十分之一」為分水嶺。","table":{"head":["金額","得採之方式","條文"],"rows":[["<b>逾</b>公告金額 1/10<br><span style=\"color:var(--ink3)\">（逾 15 萬、未達 150 萬）</span>","三選一：<br>① 符合 §22Ⅰ①～⑮ 者，採<b>限制性招標</b><br>② 符合 §22Ⅰ⑯ 者，敘明理由簽報機關首長或授權人員核准，採限制性招標，<b>免報經主管機關認定</b><br>③ 依 §49 公開徵求書面報價或企劃書，取得 <b>3 家以上</b>，擇符合需要者比價或議價","<button class=\"ref\" data-go=\"A0030067#2\">招標辦法§2</button>"],["第一次公告未達 3 家","經機關首長或授權人員核准，<b>改採限制性招標</b>；辦理第二次公告者，<b>不受 3 家限制</b>","<button class=\"ref\" data-go=\"A0030067#3\">招標辦法§3</button>"],["<b>公告金額 1/10 以下</b><br><span style=\"color:var(--ink3)\">（15 萬元以下＝小額採購）</span>","<b>得不經公告程序，逕洽廠商採購</b>，免提供報價或企劃書","<button class=\"ref\" data-go=\"A0030067#5\">招標辦法§5</button>"],["禁止規避","不得<b>意圖規避</b>本辦法之適用而分批辦理未達公告金額但逾公告金額 1/10 之採購","<button class=\"ref\" data-go=\"A0030067#6\">招標辦法§6</button>、<button class=\"ref\" data-go=\"A0030057#14\">採購法§14</button>"]]},"mnemo":"<b>「逾十分之一：限制性或三家比價；十分之一以下：逕洽廠商」</b><br>注意 §22Ⅰ⑯ 在未達公告金額時<b>免報主管機關認定</b>，這是與公告金額以上採購最大的差別。"},{"wide":true,"t":"決標原則與比減價格","h":"<button class=\"ref\" data-go=\"A0030057#52\">§52</button> 四種決標原則；<button class=\"ref\" data-go=\"A0030057#53\">§53</button>、<button class=\"ref\" data-go=\"A0030057#54\">§54</button> 的「三次」與「8%／4%」是計算題常客。","table":{"head":["項目","規定"],"rows":[["決標四原則（§52Ⅰ）","① 訂有底價：合於招標文件且<b>在底價以內</b>之最低標<br>② 未訂底價：合於招標文件、<b>標價合理</b>且在預算數額內之最低標<br>③ 最有利標<br>④ 複數決標"],["原則採最有利標（§52Ⅱ）","公告金額以上之<b>專業／技術／資訊／社會福利／文化創意</b>服務，以<b>不訂底價之最有利標</b>為原則。"],["超底價處理（§53）","洽最低標<b>減價一次</b>→仍超過則全體<b>比減價格，不得逾三次</b>→仍超底價而不逾預算且有緊急情事，經核准得決標，<b>不得超過底價 8%</b>；<b>查核金額以上超過 4%</b> 者，應先報上級機關核准。"],["未訂底價（§54）","逾評審委員會建議金額或預算金額時，減價一次→比減價格（機關得限制次數，<b>不得逾三次</b>）→仍逾越應<b>廢標</b>。"],["最有利標（§56）","依招標文件所定評審標準，就技術、品質、功能、商業條款或價格作<b>序位或計數</b>之綜合評選；未列入項目不得作為參考；綜合評選<b>不得逾三次</b>；仍無法評定應廢標。採最有利標決標<b>應先報經上級機關核准</b>。"]]},"mnemo":"<b>「減價一次、比減三次、超底八趴、查核四趴要報上級」</b><br>最有利標三個「先」：<b>先</b>報上級核准、評選項目<b>先</b>列入招標文件、協商<b>先</b>公告。"},{"wide":true,"t":"押標金 · 保證金額度","h":"額度規定在<button class=\"ref\" data-go=\"A0030079#9\">押標金保證金暨其他擔保作業辦法</button>，追繳與時效在<button class=\"ref\" data-go=\"A0030057#31\">採購法§31</button>。","table":{"head":["項目","額度","條文"],"rows":[["押標金","一定金額：不逾<b>預算金額或預估採購總額 5%</b><br>一定比率：不逾<b>標價 5%</b><br>絕對上限 <b>新臺幣 5,000 萬元</b><br>採單價決標者，應為一定金額","<button class=\"ref\" data-go=\"A0030079#9\">辦法§9</button>"],["履約保證金","一定金額：不逾<b>預算金額或預估採購總額 10%</b><br>一定比率：不逾<b>契約金額 10%</b><br>採單價決標者，應為一定金額","<button class=\"ref\" data-go=\"A0030079#15\">辦法§15</button>"],["差額保證金","總標價偏低：總標價與<b>底價 80%</b> 之差額<br>部分標價偏低：該部分標價與<b>該部分底價 70%</b> 之差額<br>未提出者，得不決標予該廠商；繳納期限應訂 <b>5 日以上</b>","<button class=\"ref\" data-go=\"A0030079#30\">辦法§30</button>、<button class=\"ref\" data-go=\"A0030057#58\">採購法§58</button>"],["押標金不發還／追繳","七款事由：①虛偽不實文件投標 ②借用他人名義或容許他人借用 ③冒用他人名義 ④得標後拒不簽約 ⑤得標後未於期限繳足保證金或提供擔保 ⑥對採購有關人員行求、期約或交付不正利益 ⑦其他經主管機關認定影響採購公正之違法行為","<button class=\"ref\" data-go=\"A0030057#31\">採購法§31Ⅱ</button>"],["追繳時效","請求權<b>5 年</b>不行使而消滅；自不予開標、不予決標、廢標或決標日起逾 <b>15 年</b>者，不得行使","<button class=\"ref\" data-go=\"A0030057#31\">採購法§31Ⅳ～Ⅵ</button>"]]},"mnemo":"<b>「押五、履十、上限五千萬；差額八成／七成；追繳五年、除斥十五年」</b>"},{"wide":true,"t":"驗收流程與法定期限","h":"母法<button class=\"ref\" data-go=\"A0030057#71\">§71</button>～<button class=\"ref\" data-go=\"A0030057#73\">§73</button>訂原則，期限全在施行細則<button class=\"ref\" data-go=\"A0030058#92\">§92</button>～<button class=\"ref\" data-go=\"A0030058#95\">§95</button>。","table":{"head":["階段","期限","條文"],"rows":[["廠商通知竣工 → 機關會同核對確定是否竣工","<b>7 日</b>內","<button class=\"ref\" data-go=\"A0030058#92\">細則§92Ⅰ</button>"],["監造單位送竣工圖表、結算明細表等資料","竣工後 <b>7 日</b>內","<button class=\"ref\" data-go=\"A0030058#92\">細則§92Ⅱ</button>"],["機關辦理<b>初驗</b>（有初驗程序者）","收受全部資料之日起 <b>30 日</b>內","<button class=\"ref\" data-go=\"A0030058#92\">細則§92Ⅱ</button>"],["<b>有</b>初驗程序者辦理驗收","初驗合格後 <b>20 日</b>內","<button class=\"ref\" data-go=\"A0030058#93\">細則§93</button>"],["<b>無</b>初驗程序者辦理驗收","接獲備驗通知或可得驗收程序完成後 <b>30 日</b>內","<button class=\"ref\" data-go=\"A0030058#94\">細則§94</button>"],["延期","有特殊情形須延期者，應經機關首長或其授權人員核准","<button class=\"ref\" data-go=\"A0030058#95\">細則§95</button>"]]},"mnemo":"<b>「七、七、三十；有初驗二十，無初驗三十」</b><br>減價收受（<button class=\"ref\" data-go=\"A0030057#72\">§72Ⅱ</button>）：<b>查核金額以上</b>應先報上級機關核准；未達查核金額經機關首長或授權人員核准。<br>承辦採購單位人員<b>不得</b>為所辦採購之主驗人或樣品材料檢驗人（<button class=\"ref\" data-go=\"A0030057#71\">§71Ⅲ</button>）。"},{"t":"監辦制度：誰來監、監什麼","h":"兩條容易混淆，關鍵在<b>金額級距</b>與<b>監辦主體</b>。","table":{"head":["條文","門檻","監辦主體","監辦事項"],"rows":[["<button class=\"ref\" data-go=\"A0030057#12\">§12</button>","<b>查核金額</b>以上","<b>上級機關</b>派員監辦<br><span style=\"color:var(--ink3)\">（上級機關得訂授權條件由機關自辦）</span>","開標、比價、議價、決標、驗收"],["<button class=\"ref\" data-go=\"A0030057#13\">§13</button>","<b>公告金額</b>以上","機關<b>主（會）計及有關單位</b>會同監辦<br><span style=\"color:var(--ink3)\">（有特殊情形者除外）</span>","開標、比價、議價、決標、驗收"]]},"mnemo":"<b>「查核找上級，公告找主計」</b>；兩者監辦事項相同（開比議決驗）。<br>未達查核金額但<b>決標金額</b>或<b>契約變更後金額</b>達查核金額者，應<b>補具文件送上級機關備查</b>（§12Ⅱ）。"},{"wide":true,"t":"爭議處理：兩條路徑","h":"採購法第六章把爭議一分為二——<b>招標審標決標</b>爭議走異議申訴；<b>履約</b>爭議走調解仲裁。","table":{"head":["","招標／審標／決標爭議","履約爭議"],"rows":[["法條","<button class=\"ref\" data-go=\"A0030057#74\">§74</button>～<button class=\"ref\" data-go=\"A0030057#84\">§84</button>","<button class=\"ref\" data-go=\"A0030057#85-1\">§85-1</button>～<button class=\"ref\" data-go=\"A0030057#85-4\">§85-4</button>"],["程序","異議 → 申訴 → 審議判斷","協議不成 → 調解 或 仲裁"],["受理機關","招標機關（異議）→ 採購申訴審議委員會（申訴）","採購申訴審議委員會（調解）／仲裁機構"],["效力","審議判斷<b>視同訴願決定</b>（<button class=\"ref\" data-go=\"A0030057#83\">§83</button>）→ 續行行政訴訟","調解成立與確定判決同一效力；仲裁判斷同確定判決"],["特別規定","公告金額以上始得申訴；<b>追繳押標金爭議不受公告金額限制</b>（<button class=\"ref\" data-go=\"A0030057#76\">§76Ⅳ</button>）","調解屬廠商申請者<b>機關不得拒絕</b>；工程及技術服務採購因機關不同意調解建議／方案致調解不成立者，廠商提付仲裁<b>機關不得拒絕</b>（先調後仲）"]]},"mnemo":"<b>「招審決走異議申訴，履約走調解仲裁」</b><br>工程及技服的「<b>強制仲裁</b>」是 §85-1Ⅱ 的重點：機關對調解建議／方案不同意 → 廠商提仲裁 → 機關不得拒絕。"},{"wide":true,"t":"異議 · 申訴 期限總表","h":"全部都是「<b>次日</b>起算」，日數只有 10、15、20、40 四種，務必分清楚適用對象。","table":{"head":["情形","期限","條文"],"rows":[["對<b>招標文件規定</b>提出異議","自公告或邀標之次日起<b>等標期 1/4</b>（尾數不足一日以一日計），<b>但不得少於 10 日</b>","<button class=\"ref\" data-go=\"A0030057#75\">§75Ⅰ①</button>"],["對招標文件之<b>釋疑、後續說明、變更或補充</b>提出異議","接獲通知或公告之次日起 <b>10 日</b>","<button class=\"ref\" data-go=\"A0030057#75\">§75Ⅰ②</button>"],["對採購<b>過程、結果</b>提出異議","接獲通知或公告之次日起 <b>10 日</b>；未經通知公告者為知悉或可得知悉之次日起 10 日，<b>至遲不得逾決標日之次日起 15 日</b>","<button class=\"ref\" data-go=\"A0030057#75\">§75Ⅰ③</button>"],["<b>機關處理異議</b>","收受異議之次日起 <b>15 日</b>內處理並書面通知","<button class=\"ref\" data-go=\"A0030057#75\">§75Ⅱ</button>"],["<b>提起申訴</b>","收受異議處理結果或期限屆滿之次日起 <b>15 日</b>內","<button class=\"ref\" data-go=\"A0030057#76\">§76Ⅰ</button>"],["收受申訴書機關<b>移送</b>申訴會","收受之次日起 <b>3 日</b>內","<button class=\"ref\" data-go=\"A0030057#76\">§76Ⅲ</button>"],["<b>機關陳述意見</b>","收受申訴書副本之次日起 <b>10 日</b>內","<button class=\"ref\" data-go=\"A0030057#78\">§78Ⅰ</button>"],["<b>申訴會完成審議</b>","收受申訴書之次日起 <b>40 日</b>內，必要時<b>得延長 40 日</b>","<button class=\"ref\" data-go=\"A0030057#78\">§78Ⅱ</button>"],["<b>§101 停權</b>之異議","接獲通知之次日起 <b>20 日</b>內","<button class=\"ref\" data-go=\"A0030057#102\">§102Ⅰ</button>"],["<b>§101 停權</b>之申訴","收受異議處理結果或期限屆滿之次日起 <b>15 日</b>內，<b>不論是否逾公告金額</b>","<button class=\"ref\" data-go=\"A0030057#102\">§102Ⅱ</button>"]]},"mnemo":"<b>「異議十日（招標文件看等標期¼，至少十日）、機關十五、申訴十五、審議四十可再四十」</b><br>唯一的 <b>20 日</b> 出現在停權異議（§102Ⅰ），這是最容易被考的例外。"},{"wide":true,"t":"§101 停權事由（15 款）× §103 停權期間","h":"先記「期間三群」，再回頭對款次，比逐款硬背有效率。","table":{"head":["停權期間","款次","事由要旨"],"rows":[["<b>3 年</b>","1～5、15<br>及 6（判<b>有期徒刑</b>）","1 容許他人借用名義證件投標／2 借用或冒用他人名義證件投標／3 擅自減省工料情節重大／4 以虛偽不實文件投標訂約履約情節重大／5 受停業處分期間仍投標／15 對採購有關人員行求期約交付不正利益／6 犯 §87～§92 之罪經第一審有罪判決（判有期徒刑）"],["<b>1 年</b>","13、14<br>及 6（判<b>拘役、罰金或緩刑</b>）","13 破產程序中之廠商／14 歧視性別、原住民、身心障礙或弱勢團體人士情節重大"],["<b>3 月 → 6 月 → 1 年</b><br><span style=\"color:var(--ink3)\">（累進）</span>","7～12","7 得標後無正當理由不訂約／8 查驗或驗收不合格情節重大／9 驗收後不履行保固責任情節重大／10 可歸責於廠商致延誤履約期限情節重大／11 違反 §65 轉包／12 可歸責於廠商致解除或終止契約情節重大<br><b>累進規則</b>：通知日起前 5 年內未被刊登→3 個月；已被刊登 1 次→6 個月；累計 2 次以上→1 年"]]},"mnemo":"<b>「一到五加十五＝三年；十三、十四＝一年；七到十二＝三、六、十二個月累進」</b><br>程序要件（§101Ⅲ）：通知前應給予廠商<b>陳述意見</b>機會，並應成立<b>採購工作及審查小組</b>認定。<br>效果（§103Ⅰ）：不得<b>參加投標</b>、<b>作為決標對象</b>或<b>分包廠商</b>；機關因特殊需要經上級機關核准者不適用。"},{"wide":true,"t":"罰則速記（§87～§92）","h":"主體與行為態樣決定刑度；注意「廠商人員」與「對機關人員施強暴脅迫」是兩組不同條文。","table":{"head":["條文","行為","刑度"],"rows":[["<button class=\"ref\" data-go=\"A0030057#87\">§87Ⅰ</button>","施強暴、脅迫、藥劑或催眠術，使廠商不為投標、違本意投標，或使得標廠商放棄得標、轉包分包","1 年以上 7 年以下有期徒刑，得併科 300 萬元以下罰金"],["<button class=\"ref\" data-go=\"A0030057#87\">§87Ⅲ</button>","以詐術或其他非法方法，使廠商無法投標或開標發生不正確結果","5 年以下有期徒刑，得併科 100 萬元以下罰金"],["<button class=\"ref\" data-go=\"A0030057#87\">§87Ⅳ</button>","<b>圍標</b>：意圖影響決標價格或獲取不當利益，合意使廠商不投標或不為價格競爭","6 月以上 5 年以下有期徒刑，得併科 100 萬元以下罰金"],["<button class=\"ref\" data-go=\"A0030057#87\">§87Ⅴ</button>","<b>借牌</b>：借用他人名義或證件投標；容許他人借用本人名義或證件","3 年以下有期徒刑，得併科 100 萬元以下罰金"],["<button class=\"ref\" data-go=\"A0030057#88\">§88</button>","受託提供規劃、設計、審查、監造、專案管理或代辦採購廠商之人員，圖私人不法利益，違法限制或審查技術、工法、材料、設備、規格或廠商資格，因而獲利","1 年以上 7 年以下有期徒刑，得併科 300 萬元以下罰金"],["<button class=\"ref\" data-go=\"A0030057#89\">§89</button>","前述受託廠商人員洩漏或交付採購應秘密資訊，因而獲利","5 年以下有期徒刑、拘役或科或併科 100 萬元以下罰金"],["<button class=\"ref\" data-go=\"A0030057#90\">§90</button>","對機關採購人員或受託廠商人員施強暴脅迫，使其不為決定或為違本意之決定","1 年以上 7 年以下有期徒刑，得併科 300 萬元以下罰金"],["<button class=\"ref\" data-go=\"A0030057#91\">§91</button>","對前述人員施強暴脅迫，使其洩漏或交付採購應秘密資訊","5 年以下有期徒刑，得併科 100 萬元以下罰金"],["<button class=\"ref\" data-go=\"A0030057#92\">§92</button>","<b>兩罰規定</b>：廠商之代表人、代理人、受雇人或從業人員因執行業務犯本法之罪","除處罰行為人外，對<b>該廠商亦科以該條之罰金</b>"]]},"mnemo":"<b>「87 對廠商、88／89 內鬼、90／91 對公務員、92 兩罰」</b><br>刑度只有兩檔好記：<b>1～7 年＋300 萬</b>（強暴脅迫、內鬼圖利）與 <b>5 年以下＋100 萬</b>（詐術、洩密）。圍標 6 月～5 年、借牌 3 年以下另記。<br>§87Ⅰ、Ⅲ、Ⅳ 之<b>未遂犯罰之</b>（§87Ⅵ）。"},{"wide":true,"t":"履約管理重點（轉包 · 分包 · 契約變更）","table":{"head":["項目","規定","條文"],"rows":[["<b>轉包</b>","得標廠商應自行履行工程、勞務契約，<b>不得轉包</b>。轉包＝將原契約應自行履行之<b>全部或其主要部分</b>由其他廠商代為履行。財物契約需經一定履約過程、非以現成財物供應者，準用。","<button class=\"ref\" data-go=\"A0030057#65\">§65</button>"],["<b>分包</b>","分包＝<b>非轉包</b>而將契約之<b>部分</b>由其他廠商代為履行，<b>得</b>為之。分包契約報備並設定權利質權者，民法 §513 抵押權及 §816 添附請求權及於價金請求權；分包廠商就分包部分與得標廠商<b>連帶負瑕疵擔保責任</b>。","<button class=\"ref\" data-go=\"A0030057#67\">§67</button>"],["<b>違反轉包之效果</b>","機關得<b>解除契約、終止契約或沒收保證金</b>，並得要求損害賠償；並構成 §101Ⅰ⑪ 之停權事由。","<button class=\"ref\" data-go=\"A0030057#66\">§66</button>、<button class=\"ref\" data-go=\"A0030057#101\">§101Ⅰ⑪</button>"],["<b>政策變更終止</b>","因政策變更，廠商依約續行反而不符公共利益者，機關得報經上級機關核准，終止或解除部分或全部契約，並<b>補償廠商因此所生之損失</b>。","<button class=\"ref\" data-go=\"A0030057#64\">§64</button>"],["<b>契約範本</b>","各類採購契約以採用主管機關訂定之<b>範本</b>為原則；其要項及內容由主管機關參考國際及國內慣例定之。","<button class=\"ref\" data-go=\"A0030057#63\">§63</button>"],["<b>施工查核</b>","中央及直轄市、縣（市）政府應成立<b>工程施工查核小組</b>，定期查核所屬（轄）機關工程品質及進度。","<button class=\"ref\" data-go=\"A0030057#70\">§70Ⅲ</button>、<button class=\"ref\" data-go=\"D0070080#1\">施工查核作業辦法</button>"]]},"mnemo":"<b>「轉包＝全部或主要部分，禁止；分包＝部分，允許」</b>——差別在「主要部分」四個字。"},{"t":"採購人員倫理與利益迴避","table":{"head":["項目","規定","條文"],"rows":[["<b>利益迴避</b>","機關承辦、監辦採購人員<b>離職後 3 年內</b>不得為本人或代理廠商向原任職機關接洽處理離職前 <b>5 年內</b>與職務有關之事務。","<button class=\"ref\" data-go=\"A0030057#15\">§15</button>"],["<b>不正利益</b>","廠商不得以支付佣金、比例金、仲介費、後謝金或其他不正利益為條件促成契約成立；違反者機關得終止或解除契約，並將<b>二倍</b>之不正利益自契約價款中扣除。","<button class=\"ref\" data-go=\"A0030057#59\">§59</button>"],["<b>倫理準則</b>","主管機關應訂定採購人員倫理準則。","<button class=\"ref\" data-go=\"A0030057#112\">§112</button>、<button class=\"ref\" data-go=\"A0030095#1\">倫理準則</button>"],["<b>採購稽核</b>","主管機關、直轄市及縣（市）政府應成立<b>採購稽核小組</b>，稽核監督採購事宜。","<button class=\"ref\" data-go=\"A0030057#108\">§108</button>、<button class=\"ref\" data-go=\"A0030100#1\">稽核小組組織準則</button>"],["<b>採購專業人員</b>","機關辦理採購，應由採購專業人員為之；其資格、考試、訓練、發證及管理辦法由主管機關會同考試院定之。","<button class=\"ref\" data-go=\"A0030057#95\">§95</button>、<button class=\"ref\" data-go=\"A0030059#1\">專業人員辦法</button>"]]},"mnemo":"<b>「離職三年、回溯五年」</b>（§15）與 <b>「不正利益扣二倍」</b>（§59）是兩個最常出現的數字。"},{"wide":true,"t":"WTO 政府採購協定（GPA）要點","h":"此卡為學習摘要（依工程會「認識 WTO 政府採購協定」整理），非法規原文。","table":{"head":["要點","內容"],"rows":[["協定性質","<b>複邊協定</b>，僅拘束簽署國；開放範圍以各國<b>市場開放清單</b>為準（適用機關、標的、門檻金額、保留條件）。我國縣（市）政府及鄉鎮市公所<b>不在</b>開放範圍。"],["適用機關三級","中央機關 · 中央以下次一級地方機關(Sub-central) · 其他機關(Other Entity，多為港口、機場、水電、鐵道等公用事業)。"],["門檻金額","以<b>特別提款權(SDR)</b> 計價，各國換算為本國貨幣並<b>每兩年檢討調整一次</b>。一般簽署國參考值：中央機關產品與服務 13 萬 SDR；地方機關 20 萬 SDR；其他機關 40 萬 SDR；各機關工程案件 500 萬 SDR。<b>我國實際門檻以工程會公告為準。</b>"],["金額計算","以<b>開始招標時預估契約值</b>認定；<b>不得分割規避</b>；有選購條件者以最大可能總值估算；分次分案者以<b>一年</b>推算總值；租賃逾 12 個月另計殘值，未明訂租期者以<b>月租金 48 倍</b>計算。"],["核心原則","<b>國民待遇與不歧視</b>：不得因外資參與程度或產地而差別待遇。"],["招標方式","公開／選擇性／限制性三種，與我國採購法一致；限制性招標以協定第 15 條所列<b>十項</b>條件之一為限（含追加工程未逾原合約 <b>50%</b>）。"],["公開資訊","邀標公告應刊登指定刊物；<b>決標結果應於決標後 72 日內</b>公告。公告語文非英、法、西語者，應加刊其一之摘要。"],["等標期","一般狀況下公開招標<b>至少 40 天</b>，符合一定條件得縮短。"],["補償交易(Offset)","<b>不得</b>作為投標廠商資格條件或決標要件（開發中國家加入時得協商例外，且僅得作為資格條件）。"],["廠商申訴","各簽署國須建立廠商申訴制度，得向法院或獨立審議機關申訴；為配合此制度，<b>採購文件至少保存 3 年</b>。"],["除外情況","武器、彈藥、作戰物資或與國家安全、國防密切相關之採購；公共道德、秩序、安全、生命健康、智慧財產權、身心障礙組織與服刑人製品等必要處置。"]]},"mnemo":"<b>國內法對應</b>：<button class=\"ref\" data-go=\"A0030057#17\">§17</button>（外國廠商參與）、<button class=\"ref\" data-go=\"A0030057#43\">§43</button>／<button class=\"ref\" data-go=\"A0030057#44\">§44</button>（優惠與優先決標，<b>限非條約協定採購</b>）、<button class=\"ref\" data-go=\"A0030057#105\">§105</button>（特殊情形不適用招標決標規定）、<button class=\"ref\" data-go=\"A0030057#106\">§106</button>（駐國外機構採購）；未達門檻或非條約協定者適用<button class=\"ref\" data-go=\"A0030072#1\">外國廠商參與非條約協定採購處理辦法</button>。"}],"compare":[{"id":"bid","t":"三種招標方式","cat":"b","h":"最基本也最常考。判斷關鍵只有兩個：<b>有沒有公告</b>、<b>邀幾家</b>。","head":["比較點","公開招標","選擇性招標","限制性招標"],"rows":[["法條","<button class=\"ref\" data-go=\"A0030057#18\">§18Ⅱ</button>、<button class=\"ref\" data-go=\"A0030057#19\">§19</button>","<button class=\"ref\" data-go=\"A0030057#18\">§18Ⅲ</button>、<button class=\"ref\" data-go=\"A0030057#20\">§20</button>、<button class=\"ref\" data-go=\"A0030057#21\">§21</button>","<button class=\"ref\" data-go=\"A0030057#18\">§18Ⅳ</button>、<button class=\"ref\" data-go=\"A0030057#22\">§22</button>"],["是否公告","<b>公告</b>","<b>公告</b>（公告的是資格審查）","<b>不公告</b>"],["邀請對象","不特定廠商","先資格審查，再邀合格廠商","比價：<b>2 家以上</b><br>議價：<b>1 家</b>"],["適用時機","公告金額以上採購之<b>原則</b>","§20 五款：經常性採購／審查費時長久／準備投標需高額費用／資格條件複雜／研究發展","§22 十六款情形之一"],["特別規定","第一次開標未滿三家而流標者，第二次招標等標期得縮短且不受三家限制（<button class=\"ref\" data-go=\"A0030057#48\">§48Ⅱ</button>）","經常性採購應建立<b>六家以上</b>合格廠商名單；應予合格廠商<b>平等受邀機會</b>（<button class=\"ref\" data-go=\"A0030057#21\">§21</button>）","§22Ⅰ⑬⑭<b>不適用工程採購</b>（<button class=\"ref\" data-go=\"A0030057#22\">§22Ⅳ</button>）"],["等標期下限","7 / 14 / 21 / 28 日（<button class=\"ref\" data-go=\"A0030093#2\">期限標準§2</button>）","資格審查 7 / 10 / 14 日（<button class=\"ref\" data-go=\"A0030093#3\">期限標準§3</button>）","由機關合理訂定"]],"mnemo":"<b>公開＝公告＋不特定；選擇性＝公告＋先審資格；限制性＝不公告，二比一議。</b>"},{"id":"dispute","t":"異議 · 申訴 · 調解 · 仲裁","cat":"r","h":"第六章把爭議一分為二。前兩者處理「<b>招標審標決標</b>」，後兩者處理「<b>履約</b>」，受理機關與效力都不同。","head":["比較點","異議","申訴","調解","仲裁"],"rows":[["爭議類型","招標、審標、決標","同左","<b>履約</b>爭議","<b>履約</b>爭議"],["法條","<button class=\"ref\" data-go=\"A0030057#75\">§75</button>","<button class=\"ref\" data-go=\"A0030057#76\">§76</button>～<button class=\"ref\" data-go=\"A0030057#85\">§85</button>","<button class=\"ref\" data-go=\"A0030057#85-1\">§85-1</button>～<button class=\"ref\" data-go=\"A0030057#85-4\">§85-4</button>","<button class=\"ref\" data-go=\"A0030057#85-1\">§85-1Ⅰ②</button>"],["受理者","<b>招標機關</b>本身","採購申訴審議委員會","採購申訴審議委員會","仲裁機構"],["金額門檻","<b>無</b>門檻","原則<b>公告金額以上</b>；追繳押標金爭議<b>不受限</b>（<button class=\"ref\" data-go=\"A0030057#76\">§76Ⅳ</button>）","無","無"],["期限","招標文件：等標期 1/4（≥10 日）<br>釋疑變更／過程結果：<b>10 日</b><br>機關處理：<b>15 日</b>","<b>15 日</b>內提起<br>機關陳述意見 10 日<br>審議 <b>40 日</b>（得延 40 日）","無法定期限；調解方案異議期 <b>10 日</b>（<button class=\"ref\" data-go=\"A0030057#85-4\">§85-4Ⅱ</button>）","依仲裁法"],["效力","機關自行撤銷或變更（<button class=\"ref\" data-go=\"A0030057#84\">§84</button>）","審議判斷<b>視同訴願決定</b>（<button class=\"ref\" data-go=\"A0030057#83\">§83</button>）→ 可提行政訴訟","成立者與確定判決同一效力；<b>廠商申請調解機關不得拒絕</b>","判斷與確定判決同一效力"],["強制性","—","—","工程及技術服務：機關不同意調解建議／方案致不成立者，<b>廠商提付仲裁機關不得拒絕</b>（<button class=\"ref\" data-go=\"A0030057#85-1\">§85-1Ⅱ</button>）","同左（先調解後仲裁）"]],"mnemo":"<b>「招審決 → 異議、申訴；履約 → 調解、仲裁」</b><br>日數只有 10、15、20、40 四種：異議 10、機關處理 15、申訴 15、審議 40（可再 40）；唯一的 <b>20 日</b> 是 §101 停權異議（<button class=\"ref\" data-go=\"A0030057#102\">§102Ⅰ</button>）與 §85Ⅰ 機關另為處置的 20 日。"},{"id":"sub","t":"轉包 vs 分包","cat":"p","h":"差別只在「<b>全部或主要部分</b>」五個字，但法律效果天差地遠。","head":["比較點","轉包（禁止）","分包（允許）"],"rows":[["法條","<button class=\"ref\" data-go=\"A0030057#65\">§65</button>、<button class=\"ref\" data-go=\"A0030057#66\">§66</button>","<button class=\"ref\" data-go=\"A0030057#67\">§67</button>"],["定義","將原契約中應自行履行之<b>全部或其主要部分</b>，由其他廠商代為履行","<b>非轉包</b>而將契約之<b>部分</b>由其他廠商代為履行"],["是否允許","<b>不得</b>轉包","<b>得</b>分包"],["機關的處置","得<b>解除契約、終止契約或沒收保證金</b>，並得要求損害賠償（<button class=\"ref\" data-go=\"A0030057#66\">§66Ⅰ</button>）","—"],["責任","轉包廠商與得標廠商對機關負<b>連帶履行及賠償責任</b>；再轉包者亦同（<button class=\"ref\" data-go=\"A0030057#66\">§66Ⅱ</button>）","分包廠商就分包部分，與得標廠商<b>連帶負瑕疵擔保責任</b>（<button class=\"ref\" data-go=\"A0030057#67\">§67Ⅲ</button>）"],["停權","構成 <button class=\"ref\" data-go=\"A0030057#101\">§101Ⅰ⑪</button> 停權事由（3 個月～1 年累進）","—"],["其他","財物契約需經一定履約過程、非以現成財物供應者，<b>準用</b>（<button class=\"ref\" data-go=\"A0030057#65\">§65Ⅲ</button>）","分包契約報備並設定權利質權者，民法 §513 抵押權及 §816 添附請求權<b>及於價金請求權</b>（<button class=\"ref\" data-go=\"A0030057#67\">§67Ⅱ</button>）"]],"mnemo":"<b>轉包＝全部或主要部分（禁止、連帶責任、停權）；分包＝部分（允許、瑕疵擔保連帶）。</b>"},{"id":"bond","t":"四種押標金 · 保證金","cat":"b","h":"額度規定在<button class=\"ref\" data-go=\"A0030079#9\">押標金保證金暨其他擔保作業辦法</button>，母法只寫原則。","head":["比較點","押標金","履約保證金","保固保證金","差額保證金"],"rows":[["目的","擔保<b>投標</b>之誠信","擔保<b>履約</b>","擔保<b>保固</b>責任","擔保<b>標價偏低</b>仍能履約"],["法條","<button class=\"ref\" data-go=\"A0030057#30\">§30</button>、<button class=\"ref\" data-go=\"A0030057#31\">§31</button>","<button class=\"ref\" data-go=\"A0030057#30\">§30</button>、<button class=\"ref\" data-go=\"A0030057#32\">§32</button>","<button class=\"ref\" data-go=\"A0030057#30\">§30</button>","<button class=\"ref\" data-go=\"A0030057#58\">§58</button>、<button class=\"ref\" data-go=\"A0030079#30\">辦法§30</button>"],["額度","一定金額 ≤ 預算或預估總額 <b>5%</b><br>一定比率 ≤ 標價 <b>5%</b><br>上限 <b>5,000 萬元</b>","一定金額 ≤ 預算或預估總額 <b>10%</b><br>一定比率 ≤ 契約金額 <b>10%</b>","依招標文件訂定（辦法第四章）","總標價偏低：總標價與<b>底價 80%</b> 之差額<br>部分標價偏低：該部分標價與<b>該部分底價 70%</b> 之差額"],[" >","應載明於招標文件","中央機關集中採購另依<button class=\"ref\" data-go=\"FL025855#1\">集中採購實施要點</button>"]],"mnemo":"<b>統包合「工作」、共同投標合「廠商」、複數決標合「標的」、共同供應契約合「機關」。</b>"},{"id":"super","t":"§12 上級機關監辦 vs §13 會同監辦","cat":"g","h":"兩條的監辦<b>事項完全相同</b>（開標、比價、議價、決標、驗收），差別只在門檻與監辦主體。","head":["比較點","§12 上級機關監辦","§13 會同監辦"],"rows":[["門檻","<b>查核金額</b>以上<br>（工程財物 5,000 萬／勞務 1,000 萬）","<b>公告金額</b>以上<br>（150 萬）"],["監辦主體","<b>上級機關</b>派員","機關<b>主（會）計及有關單位</b>"],["監辦事項","開標、比價、議價、決標、<b>驗收</b>","開標、比價、議價、決標、<b>驗收</b>"],["彈性","上級機關<b>得訂定授權條件</b>，由機關自行辦理","有<b>特殊情形</b>者，得不會同監辦"],["補行程序","未達查核金額但<b>決標金額</b>或<b>契約變更後金額</b>達查核金額者，應補具文件送上級機關<b>備查</b>（<button class=\"ref\" data-go=\"A0030057#12\">§12Ⅱ</button>）","—"],["授權訂定","查核金額由主管機關定之（§12Ⅲ）","公告金額應<b>低於</b>查核金額，由主管機關參酌<b>國際標準</b>定之（§13Ⅲ）；<br>會同監辦辦法由主管機關<b>會同行政院主計處</b>定之（§13Ⅳ）"]],"mnemo":"<b>「查核找上級，公告找主計」</b>；公告金額必須低於查核金額，且要參酌國際標準。"},{"id":"award","t":"最低標 vs 最有利標","cat":"d","h":"決標原則四種（<button class=\"ref\" data-go=\"A0030057#52\">§52Ⅰ</button>），實務上真正對立的是這兩種。","head":["比較點","訂有底價之最低標","未訂底價之最低標","最有利標"],"rows":[["法條","<button class=\"ref\" data-go=\"A0030057#52\">§52Ⅰ①</button>、<button class=\"ref\" data-go=\"A0030057#53\">§53</button>","<button class=\"ref\" data-go=\"A0030057#52\">§52Ⅰ②</button>、<button class=\"ref\" data-go=\"A0030057#54\">§54</button>","<button class=\"ref\" data-go=\"A0030057#52\">§52Ⅰ③</button>、<button class=\"ref\" data-go=\"A0030057#56\">§56</button>"],["得標條件","合於招標文件且<b>在底價以內</b>之最低標","合於招標文件、<b>標價合理</b>且在<b>預算數額以內</b>之最低標","合於招標文件之<b>最有利標</b>"],["超過上限時","減價<b>一次</b> → 比減價格<b>不得逾三次</b> → 仍超底價而不逾預算且有緊急情事，經核准得決標，<b>不得超過底價 8%</b>；<b>查核金額以上超過 4%</b> 應先報上級機關核准","減價<b>一次</b> → 比減價格（機關得限制次數，<b>不得逾三次</b>）→ 仍逾越應<b>廢標</b>","綜合評選<b>不得逾三次</b> → 仍無法評定應<b>廢標</b>"],["評選","—","得由評審委員會建議金額（§54）","就技術、品質、功能、商業條款或價格作<b>序位或計數</b>之綜合評選；<b>未列入招標文件之項目不得作為評選參考</b>"],["程序要件","—","—","應成立<b>評選委員會</b>（<button class=\"ref\" data-go=\"A0030057#94\">§94</button>：5 人以上，專家學者不得少於 <b>1/3</b>）；採最有利標決標<b>應先報經上級機關核准</b>"],["原則採用","—","—","公告金額以上之<b>專業／技術／資訊／社會福利／文化創意服務</b>，以<b>不訂底價之最有利標</b>為原則（<button class=\"ref\" data-go=\"A0030057#52\">§52Ⅱ</button>）"]],"mnemo":"<b>「減一次、比三次、超底八趴、查核四趴報上級」</b>；最有利標要「先報上級、先列項目、先公告協商」。"},{"id":"org","t":"五個小組／委員會","cat":"z","h":"名字都很像，用「<b>誰設、幾人、做什麼</b>」三個問題就能分清楚。","head":["名稱","法條","設立者","任務"],"rows":[["<b>採購工作及審查小組</b>","<button class=\"ref\" data-go=\"A0030057#11-1\">§11-1</button>、<button class=\"ref\" data-go=\"A0030315#1\">設置及作業辦法</button>","辦理採購之<b>機關</b>","<b>巨額工程採購應成立</b>；協助審查採購需求與經費、採購策略、招標文件，並提供諮詢。§101 停權通知前亦應由本小組認定是否該當各款情形（<button class=\"ref\" data-go=\"A0030057#101\">§101Ⅲ</button>）"],["<b>採購評選委員會</b>","<button class=\"ref\" data-go=\"A0030057#94\">§94</button>、<button class=\"ref\" data-go=\"A0030103#1\">組織準則</button>","辦理評選之<b>機關</b>","辦理<b>評選</b>；<b>5 人以上</b>，專家學者<b>不得少於 1/3</b>，且不得為政府機關現職人員"],["<b>採購稽核小組</b>","<button class=\"ref\" data-go=\"A0030057#108\">§108</button>、<button class=\"ref\" data-go=\"A0030100#1\">組織準則</button>","中央及直轄市、縣（市）<b>政府</b>","<b>稽核監督</b>採購事宜（事後、全面）"],["<b>工程施工查核小組</b>","<button class=\"ref\" data-go=\"A0030057#70\">§70Ⅲ</button>、<button class=\"ref\" data-go=\"D0070080#1\">作業辦法</button>","中央及直轄市、縣（市）<b>政府</b>","定期查核所屬（轄）機關<b>工程品質及進度</b>；以<b>現場查核為主</b>"],["<b>採購申訴審議委員會</b>","<button class=\"ref\" data-go=\"A0030057#86\">§86</button>、<button class=\"ref\" data-go=\"A0030096#1\">組織準則</button>","主管機關及直轄市、縣（市）<b>政府</b>","處理廠商<b>申訴</b>及機關與廠商間<b>履約爭議調解</b>；委員 <b>7～35 人</b>，派兼人數<b>不得超過全體委員 1/5</b>"]],"mnemo":"<b>機關自己設的：工作及審查小組、評選委員會；政府層級設的：稽核小組、施工查核小組、申訴審議委員會。</b><br>人數只有三個要記：評選 <b>5 人以上、專家 1/3</b>；申訴會 <b>7～35 人、派兼 ≤1/5</b>。"},{"id":"apply","t":"誰要適用採購法？","cat":"g","h":"§3 是原則，§4、§5、§99、§104、§105 是變化題常考的邊界。","head":["情形","法條","是否適用本法"],"rows":[["政府機關、公立學校、公營事業","<button class=\"ref\" data-go=\"A0030057#3\">§3</button>","<b>適用</b>。本法未規定者，適用其他法律"],["法人或團體<b>接受機關補助</b>辦理採購","<button class=\"ref\" data-go=\"A0030057#4\">§4Ⅰ</button>","補助金額<b>占採購金額半數以上</b>，<b>且</b>補助金額在<b>公告金額以上</b>者才適用，並受該機關監督（兩要件須同時具備）"],["<b>藝文採購</b>（受補助）","<button class=\"ref\" data-go=\"A0030057#4\">§4Ⅱ</button>","<b>不適用</b> §4Ⅰ，但仍應受補助機關監督；辦法由<b>文化部</b>定之"],["機關<b>委託法人或團體代辦</b>","<button class=\"ref\" data-go=\"A0030057#5\">§5</button>","<b>適用</b>，該法人團體受委託機關監督"],["機關<b>洽由其他機關代辦</b>","<button class=\"ref\" data-go=\"A0030057#40\">§40</button>","<b>適用</b>；上級機關得命未具專業採購能力之機關洽請代辦"],["政府規劃核准之交通、能源、環保、旅遊建設，開放廠商<b>投資興建營運</b>","<button class=\"ref\" data-go=\"A0030057#99\">§99</button>","其<b>甄選投資廠商之程序</b>適用本法（其他法律另有規定者除外）"],["<b>軍事機關</b>採購","<button class=\"ref\" data-go=\"A0030057#104\">§104</button>","原則<b>適用</b>；武器彈藥作戰物資或涉國安國防者，依四款情形分別排除部分或全部條文"],["戰爭天災疫情等<b>緊急處置</b>、公務機關間財物勞務取得、依條約向國際組織採購","<button class=\"ref\" data-go=\"A0030057#105\">§105</button>","得<b>不適用招標、決標</b>之規定"],["<b>駐國外機構</b>辦理或受託辦理之採購","<button class=\"ref\" data-go=\"A0030057#106\">§106</button>","得不適用 §27 公報、§30 押標金保證金、§53Ⅰ及§54Ⅰ減價、<b>第六章異議申訴</b>（第 2～4 款應於招標文件明定處理方式）"]],"mnemo":"§4 兩要件<b>「半數以上」＋「公告金額以上」缺一不可</b>；§106 排除四項要背：公報、押保金、減價、異議申訴。"},{"id":"penalty","t":"三種對廠商的不利處分","cat":"s","h":"押標金追繳、不決標、停權，事由高度重疊但性質不同，常一起考。","head":["比較點","追繳押標金","不予開標／不決標","停權（刊登公報）"],"rows":[["法條","<button class=\"ref\" data-go=\"A0030057#31\">§31Ⅱ</button>","<button class=\"ref\" data-go=\"A0030057#50\">§50Ⅰ</button>","<button class=\"ref\" data-go=\"A0030057#101\">§101</button>、<button class=\"ref\" data-go=\"A0030057#102\">§102</button>、<button class=\"ref\" data-go=\"A0030057#103\">§103</button>"],["性質","沒收擔保","排除本案","<b>一定期間內</b>不得參加投標、作為決標對象或分包廠商"],["事由數","<b>7 款</b>","<b>7 款</b>","<b>15 款</b>"],["共通事由","借冒名投標、虛偽不實文件、行求期約交付不正利益","借冒名投標、不實文件、影響採購公正之違法行為","借冒名投標、虛偽不實文件、行求期約交付不正利益"],["程序保障","—","—","通知前應給予<b>陳述意見</b>機會，並應成立<b>採購工作及審查小組</b>認定（§101Ⅲ）"],["救濟","爭議屬追繳押標金者，申訴<b>不受公告金額限制</b>（<button class=\"ref\" data-go=\"A0030057#76\">§76Ⅳ</button>）","依 §75、§76 異議申訴","異議 <b>20 日</b>、申訴 <b>15 日</b>，<b>不論是否逾公告金額</b>（§102）"],["期間","請求權 <b>5 年</b>；逾 <b>15 年</b>不得行使","—","3 年（1～5、15 款、6 款判有期徒刑）／1 年（13、14 款、6 款判拘役罰金緩刑）／3 月→6 月→1 年累進（7～12 款）"]],"mnemo":"事由重疊三兄弟：<b>借冒名、不實文件、行賄</b>——三種處分都有。"}],"laws":[{"id":"A0030057","title":"政府採購法","short":"採購法","date":"民國108年05月22日","kind":"母法","multi":true,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030057","articles":[{"no":"1","label":"第1條","ch":"第一章總則","cat":"g","lines":["為建立政府採購制度，依公平、公開之採購程序，提升採購效率與功能，確保採購品質，爰制定本法。"]},{"no":"2","label":"第2條","ch":"第一章總則","cat":"g","lines":["本法所稱採購，指工程之定作、財物之買受、定製、承租及勞務之委任或僱傭等。"]},{"no":"3","label":"第3條","ch":"第一章總則","cat":"g","lines":["政府機關、公立學校、公營事業（以下簡稱機關）辦理採購，依本法之規定；本法未規定者，適用其他法律之規定。"]},{"no":"4","label":"第4條","ch":"第一章總則","cat":"g","lines":["法人或團體接受機關補助辦理採購，其補助金額占採購金額半數以上，且補助金額在公告金額以上者，適用本法之規定，並應受該機關之監督。","藝文採購不適用前項規定，但應受補助機關之監督；其辦理原則、適用範圍及監督管理辦法，由文化部定之。"]},{"no":"5","label":"第5條","ch":"第一章總則","cat":"g","lines":["機關採購得委託法人或團體代辦。","前項採購適用本法之規定，該法人或團體並受委託機關之監督。"]},{"no":"6","label":"第6條","ch":"第一章總則","cat":"g","lines":["機關辦理採購，應以維護公共利益及公平合理為原則，對廠商不得為無正當理由之差別待遇。","辦理採購人員於不違反本法規定之範圍內，得基於公共利益、採購效益或專業判斷之考量，為適當之採購決定。","司法、監察或其他機關對於採購機關或人員之調查、起訴、審判、彈劾或糾舉等，得洽請主管機關協助、鑑定或提供專業意見。"]},{"no":"7","label":"第7條","ch":"第一章總則","cat":"g","lines":["本法所稱工程，指在地面上下新建、增建、改建、修建、拆除構造物與其所屬設備及改變自然環境之行為，包括建築、土木、水利、環境、交通、機械、電氣、化工及其他經主管機關認定之工程。","本法所稱財物，指各種物品（生鮮農漁產品除外）、材料、設備、機具與其他動產、不動產、權利及其他經主管機關認定之財物。","本法所稱勞務，指專業服務、技術服務、資訊服務、研究發展、營運管理、維修、訓練、勞力及其他經主管機關認定之勞務。","採購兼有工程、財物、勞務二種以上性質，難以認定其歸屬者，按其性質所占預算金額比率最高者歸屬之。"]},{"no":"8","label":"第8條","ch":"第一章總則","cat":"g","lines":["本法所稱廠商，指公司、合夥或獨資之工商行號及其他得提供各機關工程、財物、勞務之自然人、法人、機構或團體。"]},{"no":"9","label":"第9條","ch":"第一章總則","cat":"g","lines":["本法所稱主管機關，為行政院採購暨公共工程委員會，以政務委員一人兼任主任委員。","本法所稱上級機關，指辦理採購機關直屬之上一級機關。其無上級機關者，由該機關執行本法所規定上級機關之職權。"]},{"no":"10","label":"第10條","ch":"第一章總則","cat":"g","lines":["主管機關掌理下列有關政府採購事項︰","一、政府採購政策與制度之研訂及政令之宣導。","二、政府採購法令之研訂、修正及解釋。","三、標準採購契約之檢討及審定。","四、政府採購資訊之蒐集、公告及統計。","五、政府採購專業人員之訓練。","六、各機關採購之協調、督導及考核。","七、中央各機關採購申訴之處理。","八、其他關於政府採購之事項。"]},{"no":"11","label":"第11條","ch":"第一章總則","cat":"g","lines":["主管機關應設立採購資訊中心，統一蒐集共通性商情及同等品分類之資訊，並建立工程價格資料庫，以供各機關採購預算編列及底價訂定之參考。除應秘密之部分外，應無償提供廠商。","機關辦理工程採購之預算金額達一定金額以上者，應於決標後將得標廠商之單價資料傳輸至前項工程價格資料庫。","前項一定金額、傳輸資料內容、格式、傳輸方式及其他相關事項之辦法，由主管機關定之。","財物及勞務項目有建立價格資料庫之必要者，得準用前二項規定。"]},{"no":"11-1","label":"第11-1條","ch":"第一章總則","cat":"g","lines":["機關辦理巨額工程採購，應依採購之特性及實際需要，成立採購工作及審查小組，協助審查採購需求與經費、採購策略、招標文件等事項，及提供與採購有關事務之諮詢。","機關辦理第一項以外之採購，依採購特性及實際需要，認有成立採購工作及審查小組之必要者，準用前項規定。","前二項採購工作及審查小組之組成、任務、審查作業及其他相關事項之辦法，由主管機關定之。"],"xc":["z"]},{"no":"12","label":"第12條","ch":"第一章總則","cat":"g","lines":["機關辦理查核金額以上採購之開標、比價、議價、決標及驗收時，應於規定期限內，檢送相關文件報請上級機關派員監辦；上級機關得視事實需要訂定授權條件，由機關自行辦理。","機關辦理未達查核金額之採購，其決標金額達查核金額者，或契約變更後其金額達查核金額者，機關應補具相關文件送上級機關備查。","查核金額由主管機關定之。"],"xc":[]},{"no":"13","label":"第13條","ch":"第一章總則","cat":"g","lines":["機關辦理公告金額以上採購之開標、比價、議價、決標及驗收，除有特殊情形者外，應由其主（會）計及有關單位會同監辦。","未達公告金額採購之監辦，依其屬中央或地方，由主管機關、直轄市或縣（市）政府另定之。未另定者，比照前項規定辦理。","公告金額應低於查核金額，由主管機關參酌國際標準定之。","第一項會同監辦採購辦法，由主管機關會同行政院主計處定之。"],"xc":[]},{"no":"14","label":"第14條","ch":"第一章總則","cat":"g","lines":["機關不得意圖規避本法之適用，分批辦理公告金額以上之採購。其有分批辦理之必要，並經上級機關核准者，應依其總金額核計採購金額，分別按公告金額或查核金額以上之規定辦理。"]},{"no":"15","label":"第15條","ch":"第一章總則","cat":"g","lines":["機關承辦、監辦採購人員離職後三年內不得為本人或代理廠商向原任職機關接洽處理離職前五年內與職務有關之事務。","機關人員對於與採購有關之事項，涉及本人、配偶、二親等以內親屬，或共同生活家屬之利益時，應行迴避。","機關首長發現前項人員有應行迴避之情事而未依規定迴避者，應令其迴避，並另行指定人員辦理。"]},{"no":"16","label":"第16條","ch":"第一章總則","cat":"g","lines":["請託或關說，宜以書面為之或作成紀錄。","政風機構得調閱前項書面或紀錄。","第一項之請託或關說，不得作為評選之參考。"]},{"no":"17","label":"第17條","ch":"第一章總則","cat":"g","lines":["外國廠商參與各機關採購，應依我國締結之條約或協定之規定辦理。","前項以外情形，外國廠商參與各機關採購之處理辦法，由主管機關定之。","外國法令限制或禁止我國廠商或產品服務參與採購者，主管機關得限制或禁止該國廠商或產品服務參與採購。","機關辦理涉及國家安全之採購，有對我國或外國廠商資格訂定限制條件之必要者，其限制條件及審查相關作業事項之辦法，由主管機關會商相關目的事業主管機關定之。"],"xc":["w"]},{"no":"18","label":"第18條","ch":"第二章招標","cat":"b","lines":["採購之招標方式，分為公開招標、選擇性招標及限制性招標。","本法所稱公開招標，指以公告方式邀請不特定廠商投標。","本法所稱選擇性招標，指以公告方式預先依一定資格條件辦理廠商資格審查後，再行邀請符合資格之廠商投標。","本法所稱限制性招標，指不經公告程序，邀請二家以上廠商比價或僅邀請一家廠商議價。"]},{"no":"19","label":"第19條","ch":"第二章招標","cat":"b","lines":["機關辦理公告金額以上之採購，除依第二十條及第二十二條辦理者外，應公開招標。"]},{"no":"20","label":"第20條","ch":"第二章招標","cat":"b","lines":["機關辦理公告金額以上之採購，符合下列情形之一者，得採選擇性招標：","一、經常性採購。","二、投標文件審查，須費時長久始能完成者。","三、廠商準備投標需高額費用者。","四、廠商資格條件複雜者。","五、研究發展事項。"]},{"no":"21","label":"第21條","ch":"第二章招標","cat":"b","lines":["機關為辦理選擇性招標，得預先辦理資格審查，建立合格廠商名單。但仍應隨時接受廠商資格審查之請求，並定期檢討修正合格廠商名單。","未列入合格廠商名單之廠商請求參加特定招標時，機關於不妨礙招標作業，並能適時完成其資格審查者，於審查合格後，邀其投標。","經常性採購，應建立六家以上之合格廠商名單。","機關辦理選擇性招標，應予經資格審查合格之廠商平等受邀之機會。"]},{"no":"22","label":"第22條","ch":"第二章招標","cat":"b","lines":["機關辦理公告金額以上之採購，符合下列情形之一者，得採限制性招標：","一、以公開招標、選擇性招標或依第九款至第十一款公告程序辦理結果，無廠商投標或無合格標，且以原定招標內容及條件未經重大改變者。","二、屬專屬權利、獨家製造或供應、藝術品、秘密諮詢，無其他合適之替代標的者。","三、遇有不可預見之緊急事故，致無法以公開或選擇性招標程序適時辦理，且確有必要者。","四、原有採購之後續維修、零配件供應、更換或擴充，因相容或互通性之需要，必須向原供應廠商採購者。","五、屬原型或首次製造、供應之標的，以研究發展、實驗或開發性質辦理者。","六、在原招標目的範圍內，因未能預見之情形，必須追加契約以外之工程，如另行招標，確有產生重大不便及技術或經濟上困難之虞，非洽原訂約廠商辦理，不能達契約之目的，且未逾原主契約金額百分之五十者。","七、原有採購之後續擴充，且已於原招標公告及招標文件敘明擴充之期間、金額或數量者。","八、在集中交易或公開競價市場採購財物。","九、委託專業服務、技術服務、資訊服務或社會福利服務，經公開客觀評選為優勝者。","十、辦理設計競賽，經公開客觀評選為優勝者。","十一、因業務需要，指定地區採購房地產，經依所需條件公開徵求勘選認定適合需要者。","十二、購買身心障礙者、原住民或受刑人個人、身心障礙福利機構或團體、政府立案之原住民團體、監獄工場、慈善機構及庇護工場所提供之非營利產品或勞務。","十三、委託在專業領域具領先地位之自然人或經公告審查優勝之學術或非營利機構進行科技、技術引進、行政或學術研究發展。","十四、邀請或委託具專業素養、特質或經公告審查優勝之文化、藝術專業人士、機構或團體表演或參與文藝活動或提供文化創意服務。","十五、公營事業為商業性轉售或用於製造產品、提供服務以供轉售目的所為之採購，基於轉售對象、製程或供應源之特性或實際需要，不適宜以公開招標或選擇性招標方式辦理者。","十六、其他經主管機關認定者。","前項第九款專業服務、技術服務、資訊服務及第十款之廠商評選辦法與服務費用計算方式與第十一款、第十三款及第十四款之作業辦法，由主管機關定之。","第一項第九款社會福利服務之廠商評選辦法與服務費用計算方式，由主管機關會同中央目的事業主管機關定之。","第一項第十三款及第十四款，不適用工程採購。"]},{"no":"23","label":"第23條","ch":"第二章招標","cat":"b","lines":["未達公告金額之招標方式，在中央由主管機關定之；在地方由直轄市或縣（市）政府定之。地方未定者，比照中央規定辦理。"]},{"no":"24","label":"第24條","ch":"第二章招標","cat":"b","lines":["機關基於效率及品質之要求，得以統包辦理招標。","前項所稱統包，指將工程或財物採購中之設計與施工、供應、安裝或一定期間之維修等併於同一採購契約辦理招標。","統包實施辦法，由主管機關定之。"]},{"no":"25","label":"第25條","ch":"第二章招標","cat":"b","lines":["機關得視個別採購之特性，於招標文件中規定允許一定家數內之廠商共同投標。","第一項所稱共同投標，指二家以上之廠商共同具名投標，並於得標後共同具名簽約，連帶負履行採購契約之責，以承攬工程或提供財物、勞務之行為。","共同投標以能增加廠商之競爭或無不當限制競爭者為限。","同業共同投標應符合公平交易法第十五條第一項但書各款之規定。","共同投標廠商應於投標時檢附共同投標協議書。","共同投標辦法，由主管機關定之。"]},{"no":"26","label":"第26條","ch":"第二章招標","cat":"b","lines":["機關辦理公告金額以上之採購，應依功能或效益訂定招標文件。其有國際標準或國家標準者，應從其規定。","機關所擬定、採用或適用之技術規格，其所標示之擬採購產品或服務之特性，諸如品質、性能、安全、尺寸、符號、術語、包裝、標誌及標示或生產程序、方法及評估之程序，在目的及效果上均不得限制競爭。","招標文件不得要求或提及特定之商標或商名、專利、設計或型式、特定來源地、生產者或供應者。但無法以精確之方式說明招標要求，而已在招標文件內註明諸如「或同等品」字樣者，不在此限。"]},{"no":"26-1","label":"第26-1條","ch":"第二章招標","cat":"b","lines":["機關得視採購之特性及實際需要，以促進自然資源保育與環境保護為目的，依前條規定擬定技術規格，及節省能源、節約資源、減少溫室氣體排放之相關措施。","前項增加計畫經費或技術服務費用者，於擬定規格或措施時應併入計畫報核編列預算。"]},{"no":"27","label":"第27條","ch":"第二章招標","cat":"b","lines":["機關辦理公開招標或選擇性招標，應將招標公告或辦理資格審查之公告刊登於政府採購公報並公開於資訊網路。公告之內容修正時，亦同。","前項公告內容、公告日數、公告方法及政府採購公報發行辦法，由主管機關定之。","機關辦理採購時，應估計採購案件之件數及每件之預計金額。預算及預計金額，得於招標公告中一併公開。"]},{"no":"28","label":"第28條","ch":"第二章招標","cat":"b","lines":["機關辦理招標，其自公告日或邀標日起至截止投標或收件日止之等標期，應訂定合理期限。其期限標準，由主管機關定之。"]},{"no":"29","label":"第29條","ch":"第二章招標","cat":"b","lines":["公開招標之招標文件及選擇性招標之預先辦理資格審查文件，應自公告日起至截止投標日或收件日止，公開發給、發售及郵遞方式辦理。發給、發售或郵遞時，不得登記領標廠商之名稱。","選擇性招標之文件應公開載明限制投標廠商資格之理由及其必要性。","第一項文件內容，應包括投標廠商提交投標書所需之一切必要資料。"]},{"no":"30","label":"第30條","ch":"第二章招標","cat":"b","lines":["機關辦理招標，應於招標文件中規定投標廠商須繳納押標金；得標廠商須繳納保證金或提供或併提供其他擔保。但有下列情形之一者，不在此限：","一、勞務採購，以免收押標金、保證金為原則。","二、未達公告金額之工程、財物採購，得免收押標金、保證金。","三、以議價方式辦理之採購，得免收押標金。","四、依市場交易慣例或採購案特性，無收取押標金、保證金之必要或可能。","押標金及保證金應由廠商以現金、金融機構簽發之本票或支票、保付支票、郵政匯票、政府公債、設定質權之金融機構定期存款單、銀行開發或保兌之不可撤銷擔保信用狀繳納，或取具銀行之書面連帶保證、保險公司之連帶保證保險單為之。","押標金、保證金與其他擔保之種類、額度、繳納、退還、終止方式及其他相關作業事項之辦法，由主管機關另定之。"]},{"no":"31","label":"第31條","ch":"第二章招標","cat":"b","lines":["機關對於廠商所繳納之押標金，應於決標後無息發還未得標之廠商。廢標時，亦同。","廠商有下列情形之一者，其所繳納之押標金，不予發還；其未依招標文件規定繳納或已發還者，並予追繳：","一、以虛偽不實之文件投標。","二、借用他人名義或證件投標，或容許他人借用本人名義或證件參加投標。","三、冒用他人名義或證件投標。","四、得標後拒不簽約。","五、得標後未於規定期限內，繳足保證金或提供擔保。","六、對採購有關人員行求、期約或交付不正利益。","七、其他經主管機關認定有影響採購公正之違反法令行為。","前項追繳押標金之情形，屬廠商未依招標文件規定繳納者，追繳金額依招標文件中規定之額度定之；其為標價之一定比率而無標價可供計算者，以預算金額代之。","第二項追繳押標金之請求權，因五年間不行使而消滅。","前項期間，廠商未依招標文件規定繳納者，自開標日起算；機關已發還押標金者，自發還日起算；得追繳之原因發生或可得知悉在後者，自原因發生或可得知悉時起算。","追繳押標金，自不予開標、不予決標、廢標或決標日起逾十五年者，不得行使。"]},{"no":"32","label":"第32條","ch":"第二章招標","cat":"b","lines":["機關應於招標文件中規定，得不發還得標廠商所繳納之保證金及其孳息，或擔保者應履行其擔保責任之事由，並敘明該項事由所涉及之違約責任、保證金之抵充範圍及擔保者之擔保責任。"]},{"no":"33","label":"第33條","ch":"第二章招標","cat":"b","lines":["廠商之投標文件，應以書面密封，於投標截止期限前，以郵遞或專人送達招標機關或其指定之場所。","前項投標文件，廠商得以電子資料傳輸方式遞送。但以招標文件已有訂明者為限，並應於規定期限前遞送正式文件。","機關得於招標文件中規定允許廠商於開標前補正非契約必要之點之文件。"]},{"no":"34","label":"第34條","ch":"第二章招標","cat":"b","lines":["機關辦理採購，其招標文件於公告前應予保密。但須公開說明或藉以公開徵求廠商提供參考資料者，不在此限。","機關辦理招標，不得於開標前洩漏底價，領標、投標廠商之名稱與家數及其他足以造成限制競爭或不公平競爭之相關資料。","底價於開標後至決標前，仍應保密，決標後除有特殊情形外，應予公開。但機關依實際需要，得於招標文件中公告底價。","機關對於廠商投標文件，除供公務上使用或法令另有規定外，應保守秘密。"]},{"no":"35","label":"第35條","ch":"第二章招標","cat":"b","lines":["機關得於招標文件中規定，允許廠商在不降低原有功能條件下，得就技術、工法、材料或設備，提出可縮減工期、減省經費或提高效率之替代方案。其實施辦法，由主管機關定之。"]},{"no":"36","label":"第36條","ch":"第二章招標","cat":"b","lines":["機關辦理採購，得依實際需要，規定投標廠商之基本資格。","特殊或巨額之採購，須由具有相當經驗、實績、人力、財力、設備等之廠商始能擔任者，得另規定投標廠商之特定資格。","外國廠商之投標資格及應提出之資格文件，得就實際需要另行規定，附經公證或認證之中文譯本，並於招標文件中訂明。","第一項基本資格、第二項特定資格與特殊或巨額採購之範圍及認定標準，由主管機關定之。"]},{"no":"37","label":"第37條","ch":"第二章招標","cat":"b","lines":["機關訂定前條投標廠商之資格，不得不當限制競爭，並以確認廠商具備履行契約所必須之能力者為限。","投標廠商未符合前條所定資格者，其投標不予受理。但廠商之財力資格，得以銀行或保險公司之履約及賠償連帶保證責任、連帶保證保險單代之。"]},{"no":"38","label":"第38條","ch":"第二章招標","cat":"b","lines":["政黨及與其具關係企業關係之廠商，不得參與投標。","前項具關係企業關係之廠商，準用公司法有關關係企業之規定。"]},{"no":"39","label":"第39條","ch":"第二章招標","cat":"b","lines":["機關辦理採購，得依本法將其對規劃、設計、供應或履約業務之專案管理，委託廠商為之。","承辦專案管理之廠商，其負責人或合夥人不得同時為規劃、設計、施工或供應廠商之負責人或合夥人。","承辦專案管理之廠商與規劃、設計、施工或供應廠商，不得同時為關係企業或同一其他廠商之關係企業。"]},{"no":"40","label":"第40條","ch":"第二章招標","cat":"b","lines":["機關之採購，得洽由其他具有專業能力之機關代辦。","上級機關對於未具有專業採購能力之機關，得命其洽由其他具有專業能力之機關代辦採購。"]},{"no":"41","label":"第41條","ch":"第二章招標","cat":"b","lines":["廠商對招標文件內容有疑義者，應於招標文件規定之日期前，以書面向招標機關請求釋疑。","機關對前項疑義之處理結果，應於招標文件規定之日期前，以書面答復請求釋疑之廠商，必要時得公告之；其涉及變更或補充招標文件內容者，除選擇性招標之規格標與價格標及限制性招標得以書面通知各廠商外，應另行公告，並視需要延長等標期。機關自行變更或補充招標文件內容者，亦同。"]},{"no":"42","label":"第42條","ch":"第二章招標","cat":"b","lines":["機關辦理公開招標或選擇性招標，得就資格、規格與價格採取分段開標。","機關辦理分段開標，除第一階段應公告外，後續階段之邀標，得免予公告。"]},{"no":"43","label":"第43條","ch":"第二章招標","cat":"b","lines":["機關辦理採購，除我國締結之條約或協定另有禁止規定者外，得採行下列措施之一，並應載明於招標文件中︰","一、要求投標廠商採購國內貨品比率、技術移轉、投資、協助外銷或其他類似條件，作為採購評選之項目，其比率不得逾三分之一。","二、外國廠商為最低標，且其標價符合第五十二條規定之決標原則者，得以該標價優先決標予國內廠商。"],"xc":["w"]},{"no":"44","label":"第44條","ch":"第二章招標","cat":"b","lines":["機關辦理特定之採購，除我國締結之條約或協定另有禁止規定者外，得對國內產製加值達百分之五十之財物或國內供應之工程、勞務，於外國廠商為最低標，且其標價符合第五十二條規定之決標原則時，以高於該標價一定比率以內之價格，優先決標予國內廠商。","前項措施之採行，以合於就業或產業發展政策者為限，且一定比率不得逾百分之三，優惠期限不得逾五年；其適用範圍、優惠比率及實施辦法，由主管機關會同相關目的事業主管機關定之。"],"xc":["w"]},{"no":"45","label":"第45條","ch":"第三章決標","cat":"d","lines":["公開招標及選擇性招標之開標，除法令另有規定外，應依招標文件公告之時間及地點公開為之。"]},{"no":"46","label":"第46條","ch":"第三章決標","cat":"d","lines":["機關辦理採購，除本法另有規定外，應訂定底價。底價應依圖說、規範、契約並考量成本、市場行情及政府機關決標資料逐項編列，由機關首長或其授權人員核定。","前項底價之訂定時機，依下列規定辦理︰","一、公開招標應於開標前定之。","二、選擇性招標應於資格審查後之下一階段開標前定之。","三、限制性招標應於議價或比價前定之。"]},{"no":"47","label":"第47條","ch":"第三章決標","cat":"d","lines":["機關辦理下列採購，得不訂底價。但應於招標文件內敘明理由及決標條件與原則︰","一、訂定底價確有困難之特殊或複雜案件。","二、以最有利標決標之採購。","三、小額採購。","前項第一款及第二款之採購，得規定廠商於投標文件內詳列報價內容。","小額採購之金額，在中央由主管機關定之；在地方由直轄市或縣（市）政府定之。但均不得逾公告金額十分之一。地方未定者，比照中央規定辦理。"]},{"no":"48","label":"第48條","ch":"第三章決標","cat":"d","lines":["機關依本法規定辦理招標，除有下列情形之一不予開標決標外，有三家以上合格廠商投標，即應依招標文件所定時間開標決標：","一、變更或補充招標文件內容者。","二、發現有足以影響採購公正之違法或不當行為者。","三、依第八十二條規定暫緩開標者。","四、依第八十四條規定暫停採購程序者。","五、依第八十五條規定由招標機關另為適法之處置者。","六、因應突發事故者。","七、採購計畫變更或取銷採購者。","八、經主管機關認定之特殊情形。","第一次開標，因未滿三家而流標者，第二次招標之等標期間得予縮短，並得不受前項三家廠商之限制。"]},{"no":"49","label":"第49條","ch":"第三章決標","cat":"d","lines":["未達公告金額之採購，其金額逾公告金額十分之一者，除第二十二條第一項各款情形外，仍應公開取得三家以上廠商之書面報價或企劃書。"]},{"no":"50","label":"第50條","ch":"第三章決標","cat":"d","lines":["投標廠商有下列情形之一，經機關於開標前發現者，其所投之標應不予開標；於開標後發現者，應不決標予該廠商：","一、未依招標文件之規定投標。","二、投標文件內容不符合招標文件之規定。","三、借用或冒用他人名義或證件投標。","四、以不實之文件投標。","五、不同投標廠商間之投標文件內容有重大異常關聯。","六、第一百零三條第一項不得參加投標或作為決標對象之情形。","七、其他影響採購公正之違反法令行為。","決標或簽約後發現得標廠商於決標前有第一項情形者，應撤銷決標、終止契約或解除契約，並得追償損失。但撤銷決標、終止契約或解除契約反不符公共利益，並經上級機關核准者，不在此限。","第一項不予開標或不予決標，致採購程序無法繼續進行者，機關得宣布廢標。"]},{"no":"51","label":"第51條","ch":"第三章決標","cat":"d","lines":["機關應依招標文件規定之條件，審查廠商投標文件，對其內容有疑義時，得通知投標廠商提出說明。","前項審查結果應通知投標廠商，對不合格之廠商，並應敘明其原因。"]},{"no":"52","label":"第52條","ch":"第三章決標","cat":"d","lines":["機關辦理採購之決標，應依下列原則之一辦理，並應載明於招標文件中：","一、訂有底價之採購，以合於招標文件規定，且在底價以內之最低標為得標廠商。","二、未訂底價之採購，以合於招標文件規定，標價合理，且在預算數額以內之最低標為得標廠商。","三、以合於招標文件規定之最有利標為得標廠商。","四、採用複數決標之方式：機關得於招標文件中公告保留之採購項目或數量選擇之組合權利，但應合於最低價格或最有利標之競標精神。","機關辦理公告金額以上之專業服務、技術服務、資訊服務、社會福利服務或文化創意服務者，以不訂底價之最有利標為原則。","決標時得不通知投標廠商到場，其結果應通知各投標廠商。"]},{"no":"53","label":"第53條","ch":"第三章決標","cat":"d","lines":["合於招標文件規定之投標廠商之最低標價超過底價時，得洽該最低標廠商減價一次；減價結果仍超過底價時，得由所有合於招標文件規定之投標廠商重新比減價格，比減價格不得逾三次。","前項辦理結果，最低標價仍超過底價而不逾預算數額，機關確有緊急情事需決標時，應經原底價核定人或其授權人員核准，且不得超過底價百分之八。但查核金額以上之採購，超過底價百分之四者，應先報經上級機關核准後決標。"]},{"no":"54","label":"第54條","ch":"第三章決標","cat":"d","lines":["決標依第五十二條第一項第二款規定辦理者，合於招標文件規定之最低標價逾評審委員會建議之金額或預算金額時，得洽該最低標廠商減價一次。減價結果仍逾越上開金額時，得由所有合於招標文件規定之投標廠商重新比減價格。機關得就重新比減價格之次數予以限制，比減價格不得逾三次，辦理結果，最低標價仍逾越上開金額時，應予廢標。"]},{"no":"55","label":"第55條","ch":"第三章決標","cat":"d","lines":["機關辦理以最低標決標之採購，經報上級機關核准，並於招標公告及招標文件內預告者，得於依前二條規定無法決標時，採行協商措施。"]},{"no":"56","label":"第56條","ch":"第三章決標","cat":"d","lines":["決標依第五十二條第一項第三款規定辦理者，應依招標文件所規定之評審標準，就廠商投標標的之技術、品質、功能、商業條款或價格等項目，作序位或計數之綜合評選，評定最有利標。價格或其與綜合評選項目評分之商數，得做為單獨評選之項目或決標之標準。未列入之項目，不得做為評選之參考。評選結果無法依機關首長或評選委員會過半數之決定，評定最有利標時，得採行協商措施，再作綜合評選，評定最有利標。評定應附理由。綜合評選不得逾三次。","依前項辦理結果，仍無法評定最有利標時，應予廢標。","機關採最有利標決標者，應先報經上級機關核准。","最有利標之評選辦法，由主管機關定之。"]},{"no":"57","label":"第57條","ch":"第三章決標","cat":"d","lines":["機關依前二條之規定採行協商措施者，應依下列原則辦理︰","一、開標、投標、審標程序及內容均應予保密。","二、協商時應平等對待所有合於招標文件規定之投標廠商，必要時並錄影或錄音存證。","三、原招標文件已標示得更改項目之內容，始得納入協商。","四、前款得更改之項目變更時，應以書面通知所有得參與協商之廠商。","五、協商結束後，應予前款廠商依據協商結果，於一定期間內修改投標文件重行遞送之機會。"]},{"no":"58","label":"第58條","ch":"第三章決標","cat":"d","lines":["機關辦理採購採最低標決標時，如認為最低標廠商之總標價或部分標價偏低，顯不合理，有降低品質、不能誠信履約之虞或其他特殊情形，得限期通知該廠商提出說明或擔保。廠商未於機關通知期限內提出合理之說明或擔保者，得不決標予該廠商，並以次低標廠商為最低標廠商。"]},{"no":"59","label":"第59條","ch":"第三章決標","cat":"d","lines":["廠商不得以支付他人佣金、比例金、仲介費、後謝金或其他不正利益為條件，促成採購契約之成立。","違反前項規定者，機關得終止或解除契約，並將二倍之不正利益自契約價款中扣除。未能扣除者，通知廠商限期給付之。"]},{"no":"60","label":"第60條","ch":"第三章決標","cat":"d","lines":["機關辦理採購依第五十一條、第五十三條、第五十四條或第五十七條規定，通知廠商說明、減價、比減價格、協商、更改原報內容或重新報價，廠商未依通知期限辦理者，視同放棄。"]},{"no":"61","label":"第61條","ch":"第三章決標","cat":"d","lines":["機關辦理公告金額以上採購之招標，除有特殊情形者外，應於決標後一定期間內，將決標結果之公告刊登於政府採購公報，並以書面通知各投標廠商。無法決標者，亦同。"]},{"no":"62","label":"第62條","ch":"第三章決標","cat":"d","lines":["機關辦理採購之決標資料，應定期彙送主管機關。"]},{"no":"63","label":"第63條","ch":"第四章履約管理","cat":"p","lines":["各類採購契約以採用主管機關訂定之範本為原則，其要項及內容由主管機關參考國際及國內慣例定之。","採購契約應訂明一方執行錯誤、不實或管理不善，致他方遭受損害之責任。"]},{"no":"64","label":"第64條","ch":"第四章履約管理","cat":"p","lines":["採購契約得訂明因政策變更，廠商依契約繼續履行反而不符公共利益者，機關得報經上級機關核准，終止或解除部分或全部契約，並補償廠商因此所生之損失。"]},{"no":"65","label":"第65條","ch":"第四章履約管理","cat":"p","lines":["得標廠商應自行履行工程、勞務契約，不得轉包。","前項所稱轉包，指將原契約中應自行履行之全部或其主要部分，由其他廠商代為履行。","廠商履行財物契約，其需經一定履約過程，非以現成財物供應者，準用前二項規定。"]},{"no":"66","label":"第66條","ch":"第四章履約管理","cat":"p","lines":["得標廠商違反前條規定轉包其他廠商時，機關得解除契約、終止契約或沒收保證金，並得要求損害賠償。","前項轉包廠商與得標廠商對機關負連帶履行及賠償責任。再轉包者，亦同。"]},{"no":"67","label":"第67條","ch":"第四章履約管理","cat":"p","lines":["得標廠商得將採購分包予其他廠商。稱分包者，謂非轉包而將契約之部分由其他廠商代為履行。","分包契約報備於採購機關，並經得標廠商就分包部分設定權利質權予分包廠商者，民法第五百十三條之抵押權及第八百十六條因添附而生之請求權，及於得標廠商對於機關之價金或報酬請求權。","前項情形，分包廠商就其分包部分，與得標廠商連帶負瑕疵擔保責任。"]},{"no":"68","label":"第68條","ch":"第四章履約管理","cat":"p","lines":["得標廠商就採購契約對於機關之價金或報酬請求權，其全部或一部得為權利質權之標的。"]},{"no":"69","label":"第69條","ch":"第四章履約管理","cat":"p","lines":["（刪除）"]},{"no":"70","label":"第70條","ch":"第四章履約管理","cat":"p","lines":["機關辦理工程採購，應明訂廠商執行品質管理、環境保護、施工安全衛生之責任，並對重點項目訂定檢查程序及檢驗標準。","機關於廠商履約過程，得辦理分段查驗，其結果並得供驗收之用。","中央及直轄市、縣（市）政府應成立工程施工查核小組，定期查核所屬（轄）機關工程品質及進度等事宜。","工程施工查核小組之組織準則，由主管機關擬訂，報請行政院核定後發布之。其作業辦法，由主管機關定之。","財物或勞務採購需經一定履約過程，而非以現成財物或勞務供應者，準用第一項及第二項之規定。"],"xc":[]},{"no":"70-1","label":"第70-1條","ch":"第四章履約管理","cat":"p","lines":["機關辦理工程規劃、設計，應依工程規模及特性，分析潛在施工危險，編製符合職業安全衛生法規之安全衛生圖說及規範，並量化編列安全衛生費用。","機關辦理工程採購，應將前項設計成果納入招標文件，並於招標文件規定廠商須依職業安全衛生法規，採取必要之預防設備或措施，實施安全衛生管理及訓練，使勞工免於發生職業災害，以確保施工安全。","廠商施工場所依法令或契約應有之安全衛生設施欠缺或不良，致發生職業災害者，除應受職業安全衛生相關法令處罰外，機關應依本法及契約規定處置。"]},{"no":"71","label":"第71條","ch":"第五章驗收","cat":"p","lines":["機關辦理工程、財物採購，應限期辦理驗收，並得辦理部分驗收。","驗收時應由機關首長或其授權人員指派適當人員主驗，通知接管單位或使用單位會驗。","機關承辦採購單位之人員不得為所辦採購之主驗人或樣品及材料之檢驗人。","前三項之規定，於勞務採購準用之。"]},{"no":"72","label":"第72條","ch":"第五章驗收","cat":"p","lines":["機關辦理驗收時應製作紀錄，由參加人員會同簽認。驗收結果與契約、圖說、貨樣規定不符者，應通知廠商限期改善、拆除、重作、退貨或換貨。其驗收結果不符部分非屬重要，而其他部分能先行使用，並經機關檢討認為確有先行使用之必要者，得經機關首長或其授權人員核准，就其他部分辦理驗收並支付部分價金。","驗收結果與規定不符，而不妨礙安全及使用需求，亦無減少通常效用或契約預定效用，經機關檢討不必拆換或拆換確有困難者，得於必要時減價收受。其在查核金額以上之採購，應先報經上級機關核准；未達查核金額之採購，應經機關首長或其授權人員核准。","驗收人對工程、財物隱蔽部分，於必要時得拆驗或化驗。"]},{"no":"73","label":"第73條","ch":"第五章驗收","cat":"p","lines":["工程、財物採購經驗收完畢後，應由驗收及監驗人員於結算驗收證明書上分別簽認。","前項規定，於勞務驗收準用之。"]},{"no":"73-1","label":"第73-1條","ch":"第五章驗收","cat":"p","lines":["機關辦理工程採購之付款及審核程序，除契約另有約定外，應依下列規定辦理：","一、定期估驗或分階段付款者，機關應於廠商提出估驗或階段完成之證明文件後，十五日內完成審核程序，並於接到廠商提出之請款單據後，十五日內付款。","二、驗收付款者，機關應於驗收合格後，填具結算驗收證明文件，並於接到廠商請款單據後，十五日內付款。","三、前二款付款期限，應向上級機關申請核撥補助款者，為三十日。","前項各款所稱日數，係指實際工作日，不包括例假日、特定假日及退請受款人補正之日數。","機關辦理付款及審核程序，如發現廠商有文件不符、不足或有疑義而需補正或澄清者，應一次通知澄清或補正，不得分次辦理。","財物及勞務採購之付款及審核程序，準用前三項之規定。"]},{"no":"74","label":"第74條","ch":"第六章爭議處理","cat":"r","lines":["廠商與機關間關於招標、審標、決標之爭議，得依本章規定提出異議及申訴。"]},{"no":"75","label":"第75條","ch":"第六章爭議處理","cat":"r","lines":["廠商對於機關辦理採購，認為違反法令或我國所締結之條約、協定（以下合稱法令），致損害其權利或利益者，得於下列期限內，以書面向招標機關提出異議：","一、對招標文件規定提出異議者，為自公告或邀標之次日起等標期之四分之一，其尾數不足一日者，以一日計。但不得少於十日。","二、對招標文件規定之釋疑、後續說明、變更或補充提出異議者，為接獲機關通知或機關公告之次日起十日。","三、對採購之過程、結果提出異議者，為接獲機關通知或機關公告之次日起十日。其過程或結果未經通知或公告者，為知悉或可得而知悉之次日起十日。但至遲不得逾決標日之次日起十五日。","招標機關應自收受異議之次日起十五日內為適當之處理，並將處理結果以書面通知提出異議之廠商。其處理結果涉及變更或補充招標文件內容者，除選擇性招標之規格標與價格標及限制性招標應以書面通知各廠商外，應另行公告，並視需要延長等標期。"]},{"no":"76","label":"第76條","ch":"第六章爭議處理","cat":"r","lines":["廠商對於公告金額以上採購異議之處理結果不服，或招標機關逾前條第二項所定期限不為處理者，得於收受異議處理結果或期限屆滿之次日起十五日內，依其屬中央機關或地方機關辦理之採購，以書面分別向主管機關、直轄市或縣（市）政府所設之採購申訴審議委員會申訴。地方政府未設採購申訴審議委員會者，得委請中央主管機關處理。","廠商誤向該管採購申訴審議委員會以外之機關申訴者，以該機關收受之日，視為提起申訴之日。","第二項收受申訴書之機關應於收受之次日起三日內將申訴書移送於該管採購申訴審議委員會，並通知申訴廠商。","爭議屬第三十一條規定不予發還或追繳押標金者，不受第一項公告金額以上之限制。"]},{"no":"77","label":"第77條","ch":"第六章爭議處理","cat":"r","lines":["申訴應具申訴書，載明下列事項，由申訴廠商簽名或蓋章︰","一、申訴廠商之名稱、地址、電話及負責人之姓名、性別、出生年月日、住所或居所。","二、原受理異議之機關。","三、申訴之事實及理由。","四、證據。","五、年、月、日。","申訴得委任代理人為之，代理人應檢附委任書並載明其姓名、性別、出生年月日、職業、電話、住所或居所。","民事訴訟法第七十條規定，於前項情形準用之。"]},{"no":"78","label":"第78條","ch":"第六章爭議處理","cat":"r","lines":["廠商提出申訴，應同時繕具副本送招標機關。機關應自收受申訴書副本之次日起十日內，以書面向該管採購申訴審議委員會陳述意見。","採購申訴審議委員會應於收受申訴書之次日起四十日內完成審議，並將判斷以書面通知廠商及機關。必要時得延長四十日。"]},{"no":"79","label":"第79條","ch":"第六章爭議處理","cat":"r","lines":["申訴逾越法定期間或不合法定程式者，不予受理。但其情形可以補正者，應定期間命其補正；逾期不補正者，不予受理。"]},{"no":"80","label":"第80條","ch":"第六章爭議處理","cat":"r","lines":["採購申訴得僅就書面審議之。","採購申訴審議委員會得依職權或申請，通知申訴廠商、機關到指定場所陳述意見。","採購申訴審議委員會於審議時，得囑託具專門知識經驗之機關、學校、團體或人員鑑定，並得通知相關人士說明或請機關、廠商提供相關文件、資料。","採購申訴審議委員會辦理審議，得先行向廠商收取審議費、鑑定費及其他必要之費用；其收費標準及繳納方式，由主管機關定之。","採購申訴審議規則，由主管機關擬訂，報請行政院核定後發布之。"]},{"no":"81","label":"第81條","ch":"第六章爭議處理","cat":"r","lines":["申訴提出後，廠商得於審議判斷送達前撤回之。申訴經撤回後，不得再行提出同一之申訴。"]},{"no":"82","label":"第82條","ch":"第六章爭議處理","cat":"r","lines":["採購申訴審議委員會審議判斷，應以書面附事實及理由，指明招標機關原採購行為有無違反法令之處；其有違反者，並得建議招標機關處置之方式。","採購申訴審議委員會於完成審議前，必要時得通知招標機關暫停採購程序。","採購申訴審議委員會為第一項之建議或前項之通知時，應考量公共利益、相關廠商利益及其他有關情況。"]},{"no":"83","label":"第83條","ch":"第六章爭議處理","cat":"r","lines":["審議判斷，視同訴願決定。"]},{"no":"84","label":"第84條","ch":"第六章爭議處理","cat":"r","lines":["廠商提出異議或申訴者，招標機關評估其事由，認其異議或申訴有理由者，應自行撤銷、變更原處理結果，或暫停採購程序之進行。但為應緊急情況或公共利益之必要，或其事由無影響採購之虞者，不在此限。","依廠商之申訴，而為前項之處理者，招標機關應將其結果即時通知該管採購申訴審議委員會。"]},{"no":"85","label":"第85條","ch":"第六章爭議處理","cat":"r","lines":["審議判斷指明原採購行為違反法令者，招標機關應自收受審議判斷書之次日起二十日內另為適法之處置；期限屆滿未處置者，廠商得自期限屆滿之次日起十五日內向採購申訴審議委員會申訴。","採購申訴審議委員會於審議判斷中建議招標機關處置方式，而招標機關不依建議辦理者，應於收受判斷之次日起十五日內報請上級機關核定，並由上級機關於收受之次日起十五日內，以書面向採購申訴審議委員會及廠商說明理由。","審議判斷指明原採購行為違反法令，廠商得向招標機關請求償付其準備投標、異議及申訴所支出之必要費用。"]},{"no":"85-1","label":"第85-1條","ch":"第六章爭議處理","cat":"r","lines":["機關與廠商因履約爭議未能達成協議者，得以下列方式之一處理：","一、向採購申訴審議委員會申請調解。","二、向仲裁機構提付仲裁。","前項調解屬廠商申請者，機關不得拒絕。工程及技術服務採購之調解，採購申訴審議委員會應提出調解建議或調解方案；其因機關不同意致調解不成立者，廠商提付仲裁，機關不得拒絕。","採購申訴審議委員會辦理調解之程序及其效力，除本法有特別規定者外，準用民事訴訟法有關調解之規定。","履約爭議調解規則，由主管機關擬訂，報請行政院核定後發布之。"]},{"no":"85-2","label":"第85-2條","ch":"第六章爭議處理","cat":"r","lines":["申請調解，應繳納調解費、鑑定費及其他必要之費用；其收費標準、繳納方式及數額之負擔，由主管機關定之。"]},{"no":"85-3","label":"第85-3條","ch":"第六章爭議處理","cat":"r","lines":["調解經當事人合意而成立；當事人不能合意者，調解不成立。","調解過程中，調解委員得依職權以採購申訴審議委員會名義提出書面調解建議；機關不同意該建議者，應先報請上級機關核定，並以書面向採購申訴審議委員會及廠商說明理由。"]},{"no":"85-4","label":"第85-4條","ch":"第六章爭議處理","cat":"r","lines":["履約爭議之調解，當事人不能合意但已甚接近者，採購申訴審議委員會應斟酌一切情形，並徵詢調解委員之意見，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，以職權提出調解方案。","當事人或參加調解之利害關係人對於前項方案，得於送達之次日起十日內，向採購申訴審議委員會提出異議。","於前項期間內提出異議者，視為調解不成立；其未於前項期間內提出異議者，視為已依該方案調解成立。","機關依前項規定提出異議者，準用前條第二項之規定。"]},{"no":"86","label":"第86條","ch":"第六章爭議處理","cat":"r","lines":["主管機關及直轄市、縣（市）政府為處理中央及地方機關採購之廠商申訴及機關與廠商間之履約爭議調解，分別設採購申訴審議委員會；置委員七人至三十五人，由主管機關及直轄市、縣（市）政府聘請具有法律或採購相關專門知識之公正人士擔任，其中三人並得由主管機關及直轄市、縣（市）政府高級人員派兼之。但派兼人數不得超過全體委員人數五分之一。","採購申訴審議委員會應公正行使職權。採購申訴審議委員會組織準則，由主管機關擬訂，報請行政院核定後發布之。"]},{"no":"87","label":"第87條","ch":"第七章罰則","cat":"s","lines":["意圖使廠商不為投標、違反其本意投標，或使得標廠商放棄得標、得標後轉包或分包，而施強暴、脅迫、藥劑或催眠術者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。","犯前項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣三百萬元以下罰金。","以詐術或其他非法之方法，使廠商無法投標或開標發生不正確結果者，處五年以下有期徒刑，得併科新臺幣一百萬元以下罰金。","意圖影響決標價格或獲取不當利益，而以契約、協議或其他方式之合意，使廠商不為投標或不為價格之競爭者，處六月以上五年以下有期徒刑，得併科新臺幣一百萬元以下罰金。","意圖影響採購結果或獲取不當利益，而借用他人名義或證件投標者，處三年以下有期徒刑，得併科新臺幣一百萬元以下罰金。容許他人借用本人名義或證件參加投標者，亦同。","第一項、第三項及第四項之未遂犯罰之。"]},{"no":"88","label":"第88條","ch":"第七章罰則","cat":"s","lines":["受機關委託提供採購規劃、設計、審查、監造、專案管理或代辦採購廠商之人員，意圖為私人不法之利益，對技術、工法、材料、設備或規格，為違反法令之限制或審查，因而獲得利益者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。其意圖為私人不法之利益，對廠商或分包廠商之資格為違反法令之限制或審查，因而獲得利益者，亦同。","前項之未遂犯罰之。"]},{"no":"89","label":"第89條","ch":"第七章罰則","cat":"s","lines":["受機關委託提供採購規劃、設計或專案管理或代辦採購廠商之人員，意圖為私人不法之利益，洩漏或交付關於採購應秘密之文書、圖畫、消息、物品或其他資訊，因而獲得利益者，處五年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金。","前項之未遂犯罰之。"]},{"no":"90","label":"第90條","ch":"第七章罰則","cat":"s","lines":["意圖使機關規劃、設計、承辦、監辦採購人員或受機關委託提供採購規劃、設計或專案管理或代辦採購廠商之人員，就與採購有關事項，不為決定或為違反其本意之決定，而施強暴、脅迫者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。","犯前項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣三百萬元以下罰金。","第一項之未遂犯罰之。"]},{"no":"91","label":"第91條","ch":"第七章罰則","cat":"s","lines":["意圖使機關規劃、設計、承辦、監辦採購人員或受機關委託提供採購規劃、設計或專案管理或代辦採購廠商之人員，洩漏或交付關於採購應秘密之文書、圖畫、消息、物品或其他資訊，而施強暴、脅迫者，處五年以下有期徒刑，得併科新臺幣一百萬元以下罰金。","犯前項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣三百萬元以下罰金。","第一項之未遂犯罰之。"]},{"no":"92","label":"第92條","ch":"第七章罰則","cat":"s","lines":["廠商之代表人、代理人、受雇人或其他從業人員，因執行業務犯本法之罪者，除依該條規定處罰其行為人外，對該廠商亦科以該條之罰金。"]},{"no":"93","label":"第93條","ch":"第八章附則","cat":"s","lines":["各機關得就具有共通需求特性之財物或勞務，與廠商簽訂共同供應契約。","共同供應契約之採購，其招標文件與契約應記載之事項、適用機關及其他相關事項之辦法，由主管機關另定之。"]},{"no":"93-1","label":"第93-1條","ch":"第八章附則","cat":"s","lines":["機關辦理採購，得以電子化方式為之，其電子化資料並視同正式文件，得免另備書面文件。","前項以電子化方式採購之招標、領標、投標、開標、決標及費用收支作業辦法，由主管機關定之。"]},{"no":"94","label":"第94條","ch":"第八章附則","cat":"s","lines":["機關辦理評選，應成立五人以上之評選委員會，專家學者人數不得少於三分之一，其名單由主管機關會同教育部、考選部及其他相關機關建議之。","前項所稱專家學者，不得為政府機關之現職人員。","評選委員會組織準則及審議規則，由主管機關定之。"]},{"no":"95","label":"第95條","ch":"第八章附則","cat":"s","lines":["機關辦理採購宜由採購專業人員為之。但一定金額之採購，應由採購專業人員為之。","前項採購專業人員之資格、考試、訓練、發證、管理辦法及一定金額，由主管機關會商相關機關定之。"]},{"no":"96","label":"第96條","ch":"第八章附則","cat":"s","lines":["機關得於招標文件中，規定優先採購取得政府認可之環境保護標章使用許可，而其效能相同或相似之產品，並得允許百分之十以下之價差。產品或其原料之製造、使用過程及廢棄物處理，符合再生材質、可回收、低污染或省能源者，亦同。","其他增加社會利益或減少社會成本，而效能相同或相似之產品，準用前項之規定。","前二項產品之種類、範圍及實施辦法，由主管機關會同行政院環境保護署及相關目的事業主管機關定之。"]},{"no":"97","label":"第97條","ch":"第八章附則","cat":"s","lines":["主管機關得參酌相關法令規定採取措施，扶助中小企業承包或分包一定金額比例以上之政府採購。","前項扶助辦法，由主管機關定之。"]},{"no":"98","label":"第98條","ch":"第八章附則","cat":"s","lines":["得標廠商其於國內員工總人數逾一百人者，應於履約期間僱用身心障礙者及原住民，人數不得低於總人數百分之二，僱用不足者，除應繳納代金，並不得僱用外籍勞工取代僱用不足額部分。"]},{"no":"99","label":"第99條","ch":"第八章附則","cat":"s","lines":["機關辦理政府規劃或核准之交通、能源、環保、旅遊等建設，經目的事業主管機關核准開放廠商投資興建、營運者，其甄選投資廠商之程序，除其他法律另有規定者外，適用本法之規定。"]},{"no":"100","label":"第100條","ch":"第八章附則","cat":"s","lines":["主管機關、上級機關及主計機關得隨時查核各機關採購進度、存貨或其使用狀況，亦得命其提出報告。","機關多餘不用之堪用財物，得無償讓與其他政府機關或公立學校。"]},{"no":"101","label":"第101條","ch":"第八章附則","cat":"s","lines":["機關辦理採購，發現廠商有下列情形之一，應將其事實、理由及依第一百零三條第一項所定期間通知廠商，並附記如未提出異議者，將刊登政府採購公報：","一、容許他人借用本人名義或證件參加投標者。","二、借用或冒用他人名義或證件投標者。","三、擅自減省工料，情節重大者。","四、以虛偽不實之文件投標、訂約或履約，情節重大者。","五、受停業處分期間仍參加投標者。","六、犯第八十七條至第九十二條之罪，經第一審為有罪判決者。","七、得標後無正當理由而不訂約者。","八、查驗或驗收不合格，情節重大者。","九、驗收後不履行保固責任，情節重大者。","十、因可歸責於廠商之事由，致延誤履約期限，情節重大者。","十一、違反第六十五條規定轉包者。","十二、因可歸責於廠商之事由，致解除或終止契約，情節重大者。","十三、破產程序中之廠商。","十四、歧視性別、原住民、身心障礙或弱勢團體人士，情節重大者。","十五、對採購有關人員行求、期約或交付不正利益者。","廠商之履約連帶保證廠商經機關通知履行連帶保證責任者，適用前項規定。","機關為第一項通知前，應給予廠商口頭或書面陳述意見之機會，機關並應成立採購工作及審查小組認定廠商是否該當第一項各款情形之一。","機關審酌第一項所定情節重大，應考量機關所受損害之輕重、廠商可歸責之程度、廠商之實際補救或賠償措施等情形。"]},{"no":"102","label":"第102條","ch":"第八章附則","cat":"s","lines":["廠商對於機關依前條所為之通知，認為違反本法或不實者，得於接獲通知之次日起二十日內，以書面向該機關提出異議。","廠商對前項異議之處理結果不服，或機關逾收受異議之次日起十五日內不為處理者，無論該案件是否逾公告金額，得於收受異議處理結果或期限屆滿之次日起十五日內，以書面向該管採購申訴審議委員會申訴。","機關依前條通知廠商後，廠商未於規定期限內提出異議或申訴，或經提出申訴結果不予受理或審議結果指明不違反本法或並無不實者，機關應即將廠商名稱及相關情形刊登政府採購公報。","第一項及第二項關於異議及申訴之處理，準用第六章之規定。"]},{"no":"103","label":"第103條","ch":"第八章附則","cat":"s","lines":["依前條第三項規定刊登於政府採購公報之廠商，於下列期間內，不得參加投標或作為決標對象或分包廠商：","一、有第一百零一條第一項第一款至第五款、第十五款情形或第六款判處有期徒刑者，自刊登之次日起三年。但經判決撤銷原處分或無罪確定者，應註銷之。","二、有第一百零一條第一項第十三款、第十四款情形或第六款判處拘役、罰金或緩刑者，自刊登之次日起一年。但經判決撤銷原處分或無罪確定者，應註銷之。","三、有第一百零一條第一項第七款至第十二款情形者，於通知日起前五年內未被任一機關刊登者，自刊登之次日起三個月；已被任一機關刊登一次者，自刊登之次日起六個月；已被任一機關刊登累計二次以上者，自刊登之次日起一年。但經判決撤銷原處分者，應註銷之。","機關因特殊需要，而有向前項廠商採購之必要，經上級機關核准者，不適用前項規定。","本法中華民國一百零八年四月三十日修正之條文施行前，已依第一百零一條第一項規定通知，但處分尚未確定者，適用修正後之規定。"]},{"no":"104","label":"第104條","ch":"第八章附則","cat":"s","lines":["軍事機關之採購，應依本法之規定辦理。但武器、彈藥、作戰物資或與國家安全或國防目的有關之採購，而有下列情形者，不在此限。","一、因應國家面臨戰爭、戰備動員或發生戰爭者，得不適用本法之規定。","二、機密或極機密之採購，得不適用第二十七條、第四十五條及第六十一條之規定。","三、確因時效緊急，有危及重大戰備任務之虞者，得不適用第二十六條、第二十八條及第三十六條之規定。","四、以議價方式辦理之採購，得不適用第二十六條第三項本文之規定。","前項採購之適用範圍及其處理辦法，由主管機關會同國防部定之，並送立法院審議。"]},{"no":"105","label":"第105條","ch":"第八章附則","cat":"s","lines":["機關辦理下列採購，得不適用本法招標、決標之規定。","一、國家遇有戰爭、天然災害、癘疫或財政經濟上有重大變故，需緊急處置之採購事項。","二、人民之生命、身體、健康、財產遭遇緊急危難，需緊急處置之採購事項。","三、公務機關間財物或勞務之取得，經雙方直屬上級機關核准者。","四、依條約或協定向國際組織、外國政府或其授權機構辦理之採購，其招標、決標另有特別規定者。","前項之採購，有另定處理辦法予以規範之必要者，其辦法由主管機關定之。"],"xc":["w"]},{"no":"106","label":"第106條","ch":"第八章附則","cat":"s","lines":["駐國外機構辦理或受託辦理之採購，因應駐在地國情或實地作業限制，且不違背我國締結之條約或協定者，得不適用下列各款規定。但第二款至第四款之事項，應於招標文件中明定其處理方式。","一、第二十七條刊登政府採購公報。","二、第三十條押標金及保證金。","三、第五十三條第一項及第五十四條第一項優先減價及比減價格規定。","四、第六章異議及申訴。","前項採購屬查核金額以上者，事後應敘明原由，檢附相關文件送上級機關備查。"],"xc":["w"]},{"no":"107","label":"第107條","ch":"第八章附則","cat":"s","lines":["機關辦理採購之文件，除依會計法或其他法律規定保存者外，應另備具一份，保存於主管機關指定之場所。"]},{"no":"108","label":"第108條","ch":"第八章附則","cat":"s","lines":["中央及直轄市、縣（市）政府應成立採購稽核小組，稽核監督採購事宜。","前項稽核小組之組織準則及作業規則，由主管機關擬訂，報請行政院核定後發布之。"],"xc":["z"]},{"no":"109","label":"第109條","ch":"第八章附則","cat":"s","lines":["機關辦理採購，審計機關得隨時稽察之。"]},{"no":"110","label":"第110條","ch":"第八章附則","cat":"s","lines":["主計官、審計官或檢察官就採購事件，得為機關提起訴訟、參加訴訟或上訴。"]},{"no":"111","label":"第111條","ch":"第八章附則","cat":"s","lines":["機關辦理巨額採購，應於使用期間內，逐年向主管機關提報使用情形及其效益分析。主管機關並得派員查核之。","主管機關每年應對已完成之重大採購事件，作出效益評估；除應秘密者外，應刊登於政府採購公報。"],"xc":["z"]},{"no":"112","label":"第112條","ch":"第八章附則","cat":"s","lines":["主管機關應訂定採購人員倫理準則。"],"xc":["z"]},{"no":"113","label":"第113條","ch":"第八章附則","cat":"s","lines":["本法施行細則，由主管機關定之。"]},{"no":"114","label":"第114條","ch":"第八章附則","cat":"s","lines":["本法自公布後一年施行。","本法修正條文（包括中華民國九十年一月十日修正公布之第七條）自公布日施行。"]}]},{"id":"A0030058","title":"政府採購法施行細則","short":"細則","date":"民國110年07月14日","kind":"施行細則","multi":true,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030058","articles":[{"no":"1","label":"第1條","ch":"第一章總則","cat":"g","lines":["本細則依政府採購法（以下簡稱本法）第一百十三條規定訂定之。"]},{"no":"2","label":"第2條","ch":"第一章總則","cat":"g","lines":["機關補助法人或團體辦理採購，其依本法第四條第一項規定適用本法者，受補助之法人或團體於辦理開標、比價、議價、決標及驗收時，應受該機關監督。","前項採購關於本法及本細則規定上級機關行使之事項，由本法第四條第一項所定監督機關為之。"]},{"no":"3","label":"第3條","ch":"第一章總則","cat":"g","lines":["本法第四條第一項所定補助金額，於二以上機關補助法人或團體辦理同一採購者，以其補助總金額計算之。補助總金額達本法第四條第一項規定者，受補助者應通知各補助機關，並由各補助機關共同或指定代表機關辦理監督。","本法第四條第一項所稱接受機關補助辦理採購，包括法人或團體接受機關獎助、捐助或以其他類似方式動支機關經費辦理之採購。","本法第四條第一項之採購，其受理申訴之採購申訴審議委員會，為受理補助機關自行辦理採購之申訴之採購申訴審議委員會；其有第一項之情形者，依指定代表機關或所占補助金額比率最高者認定之。"]},{"no":"4","label":"第4條","ch":"第一章總則","cat":"g","lines":["機關依本法第五條第一項規定委託法人或團體代辦採購，其委託屬勞務採購。受委託代辦採購之法人或團體，並須具備熟諳政府採購法令之人員。","代辦採購之法人、團體與其受雇人及關係企業，不得為該採購之投標廠商或分包廠商。"]},{"no":"5","label":"第5條","ch":"第一章總則","cat":"g","lines":["本法第九條第二項所稱上級機關，於公營事業或公立學校為其所隸屬之政府機關。","本法第九條第二項所稱辦理採購無上級機關者，在中央為國民大會、總統府、國家安全會議與五院及院屬各一級機關；在地方為直轄市、縣（市）政府及議會。"]},{"no":"5-1","label":"第5-1條","ch":"第一章總則","cat":"g","lines":["主管機關得視需要將本法第十條第二款之政府採購法令之解釋、第三款至第八款事項，委託其他機關辦理。"]},{"no":"6","label":"第6條","ch":"第一章總則","cat":"g","lines":["機關辦理採購，其屬巨額採購、查核金額以上之採購、公告金額以上之採購或小額採購，依採購金額於招標前認定之；其採購金額之計算方式如下：","一、採分批辦理採購者，依全部批數之預算總額認定之。","二、依本法第五十二條第一項第四款採複數決標者，依全部項目或數量之預算總額認定之。但項目之標的不同者，依個別項目之預算金額認定之。","三、招標文件含有選購或後續擴充項目者，應將預估選購或擴充項目所需金額計入。","四、採購項目之預算案尚未經立法程序者，應將預估需用金額計入。","五、採單價決標者，依預估採購所需金額認定之。","六、租期不確定者，以每月租金之四十八倍認定之。","七、依本法第九十九條規定甄選投資廠商者，以預估廠商興建、營運所需金額認定之。依本法第七條第三項規定營運管理之委託，包括廠商興建、營運金額者，亦同。","八、依本法第二十一條第一項規定建立合格廠商名單，其預先辦理廠商資格審查階段，以該名單有效期內預估採購總額認定之；邀請符合資格廠商投標階段，以邀請當次之採購預算金額認定之。","九、招標文件規定廠商報價金額包括機關支出及收入金額者，以支出所需金額認定之。","十、機關以提供財物或權利之使用為對價，而無其他支出者，以該財物或權利之使用價值認定之。"]},{"no":"7","label":"第7條","ch":"第一章總則","cat":"g","lines":["機關辦理查核金額以上採購之招標，應於等標期或截止收件日五日前檢送採購預算資料、招標文件及相關文件，報請上級機關派員監辦。","前項報請上級機關派員監辦之期限，於流標、廢標或取消招標重行招標時，得予縮短；其依前項規定應檢送之文件，得免重複檢送。"]},{"no":"8","label":"第8條","ch":"第一章總則","cat":"g","lines":["機關辦理查核金額以上採購之決標，其決標不與開標、比價或議價合併辦理者，應於預定決標日三日前，檢送審標結果，報請上級機關派員監辦。","前項決標與開標、比價或議價合併辦理者，應於決標前當場確認審標結果，並列入紀錄。"]},{"no":"9","label":"第9條","ch":"第一章總則","cat":"g","lines":["機關辦理查核金額以上採購之驗收，應於預定驗收日五日前，檢送結算表及相關文件，報請上級機關派員監辦。結算表及相關文件併入結算驗收證明書編送時，得免另行填送。","財物之驗收，其有分批交貨、因緊急需要必須立即使用或因逐一開箱或裝配完成後方知其數量，報請上級機關派員監辦確有困難者，得視個案實際情形，事先敘明理由，函請上級機關同意後自行辦理，並於全部驗收完成後一個月內，將結算表及相關文件彙總報請上級機關備查。"]},{"no":"10","label":"第10條","ch":"第一章總則","cat":"g","lines":["機關辦理查核金額以上採購之開標、比價、議價、決標或驗收，上級機關得斟酌其金額、地區或其他特殊情形，決定應否派員監辦。其未派員監辦者，應事先通知機關自行依法辦理。"]},{"no":"11","label":"第11條","ch":"第一章總則","cat":"g","lines":["本法第十二條第一項所稱監辦，指監辦人員實地監視或書面審核機關辦理開標、比價、議價、決標及驗收是否符合本法規定之程序。監辦人員採書面審核監辦者，應經機關首長或其授權人員核准。","前項監辦，不包括涉及廠商資格、規格、商業條款、底價訂定、決標條件及驗收方法等實質或技術事項之審查。監辦人員發現該等事項有違反法令情形者，仍得提出意見。","監辦人員對採購不符合本法規定程序而提出意見，辦理採購之主持人或主驗人如不接受，應納入紀錄，報機關首長或其授權人員決定之。但不接受上級機關監辦人員意見者，應報上級機關核准。"]},{"no":"12","label":"第12條","ch":"第一章總則","cat":"g","lines":["（刪除）"]},{"no":"13","label":"第13條","ch":"第一章總則","cat":"g","lines":["本法第十四條所定意圖規避本法適用之分批，不包括依不同標的、不同施工或供應地區、不同需求條件或不同行業廠商之專業項目所分別辦理者。","機關分批辦理公告金額以上之採購，法定預算書已標示分批辦理者，得免報經上級機關核准。"]},{"no":"14","label":"第14條","ch":"第一章總則","cat":"g","lines":["（刪除）"]},{"no":"15","label":"第15條","ch":"第一章總則","cat":"g","lines":["（刪除）"]},{"no":"16","label":"第16條","ch":"第一章總則","cat":"g","li
