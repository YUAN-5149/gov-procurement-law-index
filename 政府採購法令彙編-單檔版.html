,{"no":"6","label":"第6條","ch":"","cat":"d","lines":["採購案有下列情形之一且尚未解決者，機關首長或其授權人員不得為前條之核准：","一、廠商提出異議或申訴。","二、廠商申請調解、提付仲裁或提起訴訟。","三、經採購稽核小組或工程施工查核小組認定採購有重大異常情形。","承辦採購單位通知主（會）計及有關單位監辦時，有前項各款情形之一者，應予敘明。"]},{"no":"7","label":"第7條","ch":"","cat":"d","lines":["監辦人員於完成監辦後，應於紀錄簽名，並得於各相關人員均簽名後為之。無監辦者，紀錄應載明其符合本辦法第五條規定之特殊情形。","辦理採購之主持人或主驗人不接受監辦人員所提意見者，應納入紀錄，報機關首長或其授權人員決定之。但不接受上級機關監辦人員意見者，應報上級機關核准。","前項監辦，屬書面審核監辦者，紀錄應由各相關人員均簽名後再併同有關文件送監辦人員。","監辦人員辦理書面審核監辦，應於紀錄上載明「書面審核監辦」字樣。"]},{"no":"8","label":"第8條","ch":"","cat":"d","lines":["採購案之承辦人員不得為該採購案之監辦人員。"]},{"no":"9","label":"第9條","ch":"","cat":"d","lines":["本辦法自發布日施行。"]}]},{"id":"A0030066","title":"中央機關未達公告金額採購監辦辦法","short":"未達公告金額監辦辦法","date":"民國92年02月12日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030066","articles":[{"no":"1","label":"第1條","ch":"","cat":"d","lines":["本辦法依政府採購法（以下簡稱本法）第十三條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"d","lines":["機關辦理未達公告金額而逾公告金額十分之一之採購，承辦採購單位於開標、比價、議價、決標及驗收時，應通知機關首長或其授權人員指定之主（會）計或有關單位派員監辦。","前項有關單位，指機關內之政風、監查（察）、督察、檢核或稽核單位。"]},{"no":"3","label":"第3條","ch":"","cat":"d","lines":["主（會）計或有關單位對於前條通知，其有下列情形之一者，得不派員監辦：","一、地區偏遠。","二、經常性採購。","三、重複性採購，已有監辦前例。","四、採購標的於市場已普遍銷售。","五、依本法第四十條規定洽由其他具有專業能力之機關代辦。","六、利用本法第九十三條共同供應契約辦理之採購。","七、以會議審查方式辦理勞務採購驗收者。","八、以書面或電子化方式進行開標、比價、議價、決標及驗收程序，而以會簽主（會）計或有關單位方式處理者。","九、依公告、公定或管制價格或費率採購財物或勞務，無減價之可能者。","十、即買即用或自供應至使用之期間甚為短暫，實地監辦驗收有困難者。","十一、辦理分批或部分驗收，其驗收金額未逾公告金額十分之一者。","十二、經政府機關或公正第三人查驗，並有相關規格、品質、數量之證明文件供驗收者。","十三、因無廠商投標或投標廠商家數不足而流標者。","十四、因不可預見之突發事故，確無法監辦者。"]},{"no":"4","label":"第4條","ch":"","cat":"d","lines":["主（會）計或有關單位對於第二條通知，有下列情形之一者，不論是否有前條之情形，均應派員監辦：","一、廠商提出異議而機關未接受其異議者。","二、廠商申請調解、提付仲裁或提起訴訟尚未解決者。","三、經採購稽核小組或工程施工查核小組認定採購有重大異常情形者。","四、其他經主管機關認定者。","承辦採購單位通知主（會）計或有關單位監辦時，有前項各款情形之一者，應予敘明。"]},{"no":"5","label":"第5條","ch":"","cat":"d","lines":["機關辦理公告金額十分之一以下之採購，承辦採購單位於開標、比價、議價、決標及驗收時，得不通知主（會）計及有關單位派員監辦。其通知者，主（會）計及有關單位得不派員。"]},{"no":"6","label":"第6條","ch":"","cat":"d","lines":["主（會）計單位及有關單位依本辦法辦理監辦，準用機關主會計及有關單位會同監辦採購辦法第四條、第七條及第八條之規定。","監辦人員得採書面審核監辦，免經機關首長或其授權人員核准。"]},{"no":"7","label":"第7條","ch":"","cat":"d","lines":["本辦法自發布日施行。"]}]},{"id":"A0030082","title":"國內廠商標價優惠實施辦法","short":"標價優惠辦法","date":"民國88年05月24日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030082","articles":[{"no":"1","label":"第1條","ch":"","cat":"d","lines":["本辦法依政府採購法（以下簡稱本法）第四十四條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"d","lines":["本法第四十四條第一項所稱特定之採購，指機關辦理公告金額以上之採購，招標文件載明採購標的中屬於本法第四十四條第二項適用範圍之項目，並附記依同條第一項規定得以較高標價優先決標予國內廠商者。"]},{"no":"3","label":"第3條","ch":"","cat":"d","lines":["本法第四十四條第一項所稱外國廠商，指未取得我國國籍之自然人或依外國法律設立登記之法人、機構或團體。","允許廠商共同投標之特定採購，國內廠商與外國廠商共同投標，國內廠商符合第五條第三項規定者，該共同投標廠商得視同國內廠商。"]},{"no":"4","label":"第4條","ch":"","cat":"d","lines":["本法第四十四條第二項所稱適用範圍，指經主管機關會同相關目的事業主管機關擇定，並公告於政府採購公報之工程、財物或勞務項目。","前項公告，應一併載明優惠比率與優惠期限之起始日及截止日。","第一項經公告之工程、財物或勞務項目，擇定之機關應定期檢討。其於優惠期限截止日前有不符合我國所締結之條約或協定、國內產製加值未達百分之五十或不合於就業或產業發展政策者，由主管機關於政府採購公報公告註銷之。","機關將第一項公告項目納入招標文件，其於開標前有前項經公告註銷之情形者，應不予開標，於變更招標文件內容後再行招標。"]},{"no":"5","label":"第5條","ch":"","cat":"d","lines":["機關辦理特定採購，應於招標文件中載明招標標的得適用標價優惠之項目，並規定各投標廠商均應於投標文件內就該等項目載明其標價。","外國廠商為最低標，且其標價符合本法第五十二條第一項最低標之決標原則者，國內廠商得適用之標價優惠，以該外國廠商前項得適用標價優惠之項目之標價乘以優惠比率計算之。但國內廠商該等項目之標價未逾該外國廠商相同項目之標價者，不適用此一規定。","前項情形，國內廠商之財物，屬於招標文件所載適用範圍之項目，其國內產製加值須達該項價格之百分之五十；工程或勞務，須為國內供應。","第二項外國廠商標價以外國貨幣計者，依辦理決標前一辦公日臺灣銀行外匯交易收盤即期賣出匯率折算為新台幣後，以新台幣計算得適用之標價優惠金額。"]},{"no":"6","label":"第6條","ch":"","cat":"d","lines":["機關辦理特定採購，應於招標文件中規定欲適用本法第四十四條第一項優惠措施之國內廠商，其投標文件應記載標價內屬於招標文件所載標價優惠之項目、國內產製加值達百分之五十或供應之事實、數量及價格，以供審查。","前項國內產製加值達百分之五十或供應之事實，屬財物者，應證明確屬國內產製加值達百分之五十；屬工程或勞務者，應證明確屬國內供應。"]},{"no":"7","label":"第7條","ch":"","cat":"d","lines":["機關辦理特定採購，外國廠商為最低標，其標價符合本法第五十二條第一項最低標之決標原則，而國內廠商符合第五條第三項規定之最低標價逾該外國廠商標價之金額，在第五條第二項所定優惠金額以內者，決標予該國內廠商；逾優惠金額者，不予洽減，決標予該外國廠商。","依前項規定計算得優先決標予國內廠商之標價，於訂有底價之採購，不得逾本法第五十三條第二項規定之超底價上限；於未訂底價之採購，不得逾本法第五十四條評審委員會建議之金額。","前項決標價格，均不得逾預算金額。"]},{"no":"8","label":"第8條","ch":"","cat":"d","lines":["機關辦理特定採購，應於招標文件中規定以標價優惠得標之國內廠商，於履約期間應向機關提出與第六條有關之國內產製或供應證明文件，以供查核。","依前項規定決標予國內廠商之契約並應訂明得標廠商未依契約規定提供國內產製或供應項目者，機關得採行下列措施。","一、終止契約。","二、解除契約。","三、追償決標價高於外國廠商標價之損失。","四、不發還履約保證金。","五、依本法第七十二條第一項規定通知廠商限期改善、拆除、重作、退貨或換貨。","六、依本法第一百零一條規定辦理。","七、契約規定之其他措施。"]},{"no":"9","label":"第9條","ch":"","cat":"d","lines":["本辦法自中華民國八十八年五月二十七日施行。"]}]},{"id":"A0030106","title":"機關委託研究發展作業辦法","short":"研究發展作業辦法","date":"民國105年02月17日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030106","articles":[{"no":"1","label":"第1條","ch":"","cat":"d","lines":["本辦法依政府採購法（以下簡稱本法）第二十二條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"d","lines":["機關依本法第二十二條第一項第十三款辦理委託科技、技術引進、行政或學術研究發展（以下簡稱研究發展），費用在公告金額以上者，其作業依本辦法之規定。"]},{"no":"3","label":"第3條","ch":"","cat":"d","lines":["本法第二十二條第一項第十三款所稱在專業領域具領先地位之自然人，指符合下列情形之一者：","一、在相關專業領域之表現，曾獲國內外政府機關、學術機構或具有公信力之團體獎勵或表揚者。","二、在相關專業領域著有專書或研究報告，經機關認有特殊表現或貢獻者。","機關委託前項自然人辦理研究發展，應以該自然人為計畫主持人。"]},{"no":"4","label":"第4條","ch":"","cat":"d","lines":["本法第二十二條第一項第十三款所稱經公告審查優勝之學術或非營利機構（以下簡稱研究機構），指以公告方式公開徵求具備研發能力之研究機構，經機關成立之審查委員會審查為優勝者。","前項之公告，應公開於主管機關資訊網路。"]},{"no":"5","label":"第5條","ch":"","cat":"d","lines":["機關依前條規定辦理委託研究發展，應依實際需要訂定研究機構之基本資格或特定資格，不得不當限制競爭；並得規定公立或非營利之研究機構免繳驗納稅證明或加入工業或商業團體之基本資格證明文件。","前項委託，如無特殊需要，免收押標金、保證金。"]},{"no":"6","label":"第6條","ch":"","cat":"d","lines":["機關擇定自然人或研究機構後，應依下列規定辦理：","一、就研究目的擇定研究主題及範圍，通知自然人或研究機構提出計畫書供機關審查。","二、評審計畫應訂定審查項目，並得成立審查委員會。","三、審查結果不符合需要者，得不予接受或限期改正。","四、計畫書經審查通過後，再辦理議價。但機關招標文件已訂明固定服務費用或費率者，依該服務費用或費率決標。"]},{"no":"7","label":"第7條","ch":"","cat":"d","lines":["機關委託研究發展，得將其整體規劃、細部計畫及執行事項合併或分別辦理。其分別辦理者，得依本法第二十二條第一項第四款規定，將其細部計畫、執行事項作為前一階段採購之後續擴充。"]},{"no":"8","label":"第8條","ch":"","cat":"d","lines":["機關依本辦法成立審查委員會辦理審查者，準用採購評選委員會組織準則及審議規則之規定。","前項委員會辦理審查，得以會議或書面方式為之。"]},{"no":"9","label":"第9條","ch":"","cat":"d","lines":["機關委託未達公告金額之研究發展，得準用本辦法之規定。"]},{"no":"10","label":"第10條","ch":"","cat":"d","lines":["本辦法自發布日施行。"]}]},{"id":"A0030316","title":"機關委託社會福利服務廠商評選及計費辦法","short":"社福服務評選辦法","date":"民國108年11月22日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030316","articles":[{"no":"1","label":"第1條","ch":"","cat":"d","lines":["本辦法依政府採購法（以下簡稱本法）第二十二條第三項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"d","lines":["機關以公開客觀評選方式委託廠商提供社會福利服務，服務費用在公告金額以上者，其廠商評選與服務費用之計算方式，依本辦法之規定。"]},{"no":"3","label":"第3條","ch":"","cat":"d","lines":["本法第二十二條第一項第九款所定社會福利服務，包括兒童及少年福利、婦女福利、老人福利、身心障礙福利、家庭支持、社會救助、社會工作、志願服務、家庭暴力防治、性侵害防治、性騷擾防治、長期照顧業務、社區發展業務及其他與提供社會福利有關之服務。"]},{"no":"4","label":"第4條","ch":"","cat":"d","lines":["機關委託廠商辦理社會福利服務，除法令另有規定外，其招標文件得視個案特性及實際需要載明下列事項：","一、服務項目及工作範圍。","二、廠商之資格條件及應檢附之文件。","三、服務之提供方式與頻率。","四、服務時程。","五、提供服務工作人員之資格要件、人數及薪資。","六、涉及材料、設施、設備或場所之提供者，其規格、圖說或條件。","七、服務之工作範圍及內容明確者，其績效衡量指標、驗收項目及標準。","八、廠商應提出之社會福利服務建議書。其內容包括主要工作項目之時程、數量、價格、計畫內容等。","九、智慧財產權之歸屬。","十、場地、設施、設備、受贈財物之歸屬及維護權責。","十一、評審項目、評審標準及評選方式。","十二、與評選優勝廠商議價及決標之原則。","十三、計價及付款方式。","十四、投標須知及契約條款。","十五、廠商於評選時須提出簡報者，其進行方式。","十六、預算或預計金額。","十七、其他必要事項。","前項第五款人員之薪資，應於招標文件規定採固定價格決標或不得低於一定金額。但其他法令另有規定者，不在此限。"]},{"no":"5","label":"第5條","ch":"","cat":"d","lines":["前條第一項第十一款評審項目，除法令另有規定外，得視個案特性及實際需要載明下列事項：","一、廠商之專業人力、經驗或實績。","二、廠商提供服務之服務場地、設施、設備。","三、專案負責人及主要工作人員之經驗及能力。","四、服務提供方式。","五、履約能力。","六、價格。","七、建議書之完整性、可行性及對服務事項之瞭解程度。","八、其他必要事項。"]},{"no":"6","label":"第6條","ch":"","cat":"d","lines":["機關公開徵選廠商辦理社會福利服務之審查，其招標文件訂有廠商資格者，應先審查資格文件。資格不符合招標文件之規定者，其他部分不予審查。","機關評選結果應通知廠商，對未獲選者並應敘明其原因。"]},{"no":"7","label":"第7條","ch":"","cat":"d","lines":["採購評選委員會評選優勝廠商，得不以一家為限。","前項評選作業，準用本法有關最有利標之評選規定。"]},{"no":"8","label":"第8條","ch":"","cat":"d","lines":["機關與評選優勝廠商之議價及決標，應依下列方式辦理，並載明於招標文件：","一、優勝廠商為一家者，以議價方式辦理。","二、優勝廠商有二家以上者，依優勝序位，以議價方式辦理。有二家以上廠商為同一優勝序位者，擇配分最高之評選項目之得分合計值較高者，優先議價；如配分最高之評選項目有兩項以上者，以該等項目得分合計值較高者，優先議價。得分仍相同者，抽籤決定之。"]},{"no":"9","label":"第9條","ch":"","cat":"d","lines":["前條決標，應依下列規定辦理：","一、招標文件已訂明固定服務費用或費率者，依該服務費用或費率決標。","二、招標文件未訂明固定服務費用或費率者，其超底價決標或廢標適用本法第五十三條第二項及第五十四條之規定。","機關依本法第四十六條規定訂定前項第二款之底價時，議價廠商之報價合理且在預算金額以內者，機關依其報價訂定底價，照價決標。","招標文件已訂明固定服務費用或費率者，仍得訂明採部分項目依契約價金總額計算，部分項目依實際施作或供應之項目及數量計算。"]},{"no":"10","label":"第10條","ch":"","cat":"d","lines":["機關委託廠商辦理社會福利服務，其服務費用之計算，應視社會福利服務之類別、性質、規模、工作範圍及內容或工作期間等情形，就下列方式擇符合需要者訂明於契約：","一、總包價法或單價計算法。","二、按月、按日或按時計酬法。","依前項計算之服務費用，應參酌一般收費情形核實議定。但須核實另支費用者，應於契約內訂明項目及費用範圍。"]},{"no":"11","label":"第11條","ch":"","cat":"d","lines":["服務費用採總包價法或單價計算法得包括下列各款費用：","一、服務人員直接薪資：包括提供服務工作人員之實際薪資，另加實際薪資之一定比率作為工作人員不扣薪假與特別休假代理人員之薪資費用；非經常性給與之獎金；依法應由雇主負擔之勞工保險費、積欠工資墊償基金提繳費、全民健康保險費、勞工退休準備金、勞工退休金；加班費及其他相關費用。","二、業務費用：包括執行委辦案件工作所需之差旅費、臨時酬勞費、專家學者出席費、講座鐘點費、外聘督導費、訓練費、膳食費、交通費、場地及佈置費、印刷費、翻譯費、資料收集費、教材或材料費、撰稿費、智慧財產權使用費、辦公室費用、水電及冷暖氣費用、設施設備及傢俱等之新增、維護及汰換、動產及不動產之折舊或租金、郵電費、宣導費、參加國內外專業會議費用、研究費用或專業聯繫費用、專利費、電腦軟體及硬體費及有關之各項稅捐、依法需辦理之簽證費用、會計師簽證費用及其他相關費用。","三、服務場地規劃或修繕所需費用。","四、管理費用：包括廠商執行委辦案件工作時所需之管理費用，如非直接提供服務之管理及行政人員之薪資及退休金、保險費、行政事務費、準備及結束工作所需費用、利潤、風險及有關之稅捐及其他相關費用。","五、營業稅。","六、其他經機關認定之必要費用。","廠商履約結果符合契約約定者，機關憑廠商開立之發票或收據，依契約約定之價金給付服務費用。"]},{"no":"12","label":"第12條","ch":"","cat":"d","lines":["服務費用採按月、按日或按時計酬法，其薪資之計算如下；薪資以外之其他費用，可另行計算給付：","一、採按月計酬者，每月薪資可按契約所載工作人員月薪計算。","二、採按日計酬者，每日薪資可按契約所載工作人員日薪計算。","三、採按時計酬者，每時薪資可按契約所載工作人員時薪計算。"]},{"no":"13","label":"第13條","ch":"","cat":"d","lines":["第四條第二項之薪資固定價格，機關不得於議價時洽減。","廠商履約期間提供服務之各類工作人員資格條件或其薪資結構如有異動，應提出變更之價格組成，敘明其如期履約能力不低於契約所約定，供機關審查後，辦理契約變更。"]},{"no":"14","label":"第14條","ch":"","cat":"d","lines":["機關委託廠商辦理社會福利服務，由機關提供場地、設施、設備供廠商使用，並由廠商負責維修、保險者，應合理編列費用。","前項場地、設施或設備之維修、汰換或保險費用難以估計者，得由機關於契約載明核實給付、給付上限及逾上限時之處理，或以另案採購方式辦理。"]},{"no":"15","label":"第15條","ch":"","cat":"d","lines":["機關委託廠商辦理社會福利服務，得於招標文件規定得標廠商實際績效提高時，依其情形給付廠商獎勵金。","前項獎勵金給付總額，以不逾契約價金總額或契約價金上限百分之十為限。"]},{"no":"16","label":"第16條","ch":"","cat":"d","lines":["廠商之服務費用，得視個案特性及實際需要，於契約約定，訂約後預付部分費用，其餘按月或分期支付。但各次付款金額及條件應予訂明。","前項預付部分費用，以不逾契約總額或預估給付總額百分之三十為原則，並載明已付之預付款須返還之情形及未能返還之處理方式；履約期間逾一年者，契約總額或預估給付總額以各年金額計算。"]},{"no":"17","label":"第17條","ch":"","cat":"d","lines":["機關委託廠商辦理社會福利服務，其履約期間逾一年者，得於契約內訂明自第二年起得隨物價指數調整契約價金，並敘明其適用之物價指數、調整項目、調整方式及調整金額上限。"]},{"no":"18","label":"第18條","ch":"","cat":"d","lines":["機關委託廠商辦理社會福利服務，應於徵選文件規定得標廠商服務成果之智慧財產權歸屬，及侵害第三人合法權益時由廠商負責處理並承擔一切法律責任。","前項權利，機關得視需要取得部分或全部權利或取得授權。"]},{"no":"19","label":"第19條","ch":"","cat":"d","lines":["機關須變更部分委託服務內容時，得就服務事項或數量之增減情形，調整服務費用及工作期限。","機關要求廠商執行契約約定範圍外之工作事項，因此增加之服務費用由機關與廠商另行議定之。"]},{"no":"20","label":"第20條","ch":"","cat":"d","lines":["機關委託廠商辦理社會福利服務，非依本法第二十二條第一項第九款辦理者，得準用本辦法之規定。"]},{"no":"21","label":"第21條","ch":"","cat":"d","lines":["本辦法自發布日施行。"]}]},{"id":"A0030104","title":"機關邀請或委託文化藝術專業人士機構團體提供藝文服務作業辦法","short":"藝文服務作業辦法","date":"民國110年09月11日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030104","articles":[{"no":"1","label":"第1條","ch":"","cat":"d","lines":["本辦法依政府採購法（以下簡稱本法）第二十二條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"d","lines":["機關依本法第二十二條第一項第十四款邀請或委託具專業素養、特質或經公告審查優勝之文化、藝術專業人士、機構或團體表演、參與文藝活動或提供文化創意服務（以下簡稱藝文服務），費用在公告金額以上者，其作業依本辦法之規定。"]},{"no":"3","label":"第3條","ch":"","cat":"d","lines":["本法第二十二條第一項第十四款所稱文化、藝術專業人士、機構或團體（以下簡稱藝文業者），指經營、從事文化藝術獎助及促進條例第三條第二項所列各款事務之一，或係文化創意產業發展法第三條第一項所列各款產業之一，且具有相關專業知識、能力、造詣或技藝之自然人、法人、機構或團體。"]},{"no":"4","label":"第4條","ch":"","cat":"d","lines":["機關辦理藝文服務採購，符合下列情形之一者，得不經公告審查程序辦理：","一、敘明邀請或委託對象之名稱、具專業素養、特質之情形及不經公告審查程序逕行邀請或委託之理由，經機關首長或其授權人員核准。","二、駐國外機構依條約、協定，或同意書、盟約、瞭解備忘錄、換函、照會、議定書等辦理之文化交流活動及相關合作計畫，經機關首長或其授權人員核准。","巨額藝文服務採購不經公告審查程序辦理者，應由機關邀集機關人員二人及文化、藝術領域之專家學者七人開會審查，經三分之二以上人員出席，出席人員三分之二以上審查通過，簽報機關首長或其授權人員核准。"]},{"no":"5","label":"第5條","ch":"","cat":"d","lines":["機關為瞭解藝文業者之專業素養、特質等情形，得於政府採購公報或主管機關資訊網路，公開徵求藝文業者之相關資料，及提供藝文服務之費用。","藝文業者亦得向機關主動提供前項資料及相關費用，供機關邀請或委託之參考。"]},{"no":"6","label":"第6條","ch":"","cat":"d","lines":["機關辦理藝文服務採購，採公告審查程序者，應依下列規定辦理：","一、公告應刊登政府採購公報；其登載事項，準用政府採購公告及公報發行辦法第七條規定。","二、招標文件之內容，應考量藝文服務之採購特性及實際需要，必要時得諮詢藝文業者之意見。","三、招標文件應訂明審查項目、審查標準及評定優勝者之方式。","四、應成立審查委員會辦理審查；其成員由機關首長或其授權人員就對於文化藝術具有專門知識之機關職員或公正人士派兼或聘兼之。","五、審查委員會應由委員五人以上組成；其會議之決議應有委員總額二分之一以上出席，出席委員過半數之同意行之。","六、審查委員會之成立時機，準用本法第四十六條第二項有關底價之訂定時機。","七、前款審查委員會，機關得以本法第九十四條成立之評選委員會代之。","八、審查產生優勝者後，辦理議價及簽約事宜。","九、不訂定底價者，由審查委員會審查經費，並得提出建議金額。","前項公告結果，僅一藝文業者投標者，仍得進行審查。"]},{"no":"7","label":"第7條","ch":"","cat":"d","lines":["機關辦理藝文服務採購，其招標文件應載明之事項、審查項目、審查程序、優勝者家數、審查作業、議價及決標，準用機關委託專業服務廠商評選及計費辦法第四條至第九條之規定。"]},{"no":"8","label":"第8條","ch":"","cat":"d","lines":["機關辦理藝文服務採購，其服務費用及智慧財產權之處理，準用機關委託專業服務廠商評選及計費辦法第十條至第十八條之規定。"]},{"no":"9","label":"第9條","ch":"","cat":"d","lines":["機關辦理藝文服務採購，以免收押標金、保證金為原則。"]},{"no":"10","label":"第10條","ch":"","cat":"d","lines":["機關辦理未達公告金額之藝文服務採購，非依本法第二十二條第一項第十四款辦理者，得準用本辦法之規定。"]},{"no":"11","label":"第11條","ch":"","cat":"d","lines":["本辦法自發布日施行。"]}]},{"id":"A0030073","title":"機關辦理設計競賽廠商評選及計費辦法","short":"設計競賽評選辦法","date":"民國114年05月23日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030073","articles":[{"no":"1","label":"第1條","ch":"","cat":"d","lines":["本辦法依政府採購法（以下簡稱本法）第二十二條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"d","lines":["機關以公告程序辦理設計競賽在公告金額以上者，其廠商評選與服務費用之計算方式依本辦法之規定。"]},{"no":"3","label":"第3條","ch":"","cat":"d","lines":["本法第二十二條第一項第十款所稱設計競賽，指機關為採購之目的，徵求廠商發揮創意，為聲音、影像、文字、圖畫或實物等之設計，並依其完整性、可行性、理念性、藝術性或實用性等特性，擇定優勝作品及廠商之程序。","前項設計競賽之標的，包括藝術品、圖形、標誌、徽章、標章、資訊網頁、名稱、標語、廣告、海報、文宣、推廣活動、服裝、字幕、音樂、影像、牌樓、空間或場所布置、造形、造景、裝修、裝潢及其他與發揮創意有關者。"]},{"no":"4","label":"第4條","ch":"","cat":"d","lines":["機關以公告程序辦理設計競賽，得依下列方式之一辦理：","一、公開徵求廠商提出設計作品供評選。","二、公開徵求廠商提出設計作品及設計說明書供評選。","三、公開徵求廠商提出設計建議書，經評選入選者再邀其提出設計作品供評選。"]},{"no":"5","label":"第5條","ch":"","cat":"d","lines":["機關以公告程序辦理設計競賽，除法令另有規定外，其招標文件得視個案特性及實際需要載明下列事項：","一、設計作品之用途及應表現之理念。","二、設計準則。","三、設計之表現方式。如樣品、模型、透視圖或顏色等。","四、設計之比例尺、大小尺寸、圖說張數及裱裝方式等。","五、設計涉及材料、設備、場所或成品之供應者，其規格。","六、廠商應提出之設計說明書或建議書及其設計作品、設計理念、圖說、製作方法、工作時程、數量、價格、說明或計畫內容、章節次序或頁數限制等。","七、每一廠商提出設計說明書或建議書及設計作品之件數限制。","八、收受設計說明書或建議書及設計作品之地點及截止期限。","九、評審項目、評審標準及評選方式。","十、與評選優勝廠商議價及決標原則。","十一、給予設計競賽之優勝者獎勵者，其方式。","十二、給予設計競賽未獲選者獎勵者，其名額及方式。","十三、對於優勝者之設計之智慧財產權歸屬約定、使用條件、範圍或修改等權利。對於其他獲得獎勵之設計有必要併予規定者，亦同。","十四、對於未獲選者之設計作品之處理。","十五、有舉辦公開說明會者，其時間及地點。","十六、廠商於評選時須提出簡報者，其進行方式。","十七、其他必要事項。"]},{"no":"6","label":"第6條","ch":"","cat":"d","lines":["設計競賽優勝者須於獲選後製作成品者，其招標文件得視個案特性及實際需要載明下列事項：","一、有製作或裝置地點者，其現況說明及完成狀態。","二、完成製作期限。","三、預算金額或製作費用上限。","四、其他必要事項。"]},{"no":"7","label":"第7條","ch":"","cat":"d","lines":["第五條第九款評審項目，除法令另有規定者外，得視個案特性及實際需要載明下列事項：","一、設計說明書或建議書之完整性及可行性。","二、對設計作品之用途及所須達成之目標或成果之瞭解程度。","三、設計作品符合機關理念之程度。","四、設計作品之藝術性。","五、工作計畫及預定進度。","六、計畫主持人及主要工作人員之經驗及能力。","七、如期履約能力。","八、完成作品另需製作費用者，其製作費用。","九、其他必要事項。"]},{"no":"8","label":"第8條","ch":"","cat":"d","lines":["機關辦理設計競賽之評選，其招標文件訂有廠商資格者，應先審查資格文件。資格不合於招標文件之規定者，其他部分不予審查。","機關評選結果應通知廠商，對未獲選者並應敘明其原因。"]},{"no":"9","label":"第9條","ch":"","cat":"d","lines":["採購評選委員會評選優勝廠商，得不以一家為限。","前項評選作業，準用本法有關最有利標之評選規定。"]},{"no":"10","label":"第10條","ch":"","cat":"d","lines":["機關與評選優勝廠商之議價，應依下列方式辦理，並載明於招標文件：","一、優勝廠商為一家者，以議價方式辦理。","二、優勝廠商有二家以上者，依優勝順序，自最優勝者起，依序以議價方式辦理。但有二家以上廠商為同一優勝順序者，擇配分最高之評選項目之得分合計值較高者，優先議價；如配分最高之評選項目有兩項以上者，以該等項目得分合計值較高者，優先議價；得分仍相同者，就該等廠商再進行綜合評選一次，以總評分最高、價格與總評分之商數最低或序位合計值最低者，優先議價；其再次相同者，抽籤決定之。"]},{"no":"11","label":"第11條","ch":"","cat":"d","lines":["機關依前條辦理議價之決標，應依下列規定之一辦理：","一、招標文件已訂明固定服務費用或費率者，依該服務費用或費率決標。","二、招標文件未訂明固定服務費用或費率者，其超底價決標或廢標適用本法第五十三條第二項及第五十四條之規定。","機關訂定前項第二款之底價，適用本法第四十六條規定。議價廠商之報價合理且在預算金額以內者，機關得依其報價訂定底價，照價決標。"]},{"no":"12","label":"第12條","ch":"","cat":"d","lines":["設計成果之製作費用，以採總包價法為原則。但屬得標廠商代收及代付之費用，得核實給付。"]},{"no":"13","label":"第13條","ch":"","cat":"d","lines":["設計競賽優勝者須於獲選後提供製作成品服務者，機關得於招標文件規定得標廠商服務費用降低或實際績效提高時，得依其情形給付廠商獎勵性報酬。","前項獎勵性報酬之給付方式如下，由機關於招標文件中訂明：","一、屬服務費用降低者，為所減省之契約價金之一定比率。","二、屬實際績效提高者，依契約所載計算方式給付。","前項第一款一定比率，以不逾百分之五十為原則；第二款給付金額，以不逾契約價金總額或契約價金上限之百分之十為原則。"]},{"no":"14","label":"第14條","ch":"","cat":"d","lines":["廠商之服務費用，得於契約規定於訂約後預付一部分，其餘按月或分期支付。但各次付款金額及條件應予訂明。","前項預付一部分者，以不逾契約價金總額或契約價金上限之百分之三十為原則。"]},{"no":"15","label":"第15條","ch":"","cat":"d","lines":["廠商之設計，依規定應由建築師、專業技師或消防設備師等專業人員簽證者，該項工作應由該等專業人員負責執行，並應依相關規定辦理簽證。"]},{"no":"16","label":"第16條","ch":"","cat":"d","lines":["機關辦理設計競賽，應於招標文件規定廠商之設計，其智慧財產權歸屬及侵害第三人合法權益時由廠商負責處理並承擔一切法律責任。","前項權利，機關得視需要取得部分或全部權利或取得授權。"]},{"no":"17","label":"第17條","ch":"","cat":"d","lines":["機關辦理設計競賽，非依本法第二十二條第一項第十款辦理者，得準用本辦法之規定。"]},{"no":"18","label":"第18條","ch":"","cat":"d","lines":["本辦法自中華民國八十八年五月二十七日施行。","本辦法修正條文自發布日施行。"]}]},{"id":"A0030102","title":"採購評選委員會審議規則","short":"評選會審議規則","date":"民國110年11月04日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030102","articles":[{"no":"1","label":"第1條","ch":"","cat":"d","lines":["本規則依政府採購法（以下簡稱本法）第九十四條第三項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"d","lines":["採購評選委員會（以下簡稱本委員會）得視案件性質，由召集人或委員會議決定每位委員之分工及應評選之項目。"]},{"no":"3","label":"第3條","ch":"","cat":"d","lines":["機關成立之工作小組應依據評選項目或本委員會指定之項目，就受評廠商資料擬具初審意見，載明下列事項，連同廠商資料送本委員會供評選參考：","一、採購案名稱。","二、工作小組人員姓名、職稱及專長。","三、受評廠商於各評選項目所報內容是否具可行性，並符合招標文件所定之目的、功能、需求、特性、標準、經費及期程等。","四、受評廠商於各評選項目之差異性。"]},{"no":"3-1","label":"第3-1條","ch":"","cat":"d","lines":["本委員會辦理廠商評選，應就各評選項目、受評廠商資料及工作小組初審意見，逐項討論後為之。","本委員會或個別委員評選結果與工作小組初審意見有異時，應由本委員會或該個別委員敘明理由，並列入會議紀錄。"]},{"no":"4","label":"第4條","ch":"","cat":"d","lines":["（刪除）"]},{"no":"5","label":"第5條","ch":"","cat":"d","lines":["本委員會於作成決議前得指定委員就工作小組所擬具之初審意見內容預先審查，其審查意見應送本委員會參考。","委員認有調查或實地勘驗之必要時，得經本委員會決議後實施調查或勘驗。"]},{"no":"6","label":"第6條","ch":"","cat":"d","lines":["委員應公正辦理評選。評選及出席會議，應親自為之，不得代理，且應參與評分（比）。","不同委員之評選結果有明顯差異時，召集人應提交本委員會議決或依本委員會決議辦理複評。複評結果仍有明顯差異時，由本委員會決議之。","本委員會依前項規定，得作成下列議決或決議：","一、維持原評選結果。","二、除去個別委員評選結果，重計評選結果。","三、廢棄原評選結果，重行提出評選結果。","四、無法評定最有利標。"]},{"no":"6-1","label":"第6-1條","ch":"","cat":"d","lines":["委員辦理評選，應於機關備具之評分（比）表逐項載明各受評廠商之評分或序位，並簽名或蓋章。","機關於委員評選後，應彙整製作總表，載明下列事項，由參與評選全體委員簽名或蓋章。其內容有修正者，應經修正人員簽名或蓋章：","一、採購案。","二、各受評廠商名稱及標價。","三、本委員會全部委員姓名、職業、評選優勝廠商或評定最有利標會議之出席委員姓名。","四、各出席委員對於各受評廠商之評分或序位評比結果。","五、全部出席委員對各受評廠商之總評選結果。","前項總表，應附記下列事項：","一、出席委員是否依第三條之一第一項規定辦理。","二、本委員會或個別委員評選結果與工作小組初審意見有無差異及其處置方式。","三、不同出席委員評選結果有無明顯差異及其處置方式。","第二項第四款，各受評廠商之評分或序位評比結果，其所標示之各出席委員姓名，得以代號代之。"]},{"no":"7","label":"第7條","ch":"","cat":"d","lines":["工作小組擬具初審意見及本委員會審查、議決等評選作業，以記名方式秘密為之為原則。","評選結果應通知投標廠商，對不合格或未獲選之廠商，並應敘明其原因。"]},{"no":"8","label":"第8條","ch":"","cat":"d","lines":["本委員會或工作小組辦理評選，其於通知廠商說明、減價、協商、更改原報內容或重新報價時，應個別洽廠商為之，並予保密。"]},{"no":"9","label":"第9條","ch":"","cat":"d","lines":["本委員會會議，應有委員總額二分之一以上出席，其決議應經出席委員過半數之同意行之。出席委員中之專家、學者人數應至少二人且不得少於出席人數之三分之一。","本委員會委員有第十四條情形或其他原因未能繼續擔任委員，致委員總額或專家、學者人數未達本法第九十四條第一項關於人數之規定者，應另行遴選委員補足之。","第一項會議表決時，主席得命本委員會以外之人員退席。但不包括應全程出席之承辦人員。","第一項會議，應作成紀錄，由出席委員全體簽名。"]},{"no":"10","label":"第10條","ch":"","cat":"d","lines":["本委員會會議進行中，出席委員人數不符合前條第一項規定者，議案不得提付表決。"]},{"no":"11","label":"第11條","ch":"","cat":"d","lines":["本委員會會議紀錄，應記載下列事項：","一、採購案名稱。","二、會議次別。","三、會議時間。","四、會議地點。","五、主席姓名。","六、出席及請假委員姓名。","七、列席人員姓名。","八、記錄人員姓名。","九、報告事項之案由及決定。","十、討論事項之案由及決議。","十一、臨時動議之案由及決議。","十二、其他應行記載之事項。","前項會議紀錄至遲應於下次開會時分送各出席委員，並予確認。如有遺漏或錯誤，得於紀錄宣讀後，提請主席裁定更正。最後一次會議紀錄應於當次會議結束前作成並予確認。"]},{"no":"12","label":"第12條","ch":"","cat":"d","lines":["本委員會委員對於會議之決議有不同意見者，得要求將不同意見載入會議紀錄或將意見書附於會議紀錄，以備查考。本委員會不得拒絕。"]},{"no":"13","label":"第13條","ch":"","cat":"d","lines":["本委員會委員及參與評選工作之人員對於受評廠商之資料，除供公務上使用或法令另有規定外，應保守秘密。評選後亦同。","得標廠商受評選之樣品或模型，機關得於決標後公開；未得標廠商之樣品或模型，機關得於決標後發還。"]},{"no":"14","label":"第14條","ch":"","cat":"d","lines":["本委員會委員有下列情形之一者，應即辭職或予以解聘：","一、就案件涉及本人、配偶、二親等以內親屬，或共同生活家屬之利益。","二、本人或其配偶與受評選之廠商或其負責人間現有或三年內曾有僱傭、委任或代理關係。","三、委員認為本人或機關認其有不能公正執行職務之虞。","四、有其他情形足使受評選之廠商認其有不能公正執行職務之虞，經受評選之廠商以書面敘明理由，向機關提出，經本委員會作成決定。"]},{"no":"14-1","label":"第14-1條","ch":"","cat":"d","lines":["本委員會委員自接獲評選有關資料之時起，不得就該採購案參加投標、作為投標廠商之分包廠商或擔任工作成員；其有違反者，機關應不決標予該廠商。","本委員會委員於所評採購個案決標後，不得擔任得標廠商該案之履約工作成員，或協助履約。","得標廠商不得委任或聘任本委員會委員為前項之工作；其有違反者，機關得終止或解除該採購契約。"]},{"no":"15","label":"第15條","ch":"","cat":"d","lines":["關於本委員會評選廠商之文書，應由承辦人員就每一採購案分別編訂卷宗。"]},{"no":"16","label":"第16條","ch":"","cat":"d","lines":["本規則自中華民國八十八年五月二十七日施行。","本規則修正條文自發布日施行。"]}]},{"id":"A0030103","title":"採購評選委員會組織準則","short":"評選會組織準則","date":"民國115年05月08日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030103","articles":[{"no":"1","label":"第1條","ch":"","cat":"d","lines":["本準則依政府採購法（以下簡稱本法）第九十四條第三項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"d","lines":["機關為辦理下列事項，應就各該採購案成立採購評選委員會（以下簡稱本委員會）：","一、本法第二十二條第一項第九款或第十款規定之評選優勝者。","二、本法第五十六條規定之評定最有利標或向機關首長建議最有利標。"]},{"no":"3","label":"第3條","ch":"","cat":"d","lines":["本委員會應於招標前成立，並於完成評選事宜且無待處理事項後解散，其任務如下：","一、訂定或審定招標文件之評選項目、評審標準及評定方式。","二、辦理廠商評選。","三、協助機關解釋與評審標準、評選過程或評選結果有關之事項。","前項第一款之評選項目、評審標準及評定方式有前例或條件簡單者，得由機關自行訂定或審定，免於招標前成立本委員會為之。但本委員會仍應於開標前成立。"]},{"no":"4","label":"第4條","ch":"","cat":"d","lines":["本委員會置委員五人以上，由機關就具有與採購案相關專門知識之人員派兼或聘兼之，其中專家、學者人數不得少於三分之一。","前項專家、學者之委員，不得為政府機關之現職人員；專家、學者以外之委員，得為機關之現職人員，並得包括其他機關之現職人員。","第一項人員為無給職；聘請國外專家或學者來臺參與評選者，得依規定支付相關費用。","第一項專家、學者，由機關需求或承辦採購單位參考主管機關會同教育部、考選部及其他相關機關所建立之建議名單，或自行提出建議名單以外，具有與採購案相關專門知識之人員，簽報機關首長或其授權人員核定。","前項建議名單，由主管機關公開於資訊網路，供機關參考。","機關擬聘兼之委員，應經其同意。"]},{"no":"4-1","label":"第4-1條","ch":"","cat":"d","lines":["機關遴選本委員會委員，不得有下列情形：","一、接受請託或關說。","二、接受舉薦自己為委員者。","三、為特定廠商利益而為遴選。","四、遴選不具有與採購案相關專門知識者。","五、明知操守不正而仍為遴選。","六、遴選現任各級民意機關民意代表。但各級民意機關辦理採購時，不在此限。","七、其他經主管機關認定者。","前項第六款所稱各級民意機關民意代表，指立法院立法委員、直轄市議會議員、縣（市）議會議員、鄉（鎮、市）民代表會代表及直轄市山地原住民區民代表會代表。"]},{"no":"5","label":"第5條","ch":"","cat":"d","lines":["有下列各款情形之一者，不得受遴選及擔任本委員會委員：","一、犯貪污或瀆職之罪或辦理政府採購業務涉不法行為，經有罪判決。但經判決無罪確定者，不在此限。","二、辦理政府採購業務違反法令或有採購人員倫理準則第七條各款情形之一，而受免除職務、撤職、剝奪、減少退休（職、伍）金、休職、降級、減俸、罰款、記過懲戒處分之判決。但原判決經廢棄更為判決確定，致無上述情形者，不在此限。","三、褫奪公權尚未復權。","四、專門職業人員已受停止執行業務或撤銷、廢止執業執照之處分。","五、本人或其擔任負責人之廠商經機關依本法第一百零二條第三項規定刊登政府採購公報期間。","六、受監護或輔助宣告，尚未撤銷。","七、受破產宣告確定或依消費者債務清理條例裁定開始清算程序，尚未復權。"]},{"no":"6","label":"第6條","ch":"","cat":"d","lines":["本委員會成立後，其委員名單應即公開於主管機關指定之資訊網站；委員名單有變更或補充者，亦同。但經機關衡酌個案特性及實際需要，有不予公開之必要者，不在此限。","機關公開委員名單者，公開前應予保密；未公開者，於開始評選前應予保密。"]},{"no":"7","label":"第7條","ch":"","cat":"d","lines":["本委員會置召集人一人，由機關首長擔任，或由機關首長或其授權人員指定一級主管以上人員擔任；其非由機關首長擔任者，機關首長仍應對評選結果負責。","本委員會置副召集人一人，由機關首長或其授權人員指定機關內部人員擔任。","召集人綜理評選事宜，副召集人襄助召集人處理評選事宜，並均為委員。","本委員會會議，由召集人召集之，並為主席；召集人未能出席或因故出缺時，由副召集人代理之。召集人及副召集人均不能出席會議者，應擇期另行召開會議。"]},{"no":"8","label":"第8條","ch":"","cat":"d","lines":["機關應於本委員會成立時，一併成立三人以上之工作小組，協助本委員會辦理與評選有關之作業，其成員由機關首長或其授權人員指定機關人員或專業人士擔任，且至少應有一人具有採購專業人員資格。","本委員會開會時，機關辦理評選作業之承辦人員應全程出席，並得邀請有關機關人員、學者或專家列席，協助評選。","前二項協助評選人員，均為無給職。","第一項及第二項協助評選人員之迴避，準用採購評選委員會審議規則第十四條規定。"]},{"no":"9","label":"第9條","ch":"","cat":"d","lines":["本委員會如有對外行文之需要，應以成立機關名義行之。"]},{"no":"10","label":"第10條","ch":"","cat":"d","lines":["本準則自中華民國八十八年五月二十七日施行。","本準則修正條文自發布日施行。"]}]},{"id":"A0030078","title":"機關委託資訊服務廠商評選及計費辦法","short":"資訊服務評選辦法","date":"民國114年05月23日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030078","articles":[{"no":"1","label":"第1條","ch":"","cat":"d","lines":["本辦法依政府採購法（以下簡稱本法）第二十二條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"d","lines":["機關以公開客觀評選方式委託廠商提供資訊服務，服務費用在公告金額以上者，其廠商評選與服務費用之計算方式，依本辦法之規定。"]},{"no":"3","label":"第3條","ch":"","cat":"d","lines":["本法第二十二條第一項第九款所稱資訊服務，指提供與電腦軟體或硬體有關之服務；包括整體規劃、系統整合、系統稽核、系統管理、網路管理、軟體開發、軟體驗證、軟體維護、硬體維護、硬體操作、機房設施管理、備援服務、網路服務、顧問諮詢、資料庫建置、資料處理、資料登錄或訓練推廣等服務。"]},{"no":"4","label":"第4條","ch":"","cat":"d","lines":["機關辦理重大新興資訊業務或重大設備汰舊換新，得以整體委外服務方式，委託廠商提供電腦軟硬體、通信設施、人力及技術等之整體性資訊服務。"]},{"no":"5","label":"第5條","ch":"","cat":"d","lines":["機關委託廠商承辦資訊服務，除法令另有規定者外，其招標文件得視個案特性及實際需要載明下列事項：","一、服務之項目及工作範圍。","二、廠商所應具備之電腦軟硬體、通信設施、資訊人力、經驗或實績等資格或資源及應檢附之文件。","三、機關現有資訊作業環境及相關電腦軟硬體或通信設施。","四、工作時程。","五、涉及材料、設備或成品之供應者，其規格。","六、驗收項目及標準。","七、計價及付款方式。","八、廠商應提出資訊服務建議書之內容。如主要工作項目之時程、數量、價格、計畫內容、章節次序或頁數限制等。","九、智慧財產權之歸屬。","十、廠商於評選時須提出簡報者，其進行方式。","十一、評審項目、評審標準及評選方式。","十二、與評選優勝廠商議價及決標原則。","十三、其他必要事項。"]},{"no":"6","label":"第6條","ch":"","cat":"d","lines":["機關委託廠商承辦資訊服務採整體委外服務者，應審度業務需求，確立整體委外服務水準，並視個案特性及實際需要，於招標文件除載明前條所列事項外，應另行載明下列事項：","一、機關組織職掌及施政目標。","二、整體委外服務目標。","三、整體委外服務項目及範圍。","四、整體委外時程及契約期間。","五、整體委外服務需求：","（一）資訊及通信需求。","（二）作業功能需求。","（三）資訊安全及機密維護需求。","（四）變更處理需求。","（五）稽核作業需求。","（六）品質保證需求。","（七）其他重要需求事項。","六、整體委外作業服務水準：","（一）資訊系統運作服務水準。","（二）電腦軟硬體及通信設施維護服務水準。","（三）系統整體服務水準。","（四）變更服務水準。","（五）其他資訊作業服務水準。","七、整體委外服務提供方式。","八、績效衡量指標。","九、機關現有資訊作業環境及電腦軟硬體、通信設施及資訊人力等各項資源。","十、機關資訊人員轉任與權益保障。","十一、過渡作業計畫。","十二、廠商應提出資訊服務建議書之內容。如專業技術、服務水準、服務提供方式、機關資訊人員轉任及權益保障、專案組織及管理、財務安排、過渡作業計畫、計費方法、主要工作項目之時程、數量、價格、計畫內容、系統潛伏問題之處理、章節次序或頁數限制等。","十三、其他必要事項。","前項第四款整體委外時程及契約期間，最長不得逾十年。","第一項第五款第四目變更處理需求，應含因政策或法規之變更或資訊科技之進展，而需變更服務內容或項目時之處理方式及計費原則。","第一項第九款之機關現有電腦軟硬體及通信設施，其所有權將移轉予得標廠商者，前條第八款之價格應分別載明該現有電腦軟硬體及通信設施之折價及契約期間之費用後綜合計算。"]},{"no":"7","label":"第7條","ch":"","cat":"d","lines":["第五條第十一款評審項目，除法令另有規定者外，得視個案特性及實際需要載明下列事項：","一、廠商所具備或提供之電腦軟硬體、通信設施、資訊人力、經驗或實績等資源或資格。","二、廠商之專業技術能力。","三、廠商之品質保證能力。","四、計畫主持人及主要工作人員之經驗及能力。","五、廠商之資訊安全及機密維護能力。","六、如期履約能力。","七、廠商之支援及維護能力。","八、價格。","九、教育訓練之提供。","十、計畫執行方式。","十一、建議書之完整性、可行性及對服務事項之瞭解程度。","十二、其他必要事項。","機關採購軟體開發服務，前項第二款所定廠商之專業技術能力，得包括在零成本或低成本之前提下，提供可自由存取、使用、修改及散布之共通性應用程式介面開發或整合能力。"]},{"no":"8","label":"第8條","ch":"","cat":"d","lines":["第五條第十一款評審項目，於資訊整體委外服務，除前條及法令另有規定者外，得視個案特性及實際需要於招標文件載明下列事項：","一、廠商之人力資源規劃與運用計畫。","二、廠商之專案計畫管理能力。","三、廠商之財務能力。","四、廠商過渡作業之計畫管理能力。","五、重大附加效益。","六、廠商誠信履約之風險評估。"]},{"no":"9","label":"第9條","ch":"","cat":"d","lines":["機關公開徵選廠商承辦資訊服務之評選，其招標文件訂有廠商資格者，應先審查資格文件。資格不合於招標文件之規定者，其他部分不予審查。","機關評選結果應通知廠商，對未獲選者並應敘明其原因。"]},{"no":"10","label":"第10條","ch":"","cat":"d","lines":["採購評選委員會評選優勝廠商，得不以一家為限。","前項評選作業，準用本法有關最有利標之評選規定。"]},{"no":"11","label":"第11條","ch":"","cat":"d","lines":["機關與評選優勝廠商之議價，應依下列方式辦理，並載明於招標文件：","一、優勝廠商為一家者，以議價方式辦理。","二、優勝廠商有二家以上者，依優勝順序，自最優勝者起，依序以議價方式辦理。但有二家以上廠商為同一優勝順序者，擇配分最高之評選項目之得分合計值較高者，優先議價；如配分最高之評選項目有兩項以上者，以該等項目得分合計值較高者，優先議價；得分仍相同者，就該等廠商再進行綜合評選一次，以總評分最高、價格與總評分之商數最低或序位合計值最低者，優先議價；其再次相同者，抽籤決定之。"]},{"no":"12","label":"第12條","ch":"","cat":"d","lines":["機關依前條辦理議價之決標，應依下列規定之一辦理：","一、招標文件已訂明固定服務費用或費率者，依該服務費用或費率決標。","二、招標文件未訂明固定服務費用或費率者，其超底價決標或廢標適用本法第五十三條第二項及第五十四條之規定。","機關訂定前項第二款之底價，適用本法第四十六條規定。議價廠商之報價合理且在預算金額以內者，機關得依其報價訂定底價，照價決標。"]},{"no":"13","label":"第13條","ch":"","cat":"d","lines":["機關委託廠商承辦資訊服務，其服務費用之計算，應視資訊服務類別、性質、規模、工作範圍及工作期限，就下列方式擇符合需要者訂明於契約：","一、總包價法或單價計算法。","二、按月、按日或按時計酬法。","三、服務成本加公費法。","依前項計算之服務費用，應參酌一般收費情形核實議定。其必須核實另支費用者，應於契約內訂明項目及費用範圍；契約未規定者，不得另為任何給付。"]},{"no":"14","label":"第14條","ch":"","cat":"d","lines":["總包價或單價計算法，適用於工作範圍及內容明確，服務費用之總價可以正確估計或可按服務項目之單價計算其總價者。"]},{"no":"15","label":"第15條","ch":"","cat":"d","lines":["按月、按日或按時計酬法，適用於工作範圍小，或工作範圍及內容無法明確界定，致總費用難以正確估計者。","前項服務費用，薪資之計算得為下列方式之一；薪資以外之其他費用，可另行計算給付。","一、採按月計酬法者，每月薪資可按契約所載工作人員月薪計算。","二、採按日計酬法者，每日薪資可按契約所載工作人員日薪計算。","三、採按時計酬法者，每時薪資可按契約所載工作人員時薪計算。"]},{"no":"16","label":"第16條","ch":"","cat":"d","lines":["服務成本加公費法，適用於計畫性質複雜，服務費用不易確實預估或履約成果不確定之服務案件。","前項服務費用，得包括下列各款費用：","一、直接費用：","（一）直接薪資：包括直接從事資訊服務工作之專案經理、系統分析、程式設計、系統管理及機器操作人員之實際薪資，另加實際薪資之一定比率作為工作人員不扣薪假與特別休假之薪資費用；非經常性給與之獎金；及依法應由雇主負擔之勞工保險費、積欠工資墊償基金提繳費、全民健康保險費、勞工退休金。","（二）管理費用：包括未在直接薪資項下開支之管理及會計人員之薪資、保險費及退休金、辦公室費用、水電及冷暖氣費用、機器設備及傢俱等之折舊或租金、辦公事務費、機器設備之搬運費、郵電費、業務承攬費、廣告費、準備及結束工作所需費用、參加國內外資訊會議費用、業務及人力發展費用、研究費用或專業聯繫費用及有關之稅捐等。但全部管理費用不得超過直接薪資扣除非經常性給與之獎金後之百分之一百。","（三）其他直接費用：包括執行委辦案件工作時所需直接薪資以外之各項直接費用。如差旅費、加班費、資料收集費、專利費、操作及維護人員之代訓費、電腦軟硬體及通信設施之租費及製作程式費或圖表報告之複製印刷費及有關之各項稅捐、會計師簽證費用等。","二、公費：指廠商提供資訊服務所得之報酬，包括風險、利潤及有關之稅捐等。","三、營業稅。","前項第一款第一目工作人員不扣薪假與特別休假之薪資費用，得由機關依實際需要於招標文件明定為實際薪資之一定比率及給付條件，免檢據核銷。但不得超過實際薪資之百分之十六。","第二項第一款第一目非經常性給與之獎金，得由機關依實際需要於招標文件明定為實際薪資之一定比率及給付條件，檢據核銷。但不得超過實際薪資之百分之三十。","第二項第一款第一目依法應由雇主負擔之勞工保險費、積欠工資墊償基金提繳費、全民健康保險費、勞工退休金，由機關核實給付。","第二項第二款公費，應為定額，不得按直接薪資及管理費之金額依一定比率增加，且全部公費不得超過直接薪資扣除非經常性給與之獎金後與管理費用合計金額之百分之二十五。"]},{"no":"17","label":"第17條","ch":"","cat":"d","lines":["機關委託廠商承辦資訊服務採服務成本加公費法者，得於招標文件規定得標廠商服務費用降低或實際績效提高時，得依其情形給付廠商獎勵性報酬。","前項獎勵性報酬之給付方式如下，由機關於招標文件中訂明：","一、屬服務費用降低者，為所減省之契約價金金額之一定比率。","二、屬實際績效提高者，依契約所載計算方式給付。","前項第一款一定比率，以不逾百分之五十為限；第二款給付金額，以不逾契約價金總額或契約價金上限之百分之十為限。"]},{"no":"18","label":"第18條","ch":"","cat":"d","lines":["機關採服務成本加公費法者，應於契約訂明下列事項：","一、廠商應記錄各項費用並提出憑證，機關並得至廠商處所辦理查核。","二、成本上限及逾上限時之處理。","前項第一款憑證，應包括各項費用之發票、收據、紀錄或報表；除契約另有規定外，憑證得為影本。"]},{"no":"19","label":"第19條","ch":"","cat":"d","lines":["廠商之服務費用，得於契約規定於訂約後預付一部分，其餘按月或分期支付。但各次付款金額及條件應予訂明。","前項預付一部分者，以不逾契約價金總額或契約價金上限之百分之三十為原則。"]},{"no":"20","label":"第20條","ch":"","cat":"d","lines":["機關委託廠商承辦資訊服務，其履約期間在一年以上者，得於契約內訂明自第二年起得隨物價指數調整契約價金，並敘明其所適用之調整項目、調整方式及調整金額上限。"]},{"no":"21","label":"第21條","ch":"","cat":"d","lines":["機關委託廠商承辦資訊服務，應於招標文件規定得標廠商資訊服務成果之智慧財產權歸屬及侵害第三人合法權益時由廠商負責處理並承擔一切法律責任。","前項權利，機關得視需要取得部分或全部權利或取得授權。"]},{"no":"22","label":"第22條","ch":"","cat":"d","lines":["機關委託廠商承辦資訊服務，非依本法第二十二條第一項第九款辦理者，得準用本辦法之規定。"]},{"no":"23","label":"第23條","ch":"","cat":"d","lines":["本辦法自中華民國八十八年五月二十七日施行。","本辦法修正條文自發布日施行。"]}]},{"id":"A0030081","title":"共同供應契約實施辦法","short":"共同供應契約辦法","date":"民國108年11月22日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030081","articles":[{"no":"1","label":"第1條","ch":"","cat":"p","lines":["本辦法依政府採購法（以下簡稱本法）第九十三條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"p","lines":["本法第九十三條第一項所稱具有共通需求特性之財物或勞務，指該財物或勞務於二以上機關均有需求者。","本法第九十三條第一項所稱共同供應契約（以下簡稱本契約），指一機關為二以上機關具有共通需求特性之財物或勞務與廠商簽訂契約，使該機關及其他適用本契約之機關均得利用本契約辦理採購者。"]},{"no":"3","label":"第3條","ch":"","cat":"p","lines":["本辦法所稱訂約機關，指與廠商簽訂本契約之機關。","本辦法所稱適用機關，指本契約所列可依本契約下訂之機關。"]},{"no":"4","label":"第4條","ch":"","cat":"p","lines":["機關辦理本契約之採購，應先辦理需求調查。但已有前例或可合理評估需求者，不在此限。","機關辦理本契約之招標文件，除法令另有規定者外，應視需要載明下列事項：","一、招標標的之名稱、技術規格、供應區域、預估採購總數量或總金額、各標的投標單價上限金額、各標的每次最低採購數量或金額、各標的每次最高採購數量或金額、報價條件、通知得標廠商供應之程序、訂約廠商每次供應之履約期限、包裝、驗收、保固、爭議處理或其他商業條款。","二、價格及履約期限得因地區而異者，其所適用之各個地區。","三、本契約可供訂購之期間，及該期間屆滿或終止前發出之訂購通知均屬有效。","四、廠商於本契約可供訂購之期間內對一般大眾之促銷或減讓活動，其價格或條件優於本契約時，應一併適用於適用機關。","五、適用機關。","六、適用機關以外之機關（以下簡稱其他機關），於徵得訂約廠商同意後，得利用本契約辦理採購，及其累計訂購金額之上限。","七、本契約變更之程序及條件。","八、終止或解除本契約之條件。","九、訂約機關及廠商之名稱、地址、電話、電傳號碼及聯絡人（或單位）等資料。","十、標明本契約係共同供應契約。","十一、其他必要事項。","機關依前項第一款於招標文件載明各標的投標單價上限金額者，應一併載明廠商投標單價逾越上限金額者，不得作為該標的之決標對象。"]},{"no":"5","label":"第5條","ch":"","cat":"p","lines":["前條第二項第五款所稱適用機關，得為下列情形之一：","一、二以上機關共同協議由其中一機關訂約者，為參與協議之各機關。","二、由中央各部、會、行、處、局、署等機關或各直轄市、縣（市）政府指定機關訂約者，為指定機關及其所屬機關，及本契約內約定之適用機關。","三、由本法主管機關指定機關訂約者，為中央機關。"]},{"no":"6","label":"第6條","ch":"","cat":"p","lines":["適用機關之採購需求在本契約所載可供訂購之數量或金額範圍內，得利用本契約辦理採購；其各次訂購數量或金額，以本契約所載各標的每次最高採購數量或金額為限。","機關利用本契約辦理訂購，需附加採購本契約以外之標的者，應與訂購標的相關，且附加採購金額不得逾公告金額十分之一及訂購標的之金額。","本契約之標的，有二家以上訂約廠商可供應者，機關擇定訂購對象，除本契約另有約定者外，以較符合機關需要者為原則。","機關辦理查核金額以上之採購，不得利用本契約辦理訂購。但經上級機關核准者，不在此限。","其他機關徵得訂約廠商同意後，利用本契約辦理採購者，適用前四項之規定。"]},{"no":"7","label":"第7條","ch":"","cat":"p","lines":["本契約應公開於主管機關指定之資訊網站。"]},{"no":"8","label":"第8條","ch":"","cat":"p","lines":["適用機關利用本契約辦理採購之程序，應由訂約機關於本契約內訂明；其方式得為下列情形之一：","一、經由訂約機關為之。","二、逕與訂約廠商為之。","三、本契約規定之其他程序。","適用機關辦理驗收及付款事宜，以逕與訂約廠商為之為原則。"]},{"no":"9","label":"第9條","ch":"","cat":"p","lines":["本契約應明定，於可供訂購之期間，訂約廠商以更優惠之價格或條件供應本契約之標的於不特定對象者，訂約機關得與訂約廠商協議變更本契約。訂約廠商無合理事由而不減價者，訂約機關得終止契約。","訂約機關於本契約可供訂購之期間，發現市場行情明顯下降時，應就訂約廠商供應標的之價格辦理查價，俾供訂約機關依前項規定辦理。","適用機關發現本契約價格高於市場行情者，不得利用本契約辦理採購，並應通報訂約機關。","其他機關利用本契約辦理採購前，應就一般市場符合需求之標的辦理查價。查價結果發現本契約之價格高於市場行情者，不得利用本契約辦理採購。","機關利用本契約辦理採購，得考量其於契約所載不同數量或金額級距下之訂購數量、金額或有別於本契約之條件，洽訂約廠商提供更優惠之價格或條件。"]},{"no":"10","label":"第10條","ch":"","cat":"p","lines":["本契約應明定訂約廠商對適用本契約之機關，為無正當理由之差別待遇，或有可歸責於訂約廠商之事由而未能供應時，訂約機關得終止契約，並得請求損害賠償。"]},{"no":"11","label":"第11條","ch":"","cat":"p","lines":["本契約所載可供訂購之期間，包含後續擴充，最長以二年為限。","訂約機關應控管本契約之總訂購金額，不得逾決標公告公開之預算金額。"]},{"no":"12","label":"第12條","ch":"","cat":"p","lines":["本契約關於統計資料之蒐集與彙報及依本法第一百零一條所為之通知等事項，由訂約機關統一處理為原則。"]},{"no":"13","label":"第13條","ch":"","cat":"p","lines":["履約爭議由與訂約廠商發生爭議之機關處理之。"]},{"no":"14","label":"第14條","ch":"","cat":"p","lines":["訂約機關辦理本契約，得向訂購機關或訂約廠商收取必要之費用。","前項收取費用之計算方式，應載明於本契約之招標文件；其收取費用以不逾訂購金額之百分之一為原則，且應隨訂購金額或數量多寡訂定不同計算方式。"]},{"no":"15","label":"第15條","ch":"","cat":"p","lines":["本辦法自發布日施行。"]}]},{"id":"D0070080","title":"工程施工查核小組作業辦法","short":"施工查核作業辦法","date":"民國112年08月09日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070080","articles":[{"no":"1","label":"第1條","ch":"","cat":"p","lines":["本辦法依政府採購法（以下簡稱本法）第七十條第四項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"p","lines":["工程施工查核小組（以下簡稱查核小組）進行查核時，應以現場查核為主，書面資料審查為輔。","前項查核，應依行政院訂定之公共工程施工品質管理制度、相關法令及工程契約規定，並參照工程施工查核作業參考基準，查核工程品質及進度等事宜。","前項參考基準，由主管機關定之。"]},{"no":"3","label":"第3條","ch":"","cat":"p","lines":["查核小組之主要查核項目，得包含：","一、機關之品質督導機制、監造計畫之審查紀錄、施工進度管理措施及障礙之處理。","二、監造單位之監造組織、施工計畫及品質計畫之審查作業程序、材料設備抽驗及施工抽查之程序及標準、品質稽核、文件紀錄管理系統等監造計畫內容及執行情形；缺失改善追蹤及施工進度監督等之執行情形。","三、廠商之品管組織、施工要領、品質管理標準、材料及施工檢驗程序、自主檢查表、不合格品之管制、矯正與預防措施、內部品質稽核、文件紀錄管理系統等品質計畫內容及執行情形；施工進度管理、趕工計畫、安全衛生及環境保護措施等之執行情形。","查核小組發現有下列情形時，應加以記錄：","一、工程規劃設計、生態環保、材料設備、圖說規範、變更設計等有缺失。","二、監造單位之建築師、技師、派駐現場人員，承攬廠商之專任工程人員、工地主任或工地負責人、品質管理人員（以下簡稱品管人員）及安全衛生人員等執行職務時，有違背相關法令及契約規定。","工程施工查核各項書表格式，由主管機關定之。"]},{"no":"4","label":"第4條","ch":"","cat":"p","lines":["查核小組每年應辦理工程施工查核之件數比率以不低於當年度所屬新臺幣一百五十萬元以上工程標案（不含補助及委託其他機關辦理案件）之百分之十為原則，且各規模之工程應查核件數如下：","一、新臺幣五千萬元以上之標案：以二十件以上為原則；當年度執行工程標案未達二十件者，則全數查核。","二、新臺幣一千萬元以上未達五千萬元之標案：以十五件以上為原則；當年度執行工程標案未達十五件者，則全數查核。","三、新臺幣一百五十萬元以上未達一千萬元之標案：以十件以上為原則；當年度執行工程標案未達十件者，則全數查核。","前項各款之查核件數，必要時得經查核小組之機關首長核准予以調整，並報主管機關備查。","查核小組就下列工程標案應視施工進度優先納入查核：","一、民眾或廠商檢舉、媒體報導或有資料顯示疑有違失或異常之工程標案。","二、決標標價偏低、履約進度明顯落後或多次、大幅變更契約之工程標案。","三、有資料顯示品質欠佳之工程標案。","四、其他經主管機關或設立機關指定者。","機關得視需要，提出工程施工查核需求，供該管查核小組作業參考。","第一項所定金額，為採購標案之預算金額。複數決標項目之標的不同者，依個別項目之預算金額認定之。"]},{"no":"5","label":"第5條","ch":"","cat":"p","lines":["查核小組應依前條規定之查核件數，視工程推動情形安排查核時機，定期辦理查核，並得不 預先通知赴工地進行查核。","查核委員赴工地查核時，應主動出示查核小組之書面通知及相關證明文件。","查核小組辦理查核時，監造單位之建築師或技師及廠商之專任工程人員應配合到場說明。無故缺席，應按契約規定處理。"]},{"no":"6","label":"第6條","ch":"","cat":"p","lines":["查核小組辦理查核時，得通知機關就指定之工程項目進行檢驗、拆驗或鑑定。涉及取樣者，應會同機關、專案管理廠商、監造單位及廠商，確認取樣方法、位置、數量及運送方式後辦理之。","前項檢驗、拆驗或鑑定費用之負擔，依契約規定辦理。契約未規定，而檢驗、拆驗或鑑定結果與契約規定相符者，該費用由機關負擔；與規定不符者，該費用由廠商負擔。"]},{"no":"7","label":"第7條","ch":"","cat":"p","lines":["查核成績之計算，以各查核委員評分之總和平均計算之；九十分以上者為優等，八十分以上未達九十分者為甲等，七十分以上未達八十分者為乙等，未達七十分者為丙等。","前項總和平均結果有小數時，採四捨五入進位方式，整數計算之。"]},{"no":"8","label":"第8條","ch":"","cat":"p","lines":["查核小組查核結果，有下列情況之一者，應列為丙等：","一、混凝土結構物鑽心試體試驗結果不合格。","二、路面工程瀝青混凝土鑽心試體試驗結果不合格。","三、路基工程壓實度試驗結果不合格。","四、主要結構與設計不符情節重大。","五、主要材料設備與設計不符情節重大。","六、其他缺失情節重大影響安全。","前項各款規定涉及相關試驗之判定標準者，應依國際標準或國家標準等相關法令或契約規定之設計標準辦理。","原查核成績達七十分以上者，應於試驗結果判定完成後，始通知機關查核成績；試驗結果為不合格時，其成績以六十九分計。"]},{"no":"9","label":"第9條","ch":"","cat":"p","lines":["查核小組於查核時發現缺失，機關應督促監造單位及廠商限期改善，並將改善前、中、後之情形拍照留存；其應檢討改善者，機關應於期限內改善並審查完妥後，報查核小組備查。","查核小組查核紀錄應於七個工作天內送機關，並應將查核結果及處理情形登錄於主管機關指定之資訊網路系統列管追蹤，並得隨時派員複查。"]},{"no":"10","label":"第10條","ch":"","cat":"p","lines":["機關得就查核小組之查核結果，依相關法令規定辦理相關人員之獎懲，並登錄於主管機關指定之資訊網路系統。","機關得將查核成績列為工程採購以最有利標或評分及格最低標決標之履約績效評選或評分項目參考。","查核成績列為丙等者，機關除應依契約規定處理外，並應依個案缺失情節檢討人員之責任歸屬後，採取下列之處置：","一、對所屬人員依法令為懲戒、懲處或移送司法機關。","二、對負責該工程之建築師、技師、專任工程人員或工地主任，報請各該主管機關依相關法規予以懲處或移送司法機關。","三、廠商有本法第一百零一條第一項各款規定之情形者，依本法第一百零一條至第一百零三條規定處理。","四、通知監造單位撤換派駐現場人員。","五、通知廠商依契約撤換工地負責人或品管人員或安全衛生人員。","缺失未於期限內改善完成且未經查核小組同意展延期限者，機關除應依契約規定處理外，並依前項第四款或第五款規定辦理。","機關未依前二項規定處置或處置不當，查核小組得通知機關或其上級機關另為適當之處置，並副知審計機關；必要時，得函送監察院。有犯罪嫌疑者，應移送該管司法機關處理。"]},{"no":"11","label":"第11條","ch":"","cat":"p","lines":["主管機關得辦理下列事項：","一、定期公告查核小組查核情形。","二、不定期派員查核各查核小組作業情形。","三、考核各查核小組之執行績效。","前項第三款查核小組執行績效之考核作業規定，由主管機關定之。"]},{"no":"12","label":"第12條","ch":"","cat":"p","lines":["查核小組得視工程性質與實際需求，另定查核補充規定。"]},{"no":"13","label":"第13條","ch":"","cat":"p","lines":["查核委員辦理查核時，應公正執行職權，不得有下列之情形：","一、假藉查核之名，妨礙機關、監造單位或廠商依法及契約辦理工程施工。","二、接受不當饋贈或招待。","三、藉查核之便，蒐集與查核無關之資訊或資料，或要求至受查之機關授課、擔任顧問，或為其他不當之要求。","四、洩漏應保密之查核時間、地點及對象。","五、洩漏因查核所獲應保密之資訊或資料。","六、未經查核小組指派，自行辦理查核監督。","七、有不能公正執行職務之情事。"]},{"no":"14","label":"第14條","ch":"","cat":"p","lines":["本辦法自發布日施行。"]}]},{"id":"D0070079","title":"工程施工查核小組組織準則","short":"施工查核組織準則","date":"民國114年10月15日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070079","articles":[{"no":"1","label":"第1條","ch":"","cat":"p","lines":["本準則依政府採購法（以下簡稱本法）第七十條第四項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"p","lines":["中央及直轄市、縣（市）政府工程施工查核小組（以下簡稱查核小組）之設立機關如下：","一、中央政府查核小組：","（一）中央查核小組：本法主管機關（以下簡稱主管機關）。","（二）部會行處院查核小組：行政院所屬部會行處院。","二、直轄市政府查核小組：各直轄市政府。","三、縣（市）政府查核小組：各縣（市）政府。","前項第一款第二目部會行處院查核小組，應冠以該部會行處院之名稱。"]},{"no":"3","label":"第3條","ch":"","cat":"p","lines":["查核小組查核工程之範圍如下：","一、中央查核小組：","（一）中央各機關辦理之工程。","（二）中央各機關補助或委託其他機關、法人或團體辦理之工程，而適用本法之規定者。","（三）地方機關辦理之工程。","二、部會行處院查核小組：","（一）該部會行處院及所屬各機關辦理之工程。","（二）該部會行處院及所屬各機關補助或委託其他機關、法人或團體辦理之工程，而適用本法之規定者。","三、直轄市政府查核小組：","（一）直轄市各機關辦理之工程。","（二）直轄市各機關補助或委託其他機關、法人或團體辦理之工程，而適用本法之規定者。","四、縣（市）政府查核小組：","（一）縣（市）及所轄鄉（鎮、市）各機關辦理之工程。","（二）縣（市）及所轄鄉（鎮、市）各機關補助或委託其他機關、法人或團體辦理之工程，而適用本法之規定者。"]},{"no":"4","label":"第4條","ch":"","cat":"p","lines":["查核小組之任務，為辦理查核工程品質及進度等事宜。"]},{"no":"5","label":"第5條","ch":"","cat":"p","lines":["查核小組置召集人一人，綜理工程施工查核事宜，由設立機關首長或其指定之高階主管人員兼之。","查核小組置查核委員若干人，於實施個案工程查核時派（聘）兼之，並於完成查核且無待處理事項後免兼。","前項查核委員，除由設立機關指派機關具有工程專業知識人員擔任外，並由主管機關所建置之專家名單中遴選之，其中外聘之專家人數不得少於三分之一。但有特殊情形報經主管機關同意後，不在此限。","前項專家名單，由主管機關登載於資訊網站，供機關查詢。未能自該名單覓得適當人選者，得敘明理由，另行遴選後簽報機關首長核定。"]},{"no":"6","label":"第6條","ch":"","cat":"p","lines":["查核小組置執行秘書一人，由設立機關就具有工程管理專門知識或相關工作經驗之人員派（聘）兼之，承召集人之命，處理查核小組日常事務；工作人員若干人，由設立機關派兼之，協辦施工查核小組業務。"]},{"no":"7","label":"第7條","ch":"","cat":"p","lines":["有下列各款情形之一者，不得擔任查核委員：","一、犯刑法瀆職罪或貪污治罪條例規定之罪，經判刑確定。","二、褫奪公權尚未復權。","三、受破產宣告確定或經依消費者債務清理條例裁定開始清算程序，尚未復權。","四、專門職業及技術人員已受停止執行業務或受撤銷、廢止執業執照或開業證書之處分。"]},{"no":"8","label":"第8條","ch":"","cat":"p","lines":["查核委員辦理查核時之迴避，準用本法第十五條第二項及第三項之規定。"]},{"no":"9","label":"第9條","ch":"","cat":"p","lines":["查核委員有第七條或不能公正執行職權者，設立機關應解除其職務；其為外聘專家時，並通知主管機關自專家名單中刪除之。"]},{"no":"10","label":"第10條","ch":"","cat":"p","lines":["查核小組應於每年四月、七月、十月及次年一月底前，將最近一季查核結果彙送主管機關備查。","前項查核結果彙送方式，得採書面或電子化方式辦理。"]},{"no":"11","label":"第11條","ch":"","cat":"p","lines":["查核小組發文，以設立機關名義行之。"]},{"no":"12","label":"第12條","ch":"","cat":"p","lines":["本準則自發布日施行。"]}]},{"id":"A0030109","title":"採購履約爭議調解收費辦法","short":"履約調解收費辦法","date":"民國101年08月03日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030109","articles":[{"no":"1","label":"第1條","ch":"","cat":"r","lines":["本辦法依政府採購法（以下簡稱本法）第八十五條之二規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"r","lines":["採購申訴審議委員會（以下簡稱申訴會）依本法第八十五條之一規定處理機關及廠商之履約爭議調解（以下簡稱調解）事件，依本辦法之規定收費。"]},{"no":"3","label":"第3條","ch":"","cat":"r","lines":["前條費用，應由當事人以現金、公庫支票、郵政匯票、金融機構簽發之即期本票、支票或保付支票繳納。"]},{"no":"4","label":"第4條","ch":"","cat":"r","lines":["申請調解者，應繳納調解費。其未繳納者，由申訴會通知限期補繳；屆期未繳納者，其申請不予受理。"]},{"no":"5","label":"第5條","ch":"","cat":"r","lines":["以請求或確認金額為調解標的者，其調解費如下：","一、金額未滿新臺幣二百萬元者，新臺幣二萬元。","二、金額在新臺幣二百萬元以上，未滿五百萬元者，新臺幣三萬元。","三、金額在新臺幣五百萬元以上，未滿一千萬元者，新臺幣六萬元。","四、金額在新臺幣一千萬元以上，未滿三千萬元者，新臺幣十萬元。","五、金額在新臺幣三千萬元以上，未滿五千萬元者，新臺幣十五萬元。","六、金額在新臺幣五千萬元以上，未滿一億元者，新臺幣二十萬元。","七、金額新臺幣一億元以上，未滿三億元者，新臺幣三十五萬元。","八、金額新臺幣三億元以上，未滿五億元者，新臺幣六十萬元。","九、金額新臺幣五億元以上者，新臺幣一百萬元。","前項調解標的之金額以外幣計算者，按申訴會收件日前一交易日臺灣銀行外匯小額交易收盤買入匯率折算之。"]},{"no":"6","label":"第6條","ch":"","cat":"r","lines":["非以請求或確認金額為調解標的者，其調解費為新臺幣三萬元。但調解標的得直接以金額計算者，其調解費依前條規定計算。"]},{"no":"7","label":"第7條","ch":"","cat":"r","lines":["以一履約爭議調解申請書主張數項調解標的者，其調解費依下列方式計算：","一、就一契約並主張前二條之調解標的者，其調解費依前二條規定分別計算後累計。","二、就一契約主張數項第五條之調解標的者，其調解費按請求總金額計算。","三、就一契約主張數項前條之調解標的者，其調解費分別計算後累計。","四、就一契約主張之數項調解標的互相競合或應為選擇者，其調解費依其中金額最高者計算。","五、就二個以上之契約事件申請調解者，其調解費按每一契約分別計算後累計。"]},{"no":"8","label":"第8條","ch":"","cat":"r","lines":["應屬履約爭議事件，申請人誤提起申訴，而經申請人申請改行調解程序者，依本辦法之規定重新計算其調解費，與原繳審議費相抵後，多退少補。"]},{"no":"9","label":"第9條","ch":"","cat":"r","lines":["調解程序進行中，因請求事項變更或追加，應加收調解費時，依第五條至第七條規定計算追繳之。"]},{"no":"10","label":"第10條","ch":"","cat":"r","lines":["調解申請不予受理者，免予收費。已繳費者，無息退還所繳調解費之全額。但已通知調解期日者，收取新臺幣五千元。"]},{"no":"11","label":"第11條","ch":"","cat":"r","lines":["機關申請調解時，廠商從未於調解期日到場，經調解委員酌量情形視為調解不成立者，其調解費無息退還機關二分之一。"]},{"no":"12","label":"第12條","ch":"","cat":"r","lines":["鑑定費及其他必要之費用，由申訴會通知當事人繳納。"]},{"no":"13","label":"第13條","ch":"","cat":"r","lines":["申訴會囑託鑑定時，應由該受託機關、學校、團體或人員於鑑定前提出總費用額之請求，由調解委員視調解事件之繁簡酌定之。"]},{"no":"14","label":"第14條","ch":"","cat":"r","lines":["申請人撤回調解之申請者，所繳調解費不予退還。但申請人於第一次調解期日之次日起十日內以書面撤回調解者，無息退還所繳調解費二分之一，未退還之調解費逾新臺幣二十萬元者，以新臺幣二十萬元為收費上限。","前項情形，當事人已繳納而尚未發生之鑑定費及其他必要費用，應無息退還。"]},{"no":"15","label":"第15條","ch":"","cat":"r","lines":["調解成立者，調解費、鑑定費及其他必要費用之數額及負擔，應記明於調解成立書。","調解不成立時，調解費、鑑定費及其他必要費用由已繳費之當事人負擔。"]},{"no":"16","label":"第16條","ch":"","cat":"r","lines":["本辦法自發布日施行。"]}]},{"id":"A0030108","title":"採購履約爭議調解規則","short":"履約調解規則","date":"民國97年04月22日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030108","articles":[{"no":"1","label":"第1條","ch":"第一章總則","cat":"r","lines":["本規則依政府採購法（以下簡稱本法）第八十五條之一第四項規定訂定之。"]},{"no":"2","label":"第2條","ch":"第一章總則","cat":"r","lines":["調解事件屬中央機關之履約爭議者，應向主管機關所設採購申訴審議委員會（以下簡稱申訴會）申請；其屬地方機關之履約爭議者，應向直轄市、縣（市）政府所設申訴會申請。","直轄市、縣（市）政府未設申訴會而委請主管機關處理者，得向主管機關所設申訴會申請。"]},{"no":"3","label":"第3條","ch":"第一章總則","cat":"r","lines":["申請人誤向非管轄之申訴會申請調解者，該申訴會應即移送有管轄權之申訴會辦理，並副知申請人及他造當事人。"]},{"no":"4","label":"第4條","ch":"第一章總則","cat":"r","lines":["對於調解事件，應先為程序審查；其無程序不合法之情形者，再進行實體審查。","前項程序審查，發現有程式不合而其情形可補正者，應酌定相當期間通知申請人補正。"]},{"no":"5","label":"第5條","ch":"第一章總則","cat":"r","lines":["申訴會對於調解事件之文書，應就每一事件編訂卷宗。"]},{"no":"6","label":"第6條","ch":"第二章調解程序","cat":"r","lines":["申請調解應具申請書，載明下列事項，由申請人或代理人簽名或蓋章，並按他造人數分送副本：","一、申請人之姓名、出生年月日、電話及住、居所。如係法人或其他設有管理人或代表人之團體，其名稱、事務所或營業所及管理人或代表人之姓名、出生年月日、電話、住、居所。","二、有代理人者，其姓名、出生年月日、電話及住、居所。","三、他造當事人之名稱。","四、請求調解之事項、調解標的之法律關係、爭議情形及證據。","五、附屬文件及其件數。","六、年、月、日。","調解申請書應以中文繕具，其附有外文資料者，應就調解有關之部分備具中文譯本。但申訴會得視需要通知其檢具其他部分之中文譯本。"]},{"no":"7","label":"第7條","ch":"第二章調解程序","cat":"r","lines":["申請調解得委任代理人為之。代理人應提出委任書，載明其姓名、出生年月日、職業、電話、住、居所。","申請人在我國無住所、事務所或營業所者，應委任在我國有住所、事務所或營業所之代理人為之。"]},{"no":"8","label":"第8條","ch":"第二章調解程序","cat":"r","lines":["調解代理人就其受委任事件，有為一切行為之權。但捨棄、認諾、撤回、和解及選任代理人，非受特別委任不得為之。","對前項代理權加以限制者、應於委任書表明。"]},{"no":"9","label":"第9條","ch":"第二章調解程序","cat":"r","lines":["他造當事人應自收受調解申請書副本之次日起十五日內，以書面向申訴會陳述意見，並同時繕具副本送達於申請人。","調解過程中，任一造當事人向申訴會提出之文書，應同時繕具副本送達於他造。"]},{"no":"10","label":"第10條","ch":"第二章調解程序","cat":"r","lines":["申請調解事件有下列情形之一者，應提申訴會委員會議為不受理之決議。但其情形可補正者，應酌定相當期間命其補正：","一、當事人不適格。","二、已提起仲裁、申（聲）請調解或民事訴訟。但其程序已依法合意停止者，不在此限。","三、曾經法定機關調解未成立。","四、曾經法院判決確定。","五、申請人係無行為能力或限制行為能力人，未由法定代理人合法代理。","六、由代理人申請調解，其代理權有欠缺。","七、申請調解不合程式。","八、經限期補繳調解費，屆期未繳納。","九、廠商不同意調解。","十、送達於他造當事人之通知書，應為公示送達或於外國為送達。","十一、非屬政府採購事件。","十二、其他應不予受理之情事。"]},{"no":"11","label":"第11條","ch":"第二章調解程序","cat":"r","lines":["調解事件經審查無前條各款應不受理之情形者，由申訴會主任委員指定委員一人至三人為調解委員，進行調解程序，並應速定調解期日，通知當事人或代理人到場。","前項調解之進行，申訴會得按事件需要，指定諮詢委員若干人，以備諮詢。"]},{"no":"12","label":"第12條","ch":"第二章調解程序","cat":"r","lines":["調解程序於申訴會行之；必要時，亦得於其他適當處所行之。","前項調解，以不公開為原則。"]},{"no":"13","label":"第13條","ch":"第二章調解程序","cat":"r","lines":["申訴會於調解時，得囑託具專門知識經驗之機關、學校、團體或人員鑑定，並得邀請學者或專家諮詢、通知相關人士說明或請當事人提供相關文件、資料。","前項鑑定人員及諮詢學者、專家之迴避，準用採購申訴審議委員會組織準則第十三條關於申訴會委員迴避之規定。"]},{"no":"14","label":"第14條","ch":"第二章調解程序","cat":"r","lines":["就調解事件有法律上利害關係之第三人，調解委員得依職權審酌通知其參加調解程序。"]},{"no":"15","label":"第15條","ch":"第二章調解程序","cat":"r","lines":["調解委員行調解時，為審究事件之法律關係及兩造當事人爭議之所在，得聽取當事人、具有專門知識經驗或知悉事件始末之人或其他關係人之陳述，察看現場或標的物之狀況；於必要時，得調查證據。","當事人無正當理由拒絕陳述、提供資料，調解委員得就現有資料採為出具調解建議之參考。"]},{"no":"16","label":"第16條","ch":"第二章調解程序","cat":"r","lines":["調解時應本和平懇切之態度，對當事人為適當勸導，就調解事件酌擬平允之解決辦法，力謀雙方之和諧。"]},{"no":"17","label":"第17條","ch":"第二章調解程序","cat":"r","lines":["當事人兩造或一造於調解期日未到場者，調解委員得斟酌其情形，視為調解不成立或另定調解期日予以調解。"]},{"no":"18","label":"第18條","ch":"第二章調解程序","cat":"r","lines":["調解過程中，調解委員於審酌當事人提出之所有資料後，本於第十六條酌擬平允之解決辦法，以申訴會名義提出書面調解建議，並酌定相當期間命當事人為同意與否之意思表示。","機關不同意調解建議者，應先報請上級機關核定後，於前項指定期間內以書面向申訴會及廠商說明理由。廠商為政府機關、公立學校或公營事業時，亦同。","當事人未於第一項期限內為同意與否之意思表示，經申訴會再酌定一定期間命其為同意與否之意思表示，逾期仍未回復者，得以該當事人不同意調解建議處理。"]},{"no":"19","label":"第19條","ch":"第二章調解程序","cat":"r","lines":["調解事件應作調解會議紀錄，記載調解之經過、結果與期日之延展及附記事項。","調解委員應就調解事件作成調解成立書、調解方案通知書或調解不成立證明書，載明調解經過，並檢具相關卷證文件，提申訴會委員會議審議。","調解成立書、調解方案通知書及調解不成立證明書，應於申訴會委員會議決議通過之次日起十日內，以正本送達於當事人及參加調解之利害關係人。"]},{"no":"20","label":"第20條","ch":"第二章調解程序","cat":"r","lines":["調解事件應自收受調解申請書之次日起四個月內完成調解程序。但經雙方同意延長者，得延長之。","前項調解期間，於調解申請書尚未補正或調解費尚未補繳者，自收受補正文件或補繳調解費之次日起算；當事人於調解期間內，續以書面補具理由、陳報資料，或擴張請求而有補繳調解費之必要者，自最後收受補具理由書、陳報資料或補繳調解費之次日起算。"]},{"no":"20-1","label":"第20-1條","ch":"第二章調解程序","cat":"r","lines":["調解程序，得經當事人向申訴會以書面陳明合意停止，並以一次為限。當事人於調解會議期日當場以言詞向調解委員陳明合意停止者，應記明於會議紀錄。","合意停止調解程序之任一造當事人，均得以書面向申訴會申請續行調解程序。","當事人自陳明合意停止之次日起，四個月內未申請續行調解程序者，視為申請人撤回調解之申請。","第一項情形，申訴會認有維護公益之必要者，得於四個月內續行調解程序。"]},{"no":"21","label":"第21條","ch":"第二章調解程序","cat":"r","lines":["調解之申請經撤回者，視為未申請調解。","前項撤回，申訴會應通知他造當事人。"]},{"no":"22","label":"第22條","ch":"第三章附則","cat":"r","lines":["申訴會委員、執行秘書、工作人員、諮詢委員及學者、專家，因經辦、參與調解事件，知悉他人職務上、業務上之秘密或其他涉及個人隱私之事項，應保守秘密。"]},{"no":"23","label":"第23條","ch":"第三章附則","cat":"r","lines":["調解成立書、調解不成立證明書或調解方案通知書，採用郵務送達者，應使用調解文書郵務送達證書。","調解成立書、調解不成立證明書或調解方案通知書之送達，除前項規定外，準用民事訴訟法關於送達之規定。"]},{"no":"24","label":"第24條","ch":"第三章附則","cat":"r","lines":["本規則有關之書表格式，由主管機關定之。"]},{"no":"25","label":"第25條","ch":"第三章附則","cat":"r","lines":["本規則自發布日施行。"]}]},{"id":"A0030071","title":"採購申訴審議收費辦法","short":"申訴審議收費辦法","date":"民國96年03月13日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030071","articles":[{"no":"1","label":"第1條","ch":"","cat":"r","lines":["本辦法依政府採購法（以下簡稱本法）第八十條第四項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"r","lines":["採購申訴審議委員會（以下簡稱申訴會）依本法第六章及第一百零二條規定處理廠商之採購申訴（以下簡稱申訴）事件，依本辦法之規定收費。"]},{"no":"3","label":"第3條","ch":"","cat":"r","lines":["廠商提出申訴時，應繳納審議費。其未繳納者，由申訴會通知限期補繳；逾期未補繳者，不受理其申請。"]},{"no":"4","label":"第4條","ch":"","cat":"r","lines":["前條審議費，每一申訴事件為新臺幣三萬元，由申訴廠商以現金、公庫支票、郵政匯票、金融機構簽發之即期本票、支票或保付支票繳納。"]},{"no":"5","label":"第5條","ch":"","cat":"r","lines":["採購履約爭議事件誤提起申訴，經廠商申請改行調解程序者，廠商已繳納之審議費轉為調解費用，並依採購履約爭議調解收費辦法規定計算，與原繳納金額相抵後，多退少補。"]},{"no":"6","label":"第6條","ch":"","cat":"r","lines":["申訴事件經申訴會為不受理之決議者，免予收費。已繳費者，申訴會無息退還所繳審議費之全額。但已通知預審會議期日者，收取審議費新臺幣五千元。"]},{"no":"7","label":"第7條","ch":"","cat":"r","lines":["鑑定費及其他必要之費用，由申訴會通知當事人繳納。"]},{"no":"8","label":"第8條","ch":"","cat":"r","lines":["廠商撤回申訴者，已繳審議費用不予退還。但於第一次預審會議期日前撤回者，無息退還二分之一。","前條廠商已繳納而尚未發生之鑑定費及其他必要費用，應予退還。"]},{"no":"9","label":"第9條","ch":"","cat":"r","lines":["本辦法自發布日施行。"]}]},{"id":"A0030097","title":"採購申訴審議規則","short":"申訴審議規則","date":"民國108年10月29日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030097","articles":[{"no":"1","label":"第1條","ch":"","cat":"r","lines":["本規則依政府採購法（以下簡稱本法）第八十條第五項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"r","lines":["廠商對於公告金額以上採購、未達公告金額採購爭議屬本法第三十一條第二項規定不予發還或追繳押標金異議之處理結果不服，或招標機關逾本法第七十五條第二項、第八十五條第一項所定期限不為處理者，得於收受異議處理結果或處理期限屆滿之次日起十五日內，依其屬中央機關或地方機關辦理之採購，以書面分別向主管機關、直轄市或縣（市）政府所設採購申訴審議委員會（以下簡稱申訴會）申訴。","廠商對機關依本法第一百零二條第一項異議之處理結果不服，或機關逾收受異議之次日起十五日期限不為處理者，無論該事件是否逾公告金額，得於收受異議處理結果或處理期限屆滿之次日起十五日內，以書面向該管申訴會申訴。","直轄市或縣（市）政府未設申訴會而委請主管機關處理者，廠商得向主管機關所設申訴會申訴。"]},{"no":"3","label":"第3條","ch":"","cat":"r","lines":["廠商申訴應具申訴書，載明下列事項，由申訴廠商簽名或蓋章：","一、申訴廠商之名稱、地址、電話及負責人之姓名、性別、出生年月日、住所或居所。","二、原受理異議之機關。","三、申訴之事實及理由。","四、證據。","五、申訴之年、月、日。"]},{"no":"4","label":"第4條","ch":"","cat":"r","lines":["申訴書應以中文繕具，其附有外文資料者，應就申訴有關之部分備具中文譯本。但申訴會得視需要，通知其檢具其他部分之中文譯本。"]},{"no":"5","label":"第5條","ch":"","cat":"r","lines":["申訴得委任代理人為之。代理人應提出委任書，載明其姓名、性別、出生年月日、職業、電話、住所或居所。","申訴廠商在我國無住所、事務所或營業所者，應委任在我國有住所、事務所或營業所之代理人為之。"]},{"no":"6","label":"第6條","ch":"","cat":"r","lines":["申訴事件之代理人就其受委任事件，有為一切申訴行為之權。但撤回申訴及選任代理人，非受特別委任，不得為之。","對前項代理權加以限制者，應於委任書內表明。"]},{"no":"7","label":"第7條","ch":"","cat":"r","lines":["廠商提出申訴，應同時繕具副本，連同相關文件送招標機關。","招標機關應自收受申訴書副本之次日起十日內，以書面向該管申訴會陳述意見，並檢附相關文件。"]},{"no":"8","label":"第8條","ch":"","cat":"r","lines":["申訴會對於招標機關接受申訴書副本未依規定期限向其陳述意見者，得予函催或逕為審議。"]},{"no":"9","label":"第9條","ch":"","cat":"r","lines":["廠商誤向非管轄之機關申訴者，以該機關收受之日，視為提起申訴之日。","前項收受之機關應於收受之次日起三日內，將申訴事件移送有管轄權之申訴會，並副知申訴廠商。"]},{"no":"10","label":"第10條","ch":"","cat":"r","lines":["對於申訴事件，應先為程序審查，其無不受理之情形者，再進而為實體審查。","前項程序審查，發現有程式不合而其情形可補正者，應酌定相當期間通知廠商補正。"]},{"no":"11","label":"第11條","ch":"","cat":"r","lines":["申訴事件有下列情形之一者，應提申訴會委員會議為不受理之決議：","一、採購事件未達公告金額。但第二條第二項及本法第三十一條第二項事件，不在此限。","二、申訴逾越法定期間。","三、申訴不合法定程式不能補正，或經通知限期補正屆期未補正。","四、申訴事件不屬收受申訴書之申訴會管轄而不能依第九條規定移送。","五、對於已經審議判斷或已經撤回之申訴事件復為同一之申訴。","六、招標機關自行依申訴廠商之請求，撤銷或變更其處理結果。","七、申訴廠商不適格。","八、採購履約爭議提出申訴，未申請改行調解程序。","九、非屬政府採購事件。","十、其他不予受理之情事"]},{"no":"12","label":"第12條","ch":"","cat":"r","lines":["（刪除）"]},{"no":"13","label":"第13條","ch":"","cat":"r","lines":["申訴事件經依第十一條審查無不受理之情形者，由申訴會主任委員指定委員一人至三人為預審委員，進行實體審查。"]},{"no":"14","label":"第14條","ch":"","cat":"r","lines":["申訴會於審議時得按事件需要，選任諮詢委員一人至三人，以備諮詢。"]},{"no":"15","label":"第15條","ch":"","cat":"r","lines":["申訴會得依職權或申請，通知廠商、機關到指定場所陳述意見。"]},{"no":"16","label":"第16條","ch":"","cat":"r","lines":["申訴會於審議時，得囑託具專門知識經驗之機關、學校、團體或人員鑑定，並得邀請學者、專家或相關人士到場說明，或請機關、廠商提供相關文件、資料。","前項學者、專家之迴避，準用採購申訴審議委員會組織準則關於申訴會委員迴避之規定。"]},{"no":"17","label":"第17條","ch":"","cat":"r","lines":["預審委員審議申訴事件，認為有必要者，經提報申訴會委員會議決議後，得通知招標機關暫停採購程序。但預審委員認時間急迫，應及時處理者，申訴會得以書面徵詢全體委員之意見，獲過半數委員之書面同意後暫停之。"]},{"no":"18","label":"第18條","ch":"","cat":"r","lines":["預審委員應就申訴事件作成預審意見，載明處理經過，並檢具相關卷證文件，提申訴會委員會議審議。"]},{"no":"19","label":"第19條","ch":"","cat":"r","lines":["（刪除）"]},{"no":"20","label":"第20條","ch":"","cat":"r","lines":["申訴會應按委員會議決議製作審議判斷書原本，載明下列事項：","一、申訴廠商之名稱、住、居所或事務所或營業所及管理人或代表人之姓名、住、居所。","二、有代理人者，其代理人之姓名、住、居所。","三、招標機關。","四、主文、事實及理由。其係不受理之審議判斷，得不記載事實。","五、年、月、日。","前項審議判斷書應於完成審議後十日內作成正本，送達於申訴廠商及招標機關。"]},{"no":"21","label":"第21條","ch":"","cat":"r","lines":["前條審議判斷書，應指明招標機關原採購行為有無違反法令之處；其有違反者，並得建議招標機關處置方式。","申訴會為前項之建議或依第十七條為通知時，應考量公共利益、相關廠商利益及其他有關情況。"]},{"no":"22","label":"第22條","ch":"","cat":"r","lines":["審議判斷書應附記如不服審議判斷，得於審議判斷書送達之次日起二個月內，向行政法院提起行政訴訟。","審議判斷書未依前項規定為附記或附記錯誤者，準用訴願法第九十一條及第九十二條規定。"]},{"no":"23","label":"第23條","ch":"","cat":"r","lines":["（刪除）"]},{"no":"24","label":"第24條","ch":"","cat":"r","lines":["審議判斷書有誤寫、誤算或其他類此之顯然錯誤者，申訴會得隨時或依申請更正之；其正本與原本不符者，亦同。"]},{"no":"25","label":"第25條","ch":"","cat":"r","lines":["本法第七十八條第二項所定完成審議期限，如申訴書尚待補正者，自補正之次日起算；申訴廠商於審議期限內續補具理由者，自最後補具理由之次日起算。"]},{"no":"26","label":"第26條","ch":"","cat":"r","lines":["申訴事件經依本法第八十一條規定撤回者，申訴會應即終結審議程序，並通知申訴廠商及招標機關。"]},{"no":"27","label":"第27條","ch":"","cat":"r","lines":["廠商對於採購履約爭議事件誤提起申訴者，得申請改行調解程序。廠商未申請者，申訴會應告知得為申請。"]},{"no":"27-1","label":"第27-1條","ch":"","cat":"r","lines":["廠商或利害關係人不服申訴會於審議程序中所為程序上處置者，僅得於對審議判斷聲明不服時一併聲明之。"]},{"no":"28","label":"第28條","ch":"","cat":"r","lines":["申訴事件之文書，應就每一事件編訂卷宗。"]},{"no":"29","label":"第29條","ch":"","cat":"r","lines":["申訴會委員、執行秘書、工作人員、諮詢委員及學者、專家因經辦、參與申訴事件，知悉他人職務上、業務上之秘密或其他涉及個人隱私之事項，應保守秘密。"]},{"no":"30","label":"第30條","ch":"","cat":"r","lines":["審議判斷書，採用郵務送達者，應使用申訴郵務送達證書。","申訴文書之送達，除前項規定外，準用行政程序法關於送達之規定。"]},{"no":"31","label":"第31條","ch":"","cat":"r","lines":["本規則有關之書表格式，由主管機關定之。"]},{"no":"32","label":"第32條","ch":"","cat":"r","lines":["本規則自中華民國八十八年五月二十七日施行。","本規則修正條文自發布日施行。"]}]},{"id":"A0030096","title":"採購申訴審議委員會組織準則","short":"申訴會組織準則","date":"民國105年05月25日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030096","articles":[{"no":"1","label":"第1條","ch":"","cat":"r","lines":["本準則依政府採購法（以下簡稱本法）第八十六條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"r","lines":["主管機關及直轄市、縣（市）政府分別設採購申訴審議委員會（以下簡稱申訴會），掌理下列事項：","一、關於本法第七十六條廠商申訴之處理。","二、關於本法第八十五條之一履約爭議之調解。","三、關於本法第一百零二條廠商申訴之處理。","四、其他與廠商申訴及履約爭議調解相關之事項。","直轄市、縣（市）政府未設申訴會者，得依本法第七十六條規定委請主管機關申訴會辦理前項業務。"]},{"no":"3","label":"第3條","ch":"","cat":"r","lines":["申訴會置主任委員一人，綜理會務，由主管機關或直轄市、縣（市）政府就本機關副秘書長以上或相當人員派兼之；並得置副主任委員一人，襄理會務。","前項副主任委員，由主管機關或直轄市、縣（市）政府就本機關高級人員或具有法律或採購相關專門知識之公正人士派（聘）兼之。"]},{"no":"4","label":"第4條","ch":"","cat":"r","lines":["申訴會置委員七人至三十五人，除主任委員、副主任委員為當然委員外，由主管機關或直轄市、縣（市）政府就本機關高級人員或具有法律或採購相關專門知識之公正人士派（聘）兼之。","前項委員，由本機關高級人員兼任者最多三人，且不得超過全體委員人數五分之一。","第一項聘任之委員，任期二年；期滿得續聘之。"]},{"no":"5","label":"第5條","ch":"","cat":"r","lines":["前條第一項公正人士，應具備下列資格之一：","一、曾任實任法官、檢察官或行政法院評事者。","二、曾執行律師、會計師、建築師、技師或其他與政府採購有關之專門職業人員業務五年以上者。","三、曾任教育部認可之國內、外大專校院副教授以上職務三年以上，且教授法律或採購相關專門學科者。","四、具有與政府採購相關領域之專門知識或技術，並在該領域服務五年以上者。"]},{"no":"6","label":"第6條","ch":"","cat":"r","lines":["申訴會委員會議由主任委員召集之，並為主席；主任委員未能出席時，由副主任委員代理之；無副主任委員或副主任委員未能出席者，由主任委員指定委員一人代理之。","申訴會委員會議之決議，應有二分之一以上委員出席，出席委員過半數同意行之。可否同數時，由主席裁決之。","不同意見之委員得提意見書附於申訴會委員會議紀錄，以備查考。"]},{"no":"7","label":"第7條","ch":"","cat":"r","lines":["申訴會委員應超然、公正行使職權，並親自出席會議。"]},{"no":"8","label":"第8條","ch":"","cat":"r","lines":["申訴會審議採購申訴事件或調解履約爭議事件時，主任委員得指定委員一人至三人預審或調解之。"]},{"no":"9","label":"第9條","ch":"","cat":"r","lines":["申訴會對外行文，以本機關名義行之。"]},{"no":"10","label":"第10條","ch":"","cat":"r","lines":["申訴會置執行秘書一人，由主管機關或直轄市、縣（市）政府就其高級人員具法制專長者派兼之，承主任委員之命，處理日常事務。所需工作人員，就其法定員額內派充之，並得分科（股）辦事。"]},{"no":"11","label":"第11條","ch":"","cat":"r","lines":["主管機關及直轄市、縣（市）政府得視業務需要，遴聘學者、專家為申訴會諮詢委員，聘期一年，連聘得連任。"]},{"no":"12","label":"第12條","ch":"","cat":"r","lines":["申訴會委員、諮詢委員均為無給職。但得依規定支給兼職酬勞。"]},{"no":"13","label":"第13條","ch":"","cat":"r","lines":["申訴會委員、諮詢委員、執行秘書及工作人員就採購申訴或履約爭議事件有下列各款情形之一者，應行迴避：","一、該事件涉及本人、配偶、三親等以內血親或姻親或同財共居親屬之利益者。","二、曾為該採購之承辦或監辦人員。","三、曾參與該事件之異議處理者。","四、本人或其配偶與機關、廠商或其負責人間現有或三年內曾有僱傭、委任或代理關係者。","五、有其他情形足認其有不能公正執行職務之虞者。","前項人員應行迴避而未迴避者，當事人得申請其迴避或由主任委員令其迴避。"]},{"no":"14","label":"第14條","ch":"","cat":"r","lines":["直轄市、縣（市）政府應於每年一月及七月，將前半年辦理採購申訴審議及履約爭議調解業務狀況，彙報主管機關。","主管機關得視需要邀集直轄市、縣（市）政府，就採購申訴審議及履約爭議調解業務召開檢討會。"]},{"no":"15","label":"第15條","ch":"","cat":"r","lines":["本準則自中華民國八十八年五月二十七日施行。","本準則修正條文自發布日施行。"]}]},{"id":"A0030084","title":"機關優先採購環境保護產品辦法","short":"優先採購環保產品辦法","date":"民國90年01月15日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030084","articles":[{"no":"1","label":"第1條","ch":"","cat":"s","lines":["本辦法依政府採購法（以下簡稱本法）第九十六條第三項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"s","lines":["本法第九十六條之用詞定義如下：","一、效能相同或相似之產品，指環境保護產品之效能經招標機關認定與招標文件之規定相同或相似者。","二、再生材質，指回收材質經由再製過程，製成最終產品或產品之組件。","三、可回收，指產品或其組件於廢棄後可經由收集、處理而轉變為原物料或產品。","四、低污染，指產品或其材料之設計、製造或使用，具有減少產生有害或有毒物質之功能者。","五、省能源，指產品或其材料之使用，具有減少能源消耗之功能者。","六、增加社會利益或減少社會成本，指產品或其材料之設計、製造或使用，具有降低對有限資源之依賴、減少資源之消耗、開發新種資源之使用或其他類似情形者。"]},{"no":"3","label":"第3條","ch":"","cat":"s","lines":["本法第九十六條第一項所稱政府認可之環境保護標章（以下簡稱環保標章）使用許可之產品，指該產品屬環保署公告之環保標章產品項目，且符合下列情形之一者（以下簡稱第一類產品）：","一、取得行政院環境保護署（以下簡稱環保署）認可之環保標章使用許可。","二、取得與我國達成相互承認協議之外國環保標章使用許可。"]},{"no":"4","label":"第4條","ch":"","cat":"s","lines":["本法第九十六條第一項所稱產品或其原料之製造、使用過程及廢棄物處理，符合再生材質、可回收、低污染或省能源者，指非屬環保署公告之環保標章產品項目之產品，經環保署認定符合此等條件，並發給證明文件者（以下簡稱第二類產品）。"]},{"no":"5","label":"第5條","ch":"","cat":"s","lines":["已取得外國環保標章使用許可，而不及於投標前取得前二條環保標章使用許可或證明文件者，得於投標文件內先行提出經公證或認證之外國環保標章使用許可證明影本，並於招標文件規定之期限內取得前二條環保標章使用許可或證明文件。"]},{"no":"6","label":"第6條","ch":"","cat":"s","lines":["本法第九十六條第二項所稱增加社會利益或減少社會成本之產品，指該產品經相關目的事業主管機關認定符合此等條件，並發給證明文件者（以下簡稱第三類產品）。"]},{"no":"7","label":"第7條","ch":"","cat":"s","lines":["第二類及第三類產品之認定，由申請廠商向環保署或相關目的事業主管機關提出符合各該類產品之說明及下列證明文件供審查：","一、申請日前一年內，未曾受到各級環境保護機關按日連續處罰、停工、停業、勒令歇業、撤銷、廢止許可證或移送刑罰處分。","二、產品已訂有國家標準者，符合國家標準。","三、品質及安全性符合相關法規規定。","前項申請案之受理及審查，得委託民間機構辦理。"]},{"no":"8","label":"第8條","ch":"","cat":"s","lines":["本辦法所稱環境保護產品（以下簡稱環保產品），指第一類至第三類產品。"]},{"no":"9","label":"第9條","ch":"","cat":"s","lines":["本辦法不適用下列採購：","一、依我國締結之條約或協定所辦理之採購。","二、招標標的僅部分屬環保產品者。"]},{"no":"10","label":"第10條","ch":"","cat":"s","lines":["機關依本辦法之規定辦理採購，應於招標文件中規定欲適用優惠措施之廠商須於投標文件內檢附下列資料供審查：","一、產品係屬第一類、第二類或第三類產品及其證明文件影本。","二、產品效能與招標文件之規定相同或相似之比較及其說明或證明資料。","三、允許價差優惠之採購，廠商之產品屬省能源、增加社會利益或減少社會成本者，其省能源、增加社會利益或減少社會成本之總金額及計算方式。","四、其他必要資料。"]},{"no":"11","label":"第11條","ch":"","cat":"s","lines":["機關依本辦法之規定優先採購環保產品，並允許價差優惠者，其優惠比率由機關視個別採購之特性及預算金額訂定之，並載明於招標文件。但不得逾百分之十。","前項優惠比率，於可量化之情形下，得以投標廠商之環保產品於招標文件所定使用期間內，就預估較非環保產品省能源、增加社會利益或減少社會成本之總金額，除以非環保產品中合於招標文件規定之最低標價，並以其商數之百分數為實際優惠比率。","前項實際優惠比率逾招標文件所定優惠比率者，以招標文件所定優惠比率計；未逾者，以實際優惠比率計。","第二項可量化之情形，欲適用價差優惠之廠商應於投標文件內敘明其產品預估省能源、增加社會利益或減少社會成本之總金額及其計算方式。"]},{"no":"12","label":"第12條","ch":"","cat":"s","lines":["機關依本法第九十六條第一項優先採購環保產品者，得擇下列方式之一辦理，並載明於招標文件：","一、非環保產品廠商為最低標，且其標價符合本法第五十二條第一項最低標之決標原則者，得以該標價優先決標予環保產品廠商。","二、非環保產品廠商為最低標，其標價符合本法第五十二條第一項最低標之決標原則，而環保產品廠商之最低標價逾該非環保產品廠商標價之金額，在招標文件所定價差優惠比率以內者，決標予環保產品廠商；逾價差優惠比率者，不予洽減，決標予該非環保產品廠商。","依前項規定計算得優先決標予環保產品廠商之標價，其超底價決標或廢標，適用本法第五十三條第二項及第五十四條之規定。"]},{"no":"13","label":"第13條","ch":"","cat":"s","lines":["前條第一項第一款環保產品廠商僅一家者，機關得洽該廠商減價至最低標之標價決標；在二家以上者，機關得自標價低者起，依序洽各該環保產品廠商減價一次，由最先減至最低標之標價者得標。","機關依前項規定依序洽各環保產品廠商減價時，應優先洽第一類及第二類產品廠商減價，無法決標時再洽第三類產品廠商減價。","前條第一項第二款，招標文件所定價差優惠比率以內之環保產品廠商家數在二家以上者，機關應優先決標予第一類及第二類產品廠商，且不以第三類產品之標價是否低於第一類及第二類產品之標價為條件。"]},{"no":"14","label":"第14條","ch":"","cat":"s","lines":["決標依本法第五十二條第一項第三款規定辦理者，得將廠商供應環保產品之情形，納入評定最有利標之評選項目。"]},{"no":"15","label":"第15條","ch":"","cat":"s","lines":["機關依本辦法規定優先採購環保產品，應於招標文件規定以環保產品得標之廠商，應於履約期間向機關提出與該產品有關之證明文件，以供查核。","前項招標文件並應規定以環保產品得標之廠商，其於履約期間未依契約規定提供該產品時，機關得採行下列措施：","一、終止契約。","二、解除契約。","三、追償價差優惠損失。","四、不發還履約保證金。","五、依本法第七十二條第一項規定通知廠商限期改善、拆除、重作、退貨或換貨。","六、依本法第一百零一條規定辦理。","七、契約規定之其他措施。"]},{"no":"16","label":"第16條","ch":"","cat":"s","lines":["主管機關對於採購環保產品績效卓著或有創新措施之機關或個人，得會同環保署及相關目的事業主管機關予以獎勵。"]},{"no":"17","label":"第17條","ch":"","cat":"s","lines":["本辦法自中華民國八十八年五月二十七日施行。","本辦法修正條文自發布日施行。"]}]},{"id":"A0030068","title":"扶助中小企業參與政府採購辦法","short":"扶助中小企業辦法","date":"民國91年04月24日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030068","articles":[{"no":"1","label":"第1條","ch":"","cat":"s","lines":["本辦法依政府採購法（以下簡稱本法）第九十七條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"s","lines":["本法第九十七條第一項所稱中小企業，其認定依中小企業發展條例之規定。"]},{"no":"3","label":"第3條","ch":"","cat":"s","lines":["機關辦理採購，於不違反法令或我國所締結之條約或協定之情形下，得視案件性質及採購規模，規定投標廠商須為中小企業，或鼓勵廠商以中小企業為分包廠商。","未達公告金額之採購，除中小企業無法承做、競爭度不足、標價不合理或有本法第二十二條第一項各款、第一百零四條第一項第一款與第三款及第一百零五條第一項各款情形者外，以向中小企業採購為原則。"]},{"no":"4","label":"第4條","ch":"","cat":"s","lines":["主管機關應會同經濟部於每一會計年度開始後二個月內，與國民大會、總統府、國家安全會議、五院及院屬各一級機關與直轄市及縣（市）政府會商後，訂定各該機關及其所屬機關該年度之採購由中小企業承包或分包之目標金額比率，並刊登於政府採購公報。","前項所稱目標金額比率，得依機關之性質分別訂定之。"]},{"no":"5","label":"第5條","ch":"","cat":"s","lines":["機關辦理採購，應規定投標廠商於投標文件中敘明其是否係屬中小企業；非屬中小企業者，並應敘明預計分包予中小企業之項目及金額。","機關於必要時得查證廠商是否係中小企業。經濟部就機關查詢事項，應提供必要之協助。"]},{"no":"6","label":"第6條","ch":"","cat":"s","lines":["機關傳輸決標結果之資訊予主管機關時，應標示得標廠商是否係屬中小企業。非屬中小企業者，應標示得標廠商預計分包予中小企業之金額。","機關向中小企業採購，而未能依前項規定傳輸決標資訊予主管機關者，至遲應於每一會計年度終了後一個月內向主管機關彙報。"]},{"no":"7","label":"第7條","ch":"","cat":"s","lines":["得標廠商於履約期間新增或減少分包予中小企業之金額，得由機關於每一會計年度終了後一個月內向主管機關彙報，以調整當年度內由中小企業分包之金額。"]},{"no":"8","label":"第8條","ch":"","cat":"s","lines":["共同投標廠商之成員有中小企業者，其由中小企業承包之金額，以該中小企業主辦項目之金額認定之。"]},{"no":"9","label":"第9條","ch":"","cat":"s","lines":["主管機關應會同經濟部於每一會計年度終了後二個月內，於政府採購公報刊登該年度內國民大會、總統府、國家安全會議、五院及院屬各一級機關與直轄市及縣（市）政府及其所屬機關之採購總金額，及該總金額中由中小企業承包或分包之總金額及所占比率。","前項比率未達第四條所定目標金額比率之機關，應檢討改進。"]},{"no":"10","label":"第10條","ch":"","cat":"s","lines":["本辦法自中華民國八十八年五月二十七日施行。","本辦法修正條文自發布日施行。"]}]},{"id":"A0030095","title":"採購人員倫理準則","short":"採購人員倫理準則","date":"民國88年04月26日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030095","articles":[{"no":"1","label":"第1條","ch":"","cat":"z","lines":["本準則依政府採購法（以下簡稱本法）第一百十二條規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"z","lines":["本準則所稱採購人員，指機關辦理本法採購事項之人員。","辦理本法第四條、第五條、第三十九條或第六十三條第二項規定事項之廠商人員，於辦理該等事項時，準用本準則之規定。"]},{"no":"3","label":"第3條","ch":"","cat":"z","lines":["採購人員應致力於公平、公開之採購程序，提升採購效率與功能，確保採購品質，並促使採購制度健全發展。"]},{"no":"4","label":"第4條","ch":"","cat":"z","lines":["採購人員應依據法令，本於良知，公正執行職務，不為及不受任何請託或關說。"]},{"no":"5","label":"第5條","ch":"","cat":"z","lines":["採購人員辦理採購應努力發現真實，對機關及廠商之權利均應注意維護。對機關及廠商有利及不利之情形均應仔細查察，務求認事用法允妥，以昭公信。"]},{"no":"6","label":"第6條","ch":"","cat":"z","lines":["採購人員應廉潔自持，重視榮譽，言詞謹慎，行為端莊。"]},{"no":"7","label":"第7條","ch":"","cat":"z","lines":["採購人員不得有下列行為：","一、利用職務關係對廠商要求、期約或收受賄賂、回扣、餽贈、優惠交易或其他不正利益。","二、接受與職務有關廠商之食、宿、交通、娛樂、旅遊、冶遊或其他類似情形之免費或優惠招待。","三、不依法令規定辦理採購。","四、妨礙採購效率。","五、浪費國家資源。","六、未公正辦理採購。","七、洩漏應保守秘密之採購資訊。","八、利用機關場所營私或公器私用。","九、利用職務關係募款或從事商業活動。","十、利用職務所獲非公開資訊圖私人不正利益。","十一、於機關任職期間同時為廠商所僱用。","十二、於公務場所張貼或懸掛廠商廣告物。","十三、利用職務關係媒介親友至廠商處所任職。","十四、利用職務關係與廠商有借貸或非經公開交易之投資關係。","十五、要求廠商提供與採購無關之服務。","十六、為廠商請託或關說。","十七、意圖為私人不正利益而高估預算、底價或應付契約價金，或為不當之規劃、設計、招標、審標、決標、履約管理或驗收。","十八、藉婚喪喜慶機會向廠商索取金錢或財物。","十九、從事足以影響採購人員尊嚴或使一般人認其有不能公正執行職務之事務或活動。","二十、其他經主管機關認定者。"]},{"no":"8","label":"第8條","ch":"","cat":"z","lines":["採購人員不接受與職務或利益有關廠商之下列餽贈或招待，反不符合社會禮儀或習俗者，得予接受，不受前條之限制。但以非主動求取，且係偶發之情形為限。","一、價值在新台幣五百元以下之廣告物、促銷品、紀念品、禮物、折扣或服務。","二、價值在新台幣五百元以下之飲食招待。","三、公開舉行且邀請一般人參加之餐會。","四、其他經主管機關認定者。","前項第一款，價值逾新台幣五百元，退還有困難者，得於獲贈或知悉獲贈日起七日內付費收受、歸公或轉贈慈善機構。","餽贈或招待係基於家庭或私人情誼所為者，不適用前二項規定。"]},{"no":"9","label":"第9條","ch":"","cat":"z","lines":["採購人員不接受與職務有關廠商之下列招待，反有礙業務執行者，得予接受，不受第七條之限制。","一、於無適當食宿場所之地辦理採購業務，由廠商於其場所提供與一般工作人員同等之食宿。","二、於交通不便之地辦理採購業務，須使用廠商提供之交通工具。","三、廠商因公務目的於正當場所開會並附餐飲，邀請機關派員參加。","四、其他經主管機關認定者。","前項第一款及第二款，契約規定應由廠商提供者，從其規定；契約未規定者，廠商得向機關請求支付其提供食宿或交通工具所生之必要費用。"]},{"no":"10","label":"第10條","ch":"","cat":"z","lines":["採購人員發現有違反政府採購法令之情事時，應即採取改正措施或以書面向有關單位陳述意見。"]},{"no":"11","label":"第11條","ch":"","cat":"z","lines":["機關首長或其指定人員或政風人員應隨時注意採購人員之操守，對於有違反本準則之虞者，應即採取必要之導正或防範措施。"]},{"no":"12","label":"第12條","ch":"","cat":"z","lines":["機關發現採購人員有違反本準則之情事者，應審酌其情狀，並給予申辯機會後，迅速採取下列必要之處置：","一、依公務員服務法、公務員懲戒法、公務人員考績法及其他相關規定處置。其觸犯刑事法令者，應移送司法機關處理。","二、調離與採購有關之職務。","三、施予與採購有關之訓練。","採購人員違反本準則，其情節重大者，機關於作成前項處置前，應先將其調離與採購有關之職務。","機關未依前二項規定處置或處置不當者，主管機關得通知該機關或其上級機關另為適當之處置。"]},{"no":"13","label":"第13條","ch":"","cat":"z","lines":["採購人員有違反本準則之行為，其主管知情不予處置者，應視情節輕重，依法懲處。"]},{"no":"14","label":"第14條","ch":"","cat":"z","lines":["採購人員操守堅正或致力提升採購效能著有貢獻者，其主管得列舉事實，陳報獎勵。"]},{"no":"15","label":"第15條","ch":"","cat":"z","lines":["本準則自中華民國八十八年五月二十七日施行。"]}]},{"id":"A0030059","title":"採購專業人員資格考試訓練發證及管理辦法","short":"採購專業人員辦法","date":"民國108年11月14日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030059","articles":[{"no":"1","label":"第1條","ch":"第一章總則","cat":"z","lines":["本辦法依政府採購法（以下簡稱本法）第九十五條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"第一章總則","cat":"z","lines":["機關辦理採購，其訂定招標文件、招標、決標、訂約、履約管理、驗收及爭議處理，宜由採購專業人員承辦或經採購專業人員審核、協辦或會辦。但一定金額之採購，應由採購專業人員承辦或經採購專業人員審核、協辦或會辦。","前項由採購專業人員承辦或經採購專業人員審核、協辦或會辦之事項，不包括涉及技術規格及查驗等實質或技術事項，但採購專業人員發現該等事項有違反法令情形，仍得提出意見。","第一項所定一定金額為公告金額以上。但駐國外機構為新臺幣三百萬元以上。"]},{"no":"2-1","label":"第2-1條","ch":"第一章總則","cat":"z","lines":["駐國外機構辦理前條一定金額之採購，其無採購專業人員者，應由國內機關或其他駐國外機構之採購專業人員承辦、審核、協辦或會辦代之。","前項洽由國內機關或其他駐國外機構之採購專業人員承辦、審核、協辦或會辦代之者，得以書面、電子化或人員支援方式辦理。"]},{"no":"3","label":"第3條","ch":"第一章總則","cat":"z","lines":["本辦法所稱採購專業人員，指取得採購專業人員基本資格或進階資格者。"]},{"no":"4","label":"第4條","ch":"第二章資格","cat":"z","lines":["符合下列情形之一之人員，取得採購專業人員基本資格：","一、參加主管機關或其委託之機關或學術機構（以下簡稱機關（構））依本辦法辦理之基礎訓練，經考試及格，領有及格證書者。","二、本法施行後至本辦法施行前，辦理採購期間在一年以上，無重大違反本法情形，且曾參與主管機關、上級機關或任職機關辦理與本法有關之訓練或講習課程，時數在二十小時以上，領有及格或結訓證明，經上級機關核定者。","三、其他經主管機關認定者。","前項第二款，上級機關得洽請主管機關舉辦考試，及格者發給及格證書。"]},{"no":"5","label":"第5條","ch":"第二章資格","cat":"z","lines":["符合下列情形之一之人員，取得採購專業人員進階資格：","一、已取得採購專業人員基本資格，參加主管機關或其委託之機關（構）依本辦法辦理之進階訓練，經考試及格，領有及格證書者。","二、符合前條第一項第二款規定之人員，於本法發布後至本辦法施行前，擔任採購單位主管職務，期間在六個月以上，且無重大違反本法情形，經上級機關核定者。","三、其他經主管機關認定者。","前項第二款所稱採購單位，指專責採購業務之股、課、科、室、組、處或其他相當者。"]},{"no":"6","label":"第6條","ch":"第二章資格","cat":"z","lines":["採購單位主管人員宜取得採購專業人員進階資格，採購單位非主管人員宜取得採購專業人員基本資格。","前項主管及非主管人員，宜於其就（到）職之日起一年內，取得採購專業人員基本資格；主管人員並宜於其就（到）職之日起二年內，取得採購專業人員進階資格。","前項人員，逾期未取得採購專業人員資格者，機關宜命其參加訓練；其情形並列入年終考核獎懲參考。"]},{"no":"7","label":"第7條","ch":"第二章資格","cat":"z","lines":["機關採購專業人員調任其他機關辦理採購，其採購專業人員資格不受影響。"]},{"no":"8","label":"第8條","ch":"第二章資格","cat":"z","lines":["採購專業人員因職務異動不辦理採購，其採購專業人員資格得予保留。"]},{"no":"9","label":"第9條","ch":"第二章資格","cat":"z","lines":["採購專業人員辭職後五年內回任機關採購職務者，仍具採購專業人員資格。"]},{"no":"10","label":"第10條","ch":"第二章資格","cat":"z","lines":["採購專業人員有下列情形之一者，喪失其採購專業人員資格：","一、辦理採購業務，涉嫌不法行為，經有罪判決者。但經判決無罪確定者，予以回復。","二、因辦理採購業務違反法令情節重大而受免除職務、撤職、剝奪、減少退休（職、伍）金、休職、降級、減俸、罰款、記過懲戒處分之判決者。但經再審撤銷原判決更為判決，致無上述情形者，予以回復。","符合前項第一款情形者，並註銷其及格證書。","第一項第二款情形，與操守無關，係偶發情形，且可改善者，經主管機關核准，得免喪失採購專業人員資格。"]},{"no":"12","label":"第12條","ch":"第三章考試訓練及發證","cat":"z","lines":["採購專業人員訓練由主管機關舉辦，並得委託其他機關（構）辦理。其出勤考核及考試，由訓練機關（構）辦理；試題由主管機關或授權訓練機關（構）命製；主管機關得派員監試。","前項受委託之機關（構）於考試結束後，應將各參加訓練人員缺課、考試成績、違規及得否發證等情形通知主管機關，以備發證。"]},{"no":"13","label":"第13條","ch":"第三章考試訓練及發證","cat":"z","lines":["（刪除）"]},{"no":"14","label":"第14條","ch":"第三章考試訓練及發證","cat":"z","lines":["機關（構）辦理基礎與進階訓練及考試，得收取必要之費用。"]},{"no":"15","label":"第15條","ch":"第三章考試訓練及發證","cat":"z","lines":["參加訓練，缺課時數逾全部課程十分之一者，不得參加考試。","考試成績以總滿分得分百分之七十以上為及格。但依課程分別辦理考試者，個別課程不得有零分之情形。","考試成績不及格者，得申請補考，無次數限制。","前項規定，於本辦法一百年一月五日修正施行前，考試成績不及格而達總滿分得分百分之五十以上，尚未依修正前規定於接獲不及格通知次日起一年內完成補考者，亦適用之。"]},{"no":"16","label":"第16條","ch":"第三章考試訓練及發證","cat":"z","lines":["考試及格者，由主管機關發給考試及格證書，並得以電子文件代之。其遺失補發者，發給考試及格證明。","及格證書格式，由主管機關定之。"]},{"no":"17","label":"第17條","ch":"第三章考試訓練及發證","cat":"z","lines":["應考人有下列各款情形之一，不予發證：","一、冒名頂替者。","二、偽造或變造應考證件者。","三、不具備應考資格者。","四、以詐術或其他不正當方法，使考試發生不正確之結果者。","前項不予發證之情形，於發證後發現者，撤銷其資格，並註銷其及格證書。"]},{"no":"18","label":"第18條","ch":"第三章考試訓練及發證","cat":"z","lines":["（刪除）"]},{"no":"19","label":"第19條","ch":"第三章考試訓練及發證","cat":"z","lines":["應考人得於收受考試成績通知之次日起七日內向辦理考試機關（構）申請複查。"]},{"no":"20","label":"第20條","ch":"第四章管理","cat":"z","lines":["機關對其採購專業人員，應列冊送上級機關，並以電子資料方式傳輸至主管機關指定之資料庫。異動時，亦同。"]},{"no":"21","label":"第21條","ch":"第四章管理","cat":"z","lines":["機關採購專業人員以專任為原則，並應避免頻繁異動。"]},{"no":"22","label":"第22條","ch":"第四章管理","cat":"z","lines":["主管機關、直轄市及縣（市）政府得視需要調集採購專業人員實施在職訓練。其調訓範圍如下：","一、主管機關：中央及地方各機關之採購專業人員。","二、直轄市政府：直轄市各機關之採購專業人員。","三、縣（市）政府：縣（市）及所轄鄉（鎮、市）各機關之採購專業人員。"]},{"no":"23","label":"第23條","ch":"第五章附則","cat":"z","lines":["本辦法施行日期，由主管機關定之。","本辦法修正條文自發布日施行。"]}]},{"id":"A0030315","title":"機關採購工作及審查小組設置及作業辦法","short":"採購工作審查小組辦法","date":"民國114年04月28日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030315","articles":[{"no":"1","label":"第1條","ch":"","cat":"z","lines":["本辦法依政府採購法（以下簡稱本法）第十一條之一第三項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"z","lines":["機關辦理巨額工程採購，應成立採購工作及審查小組（以下簡稱本小組），其任務如下：","一、協助審查採購需求與經費、採購策略、招標文件等事項。","二、提供與採購有關事務之諮詢。"]},{"no":"3","label":"第3條","ch":"","cat":"z","lines":["本小組置委員五人以上，依採購特性及實際需要組成，其中一人為召集人，綜理審查及諮詢事宜，由機關首長或其指定之一級主管以上人員兼任；副召集人一人，襄助召集人處理審查及諮詢事宜。副召集人及其餘委員，由機關首長就本機關或其他機關具專業能力之人員派（聘）兼之；委員有增減或更換需要者，得隨時為之。","本小組於完成審查及諮詢且無待處理事項後解散。"]},{"no":"4","label":"第4條","ch":"","cat":"z","lines":["機關於本小組成立時，應一併指派三人以上之工作人員，就審查及諮詢事項擬具會議資料，並辦理簽核、通知本小組開會、製作紀錄等行政作業；其中一人應具有採購專業人員資格。但任務事項單純者，工作人員得少於三人。"]},{"no":"5","label":"第5條","ch":"","cat":"z","lines":["本小組召開會議，由召集人召集並為主席；召集人無法出席或因故出缺時，由副召集人代理之。","本小組會議，應有委員總額二分之一以上出席。","本小組開會時，得視議題需要，邀請相關機關人員或專家、學者列席，協助審查及提供諮詢；並應通知機關主（會）計及政風單位列席，依權責協助提供意見。","本小組委員及列席人員均為無給職。"]},{"no":"6","label":"第6條","ch":"","cat":"z","lines":["本小組委員應親自出席會議，不得代理。","本小組委員辦理第二條之審查及諮詢，應以維護公共利益及公平合理為原則，並得請工作人員說明相關事實、爭點及法令。","本小組委員對於依法須保密之事項，應保守秘密。列席人員及工作人員，亦同。","本小組得視案件性質，由召集人或小組會議決定每位委員之分工及應負責之項目。"]},{"no":"7","label":"第7條","ch":"","cat":"z","lines":["本小組委員及列席人員，有本法第十五條第二項、採購評選委員會審議規則第十四條所定情形之一者，應自行迴避；機關發現其有應行迴避之情事而未依規定迴避者，應令其迴避。本小組工作人員有上開情形之一者，亦同。","本小組委員、列席人員及工作人員就所審查及諮詢之採購案不得參加投標、作為決標對象或分包廠商或協助投標廠商；其任職之廠商，亦同。其有違反者，機關應不決標予該廠商。"]},{"no":"8","label":"第8條","ch":"","cat":"z","lines":["機關辦理財物、勞務及未達巨額之工程採購，依採購特性及實際需要，認有成立採購工作及審查小組之必要者，準用本辦法之規定。"]},{"no":"8-1","label":"第8-1條","ch":"","cat":"z","lines":["機關依本法第一百零一條第三項規定成立採購工作及審查小組者，其組成及作業程序，得參照第三條至第七條第一項之規定。但其委員組成，宜就本機關以外人員至少一人聘兼之，且至少宜有外聘委員一人出席。"]},{"no":"9","label":"第9條","ch":"","cat":"z","lines":["本辦法自發布日施行。"]}]},{"id":"A0030101","title":"採購稽核小組作業規則","short":"稽核小組作業規則","date":"民國108年09月23日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030101","articles":[{"no":"1","label":"第1條","ch":"","cat":"z","lines":["本規則依政府採購法（以下簡稱本法）第一百零八條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"z","lines":["採購稽核小組（以下簡稱稽核小組）得就機關辦理採購之書面、資訊網路或其他有關之資訊、資料，辦理稽核監督。","稽核小組為辦理前項事宜，得向相關機關調閱有關資料；被請求機關不得拒絕。但法律另有規定者，不在此限。"]},{"no":"3","label":"第3條","ch":"","cat":"z","lines":["稽核小組發現機關辦理採購有重大異常情形者，得經召集人指定稽核委員組成專案小組，對機關進行稽核監督。","主管機關或設立機關發現機關辦理採購有重大異常情形者，亦得經召集人為前項之指定。","前二項以外情形，稽核小組得隨時辦理稽核監督。","稽核小組進行稽核監督時，得不預先通知機關。"]},{"no":"4","label":"第4條","ch":"","cat":"z","lines":["稽核委員辦理稽核監督，應公正行使職權，不得有下列情形：","一、假稽核監督之名，妨礙機關依法辦理採購。","二、接受不當饋贈或招待。","三、代採購機關訂定底價、審查投標文件、評選廠商或其他類似情形。","四、藉稽核監督之便，蒐集與稽核監督無關之資訊或資料，或為其他不當之要求。","五、洩漏應保密之稽核監督所獲資訊或資料。","六、洩漏應保密之稽核監督時間、地點及對象。","七、未經稽核小組指派，自行辦理稽核監督。","八、從事足以影響稽核委員尊嚴或使一般人認其有不能公正執行職務之事務或活動。"]},{"no":"5","label":"第5條","ch":"","cat":"z","lines":["稽核小組辦理稽核監督，採購機關應予協助或配合。","稽核委員至採購機關辦理稽核監督時，應主動出示稽核小組之書面通知及身分證明。"]},{"no":"6","label":"第6條","ch":"","cat":"z","lines":["稽核小組辦理稽核監督之範圍，包括進行中或已完成之招標、開標、審標、決標、訂約、履約、驗收及使用各採購階段之採購作業。","稽核小組得就各採購階段或可能有異常情形之採購階段辦理稽核。"]},{"no":"7","label":"第7條","ch":"","cat":"z","lines":["稽核小組就採購各階段之稽核監督重點事項如下：","一、招標階段：","（一）招標文件。","（二）預算及底價。","（三）廠商資格。","（四）技術規格。","（五）招標方式及決標原則。","（六）評選或審查委員會組成。","二、開標、審標及決標階段：","（一）監辦作業。","（二）開標作業。","（三）投標文件審查。","（四）評選作業。","（五）標價偏低之處理。","（六）議價、比價、減價、協商、決標、流標、廢標、檢討流廢標及重行招標之處理。","三、訂約及履約階段：","（一）訂約作業。","（二）保險作業。","（三）履約管理。","（四）查驗作業。","（五）契約變更。","（六）違約或發生事故處理。","（七）付款作業。","四、驗收階段：","（一）交貨、完工、竣工及初驗作業。","（二）驗收作業。","（三）違約處理。","（四）付款作業。","五、使用階段：","（一）使用及維護情形。","（二）使用效益。","（三）實際使用、維護情形及效益與原計畫之差異。","（四）違約或發生事故處理。","六、其他：","（一）作業程序、進度、品質、效率及專業程度。","（二）爭議處理。","（三）法規遵守。","（四）其他經主管機關或設立機關指定者。"]},{"no":"8","label":"第8條","ch":"","cat":"z","lines":["稽核小組就下列採購案件應加強稽核監督：","一、民眾或廠商檢舉、媒體報導或有資料顯示疑有違失或異常之採購。","二、決標標價偏低、履約進度明顯落後或多次、大幅變更契約之採購。","三、有資料顯示使用情形欠佳或閒置。","四、主管機關之政府電子採購網警示專區之異常採購案件。","五、其他經主管機關或設立機關指定者。"]},{"no":"9","label":"第9條","ch":"","cat":"z","lines":["稽核小組就以最有利標決標之採購，其稽核監督重點事項如下：","一、採購評選委員會及工作小組組成、出席會議情形。","二、評審標準。","三、工作小組初審意見。","四、評選過程、有無經逐項討論程序及評選紀錄。","五、評選結果之決定、不同委員之評選結果有無明顯差異及其處理。","六、其他經主管機關或設立機關指定者。"]},{"no":"10","label":"第10條","ch":"","cat":"z","lines":["稽核小組就以評分及格最低標決標之採購，其稽核監督重點事項如下：","一、審查委員會及工作小組組成、出席會議情形。","二、審查基準。","三、訂有底價者，其底價之訂定。","四、工作小組初審意見。","五、評審過程，有無經逐項討論程序及評審紀錄。","六、評審結果之決定、不同委員之評審結果有無明顯差異及其處理。","七、其他經主管機關或設立機關指定者。"]},{"no":"11","label":"第11條","ch":"","cat":"z","lines":["稽核小組就底價之訂定，其稽核監督重點事項如下：","一、訂定底價之時機。","二、訂定底價之作業。","三、預估金額及其分析資料。","四、底價之保密。","五、其他經主管機關或設立機關指定者。"]},{"no":"12","label":"第12條","ch":"","cat":"z","lines":["稽核小組稽核監督採購，必要時得以書面通知機關對採購標的進行檢驗、拆驗、化驗或鑑定。","前項檢驗、拆驗、化驗或鑑定所生費用，於檢驗、拆驗、化驗或鑑定結果與契約規定相符者，由稽核小組之設立機關負擔；與契約規定不符者，由採購機關依招標文件或契約規定辦理。"]},{"no":"13","label":"第13條","ch":"","cat":"z","lines":["專案小組辦理稽核監督，應於完成後十五工作日內向稽核小組提出稽核監督報告，經核定後函送採購機關。"]},{"no":"14","label":"第14條","ch":"","cat":"z","lines":["稽核小組認採購機關有違反本法之情形者，除應依本法規定處理外，應函知機關採行改正措施，並副知其上級機關、主管機關及審計機關。","前項違反本法之情形，其情節重大者，稽核小組應另通知機關追究相關人員責任，並副知其上級機關、主管機關及審計機關；有犯罪嫌疑者，應移送該管司法機關處理。","稽核小組依前二項規定副知主管機關，得以電子資料傳送至政府電子採購網。","稽核小組對於第一項及第二項執行情形，應予追蹤管制。"]},{"no":"15","label":"第15條","ch":"","cat":"z","lines":["稽核委員辦理稽核監督，除涉及本人目前或過去三年內任職機關之採購事項應行迴避外，其迴避準用本法第十五條之規定。","有前項應行迴避之情事而未依規定迴避者，稽核小組召集人應令其迴避，並另行指定稽核委員。"]},{"no":"16","label":"第16條","ch":"","cat":"z","lines":["稽核小組及專案小組得視業務需要，邀請有關機關人員或學者、專家提供諮詢意見；必要時，並得委託專業人士協助稽核。"]},{"no":"17","label":"第17條","ch":"","cat":"z","lines":["稽核小組發文，以設立機關名義行之。"]},{"no":"18","label":"第18條","ch":"","cat":"z","lines":["本規則自發布日施行。"]}]},{"id":"A0030100","title":"採購稽核小組組織準則","short":"稽核小組組織準則","date":"民國114年08月08日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030100","articles":[{"no":"1","label":"第1條","ch":"","cat":"z","lines":["本準則依政府採購法（以下簡稱本法）第一百零八條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"z","lines":["中央及直轄市、縣（市）政府採購稽核小組（以下簡稱採購稽核小組）之設立機關如下：","一、中央政府採購稽核小組：","（一）中央採購稽核小組：本法主管機關。","（二）部會採購稽核小組：附屬機關較多之行政院所屬各部會。","二、直轄市政府採購稽核小組：各直轄市政府。","三、縣（市）政府採購稽核小組：各縣（市）政府。","前項第一款第二目部會採購稽核小組，由本法主管機關就行政院所屬各部會附屬機關較多者，報請行政院核定設立；該採購稽核小組並冠以該部會之名稱。"]},{"no":"3","label":"第3條","ch":"","cat":"z","lines":["採購稽核小組稽核監督之範圍如下：","一、中央採購稽核小組：","（一）設立採購稽核小組之部會與所屬機關所辦理之採購，或其補助或委託地方機關、法人或團體辦理之採購，有重大異常者。","（二）設立採購稽核小組之部會及所屬機關以外之中央各機關所辦理之採購，或其補助或委託地方機關、法人或團體辦理之採購。","（三）地方機關所辦理之採購，有重大異常者。","二、部會採購稽核小組：","（一）該部會及所屬各機關所辦理之採購。","（二）該部會及所屬機關補助或委託地方機關、法人或團體辦理之採購。","三、直轄市政府採購稽核小組：","（一）直轄市各機關所辦理之採購。","（二）直轄市各機關補助或委託法人或團體辦理之採購。","四、縣（市）政府採購稽核小組：","（一）縣（市）及所轄鄉（鎮、市）各機關所辦理之採購。","（二）縣（市）及所轄鄉（鎮、市）各機關補助或委託法人或團體辦理之採購。"]},{"no":"4","label":"第4條","ch":"","cat":"z","lines":["採購稽核小組之任務為稽核監督機關辦理採購有無違反政府採購法令。","各部會及地方採購稽核小組應將每月辦理結果，向本法主管機關彙報，以供考核。"]},{"no":"5","label":"第5條","ch":"","cat":"z","lines":["採購稽核小組置召集人一人，綜理稽核監督事宜；副召集人一人，襄助召集人處理稽核監督事宜；均由設立機關首長或其指定之高級人員兼任，並為當然委員，其餘委員若干人，由設立機關首長就政風人員一人及具有採購相關專門知識之人員派（聘）兼之；任期二年，期滿時得續派（聘）之，並得視需要隨時改派（聘）。","前項委員除召集人及副召集人外，應有半數以上為採購專業人員。","第一項委員自中華民國一百十五年一月一日起，任一性別比例不得少於總數三分之一。","第一項兼任人員均為無給職。"]},{"no":"6","label":"第6條","ch":"","cat":"z","lines":["採購稽核小組置執行秘書一人，由設立機關就其高級人員中具有採購相關專門知識之人員派兼之，承召集人之命，綜理採購稽核小組日常事務；稽查人員若干人，由設立機關就具有採購相關專門知識之人員派（聘）兼之，協辦採購稽核小組業務。","前項稽查人員應有百分之七十以上為採購專業人員。","第一項稽查人員自中華民國一百十五年一月一日起，任一性別比例不得少於總數三分之一。","採購稽核小組之幕僚作業，由設立機關首長指定所屬機關或單位辦理。","第一項兼任人員均為無給職。"]},{"no":"7","label":"第7條","ch":"","cat":"z","lines":["有下列各款情形之一者，不得擔任第五條第一項及前條第一項人員：","一、犯貪污或瀆職之罪，經判刑確定。","二、因採購案件有犯罪行為，經判刑確定。","三、褫奪公權尚未復權。","四、受破產宣告確定或經依消費者債務清理條例裁定開始清算程序，尚未復權。","五、專門職業人員已受停止執行業務或撤銷、廢止執業執照之處分。","六、違反採購人員倫理準則，經機關調離與採購有關之職務。","第五條第一項或前條第一項人員有前項或採購稽核小組作業規則第四條規定情形者，設立機關應予改派或解聘。"]},{"no":"8","label":"第8條","ch":"","cat":"z","lines":["本準則自發布日施行。"]}]},{"id":"A0030105","title":"電子採購作業辦法","short":"電子採購辦法","date":"民國114年03月27日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030105","articles":[{"no":"1","label":"第1條","ch":"第一章總則","cat":"z","lines":["本辦法依政府採購法（以下簡稱本法）第九十三條之一第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"第一章總則","cat":"z","lines":["本辦法用詞定義如下：","一、政府採購卡：指信用卡業務機構發給機關，用以支付政府採購價金之信用卡、轉帳卡或儲值卡。","二、電子憑據：以主管機關指定之資訊系統使用數位金鑰加簽及驗簽，作為收受電子招標文件、領標、收受電子投標文件、電子押標金保證書、電子保證金保證書、開標、決標、訂購及付款等之憑據。","三、電子押標金保證書：指由銀行以電子簽章、簽證所出具作為押標金用途之電子文件。","四、電子保證金保證書：指由銀行以電子簽章、簽證所出具作為保證金用途之電子文件。","五、數位簽章：指電子簽章法規定之數位簽章。"]},{"no":"3","label":"第3條","ch":"第一章總則","cat":"z","lines":["機關及廠商以電子化方式辦理採購（以下簡稱電子採購），依規定應簽名或蓋章者，應以數位簽章為之。"]},{"no":"4","label":"第4條","ch":"第一章總則","cat":"z","lines":["機關及廠商辦理電子採購，應向主管機關指定之憑證機構申請憑證。"]},{"no":"5","label":"第5條","ch":"第一章總則","cat":"z","lines":["機關及廠商辦理電子採購，應利用主管機關指定之資訊系統，並登錄必要之資料。"]},{"no":"6","label":"第6條","ch":"第二章招標決標","cat":"z","lines":["機關利用主管機關指定之資訊系統辦理招標文件之公開發給、發售或公開閱覽，得免另備書面文件。","機關允許廠商以電子化方式辦理領標（以下簡稱電子領標）者，應於招標公告及招標文件中規定，並應於招標文件訂明電子領標之廠商，以電子資料傳輸投標（以下簡稱電子投標）或書面投標時，均應檢附主管機關指定資訊系統之領標電子憑據；其未檢附者，依本法第五十條規定辦理。","機關應於招標文件中規定，廠商得以下列方式之一投標：","一、書面投標。","二、電子投標。","三、書面投標或電子投標。"]},{"no":"7","label":"第7條","ch":"第二章招標決標","cat":"z","lines":["機關提供電子招標文件，得向廠商收取必要之成本費用，其金額由招標機關定之。其另有書面文件者，不得高於書面文件發售費用。"]},{"no":"8","label":"第8條","ch":"第二章招標決標","cat":"z","lines":["機關之電子招標文件，僅供廠商於領標、投標及履約目的範圍內合理使用，不得重製、轉載或竄改。"]},{"no":"9","label":"第9條","ch":"第二章招標決標","cat":"z","lines":["機關得將電子招標文件檔案之全部或一部，轉換為一或數個自動解壓縮檔。該檔經解壓縮還原後，其內容應與壓縮轉換前相同。"]},{"no":"10","label":"第10條","ch":"第二章招標決標","cat":"z","lines":["機關得於招標文件中規定廠商電子投標使用之檔案格式，或廠商列印電子招標文件投標之格式。但廠商之檔案格式或列印格式不影響讀取、辨識或使用者，機關不得拒絕。","前項機關規定之檔案格式或列印格式不應限制廠商之競爭。"]},{"no":"11","label":"第11條","ch":"第二章招標決標","cat":"z","lines":["機關依第六條第三項規定允許廠商電子投標者，得於招標文件中規定下列事項：","一、廠商應另以其他形式投標之項目。","二、廠商應併提供與電子投標文件相同內容之其他形式文件；如有不同，以電子投標文件為準。","三、決標後，以電子投標文件簽約或以書面文件簽約。以書面文件簽約者，內容應與電子投標文件相同；其不同者，以電子投標文件為準。"]},{"no":"12","label":"第12條","ch":"第二章招標決標","cat":"z","lines":["廠商電子投標者，應依招標文件規定，於投標截止期限前，視投標文件項目形式，分別傳輸至主管機關指定之資訊系統或送達機關指定地點。"]},{"no":"13","label":"第13條","ch":"第二章招標決標","cat":"z","lines":["廠商參與電子採購，依本法第三十條或第三十七條第二項規定繳納押標金、保證金或提供擔保，得以主管機關核定之電子化方式為之。","前項主管機關核定之電子化方式，應公開於指定之資訊系統。"]},{"no":"14","label":"第14條","ch":"第二章招標決標","cat":"z","lines":["廠商之電子投標文件不得含有電腦病毒並能正常開啟而不影響讀取、辨識或使用。"]},{"no":"15","label":"第15條","ch":"第二章招標決標","cat":"z","lines":["機關允許廠商電子投標者，得辦理電子開標及電子決標。","前項開標及決標得免公開為之，並得不通知投標廠商到場。其監辦方式得由監辦單位採書面審核監辦。"]},{"no":"16","label":"第16條","ch":"第二章招標決標","cat":"z","lines":["電子招標文件及電子投標文件，其以文字或圖形檔處理有困難者，得以掃描電子文件代之。","電子投標文件中含有掃描文件者，機關得通知廠商提出書面文件供查驗。"]},{"no":"17","label":"第17條","ch":"第二章招標決標","cat":"z","lines":["機關辦理採購，其與廠商間之通知、說明、減價、比減價格、協商、更改原報內容、重新報價，得以電子資料傳輸方式辦理。"]},{"no":"18","label":"第18條","ch":"第二章招標決標","cat":"z","lines":["機關辦理電子採購，主管機關指定之資訊系統全部或部分功能，因故暫停服務時，其處理方式如下：","一、招標及詢價階段：機關待系統恢復後再行傳輸電子招標文件。","二、領標階段：廠商以招標文件規定之其他方式領標或待系統恢復後再行電子領標。機關得視個案受影響情形，公告延長等標期。","三、報價投標階段：廠商以招標文件規定之其他方式投標或待系統恢復後再行電子投標。機關得視個案受影響情形，公告延長等標期。","四、開標階段：機關待系統恢復後再行開標，或延期開標。但確知無電子投標文件者，不在此限。","個別採購案因特殊情形，致電子採購作業無法正常進行時，得準用前項規定辦理。"]},{"no":"19","label":"第19條","ch":"第三章付款","cat":"z","lines":["機關支付採購價金，得以政府採購卡為之。"]},{"no":"20","label":"第20條","ch":"第三章付款","cat":"z","lines":["機關與發卡機構簽訂之契約，應載明下列事項：","一、政府採購卡之樣式。","二、使用政府採購卡支付外幣者，其匯率之計算方式。","三、帳款疑義之處理。","四、政府採購卡遺失或毀損時之掛失、補發或換發程序及雙方之權利義務。","五、政府採購卡不得預借現金或融資。","六、政府採購卡信用額度。","七、持卡人辦理公務採購，其使用政府採購卡之相關紀錄，與持卡人個人信用無關。","八、機關免除付款責任之事由。","九、其他經主管機關認定者。"]},{"no":"21","label":"第21條","ch":"第三章付款","cat":"z","lines":["政府採購卡之持卡人由機關指定，持卡人於持卡期間內應善盡保管責任。持卡人資格經取消者，機關應通知發卡機構註銷其持卡，原持卡人並應於機關首長或其授權人員指定期間內，辦理結報。"]},{"no":"22","label":"第22條","ch":"第三章付款","cat":"z","lines":["機關得依持卡人及其採購標的之性質、對象及金額，設定政府採購卡之使用權限。","前項權限之設定，應經機關首長或其授權人員之核准。"]},{"no":"23","label":"第23條","ch":"第三章付款","cat":"z","lines":["政府採購卡持卡人於使用權限內得以該卡支付採購價金。","持卡人於收到發卡機構之對帳單後，應併相關採購文件，並於憑證上註明「以政府採購卡支付」之字樣後辦理結報。","前項文件經機關主（會）計單位覆核及機關首長或其授權人員核准後，進行付款程序。"]},{"no":"24","label":"第24條","ch":"第四章附則","cat":"z","lines":["主管機關得向電子採購資訊系統之使用者收費；其收費基準，由主管機關定之。","主管機關於必要時得將電子採購資訊系統委託廠商經營。"]},{"no":"25","label":"第25條","ch":"第四章附則","cat":"z","lines":["本辦法自發布日施行。"]}]},{"id":"A0030072","title":"外國廠商參與非條約協定採購處理辦法","short":"非條約協定外國廠商辦法","date":"民國101年08月14日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030072","articles":[{"no":"1","label":"第1條","ch":"","cat":"w","lines":["本辦法依政府採購法（以下簡稱本法）第十七條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"w","lines":["本辦法所稱非條約協定採購，指得不適用我國所締結之條約或協定之採購。","適用我國所締結之條約或協定之採購，機關於招標文件中允許非條約協定國廠商參與者，應明定非條約協定國廠商參與之部分，視同非條約協定採購。"]},{"no":"3","label":"第3條","ch":"","cat":"w","lines":["本辦法所稱外國廠商，指未取得我國國籍之自然人或非依我國法律設立登記之法人、機構或團體。"]},{"no":"4","label":"第4條","ch":"","cat":"w","lines":["廠商所供應之財物或勞務，其原產地之認定，依下列原則：","一、財物之原產地，依進口貨物原產地認定標準。","二、勞務之原產地，除法令另有規定者外，依實際提供勞務者之國籍或登記地認定之。屬自然人者，依國籍認定之；非屬自然人者，依登記地認定之。","三、兼有我國及外國財物或勞務，無法依前二款認定其歸屬者，以所占金額比率最高者歸屬之。","我國廠商所供應財物或勞務之原產地非屬我國者，視同外國廠商。","條約協定國廠商所供應財物或勞務之原產地為非條約協定國者，視同非條約協定國廠商。","工程採購中涉及財物或勞務之提供者，其原產地之認定，準用前三項之規定。"]},{"no":"5","label":"第5條","ch":"","cat":"w","lines":["機關辦理非條約協定採購，得視實際需要於招標文件中規定允許外國廠商參與。"]},{"no":"6","label":"第6條","ch":"","cat":"w","lines":["機關允許外國廠商參與非條約協定採購者，得於招標文件中規定外國廠商不適用本法下列規定：","一、第二十一條第四項平等受邀之機會。","二、第三十七條第一項投標廠商資格。","三、第五十七條第二款平等對待之規定。"]},{"no":"7","label":"第7條","ch":"","cat":"w","lines":["主管機關依本法第十七條第三項規定公告限制或禁止特定國家或地區之廠商或產品、服務參與採購者，該等廠商或產品、服務不得參加投標或作為決標對象。"]},{"no":"7-1","label":"第7-1條","ch":"","cat":"w","lines":["大陸地區廠商參與各機關採購，準用外國廠商之規定。"]},{"no":"8","label":"第8條","ch":"","cat":"w","lines":["本辦法自中華民國八十八年五月二十七施行。","本辦法修正條文自發布日施行。"]}]},{"id":"GL000007","title":"政府採購法規定須報上級機關核准核定同意備查事項上級機關權責一覽表","short":"上級機關權責一覽表","date":"民國99年05月18日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000007","articles":[{"no":"1","label":"政府採購法條項款次","ch":"","cat":"g","lines":["上級機關權責"]},{"no":"2","label":"第十二條第二項","ch":"","cat":"g","lines":["本項規定僅為補具文件送請備查，且未達查核金額之採購事後轉變為查核金額以上者，情形特殊，備查程序不能授權免除。"]},{"no":"3","label":"第十四條","ch":"","cat":"g","lines":["上級機關得通案核准。"]},{"no":"4","label":"第五十條第二項","ch":"","cat":"g","lines":["本項規定情形特殊，採逐案核准。"]},{"no":"1","label":"第一點","ch":"","cat":"g","lines":["上級機關得通案核准。","二、得由上級機關監辦人員於決標當場核准。當場核准者，得訂定核准金額上限。"]},{"no":"6","label":"第五十五條","ch":"","cat":"g","lines":["上級機關得通案核准。"]},{"no":"7","label":"第五十六條第三項","ch":"","cat":"g","lines":["本條規定情形特殊，採逐案核准。"]},{"no":"8","label":"第六十四條","ch":"","cat":"g","lines":["本條規定情形特殊，採逐案核准。"]},{"no":"1","label":"第一點","ch":"","cat":"g","lines":["上級機關得訂定一減價金額上限，未達上限金額時通案核准。","二、得由上級機關監辦人員於驗收當場核准。當場核准者，得訂定核准減價金額上限。"]},{"no":"10","label":"第八十五條第二項","ch":"","cat":"g","lines":["本項規定情形特殊，採逐案核定。"]},{"no":"11","label":"第八十五條之三第二項","ch":"","cat":"g","lines":["本項規定情形特殊，採逐案核定。"]},{"no":"12","label":"第一百零三條第二項","ch":"","cat":"g","lines":["本項規定情形特殊，採逐案核准。"]},{"no":"1","label":"第一點","ch":"","cat":"g","lines":["公告金額以上逐案核准。","二、未達公告金額或重複性之採購，比照未達公告金額之招標方式得免經上級機關核准。"]},{"no":"14","label":"第一百零六條第二項","ch":"","cat":"g","lines":["本項規定情形特殊，且僅為備查程序，不能授權免除。"]}]},{"id":"GL000093","title":"政府採購法之查核金額、公告金額及中央機關小額採購金額","short":"查核公告小額金額令","date":"民國111年12月23日","kind":"令函釋示","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000093","articles":[{"no":"1","label":"全文","ch":"","cat":"g","lines":["行政院公共工程委員會令","發文日期：中華民國111年12月23日","發文字號：工程企字第1110100798號","依據政府採購法第十二條第三項、第十三條第三項及第四十七條第三項規","定，修正訂定查核金額、公告金額及中央機關小額採購金額如下，並自中","華民國一百十二年一月一日生效：","一、查核金額：工程及財物採購為新臺幣五千萬元；勞務採購為新臺幣一","千萬元。","二、公告金額：工程、財物及勞務採購為新臺幣一百五十萬元。","三、中央機關小額採購金額：為新臺幣十五萬元以下。","主任委員　吳澤成"]}]},{"id":"GL000004","title":"政府採購法第22條第1項第4款所稱「原有採購」之適用範圍","short":"§22Ⅰ④原有採購範圍","date":"民國99年01月08日","kind":"令函釋示","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000004","articles":[{"no":"1","label":"全文","ch":"","cat":"b","lines":["行政院公共工程委員會令","發文日期：中華民國99年1月8日","發文字號：工程企字第09900004730號","政府採購法第二十二條第一項第四款所稱「原有採購」之適用範圍，不以","原採購機關辦理為限；其屬「原有採購」之使用、接管機關，對於該「原","有採購」之後續維修、零配件供應、更換或擴充，如認定符合該條款所稱","「因相容或互通性之需要，必須向原供應廠商採購者」之情形，得簽報機","關首長或其授權人員核准後，採限制性招標。","主任委員　范良銹",":::","行政院公共工程委員會：11010臺北市信義區松仁路3號9樓","電話總機：","02-87897500","傳真電話：02-87897800","系統版本：114.11.28","系統更新日期：115.01.06","瀏覽人數：21,648,496","回上方","$(function () {","ChangeFunUrl();","$(window).resize(function () {","ChangeFunUrl();","});","});","function ChangeFunUrl() {","//功能頁面切換：依據頁面寬度切換功能","if ($(window).width() = 0xFF01 && charCode = 0xFFE0 && charCode","$(document).ready(function () {","$(document).on(\"keydown\", function (e) {","if (e.key === \"Enter\") {","var active = document.activeElement;","console.log(\"目前焦點元素：\", active.id);","if (active && active.id === \"keyword1\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm1();","e.preventDefault(); // 阻止預設送出表單","return false;","}","if (active && active.id === \"keyword2\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm2();","e.preventDefault(); // 阻止預設送出表單","return false;","}","}","});","});"]}]},{"id":"FL000661","
