四條之規定。"]},{"no":"8","label":"第八點","ch":"","cat":"z","lines":["八、重大採購事件經本會評估為效益卓著者，本會得函請機關就有功人員","予以獎勵。"]},{"no":"9","label":"第九點","ch":"","cat":"z","lines":["九、本會依本法第一百十一條第一項規定派員查核機關提報使用情形及其","效益分析，其非屬重大採購事件者，得準用本作業要點之規定。"]}]}],"quiz":[{"c":"g","q":"政府採購法所稱「採購」，不包括下列何者？","o":["工程之定作","財物之買受、定製、承租","勞務之委任或僱傭","機關多餘不用堪用財物之無償讓與"],"a":3,"e":"§2 所稱採購指工程之定作、財物之買受、定製、承租及勞務之委任或僱傭等。堪用財物無償讓與規定在 §100Ⅱ，不屬「採購」。","r":"A0030057#2"},{"c":"g","q":"下列何者非政府採購法第 3 條所稱之「機關」？","o":["政府機關","公立學校","公營事業","私立大學"],"a":3,"e":"§3 明定機關指政府機關、公立學校、公營事業三者。私立大學若受補助達 §4 要件才適用本法。","r":"A0030057#3"},{"c":"g","q":"法人或團體接受機關補助辦理採購，須同時具備何種要件始適用本法？","o":["補助金額占採購金額半數以上，且補助金額在公告金額以上","補助金額占採購金額三分之一以上，且採購金額在公告金額以上","補助金額占採購金額半數以上，或補助金額在公告金額以上","補助金額在查核金額以上"],"a":0,"e":"§4Ⅰ 兩要件須「且」同時具備：占採購金額半數以上 **且** 補助金額在公告金額以上。","r":"A0030057#4"},{"c":"g","q":"受機關補助之「藝文採購」，其適用情形為何？","o":["完全不受監督","不適用 §4Ⅰ，但應受補助機關監督，辦法由文化部定之","一律適用本法全部規定","由主管機關（工程會）另定辦法"],"a":1,"e":"§4Ⅱ：藝文採購不適用 §4Ⅰ，但仍應受補助機關監督；辦理原則、適用範圍及監督管理辦法由**文化部**定之。","r":"A0030057#4"},{"c":"g","q":"本法所稱「工程」，下列敘述何者錯誤？","o":["指在地面上下新建、增建、改建、修建、拆除構造物與其所屬設備","包括改變自然環境之行為","包括建築、土木、水利、環境、交通、機械、電氣、化工","生鮮農漁產品之採購亦屬工程"],"a":3,"e":"§7Ⅰ 定義工程；生鮮農漁產品是被排除在「財物」定義之外（§7Ⅱ），與工程無關。","r":"A0030057#7"},{"c":"g","q":"採購兼有工程、財物、勞務二種以上性質，難以認定歸屬時，應如何處理？","o":["一律認定為工程","按其性質所占預算金額比率最高者歸屬之","由機關首長裁量","報請主管機關認定"],"a":1,"e":"§7Ⅳ：按其性質所占**預算金額比率最高**者歸屬之。","r":"A0030057#7"},{"c":"g","q":"本法所稱「上級機關」，指下列何者？","o":["行政院","辦理採購機關直屬之上一級機關","主管機關","審計機關"],"a":1,"e":"§9Ⅱ：上級機關指辦理採購機關**直屬之上一級**機關；其無上級機關者，由該機關自行執行上級機關職權。","r":"A0030057#9"},{"c":"g","q":"機關辦理查核金額以上採購之開標、比價、議價、決標及驗收，應如何處理？","o":["由主（會）計單位會同監辦","於規定期限內檢送相關文件報請上級機關派員監辦","報請審計機關派員監辦","報請主管機關核准"],"a":1,"e":"§12Ⅰ：查核金額以上→報請**上級機關**派員監辦；上級機關得訂授權條件由機關自辦。","r":"A0030057#12"},{"c":"g","q":"機關辦理未達查核金額之採購，其決標金額達查核金額者，應如何處理？","o":["重新招標","補具相關文件送上級機關備查","報請上級機關核准後決標","無須任何處理"],"a":1,"e":"§12Ⅱ：決標金額或契約變更後金額達查核金額者，應**補具文件送上級機關備查**。","r":"A0030057#12"},{"c":"g","q":"關於公告金額，下列敘述何者正確？","o":["公告金額應高於查核金額","公告金額應低於查核金額，由主管機關參酌國際標準定之","公告金額由行政院定之","公告金額由各機關自行訂定"],"a":1,"e":"§13Ⅲ：公告金額應**低於**查核金額，由主管機關**參酌國際標準**定之。","r":"A0030057#13"},{"c":"g","q":"現行公告金額為新臺幣多少元？","o":["100 萬元","150 萬元","200 萬元","1,000 萬元"],"a":1,"e":"公告金額自民國 112 年 1 月 1 日起調整為新臺幣 **150 萬元**（工程、財物、勞務均同）。","r":"A0030057#13"},{"c":"g","q":"現行查核金額，工程及財物採購為多少？勞務採購為多少？","o":["工程財物 5,000 萬、勞務 1,000 萬","工程財物 1 億、勞務 2,000 萬","工程財物 5,000 萬、勞務 2,000 萬","工程財物 2 億、勞務 1,000 萬"],"a":0,"e":"現行查核金額：工程及財物採購 **5,000 萬元**；勞務採購 **1,000 萬元**。","r":"A0030057#12"},{"c":"g","q":"依投標廠商資格與特殊或巨額採購認定標準，巨額採購之金額為何？","o":["工程 2 億、財物 1 億、勞務 2,000 萬","工程 1 億、財物 2 億、勞務 2,000 萬","工程 2 億、財物 1 億、勞務 1,000 萬","工程 5,000 萬、財物 5,000 萬、勞務 1,000 萬"],"a":0,"e":"認定標準 §8：工程 **2 億元**、財物 **1 億元**、勞務 **2,000 萬元**。","r":"A0030099#8"},{"c":"g","q":"機關不得意圖規避本法之適用而分批辦理公告金額以上之採購，若有分批必要應如何？","o":["報主管機關核准","經上級機關核准，並依其總金額核計採購金額","由機關首長核准即可","一律禁止分批"],"a":1,"e":"§14：有分批必要並經**上級機關核准**者，應依其**總金額**核計採購金額，分別按公告金額或查核金額以上之規定辦理。","r":"A0030057#14"},{"c":"g","q":"機關承辦、監辦採購人員離職後多久內，不得為本人或代理廠商向原任職機關接洽處理離職前多久內與職務有關之事務？","o":["離職後 2 年內、離職前 3 年內","離職後 3 年內、離職前 5 年內","離職後 5 年內、離職前 3 年內","離職後 1 年內、離職前 1 年內"],"a":1,"e":"§15Ⅰ：離職後**三年**內、離職前**五年**內。記法「離三回五」。","r":"A0030057#15"},{"c":"g","q":"機關人員對於與採購有關事項，涉及下列何者之利益時應行迴避？","o":["本人、配偶、二親等以內親屬或共同生活家屬","本人、配偶、三親等以內親屬","本人及配偶","本人、配偶、四親等以內親屬"],"a":0,"e":"§15Ⅱ：涉及本人、配偶、**二親等以內親屬**，或**共同生活家屬**之利益時應迴避。","r":"A0030057#15"},{"c":"g","q":"關於請託或關說，下列敘述何者正確？","o":["一律禁止並處罰","宜以書面為之或作成紀錄，且不得作為評選之參考","僅限機關首長得受理","應報請上級機關核准"],"a":1,"e":"§16：請託或關說**宜以書面為之或作成紀錄**；政風機構得調閱；且**不得作為評選之參考**。","r":"A0030057#16"},{"c":"g","q":"外國廠商參與各機關採購，應依何規定辦理？","o":["一律依本法","依我國締結之條約或協定之規定辦理","依外國廠商所屬國法令","由機關自行決定"],"a":1,"e":"§17Ⅰ：外國廠商參與採購，應依**我國締結之條約或協定**辦理；其以外情形，依主管機關訂定之處理辦法。","r":"A0030057#17"},{"c":"g","q":"外國法令限制或禁止我國廠商或產品服務參與採購者，主管機關得如何處理？","o":["提交 WTO 爭端解決","得限制或禁止該國廠商或產品服務參與採購","報請行政院決定","無任何處理方式"],"a":1,"e":"§17Ⅲ：主管機關得**限制或禁止**該國廠商或產品服務參與採購（互惠原則）。","r":"A0030057#17"},{"c":"g","q":"機關辦理巨額工程採購，依法應成立下列何者？","o":["採購評選委員會","採購工作及審查小組","採購稽核小組","工程施工查核小組"],"a":1,"e":"§11-1Ⅰ：機關辦理**巨額工程採購**，應成立**採購工作及審查小組**，協助審查採購需求與經費、採購策略、招標文件等。","r":"A0030057#11-1"},{"c":"g","q":"主管機關應設立採購資訊中心，其任務不包括下列何者？","o":["統一蒐集共通性商情及同等品分類資訊","建立工程價格資料庫","供各機關採購預算編列及底價訂定之參考","代各機關辦理招標決標"],"a":3,"e":"§11Ⅰ 規定資訊中心之任務；代辦招標決標是 §40 代辦採購的範疇，非資訊中心任務。","r":"A0030057#11"},{"c":"g","q":"本法所稱主管機關為何？","o":["行政院","行政院採購暨公共工程委員會","行政院主計總處","審計部"],"a":1,"e":"§9Ⅰ：主管機關為**行政院採購暨公共工程委員會**，以政務委員一人兼任主任委員。","r":"A0030057#9"},{"c":"g","q":"下列何者非主管機關依 §10 掌理之事項？","o":["政府採購法令之研訂、修正及解釋","標準採購契約之檢討及審定","中央各機關採購申訴之處理","地方機關採購申訴之處理"],"a":3,"e":"§10 第 7 款為「**中央**各機關採購申訴之處理」；地方機關申訴由直轄市或縣（市）政府所設申訴會處理（§76Ⅰ）。","r":"A0030057#10"},{"c":"g","q":"機關採購委託法人或團體代辦者，其法律效果為何？","o":["不適用本法","適用本法，該法人團體並受委託機關之監督","僅適用部分規定","應報主管機關核准"],"a":1,"e":"§5：委託代辦之採購**適用本法**，該法人或團體並**受委託機關監督**。","r":"A0030057#5"},{"c":"g","q":"關於辦理採購人員之裁量，下列敘述何者正確？","o":["一律不得裁量","於不違反本法規定之範圍內，得基於公共利益、採購效益或專業判斷為適當之採購決定","僅機關首長得裁量","須報上級機關核准始得裁量"],"a":1,"e":"§6Ⅱ：於不違反本法規定之範圍內，得基於**公共利益、採購效益或專業判斷**之考量為適當之採購決定。","r":"A0030057#6"},{"c":"g","q":"機關辦理採購，對廠商之基本原則為何？","o":["得依採購金額為差別待遇","應以維護公共利益及公平合理為原則，不得為無正當理由之差別待遇","得優先照顧本地廠商","得依廠商規模為差別待遇"],"a":1,"e":"§6Ⅰ：應以維護公共利益及公平合理為原則，對廠商**不得為無正當理由之差別待遇**。","r":"A0030057#6"},{"c":"g","q":"本法所稱「廠商」，不包括下列何者？","o":["公司","合夥或獨資之工商行號","得提供工程財物勞務之自然人","外國政府本身"],"a":3,"e":"§8：廠商指公司、合夥或獨資之工商行號及其他得提供工程財物勞務之自然人、法人、機構或團體。","r":"A0030057#8"},{"c":"g","q":"機關辦理工程採購之預算金額達一定金額以上者，應於決標後將何種資料傳輸至工程價格資料庫？","o":["底價資料","得標廠商之單價資料","所有投標廠商標價","契約全文"],"a":1,"e":"§11Ⅱ：應於決標後將**得標廠商之單價資料**傳輸至工程價格資料庫。","r":"A0030057#11"},{"c":"g","q":"關於本法之施行日期，下列敘述何者正確？","o":["自公布日施行","自公布後一年施行；修正條文自公布日施行","自公布後六個月施行","由行政院定之"],"a":1,"e":"§114Ⅰ：本法自**公布後一年**施行；Ⅱ 修正條文自**公布日**施行。","r":"A0030057#114"},{"c":"g","q":"司法、監察機關對採購機關或人員之調查、起訴、審判等，得如何？","o":["逕行認定違法","洽請主管機關協助、鑑定或提供專業意見","無須任何程序","應先報請行政院同意"],"a":1,"e":"§6Ⅲ：得**洽請主管機關協助、鑑定或提供專業意見**。","r":"A0030057#6"},{"c":"b","q":"機關辦理公告金額以上之採購，除依 §20 及 §22 辦理者外，原則上應採何種招標方式？","o":["選擇性招標","限制性招標","公開招標","公開評選"],"a":2,"e":"§19：公告金額以上之採購，除得依 §20 選擇性招標或 §22 限制性招標者外，**應公開招標**。","r":"A0030057#19"},{"c":"b","q":"下列何者非 §20 得採選擇性招標之情形？","o":["經常性採購","投標文件審查須費時長久始能完成","廠商準備投標需高額費用","遇有不可預見之緊急事故"],"a":3,"e":"「不可預見之緊急事故」是 §22Ⅰ③ **限制性招標**事由。§20 五款為：經常性採購／審查費時長久／準備投標需高額費用／資格條件複雜／研究發展事項。","r":"A0030057#20"},{"c":"b","q":"機關辦理選擇性招標之「經常性採購」，應建立幾家以上之合格廠商名單？","o":["三家以上","五家以上","六家以上","十家以上"],"a":2,"e":"§21Ⅲ：經常性採購應建立**六家以上**之合格廠商名單。","r":"A0030057#21"},{"c":"b","q":"關於限制性招標之定義，下列敘述何者正確？","o":["不經公告程序，邀請二家以上廠商比價或僅邀請一家廠商議價","經公告程序，邀請二家以上廠商比價","不經公告程序，僅得邀請一家廠商議價","經公告程序，邀請不特定廠商投標"],"a":0,"e":"§18Ⅳ：限制性招標指**不經公告程序**，邀請**二家以上**廠商**比價**或**僅邀請一家**廠商**議價**。","r":"A0030057#18"},{"c":"b","q":"依 §22Ⅰ⑥ 因未能預見之情形必須追加契約以外之工程而洽原訂約廠商辦理者，其金額限制為何？","o":["未逾原主契約金額 30%","未逾原主契約金額 50%","未逾原主契約金額 20%","無金額限制"],"a":1,"e":"§22Ⅰ⑥：必須追加契約以外之工程，非洽原訂約廠商不能達契約目的，且**未逾原主契約金額百分之五十**者。","r":"A0030057#22"},{"c":"b","q":"依 §22Ⅰ⑦ 原有採購之後續擴充得採限制性招標，其要件為何？","o":["金額未逾原契約 50%","已於原招標公告及招標文件敘明擴充之期間、金額或數量","經上級機關核准","經主管機關認定"],"a":1,"e":"§22Ⅰ⑦：須**已於原招標公告及招標文件敘明**擴充之期間、金額或數量。","r":"A0030057#22"},{"c":"b","q":"政府採購法 §22Ⅰ 第 13 款、第 14 款之限制性招標，有何特別限制？","o":["僅適用工程採購","不適用工程採購","僅適用財物採購","須經上級機關核准"],"a":1,"e":"§22Ⅳ 明定第 13 款（學術研究發展）及第 14 款（文化藝術）**不適用工程採購**。","r":"A0030057#22"},{"c":"b","q":"未達公告金額之招標方式，在中央由何者訂定？","o":["各機關自行訂定","主管機關","行政院","審計部"],"a":1,"e":"§23：未達公告金額之招標方式，在中央由**主管機關**定之；在地方由直轄市或縣（市）政府定之，地方未定者比照中央。","r":"A0030057#23"},{"c":"b","q":"未達公告金額但逾公告金額十分之一之採購，除 §22Ⅰ 各款情形外，仍應如何辦理？","o":["逕洽廠商採購","公開取得三家以上廠商之書面報價或企劃書","公開招標","報請上級機關核准"],"a":1,"e":"§49：仍應**公開取得三家以上廠商之書面報價或企劃書**。","r":"A0030057#49"},{"c":"b","q":"公告金額十分之一以下之採購（小額採購），依中央機關未達公告金額採購招標辦法，得如何辦理？","o":["仍應公開招標","得不經公告程序，逕洽廠商採購，免提供報價或企劃書","應取得三家報價","應報上級機關核准"],"a":1,"e":"未達公告金額採購招標辦法 §5：公告金額十分之一以下之招標，**得不經公告程序，逕洽廠商採購，免提供報價或企劃書**。","r":"A0030067#5"},{"c":"b","q":"依中央機關未達公告金額採購招標辦法 §2，符合 §22Ⅰ 第 16 款情形者，有何特別規定？","o":["仍須報經主管機關認定","敘明理由簽報機關首長或授權人員核准，免報經主管機關認定","須報上級機關核准","不得採限制性招標"],"a":1,"e":"招標辦法 §2Ⅰ②：符合 §22Ⅰ⑯ 者，敘明適當理由簽報機關首長或其授權人員核准，得採限制性招標，**免報經主管機關認定**。","r":"A0030067#2"},{"c":"b","q":"機關辦理採購，其招標文件於公告前應如何處理？","o":["應予公開","應予保密，但須公開說明或藉以公開徵求參考資料者不在此限","得任意提供廠商參考","應送主管機關備查"],"a":1,"e":"§34Ⅰ：招標文件於公告前**應予保密**；但須公開說明或藉以公開徵求廠商提供參考資料者，不在此限。","r":"A0030057#34"},{"c":"b","q":"關於底價之保密，下列敘述何者錯誤？","o":["機關辦理招標，不得於開標前洩漏底價","底價於開標後至決標前仍應保密","決標後除有特殊情形外應予公開","機關不得於招標文件中公告底價"],"a":3,"e":"§34Ⅲ 但書：機關依實際需要，**得於招標文件中公告底價**。","r":"A0030057#34"},{"c":"b","q":"機關辦理採購，應於何時訂定底價？（公開招標）","o":["公告前","開標前","決標前","簽約前"],"a":1,"e":"§46Ⅱ①：公開招標應於**開標前**定之；選擇性招標於資格審查後之下一階段開標前；限制性招標於議價或比價前。","r":"A0030057#46"},{"c":"b","q":"下列何種採購，機關得不訂底價？","o":["所有工程採購","訂定底價確有困難之特殊或複雜案件、以最有利標決標之採購、小額採購","所有勞務採購","公告金額以上之採購"],"a":1,"e":"§47Ⅰ 三款：①訂定底價確有困難之特殊或複雜案件 ②以最有利標決標之採購 ③小額採購。","r":"A0030057#47"},{"c":"b","q":"小額採購之金額，在中央由主管機關定之，但不得逾多少？","o":["公告金額十分之一","公告金額五分之一","查核金額十分之一","新臺幣 10 萬元"],"a":0,"e":"§47Ⅲ：小額採購金額**不得逾公告金額十分之一**。","r":"A0030057#47"},{"c":"b","q":"機關辦理招標，原則上應於招標文件中規定投標廠商須繳納押標金，下列何者非 §30 之免收情形？","o":["勞務採購，以免收押標金、保證金為原則","未達公告金額之工程、財物採購，得免收","以議價方式辦理之採購，得免收押標金","公告金額以上之工程採購，得免收"],"a":3,"e":"§30Ⅰ 四款免收情形不含「公告金額以上之工程採購」。第 3 款「議價得免收」僅針對**押標金**。","r":"A0030057#30"},{"c":"b","q":"押標金之額度，依押標金保證金暨其他擔保作業辦法規定，其上限為何？","o":["預算金額 5%，且不得逾 3,000 萬元","標價 5%，且不得逾 5,000 萬元","預算金額 10%，且不得逾 5,000 萬元","契約金額 10%"],"a":1,"e":"辦法 §9Ⅱ：一定金額不逾預算或預估採購總額 **5%**；一定比率不逾標價 **5%**；但**不得逾新臺幣 5,000 萬元**。","r":"A0030079#9"},{"c":"b","q":"履約保證金之額度上限為何？","o":["契約金額 5%","契約金額 10%","契約金額 15%","契約金額 20%"],"a":1,"e":"辦法 §15Ⅱ：一定金額不逾預算或預估採購總額 10%；一定比率不逾**契約金額 10%**。","r":"A0030079#15"},{"c":"b","q":"下列何者非 §31Ⅱ 押標金不予發還並追繳之事由？","o":["以虛偽不實之文件投標","得標後拒不簽約","得標後未於規定期限內繳足保證金或提供擔保","驗收不合格情節重大"],"a":3,"e":"「驗收不合格情節重大」是 §101Ⅰ⑧ 停權事由，非 §31Ⅱ 追繳押標金事由。","r":"A0030057#31"},{"c":"b","q":"追繳押標金之請求權，因幾年間不行使而消滅？","o":["2 年","5 年","10 年","15 年"],"a":1,"e":"§31Ⅳ：請求權因**五年**間不行使而消滅；§31Ⅵ 另定自不予開標、不予決標、廢標或決標日起逾 **15 年**者不得行使。","r":"A0030057#31"},{"c":"b","q":"機關辦理公開招標，公告金額以上未達查核金額之採購，其等標期不得少於幾日？","o":["7 日","10 日","14 日","21 日"],"a":2,"e":"招標期限標準 §2Ⅱ：未達公告金額 7 日／公告金額以上未達查核金額 **14 日**／查核金額以上未達巨額 21 日／巨額 28 日。","r":"A0030093#2"},{"c":"b","q":"巨額採購之公開招標，等標期不得少於幾日？","o":["14 日","21 日","28 日","35 日"],"a":2,"e":"招標期限標準 §2Ⅱ④：巨額之採購 **28 日**。","r":"A0030093#2"},{"c":"b","q":"選擇性招標之廠商資格預先審查，巨額採購之等標期不得少於幾日？","o":["7 日","10 日","14 日","21 日"],"a":2,"e":"招標期限標準 §3Ⅱ：未達公告金額 7 日／公告金額以上未達巨額 10 日／巨額 **14 日**。","r":"A0030093#3"},{"c":"b","q":"依 §42Ⅱ 辦理後續階段之邀標，其等標期不得少於幾日？","o":["3 日","7 日","10 日","14 日"],"a":1,"e":"招標期限標準 §2Ⅲ：依本法 §42Ⅱ 辦理後續階段邀標，等標期由機關合理訂定，但**不得少於 7 日**。","r":"A0030093#2"},{"c":"b","q":"機關辦理招標，其技術規格之訂定，下列敘述何者錯誤？","o":["有國際標準或國家標準者應從其規定","不得於目的及效果上限制競爭","不得要求或提及特定商標、商名、專利、設計或型式","無法精確說明時，仍不得註明「或同等品」"],"a":3,"e":"§26Ⅲ 但書：無法以精確方式說明招標要求，而已在招標文件內註明「**或同等品**」字樣者，不在此限。","r":"A0030057#26"},{"c":"b","q":"機關辦理公告金額以上之採購，應依何者訂定招標文件？","o":["最低價格","功能或效益","廠商建議","過去決標紀錄"],"a":1,"e":"§26Ⅰ：應依**功能或效益**訂定招標文件；有國際標準或國家標準者，應從其規定。","r":"A0030057#26"},{"c":"b","q":"關於統包，下列敘述何者正確？","o":["指二家以上廠商共同具名投標","指將工程或財物採購中之設計與施工、供應、安裝或一定期間之維修等併於同一採購契約辦理招標","指將採購項目分割為數案辦理","指多個機關共同辦理採購"],"a":1,"e":"§24Ⅱ 統包之定義。二家以上共同具名投標是**共同投標**（§25）。","r":"A0030057#24"},{"c":"b","q":"關於共同投標，下列敘述何者錯誤？","o":["指二家以上廠商共同具名投標，得標後共同具名簽約","共同投標廠商連帶負履行採購契約之責","以能增加競爭或無不當限制競爭者為限","共同投標協議書得於得標後補送"],"a":3,"e":"§25Ⅴ：共同投標廠商應於**投標時**檢附共同投標協議書。","r":"A0030057#25"},{"c":"b","q":"同業共同投標應符合下列何項規定？","o":["公平交易法第 15 條第 1 項但書各款","公司法關係企業規定","民法合夥規定","無特別規定"],"a":0,"e":"§25Ⅳ：同業共同投標應符合**公平交易法第 15 條第 1 項但書**各款之規定。","r":"A0030057#25"},{"c":"b","q":"機關得於招標文件中規定允許廠商提出替代方案，其要件為何？","o":["降低原有功能以減省經費","在不降低原有功能條件下，就技術、工法、材料或設備提出可縮減工期、減省經費或提高效率之方案","任意變更契約內容","僅限工程採購"],"a":1,"e":"§35：須在**不降低原有功能條件下**，就技術、工法、材料或設備提出可縮減工期、減省經費或提高效率之替代方案。","r":"A0030057#35"},{"c":"b","q":"關於投標廠商資格，下列敘述何者正確？","o":["機關得任意訂定資格以限制競爭","特殊或巨額之採購，得另規定投標廠商之特定資格","廠商財力資格不得以保證代之","外國廠商資格不得另行規定"],"a":1,"e":"§36Ⅱ：**特殊或巨額**之採購得另定特定資格。§37Ⅱ 但書允許財力資格以銀行或保險公司之連帶保證、連帶保證保險單代之。","r":"A0030057#36"},{"c":"b","q":"訂定投標廠商資格之界限為何？","o":["以確認廠商具備履行契約所必須之能力者為限，且不得不當限制競爭","得依機關偏好訂定","以廠商資本額為唯一標準","應從嚴訂定"],"a":0,"e":"§37Ⅰ：不得不當限制競爭，並以確認廠商具備**履行契約所必須之能力**者為限。","r":"A0030057#37"},{"c":"b","q":"關於政黨及其關係企業廠商參與投標，下列敘述何者正確？","o":["得參與投標","不得參與投標","經主管機關核准得參與","僅得參與未達公告金額之採購"],"a":1,"e":"§38Ⅰ：政黨及與其具關係企業關係之廠商，**不得參與投標**；關係企業準用公司法規定。","r":"A0030057#38"},{"c":"b","q":"承辦專案管理之廠商，其負責人或合夥人有何限制？","o":["不得同時為規劃、設計、施工或供應廠商之負責人或合夥人","得同時擔任但應報備","無限制","僅工程採購有限制"],"a":0,"e":"§39Ⅱ：不得同時為規劃、設計、施工或供應廠商之負責人或合夥人；Ⅲ 亦不得為關係企業或同一其他廠商之關係企業。","r":"A0030057#39"},{"c":"b","q":"廠商對招標文件內容有疑義者，應如何處理？","o":["得隨時以口頭反映","應於招標文件規定之日期前，以書面向招標機關請求釋疑","應直接向申訴會提出","應於開標後提出"],"a":1,"e":"§41Ⅰ：應於招標文件規定之日期前，以**書面**向招標機關請求釋疑。","r":"A0030057#41"},{"c":"b","q":"機關對招標文件疑義之處理結果，若涉及變更或補充招標文件內容者，原則上應如何？","o":["僅通知請求釋疑之廠商","應另行公告，並視需要延長等標期","無須任何處理","應重新招標"],"a":1,"e":"§41Ⅱ：除選擇性招標之規格標與價格標及限制性招標得以書面通知各廠商外，**應另行公告，並視需要延長等標期**。","r":"A0030057#41"},{"c":"b","q":"機關辦理分段開標，其公告義務為何？","o":["每一階段均應公告","除第一階段應公告外，後續階段之邀標得免予公告","均免予公告","應報上級機關核准後免公告"],"a":1,"e":"§42Ⅱ：除**第一階段應公告**外，後續階段之邀標得免予公告。","r":"A0030057#42"},{"c":"b","q":"廠商之投標文件，原則上應如何遞送？","o":["以書面密封，於投標截止期限前以郵遞或專人送達","一律以電子方式遞送","得於開標後補送","得以口頭報價"],"a":0,"e":"§33Ⅰ：應以**書面密封**，於投標截止期限前以郵遞或專人送達；Ⅱ 招標文件已訂明者始得以電子資料傳輸遞送。","r":"A0030057#33"},{"c":"b","q":"機關得於招標文件中規定允許廠商於開標前補正何種文件？","o":["所有文件","非契約必要之點之文件","押標金","投標標價"],"a":1,"e":"§33Ⅲ：得規定允許廠商於開標前補正**非契約必要之點**之文件。","r":"A0030057#33"},{"c":"b","q":"機關辦理公開招標或選擇性招標，其招標公告應如何處理？","o":["僅公開於機關網站","刊登於政府採購公報並公開於資訊網路","僅刊登於報紙","僅通知特定廠商"],"a":1,"e":"§27Ⅰ：應將招標公告或資格審查公告**刊登於政府採購公報並公開於資訊網路**；公告內容修正時亦同。","r":"A0030057#27"},{"c":"b","q":"公開招標之招標文件，應自何時起至何時止公開發給、發售及郵遞？","o":["自公告日起至截止投標日或收件日止","自公告日起至開標日止","自決標日起","由機關自行決定"],"a":0,"e":"§29Ⅰ：應自**公告日起至截止投標日或收件日止**公開發給、發售及郵遞；且**不得登記領標廠商之名稱**。","r":"A0030057#29"},{"c":"b","q":"機關辦理招標，關於領標廠商名稱之處理，下列敘述何者正確？","o":["應登記以利管理","不得登記領標廠商之名稱","得選擇性登記","應公告領標廠商名單"],"a":1,"e":"§29Ⅰ 後段：發給、發售或郵遞時，**不得登記領標廠商之名稱**（防止圍標）。","r":"A0030057#29"},{"c":"b","q":"機關辦理查核金額以上之採購，依政府採購招標文件公開閱覽制度實施要點，應於何時辦理公開閱覽？","o":["決標後","公告招標前","開標後","驗收前"],"a":1,"e":"公開閱覽制度實施要點第二點：機關辦理查核金額以上之採購，應於**公告招標前**辦理招標文件之公開閱覽。","r":"FL029347#2"},{"c":"b","q":"軍事機關辦理武器、彈藥、作戰物資採購，因應國家面臨戰爭、戰備動員或發生戰爭者，其法律效果為何？","o":["仍應完全適用本法","得不適用本法之規定","僅得不適用招標規定","應報立法院核准"],"a":1,"e":"§104Ⅰ①：因應國家面臨戰爭、戰備動員或發生戰爭者，**得不適用本法之規定**。","r":"A0030057#104"},{"c":"b","q":"軍事機關辦理機密或極機密之採購，得不適用下列何條規定？","o":["§27、§45、§61","§26、§28、§36","§30、§31","§75、§76"],"a":0,"e":"§104Ⅰ②：機密或極機密之採購，得不適用 **§27（公報公告）、§45（公開開標）、§61（決標公告）**。","r":"A0030057#104"},{"c":"b","q":"機關辦理採購，得洽由其他具有專業能力之機關代辦，其法源為何？","o":["§5","§39","§40","§105"],"a":2,"e":"§40Ⅰ：機關之採購得洽由其他具有專業能力之機關代辦；Ⅱ 上級機關得命未具專業採購能力之機關洽請代辦。","r":"A0030057#40"},{"c":"b","q":"機關得視採購特性及實際需要，以促進自然資源保育與環境保護為目的擬定技術規格，其法源為何？","o":["§26","§26-1","§96","§84"],"a":1,"e":"§26-1Ⅰ：得以促進自然資源保育與環境保護為目的擬定技術規格及節能減碳措施；增加經費者應併入計畫報核編列預算。","r":"A0030057#26-1"},{"c":"b","q":"機關辦理採購時，關於預算及預計金額之公開，下列敘述何者正確？","o":["一律不得公開","得於招標公告中一併公開","應一律公開","僅得於決標後公開"],"a":1,"e":"§27Ⅲ：機關應估計採購案件之件數及每件之預計金額；預算及預計金額**得於招標公告中一併公開**。","r":"A0030057#27"},{"c":"b","q":"關於選擇性招標之合格廠商名單，下列敘述何者錯誤？","o":["機關得預先辦理資格審查建立名單","應隨時接受廠商資格審查之請求","應定期檢討修正合格廠商名單","未列入名單之廠商一律不得參加特定招標"],"a":3,"e":"§21Ⅱ：未列入名單之廠商請求參加特定招標時，機關於不妨礙招標作業並能適時完成資格審查者，**於審查合格後邀其投標**。","r":"A0030057#21"},{"c":"b","q":"關於押標金及保證金之繳納方式，下列何者非 §30Ⅱ 所列？","o":["現金、金融機構簽發之本票或支票","政府公債、設定質權之金融機構定期存款單","銀行開發或保兌之不可撤銷擔保信用狀","不動產設定抵押權"],"a":3,"e":"§30Ⅱ 列舉方式不含不動產抵押；另可取具銀行書面連帶保證或保險公司連帶保證保險單。","r":"A0030057#30"},{"c":"d","q":"機關依本法辦理招標，有幾家以上合格廠商投標，即應依招標文件所定時間開標決標？","o":["二家","三家","五家","六家"],"a":1,"e":"§48Ⅰ：有**三家以上**合格廠商投標，即應依招標文件所定時間開標決標（除該條八款不予開標決標情形外）。","r":"A0030057#48"},{"c":"d","q":"第一次開標因未滿三家而流標者，第二次招標有何特別規定？","o":["仍須三家以上","等標期間得予縮短，並得不受三家廠商之限制","應改採限制性招標","應報上級機關核准"],"a":1,"e":"§48Ⅱ：第二次招標之**等標期得縮短**，並**得不受三家廠商之限制**。","r":"A0030057#48"},{"c":"d","q":"下列何者非 §48Ⅰ 不予開標決標之情形？","o":["變更或補充招標文件內容","發現有足以影響採購公正之違法或不當行為","因應突發事故","投標廠商僅有三家"],"a":3,"e":"三家即應開標決標，非不予開標事由。八款包括變更補充文件、影響公正之違法不當、§82 暫緩開標、§84 暫停程序、§85 另為處置、突發事故、採購計畫變更或取銷、主管機關認定之特殊情形。","r":"A0030057#48"},{"c":"d","q":"投標廠商有下列何種情形，經機關於開標前發現者，其所投之標應不予開標？","o":["標價高於底價","不同投標廠商間之投標文件內容有重大異常關聯","資本額不足","未參加投標前說明會"],"a":1,"e":"§50Ⅰ⑤：不同投標廠商間之投標文件內容有**重大異常關聯**者，開標前發現不予開標、開標後發現不決標。","r":"A0030057#50"},{"c":"d","q":"決標或簽約後發現得標廠商於決標前有 §50Ⅰ 情形者，機關應如何處理？","o":["一律不處理","應撤銷決標、終止契約或解除契約，並得追償損失","僅得請求損害賠償","應報主管機關決定"],"a":1,"e":"§50Ⅱ：應撤銷決標、終止或解除契約，並得追償損失；但反不符公共利益並經**上級機關核准**者，不在此限。","r":"A0030057#50"},{"c":"d","q":"§50Ⅰ 不予開標或不予決標，致採購程序無法繼續進行者，機關得如何？","o":["逕行決標","宣布廢標","改採限制性招標","報請主管機關處理"],"a":1,"e":"§50Ⅲ：致採購程序無法繼續進行者，機關得**宣布廢標**。","r":"A0030057#50"},{"c":"d","q":"機關辦理採購之決標原則，下列何者非 §52Ⅰ 所列？","o":["訂有底價之最低標","未訂底價之最低標","最有利標","抽籤決標"],"a":3,"e":"§52Ⅰ 四款：訂有底價之最低標、未訂底價之最低標、最有利標、複數決標。","r":"A0030057#52"},{"c":"d","q":"機關辦理公告金額以上之專業服務、技術服務、資訊服務、社會福利服務或文化創意服務，其決標原則為何？","o":["以訂有底價之最低標為原則","以不訂底價之最有利標為原則","以複數決標為原則","由機關自行決定"],"a":1,"e":"§52Ⅱ：以**不訂底價之最有利標**為原則。","r":"A0030057#52"},{"c":"d","q":"合於招標文件規定之最低標價超過底價時，機關得如何處理？","o":["直接廢標","洽該最低標廠商減價一次；仍超過底價時，得由所有合格廠商重新比減價格，不得逾三次","洽最低標廠商減價三次","逕行報上級機關核准決標"],"a":1,"e":"§53Ⅰ：減價**一次** → 全體比減價格，**比減價格不得逾三次**。","r":"A0030057#53"},{"c":"d","q":"依 §53Ⅱ，最低標價仍超過底價而不逾預算數額，機關確有緊急情事需決標時，其決標價格上限為何？","o":["不得超過底價 4%","不得超過底價 8%","不得超過底價 10%","不得超過預算數額"],"a":1,"e":"§53Ⅱ：經原底價核定人或其授權人員核准，**不得超過底價百分之八**；查核金額以上之採購**超過底價 4%** 者，應先報經上級機關核准後決標。","r":"A0030057#53"},{"c":"d","q":"查核金額以上之採購，超過底價多少比率決標，應先報經上級機關核准？","o":["2%","4%","8%","10%"],"a":1,"e":"§53Ⅱ 但書：查核金額以上之採購，超過底價**百分之四**者，應先報經上級機關核准後決標。","r":"A0030057#53"},{"c":"d","q":"未訂底價之採購，最低標價逾評審委員會建議金額或預算金額，經減價及比減價格後仍逾越者，應如何？","o":["報上級機關核准後決標","應予廢標","改採最有利標","洽次低標議價"],"a":1,"e":"§54：辦理結果最低標價仍逾越上開金額時，**應予廢標**。","r":"A0030057#54"},{"c":"d","q":"關於最有利標之綜合評選，下列敘述何者錯誤？","o":["應依招標文件所規定之評審標準辦理","得就技術、品質、功能、商業條款或價格作序位或計數之綜合評選","未列入之項目仍得作為評選之參考","綜合評選不得逾三次"],"a":2,"e":"§56Ⅰ：**未列入之項目，不得做為評選之參考**。","r":"A0030057#56"},{"c":"d","q":"機關採最有利標決標者，程序上應如何？","o":["報主管機關備查","應先報經上級機關核准","由機關首長逕行核定","應經審計機關同意"],"a":1,"e":"§56Ⅲ：機關採最有利標決標者，**應先報經上級機關核准**。","r":"A0030057#56"},{"c":"d","q":"機關辦理評選，應成立評選委員會，其人數及專家學者比例為何？","o":["三人以上，專家學者不得少於二分之一","五人以上，專家學者不得少於三分之一","五人以上，專家學者不得少於二分之一","七人以上，專家學者不得少於三分之一"],"a":1,"e":"§94Ⅰ：應成立**五人以上**之評選委員會，專家學者人數**不得少於三分之一**。","r":"A0030057#94"},{"c":"d","q":"採購評選委員會之專家學者，有何資格限制？","o":["須具博士學位","不得為政府機關之現職人員","須為採購專業人員","須具十年以上經驗"],"a":1,"e":"§94Ⅱ：所稱專家學者，**不得為政府機關之現職人員**。","r":"A0030057#94"},{"c":"d","q":"機關辦理最低標決標，認為最低標廠商總標價或部分標價偏低顯不合理，得如何處理？","o":["逕行不決標","限期通知該廠商提出說明或擔保；未提出合理說明或擔保者，得不決標予該廠商","逕行廢標","洽次低標議價"],"a":1,"e":"§58：得限期通知提出說明或擔保；未於期限內提出合理說明或擔保者，得不決標予該廠商，並以次低標廠商為最低標廠商。","r":"A0030057#58"},{"c":"d","q":"廠商以差額保證金作為 §58 之擔保，總標價偏低者其擔保金額如何計算？","o":["總標價與底價之差額","總標價與底價百分之八十之差額","總標價與底價百分之七十之差額","總標價之百分之十"],"a":1,"e":"押標金保證金辦法 §30Ⅰ①：總標價偏低者，擔保金額為總標價與**底價之百分之八十**之差額。","r":"A0030079#30"},{"c":"d","q":"部分標價偏低者，其差額保證金之擔保金額如何計算？","o":["該部分標價與該部分底價百分之八十之差額","該部分標價與該部分底價百分之七十之差額","該部分標價之百分之十","總標價與底價之差額"],"a":1,"e":"押標金保證金辦法 §30Ⅰ②：部分標價偏低者，擔保金額為該部分標價與**該部分底價之百分之七十**之差額。","r":"A0030079#30"},{"c":"d","q":"廠商以支付佣金、比例金、仲介費、後謝金或其他不正利益為條件促成契約成立者，機關得如何處理？","o":["僅得終止契約","得終止或解除契約，並將二倍之不正利益自契約價款中扣除","得將一倍之不正利益扣除","應移送檢察機關偵辦後再處理"],"a":1,"e":"§59Ⅱ：機關得終止或解除契約，並將**二倍**之不正利益自契約價款中扣除；未能扣除者通知廠商限期給付。","r":"A0030057#59"},{"c":"d","q":"機關通知廠商說明、減價、比減價格、協商或重新報價，廠商未依通知期限辦理者，其效果為何？","o":["得展延期限","視同放棄","應予廢標","視為同意原報價"],"a":1,"e":"§60：廠商未依通知期限辦理者，**視同放棄**。","r":"A0030057#60"},{"c":"d","q":"機關辦理公告金額以上採購之招標，決標結果應如何處理？","o":["僅通知得標廠商","於決標後一定期間內將決標結果公告刊登政府採購公報，並以書面通知各投標廠商","僅刊登公報無須通知","無須公告"],"a":1,"e":"§61：應於決標後一定期間內公告刊登政府採購公報，並以書面通知各投標廠商；**無法決標者亦同**。","r":"A0030057#61"},{"c":"d","q":"機關辦理以最低標決標之採購，採行協商措施之要件為何？","o":["機關首長核准即可","經報上級機關核准，並於招標公告及招標文件內預告","經評選委員會同意","無須任何要件"],"a":1,"e":"§55：經**報上級機關核准**，並於**招標公告及招標文件內預告**者，得於依 §53、§54 無法決標時採行協商措施。","r":"A0030057#55"},{"c":"d","q":"採行協商措施時，下列原則何者錯誤？","o":["開標、投標、審標程序及內容均應予保密","協商時應平等對待所有合於招標文件規定之投標廠商","原招標文件未標示得更改之項目亦得納入協商","協商結束後應予廠商依協商結果修改投標文件重行遞送之機會"],"a":2,"e":"§57③：**原招標文件已標示得更改項目之內容，始得納入協商**。","r":"A0030057#57"},{"c":"d","q":"公開招標及選擇性招標之開標，原則上應如何進行？","o":["得不公開","依招標文件公告之時間及地點公開為之","由機關自行決定時間地點","僅通知得標廠商到場"],"a":1,"e":"§45：除法令另有規定外，應依招標文件公告之時間及地點**公開**為之。","r":"A0030057#45"},{"c":"d","q":"機關辦理採購決標時，是否須通知投標廠商到場？","o":["一律應通知到場","決標時得不通知投標廠商到場，其結果應通知各投標廠商","僅通知最低標廠商","應通知所有領標廠商"],"a":1,"e":"§52Ⅲ：決標時**得不通知投標廠商到場**，其結果應通知各投標廠商。","r":"A0030057#52"},{"c":"d","q":"機關依 §51 審查廠商投標文件，對不合格之廠商應如何？","o":["無須通知","應通知並敘明其原因","僅公告即可","通知但無須敘明原因"],"a":1,"e":"§51Ⅱ：審查結果應通知投標廠商，對不合格之廠商**並應敘明其原因**。","r":"A0030057#51"},{"c":"d","q":"機關辦理採購，得對國內產製加值達百分之五十之財物或國內供應之工程勞務，優先決標予國內廠商，其一定比率及優惠期限上限為何？","o":["比率不得逾 3%、期限不得逾 5 年","比率不得逾 5%、期限不得逾 3 年","比率不得逾 10%、期限不得逾 5 年","比率不得逾 3%、期限不得逾 3 年"],"a":0,"e":"§44Ⅱ：一定比率**不得逾百分之三**，優惠期限**不得逾五年**；且以合於就業或產業發展政策者為限。","r":"A0030057#44"},{"c":"d","q":"依 §43①，機關要求投標廠商採購國內貨品比率、技術移轉等作為採購評選項目，其比率上限為何？","o":["不得逾三分之一","不得逾二分之一","不得逾百分之三","不得逾百分之十"],"a":0,"e":"§43①：作為採購評選之項目，其比率**不得逾三分之一**。","r":"A0030057#43"},{"c":"d","q":"§43、§44 之優惠措施，有何前提限制？","o":["須經上級機關核准","除我國締結之條約或協定另有禁止規定者外","僅適用於工程採購","僅適用於巨額採購"],"a":1,"e":"§43、§44 均以「**除我國締結之條約或協定另有禁止規定者外**」為前提——即條約協定採購不得適用。","r":"A0030057#43"},{"c":"d","q":"機關得於招標文件中規定優先採購取得政府認可環境保護標章之產品，並得允許多少以下之價差？","o":["百分之三","百分之五","百分之十","百分之十五"],"a":2,"e":"§96Ⅰ：得允許**百分之十以下**之價差。","r":"A0030057#96"},{"c":"d","q":"關於複數決標，下列敘述何者正確？","o":["機關得任意組合決標","機關得於招標文件中公告保留採購項目或數量選擇之組合權利，但應合於最低價格或最有利標之競標精神","複數決標無須載明於招標文件","複數決標僅適用工程採購"],"a":1,"e":"§52Ⅰ④：得於招標文件中公告保留之採購項目或數量選擇之組合權利，但應合於**最低價格或最有利標**之競標精神。","r":"A0030057#52"},{"c":"d","q":"各機關就具有共通需求特性之財物或勞務與廠商簽訂之契約，稱為？","o":["統包契約","共同投標契約","共同供應契約","複數決標契約"],"a":2,"e":"§93Ⅰ：各機關得就具有**共通需求特性**之財物或勞務，與廠商簽訂**共同供應契約**。","r":"A0030057#93"},{"c":"d","q":"機關辦理採購之決標資料，應如何處理？","o":["自行保存即可","應定期彙送主管機關","應送審計機關","應公開於機關網站"],"a":1,"e":"§62：機關辦理採購之決標資料，應**定期彙送主管機關**。","r":"A0030057#62"},{"c":"d","q":"依採購評選委員會組織準則，評選委員會之成立時機為何？","o":["決標後","於辦理評選之採購案件招標文件公告前成立","開標時","簽約前"],"a":1,"e":"評選委員會應於招標文件公告前成立，以審定招標文件之評選項目、評審標準及評定方式。","r":"A0030103#4"},{"c":"d","q":"機關辦理公告金額以上採購之開標、比價、議價、決標及驗收，除有特殊情形外，應由何者會同監辦？","o":["上級機關","主（會）計及有關單位","審計機關","政風單位"],"a":1,"e":"§13Ⅰ：應由其**主（會）計及有關單位**會同監辦。","r":"A0030057#13"},{"c":"d","q":"§13 之會同監辦採購辦法，由何者訂定？","o":["主管機關單獨訂定","主管機關會同行政院主計處定之","行政院定之","各機關自行訂定"],"a":1,"e":"§13Ⅳ：第一項會同監辦採購辦法，由**主管機關會同行政院主計處**定之。","r":"A0030057#13"},{"c":"p","q":"各類採購契約之訂定原則為何？","o":["由機關自行擬定","以採用主管機關訂定之範本為原則","由廠商提供","應報主管機關核准"],"a":1,"e":"§63Ⅰ：各類採購契約以採用**主管機關訂定之範本**為原則，其要項及內容由主管機關參考國際及國內慣例定之。","r":"A0030057#63"},{"c":"p","q":"採購契約因政策變更，廠商依契約繼續履行反而不符公共利益者，機關得如何？","o":["逕行終止契約且無須補償","報經上級機關核准，終止或解除部分或全部契約，並補償廠商因此所生之損失","僅得減少契約數量","應由廠商自行承擔損失"],"a":1,"e":"§64：得**報經上級機關核准**終止或解除部分或全部契約，並**補償**廠商因此所生之損失。","r":"A0030057#64"},{"c":"p","q":"得標廠商違反 §65 轉包規定時，機關得如何處理？","o":["僅得要求改正","得解除契約、終止契約或沒收保證金，並得要求損害賠償","僅得沒收保證金","應報主管機關處理"],"a":1,"e":"§66Ⅰ：得**解除契約、終止契約或沒收保證金**，並得要求損害賠償。","r":"A0030057#66"},{"c":"p","q":"轉包廠商與得標廠商對機關之責任為何？","o":["各自負責","負連帶履行及賠償責任，再轉包者亦同","僅得標廠商負責","僅轉包廠商負責"],"a":1,"e":"§66Ⅱ：轉包廠商與得標廠商對機關負**連帶履行及賠償責任**；再轉包者亦同。","r":"A0030057#66"},{"c":"p","q":"分包廠商就其分包部分，與得標廠商負何種責任？","o":["連帶履行責任","連帶負瑕疵擔保責任","不負任何責任","補充責任"],"a":1,"e":"§67Ⅲ：分包廠商就其分包部分，與得標廠商**連帶負瑕疵擔保責任**。","r":"A0030057#67"},{"c":"p","q":"得標廠商就採購契約對於機關之價金或報酬請求權，得否為權利質權之標的？","o":["不得","其全部或一部得為權利質權之標的","僅全部得為之","須經機關同意始得為之"],"a":1,"e":"§68：其**全部或一部**得為權利質權之標的。","r":"A0030057#68"},{"c":"p","q":"中央及直轄市、縣（市）政府應成立何種組織，定期查核所屬（轄）機關工程品質及進度？","o":["採購稽核小組","工程施工查核小組","採購工作及審查小組","採購評選委員會"],"a":1,"e":"§70Ⅲ：應成立**工程施工查核小組**，定期查核所屬（轄）機關工程品質及進度等事宜。","r":"A0030057#70"},{"c":"p","q":"工程施工查核小組進行查核時，應以何種方式為主？","o":["書面審查為主","現場查核為主、書面審查為輔","抽樣檢驗為主","廠商自主檢查"],"a":1,"e":"工程施工查核小組作業辦法 §2：應以**現場查核為主**，書面審查為輔。","r":"D0070080#2"},{"c":"p","q":"機關辦理工程採購，於廠商履約過程得辦理何種程序，其結果並得供驗收之用？","o":["分段查驗","全面複驗","第三方認證","廠商自主檢查"],"a":0,"e":"§70Ⅱ：機關於廠商履約過程，得辦理**分段查驗**，其結果並得供驗收之用。","r":"A0030057#70"},{"c":"p","q":"機關辦理工程、財物採購之驗收，關於主驗人之規定，下列何者正確？","o":["由承辦採購單位人員擔任","機關承辦採購單位之人員不得為所辦採購之主驗人或樣品及材料之檢驗人","由廠商指派","由上級機關指派"],"a":1,"e":"§71Ⅲ：機關**承辦採購單位之人員不得**為所辦採購之主驗人或樣品及材料之檢驗人。","r":"A0030057#71"},{"c":"p","q":"驗收結果與契約、圖說、貨樣規定不符者，機關應如何處理？","o":["一律解除契約","通知廠商限期改善、拆除、重作、退貨或換貨","逕行減價收受","沒收保證金"],"a":1,"e":"§72Ⅰ：應通知廠商**限期改善、拆除、重作、退貨或換貨**。","r":"A0030057#72"},{"c":"p","q":"機關辦理減價收受，其核准層級為何？","o":["一律由機關首長核准","查核金額以上應先報經上級機關核准；未達查核金額經機關首長或其授權人員核准","一律報上級機關核准","由主計單位核准"],"a":1,"e":"§72Ⅱ：在**查核金額以上**之採購應先報經**上級機關**核准；未達查核金額之採購應經機關首長或其授權人員核准。","r":"A0030057#72"},{"c":"p","q":"減價收受之要件，下列何者錯誤？","o":["驗收結果與規定不符","不妨礙安全及使用需求","無減少通常效用或契約預定效用","不論拆換是否困難均得減價收受"],"a":3,"e":"§72Ⅱ：須經機關檢討**不必拆換或拆換確有困難**者，始得於必要時減價收受。","r":"A0030057#72"},{"c":"p","q":"工程竣工後，監造單位應於竣工後幾日內將竣工圖表、工程結算明細表等資料送請機關審核？","o":["3 日","7 日","15 日","30 日"],"a":1,"e":"施行細則 §92Ⅱ：監造單位應於竣工後**七日**內送請機關審核。","r":"A0030058#92"},{"c":"p","q":"有初驗程序者，機關應於收受全部資料之日起幾日內辦理初驗？","o":["15 日","20 日","30 日","45 日"],"a":2,"e":"施行細則 §92Ⅱ：機關應於收受全部資料之日起**三十日**內辦理初驗，並作成初驗紀錄。","r":"A0030058#92"},{"c":"p","q":"採購之驗收有初驗程序者，初驗合格後，除契約另有規定外，機關應於幾日內辦理驗收？","o":["10 日","15 日","20 日","30 日"],"a":2,"e":"施行細則 §93：初驗合格後，機關應於**二十日**內辦理驗收，並作成驗收紀錄。","r":"A0030058#93"},{"c":"p","q":"採購之驗收無初驗程序者，機關應於接獲廠商通知備驗或可得驗收之程序完成後幾日內辦理驗收？","o":["15 日","20 日","30 日","45 日"],"a":2,"e":"施行細則 §94：無初驗程序者，機關應於**三十日**內辦理驗收。","r":"A0030058#94"},{"c":"p","q":"廠商應於工程預定竣工日前或竣工當日書面通知監造單位及機關後，機關應於收到通知之日起幾日內會同核對竣工項目及數量？","o":["3 日","7 日","14 日","30 日"],"a":1,"e":"施行細則 §92Ⅰ：機關應於收到書面通知之日起**七日**內會同監造單位及廠商核對竣工項目及數量。","r":"A0030058#92"},{"c":"p","q":"機關辦理驗收，廠商未依通知派代表參加者，其效果為何？","o":["應延期辦理","仍得為之","視為驗收合格","應重新通知三次"],"a":1,"e":"施行細則 §96Ⅱ：機關辦理驗收，廠商未依通知派代表參加者，**仍得為之**；驗收前之檢查、檢驗、查驗或初驗亦同。","r":"A0030058#96"},{"c":"p","q":"機關辦理工程採購之付款，定期估驗或分階段付款者，應於廠商提出證明文件後幾日內完成審核程序？","o":["7 日","10 日","15 日","30 日"],"a":2,"e":"§73-1Ⅰ①：應於廠商提出估驗或階段完成之證明文件後**十五日**內完成審核程序，並於接到請款單據後**十五日**內付款。","r":"A0030057#73-1"},{"c":"p","q":"機關辦理工程採購付款，應向上級機關申請核撥補助款者，其付款期限為幾日？","o":["15 日","20 日","30 日","45 日"],"a":2,"e":"§73-1Ⅰ③：應向上級機關申請核撥補助款者，為**三十日**。","r":"A0030057#73-1"},{"c":"p","q":"§73-1 所稱付款及審核程序之日數，其計算方式為何？","o":["指日曆天","指實際工作日，不包括例假日、特定假日及退請受款人補正之日數","指工作日但包括例假日","由契約自行約定"],"a":1,"e":"§73-1Ⅱ：係指**實際工作日**，不包括例假日、特定假日及退請受款人補正之日數。","r":"A0030057#73-1"},{"c":"p","q":"機關辦理付款及審核程序，發現廠商文件不符、不足或有疑義而需補正或澄清者，應如何？","o":["得分次通知","應一次通知澄清或補正，不得分次辦理","應退回重新申請","應逕行拒絕付款"],"a":1,"e":"§73-1Ⅲ：應**一次通知**澄清或補正，**不得分次辦理**。","r":"A0030057#73-1"},{"c":"p","q":"機關辦理工程規劃、設計，關於安全衛生之義務為何？","o":["由廠商自行負責","應分析潛在施工危險，編製符合職業安全衛生法規之安全衛生圖說及規範，並量化編列安全衛生費用","僅須於契約中要求廠商注意","僅巨額採購有此義務"],"a":1,"e":"§70-1Ⅰ：應依工程規模及特性分析潛在施工危險，編製安全衛生圖說及規範，並**量化編列安全衛生費用**。","r":"A0030057#70-1"},{"c":"p","q":"工程、財物採購經驗收完畢後，應由何人於結算驗收證明書上簽認？","o":["僅主驗人","驗收及監驗人員分別簽認","機關首長","廠商代表"],"a":1,"e":"§73Ⅰ：應由**驗收及監驗人員**於結算驗收證明書上分別簽認；勞務驗收準用之。","r":"A0030057#73"},{" 屬 §31 不予發還或**追繳押標金**者，不受公告金額以上之限制。","r":"A0030057#76"},{"c":"r","q":"收受申訴書之機關應於收受之次日起幾日內移送該管採購申訴審議委員會？","o":["3 日","7 日","10 日","15 日"],"a":0,"e":"§76Ⅲ：應於收受之次日起**三日**內將申訴書移送於該管採購申訴審議委員會，並通知申訴廠商。","r":"A0030057#76"},{"c":"r","q":"機關應自收受申訴書副本之次日起幾日內，以書面向採購申訴審議委員會陳述意見？","o":["3 日","7 日","10 日","15 日"],"a":2,"e":"§78Ⅰ：應自收受申訴書副本之次日起**十日**內以書面陳述意見。","r":"A0030057#78"},{"c":"r","q":"採購申訴審議委員會應於收受申訴書之次日起幾日內完成審議？必要時得延長多久？","o":["30 日，得延長 30 日","40 日，得延長 40 日","60 日，得延長 30 日","40 日，不得延長"],"a":1,"e":"§78Ⅱ：應於收受申訴書之次日起**四十日**內完成審議，必要時**得延長四十日**。","r":"A0030057#78"},{"c":"r","q":"採購申訴審議委員會之審議判斷，其效力為何？","o":["視同法院判決","視同訴願決定","僅具建議性質","視同和解"],"a":1,"e":"§83：審議判斷，**視同訴願決定**（故其後得提起行政訴訟）。","r":"A0030057#83"},{"c":"r","q":"採購申訴審議委員會於完成審議前，必要時得為何種處置？","o":["逕行撤銷決標","通知招標機關暫停採購程序","沒收押標金","命廠商賠償"],"a":1,"e":"§82Ⅱ：採購申訴審議委員會於完成審議前，必要時得通知招標機關**暫停採購程序**。","r":"A0030057#82"},{"c":"r","q":"審議判斷指明原採購行為違反法令者，招標機關應於幾日內另為適法之處置？","o":["10 日","15 日","20 日","30 日"],"a":2,"e":"§85Ⅰ：應自收受審議判斷書之次日起**二十日**內另為適法之處置；期限屆滿未處置者，廠商得自期限屆滿之次日起 15 日內申訴。","r":"A0030057#85"},{"c":"r","q":"審議判斷指明原採購行為違反法令，廠商得向招標機關請求何種費用？","o":["預期利益","準備投標、異議及申訴所支出之必要費用","懲罰性賠償","全部投標成本及利潤"],"a":1,"e":"§85Ⅲ：廠商得請求償付其**準備投標、異議及申訴所支出之必要費用**。","r":"A0030057#85"},{"c":"r","q":"採購申訴審議委員會在審議判斷中建議招標機關處置方式，而招標機關不依建議辦理者，應如何？","o":["得逕行不辦理","應於收受判斷之次日起 15 日內報請上級機關核定，並由上級機關於收受之次日起 15 日內書面說明理由","應重新招標","應提起行政訴訟"],"a":1,"e":"§85Ⅱ：應於**15 日**內報請上級機關核定，並由上級機關於收受之次日起 **15 日**內以書面向申訴會及廠商說明理由。","r":"A0030057#85"},{"c":"r","q":"機關與廠商因履約爭議未能達成協議者，得以何種方式處理？","o":["僅得提起民事訴訟","向採購申訴審議委員會申請調解，或向仲裁機構提付仲裁","僅得申請調解","僅得提付仲裁"],"a":1,"e":"§85-1Ⅰ：得向採購申訴審議委員會申請**調解**，或向仲裁機構提付**仲裁**。","r":"A0030057#85-1"},{"c":"r","q":"履約爭議調解屬廠商申請者，機關得否拒絕？","o":["得拒絕","不得拒絕","經上級機關核准得拒絕","僅工程採購不得拒絕"],"a":1,"e":"§85-1Ⅱ 前段：前項調解屬**廠商申請者，機關不得拒絕**。","r":"A0030057#85-1"},{"c":"r","q":"工程及技術服務採購之調解，因機關不同意調解建議或方案致調解不成立者，廠商提付仲裁時機關得否拒絕？","o":["得拒絕","不得拒絕（強制仲裁）","經上級機關核准得拒絕","應重新調解"],"a":1,"e":"§85-1Ⅱ 後段：工程及技術服務採購之調解，申訴會應提出調解建議或調解方案；因機關不同意致調解不成立者，**廠商提付仲裁，機關不得拒絕**。","r":"A0030057#85-1"},{"c":"r","q":"採購申訴審議委員會辦理調解之程序及其效力，除本法有特別規定外，準用何法？","o":["行政程序法","民事訴訟法有關調解之規定","仲裁法","訴願法"],"a":1,"e":"§85-1Ⅲ：除本法有特別規定者外，**準用民事訴訟法有關調解之規定**。","r":"A0030057#85-1"},{"c":"r","q":"調解過程中，調解委員得依職權以採購申訴審議委員會名義提出書面調解建議，機關不同意者應如何？","o":["逕行拒絕即可","應先報請上級機關核定，並以書面向採購申訴審議委員會及廠商說明理由","應提起訴訟","應接受該建議"],"a":1,"e":"§85-3Ⅱ：機關不同意該建議者，應**先報請上級機關核定**，並以書面向申訴會及廠商說明理由。","r":"A0030057#85-3"},{"c":"r","q":"採購申訴審議委員會依職權提出調解方案後，當事人得於送達之次日起幾日內提出異議？","o":["7 日","10 日","15 日","20 日"],"a":1,"e":"§85-4Ⅱ：得於送達之次日起**十日**內提出異議；提出異議者視為調解不成立，未提出者視為已依該方案調解成立。","r":"A0030057#85-4"},{"c":"r","q":"採購申訴審議委員會之委員人數及派兼比例為何？","o":["5 人至 25 人，派兼不得超過三分之一","7 人至 35 人，派兼人數不得超過全體委員人數五分之一","7 人至 21 人，派兼不得超過四分之一","5 人以上，專家學者不得少於三分之一"],"a":1,"e":"§86Ⅰ：置委員**七人至三十五人**，其中三人並得由高級人員派兼，但**派兼人數不得超過全體委員人數五分之一**。","r":"A0030057#86"},{"c":"r","q":"申訴逾越法定期間或不合法定程式者，應如何處理？","o":["一律不予受理","不予受理；但情形可以補正者，應定期間命其補正，逾期不補正者不予受理","一律命補正","移送法院"],"a":1,"e":"§79：原則不予受理；但**情形可以補正者，應定期間命其補正**，逾期不補正者不予受理。","r":"A0030057#79"},{"c":"r","q":"申訴提出後，廠商得於何時撤回？撤回後之效果為何？","o":["得於審議判斷送達前撤回；撤回後不得再行提出同一之申訴","得隨時撤回並得重新提出","不得撤回","僅得於機關同意後撤回"],"a":0,"e":"§81：得於**審議判斷送達前**撤回；申訴經撤回後，**不得再行提出同一之申訴**。","r":"A0030057#81"},{"c":"r","q":"廠商提出異議或申訴，招標機關評估認其有理由者，應如何處理？","o":["一律應撤銷原處理結果","應自行撤銷、變更原處理結果，或暫停採購程序之進行；但為應緊急情況或公共利益之必要，或其事由無影響採購之虞者，不在此限","應等待審議判斷","應報上級機關決定"],"a":1,"e":"§84Ⅰ 及其但書。依廠商申訴而為處理者，招標機關應將結果**即時通知**該管申訴會（§84Ⅱ）。","r":"A0030057#84"},{"c":"r","q":"採購申訴之審議方式，下列敘述何者正確？","o":["一律應言詞辯論","得僅就書面審議之；申訴會得依職權或申請通知到場陳述意見","一律應公開審理","應由法官主持"],"a":1,"e":"§80Ⅰ：採購申訴**得僅就書面審議之**；Ⅱ 得依職權或申請通知申訴廠商、機關到指定場所陳述意見。","r":"A0030057#80"},{"c":"s","q":"意圖影響決標價格或獲取不當利益，而以契約、協議或其他方式之合意，使廠商不為投標或不為價格之競爭者（圍標），其刑度為何？","o":["一年以上七年以下有期徒刑","六月以上五年以下有期徒刑，得併科 100 萬元以下罰金","三年以下有期徒刑","五年以下有期徒刑，得併科 300 萬元以下罰金"],"a":1,"e":"§87Ⅳ：處**六月以上五年以下**有期徒刑，得併科新臺幣**一百萬元**以下罰金。","r":"A0030057#87"},{"c":"s","q":"意圖影響採購結果或獲取不當利益，而借用他人名義或證件投標者，其刑度為何？","o":["三年以下有期徒刑，得併科 100 萬元以下罰金","五年以下有期徒刑，得併科 100 萬元以下罰金","一年以上七年以下有期徒刑","六月以上五年以下有期徒刑"],"a":0,"e":"§87Ⅴ：處**三年以下**有期徒刑，得併科新臺幣**一百萬元**以下罰金；容許他人借用本人名義或證件參加投標者亦同。","r":"A0030057#87"},{"c":"s","q":"施強暴、脅迫、藥劑或催眠術，使廠商不為投標或違反其本意投標者，其刑度為何？","o":["三年以下有期徒刑","五年以下有期徒刑，得併科 100 萬元以下罰金","一年以上七年以下有期徒刑，得併科 300 萬元以下罰金","六月以上五年以下有期徒刑"],"a":2,"e":"§87Ⅰ：處**一年以上七年以下**有期徒刑，得併科新臺幣**三百萬元**以下罰金。","r":"A0030057#87"},{"c":"s","q":"以詐術或其他非法之方法，使廠商無法投標或開標發生不正確結果者，其刑度為何？","o":["三年以下有期徒刑","五年以下有期徒刑，得併科 100 萬元以下罰金","一年以上七年以下有期徒刑","無期徒刑"],"a":1,"e":"§87Ⅲ：處**五年以下**有期徒刑，得併科新臺幣**一百萬元**以下罰金。","r":"A0030057#87"},{"c":"s","q":"§87 之未遂犯，下列何項處罰之？","o":["僅第一項","第一項、第三項及第四項","全部各項","僅第五項"],"a":1,"e":"§87Ⅵ：**第一項、第三項及第四項**之未遂犯罰之。","r":"A0030057#87"},{"c":"s","q":"受機關委託提供採購規劃、設計、審查、監造、專案管理或代辦採購廠商之人員，意圖為私人不法利益，對技術、工法、材料、設備或規格為違反法令之限制或審查因而獲得利益者，其刑度為何？","o":["五年以下有期徒刑","一年以上七年以下有期徒刑，得併科 300 萬元以下罰金","三年以下有期徒刑","六月以上五年以下有期徒刑"],"a":1,"e":"§88Ⅰ：處**一年以上七年以下**有期徒刑，得併科新臺幣**三百萬元**以下罰金；未遂犯罰之。","r":"A0030057#88"},{"c":"s","q":"受託廠商之人員意圖為私人不法利益，洩漏或交付關於採購應秘密之資訊因而獲得利益者，其刑度為何？","o":["一年以上七年以下有期徒刑","五年以下有期徒刑、拘役或科或併科 100 萬元以下罰金","三年以下有期徒刑","六月以上五年以下有期徒刑"],"a":1,"e":"§89Ⅰ：處**五年以下**有期徒刑、拘役或科或併科新臺幣**一百萬元**以下罰金；未遂犯罰之。","r":"A0030057#89"},{"c":"s","q":"廠商之代表人、受雇人或其他從業人員，因執行業務犯本法之罪者，對該廠商之效果為何？","o":["廠商不受處罰","除處罰行為人外，對該廠商亦科以該條之罰金","僅處罰廠商","廠商應負連帶賠償責任"],"a":1,"e":"§92：兩罰規定——除依該條規定處罰其行為人外，**對該廠商亦科以該條之罰金**。","r":"A0030057#92"},{"c":"s","q":"依 §101Ⅰ，機關發現廠商有法定情形之一，應為何種處置？","o":["逕行刊登政府採購公報","將事實、理由及依 §103Ⅰ 所定期間通知廠商，並附記如未提出異議者將刊登政府採購公報","逕行解除契約","移送檢察機關"],"a":1,"e":"§101Ⅰ：應將事實、理由及依 §103Ⅰ 所定期間**通知廠商**，並附記如未提出異議者將刊登政府採購公報。","r":"A0030057#101"},{"c":"s","q":"機關為 §101Ⅰ 之通知前，應踐行何種程序？","o":["無須任何程序","應給予廠商口頭或書面陳述意見之機會，並應成立採購工作及審查小組認定","應報上級機關核准","應經評選委員會決議"],"a":1,"e":"§101Ⅲ：應給予廠商**陳述意見**之機會，並應成立**採購工作及審查小組**認定廠商是否該當各款情形之一。","r":"A0030057#101"},{"c":"s","q":"機關審酌 §101Ⅰ 所定「情節重大」，應考量下列何者？","o":["僅考量機關所受損害","機關所受損害之輕重、廠商可歸責之程度、廠商之實際補救或賠償措施等情形","僅考量採購金額","僅考量廠商規模"],"a":1,"e":"§101Ⅳ：應考量**機關所受損害之輕重、廠商可歸責之程度、廠商之實際補救或賠償措施**等情形。","r":"A0030057#101"},{"c":"s","q":"廠商對機關依 §101 所為之通知認為違反本法或不實者，得於幾日內提出異議？","o":["10 日","15 日","20 日","30 日"],"a":2,"e":"§102Ⅰ：得於接獲通知之次日起**二十日**內以書面向該機關提出異議（本法唯一的 20 日異議期間）。","r":"A0030057#102"},{"c":"s","q":"廠商對 §101 停權之異議處理結果不服而提出申訴，其金額限制為何？","o":["限公告金額以上","無論該案件是否逾公告金額均得申訴","限查核金額以上","限巨額採購"],"a":1,"e":"§102Ⅱ：**無論該案件是否逾公告金額**，得於 15 日內向該管採購申訴審議委員會申訴。","r":"A0030057#102"},{"c":"s","q":"廠商有 §101Ⅰ 第 1 款至第 5 款、第 15 款情形者，其停權期間為何？","o":["自刊登之次日起 3 個月","自刊登之次日起 6 個月","自刊登之次日起 1 年","自刊登之次日起 3 年"],"a":3,"e":"§103Ⅰ①：第 1～5 款、第 15 款情形或第 6 款判處有期徒刑者，自刊登之次日起**三年**。","r":"A0030057#103"},{"c":"s","q":"廠商有 §101Ⅰ 第 13 款（破產程序中之廠商）、第 14 款情形者，其停權期間為何？","o":["3 個月","6 個月","1 年","3 年"],"a":2,"e":"§103Ⅰ②：第 13 款、第 14 款情形或第 6 款判處拘役、罰金或緩刑者，自刊登之次日起**一年**。","r":"A0030057#103"},{"c":"s","q":"廠商有 §101Ⅰ 第 7 款至第 12 款情形，且於通知日起前五年內未被任一機關刊登者，其停權期間為何？","o":["自刊登之次日起 3 個月","自刊登之次日起 6 個月","自刊登之次日起 1 年","自刊登之次日起 3 年"],"a":0,"e":"§103Ⅰ③：前 5 年內未被刊登者 **3 個月**；已被刊登 1 次者 6 個月；累計 2 次以上者 1 年。","r":"A0030057#103"},{"c":"s","q":"刊登於政府採購公報之廠商，於停權期間內受何種限制？","o":["僅不得參加投標","不得參加投標或作為決標對象或分包廠商","不得參加投標及作為決標對象，但得為分包廠商","不得經營任何業務"],"a":1,"e":"§103Ⅰ：不得**參加投標**或作為**決標對象**或**分包廠商**。","r":"A0030057#103"},{"c":"s","q":"機關因特殊需要而有向停權廠商採購之必要時，應如何處理？","o":["一律不得採購","經上級機關核准者，不適用停權之規定","經主管機關核准","經機關首長核准"],"a":1,"e":"§103Ⅱ：機關因特殊需要而有向前項廠商採購之必要，經**上級機關核准**者，不適用前項規定。","r":"A0030057#103"},{"c":"s","q":"主管機關得參酌相關法令採取措施扶助何種企業承包或分包一定金額比例以上之政府採購？","o":["大型企業","中小企業","外國企業","公營事業"],"a":1,"e":"§97Ⅰ：得採取措施扶助**中小企業**承包或分包一定金額比例以上之政府採購；扶助辦法由主管機關定之。","r":"A0030057#97"},{"c":"s","q":"機關辦理採購之文件，除依會計法或其他法律規定保存者外，應如何處理？","o":["無須另備","應另備具一份，保存於主管機關指定之場所","應送審計機關保存","應永久保存於機關"],"a":1,"e":"§107：應**另備具一份**，保存於**主管機關指定之場所**。","r":"A0030057#107"},{"c":"z","q":"中央及直轄市、縣（市）政府應成立何種組織稽核監督採購事宜？","o":["採購評選委員會","採購稽核小組","工程施工查核小組","採購申訴審議委員會"],"a":1,"e":"§108Ⅰ：中央及直轄市、縣（市）政府應成立**採購稽核小組**，稽核監督採購事宜。","r":"A0030057#108"},{"c":"z","q":"機關辦理採購，關於採購專業人員之規定為何？","o":["一律應由採購專業人員為之","宜由採購專業人員為之；但一定金額之採購，應由採購專業人員為之","無須採購專業人員","僅巨額採購須採購專業人員"],"a":1,"e":"§95Ⅰ：**宜**由採購專業人員為之；但**一定金額**之採購，**應**由採購專業人員為之。","r":"A0030057#95"},{"c":"z","q":"採購專業人員之資格、考試、訓練、發證、管理辦法及一定金額，由何者訂定？","o":["主管機關單獨訂定","主管機關會商相關機關定之","考試院定之","行政院定之"],"a":1,"e":"§95Ⅱ：由**主管機關會商相關機關**定之   }
  return total + section + num;
}

  IDX.push({ lid: l.id, lt: l.title, ls: l.short || l.title, no: a.no, label: a.label,
             ch: a.ch || '', cat: a.cat, cats: [a.cat].concat(a.xc || []),
             text, key: (l.title + ' ' + a.label + ' ' + text) });
}));

/* 條文互引：抓出「本法第○條」「第○條之○」等 → 建立正向 / 反向索引 */
const REFRE = /(本法|政府採購法|採購法|本細則|本辦法|本準則|本規則|本標準|本要點)?第\s*([一二三四五六七八九十百零〇\d]+)\s*條(?:\s*之\s*([一二三四五六七八九十\d]+))?/g;
const REV = {};        // 'A0030057#50' -> [{lid,no,label,lt}]
function refTarget(prefix, selfLid) {
  if (prefix === '本法' || prefix === '政府採購法' || prefix === '採購法') return 'A0030057';
  if (prefix) return selfLid;              // 本細則/本辦法…
  return selfLid;                          // 無前綴 → 同法
}
LAWS.forEach(l => l.articles.forEach(a => {
  const seen = new Set();
  REFRE.lastIndex = 0; let m;
  const body = a.lines.join('\n');
  while ((m = REFRE.exec(body))) {
    const tl = refTarget(m[1], l.id);
    const n = cn2n(m[2]) + (m[3] ? '-' + cn2n(m[3]) : '');
    const key = tl + '#' + n;
    if (seen.has(key)) continue;
    seen.add(key);
    if (tl === l.id && String(n) === String(a.no)) continue;
    (REV[key] = REV[key] || []).push({ lid: l.id, no: a.no, label: a.label, lt: l.title, ls: l.short || l.title });
  }
}));

const inCat = (a, cid) => a.cat === cid || (a.xc || []).indexOf(cid) >= 0;

/* ================== 狀態 ================== */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('gpa.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('gpa.' + k, JSON.stringify(v)); } catch (e) {} }
};
let marks = new Set(LS.get('marks', []));
const saveMarks = () => LS.set('marks', Array.from(marks));

const S = { view: 'home', lid: null, cat: null, q: '', scope: 'all', open: {} };

/* ================== 搜尋 ================== */
const NUMONLY = /^第?\s*([一二三四五六七八九十百零〇\d]+)\s*(?:條)?(?:\s*之\s*([一二三四五六七八九十\d]+))?\s*$/;

function tokenize(q) {
  return q.trim().split(/[\s,，、]+/).filter(Boolean);
}
function scopeFilter(rec) {
  if (S.scope === 'law' && S.lid) return rec.lid === S.lid;
  if (S.scope === 'cat' && S.cat) return rec.cats.indexOf(S.cat) >= 0;
  if (S.scope === 'mark') return marks.has(rec.lid + '#' + rec.no);
  return true;
}
function search(q) {
  const out = [];
  const nm = q.trim().match(NUMONLY);
  let wantNo = null;
  if (nm) wantNo = cn2n(nm[1]) + (nm[2] ? '-' + cn2n(nm[2]) : '');
  const terms = tokenize(q);
  IDX.forEach(rec => {
    if (!scopeFilter(rec)) return;
    let score = 0, hit = false;
    if (wantNo != null && String(rec.no) === String(wantNo)) { score += 1000; hit = true; }
    if (terms.length) {
      let all = true, sc = 0;
      for (const t of terms) {
        const inTx = rec.text.indexOf(t);
        const inTi = rec.lt.indexOf(t);
        const inNo = rec.label.indexOf(t);
        if (inTx < 0 && inTi < 0 && inNo < 0) { all = false; break; }
        if (inTx >= 0) { sc += 10 + Math.max(0, 6 - Math.floor(inTx / 40));
          let c = 0, i = 0; while ((i = rec.text.indexOf(t, i)) >= 0) { c++; i += t.length; }
          sc += Math.min(c, 8); }
        if (inTi >= 0) sc += 14;
        if (inNo >= 0) sc += 6;
      }
      if (all) { score += sc; hit = true; }
    }
    if (!hit) return;
    if (rec.lid === 'A0030057') score += 6;
    if (rec.lid === 'A0030058') score += 3;
    out.push({ rec, score, terms, wantNo });
  });
  out.sort((a, b) => b.score - a.score || a.rec.lid.localeCompare(b.rec.lid) || cn2n(String(a.rec.no)) - cn2n(String(b.rec.no)));
  return out;
}
function snippet(text, terms) {
  let pos = -1;
  for (const t of terms) { const i = text.indexOf(t); if (i >= 0 && (pos < 0 || i < pos)) pos = i; }
  if (pos < 0) return text.slice(0, 150);
  const s = Math.max(0, pos - 18);
  return (s > 0 ? '…' : '') + text.slice(s, s + 200);
}
function hl(str, terms) {
  const S1 = String.fromCharCode(1), S2 = String.fromCharCode(2);
  let h = esc(str);
  (terms || []).filter(Boolean).sort((x, y) => y.length - x.length).forEach(t => {
    const te = esc(t);
    if (!te) return;
    let out = '', i = 0;
    for (;;) {
      const j = h.indexOf(te, i);
      if (j < 0) { out += h.slice(i); break; }
      out += h.slice(i, j) + S1 + te + S2;
      i = j + te.length;
    }
    h = out;
  });
  return h.split(S1).join('<mark>').split(S2).join('</mark>');
}

/* ================== 條文渲染 ================== */
function linkRefs(htmlStr, selfLid) {
  return htmlStr.replace(REFRE, (full, pre, n1, n2) => {
    const tl = refTarget(pre, selfLid);
    const n = cn2n(n1) + (n2 ? '-' + cn2n(n2) : '');
    if (!LAWBY[tl] || !LAWBY[tl].artBy[n]) return full;
    return `<span class="xref" data-go="${tl}#${n}">${full}</span>`;
  });
}
function artHTML(a, terms) {
  const l = LAWBY[a.lid];
  const key = a.lid + '#' + a.no;
  const isM = marks.has(key);
  const multi = a.lines.length > 1 && !a.mono;
  const body = a.mono
    ? `<pre class="mono">${esc(a.lines.join(String.fromCharCode(10)))}</pre>`
    : a.lines.map((ln, i) => {
    let t = terms && terms.length ? hl(ln, terms) : esc(ln);
    t = linkRefs(t, a.lid).replace(/\n/g, '<br>');
    return `<p class="${multi ? 'num' : ''}" ${multi ? `data-n="${i + 1}"` : ''}>${t}</p>`;
  }).join('');
  const rel = REV[key] || [];
  const relHTML = rel.length ? `<div class="relbar"><span class="rl">相關條文</span>` +
    rel.slice(0, 14).map(r => `<button class="relchip" data-go="${r.lid}#${r.no}">${esc(r.ls)} ${esc(r.label)}</button>`).join('') +
    (rel.length > 14 ? `<span class="rl">…共 ${rel.length} 條</span>` : '') + `</div>` : '';
  return `<article class="art${isM ? ' marked' : ''}" id="a-${a.lid}-${a.no}" data-key="${key}">
    <div class="arthd">
      <span class="artno">${esc(a.label)}</span>
      ${a.ch ? `<span class="artch">${esc(a.ch)}</span>` : ''}
      ${S.view === 'search' || S.view === 'cat' ? `<span class="artch">${esc(l.short || l.title)}</span>` : ''}
      <span class="artacts">
        <button class="iact${isM ? ' act' : ''}" data-mark="${key}" title="標記為重點">${isM ? '★' : '☆'}</button>
        <button class="iact" data-copy="${key}" title="複製條文">⧉</button>
      </span>
    </div>
    <div class="artbody">${body}</div>${relHTML}</article>`;
}

function syncNav() {
  $$('.navcat').forEach(b => b.classList.remove('on'));
  $$('.navlaw').forEach(b => b.classList.remove('on'));

      const box = $(`[data-laws="${c}"]`); if (box) box.classList.remove('hidden');

  else { const b = $(`.navcat[data-view="${S.view}"]`); if (b) b.classList.add('on'); }

}

  const l = LAWBY[lid];

  if (catFilter && l.multi) arts = arts.filter(a => inCat(a, catFilter));

    out += artHTML(a, null);

function viewSearch(q) {
  const res = search(q);
  if (!res.length) {
    return `<div class="empty"><div class="big">🔍</div><h3>找不到「${esc(q)}」</h3>
      <p>試試：只留關鍵詞（如 <code>押標金</code>）· 改用同義詞 · 放寬搜尋範圍為「全部法規」<br>
      或直接輸入條號，例如 <code>101</code>。</p></div>`;
  }
  const terms = tokenize(q);
  const groups = [];
  const gm = {};
  res.forEach(r => {
    if (!gm[r.rec.lid]) { gm[r.rec.lid] = { lid: r.rec.lid, lt: r.rec.lt, items: [] }; groups.push(gm[r.rec.lid]); }
    gm[r.rec.lid].items.push(r);
  });
  const scopeName = { all: '全部法規', law: '本法規', cat: '本分類', mark: '我的重點' }[S.scope];
  return `<div class="rescount">在<b> ${scopeName} </b>中找到 <b>${res.length}</b> 條符合「${esc(q)}」，分佈於 ${groups.length} 部法規</div>` +
    groups.map(g => `<div class="resgrp"><h4>${esc(g.lt)}<span class="n">${g.items.length}</span></h4>` +

/* ---------- 自我測驗（選擇題 + 條號翻牌） ---------- */
let QZ = { mode: 'mcq', scope: 'all', pool: [], i: 0, shown: false, picked: null, right: 0, wrong: 0 };

function quizScopes() {
  return [['all', '全部'], ['main', '只考採購法'], ['md', '採購法＋細則'], ['mark', '★我的重點']]
    .concat(D.cats.map(c => ['c:' + c.id, c.name]));
}
function buildPool() {
  QZ.i = 0; QZ.shown = false; QZ.picked = null; QZ.right = 0; QZ.wrong = 0;
  let p;
  if (QZ.mode === 'mcq') {
    p = D.quiz.slice();
    if (QZ.scope === 'main' || QZ.scope === 'md') p = p.filter(x => x.r.indexOf('A003005') === 0);
    else if (QZ.scope === 'mark') p = p.filter(x => marks.has(x.r));
    else if (QZ.scope.indexOf('c:') === 0) p = p.filter(x => x.c === QZ.scope.slice(2));
  } else {
    p = IDX.filter(r => r.text.length > 25);
    if (QZ.scope === 'main') p = p.filter(r => r.lid === 'A0030057');
    else if (QZ.scope === 'md') p = p.filter(r => r.lid === 'A0030057' || r.lid === 'A0030058');
    else if (QZ.scope === 'mark') p = p.filter(r => marks.has(r.lid + '#' + r.no));
    else if (QZ.scope.indexOf('c:') === 0) p = p.filter(r => r.cats.indexOf(QZ.scope.slice(2)) >= 0);
  }
  for (let i = p.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  QZ.pool = p;
}
function viewQuiz() {
  if (!QZ.pool.length) buildPool();
  const head = `<div class="crumb">工具</div>
   <div class="lawhead"><h2>自我測驗</h2>
     <div class="lawmeta"><span>${D.quiz.length} 題選擇題（自製練習題，非官方考古題）　·　${IDX.length} 條條號翻牌卡</span></div></div>
   <div class="scoperow" style="margin:0 0 14px">
     <span class="lbl">題型</span>
     <button class="chip${QZ.mode === 'mcq' ? ' on' : ''}" data-qm="mcq">選擇題</button>
     <button class="chip${QZ.mode === 'no' ? ' on' : ''}" data-qm="no">看條文猜條號</button>
     <button class="chip${QZ.mode === 'tx' ? ' on' : ''}" data-qm="tx">看條號背條文</button>
     <span style="flex:1"></span>
     <button class="chip" data-qa="reset">↺ 重新開始</button>
   </div>
   <div class="scoperow" style="margin:0 0 18px">
     <span class="lbl">範圍</span>
     ${quizScopes().map(([v, n]) => `<button class="chip${QZ.scope === v ? ' on' : ''}" data-qs="${v}">${n}</button>`).join('')}
   </div>`;
  if (!QZ.pool.length) return head + `<div class="empty"><div class="big">?</div><h3>此範圍沒有題目</h3>
    <p>換一個範圍，或先在條文上點 <code>☆</code> 標記重點。</p></div>`;

  const n = QZ.pool.length, cur = QZ.i % n;
  const done = QZ.right + QZ.wrong;
  const stat = `<div class="bar"><i style="width:${Math.round((cur / n) * 100)}%"></i></div>
    <div class="score"><span>第 <b>${cur + 1}</b> / ${n} 題</span>
      <span class="ok">✓ <b>${QZ.right}</b></span><span class="ng">✗ <b>${QZ.wrong}</b></span>
      ${done ? `<span>正確率 <b>${Math.round(QZ.right / done * 100)}%</b></span>` : ''}</div>`;

  if (QZ.mode === 'mcq') {
    const q = QZ.pool[cur];
    const cat = D.cats.find(c => c.id === q.c);
    const L = ['A', 'B', 'C', 'D'];
    const opts = q.o.map((o, i) => {
      let cls = '';
      if (QZ.picked != null) {
        if (i === q.a) cls = ' right';
        else if (i === QZ.picked) cls = ' wrong';
      }
      return `<button class="opt${cls}" data-pick="${i}" ${QZ.picked != null ? 'disabled' : ''}>
        <span class="lt">${L[i]}</span><span>${esc(o)}</span></button>`;
    }).join('');
    const lid = q.r.split('#')[0], ano = q.r.split('#')[1];
    const lawOf = LAWBY[lid];
    const artLabel = lawOf && lawOf.artBy[ano] ? lawOf.artBy[ano].label : '';
    return head + `<div class="fcwrap" style="max-width:720px"><div class="mcq">
      <div class="qn">${cat ? esc(cat.code + ' ' + cat.name) : ''}　·　第 ${cur + 1} 題</div>
      <div class="qt">${esc(q.q)}</div>
      <div class="opts">${opts}</div>
      ${QZ.picked != null ? `<div class="expl"><div class="lb">${QZ.picked === q.a ? '答對了' : '正解為 ' + L[q.a]}</div>
        <div>${q.e.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</div>
        ${lawOf ? `<div style="margin-top:9px"><button class="relchip" data-go="${q.r}">前往 ${esc(lawOf.short || lawOf.title)} ${esc(artLabel)} →</button></div>` : ''}
      </div>` : ''}
      </div>
      <div class="fcbar">${QZ.picked != null
        ? `<button class="tbtn on" data-qa="next">下一題 →</button>`
        : `<button class="tbtn" data-qa="skip">跳過 ↷</button>`}</div>
      ${stat}</div>`;
  }

  const r = QZ.pool[cur];
  let bodyHTML;
  if (QZ.mode === 'no') {
    bodyHTML = `<div class="q">這是哪一條？</div>
      <div class="body">${esc(r.text.slice(0, 320)).replace(/\n/g, '<br>')}${r.text.length > 320 ? '…' : ''}</div>
      ${QZ.shown ? `<div class="ans"><div class="big">${esc(r.label)}</div>
        <div class="lw">${esc(r.lt)}${r.ch ? ' · ' + esc(r.ch) : ''}</div></div>` : ''}`;
  } else {
    bodyHTML = `<div class="q">${esc(r.lt)}</div>
      <div class="body" style="font-size:24px;font-weight:900;color:var(--accent)">${esc(r.label)}</div>
      <div style="font-size:12.5px;color:var(--ink3);margin-top:6px">${esc(r.ch || '')}</div>
      ${QZ.shown ? `<div class="ans"><div style="font-family:var(--serif);font-size:15px;line-height:1.9">${esc(r.text.slice(0, 400)).replace(/\n/g, '<br>')}${r.text.length > 400 ? '…' : ''}</div></div>` : ''}`;
  }
  return head + `<div class="fcwrap"><div class="fc">${bodyHTML}</div>
    <div class="fcbar">
      ${QZ.shown ? `<button class="tbtn" data-qa="right">✓ 答對了</button>
                    <button class="tbtn" data-qa="wrong">✗ 沒記住</button>
                    <button class="tbtn" data-qa="goto">前往原文 →</button>`
                 : `<button class="tbtn on" data-qa="show">翻牌看答案</button>
                    <button class="tbtn" data-qa="skip">跳過 ↷</button>`}
    </div>${stat}</div>`;
}

/* ================== 路由 / 渲染 ================== */
function render() {
  const v = $('#view');
  let html;
  if (S.q) { S.view = 'search'; html = viewSearch(S.q); }
  else if (S.view === 'law') html = viewLaw(S.lid, S.cat);
  else if (S.view === 'cat') html = viewCat(S.cat);
  else if (S.view === 'memo') html = viewMemo();
  else if (S.view === 'cmp') html = viewCmp();
  else if (S.view === 'cmp2') html = viewCompare();
  else if (S.view === 'quiz') html = viewQuiz();
  else if (S.view === 'marks') html = viewMarks();
  else html = viewHome();
  v.innerHTML = html;
  syncNav();
  updateScopeChips();
}
function updateScopeChips() {
  $$('#scoperow .chip[data-scope]').forEach(b => {
    b.classList.toggle('on', b.dataset.scope === S.scope);
    if (b.dataset.scope === 'law') { b.disabled = !S.lid; b.style.opacity = S.lid ? 1 : .4; }
    if (b.dataset.scope === 'cat') { b.disabled = !S.cat; b.style.opacity = S.cat ? 1 : .4; }
  });
}
function goto(key) {
  const [lid, no] = key.split('#');
  const l = LAWBY[lid]; if (!l) return;
  const a = l.artBy[no];
  S.q = ''; $('#q').value = '';
  S.lid = lid; S.cat = a ? a.cat : l.articles[0].cat; S.view = 'law';
  render();
  requestAnimationFrame(() => {
    const el = document.getElementById('a-' + lid + '-' + no);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 2200);
    } else window.scrollTo({ top: 0 });
  });
  closeSide();
}
function closeSide() { $('#side').classList.remove('open'); $('#scrim').classList.remove('on'); }

/* ================== 事件 ================== */
let tmr = null;
$('#q').addEventListener('input', e => {
  clearTimeout(tmr);
  const val = e.target.value;
  tmr = setTimeout(() => { S.q = val.trim(); render(); window.scrollTo({ top: 0 }); }, 130);
});
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.target.value = ''; S.q = ''; S.view = S.lid ? 'law' : 'home'; render(); }
});
$$('#scoperow .chip[data-scope]').forEach(b => b.addEventListener('click', () => {
  S.scope = b.dataset.scope;
  if (S.scope === 'mark' && !S.q) { S.view = 'marks'; }
  render();
}));
$('#btnCmp').addEventListener('click', () => { S.q = ''; $('#q').value = ''; S.view = 'cmp2'; render(); window.scrollTo({top:0}); });
$('#btnMemo').addEventListener('click', () => { S.q = ''; $('#q').value = ''; S.view = 'memo'; render(); window.scrollTo({top:0}); });
$('#btnQuiz').addEventListener('click', () => { S.q = ''; $('#q').value = ''; S.view = 'quiz'; render(); window.scrollTo({top:0}); });
$('#btnTheme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const nx = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nx); LS.set('theme', nx);
});
$('#fabTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
$('#fabPrint').addEventListener('click', () => window.print());
$('#mob').addEventListener('click', () => { $('#side').classList.toggle('open'); $('#scrim').classList.toggle('on'); });
$('#scrim').addEventListener('click', closeSide);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-cat],[data-law],[data-view],[data-home],[data-mark],[data-copy],[data-qa],[data-qs],[data-qm],[data-pick],[data-cmp],#clearMarks');
  if (!t) return;
  if (t.dataset.go) { goto(t.dataset.go); return; }
  if (t.id === 'clearMarks') { if (confirm('確定清除全部標記？')) { marks.clear(); saveMarks(); render(); } return; }
  if (t.dataset.mark) {
    const k = t.dataset.mark;
    if (marks.has(k)) marks.delete(k); else marks.add(k);
    saveMarks();
    const art = t.closest('.art');
    art.classList.toggle('marked', marks.has(k));
    t.classList.toggle('act', marks.has(k));
    t.textContent = marks.has(k) ? '★' : '☆';
    const mn = $('#markN'); if (mn) mn.textContent = marks.size;
    return;
  }
  if (t.dataset.copy) {
    const [lid, no] = t.dataset.copy.split('#');
    const a = LAWBY[lid].artBy[no];
    const txt = LAWBY[lid].title + ' ' + a.label + '\n' + a.lines.join('\n');
    navigator.clipboard && navigator.clipboard.writeText(txt);
    t.textContent = '✓'; setTimeout(() => t.textContent = '⧉', 1100);
    return;
  }
  if (t.dataset.law) { S.q = ''; $('#q').value = ''; S.lid = t.dataset.law; S.cat = t.dataset.lcat || LAWBY[S.lid].articles[0].cat; S.view = 'law'; render(); window.scrollTo({ top: 0 }); closeSide(); return; }
  if (t.dataset.cat) {
    S.q = ''; $('#q').value = '';
    if (S.view === 'cat' && S.cat === t.dataset.cat) { const box = $(`[data-laws="${t.dataset.cat}"]`); if (box) box.classList.toggle('hidden'); return; }
    S.cat = t.dataset.cat; S.lid = null; S.view = 'cat'; render(); window.scrollTo({ top: 0 }); closeSide(); return;
  }
  if (t.dataset.home !== undefined && t.hasAttribute('data-home')) { S.q = ''; $('#q').value = ''; S.view = 'home'; S.lid = null; S.cat = null; render(); window.scrollTo({ top: 0 }); closeSide(); return; }
  if (t.dataset.view) { S.q = ''; $('#q').value = ''; S.view = t.dataset.view; render(); window.scrollTo({ top: 0 }); closeSide(); return; }
  if (t.dataset.cmp) { CMP.id = t.dataset.cmp; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (t.dataset.qs) { QZ.scope = t.dataset.qs; buildPool(); render(); return; }
  if (t.dataset.qm) { QZ.mode = t.dataset.qm; buildPool(); render(); return; }
  if (t.dataset.pick != null && t.hasAttribute('data-pick')) {
    if (QZ.picked != null) return;
    QZ.picked = +t.dataset.pick;
    const q = QZ.pool[QZ.i % QZ.pool.length];
    if (QZ.picked === q.a) QZ.right++; else QZ.wrong++;
    render(); return;
  }
  if (t.dataset.qa) {
    const act = t.dataset.qa;
    if (act === 'reset') { buildPool(); }
    else if (act === 'show') QZ.shown = true;
    else if (act === 'next') { QZ.i++; QZ.picked = null; QZ.shown = false; }
    else if (act === 'skip') { QZ.i++; QZ.picked = null; QZ.shown = false; }
    else if (act === 'right') { QZ.right++; QZ.i++; QZ.shown = false; }
    else if (act === 'wrong') { QZ.wrong++; QZ.i++; QZ.shown = false; }
    else if (act === 'goto') { const r = QZ.pool[QZ.i % QZ.pool.length]; goto(r.lid + '#' + r.no); return; }
    render(); return;
  }
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  else if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    e.preventDefault(); $('#q').focus();
  }
});

/* ================== 啟動 ================== */
const savedTheme = LS.get('theme', null);
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
  document.documentElement.setAttribute('data-theme', 'dark');

buildNav();
render();
})();

</script>
</body>
</html>
