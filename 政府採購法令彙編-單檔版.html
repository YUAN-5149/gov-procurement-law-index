廠商列印電子招標文件投標之格式。但廠商之檔案格式或列印格式不影響讀取、辨識或使用者，機關不得拒絕。","前項機關規定之檔案格式或列印格式不應限制廠商之競爭。"]},{"no":"11","label":"第11條","ch":"第二章招標決標","cat":"z","lines":["機關依第六條第三項規定允許廠商電子投標者，得於招標文件中規定下列事項：","一、廠商應另以其他形式投標之項目。","二、廠商應併提供與電子投標文件相同內容之其他形式文件；如有不同，以電子投標文件為準。","三、決標後，以電子投標文件簽約或以書面文件簽約。以書面文件簽約者，內容應與電子投標文件相同；其不同者，以電子投標文件為準。"]},{"no":"12","label":"第12條","ch":"第二章招標決標","cat":"z","lines":["廠商電子投標者，應依招標文件規定，於投標截止期限前，視投標文件項目形式，分別傳輸至主管機關指定之資訊系統或送達機關指定地點。"]},{"no":"13","label":"第13條","ch":"第二章招標決標","cat":"z","lines":["廠商參與電子採購，依本法第三十條或第三十七條第二項規定繳納押標金、保證金或提供擔保，得以主管機關核定之電子化方式為之。","前項主管機關核定之電子化方式，應公開於指定之資訊系統。"]},{"no":"14","label":"第14條","ch":"第二章招標決標","cat":"z","lines":["廠商之電子投標文件不得含有電腦病毒並能正常開啟而不影響讀取、辨識或使用。"]},{"no":"15","label":"第15條","ch":"第二章招標決標","cat":"z","lines":["機關允許廠商電子投標者，得辦理電子開標及電子決標。","前項開標及決標得免公開為之，並得不通知投標廠商到場。其監辦方式得由監辦單位採書面審核監辦。"]},{"no":"16","label":"第16條","ch":"第二章招標決標","cat":"z","lines":["電子招標文件及電子投標文件，其以文字或圖形檔處理有困難者，得以掃描電子文件代之。","電子投標文件中含有掃描文件者，機關得通知廠商提出書面文件供查驗。"]},{"no":"17","label":"第17條","ch":"第二章招標決標","cat":"z","lines":["機關辦理採購，其與廠商間之通知、說明、減價、比減價格、協商、更改原報內容、重新報價，得以電子資料傳輸方式辦理。"]},{"no":"18","label":"第18條","ch":"第二章招標決標","cat":"z","lines":["機關辦理電子採購，主管機關指定之資訊系統全部或部分功能，因故暫停服務時，其處理方式如下：","一、招標及詢價階段：機關待系統恢復後再行傳輸電子招標文件。","二、領標階段：廠商以招標文件規定之其他方式領標或待系統恢復後再行電子領標。機關得視個案受影響情形，公告延長等標期。","三、報價投標階段：廠商以招標文件規定之其他方式投標或待系統恢復後再行電子投標。機關得視個案受影響情形，公告延長等標期。","四、開標階段：機關待系統恢復後再行開標，或延期開標。但確知無電子投標文件者，不在此限。","個別採購案因特殊情形，致電子採購作業無法正常進行時，得準用前項規定辦理。"]},{"no":"19","label":"第19條","ch":"第三章付款","cat":"z","lines":["機關支付採購價金，得以政府採購卡為之。"]},{"no":"20","label":"第20條","ch":"第三章付款","cat":"z","lines":["機關與發卡機構簽訂之契約，應載明下列事項：","一、政府採購卡之樣式。","二、使用政府採購卡支付外幣者，其匯率之計算方式。","三、帳款疑義之處理。","四、政府採購卡遺失或毀損時之掛失、補發或換發程序及雙方之權利義務。","五、政府採購卡不得預借現金或融資。","六、政府採購卡信用額度。","七、持卡人辦理公務採購，其使用政府採購卡之相關紀錄，與持卡人個人信用無關。","八、機關免除付款責任之事由。","九、其他經主管機關認定者。"]},{"no":"21","label":"第21條","ch":"第三章付款","cat":"z","lines":["政府採購卡之持卡人由機關指定，持卡人於持卡期間內應善盡保管責任。持卡人資格經取消者，機關應通知發卡機構註銷其持卡，原持卡人並應於機關首長或其授權人員指定期間內，辦理結報。"]},{"no":"22","label":"第22條","ch":"第三章付款","cat":"z","lines":["機關得依持卡人及其採購標的之性質、對象及金額，設定政府採購卡之使用權限。","前項權限之設定，應經機關首長或其授權人員之核准。"]},{"no":"23","label":"第23條","ch":"第三章付款","cat":"z","lines":["政府採購卡持卡人於使用權限內得以該卡支付採購價金。","持卡人於收到發卡機構之對帳單後，應併相關採購文件，並於憑證上註明「以政府採購卡支付」之字樣後辦理結報。","前項文件經機關主（會）計單位覆核及機關首長或其授權人員核准後，進行付款程序。"]},{"no":"24","label":"第24條","ch":"第四章附則","cat":"z","lines":["主管機關得向電子採購資訊系統之使用者收費；其收費基準，由主管機關定之。","主管機關於必要時得將電子採購資訊系統委託廠商經營。"]},{"no":"25","label":"第25條","ch":"第四章附則","cat":"z","lines":["本辦法自發布日施行。"]}]},{"id":"A0030072","title":"外國廠商參與非條約協定採購處理辦法","short":"非條約協定外國廠商辦法","date":"民國101年08月14日","kind":"子法","multi":false,"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030072","articles":[{"no":"1","label":"第1條","ch":"","cat":"w","lines":["本辦法依政府採購法（以下簡稱本法）第十七條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"w","lines":["本辦法所稱非條約協定採購，指得不適用我國所締結之條約或協定之採購。","適用我國所締結之條約或協定之採購，機關於招標文件中允許非條約協定國廠商參與者，應明定非條約協定國廠商參與之部分，視同非條約協定採購。"]},{"no":"3","label":"第3條","ch":"","cat":"w","lines":["本辦法所稱外國廠商，指未取得我國國籍之自然人或非依我國法律設立登記之法人、機構或團體。"]},{"no":"4","label":"第4條","ch":"","cat":"w","lines":["廠商所供應之財物或勞務，其原產地之認定，依下列原則：","一、財物之原產地，依進口貨物原產地認定標準。","二、勞務之原產地，除法令另有規定者外，依實際提供勞務者之國籍或登記地認定之。屬自然人者，依國籍認定之；非屬自然人者，依登記地認定之。","三、兼有我國及外國財物或勞務，無法依前二款認定其歸屬者，以所占金額比率最高者歸屬之。","我國廠商所供應財物或勞務之原產地非屬我國者，視同外國廠商。","條約協定國廠商所供應財物或勞務之原產地為非條約協定國者，視同非條約協定國廠商。","工程採購中涉及財物或勞務之提供者，其原產地之認定，準用前三項之規定。"]},{"no":"5","label":"第5條","ch":"","cat":"w","lines":["機關辦理非條約協定採購，得視實際需要於招標文件中規定允許外國廠商參與。"]},{"no":"6","label":"第6條","ch":"","cat":"w","lines":["機關允許外國廠商參與非條約協定採購者，得於招標文件中規定外國廠商不適用本法下列規定：","一、第二十一條第四項平等受邀之機會。","二、第三十七條第一項投標廠商資格。","三、第五十七條第二款平等對待之規定。"]},{"no":"7","label":"第7條","ch":"","cat":"w","lines":["主管機關依本法第十七條第三項規定公告限制或禁止特定國家或地區之廠商或產品、服務參與採購者，該等廠商或產品、服務不得參加投標或作為決標對象。"]},{"no":"7-1","label":"第7-1條","ch":"","cat":"w","lines":["大陸地區廠商參與各機關採購，準用外國廠商之規定。"]},{"no":"8","label":"第8條","ch":"","cat":"w","lines":["本辦法自中華民國八十八年五月二十七施行。","本辦法修正條文自發布日施行。"]}]},{"id":"FL000661","title":"政府採購法第二十六條執行注意事項","short":"§26執行注意事項","date":"民國90年11月09日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL000661","articles":[{"no":"1","label":"第一點","ch":"","cat":"b","lines":["一、本注意事項適用於公開招標、選擇性招標及其他不以特定廠商之技術","規格為邀標標的之限制性招標。"]},{"no":"2","label":"第二點","ch":"","cat":"b","lines":["二、招標文件所定供不特定廠商競標之技術規格，應以達成機關於功能、","效益或特性等需求所必須者為限。如有採購較佳之功能、效益或特性","等之標的之必要，宜採最有利標決標或依政府採購法施行細則第六十","三條規定辦理。"]},{"no":"3","label":"第三點","ch":"","cat":"b","lines":["三、機關所擬定、採用或適用之技術規格，其在目的或效果上有無限制競","爭，應以有無逾機關所必須者認定之，而不以符合該規格之廠商家數","多寡作為判斷依據。其屬專屬權利、獨家製造或供應，無其他合適之","替代標的者，可依政府採購法第二十二條第一項第二款規定辦理。"]},{"no":"4","label":"第四點","ch":"","cat":"b","lines":["四、機關將不同性質之數項財物併案招標，其各項財物係可分別使用且屬","不同行業廠商供應者，應依政府採購法施行細則第六十五條允許分項","報價及分項複數決標。"]},{"no":"5","label":"第五點","ch":"","cat":"b","lines":["五、機關訂定招標文件之技術規格，除依「公共工程招標文件公開閱覽制","度實施要點」辦理者外，得依政府採購法第三十四條第一項規定公開","徵求廠商提供參考資料，以供研議後訂定。"]},{"no":"6","label":"第六點","ch":"","cat":"b","lines":["六、機關擬訂定之技術規格有國際標準或國家標準，其未能符合機關採購","需求，須於招標文件載明其他標準 (例如 JIS、ACI、ASTM 等) 或訂","定較嚴之規格者，應擇下列方式之一審查後再行辦理：","(一) 自行審查：簽報機關首長或其授權人員核准。","(二) 開會審查：簽報機關首長或其授權人員召開審查會議，並得邀請專","家學者、規劃設計者，與會協助。","(三) 委託審查：委託專業廠商、機構、團體或人士審查，並得召開會議","，邀請專家學者與會。","前項技術規格，其有審查前例者，得免重複為之。"]},{"no":"7","label":"第七點","ch":"","cat":"b","lines":["七、機關或受機關委託研擬招標文件內容之廠商，基於採購特性及實際需","要訂定特殊技術規格，或於招標文件要求或提及特定之商標或商名、","專利、設計或型式、特定來源地、生產者或供應者時，應依前點第一","項方式審查之。機關並應規定受委託之廠商於提出招標文件前先向機","關書面說明其必要性。"]},{"no":"8","label":"第八點","ch":"","cat":"b","lines":["八、機關擬訂定之技術規格無國際標準或國家標準，且無法以精確之方式","說明招標要求，而必須於招標文件要求或提及特定之廠牌時，應註明","「或同等品」字樣，其所列廠牌應符合下列情形：","(一) 所列廠牌僅供廠商參考，不得限制廠商必須採用。","(二) 所列廠牌目前均有製造、供應，容易取得，價格合理，能確保採購","品質，且無代理商、經銷商有公平交易法所稱之獨占或聯合行為之","情事。","(三) 所列廠牌之價格、功能、效益、標準及特性，均屬相當。","決標或簽約後發現有不符合前項第二款情形者，得依本注意事項","第十三點規定辦理。"]},{"no":"9","label":"第九點","ch":"","cat":"b","lines":["九、受機關委託提供採購規劃、設計或專案管理或代辦採購之廠商及其人","員，如有犯政府採購法第八十八條、第九十二條之罪之嫌者，應送檢","調單位查處。"]},{"no":"10","label":"第十點","ch":"","cat":"b","lines":["十、招標文件允許投標廠商提出同等品者，得以下列方式之一為之：","(一) 招標文件註明「或同等品」字樣，並規定廠商如欲提出同等品者","，應於投標文件內預先提出。其經審查非同等品者，為不合格之","廠商。","(二) 招標文件註明「或同等品」字樣，並規定得標廠商如欲提出同等","品者，得於使用同等品前，向機關提出，及機關審查同等品所需","時間。","廠商提出同等品時，應敘明同等品之廠牌、價格及功能、效益","、標準或特性比較表等相關資料，以供機關審查。其經審查為同等","品者，方得使用。"]},{"no":"11","label":"第十一點","ch":"","cat":"b","lines":["十一、同等品係指經機關審查認定其功能、效益、標準或特性等不低於招","標文件所要求或提及者，並得予以檢驗或測試。廠商得標後提出之","同等品，其價格如較契約所載原要求或提及者為低，應自契約價金","中扣除；至於與同等品有關之稅捐、利潤或管理費等相關項目，如","係另列一式計價者，依同等品金額與原契約金額之比率扣減之。其","價格如較契約所載為高，應以原契約價金為準，不得加價。"]},{"no":"12","label":"第十二點","ch":"","cat":"b","lines":["十二、機關就廠商所提出之同等品比較表等資料，應擇下列方式之一審查","之：","(一) 自行審查：簽報機關首長或其授權人員核定是否為同等品。","(二) 開會審查：簽報機關首長或其授權人員召開審查會議，並得邀請","專家學者、廠商代表、原設計者與會，以確認是否為同等品。","(三) 委託審查：委託原設計者、專業廠商、機構、團體或人士審查確","認是否為同等品。審查時得召開會議，邀請專家學者、廠商代表","、原設計者與會。","前項審查結果，其非同等品者，機關應敘明原因書面通知廠商","。","第一項同等品有審查前例者，得免重複為之。"]},{"no":"13","label":"第十三點","ch":"","cat":"b","lines":["十三、機關同意廠商依採購契約要項第二十一點辦理者，其審查程序，得","比照前點方式辦理。"]},{"no":"14","label":"第十四點","ch":"","cat":"b","lines":["十四、內政部七十四年十二月十九日台內營字第三五七四三八號函對於「","同等品使用時機」之相關規定，業經該部八十八年七月十二日台八","八內營字第八八○六五四三號函停止適用，機關不得再依該時機規","定辦理。已載明該時機規定者，無效。"]}]},{"id":"FL029347","title":"政府採購招標文件公開閱覽制度實施要點","short":"公開閱覽要點","date":"民國115年03月12日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL029347","articles":[{"no":"1","label":"第一點","ch":"","cat":"b","lines":["一、為推動政府採購招標作業公開化、透明化，藉由招標文件公開閱覽，","徵求廠商或民眾意見，提升政府採購品質，並減少招標及履約爭議，","特訂定本要點。"]},{"no":"2","label":"第二點","ch":"","cat":"b","lines":["二、機關辦理查核金額以上之採購，應於公告招標前辦理招標文件之公開","閱覽。但有下列情形之一者，不在此限：","（一）依政府採購法第二十二條第一項第三款或第一百零五條第一項第一","款、第二款辦理之採購。","（二）依招標期限標準第四條之一或第十條縮短或合理訂定等標期之採購","。","（三）重複性採購。","（四）適用政府採購條約或協定之採購。","（五）拆除、疏濬等性質單純之採購。","（六）流標、廢標、終止或解除契約前已辦理公開閱覽，且重行招標增加","金額未達查核金額。","（七）因招標作業時程需要，經機關首長或其授權人員核准。","（八）涉及國家安全或機密採購。","前項以外之採購，機關得視採購性質、規模等特性，依本要點辦","理招標文件之公開閱覽。"]},{"no":"3","label":"第三點","ch":"","cat":"b","lines":["三、公開閱覽之文件，包括下列項目：","（一）契約樣稿。","（二）標單樣稿。","（三）切結書樣稿。","（四）投標須知樣稿。","（五）數量表及規格樣稿。","（六）其他依採購特性需要提供之相關文件樣稿（例如位置圖，圖說樣稿","，材料、技術或設備規範，安裝或施工說明書，需求說明書等）。","機關辦理採購之預算金額得與前項文件一併公開。"]},{"no":"4","label":"第四點","ch":"","cat":"b","lines":["四、機關辦理招標文件公開閱覽前，應將公開閱覽之採購名稱、內容摘要","、期間、地點及閱覽廠商或民眾意見之送達期限等公告週知。","前項公告，應公開於政府採購法主管機關之政府採購資訊網站，","必要時並得刊登於政府採購公報之公開徵求廠商提供參考資料公告中","。","第一項閱覽廠商或民眾意見之送達期限，至少應至公開閱覽截止","日後三日。"]},{"no":"5","label":"第五點","ch":"","cat":"b","lines":["五、機關辦理招標文件公開閱覽，不得少於五工作天。但以電子化方式辦","理者，不得少於五日曆天，末日為假日者順延之。"]},{"no":"6","label":"第六點","ch":"","cat":"b","lines":["六、機關辦理招標文件之公開閱覽，應指定專責單位或專人，負責公開閱","覽之公告、廠商或民眾意見之彙整及處理。"]},{"no":"7","label":"第七點","ch":"","cat":"b","lines":["七、機關應將公開閱覽之文件置於指定之適當處所，或以電子化方式公開","於政府採購法主管機關之政府採購資訊網站。","公開閱覽處所應置閱覽登記書表，以供統計人數及彙整意見。","機關得視招標地點及實際需要，分區設置閱覽處所。"]},{"no":"8","label":"第八點","ch":"","cat":"b","lines":["八、公開閱覽之承辦單位應將閱覽廠商或民眾之意見彙整加以列管，並送","請主辦單位處理後，再行辦理招標公告作業。","前項廠商或民眾意見之處理，應以公開方式辦理。"]},{"no":"9","label":"第九點","ch":"","cat":"b","lines":["九、機關辦理公開閱覽之文件，得由閱覽廠商或民眾抄寫、複印。"]},{"no":"10","label":"第十點","ch":"","cat":"b","lines":["十、政府採購招標文件公開閱覽作業流程如附圖。但各機關得視主辦業務","性質及機關編制情形，自行調整承辦單位及作業流程。"]},{"no":"11","label":"第十一點","ch":"","cat":"b","lines":["十一、機關以比價方式辦理採購招標者，得準用本要點之規定辦理比價文","件之公開閱覽。"]}]},{"id":"FL051223","title":"辦理原住民族地區公共工程注意事項","short":"原住民族地區工程注意事項","date":"民國98年11月18日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL051223","articles":[{"no":"1","label":"第一點","ch":"","cat":"b","lines":["一、行政院公共工程委員會（以下簡稱工程會）為提升原住民族地區公共","工程品質及執行效率，特訂定本注意事項。"]},{"no":"2","label":"第二點","ch":"","cat":"b","lines":["二、本注意事項所稱原住民族地區，依原住民族基本法第二條第三款規定","，指原住民傳統居住，具有原住民族歷史淵源及文化特色，經中央原","住民族主管機關報請行政院核定之地區。"]},{"no":"3","label":"第三點","ch":"","cat":"b","lines":["三、預算編列及經費核定：","（一）中央補助機關：","1.對於原住民族地區之公共工程，依其工程困難度、特性及成本之","實際需要，個案調高原住民族地區公共工程補助經費，並應考量","原住民族地區地方機關專業人力不足，補助其委託專案管理廠商","，協助辦理工程。","2.除搶災、搶險或有時效急迫性等特殊工程外，補助機關得考量工","程技術性及複雜性等因素，提前一年補助工程規劃、設計部分之","經費。","3.補助計畫應於年度開始前完成審查，並於年度開始，預算通過後","，即予核定。","4.行政院原住民族委員會（以下簡稱原民會）：寬列「基本設施及","維持費」，以補助原住民族地區鄉（鎮、市）公所之工程維護費","用。","5.原住民族地區屬中央機關權管之公共工程，應以自行編列預算辦","理為原則，避免請地方機關代辦。","（二）工程主辦機關：","1.依政府採購法及工程經費審議相關規定，視個案情形調高工程單","價及經費，並編列合理技術服務費用，以符合原住民族地區公共","工程之特性。","2.辦理工程規劃、設計時，應依政府採購法規定，衡酌特殊個案特","性及當地市場行情予以核實編列相關預算價格，不宜泛用一般性","營建物料價格原則辦理。","3.可依機關委託技術服務廠商評選及計費辦法第四條之二規定編列","委託專案管理預算，並依政府採購法第二十二條第一項第九款規","定，公開評選委託專案管理之優勝廠商，協助機關辦理公共工程","。承辦專案管理之廠商，執行過程如發生弊端，應嚴予追究其責","任。另專案管理廠商不宜同時辦理監造業務，以避免權責不分。","（三）管理維護機關：例行性工程維護費用，中央補助額度如不足時，法","定維護機關應及早自行編列。"]},{"no":"4","label":"第四點","ch":"","cat":"b","lines":["四、災後復建工程經費之審議：","（一）規劃、設計階段，應依工程會所訂「原住民族災區復建工程規劃設","計注意事項」辦理規劃、設計。","（二）災後復建工程經費之提報及審議，除另有規定者外，依「中央對各","級地方政府重大天然災害救災經費處理辦法」規定辦理。","（三）機關提報經費時，應力求精確，以免造成核定經費不符實需。"]},{"no":"5","label":"第五點","ch":"","cat":"b","lines":["五、工程技術服務：","（一）工程主辦機關：","1.為維護技術服務廠商之設計、監造品質及避免廠商低價搶標，建","議依政府採購法第二十二條第一項第九款公開評選優勝廠商，不","宜全面採用最低價方式決標。","2.技術服務費用未達公告金額之技術服務採購，得依中央機關未達","公告金額採購招標辦法第二條第一項第三款規定，公開取得三家","以上廠商之書面報價或企劃書，並採最有利標作業手冊貳、三「","取最有利標精神擇最符合需要者」之作業程序辦理。","3.對小型或有時效急迫性之技術服務採購案，宜採合併招標或開口","契約等發包方式，以提升採購作業效率，且不得意圖規避政府採","購法之適用，而分批辦理技術服務採購。","4.如技術服務採購件數較多者，得依政府採購法第五十二條第一項","第四款採複數決標方式處理。另得於招標文件訂明依評選結果之","優勝情形，給予得標廠商不同件數或金額。","5.可依政府採購法第二十條及第二十一條規定採選擇性招標方式辦","理，預先辦理廠商資格審查，建立合格之技術服務廠商名單，並","給予經資格審查合格之技術服務廠商平等受邀參與各相關階段投","標之機會。","6.應參考工程會訂定之「公共工程技術服務契約範本」，研訂技術","服務契約，並明定技術服務廠商之主要人員資格條件。","7.對工程技術服務標價偏低決標者，應加強設計審查及督導。","（二）縣政府：","1.就所屬工程之技術服務採購案件，依前款規定辦理。","2.就全縣（含鄉、鎮、市）性質相同之小型或有時效急迫性工程技","術服務採購案，得分類後集中統籌以開口契約方式辦理招標，以","協助所轄基層機關，減輕其人力負荷。","（三）工程會：","1.不定期針對承包量異常之設計、監造技術服務廠商進行稽核或查","核，以加強控管。另將上開異常資訊公告於工程會資訊系統，提","供機關辦理技術服務廠商評選及履約管理之參考。","2.配合原民會建置原住民族文化之數位典藏系統等資料，不定期辦","理原住民族地區之技術服務廠商教育訓練。","（四）原民會：持續充實原住民族數位典藏系統內容，並協助推薦工程會","辦理原住民族文化相關訓練課程師資。"]},{"no":"6","label":"第六點","ch":"","cat":"b","lines":["六、工程設計：","（一）中央補助機關：","1.搶災、搶險或有時效急迫性工程應立即辦理；至於一般建設性之","工程計畫，應要求工程主辦機關給予設計者充裕時間，必要時透","過機關與當地耆老溝通及進行設計，並明定於相關補助要點內。","2.針對特殊或大型補助工程，考量補助原住民族地區地方機關外聘","專家、學者協助設計審查，或寬列工程管理費以為支應。","3.原民會：持續建置原住民族數位典藏系統，由受委託辦理公共工","程設計之廠商自行參考。","（二）工程主辦機關：","1.應於招標文件訂明，設計單位應優先參考部落耆老意見、部落原","有特色或原民會數位典藏系統等資料，納入設計，以融入當地原","住民族文化。","2.如機關內部人力或技術不足時，得外聘專家、學者協助辦理特殊","或大型補助工程之設計審查工作。","3.對災後復建工程，應依工程會所訂「原住民族災區復建工程規劃","設計注意事項」辦理設計。"]},{"no":"7","label":"第七點","ch":"","cat":"b","lines":["七、施工及撥款：","（一）中央補助機關：","1.調整撥款相關程序，依工作計畫進度及時撥款。","2.撥款得採下列方式辦理，但原撥款方式更有利於地方機關者，從","其規定：","（１）核定補助金額新臺幣三百萬元以上者：受補助機關於其工程預","算書經直屬縣政府審定，並依補助機關規定方式填報作業進度","後，可檢送補助金額百分之三十額度經費之領據及納入預算證","明，送補助機關請領第一期款。另於工程發包後，其工程施工","進度達百分之五十以上時，應檢送領據、納入預算證明及發包","明細表各一份，送補助機關憑撥剩餘之第二期款。","（２）核定補助金額未達新臺幣三百萬元者：於工程發包後撥付全期","補助款數額。","3.依政府採購法對原住民族地區之補助工程，辦理工程施工查核。","（二）工程主辦機關：","1.儘量依進度辦理分期付款，以提高廠商承攬意願。","2.應依工程會「公共工程施工品質管理作業要點」規定，對監造廠","商及施工廠商辦理工程督導。","3.對履約管理不良之廠商，應依契約規定處置，情節重大者應依政","府採購法第一百零一條至第一百零三條規定辦理。如技術服務廠","商所屬技師、建築師等人員有應付懲戒情事者，機關應依相關法","規報請各該主管機關處理。","（三）縣政府：","1.調整撥款相關程序，配合進度及時撥款予原住民族地區鄉（鎮、","市）公所，以利分期估驗部分款項予廠商。","2.依政府採購法對原住民族地區之公共工程，辦理工程施工查核。","（四）工程會：依政府採購法對原住民族地區之公共工程，辦理工程施工","查核。"]},{"no":"8","label":"第八點","ch":"","cat":"b","lines":["八、工程維護：","（一）管理維護機關：應編列維護費用，並辦理例行性之工程維護。","（二）原民會：對「基本設施及維持費」之受補助機關，辦理不定期督導","，以加強工程維護。"]},{"no":"9","label":"第九點","ch":"","cat":"b","lines":["九、機關工程專業人員：","（一）工程主辦機關：專業技士等人員缺額儘量透過特種考試地方政府公","務人員考試（基層特考）補實，以減低流動率。","（二）原民會：持續爭取預算，補助原住民族地區地方機關聘請工程專業","臨時人員，協助辦理「受補助工程」之督導、監造及設計審查。"]},{"no":"10","label":"第十點","ch":"","cat":"b","lines":["十、原住民族專業訓練及就業：","（一）工程會：協助規劃技術訓練課程。","（二）原民會：調查原住民族訓練需求，並辦理訓練及就業媒合。","（三）行政院勞工委員會職業訓練局：配合原民會辦理訓練及媒合原住民","族就業。"]},{"no":"11","label":"第十一點","ch":"","cat":"b","lines":["十一、查核、督導、訪查及勘查：由各權責機關，透過查核、督導、訪查","及勘查等方式，督促相關機關落實本注意事項。"]}]},{"id":"FL045465","title":"機關辦理公共工程國際競圖注意事項","short":"國際競圖注意事項","date":"民國100年06月08日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL045465","articles":[{"no":"1","label":"第一點","ch":"","cat":"b","lines":["一、為增進機關辦理公共工程國際競圖（以下簡稱國際競圖）之效能，減","少採購爭議，確保採購品質，特訂定本注意事項。"]},{"no":"2","label":"第二點","ch":"","cat":"b","lines":["二、本注意事項所稱國際競圖，指機關辦理公共工程委託規劃設計（得包","括監造）技術服務，允許我國及外國廠商參與競圖或競標。","本注意事項所稱外國廠商，於建築工程係指非依我國法律取得建","築師資格之自然人或聘有該自然人而非依我國法律設立登記之法人或","機構；於其他公共工程係指非依我國法律設立登記得從事工程技術專","業或顧問業之法人或機構。"]},{"no":"3","label":"第三點","ch":"","cat":"b","lines":["三、機關辦理國際競圖，應先評估下列事項：","（一）機關、代辦機關或委辦之專案管理廠商具有辦理國際競圖之能力，","並瞭解工程之國際及國內實務慣例。","（二）用地取得無虞。","（三）工程預算無虞。如涉其他機關補助，應先取得補助機關之書面同意","。"]},{"no":"4","label":"第四點","ch":"","cat":"b","lines":["四、(刪除)"]},{"no":"5","label":"第五點","ch":"","cat":"b","lines":["五、機關辦理國際競圖，應成立專案小組，統籌審查、協調、履約管理等","事項，並負責溝通，釐清不同主管部門之審核意見與審議事宜。","前項小組成員應包含主辦機關、協辦機關、未來可能之使用及接","管單位人員，並由機關首長或其指定之一級主管以上人員擔任召集人","。"]},{"no":"6","label":"第六點","ch":"","cat":"b","lines":["六、機關辦理國際競圖，得採一階段或二階段方式。","採二階段方式辦理者，第一階段評選以規劃構想與專業技術應用","之原則內容為限，第二階段評選包括具體之實質設計內容。"]},{"no":"7","label":"第七點","ch":"","cat":"b","lines":["七、機關採一階段方式辦理國際競圖者，得於招標文件內訂明廠商投標方","式如下：","（一）我國廠商單獨或共同投標。","（二）外國廠商與我國廠商共同投標；外國廠商依我國法令取得許可者，","得在許可範圍內單獨投標。"]},{"no":"8","label":"第八點","ch":"","cat":"b","lines":["八、機關採二階段方式辦理國際競圖者，得於招標文件訂明辦理方式如下","：","（一）第一階段評選允許廠商暫不檢附共同投標協議書，並以下列方式之","一投標：","1.我國廠商單獨或共同投標。","2.外國廠商單獨或共同投標。","3.外國廠商與我國廠商共同投標。","（二）第二階段評選以下列方式之一投標，其採共同投標而未於第一階段","檢附共同投標協議書者，應於本階段檢附：","1.通過第一階段審查之下列廠商，以原名義投標：","（1）我國廠商。","（2）包含我國廠商之共同投標廠商。","（3）依我國法令取得許可，得在許可範圍營業之外國廠商。","2.通過第一階段審查之廠商為未依我國法令取得許可之外國廠商者","，與我國廠商共同投標。","第一階段未入選廠商，得為其他入選者於第二階段之共同投標廠","商或分包廠商。"]},{"no":"9","label":"第九點","ch":"","cat":"b","lines":["九、機關辦理國際競圖，其採購評選委員會委員之遴選，補充原則如下：","（一）聘請國外專家學者參與評選，相關費用依行政院訂頒「各機關聘請","國外顧問、專家及學者來台工作期間支付費用最高標準表」給付。","（二）聘請國外專家學者人數不逾評選委員總額之二分之一。","（三）評選委員名單得於徵得全體委員同意後載明於招標文件。"]},{"no":"10","label":"第十點","ch":"","cat":"b","lines":["十、規劃設計監造服務費用，得依「機關委託技術服務廠商評選及計費辦","法」第二十九條第一項規定簽報上級機關核定，並得依該辦法第二十","四條第一款規定，採固定服務費用或費率決標，不再議減。"]},{"no":"11","label":"第十一點","ch":"","cat":"b","lines":["十一、（刪除）"]},{"no":"12","label":"第十二點","ch":"","cat":"b","lines":["十二、（刪除）"]},{"no":"13","label":"第十三點","ch":"","cat":"b","lines":["十三、國際競圖廠商之服務建議書，其圖說文字、簡報文件得以中文或英","文為之；以英文為之者，應備中文譯本，其與英文文意不符者，以","中文為準。","廠商簡報，應自備翻譯人員。","機關應備翻譯人員，協助評選委員辦理評選。","廠商簡報時間應考量翻譯所需時間。"]},{"no":"14","label":"第十四點","ch":"","cat":"b","lines":["十四、機關對於廠商提送之服務建議書或資料，應重視智慧財產權，未經","廠商同意，不得抄襲使用。","機關對領取獎勵金之未獲選廠商，不得要求將其智慧財產權讓","與機關。"]},{"no":"15","label":"第十五點","ch":"","cat":"b","lines":["十五、機關辦理國際競圖，其履約管理補充原則如下：","（一）履約階段成立審查委員會，辦理國際競圖之設計成果審查作業。","（二）得標廠商履約，如涉及不同機關之法定審查會議，例如環境影響","評估、水土保持計畫送審、結構外審、都市設計審議、建築技術","規則所定之性能設計送審作業等，機關須提供必要之協助。","（三）監造單位品管人員須由國外專業人士擔任者，得依「公共工程施","工品質管理作業要點」第十點第一項但書辦理。"]}]},{"id":"FL039843","title":"機關辦理工程保險採購注意事項","short":"工程保險注意事項","date":"民國92年01月28日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL039843","articles":[{"no":"1","label":"第一點","ch":"","cat":"b","lines":["一、機關辦理工程採購，其由機關自行投保可獲得對機關較有利之承保範","圍、保險費、保險條件、理賠服務等情形者，得將該工程之保險另案","辦理採購。","前項工程保險採購，其屬一定期間、性質相近或同一專案計畫內","之二以上工程者，得合併辦理招標，並得採複數決標。"]},{"no":"2","label":"第二點","ch":"","cat":"b","lines":["二、機關辦理工程保險採購，應依政府採購法（以下簡稱本法）施行細則","第六條規定認定採購金額，並依本法第十八條至第二十三條規定，擇","適當方式辦理招標。"]},{"no":"3","label":"第三點","ch":"","cat":"b","lines":["三、工程保險採購屬勞務採購；機關得視個案特性及實際需要，依本法第","三十條第一項第一款規定免收押標金或保證金或兩者均免。"]},{"no":"4","label":"第四點","ch":"","cat":"b","lines":["四、機關辦理工程保險採購，得依工程實際需要，就下列事項載明於招標","文件：","（一）工程內容：如工程概要、預估工期、預估工程金額、工程圖說、工","程招標文件草案、工程契約文件草案等。","（二）保險種類及承保範圍：以財政部核准之營造／安裝工程綜合保險單","基本條款及特約／附加條款為原則。","（三）保險標的：如工程採購之工程本體、機關提供之施工機具設備，及","對第三人之賠償責任等。","（四）被保險人：以機關、工程承攬廠商、工程契約全部分包廠商等為共","同被保險人。","（五）保險金額：得包括工程契約金額、機關供給材料費用等完成該工程","所需之總工程費或其預估金額，並得加保拆除清理費用、機關提供","之施工機具設備等。","（六）第三人意外責任險：載明每一個人及每一事故體傷或死亡之保險金","額，每一事故財物損害之保險金額及保險期間最高累積責任。","（七）自負額：得為一定金額或每次事故損失金額之一定比例附列最高自","負額及最低自負額。","（八）保險期間：得為自工程開工或開始履約之日起至預定驗收合格之日","止之一定期間。","（九）受益人：機關。","（十）其他附加保險：得包括鄰屋龜裂、倒塌責任險、鄰近財物險、規劃","設計專業責任險等。","（十一）保險單及批單之開立時機：得規定得標之保險公司應於決標後一","定期間內依決標條件出具保險單，並俟各工程採購決標後，依機","關通知之工程決標金額及開工或開始履約日期，出具各該工程之","正式起保批單。","（十二）機關於投保之工程決標後提供保險公司之資料：如工程契約、與","保險內容有關之工程契約變更文件或保險公司核保所需之其他資","料。","（十三）得標之保險公司逾期未開立保險單或正式起保批單之罰則。","（十四）保險費之給付方式：如一次給付、分期給付或按工程決標情形給","付等。","（十五）保險費之結算方式：得規定以工程結算金額作為實際保險金額，","依決標費率結算保險費，並得包括工程提前完工縮短保險期間之","折減方式。","（十六）工程發生工期展延之處理：得規定保險公司應就未完工部分所需","展延日期展延保險期間，及其保險費之計算。","（十七）工程發生增減契約價金之處理：得規定依決標費率增減保險費。","（十八）驗收方式：得規定以保險單及批單之簽發情形、申請理賠事項之","賠付情形等為驗收查驗項目。","（十九）保險契約於保險期間內未經機關同意之任何變更或終止，無效。","（二十）爭議處理：如依本法第八十五條之一規定向採購申訴審議委員會","申請調解，或經兩造協議提付仲裁等。","（二十一）其他必要事項。","前項第七款自負額，應考量工程性質、被保險人自行承受損失能","力及保險市場行情合理訂定之。","機關將二以上工程保險合併辦理採購者，應於招標文件分別載明","各工程概要內容及保險事項。但其內容相同者，不在此限。"]},{"no":"5","label":"第五點","ch":"","cat":"b","lines":["五、機關辦理工程保險採購，其保險內容特殊，須經保險公司報財政部核","准出單者，等標期應考量核准出單所需正常作業時間。"]},{"no":"6","label":"第六點","ch":"","cat":"b","lines":["六、機關辦理工程保險採購，得採最有利標，或依機關委託專業服務廠商","評選及計費辦法之規定，以公開評選方式擇優勝廠商採限制性招標；","未達公告金額者，得依本法第四十九條規定公開取得書面報價或企劃","書，參考最有利標精神，擇符合需要者議價。"]},{"no":"7","label":"第七點","ch":"","cat":"b","lines":["七、機關依前點方式辦理者，得就保險條件、保險費等事項擇列為評選（","審）項目，由投標保險公司提出方案供評選（審）。"]},{"no":"8","label":"第八點","ch":"","cat":"b","lines":["八、機關辦理工程採購，其自行採購工程保險者，應於工程採購之招標文","件載明下列事項：","（一）由機關自行辦理工程保險之事項。","（二）工程承攬廠商應投保之事項。","（三）遇有損失發生時，工程承攬廠商配合申請理賠之應辦事項，包括會","同辦理會勘以鑑定損失範圍、提供保險公司要求之理賠資料及文書","證件等。","（四）因可歸責於工程承攬廠商之事由，致增加機關工程保險費者，應由","工程承攬廠商負擔。","（五）工程承攬廠商履行契約所應自行負擔之風險，應不受工程保險已由","機關投保之影響。","（六）因可歸責於工程承攬廠商之事由，致發生機關須負擔工程保險之自","負額、承保範圍以外之損失、因保險標的發生毀損或滅失時為恢復","原保險金額所需加繳之保險費，概由工程承攬廠商負擔。","（七）機關就保險公司給付之賠償金，得於獲得賠償後，依修復進度核計","費用轉發予工程承攬廠商。其轉發之金額以保險公司給付之賠償金","額為限，並得扣除屬機關供給材料或提供施工機具、設備部分等之","理賠金額。","（八）工程以統包方式辦理者，工程承攬廠商應就自行辦理設計部分投保","專業責任險。"]},{"no":"9","label":"第九點","ch":"","cat":"b","lines":["九、機關對於保險公司出具之保險單及批單，應查證其真偽。"]},{"no":"10","label":"第十點","ch":"","cat":"b","lines":["十、機關辦理財物或勞務保險之採購，得準用本注意事項規定。"]}]},{"id":"FL000719","title":"機關辦理採購之廠商家數規定一覽表","short":"廠商家數一覽表","date":"民國91年07月24日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL000719","articles":[{"no":"1","label":"全文","ch":"","cat":"b","lines":["\n┌──┬────────────┬──────────────┐\n│項次│情形                    │家數規定                    │\n├──┼────────────┼──────────────┤\n│一  │以公開招標方式辦理第一次│政府採購法 (以下簡稱本法) 第│\n│    │開標。                  │四十八條第一項規定有三家以上│\n│    │                        │合格廠商投標，即應開標決標。│\n│    │                        │所稱三家以上合格廠商投標之定│\n│    │                        │義，詳本法施行細則第五十五條│\n│    │                        │。                          │\n├──┼────────────┼──────────────┤\n│二  │以公開招標方式辦理第二次│得不受本法第四十八條第一項三│\n│    │開標。                  │家廠商之限制，由招標機關決定│\n│    │                        │。                          │\n├──┼────────────┼──────────────┤\n│三  │以公開招標方式辦理第三次│無。不論金額大小均得開標。  │\n│    │以後開標。              │                            │\n├──┼────────────┼──────────────┤\n│四  │公開招標，開標後合於招標│如無本法第四十八條第一項各款│\n│    │文件規定之廠商未達三家。│情形之一，而合於招標文件規定│\n│    │                        │之廠商有低於底價或評審委員會│\n│    │                        │建議金額或可評定最有利標者，│\n│    │                        │應即決標。                  │\n├──┼────────────┼──────────────┤\n│五  │公開招標及選擇性招標之分│第二階段以後之投標及開標，無│\n│    │段投標或分段開標。      │廠商家數限制。              │\n├──┼────────────┼──────────────┤\n│六  │公開招標及選擇性招標廢標│準用本法第四十八條第二項關於│\n│    │後依原招標文件重行辦理開│第二次招標之規定。          │\n│    │標。                    │                            │\n├──┼────────────┼──────────────┤\n│七  │以選擇性招標方式為特定個│無。僅一家廠商提出資格文件亦│\n│    │案辦理之資格標。        │得開標。資格審查後，應邀請所│\n│    │                        │有符合資格之廠商投標。      │\n├──┼────────────┼──────────────┤\n│八  │依本法第二十條第二款至第│無。僅一家廠商提出資格文件亦│\n│    │五款辦理選擇性招標，為建│得辦理。                    │\n│    │立合格廠商名單辦理資格審│                            │\n│    │查。                    │                            │\n├──┼────────────┼──────────────┤\n│九  │依本法第二十條第一款辦理│有。須六家以上廠商提出資格文│\n│    │選擇性招標，為建立合格廠│件方得辦理。資格合格廠商未達│\n│    │商名單辦理資格審查。    │六家時，不得建立名單。名單建│\n│    │                        │立後依本法施行細則第二十一條│\n│    │                        │第二項之規定辦理採購。      │\n├──┼────────────┼──────────────┤\n│一○│限制性招標之比價。      │邀請二家以上廠商比價，僅一家│\n│    │                        │廠商投標，得當場改為議價辦理│\n│    │                        │ (本法施行細則第十九條) 。  │\n├──┼────────────┼──────────────┤\n│一一│本法第二十二條第一項第九│無。僅一家廠商應徵，亦得辦理│\n│    │款至第十一款之應徵廠商。│。                          │\n├──┼────────────┼──────────────┤\n│一二│未達公告金額採購之「公開│1 三家以上廠商之書面報價或企│\n│    │取得報價或企劃書」。    │  劃書。第一次公開徵求結果僅│\n│    │                        │  取得一家或二家廠商之書面報│\n│    │                        │  價或企劃書，而欲改以比價或│\n│    │                        │  議價方式辦理者，依「中央機│\n│    │                        │  關未達公告金額採購招標辦法│\n│    │                        │  」第三條之規定，經機關首長│\n│    │                        │  或其授權人員核准，得改以比│\n│    │                        │  價或議價方式辦理。其辦理第│\n│    │                        │  二次公開徵求者，得不受三家│\n│    │                        │  廠商之限制。              │\n│    │                        │2 提出書面報價或企劃書之廠商│\n│    │                        │  家數為數甚多時，得擇價格較│\n│    │                        │  低且符合需要之二家以上廠商│\n│    │                        │  比價，或擇符合需要之最低價│\n│    │                        │  廠商議價。未能完成議價時，│\n│    │                        │  得依標價次序，由價格較低者│\n│    │                        │  起，依序洽其他符合需要者議│\n│    │                        │  價。                      │\n└──┴────────────┴──────────────┘"],"mono":true}]},{"id":"FL003755","title":"水管、電氣與建築工程合併或分開招標原則","short":"水電建築合併招標原則","date":"民國88年12月29日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL003755","articles":[{"no":"1","label":"全文","ch":"","cat":"b","lines":["機關應依下列原則辦理水管、電氣與建築工程之招標：","一、水管及電氣工程所占預算金額預估達查核金額以上者，分開辦理招標","。","二、水管及電氣工程所占預算金額預估達查核金額十分之一以上，且占其","全部工程總預算金額預估達百分之十五以上者，得允許共同投標或分","開辦理招標。","三、採預鑄工法之工程，得合併辦理招標。","四、情況特殊，分開辦理招標於施工配合顯有困難者，得報經上級機關核","准後合併辦理招標。","五、機關以分開辦理招標者，應注意界面整合問題，並於契約中明定廠商","施工配合之責任。"]}]},{"id":"FL048760","title":"機關洽請代辦工程採購執行要點","short":"洽請代辦執行要點","date":"民國98年04月22日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL048760","articles":[{"no":"1","label":"第一點","ch":"","cat":"b","lines":["一、為建立政府採購法（以下簡稱本法）第四十條代辦採購機制，協助非","工程專業機關辦理工程採購，以提升公共工程進度及品質，特訂定本","要點。"]},{"no":"2","label":"第二點","ch":"","cat":"b","lines":["二、依本法第四十條規定，機關之採購，得洽由其他具有專業能力之機關","代辦。上級機關對於未具有專業採購能力之機關，得命其洽由其他具","有專業能力之機關代辦採購。"]},{"no":"3","label":"第三點","ch":"","cat":"b","lines":["三、行政院所屬一級機關、直轄市及縣（市）政府應就本機關及所屬（轄","）機關所辦理之工程採購，善盡監督及協調之責。"]},{"no":"4","label":"第四點","ch":"","cat":"b","lines":["四、未具工程採購專業能力或人力之機關，得徵求其他無隸屬關係，但具","有工程專業能力之機關同意後代辦採購。"]},{"no":"5","label":"第五點","ch":"","cat":"b","lines":["五、直轄市及縣（市）政府得應中央機關之請求代辦採購，中央機關亦得","應直轄市及縣（市）政府之請求代辦採購。"]},{"no":"6","label":"第六點","ch":"","cat":"b","lines":["六、洽辦機關得就下列階段之採購事項，全程或分階段洽請代辦機關代辦","：","（一）規劃與可行性評估階段。","（二）工程設計階段。","（三）工程招標階段。","（四）工程施工階段。","代辦機關應盡善良管理人之注意義務，發揮專業技術協助洽辦機","關徵選合宜之履約廠商，並配合洽辦機關各項服務項目計畫期程，代","辦工程採購。"]},{"no":"7","label":"第七點","ch":"","cat":"b","lines":["七、代辦機關得應洽辦機關之請求，代辦採購事項如下：","（一）審查招標文件中之招標、決標程序及契約條款。","（二）辦理招標文件於公告前之公開閱覽。","（三）辦理採購公告。","（四）處理廠商領標及投標。","（五）底價審議及核定底價或提供不訂底價之建議金額。","（六）辦理開標、審標、評選、比價、議價、決標。","（七）依洽辦機關之請求，辦理訂約、履約管理及驗收。","（八）其他依本法施行細則第四十二條規定，與洽辦機關協議代辦之採購","事項。"]},{"no":"8","label":"第八點","ch":"","cat":"b","lines":["八、洽辦機關編列工程代辦預算，應注意下列事項：","（一）先期規劃費（可行性研究），機關應先行編列預算或籌措經費支用","，其屬具急迫性之計畫，應先循預算程序檢討支應。","（二）概算經費送審，應至遲於第一年度之預算籌編先期會審會議開始三","個月（即三月底）前，提送相關圖說送行政院審議。","（三）代辦機關應依各項作業預估期程，製作分年分月之分配預算，送請","洽辦機關配合辦理；必要時代辦機關應檢討修正要徑作業，送洽辦","機關修正預算分配數。","（四）工程契約訂有有價值之營建廢棄物可抵扣工程款或預付款者，於預","算分配時，應配合工程進度，於抵扣完成後，作合理分配。"]},{"no":"9","label":"第九點","ch":"","cat":"b","lines":["九、洽辦機關與代辦機關所簽訂之代辦協議書，應載明下列事項：","（一）工程名稱。","（二）工程地點。","（三）代辦範圍（包含各服務項目）。","（四）代辦期程。","（五）代辦服務費用。","（六）代辦費用之撥付（包含代辦費、設計費、工程費）。","（七）洽辦、代辦機關權責劃分。","（八）代辦機關指派之人力及其任務。","（九）終止洽辦事項。","（十）附則。","（十一）協議書份數。","（十二）附件（含費用撥付一覽表、權責劃分表、各階段辦理時程管控表","、管控里程碑）。","洽辦機關與代辦機關間之權責，除依簽訂之代辦協議書辦理外，","其履約權責劃分事項，得參採附表訂定之。","圖表附件：附件：專業採購機關代辦工程採購之權責劃分及辦理時程表.pdf附件：專業採購機關代辦工程採購之權責劃分及辦理時程表.XLS"]},{"no":"10","label":"第十點","ch":"","cat":"b","lines":["十、前點第一項第四款代辦期程，應遵照核定之施政計畫期限，訂定計畫","各階段重要工作項目及其「里程碑」，以為管控基準，全程掌握執行","動態，及時排除困難，以提升執行效率。各階段重要工作項目如下：","（一）先期作業階段重要工作項目，包括：可行性研究、綜合（整體）規","劃、環境影響評估、選擇（替代）方案之成本效益方案。","（二）預算編列階段重要工作項目，包括：預算編列、審查、陳報主計處","、立法院通過預算。","（三）前置作業階段重要工作項目，包括：用地取得、水土保持計畫審查","、都市計畫審議、施工階段環境保護執行計畫、請領建照、管線拆","遷及基本設計、細部設計及發包策略等。","（四）工程執行階段重要工作項目，包括：公告、決標、開工、施工階段","重要里程碑（可依交通、水利、建築等工程性質再細分為分段查驗","、分段通車、施作長度、施作面積、基礎完成、結構體完成及裝修","完成等）、竣工、驗收及接管等。"]},{"no":"11","label":"第十一點","ch":"","cat":"b","lines":["十一、代辦機關代辦採購所需服務費用，由洽辦機關及代辦機關協議之。"]},{"no":"12","label":"第十二點","ch":"","cat":"b","lines":["十二、代辦機關如有代辦人力不足者，得依規定進用有經驗之約聘僱人員","，並輔以在職訓練。"]},{"no":"13","label":"第十三點","ch":"","cat":"b","lines":["十三、洽辦機關及代辦機關得視代辦工程採購之執行績效，對於代辦相關","人員，予以適當之獎勵。"]},{"no":"14","label":"第十四點","ch":"","cat":"b","lines":["十四、未具工程採購專業能力或人力之機關，如未能適時覓得代辦機關者","，應及早因應，例如依規定進用有經驗之約聘僱人員，或依本法第","三十九條委託廠商專案管理或洽請代辦機關代辦專案管理，並參考","行政院公共工程委員會訂頒之「公共工程專案管理契約範本」辦理","。"]},{"no":"15","label":"第十五點","ch":"","cat":"b","lines":["十五、依促進民間參與公共建設法辦理之促進民間參與公共建設計畫，按","該法第二十九條由政府投資建設之一部，機關依該法施行細則第三","十三條第一項第一款，由機關興建後交由民間機構經營或使用者，","其工程之興建應依本法辦理，並適用本要點之規定。"]},{"no":"16","label":"第十六點","ch":"","cat":"b","lines":["十六、本要點未盡事宜，依本法及行政院公共工程委員會訂頒之相關作業","規定及範本辦理。"]}]},{"id":"FL005555","title":"特殊軍事採購適用範圍及處理辦法","short":"特殊軍事採購辦法","date":"民國93年09月08日","kind":"子法","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL005555","articles":[{"no":"1","label":"第1條","ch":"","cat":"b","lines":["本辦法依政府採購法 (以下簡稱本法) 第一百零四條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"b","lines":["本法第一百零四條第一項但書所稱武器，指機關槍、衝鋒槍、卡柄槍、步","槍、自動步槍、手槍、光學與化學武器、飛彈系統、戰車、砲車、裝甲車","系統、步兵多人操作武器系統、電子作戰系統、艦艇、水下武器系統、潛","艦、航空或相關武器系統、高性能偵照系統、衛星系統、自動化武器系統","及其他可發射金屬、子彈或火焰且具有殺傷力之各式槍砲。","本法第一百零四條第一項但書所稱彈藥，指前項武器所使用之各類型彈藥","及其他具有殺傷力或破壞性之各類炸彈或爆裂物。","本法第一百零四條第一項但書所稱作戰物資，指雷達、通訊器材、資訊設","備及相關軟體、化學品、陸上、海上或空中之運輸及輸送工具、燃料及潤","滑劑、糧秣、被服、裝載夾具、陣營具、醫療器材及藥品、淨水設備、地","圖影像、照片、模型儀器及文書圖表、建築工程與材料、製造或使用武器","、彈藥或作戰物資所需之材料或設備及其他足以影響戰備之物資。","本法第一百零四條第一項但書所稱與國家安全或國防目的有關之採購，指","為抵禦或防範外來之侵略、情報活動、顛覆或破壞等行為，必須辦理之採","購。"]},{"no":"3","label":"第3條","ch":"","cat":"b","lines":["本法第一百零四條第一項第一款所稱國家面臨戰爭、戰備動員或發生戰爭","，指國家遭遇明顯武力威脅、封鎖或敵國已有具體攻擊行動，國防部依戰","備規定發布應急戰備或依實際需要動員後備部隊者。","本法第一百零四條第一項第二款所稱機密或極機密，指依國家機密保護法","或軍事機密與國防秘密種類範圍等級劃分準則列為機密、極機密或絕對機","密等級者。","本法第一百零四條第一項第三款所稱時效緊急，有危及重大戰備任務之虞","者，指在經常戰備期間，因武器、彈藥或作戰物資臨時偶發事件，致經常","戰備有所缺失，不立即採購有影響應急戰備任務之虞者。"]},{"no":"4","label":"第4條","ch":"","cat":"b","lines":["軍事機關辦理本法第一百零四條第一項第一款之採購，而不適用本法規定","時，由國防部發布命令，並副知主管機關；其命令應記載不適用之條文，","未記載者，仍應適用本法之規定。"]},{"no":"5","label":"第5條","ch":"","cat":"b","lines":["軍事機關辦理前條採購，應符合下列規定：","一、辦理採購前，應經機關首長或其授權人員核准確有依前條命令辦理採","購之必要。","二、以限制性招標方式辦理者，除獨家製造、供應或承做者外，以邀請二","家以上廠商比價為原則。","三、不及與廠商簽訂契約者，應先有書面、電報或傳真協議。","四、不及與廠商確定契約總價者，應先確定單價及契約總價上限。","五、付款條件應能維護公款支用之安全性。","六、作業文件應加註「政府採購法第一百零四條第一項第一款戰爭採購」","字樣。","七、依本法第六十二條彙送之決標資料，應敘明係屬本法第一百零四條第","一項第一款辦理之採購。"]},{"no":"6","label":"第6條","ch":"","cat":"b","lines":["軍事機關辦理本法第一百零四條第一項第二款之採購，應符合下列規定：","一、查核金額以上之採購，應報經國防部核准。","二、應邀請所有經資格審查合格之廠商投標。","三、參與投標廠商均須簽具保密切結書，得標商須簽具保密合約。","四、秘密開標。","五、作業文件應加註「政府採購法第一百零四條第一項第二款秘密採購」","字樣，各級作業單位應實施全程保密，並訂定解密條件或日期。","六、依本法第六十二條彙送之決標資料，應敘明係屬本法第一百零四條第","一項第二款辦理之採購。"]},{"no":"7","label":"第7條","ch":"","cat":"b","lines":["軍事機關辦理本法第一百零四條第一項第三款之採購，應符合下列規定：","一、查核金額以上之採購，應報經國防部或其授權機關核准。","二、招標規格、廠商資格、等標期或辦理資格審查之期限，得依採購案件","之特性及實際需要訂定之。","三、作業文件應加註「政府採購法第一百零四條第一項第三款緊急採購」","字樣。"]},{"no":"8","label":"第8條","ch":"","cat":"b","lines":["軍事機關之採購兼有本法第一百零四條第一項二款以上情形者，應一併適","用本辦法相關之規定。"]},{"no":"9","label":"第9條","ch":"","cat":"b","lines":["本辦法自中華民國八十八年五月二十七日施行。","本辦法修正條文自發布日施行。"]}]},{"id":"FL039308","title":"統包作業須知","short":"統包作業須知","date":"民國103年10月24日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL039308","articles":[{"no":"1","label":"第一點","ch":"","cat":"b","lines":["一、行政院公共工程委員會（以下簡稱本會）為確保各機關基於效率及品","質之要求，執行政府採購法（以下簡稱本法）第二十四條及其所定統","包實施辦法（以下簡稱本辦法）之規定，特訂定本須知。"]},{"no":"2","label":"第二點","ch":"","cat":"b","lines":["二、機關以統包方式辦理採購前，應考量機關之人力與能力是否足以勝任","統包案之審查及管理工作。其不足以勝任者，應及早委託專案管理，","避免衍生時程延宕、審查不周、廠商減省工料、設計不當、施工品質","不佳等缺失。"]},{"no":"3","label":"第三點","ch":"","cat":"b","lines":["三、下列工程之新建、增建、改建、修建，得採統包方式辦理：","（一）建築物工程，例如「機關委託技術服務廠商評選及計費辦法」附表","一所列建築物工程，含其室內裝修。","（二）建築物以外之公共工程，例如道路、橋梁、水利設施、港灣、隧道","工程。","（三）設備工程，例如機械系統、號誌系統、昇降設備、冷凍空調、節能","績效工程。","（四）其他基於效率及品質之要求所辦理之工程。"]},{"no":"4","label":"第四點","ch":"","cat":"b","lines":["四、機關以統包辦理招標者，應撰寫機關需求書，作為招標之依據，並將","本辦法第六條規定內容，及細部設計審查事項、權責與所需時程，載","明於需求書中，列為招標文件之一；其決標原則，依個案特性採最有","利標，或依本法施行細則第六十四條之二規定辦理，並於招標文件規","定投標廠商服務建議書撰寫內容，納入評選或評分項目，落實審查。"]},{"no":"5","label":"第五點","ch":"","cat":"b","lines":["五、統包案完成後如需維護管理者，其設計應包含未來維護管理計畫，並","依廠商履約結果作適當修正，移交維護管理單位。"]},{"no":"6","label":"第六點","ch":"","cat":"b","lines":["六、機關訂定統包契約條款時，應包括下列事項：","（一）本辦法第六條至第九條規定。","（二）為完成履約標的所必須具備之工程或財物，只要符合原統包目的及","範圍，廠商應負責設計、施工、供應或安裝，不得要求增加契約價","金或補償。","（三）各細項工作之里程碑及工期計算方式、廠商資料送審期限及機關審","查作業所需時間（不包括可歸責於廠商之退件複審時間）、設計疏","失之處理措施與罰則、逾期之處理及違約金計算方式。","（四）廠商於投標時製作之價格詳細表及後續減價資料，經機關決標後為","契約文件之一；其項目及數量於決標後之細部設計與服務建議書有","差異時，除有逾越統包範疇而辦理契約變更情形者外，不得據以增","加契約價金。","（五）實際施作或供應之項目與契約所附詳細表有減少者，其金額不予給","付。但可證明移作其他變更項目之用者，不在此限。","（六）統包採購契約所附詳細表所列項目及數量係由廠商自行提列，其結","算，不適用一般工程慣用之「個別項目實作數量較契約所定數量增","減達一定比率以上時，其逾一定比率之部分，得以變更設計增減契","約價金」方式。實作數量之減少，以有正當理由者始得為之。","（七）廠商提出之品質計畫應包括設計品質計畫書，其內容至少應包括工","程內容及預算、預定設計進度及時程管控點、技術規範、組織與權","責、審查機制（審查人員之資格、經驗、審核時機、審核項目）、","設計圖說文件修正、矯正與預防措施、文件紀錄管理。"]},{"no":"7","label":"第七點","ch":"","cat":"b","lines":["七、機關如將營運或代操作事項納入統包範圍，其涉及經營權利金額度者","，應經財務分析，妥為訂定，並注意廠商營業支出項目是否合理，善","盡監督管理職責。","為使統包廠商履行長期可靠度與保固責任，機關得於招標文件載","明長期營運或代操作之期間、績效目標、契約價金、收費基準等條款","。"]},{"no":"8","label":"第八點","ch":"","cat":"b","lines":["八、採用最有利標決標之統包案件，應依本法第五十六條、「最有利標評","選辦法」規定辦理，妥善利用協商程序，並確定廠商價格合理，無浪","費公帑情形，方得決定最有利標。","招標文件所規定之評審標準，應包括廠商之技術能力、設計與計","畫之完整性及可行性、標價之合理性、完整性及正確性。"]},{"no":"9","label":"第九點","ch":"","cat":"b","lines":["九、機關應視統包案件之規模、複雜程度及性質，考量廠商準備投標文件","所需時間，合理訂定等標期，不宜逕以本會訂頒招標期限標準規定之","下限期限定之。"]},{"no":"10","label":"第十點","ch":"","cat":"b","lines":["十、機關或專案管理廠商應落實履約階段之設計審查作業，避免發生廠商","圖說過於簡略、缺漏，而機關仍接受其圖說並同意施工之情形。","主辦機關、監造單位與專案管理廠商之權責劃分，請參考本會訂","頒「統包模式之工程進度及品質管理參考手冊」第二章內容及「公共","工程履約權責劃分及管理應注意事項」附表一辦理。"]},{"no":"11","label":"第十一點","ch":"","cat":"b","lines":["十一、機關對於統包得標廠商，應督促其切實履行契約，不得任意變更。"]},{"no":"12","label":"第十二點","ch":"","cat":"b","lines":["十二、機關辦理統包工程，如有廠商規劃、設計錯誤、監造不實或管理不","善情形，除依本法第六十三條第二項規定追償機關遭受之損害外，","其屬承辦技師或建築師之責任者，機關應依各該專門職業及技術人","員法規，提報各該人員主管機關予以懲戒。"]}]},{"id":"FL043333","title":"各機關採購評選委員會專家學者參考名單資料庫建置及除名作業要點","short":"專家學者資料庫作業要點","date":"民國110年12月06日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL043333","articles":[{"no":"1","label":"第一點","ch":"","cat":"d","lines":["一、行政院公共工程委員會（以下簡稱工程會）為提升各機關採購評選委","員會專家學者參考名單資料庫（以下簡稱本資料庫）之專業性及公正","性，特訂定本要點。"]},{"no":"2","label":"第二點","ch":"","cat":"d","lines":["二、本資料庫中之專家學者，應具備下列資格之一，且不得為政府機關之","現職人員：","（一）有以下機關（構）及職等之主管（含副主管）經歷，且具專長相關","實務經驗十五年以上：","1.中央機關或其所屬機關、學校之薦任第九職等以上。","2.地方機關或其所屬（轄）機關、學校之薦任第八職等以上。","3.公營事業相當於薦任第九職等以上。","（二）現任或曾任公私立大專院校專任副教授以上，且具專長相關教學經","驗三年以上。","（三）現任或曾任公私立大專院校專任助理教授以上，且具專長相關教學","經驗五年以上。","（四）現任或曾任合法立案研究機構專職研究員以上，且具專長相關研究","經驗七年以上。","（五）現任或曾任合法立案研究機構專職副研究員以上，且具專長相關研","究經驗十年以上。","（六）具博士學位，且具所學專長相關專職實務或研究經驗七年以上。","（七）具碩士學位，且具所學專長相關專職實務或研究經驗十年以上。","（八）具專業證照之專門職業及技術人員，且取得證照後具有執行業務相","關實務經驗十年以上。","（九）特殊資格：前八款以外，藝、工、匠、新興科技及其他具特殊專長","之專家。","（十）曾任簡任職以上之機關（構）首長或副首長達三年以上，且具專長","相關實務經驗三年以上。","前項第一款、第四款至第八款及第十款所稱實務或研究經驗，不","包含教學、在學或兼職經驗；第二款及第三款所稱專長相關教學經驗","，指專職經驗；第四款至第七款所稱專職，指辦公時間內全部在聘僱","機關服務，並依規定支領全部時間之報酬。","中華民國九十八年八月二十日以前已納入資料庫之專家學者，不","適用前項規定。"]},{"no":"3","label":"第三點","ch":"","cat":"d","lines":["三、專家學者得由下列機關（構）、公會（以下簡稱推薦機關（構））審","查後推薦之：","（一）總統府、五院、國家安全會議及其所屬ㄧ級及二級機關（構）。","（二）直轄市政府、直轄市議會、縣（市）政府及縣（市）議會。","（三）公立大專院校及經教育部核准設立之公立研究機構。","（四）私立大專院校及經教育部核准設立之私立研究機構。","（五）專門職業及技術人員依法成立之公會。","符合前點第一項第一款至第七款及第十款資格者（含退休人員）","，由前項第一款至第四款之推薦機關（構）辦理審查推薦。","符合前點第一項第八款資格者，由第一項第五款之推薦機關（構","）辦理審查推薦。","符合前點第一項第九款資格者，由第一項第一款至第三款之推薦","機關（構）辦理審查推薦。"]},{"no":"4","label":"第四點","ch":"","cat":"d","lines":["四、推薦機關（構）應推薦品德操守良好之專家學者，就所推薦人選，審","查符合資格後，備齊各機關採購評選委員會專家學者參考名單資料庫","推薦表（如附件一至附件三，以下簡稱推薦表）及相關證明文件函送","工程會；並應於工程會指定之網路登錄相關資料。","推薦機關（構）之所屬單位或分會如欲推薦人選，應備妥受推薦","者之推薦表及相關證明文件，送交推薦機關（構）辦理審查推薦。","工程會將推薦表提報各機關採購評選委員會專家學者參考名單資","料庫審議小組（以下簡稱審議小組）審議，通過後納入本資料庫起算","有效期三年，效期屆滿前六個月內，推薦機關（構）得以書面或至本","資料庫以電子化方式續行辦理推薦作業。未辦理者，移離本資料庫。","中華民國一百零八年十月二日修正規定生效前，納入本資料庫達","二年以上者，推薦機關（構）應於修正規定生效日起一年內續行辦理","推薦作業。未辦理者，移離本資料庫。"]},{"no":"5","label":"第五點","ch":"","cat":"d","lines":["五、公會推薦人選以該公會會員總人數百分之十為限（不足一人者以一人","計），經公會之理事會同意，並送經中央目的事業主管機關查核最近","十年內無相關懲戒或行政處分紀錄（中央目的事業主管機關例如：建","築師公會送內政部、律師公會送法務部、會計師公會送金融監督管理","委員會、醫師公會送衛生福利部、技師公會送工程會等），填具理事","會任期及會員總人數後依前點第一項規定辦理。","公會之理事改選後，新任理事會應於上任三個月內，重行辦理審","查推薦，逾期未完成重行推薦者，視同該公會同意展延原推薦人員至","該任理事會任期屆滿之日。"]},{"no":"6","label":"第六點","ch":"","cat":"d","lines":["六、本資料庫之資料修正維護作業原則如下：","（一）工程會得每半年通知原推薦機關（構）及專家學者檢核及確認資料","之正確性。","（二）專家學者個人資料（包括學歷、經歷、電話、傳真、住址、電子郵","件、專長等）有異動或更正必要者，除學歷、經歷及專長應由原推","薦機關（構）上網即時更正或補充外，餘得由專家學者本人自行上","網更正或補充。","（三）前款更正或補充資料如有異常，工程會得提報審議小組審議或逕予","退回。"]},{"no":"7","label":"第七點","ch":"","cat":"d","lines":["七、工程會知悉本資料庫中之專家學者有下列第一款至第六款或第十二款","情形之一者，應逕予自本資料庫除名，並通知推薦機關（構）及提報","審議小組備查；有下列第七款至第十一款或第十三款情形之一者，提","報審議小組決議不予納入本資料庫或予以除名，並通知推薦機關（構","）。原推薦機關（構）知悉者，亦應檢具具體事證，提送工程會依程","序辦理：","（一）本人書面要求自本資料庫除名。","（二）原推薦機關（構）撤回推薦。","（三）犯貪污或瀆職之罪，經判刑確定。","（四）受監護或輔助宣告，尚未撤銷。","（五）專門職業及技術人員已受停止執行業務或撤銷、廢止執業執照之處","分。","（六）專門職業及技術人員有政府採購法第一百零一條第一項各款情形之","一，經機關刊登於政府採購公報。","（七）未能公正辦理政府採購評選，情節重大，經機關檢具具體事證提送","工程會。","（八）有採購人員倫理準則第七條各款情形之一。","（九）參與政府採購評選，有以下異常情形之ㄧ：","1.出席政府採購評選會議，缺席、遲到早退或未全程參與之比例偏","高。","2.私下與廠商接洽與評選有關之案件。","（十）違反採購評選委員會審議規則第十四條、第十四條之一規定，經機","關檢具具體事證提送工程會。","（十一）受破產宣告確定尚未復權。","（十二）褫奪公權尚未復權。","（十三）有事實足認不堪勝任政府採購評選任務。","本資料庫中之專家學者，屬前項第三款至第八款、第九款第二目","、第十款至第十二款情形之一，且經提報審議小組備查、決議不予納","入本資料庫或予以除名者，列入採購評選委員會組織準則第五條第五","款所定不得遴選為採購評選委員之人員名單；非本資料庫之人員，有","相同情形，經工程會提報審議小組決議者，亦同。","本資料庫中之專家學者，經傳播媒體報導參與政府採購評選疑有","違法情事（例如專家學者遭檢調單位約談、羈押或起訴），或機關、","工程會知悉專家學者疑有第一項第三款至第八款、第九款第二目、第","十款至第十二款情形之一者，工程會得先予暫時移離本資料庫，並書","面通知推薦機關（構）。","前項暫時移離本資料庫之情形，視資料蒐集或司法調查結果，依","第一項規定辦理；其無應予除名之情形，並送經審議小組審議後，重","行納入本資料庫。"]},{"no":"8","label":"第八點","ch":"","cat":"d","lines":["八、本資料庫之專家學者經機關徵詢同意後出席會議次數偏低，或工程會","進行資料查詢時，未能於期限內提供資料，且無正當理由，或拒絕說","明者，工程會得採行下列措施:","（一）暫停本資料庫遴選該專家學者之功能。","（二）經審議小組決議予以除名。"]},{"no":"9","label":"第九點","ch":"","cat":"d","lines":["九、本資料庫中之專家學者名單及不得遴選為採購評選委員之人員名單，","由工程會登載於資訊網站供機關查詢。","依第七點第一項規定除名之專家學者，工程會得將除名之事由附","記於本資料庫。"]},{"no":"10","label":"第十點","ch":"","cat":"d","lines":["十、審議小組辦理審議，必要時得通知推薦機關（構）或專家學者列席會","議。"]},{"no":"11","label":"第十一點","ch":"","cat":"d","lines":["十一、專家學者認為審議小組之審議結果與事實不符，得向審議小組提出","說明，申請再審議。"]}]},{"id":"FL051975","title":"各機關採購評選委員會專家學者參考名單資料庫審議小組設置要點","short":"專家學者資料庫審議小組要點","date":"民國110年12月06日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL051975","articles":[{"no":"1","label":"第一點","ch":"","cat":"d","lines":["一、行政院公共工程委員會（以下簡稱本會）為提升各機關採購評選委員","會專家學者參考名單資料庫（以下簡稱資料庫）之專業性及公正性，","特設專家學者參考名單資料庫審議小組（以下簡稱審議小組）。"]},{"no":"2","label":"第二點","ch":"","cat":"d","lines":["二、審議小組任務如下：","（一）審議受推薦專家學者之資格、納入資料庫事項，及資料庫之專家學","者除名相關事項。","（二）審議資料庫之專家學者及非資料庫人員列入採購評選委員會組織準","則第五條第五款所定不得遴選為採購評選委員之人員名單事項。","（三）審議修訂資料庫除名原則。","（四）其他與資料庫相關事宜之審議。"]},{"no":"3","label":"第三點","ch":"","cat":"d","lines":["三、審議小組置召集人一人，由本會副主任委員或指定之人員派兼之；委","員七人至十一人，除召集人為當然委員外，其餘委員由本會分別就教","育部、考選部、其他相關機關及本會之高級人員聘（派）兼之。"]},{"no":"4","label":"第四點","ch":"","cat":"d","lines":["四、審議小組會議視業務需要不定期召開，由召集人召集並擔任主席，召","集人因故不能出席時，得指定委員一人為主席。"]},{"no":"5","label":"第五點","ch":"","cat":"d","lines":["五、審議小組會議之決議，應有二分之一以上委員之出席，出席委員過半","數同意行之。出席委員中外聘委員不得少於二人。","前項決議，不同意見之委員得提意見書，附於審議小組會議紀錄","，以備查考。"]},{"no":"6","label":"第六點","ch":"","cat":"d","lines":["六、審議小組審議除名名單前，得通知相關機關（構）提出書面意見，或","於辦理採購稽核後將稽核結果副知審議小組，並得通知當事人到場或","書面陳述意見。"]},{"no":"7","label":"第七點","ch":"","cat":"d","lines":["七、審議小組如作成除名決議，應將決議理由及結果函送推薦機關（構）","及當事人。"]},{"no":"8","label":"第八點","ch":"","cat":"d","lines":["八、審議小組委員就審議事件有下列各款情形之一者，應行迴避：","（一）與受審議之專家學者有本人、配偶、三親等以內血親或姻親，或同","財共居親屬之關係者。","（二）有其他情形足認不能公正執行職務之虞者。"]},{"no":"9","label":"第九點","ch":"","cat":"d","lines":["九、審議小組對外行文，以本會名義行之。"]}]},{"id":"FL028312","title":"採購評選委員會委員須知","short":"評選委員須知","date":"民國111年02月25日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL028312","articles":[{"no":"1","label":"第一點","ch":"","cat":"d","lines":["一、為確保依政府採購法第九十四條規定成立之採購評選委員會委員（以","下簡稱委員）公正辦理評選，避免爭議，特訂定本須知。"]},{"no":"2","label":"第二點","ch":"","cat":"d","lines":["二、委員應知其所擔任之工作為無給職，不以獲取報酬為目的。"]},{"no":"3","label":"第三點","ch":"","cat":"d","lines":["三、委員自接獲評選有關資料之時起，不得就該採購案參加投標、作為投","標廠商之分包廠商或擔任工作成員。","委員對於所知悉之招標資訊，應予保密。","委員不得與所辦採購案有利益關係之廠商私下接洽與該採購案有","關之事務。","委員於所評採購個案決標後，不得擔任得標廠商該案之履約工作","成員，或協助履約。"]},{"no":"4","label":"第四點","ch":"","cat":"d","lines":["四、委員應依據法令，本於專業及良知，公正執行職務，不為及不受任何","請託或關說。"]},{"no":"5","label":"第五點","ch":"","cat":"d","lines":["五、委員不得有採購人員倫理準則第七條規定之行為。","機關發現委員有前項行為者，應予解聘。其屬自主管機關會同教","育部、考選部及其他相關機關之建議名單遴選者，並應通知主管機關","，以作為將其自名單除名之依據。","機關對於主動求取擔任委員事宜之人員應不遴選其擔任委員。"]},{"no":"6","label":"第六點","ch":"","cat":"d","lines":["六、委員於被遴選前或同意擔任委員後，如有下列不得被遴選為委員或有","應辭職之情形，應主動通知機關或由機關予以解聘：","（一）犯貪污或瀆職之罪，經判刑確定者。","（二）褫奪公權尚未復權者。","（三）受破產宣告確定尚未復權者。","（四）專門職業人員已受停止執行業務或撤銷、廢止執業執照之處分者。","（五）就案件涉及本人、配偶、二親等以內親屬，或共同生活家屬之利益","者。","（六）本人或其配偶與受評選之廠商或其負責人間現有或三年內曾有僱傭","、委任或代理關係者。","（七）委員認為本人或機關認其有不能公正執行職務之虞者。","（八）有其他情形足使受評選之廠商認其有不能公正執行職務之虞，經受","評選之廠商以書面敘明理由，向機關提出，經採購評選委員會作成","決定者。"]},{"no":"7","label":"第七點","ch":"","cat":"d","lines":["七、委員訂定、審定評選項目及其配分或權重，不應以有利或不利於特定","廠商為目的。"]},{"no":"8","label":"第八點","ch":"","cat":"d","lines":["八、委員評選及出席會議，應全程參與並親自為之，不得代理，避免遲到","早退。","召集人及副召集人如均無法出席會議，應檢討會議時間之妥適性","及召集人、副召集人未出席會議之原因，並另訂時間開會，必要時得","於例假日或夜間辦理。","出席評選會議之外聘評選委員，機關得依行政院訂定「中央政府","各機關學校出席費及稿費支給要點」支給出席費及審查費，並依「國","內出差旅費報支要點」支給交通費。其有審查費者，應於開會前依機","關指定之期日前提出書面審查意見。"]},{"no":"9","label":"第九點","ch":"","cat":"d","lines":["九、委員辦理評選，應依招標文件之評選項目、子項及其配分或權重辦理","，不得變更或補充。其有輔以廠商簡報及現場詢答者，廠商簡報及委","員詢問事項，應與評選項目有關；廠商另外提出變更或補充資料者，","該資料應不納入評選考量。","前項簡報及現場詢答，非屬採行協商措施性質，不應要求廠商更","改投標文件內容。","委員對於不同廠商之詢問及態度，不得為無正當理由之差別待遇","；勿在廠商面前對個別廠商公開誇讚或批評。","委員評選後，應於機關備具之評分（比）表逐項載明各受評廠商","之評分或序位，並簽名或蓋章。","採購評選委員會辦理廠商評選，應就各評選項目、受評廠商資料","及工作小組初審意見，逐項討論後為之。","委員對於會議之決議有不同意見者，得要求將不同意見載入會議","紀錄或將意見書附於會議紀錄。"]},{"no":"10","label":"第十點","ch":"","cat":"d","lines":["十、不同委員之評選結果有明顯差異時，召集委員應提交採購評選委員會","議決或依採購評選委員會決議辦理複評。","採購評選委員會或個別委員評選結果與工作小組初審意見有異時","，應由採購評選委員會或該個別委員敘明理由，並列入會議紀錄。"]},{"no":"11","label":"第十一點","ch":"","cat":"d","lines":["十一、委員對於受評廠商之投標文件內容及資料，除供公務上使用或法令","另有規定外，應保守秘密，並不得挪作他用。評選後亦同。","廠商之投標文件應於評選後由機關收回保存。未收回者，由委","員自行銷毀並負保密之責。"]},{"no":"12","label":"第十二點","ch":"","cat":"d","lines":["十二、機關於評定最有利標後，將於主管機關之政府採購資訊網站公開全","部委員姓名、職業及評定最有利標會議之出席委員姓名。","採購評選委員會之會議紀錄及機關於委員評選後彙總製作之總","表，除涉及個別廠商之商業機密者外，機關將允許投標廠商申請閱","覽、抄寫、複印或攝影。","機關對於各出席委員之評分或序位評比表，除法令另有規定外","，應保守秘密，不得允許申請閱覽、抄寫、複印或攝影。"]},{"no":"13","label":"第十三點","ch":"","cat":"d","lines":["十三、本須知由成立採購評選委員會之機關於通知委員派兼或聘兼事宜時","一併附於通知書中。"]}]},{"id":"FL025855","title":"中央機關共同供應契約集中採購實施要點","short":"集中採購實施要點","date":"民國103年02月05日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL025855","articles":[{"no":"1","label":"第一點","ch":"","cat":"d","lines":["一、行政院公共工程委員會（以下簡稱工程會）為利中央政府各機關、學","校、公營事業（以下簡稱中央機關）辦理財物、勞務集中採購，依政","府採購法第九十三條與廠商簽訂共同供應契約，經由集中採購，以節","省人力，發揮大量採購之經濟效益，提升採購執行績效，特訂定本要","點。"]},{"no":"2","label":"第二點","ch":"","cat":"d","lines":["二、中央機關辦理具共通性，且達相當規模之財物或勞務之集中採購，除","有特殊情形者外，應依本要點之規定。","本要點之規定，於中央機關補助地方機關辦理之財物或勞務採購","，或中央機關補助法人或團體辦理之財物或勞務採購而依政府採購法","第四條規定應適用政府採購法者，亦適用之。"]},{"no":"3","label":"第三點","ch":"","cat":"d","lines":["三、集中採購之訂約機關，得為下列情形之一：","（一）二以上機關共同協議，由其中一機關訂約。","（二）由中央各部、會、行、處、局、署、院等機關指定機關訂約。","（三）由工程會指定機關訂約。","工程會依前項第三款指定之訂約機關及其集中採購項目如附表，","並得視需要隨時調整之。"]},{"no":"4","label":"第四點","ch":"","cat":"d","lines":["四、各訂約機關應明確規範集中採購項目、品名、規格等，辦理需求調查","，規劃採購作業時程，並由適用機關自行依契約價格洽廠商訂貨、辦","理驗收、付款。","前項採購需求調查、契約公告、下單訂貨及廠商履約等事宜，除","有特殊情形者外，各機關應依工程會「共同供應契約電子採購系統」","進行電子線上作業。"]},{"no":"5","label":"第五點","ch":"","cat":"d","lines":["五、集中採購所需人力，由集中採購訂約機關就現有人力調度或派充之；","集中採購所需經費，集中採購訂約機關得向適用機關收取之。"]},{"no":"6","label":"第六點","ch":"","cat":"d","lines":["六、本要點各集中採購訂約機關應於每年年度終了十五日內，依附表格式","向工程會提供辦理成果。"]}]},{"id":"FL037158","title":"工程施工查核小組不預先通知查核作業規定","short":"不預先通知查核規定","date":"民國105年06月13日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL037158","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["一、為執行工程施工查核小組作業辦法第五條工程施工查核小組得不預先","通知赴工地進行查核之規定，特訂定本作業規定。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["二、不預先通知查核之工程：","（一）複查品質之工程。","（二）社會關注或民眾檢舉（通報）之工程。","（三）有品質不良紀錄之專案管理廠商、監造廠商或施工廠商承攬之在建","工程。","（四）工期較短工程。","（五）其他經檢討認為適合採不預先通知查核之工程。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["三、查核前準備事項：","（一）通知工程主辦機關之公函，採「持送」方式辦理，查核委員另專函","通知。上開函文應註明本次查核採不預先通知方式辦理。","（二）查核委員通知函不列工程名稱，且於函中註明：「貴委員至工地現","場，發現本工程與貴委員有工程施工查核小組組織準則第八條規定","應行迴避情事或現任該工程之顧問、督導委員者，請通知本查核小","組，且貴委員不得評分，但可提供查核意見供查核小組參考。」","（三）工作人員應預先準備「工程施工查核小組查核品質缺失扣點紀錄表","」空白表格提供查核委員，作為填列缺失代號及扣點項目之參考。","（四）如係工程品質複查，查核小組工作人員應將該工程歷次查核紀錄交","查核委員參考。","（五）於查核前半個工作天以傳真或其他方式通知受查核工程主辦機關配","合辦理。但如有工程地點不易尋找、交通不便或其他窒礙難行情形","，得依個案實際狀況調整，不受半個工作天之限制。"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["四、現場查核應注意事項：","（一）工程報告，由工程主辦機關、專案管理廠商（如無則免）、監造廠","商及施工廠商口頭報告，並答復查核委員詢問或提供相關資料。","（二）查閱文件，依下列規定辦理：","1.工地設有工務所者，應提供相關文件供查閱。","2.工地未設有工務所者，以當時置於現場之文件為主（如監造單位","監造報表及抽查驗紀錄、施工廠商自主檢查紀錄等）。如文件置","放處距離工地半小時車程以內或適當距離者，查核小組得前往文","件置放處所查閱相關文件。另如已依前點第五款通知者，應將品","管及進度管控等文件攜至工地備查。","（三）召開檢討及扣點會議，依下列規定辦理：","1.擇適當場所，召開檢討會議；如無適當場所，可逕於工地現場辦","理，指明工程主辦機關、監造單位及施工廠商相關應改進事項，","並請相關單位就所列缺失提出說明。","2.查核品質缺失扣點會議，得於工地現場或回程時再行辦理。"]}]},{"id":"FL003712","title":"公共工程趕工實施要點","short":"公共工程趕工實施要點","date":"民國96年06月15日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL003712","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["一、為促使公共工程承包商及監造廠商在確保公共工程契約（以下簡稱契","約）規定品質下，全力趲趕進度提前完工，以發揮工程效益，節省整","體社會成本，特訂定本要點。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["二、執行中工程計畫之各項工程標案或工程標案內之部分工程，有下列情","形之一者，工程主辦機關（以下簡稱機關）得檢討趕工效益，訂定趕","工期限目標及方案，報經上級機關審查同意後，與承包商及監造廠商","協商依第三點規定發給趕工費用或依第四點規定以修約之方式辦理趕","工：","（一）工程標案延後開工或進度落後，非屬承包商責任，如趲趕進度減少","工期展延，對整體工程計畫執行有助益。","（二）工程標案係在工程計畫要徑上，如能減縮工期，對整體工程計畫執","行有助益。","（三）工程標案內之部分工程，如能減縮工期，對工程計畫執行有助益或","具有重大效益（以下簡稱關鍵工程）。","機關依前項規定報上級機關時，應敘明其經費、原定完工期程與","趕工之必要性、合理性及可行性，並明確規定各項考量條件指標；其","於規劃設計階段工期估算寬鬆，而於履約階段無正當原因辦理趕工者","，上級機關應不予同意。","機關依第三點規定發給趕工費用或依第四點規定以修約之方式辦","理趕工者，應先辦理契約變更。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["三、機關以發給趕工費用之方式辦理趕工者，協商趕工之工程標案或關鍵","工程於達成趕工期限目標後，趕工費用計算方式如下：","（一）承包商：","1.按其較契約規定工期（含非屬承包商責任，同意展延後之工期）","或規劃完工日提前完工者，每提早完工一日，給與原契約決標總","價除以工期所得金額百分之十五之趕工費用。","2.趕工費用最高限額：決標總價之百分之三。","（二）監造廠商：按承包商趕工費用總額百分之三發給。但服務費用之計","算，不得將承包商之趕工費用納入。","限期完工工程，以限定完工日與約定開工日間之日曆天為工期。","如僅就關鍵工程辦理趕工即可達成趕工期限目標，無需就整體工","程標案辦理趕工者，依關鍵工程部分之經費、工期及前項計算方式，","計算趕工費用；未達成趕工期限目標者，不發給趕工費用。","前二項金額，均不含物價指數調整。"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["四、機關因個案特性及實際需要，確有必要約定高於前點所定趕工費用，","或雖未達趕工期限目標而仍具部分效益並有支付廠商趕工費用必要者","，得以修約方式辦理趕工；其增加費用之計算，應綜合考量廠商因趕","工增加之成本及因履約期限縮短所減少之成本，並以標案中之關鍵工","程為限；其辦理程序，得比照「採購契約要項」第二十點規定，通知","廠商辦理契約變更。","前項契約變更後之履約期限，應以限期完工為限。廠商如逾變更","後之履約期限，除有契約規定得免責之事由外，應依變更後之契約規","定計算逾期違約金。其逾變更後之履約期限，惟於原契約規定之履約","期限內完工者，逾期違約金計算方式如下：","（一）以每日平均值計算逾期違約金：每日金額為因工期縮短致契約價金","增加之費用除以契約變更縮短之日數。","（二）以每日不同值計算逾期違約金：每日金額按契約約定之曲線公式（","例如二次拋物曲線公式）計算。","（三）以其他方式計算逾期違約金：每日金額依契約約定之其他方式計算","。","前項逾期違約金之計算，應能反映廠商如逾期至原契約履約期限","當日竣工，機關依契約變更後契約價金扣減逾期違約金後之給付金額","，不得高於原契約金額。","廠商逾原契約規定之履約期限完工者，依原契約規定之逾期違約","金計罰。","機關對於監造部分是否併同修約，應依第一項規定辦理；如有修","正委託監造契約之必要者，依契約及機關委託技術服務廠商評選及計","費辦法規定辦理。但服務費用之計算，不得將承包商之趕工費用納入","。"]},{"no":"5","label":"第五點","ch":"","cat":"p","lines":["五、機關依前點規定修約時，得依個案需求及政府採購法施行細則第一百","十一條規定，協商延誤履約期限情節重大之情形，督促廠商確實趕工","。"]},{"no":"6","label":"第六點","ch":"","cat":"p","lines":["六、機關於接受廠商所提出須變更事項前即通知廠商先行趕工，其後未依","原通知辦理全部或一部契約變更者，應補償廠商所增加之必要費用。"]},{"no":"7","label":"第七點","ch":"","cat":"p","lines":["七、機關依本要點處理之個案，應將上級機關核准文件、協商紀錄或通知","、監造報表及竣工報告書等有關資料建檔，以備審查。"]},{"no":"8","label":"第八點","ch":"","cat":"p","lines":["八、本要點給付趕工費用所需經費或協商修約所增加之契約價金，由各機","關相關工程預算項下支應。"]}]},{"id":"FL000717","title":"採購契約變更或加減價核准監辦備查規定一覽表","short":"契約變更核准監辦一覽表","date":"民國91年03月29日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL000717","articles":[{"no":"1","label":"全文","ch":"","cat":"p","lines":["\n┌─┬───────┬───────┬─────┬──────┐\n│項│契約變更或加減│核  准  規  定│監辦規定  │  備查規定  │\n│次│價情形        │              │          │            │\n├─┼───────┼───────┼─────┼──────┤\n│一│辦理契約變更，│一  適用未達公│採購法第十│查核金額以上│\n│  │不論原契約金額│    告金額採購│三條第二項│之採購，補具│\n│  │大小，其變更部│    招標辦法之│監辦規定。│辦理結果之相│\n│  │分之累計金額未│    核准規定。│          │關文件送上級│\n│  │達公告金額。  │二  有政府採購│          │機關備查。上│\n│  │              │    法 (以下簡│          │級機關得決定│\n│  │              │    稱採購法) │          │免送備查。契│\n│  │              │    第七十二條│          │約價金變更後│\n│  │              │    第二項減價│          │屬查核金額以│\n│  │              │    收受之情形│          │上之採購者，│\n│  │              │    者，從其規│          │除本表第四項│\n│  │              │    定。      │          │之情形外，亦│\n│  │              │              │          │同。        │\n├─┼───────┼───────┼─────┼──────┤\n│二│辦理契約變更，│一  採購機關自│採購法第十│查核金額以上│\n│  │其變更部分之累│    行核准。  │三條第一項│之採購，補具│\n│  │計金額在公告金│二  有採購法第│監辦規定。│辦理結果之相│\n│  │額以上，未達查│    七十二條第│          │關文件送上級│\n│  │核金額，自累計│    二項減價收│          │機關備查。上│\n│  │金額達公告金額│    受之情形者│          │級機關得決定│\n│  │之時起。加帳累│    ，從其規定│          │免送備查。契│\n│  │計金額在公告金│    。        │          │約價金變更後│\n│  │額以上者，並須│              │          │屬查核金額以│\n│  │符合採購法第二│              │          │上之採購者，│\n│  │十二條第一項各│              │          │除本表第四項│\n│  │款情形之一。  │              │          │之情形外，亦│\n│  │              │              │          │同。        │\n│  │              │              │          │            │\n├─┼───────┼───────┼─────┼──────┤\n│三│辦理契約變更，│一  採購機關自│一  採購法│            │\n│  │其變更部分之累│    行核准。  │    第十二│            │\n│  │計金額在查核金│二  有採購法第│    條第一│            │\n│  │額以上，自累計│    七十二條第│    項上級│            │\n│  │金額達查核金額│    二項減價收│    機關監│            │\n│  │之時起。加帳累│    受之情形者│    辦規定│            │\n│  │計金額在公告金│    ，從其規定│    。    │            │\n│  │額以上者，並須│    。        │二  採購法│            │\n│  │符合採購法第二│              │    第十三│            │\n│  │十二條第一項各│              │    條第一│            │\n│  │款情形之一。  │              │    項監辦│            │\n│  │              │              │    規定。│            │\n├─┼───────┼───────┼─────┼──────┤\n│四│契約價金變更，│採購機關自行核│採購法第十│採購法第十二│\n│  │原「採購金額」│准。          │三條第一項│條第二項，補│\n│  │未達查核金額，│              │監辦規定。│具相關文件送│\n│  │契約價金於變更│              │          │上級機關備查│\n│  │後達查核金額之│              │          │。          │\n│  │當次變更。    │              │          │            │\n├─┼───────┼───────┼─────┼──────┤\n│五│未達查核金額之│採購機關自行核│          │            │\n│  │採購，不涉及契│准。          │          │            │\n│  │約價金之契約變│              │          │            │\n│  │更。          │              │          │            │\n├─┼───────┼───────┼─────┼──────┤\n│六│查核金額以上之│採購機關自行核│上級機關另│補具辦理結果│\n│  │採購，不涉及契│准。但上級機關│有規定者，│之相關文件送│\n│  │約價金之契約變│另有規定者，從│從其規定。│上級機關備查│\n│  │更。          │其規定。      │          │，上級機關得│\n│  │              │              │          │決定免送備查│\n│  │              │              │          │。但上級機關│\n│  │              │              │          │另有規定者，│\n│  │              │              │          │從其規定。  │\n├─┼───────┼───────┼─────┼──────┤\n│七│由機關決定增購│適用採購法第二│增購部分之│查核金額以上│\n│  │，且已於原招標│十二條第一項第│累計金額未│之採購，補具│\n│  │公告及招標文件│七款情形，由採│達公告金額│辦理結果之相│\n│  │敘明機關得就原│購機關自行核准│者，適用採│關文件送上級│\n│  │標的決定增購之│。            │購法第十三│機關備查，上│\n│  │期間、數量或金│              │條第二項監│級機關得決定│\n│  │額。不論原契約│              │辦規定；累│免送備查。但│\n│  │金額大小，在該│              │計金額在公│上級機關另有│\n│  │得增購之期間、│              │告金額以上│規定者，從其│\n│  │數量或金額以內│              │而未達查核│規定。      │\n│  │，依原招標文件│              │金額者，適│            │\n│  │及契約規定辦理│              │用採購法第│            │\n│  │者。          │              │十三條第一│            │\n│  │              │              │項監辦規定│            │\n│  │              │              │；累計金額│            │\n│  │              │              │在查核金額│            │\n│  │              │              │以上者，適│            │\n│  │              │              │用採購法第│            │\n│  │              │              │十二條第一│            │\n│  │              │              │項及第十三│            │\n│  │              │              │條第一項監│            │\n│  │              │              │辦規定。  │            │\n├─┼───────┼───────┼─────┼──────┤\n│八│由廠商決定增加│適用採購法第二│增加部分之│查核金額以上│\n│  │供應數量或金額│十二條第一項第│累計金額未│之採購，補具│\n│  │ (含採購契約價│十六款情形，無│達公告金額│辦理結果之相│\n│  │金之給付係依實│核准程序。    │者，適用採│關文件送上級│\n│  │際施作或供應之│              │購法第十三│機關備查，上│\n│  │項目及數量給付│              │條第二項監│級機關得決定│\n│  │) ，且已於招標│              │辦規定；累│免送備查。但│\n│  │文件敘明得增加│              │計金額在公│上級機關另有│\n│  │供應數量或金額│              │告金額以上│規定者，從其│\n│  │之上限及計價方│              │而未達查核│規定。      │\n│  │式。不論原契約│              │金額者，適│            │\n│  │金額大小，在該│              │用採購法第│            │\n│  │得增購之數量或│              │十三條第一│            │\n│  │金額以內，依原│              │項監辦規定│            │\n│  │招標文件及契約│              │；累計金額│            │\n│  │規定辦理者。  │              │在查核金額│            │\n│  │              │              │以上者，適│            │\n│  │              │              │用採購法第│            │\n│  │              │              │十二條第一│            │\n│  │              │              │項及第十三│            │\n│  │              │              │條第一項監│            │\n│  │              │              │辦規定。  │            │\n├─┼───────┼───────┼─────┼──────┤\n│九│原招標文件敘明│一  由機關決定│          │查核金額以上│\n│  │機關或廠商得就│    減購者，由│          │之採購，補具│\n│  │原標的決定減購│    採購機關自│          │辦理結果之相│\n│  │或減供應之數量│    行核准。  │          │關文件送上級│\n│  │或金額。不論原│二  由廠商決定│          │機關備查，上│\n│  │契約金額大小，│    減少供應數│          │級機關得決定│\n│  │在該得減購或減│    量或金額，│          │免送備查。但│\n│  │供應之數量或金│    不必事先徵│          │上級機關另有│\n│  │額以內，依原招│    得機關同意│          │規定者，從其│\n│  │標文件及契約所│    者，無核准│          │規定。      │\n│  │列計價方式減價│    程序。    │          │            │\n│  │。            │              │          │            │\n└─┴───────┴───────┴─────┴──────┘\n附記：\n (一) 契約變更，指原契約標的之規格、價格、數量或條款之變更，並包\n      括追加契約以外之新增工作項目；其變更，得分別適用採購法第二\n      十二條第一項各款情形為之，但變更部分之累計金額應合計之。\n (二) 變更部分之累計金額，指契約價金變更之「加帳金額」及「減帳絕\n      對值」合計之累計金額。\n (三) 契約價金於變更後達查核金額之當次以後之變更，適用查核金額以\n      上採購之規定。\n (四) 「核准規定」欄，係指機關辦理契約變更或加減價之核准權責規定\n      ，其核准與否應考量契約變更、加減價及採限制性招標辦理之適法\n      性及妥適性。「核准」，由機關首長或其授權人員為之。\n (五) 機關辦理採購，其決標金額依政府採購法第六十一條 (於政府採購\n      公報刊登決標公告) 或第六十二條 (定期彙送決標資料) 規定傳輸\n      至本會資料庫後，如有契約變更或加減價之情形，致原決標金額增\n      加者，該增加之金額，亦應依上揭規定辦理公告、彙送。\n (六) 機關辦理工程採購，其須辦理契約變更而新增非屬原契約數量清單\n      內所列之工程項目者 (不包含漏列項目) ，該新增工程項目單價編\n      列方式，應以原預算相關單價分析資料為基礎，並考慮市場價格波\n      動情形。其底價訂定，並應符合政府採購法第四十六條規定。"],"mono":true}]},{"id":"FL019235","title":"履約保證金／保固保證金連帶保證書格式","short":"履約保固保證書格式","date":"民國96年02月12日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL019235","articles":[{"no":"1","label":"全文","ch":"","cat":"p","lines":["履約保證金／保固保證金連帶保證書格式","一、立連帶保證書人（保證人）＿＿＿＿＿＿銀行＿＿＿＿分行（以下簡","稱本行）茲因（得標廠商）＿＿＿＿＿＿＿＿（以下簡稱廠商）得標","（機關名稱）＿＿＿＿＿＿＿＿＿＿＿＿（以下簡稱機關）之（採購","標的）＿＿＿＿＿＿＿＿＿＿＿＿（以下簡稱採購），依招標文件（","含其變更或補充）規定應向機關繳納履約保證金／保固保證金新臺幣","（或外幣）（中文大寫）＿＿＿＿＿＿＿＿＿＿＿＿元整（ＮＴ＄／","外幣＿＿＿＿＿＿＿＿＿＿＿＿）（以下簡稱保證總額），該履約保","證金／保固保證金由本行開具本連帶保證書負連帶保證責任。","二、機關依招標文件／契約規定認定有不發還廠商履約保證金／保固保證","金之情形者，一經機關書面通知本行後，本行當即在前開保證總額內","，依機關書面通知所載金額如數撥付，絕不推諉拖延，且無需經過任","何法律或行政程序。本行亦絕不提出任何異議，並無民法第 745  條","之權利。保證金有依契約規定遞減者，保證總額比照遞減。","三、本保證書如有發生訴訟時，本行同意以機關所在地之法院為第一審管","轄法院。","四、本保證書有效期間自本保證書簽發日起，（一）至民國年月日止。（","二）至招標文件／契約規定之期限止。","五、本保證書正本 1  式 2  份，由機關及本行各執 1  份，副本 1  份","由廠商存執。","六、本保證書由本行負責人或代表人簽署，加蓋本行印信或經理職章後生","效。","連帶保證銀行：","負責人（或代表人）：","地址：","電話：","中        華        民        國        年        月        日"]}]},{"id":"FL038990","title":"公共工程履約權責劃分及管理應注意事項","short":"履約權責劃分注意事項","date":"民國91年12月11日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL038990","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["一、為釐清公共工程契約權責，減少履約爭議，以確保公共工程品質及工","程進度，爰彙整相關法令規定，訂定本注意事項。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["二、各機關研訂各階段公共工程採購契約時，應依政府採購法 (以下簡稱","採購法) 及相關法令規定辦理，並注意下列事項：","(一) 採購標的之範圍及工作項目應於契約中明定。","(二) 採購契約標的功能、效益或特性等需求、使用材料、機具設備規格","、施工規範、驗收標準等相關書圖文件須詳實明確。","(三) 契約雙方權利義務關係及廠商不履行契約或其他違反契約情事之處","理規定及程序應於契約中明定。","(四) 應考量與相關採購契約之關連性與必要性。","(五) 未具有專業採購能力之機關，得依採購法第四十條規定，洽由其他","具有專業能力之機關代辦採購。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["三、機關與各廠商間之履約權責應依相關法規及簽訂之契約確實履行，其","履約權責劃分得參採附表一及附表二定之。","圖表附件：附表一 機關與各廠商間辦理公共工程之履約權責劃分表（已委託專案管理廠商時）.pdf附表二 機關與各廠商間辦理公共工程之履約權責劃分表（未委託專案管理廠商時）.pdf"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["四、規劃、設計、監造或專案管理廠商履約如有缺失，應視下列情節追究","其責任：","(一) 民事責任：","1.有規劃設計錯誤、監造不實或管理不善，致機關遭受損害情事者","，依採購法第六十三條及契約規定，追究其規劃設計錯誤、監造","不實或管理不善之責任。","2.得標廠商有將原契約中應自行履行之全部或其主要部分，由其他","廠商代為履行 (轉包) 之情事者，依採購法第六十六條，機關得","解除契約、終止契約或沒收保證金，並得要求損害賠償；該轉包","廠商與得標廠商對機關負連帶履行及賠償責任。","3.承造人有建築法第六十條第二款，未按核准圖說施工，而監造人","認為合格，惟經直轄市、縣 (市)  (局) 主管建築機關勘驗不合","規定，必須修改、拆除、重建或補強情事者，承造人應負賠償責","任；承造人之專任工程人員及監造人負連帶責任。","4.有履約遲延情事者，依委託契約處罰逾期違約金或併終止、解除","契約。","5.有技術服務成果不符契約規定情事者，依採購法第七十二條規定","通知廠商限期改善、重作、減價收受。","6.監造單位所派監工人員未能有效達成品質要求時，機關得依契約","及公共工程施工品質管理作業要點 (以下簡稱品管要點) 第十點","規定，隨時撤換之。","7.符合契約所定全部或部分不發還保證金之情形者，不予發還其保","證金。","(二) 採購法責任：有採購法第一百零一條規定情事並經機關將其事實及","理由通知廠商者，依同法第一百零一條至第一百零三條規定，將該","廠商刊登政府採購公報列為不良廠商。","(三) 業務法規責任：參考附表三所列相關業務法規，如發現廠商有違反","者，函送各法規主管機關處理。","(四) 刑事責任：參考附表四所列刑事法規，如發現廠商有違反者，應移","送司法機關處理。","圖表附件：附表三 規劃、設計、監造及專案管理廠商相關業務法規之懲處規定.pdf附表四 廠商辦理公共工程相關刑事法規.pdf"]},{"no":"5","label":"第五點","ch":"","cat":"p","lines":["五、施工廠商履約如有缺失，應視下列情節追究其責任：","(一) 民事責任：","1.得標廠商有將原契約中應自行履行之全部或其主要部分，由其他","廠商代為履行 (轉包) 之情事者，依採購法第六十六條，機關得","解除契約、終止契約或沒收保證金，並得要求損害賠償；該轉包","廠商與得標廠商對機關負連帶履行及賠償責任。","2.有履約遲延情事者，依契約規定處罰逾期違約金或併終止、解除","契約。","3.有查驗或驗收不符契約規定情事者，依採購法第七十二條規定通","知廠商限期改善、拆除、重作、減價收受。","4.符合契約所定全部或部分不發還保證金之情形者，不予發還其保","證金。","5.有建築法第六十條規定，施工不合規定或擅自施工等肇致起造人","蒙受損失情事者，由承造人負賠償責任。","6.廠商有品管要點第七點及契約所定得限期更換工地負責人及品管","人員之情事者，機關得依品管要點第四點、第七點及契約規定，","通知廠商限期更換工地負責人及品管人員。","7.廠商有施工品質不良或其他違反品管要點之情事，得依契約及品","管要點第十五點規定，暫停發放工程估驗款或為適當之處置。","(二) 採購法責任：有採購法第一百零一條規定情事並經機關將其事實及","理由通知廠商者，依同法第一百零一條至第一百零三條規定，將該","廠商刊登政府採購公報列為不良廠商。","(三) 業務法規責任：","1.施工廠商：參考附表五所列相關業務法規，如發現廠商有違反者","，函送各法規主管機關處理。","2.營造業專任工程人員：參考附表三所列相關業務法規，如發現其","有違反者，函送各法規主管機關處理。","(四) 刑事責任：參考附表四所列刑事法規，如發現廠商有違反者，應移","送司法機關處理。","圖表附件：附表五 施工廠商相關業務法規之懲處規定.pdf"]},{"no":"6","label":"第六點","ch":"","cat":"p","lines":["六、機關與廠商因履約而生爭議者，應依法令及契約規定，考量公共利益","及公平合理，本誠信和諧，盡力協調解決之。其未能達成協議者，得","以下列方式處理之：","(一) 依採購法第八十五條之一規定向採購申訴審議委員會申請調解。","(二) 依仲裁法規定向仲裁機構提付仲裁。","(三) 提起民事訴訟。","(四) 依契約或雙方合意之其他方式處理。"]},{"no":"7","label":"第七點","ch":"","cat":"p","lines":["七、機關發現採購人員有違反採購人員倫理準則規定時，應依該準則第十","二條規定採取下列必要之處置：","(一) 依公務員服務法、公務員懲戒法、公務人員考績法及其他相關規定","處置。其觸犯刑事法令如附表六者，應移送司法機關處理。","(二) 調離與採購有關之職務。","(三) 施予與採購有關之訓練。","依採購人員倫理準則第十三條規定，採購人員有違反該準則之行為，","其主管知情不予處置者，應視情節輕重，依法懲處。","圖表附件：附表六 機關人員辦理公共工程相關刑事法規.pdf"]},{"no":"8","label":"第八點","ch":"","cat":"p","lines":["八、本注意事項如有未盡事宜，依相關法令、各機關相關作業規定及契約","約定辦理。"]}]},{"id":"FL022977","title":"公共工程廠商延誤履約進度處理要點","short":"延誤履約進度處理要點","date":"民國91年11月22日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL022977","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["一、為有效處理公共工程廠商延誤履約進度案件，提升工程執行績效，特","訂定本要點。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["二、本要點所稱廠商延誤履約進度案件，依契約文件之規定認定。契約文","件未規定者，為公共工程因可歸責於廠商之事由，致施工進度落後百","分之五以上者。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["三、機關處理廠商延誤履約進度案件，得視機關與廠商所訂契約 (以下簡","稱契約) 之規定及廠商履約情形，依下列方式之一處理：","(一) 通知廠商限期改善。","(二) 通知連帶保證廠商履約。","(三) 以監督付款方式，由分包廠商繼續施工。","(四) 終止或解除契約，重行招標。","(五) 其他經機關認定並訂明於契約之方式。"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["四、機關為前點處理方式之決定或採擇，應就下列事項綜合評估：","(一) 當時工程之進展情形。","(二) 該工程對整體或後續工程可能產生之影響。","(三) 該工程之急迫性。","(四) 廠商之履約能力及意願。","(五) 機關所掌握之未付工程款、保留款及履約保證金等額度。","(六) 處理所需時間及額外成本多寡。","(七) 可能造成問題之複雜程度及發生糾紛之可能性。","(八) 與公共利益之相關性。","(九) 其他特殊考量事項。"]},{"no":"5","label":"第五點","ch":"","cat":"p","lines":["五、廠商延誤履約進度案件，契約訂有予以廠商限期改善規定者，機關應","依契約規定通知廠商限期改善；契約訂有連帶保證廠商者，並通知連","帶保證廠商。","如因可歸責於廠商之事由，致進度落後達一定程度，且經通知限期改","善後未積極改善者，機關得依契約規定暫停核發估驗計價款。","前項情形，如廠商提報趕工計畫經機關核可並據以實施後，其進度落","後情形經機關認定已有改善者，機關得恢復核發估驗計價款。"]},{"no":"6","label":"第六點","ch":"","cat":"p","lines":["六、契約訂有連帶保證廠商者，機關除應依押標金保證金暨其他擔保作業","辦法第三十三條之三規定辦理外，契約應載明連帶保證廠商之權利、","義務與責任及連帶保證廠商之更換時機。"]},{"no":"7","label":"第七點","ch":"","cat":"p","lines":["七、契約訂有連帶保證廠商責任規定者，如廠商延誤履約進度，經機關評","估宜由連帶保證廠商接辦時，機關應依契約規定通知連帶保證廠商履","約。","連帶保證廠商經機關通知後，於期限內未依規定履約時，機關應依契","約規定，向連帶保證廠商請求賠償。"]},{"no":"8","label":"第八點","ch":"","cat":"p","lines":["八、機關通知連帶保證廠商履約時，得考量公共利益及連帶保證廠商申請","之動員進場施工時間，重新核定工期；連帶保證廠商如有異議，應循","政府採購法第八十五條之一所定之履約爭議處理機制解決。"]},{"no":"9","label":"第九點","ch":"","cat":"p","lines":["九、連帶保證廠商接辦後，應就下列事項釐清或確認，並以書面提報機關","同意：","(一) 各項工作銜接之安排。","(二) 原分包廠商後續事宜之處理。","(三) 工程預付款扣回方式。","(四) 已施作未請領工程款廠商是否同意由其請領；同意者，其證明文件","。","(五) 工程款請領發票之開立及撥付方式。","(六) 其他應澄清或確認之事項。"]},{"no":"10","label":"第十點","ch":"","cat":"p","lines":["十、廠商延誤履約進度案件，如施工進度已達百分之七十五以上，機關得","經評估後，同意廠商及分包廠商共同申請採監督付款方式，由分包廠","商繼續施工。"]},{"no":"11","label":"第十一點","ch":"","cat":"p","lines":["十一、廠商依前點規定申請採監督付款時，應先與分包廠商簽訂協議書，","將協議書依公證法送經認證；其有連帶保證廠商者，並應先徵得連","帶保證廠商同意。","前項協議書，應載明下列事項：","(一) 繼續施作工程之範圍。","(二) 廠商同意將繼續施作之各期工程估驗款之全部或一部債權，讓與","分包廠商。","(三) 廠商與分包廠商雙方同意，就分包廠商繼續施作部分，對機關連","帶負瑕疵擔保責任。","(四) 繼續施作部分工料款之支付估算、支付名冊、支付方式及工程款","支付明細表。","(五) 廠商已施作尚未領取工程款之支付方式。","(六) 工程履約保證金、差額保證金、物價指數調整費、估驗計價保留","款、驗收後尾款、其他擔保等發還或支付方式。","(七) 工程保固責任歸屬及其保固金繳交、退還方式。","(八) 工程款請領發票由廠商或分包廠商開立。","(九) 協議之生效日期。"]},{"no":"12","label":"第十二點","ch":"","cat":"p","lines":["十二、機關於審核監督付款之申請時，應注意下列事項：","(一) 施工進度是否已達第十點所定百分之七十五以上。","(二) 各分包廠商是否具有繼續施工之能力。","(三) 廠商及分包廠商是否已提出經認證之協議書。","(四) 有連帶保證廠商者，是否已依第十一點第一項規定徵得連帶保證","廠商同意。","(五) 廠商之其他債權人是否已聲請強制執行，致監督付款無法辦理。"]},{"no":"13","label":"第十三點","ch":"","cat":"p","lines":["十三、監督付款之付款程序如下：","(一) 廠商或分包廠商依契約及協議書規定請領工程款，並檢附工程款","支付明細表及廠商或分包廠商所開立相關請款證明文件，經機關","核實後，據以付款。","(二) 廠商已領預付款者，應先予以扣除。","(三) 機關付款時，應依協議書所定付款方式，撥付廠商或 (及) 分包","廠商。"]},{"no":"14","label":"第十四點","ch":"","cat":"p","lines":["十四、監督付款有下列情形之一時，應予停辦：","(一) 法院通知機關執行扣押命令，致影響監督付款時。","(二) 分包廠商經機關認定無法繼續履約，或施工進度落後情形未積極","改善者。","監督付款，於支付工程尾款後停止辦理；如有剩餘款，除協議書另","有約定者外，應撥付廠商。"]},{"no":"15","label":"第十五點","ch":"","cat":"p","lines":["十五、機關應於招標文件中訂明因廠商違約，機關得終止或解除契約之規","定，其內容應載明下列事項：","(一) 機關得通知廠商終止或解除契約之條件。","(二) 終止或解除契約後，廠商應配合辦理之事項包括負責遣散工人、","負責維護工程至機關接管為止，並配合機關辦理結算。","(三) 終止或解除契約後，機關得採取之措施。","(四) 終止或解除契約後，工程款之處理原則。","(五) 終止或解除契約後，機關所受損害之求償等。"]},{"no":"16","label":"第十六點","ch":"","cat":"p","lines":["十六、機關辦理終止或解除契約時，應注意下列事項：","(一) 自通知廠商終止或解除契約日起，停發廠商之工程款，包括尚未","領取之工程估驗款及全部保留款等款項，且依契約規定不發還廠","商之履約保證金。","(二) 辦理工地接管時，應嚴格管理廠商與其分包廠商人員、車輛之進","出，必要時得洽商警政機關或聘僱保全人員協助辦理。","(三) 對於廠商運至工地之合格器材，應詳如清點，並依契約規定辦理","。","(四) 對於已施作完成之工作項目及數量，應會同監造單位及廠商辦理","結算，並拍照存證；廠商不會同辦理時，機關得逕行辦理結算。","必要時，得洽請公正、專業之鑑定機構協助辦理。"]},{"no":"17","label":"第十七點","ch":"","cat":"p","lines":["十七、機關辦理重行招標之招標文件，應訂明原契約保證、保險與保固責","任之延續或更新、未完成工程項目之銜接及工期之起算等事項。"]},{"no":"18","label":"第十八點","ch":"","cat":"p","lines":["十八、工程施工進度達百分之九十五以上，而落後未達百分之五者，得準","用本要點之規定處理。"]}]},{"id":"FL003734","title":"公共工程施工品質管理作業要點","short":"施工品質管理作業要點","date":"民國112年05月11日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL003734","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["一、行政院公共工程委員會（以下簡稱工程會）為提升公共工程施工品質","，確保公共工程施工成果符合其設計及規範之品質要求，並落實政府","採購法第七十條工程採購品質管理之規定，爰訂定本要點。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["二、行政院與所屬各級行政機關、公立學校及公營事業機構（以下簡稱機","關）辦理工程採購，其施工品質管理作業，除法令另有規定外，依本","要點之規定。","本要點所定工程金額係指採購標案預算金額，如為複數決標則為","各項預算金額；因契約變更致金額異動者，則為變更後之契約金額。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["三、機關辦理新臺幣一百五十萬元以上工程，應於招標文件內訂定廠商應","提報品質計畫。","品質計畫得視工程規模及性質，分整體品質計畫與分項品質計畫","二種。整體品質計畫應依契約規定提報，分項品質計畫得於各分項工","程施工前提報。未達新臺幣一千萬元之工程僅需提送整體品質計畫。","整體品質計畫之內容，除機關及監造單位另有規定外，應包括：","（一）新臺幣五千萬元以上工程：計畫範圍、管理權責及分工、施工要領","、品質管理標準、材料及施工檢驗程序、自主檢查表、不合格品之","管制、矯正與預防措施、內部品質稽核及文件紀錄管理系統等。","（二）新臺幣一千萬元以上未達五千萬元之工程：計畫範圍、管理權責及","分工、品質管理標準、材料及施工檢驗程序、自主檢查表及文件紀","錄管理系統等。","（三）新臺幣一百五十萬元以上未達一千萬元之工程：管理權責及分工、","材料及施工檢驗程序及自主檢查表等。","工程具運轉類機電設備者，並應增訂設備功能運轉檢測程序及標","準。","分項品質計畫之內容，除機關及監造單位另有規定外，應包括施","工要領、品質管理標準、材料及施工檢驗程序、自主檢查表等項目。","品質計畫內容之製作綱要，由工程會另定之。"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["四、機關辦理新臺幣二千萬元以上之工程，應於工程招標文件內依工程規","模及性質，訂定下列事項。但性質特殊之工程，得報經工程會同意後","不適用之：","（一）品質管理人員（以下簡稱品管人員）之資格、人數及其更換規定；","每一標案最低品管人員人數規定如下：","1.新臺幣二千萬元以上未達二億元之工程，至少一人。","2.新臺幣二億元以上之工程，至少二人。","（二）新臺幣五千萬元以上之工程，品管人員應專職，不得跨越其他標案","，且契約施工期間應在工地執行職務；新臺幣二千萬元以上未達五","千萬元之工程，品管人員得同時擔任其他法規允許之職務，但不得","跨越其他標案，且契約施工期間應在工地執行職務。","（三）廠商應於開工前，將品管人員之登錄表（如附表一）報監造單位審","查，並於經機關核定後，由機關填報於工程會資訊網路系統備查；","品管人員異動或工程竣工時，亦同。","（四）品管人員於進駐工地前一年內或執行業務期間，有因業務上相關之","犯罪行為，經判刑確定之情事者，廠商應主動更換人員提報；如未","提報，監造單位應通知廠商更換人員。","機關辦理未達新臺幣二千萬元之工程，得比照前項規定辦理。"]},{"no":"5","label":"第五點","ch":"","cat":"p","lines":["五、品管人員，應接受工程會或其委託訓練機構辦理之公共工程品質管理","訓練課程，並取得結業證書。","取得前項結業證書逾四年者，應再取得最近四年內之回訓證明，","始得擔任品管人員。但特殊情形，工程會有另定者，不在此限。","在職品管人員已報名回訓在案，因非可歸責於己之事由，致未能","於前項期間取得回訓證明者，經機關同意並檢具證明文件，得向工程","會申請展延回訓期限六個月。","第一項及第二項之訓練課程、時數及實施方式，及第二項回訓實","施期程，由工程會另定之。"]},{"no":"6","label":"第六點","ch":"","cat":"p","lines":["六、品管人員工作重點如下：","（一）依據工程契約、設計圖說、規範、相關技術法規及參考品質計畫製","作綱要等，訂定品質計畫，據以推動實施。","（二）執行內部品質稽核，如稽核自主檢查表之檢查項目、檢查結果是否","詳實記錄等。","（三）品管統計分析、矯正與預防措施之提出及追蹤改善。","（四）品質文件、紀錄之管理。","（五）其他提升工程品質事宜。"]},{"no":"7","label":"第七點","ch":"","cat":"p","lines":["七、機關辦理新臺幣一百五十萬元以上且適用營造業法規定之工程，應於","招標文件內訂定有關營造廠商專任工程人員（主任技師或主任建築師","）之下列事項：","（一）督察品管人員及現場施工人員，落實執行品質計畫，並填具督察紀","錄表（參考格式如附表二）。","（二）依據營造業法第三十五條規定，辦理相關工作，如督察按圖施工、","解決施工技術問題；查驗工程時到場說明，並於工程查驗文件簽名","或蓋章等。","（三）依據工程施工查核小組作業辦法規定於工程查核時，到場說明。","（四）未依上開各款規定辦理之處理規定。"]},{"no":"8","label":"第八點","ch":"","cat":"p","lines":["八、機關應視工程需要，指派具工程相關學經歷之適當人員或委託適當機","構負責監造。","新臺幣一百五十萬元以上工程，監造單位應提報監造計畫。","監造計畫之內容除機關另有規定外，應包括：","（一）新臺幣五千萬元以上工程：監造範圍、監造組織及權責分工、品質","計畫審查作業程序、施工計畫審查作業程序、材料與設備抽驗程序","及標準、施工抽查程序及標準、品質稽核、文件紀錄管理系統等。","（二）新臺幣一千萬元以上未達五千萬元之工程：監造範圍、監造組織及","權責分工、品質計畫審查作業程序、施工計畫審查作業程序、材料","與設備抽驗程序及標準、施工抽查程序及標準、文件紀錄管理系統","等。","（三）新臺幣一百五十萬元以上未達一千萬元之工程：監造組織及權責分","工、品質計畫審查作業程序、施工計畫審查作業程序、材料與設備","抽驗程序及標準、施工抽查程序及標準等。","工程具運轉類機電設備者，並應增訂設備功能運轉測試等抽驗程","序及標準。","監造計畫內容之製作綱要，由工程會另定之。"]},{"no":"9","label":"第九點","ch":"","cat":"p","lines":["九、機關委託監造，應於招標文件內訂定下列事項：","（一）監造單位派駐現場人員之資格及人數，並依據監造計畫執行監造作","業。其未能有效達成品質要求時，得隨時撤換之。","（二）廠商監造不實或管理不善，致機關遭受損害之責任及罰則。","（三）監造單位之建築師或技師，應依據工程施工查核小組作業辦法規定","，於工程查核時到場說明。","（四）未依前款規定辦理之處理規定。"]},{"no":"10","label":"第十點","ch":"","cat":"p","lines":["十、機關辦理新臺幣五千萬元以上之工程，其委託監造者，應於招標文件","內訂定下列事項。但性質特殊之工程，得報經工程會同意後不適用之","：","（一）監造單位應比照第五點規定，置受訓合格之現場人員；每一標案最","低人數規定如下：","1.新臺幣五千萬元以上未達二億元之工程，至少一人。","2.新臺幣二億元以上之工程，至少二人。","（二）前款現場人員應專職，不得跨越其他標案，且監造服務期間應在工","地執行職務。","（三）監造單位應於開工前，將其符合第一款規定之現場人員之登錄表（","如附表三）經機關核定後，由機關填報於工程會資訊網路系統備查","；上開人員異動或工程竣工時，亦同。","（四）第一款現場人員於進駐工地前一年內或執行業務期間，有因業務上","相關之犯罪行為，經判刑確定之情事者，監造單位應主動更換人員","提報；如未提報，機關應通知監造單位更換人員。","機關辦理未達新臺幣五千萬元之工程，得比照前項規定辦理。","機關自辦監造者，其現場人員之資格、人數、專職及登錄規定，","比照前二項規定辦理。但有特殊情形，得報經上級機關同意後不適用","之。"]},{"no":"11","label":"第十一點","ch":"","cat":"p","lines":["十一、監造單位及其所派駐現場人員工作重點如下：","（一）訂定監造計畫，並監督、查證廠商履約。","（二）施工廠商之施工計畫、品質計畫、預定進度、施工圖、施工日誌","（參考格式如附表四）、器材樣品及其他送審案件之審核。","（三）重要分包廠商及設備製造商資格之審查。","（四）訂定檢驗停留點，辦理抽查施工作業及抽驗材料設備，並於抽查","（驗）紀錄表簽認。","（五）抽查施工廠商放樣、施工基準測量及各項測量之成果。","（六）發現缺失時，應即通知廠商限期改善，並確認其改善成果。","（七）督導施工廠商執行工地安全衛生、交通維持及環境保護等工作。","（八）履約進度及履約估驗計價之審核。","（九）履約界面之協調及整合。","（十）契約變更之建議及協辦。","（十一）機電設備測試及試運轉之監督。","（十二）審查竣工圖表、工程結算明細表及契約所載其他結算資料。","（十三）驗收之協辦。","（十四）協辦履約爭議之處理。","（十五）依規定填報監造報表（參考格式如附表五）。","（十六）其他工程監造事宜。","前項各款得依工程之特性及實際需要，擇項訂之。如屬委託監","造者，應訂定於招標文件內。"]},{"no":"12","label":"第十二點","ch":"","cat":"p","lines":["十二、機關辦理新臺幣一百五十萬元以上工程，應於工程及委託監造招標","文件內，分別訂定下列事項：","（一）鋼筋、混凝土、瀝青混凝土及其他適當檢驗或抽驗項目，應由符","合CNS 17025（ISO/IEC 17025）規定之實驗室辦理，並出具檢驗","或抽驗報告。","（二）前款檢驗或抽驗報告，應印有依標準法授權之實驗室認證機構之","認可標誌。","自辦監造者，應比照前項規定辦理。"]},{"no":"13","label":"第十三點","ch":"","cat":"p","lines":["十三、機關辦理新臺幣一百五十萬元以上工程，應於相關採購案之招標文","件內，依工程規模及性質編列品管費用及材料設備抽（檢）驗費用","。","品管費用內得包含品管人員及行政管理費用。","品管費用之編列，以招標文件內品管人員設置規定為依據，其","訂有專職及人數等規定者，以人月量化編列為原則；未訂有專職及","人數等規定者，以百分比法編列為原則。","前項品管費用之編列方式如下：","（一）人月量化編列：品管費用＝〔（品管人員薪資 ×人數）＋行政管","理費〕 ×工期。品管人員薪資得包含經常性薪資及非經常性薪資","；工期以品管人員執行契約約定職務之工作期間計算。","（二）百分比法編列：發包施工費（直接工程費）之百分之零點六至百","分之二。","材料設備抽（檢）驗費用應單獨量化編列。廠商所需之檢驗費","用應於工程招標文件內編列。監造單位所需之抽驗費用，機關委託","監造者，應於委託監造招標文件內編列；設計及監造一併委託者或","自辦監造者，應於相關工程管理預算內編列。以上抽（檢）驗費用","如係機關自行支付，得免於招標文件內編列。","契約規定以外之查驗、測試、抽驗或檢驗，其結果不符合契約","規定者，由廠商負擔所生之費用；結果相符者，由機關負擔費用。","機關除另有規定外，應依工程規模及性質於相關採購案之招標","文件內訂定材料設備之抽（檢）驗、實驗室遴選及抽（檢）驗費用","支付等規定：","（一）廠商應依品質計畫，辦理相關材料設備之檢驗，由廠商自行取樣","、送驗及判定檢驗結果；如涉及契約約定之檢驗，應由廠商會同","監造單位取樣、送驗，並由廠商及監造單位依序判定檢驗結果，","以作為估驗及驗收之依據。","（二）監造單位得於監造計畫明訂材料設備抽驗頻率，由監造單位會同","廠商取樣、送驗，並由監造單位判定抽驗結果。","（三）實驗室遴選得由機關指定或由機關審查核定；抽（檢）驗費用得","由機關、廠商或監造單位支付，或機關以代收代付方式辦理。"]},{"no":"14","label":"第十四點","ch":"","cat":"p","lines":["十四、機關於新臺幣一百五十萬元以上工程開工時，應將工程基本資料填","報於工程會指定之資訊網路系統，並應於填具結算驗收證明文件後","二十日內，將結算資料填報於前開系統。"]},{"no":"15","label":"第十五點","ch":"","cat":"p","lines":["十五、機關應隨時督導工程施工情形，並留存紀錄備查。機關或其上級機","關另得視工程需要設置工程督導小組，隨時進行施工品質督導工作","。","機關發現工程缺失時，應即以書面通知監造單位或廠商限期改","善。"]},{"no":"16","label":"第十六點","ch":"","cat":"p","lines":["十六、機關應依第四點及第十點規定，於工程及委託監造招標文件內，分","別訂定品管人員或監造單位受訓合格之現場人員有下列情事之一者","，由機關通知廠商限期更換並調離工地，並由機關填報於工程會資","訊網路系統備查：","（一）未實際於工地執行品管或監造工作。","（二）未能確實執行品管或監造工作。","（三）工程經工程施工查核小組查核列為丙等，可歸責於品管人員或監造","單位受訓合格現場人員。","（四）於進駐工地前一年內或執行業務期間，有因業務上相關之犯罪行為","，經判刑確定之情事。"]},{"no":"17","label":"第十七點","ch":"","cat":"p","lines":["十七、廠商有施工品質不良、監造不實或其他違反本要點之情事，機關得","依契約規定暫停發放工程估驗款、扣（罰）款或為其他適當之處置","，並得依政府採購法第一百零一條至第一百零三條規定處理。"]},{"no":"18","label":"第十八點","ch":"","cat":"p","lines":["十八、各機關得依本要點，另訂定有關之作業規定。","直轄市政府、縣（市）政府及鄉（鎮、市）公所辦理工程採購","，其施工品質管理作業，除法令另有規定外，得比照本要點之規定","辦理。"]}]},{"id":"FL026637","title":"工程施工查核小組績效考核作業要點","short":"施工查核績效考核要點","date":"民國113年02月06日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL026637","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["一、行政院公共工程委員會（以下簡稱本會）為促使行政院所屬部會行處","院及直轄市、縣（市）政府工程施工查核小組（以下簡稱查核小組）","，確實依政府採購法定期查核所屬（轄）機關工程品質及進度等事宜","，有效發揮查核功能，特依工程施工查核小組作業辦法第十一條第二","項規定，訂定本要點。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["二、本會設工程施工查核小組績效考核會（以下簡稱績效考核會），辦理","查核小組年度績效考核成績評比相關事宜。","績效考核會置委員七名至九名，由本會主任委員就本會高階人員","或自本會所建置之工程施工查核委員專家名單中派（聘）兼之，其中","一人為召集人。","查核小組績效考核（以下簡稱績效考核）幕僚作業，由中央查核","小組（以下簡稱本小組）辦理。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["三、績效考核作業，依下列規定辦理：","（一）初評作業：","1.本小組於每年五月、八月、十一月及次年二月底前，依各查核小","組彙送本會備查之查核結果，進行審查。其配分以百分之二十五","為原則。","2.本小組每年針對各查核小組進行查證，並採書面查證方式辦理，","必要時得進行實地查證。其配分以百分之六十五為原則。","3.為維持查核運作基本功能及效益，各查核小組應依一般績效項目","，於提報考核期程最後一季季報表時，併檢附相關佐證資料一併","敘明。其配分以百分之十為原則。","4.前開各查核小組提報查核結果、書面查證、一般績效項目及其相","關佐證資料之方式，採電子化方式辦理，必要時得採紙本方式提","報。","（二）複評作業：","1.績效考核會應就本小組初評結果進行審議並評分後，決定績效考","核等第。","2.複評作業各項配分，必要時得由績效考核會調整之。","3.績效考核會開會時，得視實際情況邀請受考機關列席陳述意見。","審查評分表、查證評分表、一般績效評分表及複評績效考核評分","表，如附表一至附表四。"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["四、績效考核成績之評比，按各部會行處院及地方之查核小組分別辦理。","前項各部會行處院之查核小組分三級評比，依工程施工查核小組","作業辦法第四條規定計算之年度應查核總件數四十五件以上者，為第","一級；十件以上未達四十五件者，為第二級；未達十件者，為第三級","。"]},{"no":"5","label":"第五點","ch":"","cat":"p","lines":["五、績效考核成績之等第種類如下：","（一）第一級、第二級各部會行處院查核小組、直轄市及縣（市）政府查","核小組：年度考核成績分優、甲、乙、丙、丁等五級，考核分數達","九十分以上者為優等；八十分以上未滿九十分者為甲等；七十分以","上未滿八十分者為乙等；六十分以上未滿七十分者為丙等；未滿六","十分者為丁等。","（二）第三級各部會行處院查核小組：年度考核成績分優、甲、乙、丙、","丁等五級，考核分數達八十分以上者為優等；七十分以上未滿八十","分者為甲等；六十分以上未滿七十分者為乙等；五十分以上未滿六","十分者為丙等；未滿五十分者為丁等。"]},{"no":"6","label":"第六點","ch":"","cat":"p","lines":["六、本會應將績效考核成績函送受考查核小組設立機關，設立機關得就考","核等第，依建議獎懲標準，並考量其個別貢獻度、機關之獎度標準、","查核小組成員之敘獎之平衡性等，核實辦理受考查核小組相關人員（","召集人、執行秘書、查核委員具有在職公務員資格者及工作人員或其","他實際參與工程施工查核業務等人員）之獎懲。","除設立機關另有獎懲規定外，建議獎懲標準如下：","（一）年度績效考核成績列優等者，最高得記功二次。","（二）年度績效考核成績列甲等者，最高得記嘉獎二次。","（三）年度績效考核成績列乙等者，不予獎勵。","（四）年度績效考核成績列丙等者，最高得記申誡一次。","（五）年度績效考核成績列丁等者，最高得記過一次。"]}]},{"id":"FL037176","title":"工程施工查核小組處理查核缺失改善逾期案件規定","short":"查核缺失逾期處理規定","date":"民國105年06月13日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL037176","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["一、依據工程施工查核小組作業辦法第九條及第十條規定辦理。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["二、缺失改善逾期之認定基準：","（一）工程主管機關工程施工查核小組（以下簡稱查核小組）查核之案件","，其缺失改善是否逾期，以工程主辦機關回函日期為準。各部會行","處局署院查核小組查核補助工程之案件，得比照之。","（二）中央查核小組查核之案件，其缺失改善是否逾期，以工程主辦機關","回函工程主管機關查核小組日期為準，其缺失審查是否逾期，以工","程主管機關查核小組回函日期為準。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["三、缺失改善逾期之申請展延：","（一）工程主辦機關應督導廠商（含專案管理、監造及施工等廠商）限期","提送查核缺失之改善結果。","（二）工程主管機關查核小組查核之案件，應依下列規定辦理；各部會行","處局署院查核小組查核補助工程之案件，得比照之：","1.工程主辦機關經檢討查核缺失，無法於期限內全部改善完成時，","應於期限前先將已改善完成部分先行回復工程主管機關查核小組","，並就無法如期改善部分，敘明原因申請同意展延期限。","2.工程主管機關查核小組應就工程主辦機關所提缺失改善展延期限","申請，審查是否同意展延。其同意展延者，應函請工程主辦機關","限期提報缺失改善結果，改善期限最長以不逾三星期（日曆天）","為原則；不同意展延者，依原訂時限檢討改善逾期之責任歸屬。","（三）中央查核小組查核之案件，應依下列規定辦理：","1.工程主辦機關經檢討查核缺失改善，無法於期限內全部改善完成","者：","（1）應於期限前先將已改善完成部分，先行回復工程主管機關查核","小組核可後轉中央查核小組備查。另就無法如期改善部分，敘","明原因報經工程主管機關查核小組同意，轉報中央查核小組申","請展延期限。","（2）中央查核小組應就工程主辦機關所提缺失改善展延期限申請，","審查是否同意展延。其同意展延者，應函請工程主管機關查核","小組轉知工程主辦機關限期提報缺失改善結果，改善期限最長","以不逾三星期（日曆天）為原則；不同意展延者，依原訂時限","檢討改善逾期之責任歸屬。","2.受查核案件部分未完全改善，經工程主管機關查核小組退回澄清","或補件者：","（1）工程主管機關查核小組應函請工程主辦機關補正缺失改善結果","，並副知中央查核小組；該副知函應檢附工程主辦機關改善結","果原件一份，供中央查核小組審核。中央查核小組若認仍須再","補正時，應函請工程主辦機關一併改善，並副知工程主管機關","查核小組。","（2）工程主辦機關於收到工程主管機關查核小組或中央查核小組退","回或補正通知後，應即依工程施工查核小組作業辦法規定，直","接函請中央查核小組同意展延缺失改善期限並副知工程主管機","關查核小組。","（3）中央查核小組同意工程主辦機關展延缺失改善期限時，應考量","改善時間及工程主管機關查核小組審查、函轉等作業時間，自","工程主管機關查核小組發函澄清或補件起合計以不逾三星期（","日曆天）為原則。"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["四、缺失改善逾期之處置：","（一）廠商缺失改善逾期，工程主辦機關應於一星期內（日曆天）依工程","施工查核小組作業辦法第十條第四項及契約規定，依責任歸屬對廠","商及相關人員予以適當處置，並副知辦理該次查核之查核小組。如","屬中央查核小組查核之案件，工程主辦機關應同時副知工程主管機","關查核小組；各部會行處局署院查核小組查核補助工程之案件，得","比照之。","（二）廠商缺失改善逾期提報，工程主辦機關未檢討責任者，查核小組應","依工程施工查核小組作業辦法第十條第五項規定辦理，並於二星期","內（日曆天）發函稽催。","（三）工程主辦機關應將查核缺失，列為工程驗收項目之參考，並得依契","約規定暫停發放估驗款或依約定之罰則辦理。","（四）工程主辦機關對缺失改善逾期之處置結果，應函請工程主管機關查","核小組備查，並上網登錄。","（五）中央查核小組查核之案件，工程主辦機關應先函請工程主管機關查","核小組審查後轉中央查核小組備查；中央查核小組就其查核之案件","函請工程主管機關查核小組轉工程主辦機關辦理。"]},{"no":"5","label":"第五點","ch":"","cat":"p","lines":["五、其他注意事項：","（一）缺失改善逾期之展期、補正改善結果及檢討責任時間，各以不逾三","星期（日曆天）為原則。","（二）查核小組對缺失改善逾期及責任檢討，得分別處理。缺失如已改善","完成，得准予先行結案，責任檢討部分則另案列管追蹤。","（三）查核小組處理缺失改善相關事宜，應考量內部文書作業期程，以免","逾期。"]}]},{"id":"FL024579","title":"因應國內鋼筋價格變動之物價調整處理原則","short":"鋼筋價格變動處理原則","date":"民國92年04月30日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL024579","articles":[{"no":"1","label":"壹、","ch":"","cat":"p","lines":["壹、處理措施","一、機關辦理查核金額以上之在建工程，因近期國內鋼筋價格劇烈變動，","廠商要求就鋼筋材料協議調整工程款者，機關得參考本處理原則，依","行政院主計處公布之台灣地區營造工程物價指數表材料類內之「金屬","製品類指數」 (以下簡稱金屬指數) 辦理物價調整 (含增加或扣減應","給付之契約價金) ，惟應先辦理契約變更，加列物價指數調整相關規","定；其屬增加契約價金者，應先考量機關經費支應能力。","二、機關依前點辦理契約變更，應參考採購契約要項第三十九點規定，並","載明下列事項：","(一) 未完成契約變更前已辦理估驗之工程款是否適用契約變更後加列之","物價指數調整規定。屬適用者，應載明其得追溯之期間，並得規定","溯及於九十一年六月一日。","(二) 逾履約期限之部分，如估驗當期金屬指數較契約規定履約期限當月","金屬指數為低者，應以估驗當期為調整依據。但逾期履約係可歸責","於機關者，不在此限。","(三) 鋼筋材料價款不得再以其他物價指數重複進行調整。","三、機關辦理未達查核金額之在建工程，因國內鋼筋價格劇烈變動而需就","鋼筋材料協議調整工程款者，準用本處理原則。","四、機關辦理在建工程，因國內鋼筋以外之金屬製品價格劇烈變動而需就","該等金屬製品協議調整工程款者，準用本處理原則。","五、各直轄市政府得依該府主計處調查公布之物價指數辦理物價調整。","六、機關依本處理原則辦理物價調整所增加之經費，應在工程標餘款或各","該計畫奉核定預算內勻支。"]},{"no":"2","label":"貳、","ch":"","cat":"p","lines":["貳、調整方式","一、當期估驗日與前一期估驗日之中間日當月金屬指數比較開標當月金屬","指數，其指數增減率之絕對值超過百分之五者，就漲跌幅超過百分之","五部分，於估驗完成後就估驗款中之鋼筋材料金額調整工程款 (百分","之五以內之部分不調整) ；指數增減率之絕對值在百分之五以內者，","不予調整。","指數增減率＝ (Ｂ／Ｃ－１) ×100 ％","其中  Ｂ＝當期估驗日與前一期估驗日之中間日當月金屬指數。 (1.","估驗日係指估驗內容之最後施工日；2.中間日有兩日者，","以日期較晚者為中間日；3.第一期估驗，以當期估驗日與","開工日之中間日認定之)","Ｃ＝開標當月金屬指數。但就契約新增單價項目之工程款，為","該項目議價完成日當月金屬指數。","指數增減率以計算至小數點以下第三位 (第四位四捨五入) 為原則。","二、依前項調整工程款時，每期估驗計價金額中含有鋼筋料之各工作項目","均以下列公式計算調整金額 (計算至元，元以下四捨五入) ：","Ａ× (１－Ｅ) ×Ｄ× (指數增減率之絕對值－ 5％) ×F","其中  Ａ＝該工作項目之當期工程估驗款。","Ｄ＝鋼筋價權重","＝工程預算書所列該工作項目每單位所含鋼筋材料 (不含任","何其他費用) 總價／工程預算書所列該工作項目每單位之","價格","Ｅ＝已付預付款佔契約總價之百分比","Ｆ＝ (1+營業稅率) 。營業稅率應核實計之。","三、指數增減率為正值者，就上開調整金額之合計金額給予補償﹔指數增","減率為負值者，就上開調整金額之合計金額自估驗款中扣減。","四、管理費、保險費、利潤及其他稅雜費 (不包括營業稅) 不予調整。"]},{"no":"3","label":"參、","ch":"","cat":"p","lines":["參、範例","某標工程已知條件 (所用數值為假設值)","一、開標 (90  年 8  月 8  日) 當月之台灣地區營造工程物價指數表 5","-1  內材料類之「金屬製品類指數」為 98.24。","二、92  年 3  月 5  日辦理估驗請款，當期估驗內容之最後施工日為同","年 3  月 2  日，且前一期估驗內容之最後施工日為同年 2  月 2","日，則當期估驗日與前一期估驗日之中間日為同年 2  月 16 日，查","92  年 2  月份當月之台灣地區營造工程物價指數表 5-1  內材料類","之「金屬製品類指數」為 129.67 。","三、機關已付預付款為契約總價之百分之 30 ％。","四、假設 92 年 2  月辦理估驗之工程款為 15,000,000 元，其中含鋼筋","料工作項目預鑄蓋版估驗款為 1,000,000  元﹔預壘樁估驗款為 3,0","00,000  元。鋼筋價各佔該工作項目之權重分別為 30.65  ％、19.0","6 ％ (計算方式詳附表) 。","則各工作項目鋼筋料價之物價調整計算如下：","1 指數增減率＝ (129.67/98.24-1) ×100 ％＝32.0％","2 預鑄蓋版","Ａ× (１－Ｅ) ×Ｄ× (指數增減率之絕對值－5 ％) ×F","＝1,000,000x(1-0.3)x0.3065x(0.320-0.05)x1.05=60,825 元","3 預壘樁","Ａ×(１－Ｅ)×Ｄ× (指數增減率之絕對值－5 ％) ×F","＝3,000,000x(1-0.3)x0.1906x(0.320-0.05)x1.05=113,474  元","4 當期估驗就鋼筋料價之物價調整金額為補償","60,825元＋113,474 元＝174,299 元"]}]},{"id":"FL039842","title":"機關提報巨額採購使用情形及效益分析作業規定","short":"巨額採購效益分析規定","date":"民國100年06月29日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL039842","articles":[{"no":"1","label":"第一點","ch":"","cat":"z","lines":["一、機關依政府採購法（以下簡稱本法）第一百十一條逐年向主管機關提","報巨額採購之使用情形及其效益分析，應依本規定辦理。"]},{"no":"2","label":"第二點","ch":"","cat":"z","lines":["二、機關辦理巨額採購前，應就下列事項簽經機關首長或其授權人員核准","。其須經上級機關或目的事業主管機關核准者，從其規定：","（一）完成採購後之預期使用情形及其效益目標。","（二）評估使用情形及其效益之分析指標。如使用人數或次數、使用頻率","、工作人力、工作成果、產量、產能、投資報酬或收益、節省能源","數量、減少溫室氣體排放數量、減少消耗資源數量。","（三）預計採購期程、開始使用日期及使用年限。","機關對於前項預期使用情形及其效益，於完成採購前有調整必要或明","顯不符合預期者，應即檢討原因、責任歸屬並採行相關配套措施，重","行簽報核准。完成採購後，亦同。"]},{"no":"3","label":"第三點","ch":"","cat":"z","lines":["三、機關提報巨額採購之使用情形及其效益分析，應包括下列事項：","（一）採購案號、採購標的摘要、採購性質歸屬、預算金額、決標日期、","決標金額、結算金額、完成履約廠商名稱及地址、原規劃及實際啟","用日期、使用年限、機密等級及其理由。","（二）屬重要經建投資計畫、重要行政計畫、重要社會發展計畫或重大科","技計畫者，其計畫編號及名稱。","（三）提報使用期間起迄日期及提報次數。","（四）原規劃、設計或需求所欲達成之預期使用情形及其效益。有調整者","，其經過及內容。","（五）使用期間內之實際使用情形及其效益。","（六）實際使用情形及其效益與原規劃、設計或需求所欲達成者之比較及","差異原因。","（七）未依原規劃日期啟用之原因。","（八）結算金額與決標金額差異之原因。","（九）屬第二次提報者，與前一次使用情形及其效益分析之比較及差異分","析。屬第三次以後提報者，與前二次使用情形及其效益分析之比較","及差異分析。","（十）綜合說明與檢討。","（十一）其他經主管機關指定者。","前項提報，以由使用或接管單位提報為原則。但機關另有分工規定者","，從其規定。共同供應契約之採購，由訂約機關彙總提報；其因適用","機關眾多難以全面調查其使用情形及效益者，得以抽樣方式為之。"]},{"no":"4","label":"第四點","ch":"","cat":"z","lines":["四、前點提報，應自啟用每屆滿一年之次日起三個月內逐年為之。但驗收","後因故逾一年仍未啟用者，自驗收後每屆滿一年之次日起一個月內逐","年提報未啟用之原因。","前項提報涉及年度營業收入、淨盈虧計算者，得按年度提報。 　　勞務採購之使用期間為其契約約定之履約期間，除工作內容重複者外","，以契約工作完成後一次提報為原則。　　採購標的為土地，並於其上興建建築物或構造物，且已依計畫完成興","建者，得與建築物或構造物合併提報。　　第一項提報，於履約期間有終止契約或解除契約，或使用期間標的物","已滅失、不堪使用等情形者，得敘明理由後免提報或停止提報。"]},{"no":"5","label":"第五點","ch":"","cat":"z","lines":["五、第三點第一項第五款使用情形及其效益，機關應依採購案件之特性，","就下列資料擇定相關者詳實提報，並以量化方式輔助說明：","（一）屬工程或財物採購者：使用功效、使用人數或次數、交通流量、使","用頻率、產量、產能、閒置、中斷使用或停止使用情形、瑕疵、故","障、違約或發生事故情形、使用者滿意程度、維修情形、維修費用","、投資報酬、收益、虧損、節省費用、節省能源數量、減少溫室氣","體排放數量、減少消耗資源數量等。","（二）屬勞務採購者：使用功效、使用人數或次數、使用頻率、工作人力","、工作成果、閒置、中斷使用或停止使用情形、瑕疵、違約或發生","事故情形、使用者滿意程度、投資報酬、收益、虧損、節省費用、","節省能源數量、減少溫室氣體排放數量、減少消耗資源數量等。"]},{"no":"6","label":"第六點","ch":"","cat":"z","lines":["六、分批採購合併使用者，以合併提報使用情形及其效益分析為原則。","採部分驗收部分先行使用者，其啟用日期以該先行使用部分之啟用日","期為準。","採購標的之使用期間未逾一年者，於期間屆滿後提報使用情形及其效","益分析。使用期間未達二年者，得於期間截止後一次提報。","分屬不同年度預算而分期採購合併使用者，適用前三項規定。"]},{"no":"7","label":"第七點","ch":"","cat":"z","lines":["七、機關辦理採購之標的係與其他採購之標的混合、附合或合併製造成品","或提供服務，單獨提報使用情形及其效益分析有困難者，得彙總提報","。","前項採購為轉售或贈與民間機構使用，轉售或贈與前未使用者，不適","用本規定。轉售或贈與前未經製造程序者，亦同。"]},{"no":"8","label":"第八點","ch":"","cat":"z","lines":["八、機關向主管機關提報巨額採購之使用情形及其效益分析，得以電子化","方式為之，免另備書面文件通知主管機關，其辦理程序如下：","（一）備具使用情形及其效益分析後，連線至主管機關政府電子採購網","http://web.pcc.gov.tw，輸入機關使用代碼及密碼後，進入「採","購輔助/巨額效益/效益評估提報/進入效益評估提報功能」網頁。","（二）依網頁指示輸入相關資料後，傳送主管機關。","（三）採購標的已按原核定內容持續正常使用而無閒置、低度使用、虧損","情形，且使用情形及其效益與前次提報相較，並無明顯差異或異常","情形者，得就前次提報資料摘要補充說明後傳送。"]}]},{"id":"FL041711","title":"行政院公共工程委員會政府採購諮詢小組設置要點","short":"政府採購諮詢小組要點","date":"民國114年05月13日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL041711","articles":[{"no":"1","label":"第一點","ch":"","cat":"z","lines":["一、行政院公共工程委員會（以下簡稱本會）為協助解決廠商與機關間因","政府採購契約條款認知歧異之問題，加速推動公共建設及增進採購效","率，特設政府採購諮詢小組（以下簡稱本小組）。"]},{"no":"2","label":"第二點","ch":"","cat":"z","lines":["二、廠商與機關間依政府採購法辦理之採購，於履約階段因契約條款之認","知產生歧異，經雙方協調未能達成協議，有立即解決需要者，得以書","面向本小組申請諮詢。但不包括已向採購申訴審議委員會申請調解者","。","前項以外之履約爭議或涉違反契約約定情事者，依法令既定之程","序處理。"]},{"no":"3","label":"第三點","ch":"","cat":"z","lines":["三、本小組置召集人一人，由本會副主任委員兼任，綜理組務；置執行秘","書一人，由本會企劃處處長兼任，協助處理組務；置小組成員若干人","，由本會指派適當人員兼任。"]},{"no":"4","label":"第四點","ch":"","cat":"z","lines":["四、申請諮詢應具申請書，載明下列事項，並副知他造當事人（以下簡稱","當事人）：","（一）申請人名稱、地址、電話。","（二）當事人之名稱。","（三）標的案號及名稱。","（四）請求諮詢之事項、標的之法律關係與相關事實情節。","（五）其他相關文件。","前項申請書格式如附件。"]},{"no":"5","label":"第五點","ch":"","cat":"z","lines":["五、本小組收受申請書後，得通知當事人提出相關文件，以利諮詢會議之","進行。"]},{"no":"6","label":"第六點","ch":"","cat":"z","lines":["六、本小組為處理諮詢事項，得通知申請人及當事人召開諮詢會議，並作","出建議。但案情單純者，得僅就書面資料為之。"]},{"no":"7","label":"第七點","ch":"","cat":"z","lines":["七、本小組作成之建議，原則上以書面為之，通知各有關單位，並得以列","管。"]},{"no":"8","label":"第八點","ch":"","cat":"z","lines":["八、本小組開會時，得邀請專家、學者、與諮詢事項有關之中央目的事業","主管機關列席。"]},{"no":"9","label":"第九點","ch":"","cat":"z","lines":["九、本小組對外行文，以本會名義行之。"]},{"no":"10","label":"第十點","ch":"","cat":"z","lines":["十、本小組召集人、執行秘書及本會指派之其他成員均為無給職。"]}]},{"id":"FL029468","title":"採購稽核小組績效考核作業要點","short":"稽核小組績效考核要點","date":"民國105年04月28日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL029468","articles":[{"no":"1","label":"第一點","ch":"","cat":"z","lines":["一、行政院公共工程委員會（以下簡稱主管機關）為促使行政院所屬部會","署及直轄市、縣市政府所設立採購稽核小組（以下簡稱部會署及地方","採購稽核小組）確實依政府採購法（以下簡稱本法）稽核監督採購事","宜，有效發揮採購稽核功能，特訂定本要點。"]},{"no":"2","label":"第二點","ch":"","cat":"z","lines":["二、採購稽核績效考核由主管機關逐年辦理，受考機關為部會署及地方採","購稽核小組；考核期程為每年一月一日起至十二月三十一日止。"]},{"no":"3","label":"第三點","ch":"","cat":"z","lines":["三、部會署及地方採購稽核小組應依採購稽核小組組織準則第四條第二項","規定，將每月稽核報表向主管機關彙報，以供考核。","前項彙報應於次月十五日前，利用主管機關建置之資訊系統，以","電子化方式傳輸至主管機關指定之電腦資料庫，且定期更新稽核案件","辦理情形。"]},{"no":"4","label":"第四點","ch":"","cat":"z","lines":["四、主管機關為辦理採購稽核績效考核，得指定中央採購稽核小組適當人","員數人組成績效考核專案小組，依據考核項目與部會署及地方採購稽","核小組彙送指定受考案件之相關書面資料，逐案討論後，依評分標準","核實評分，連同初評意見，提報中央採購稽核小組召集人核定，或送","交中央採購稽核小組稽核委員會議審定。","前項指定受考案件，指下列經主管機關於每年三月下旬後，以書","面通知受考機關限期彙送之文件：","（一）各受考機關上一年度依第三點規定按月彙報之案件，經主管機關抽","樣選取之專案稽核及書面稽核案之相關文件影本。","（二）監察、審計、檢察、調查機關及主管機關移案辦理之案件，其辦理","情形彙總表；或於必要時，通知併提供之相關文件影本。","（三）前項彙送文件未達規定數量者，相關考核項目或其分項，按實際送","達案件數比率給分；未依限送達或未依式彙送者，得視其情形，酌","予扣分。","為應考核需要，得洽請受考機關前來說明或以書面提出補充意見","，必要時，並得由中央採購稽核小組召集人指派稽核委員數人，率稽","查人員或工作人員數人，前往指定之受考機關實地查證。","考核項目配分及評分標準表，如附表。"]},{"no":"5","label":"第五點","ch":"","cat":"z","lines":["五、採購稽核績效考核成績之評比，按各部會署及地方之採購稽核小組分","別辦理。"]},{"no":"6","label":"第六點","ch":"","cat":"z","lines":["六、採購稽核績效考核成績分優、甲、乙、丙、丁等五級，考核分數達九","十分以上者為優等；八十分以上未滿九十分者為甲等；七十分以上未","滿八十分者為乙等；六十分以上未滿七十分者為丙等；未滿六十分者","為丁等。"]},{"no":"7","label":"第七點","ch":"","cat":"z","lines":["七、主管機關應將績效考核成績函送受考機關，受考機關得依建議敘獎標","準，考核等第或精進情形，考量稽核小組個別成員貢獻度及敘獎之平","衡性，核實辦理受考採購稽核小組相關成員（召集人、副召集人、執","行秘書及派兼稽核委員、稽查人員或其他實際參與採購稽核業務等人","員）之敘獎。如當年度因故未及完成敘獎程序者，得延至下一年度辦","理。","建議敘獎標準如下：","（一）考核成績列優等者，最高得記功二次。","（二）考核成績列甲等者，最高得記功一次。","考核成績列丙等或丁等之受考機關，應於接獲績效考核成績一個","月內，研提具體改善措施，函送主管機關備查。"]}]},{"id":"FL039840","title":"行政院公共工程委員會重大採購事件效益評估作業要點","short":"重大採購效益評估要點","date":"民國92年12月23日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL039840","articles":[{"no":"1","label":"第一點","ch":"","cat":"z","lines":["一、行政院公共工程委員會（以下簡稱本會）為落實政府採購法（以下簡","稱本法）第一百十一條第二項重大採購事件之效益評估，特訂定本要","點。"]},{"no":"2","label":"第二點","ch":"","cat":"z","lines":["二、本會對於機關提報使用情形及效益分析之巨額採購，其符合下列情形","之一者，得簽請一級主管以上人員核定後，列為重大採購事件：","（一）採購金額在下列金額以上，且非屬招標期限標準第十條第二款至第","四款所定採購者：","1.工程採購二十億元。","2.財物採購十億元。","3.勞務採購一億元。","（二）與國家重大政策或民生福利有密切關係者。","（三）機關提報使用情形及其效益分析顯示效益明顯不符合預期者。","（四）其他有列為重大採購事件之必要者。","符合前項第一款及第二款情形之採購，機關提報使用情形及其效","益分析正常者，得不列為重大採購事件。","本會已作出效益評估之重大採購事件，得免重複列為重大採購事","件。"]},{"no":"3","label":"第三點","ch":"","cat":"z","lines":["三、本會對於重大採購事件，應於接獲機關提報巨額採購之使用情形及其","效益分析後四個月內作出效益評估，必要時得視個案情形延長之。"]},{"no":"4","label":"第四點","ch":"","cat":"z","lines":["四、重大採購事件經本會作出效益評估後，除應秘密者外，應刊登於政府","採購公報，並函送審計機關、提報機關及其上級機關。","前項評估結果，效益明顯不符合預期者，應通知提報機關檢討原","因、責任歸屬及採行改善措施，並予列管。"]},{"no":"5","label":"第五點","ch":"","cat":"z","lines":["五、本會辦理重大採購事件效益評估，得就機關提報之資料書面為之。必","要時得視個案情形組成評估小組（以下簡稱本小組）實地為之，或通","知機關至本會專案報告。"]},{"no":"6","label":"第六點","ch":"","cat":"z","lines":["六、本小組置組員三人至七人，就具有與採購案相關專門知識之本會人員","或專家、學者派兼或聘兼之。其中外聘專家、學者人數至少一人。","本小組置召集人一人，由本會一級主管以上人員指定組員擔任。"]},{"no":"7","label":"第七點","ch":"","cat":"z","lines":["七、本小組組員之遴選及外聘專家、學者得給付之費用、辭職、解聘，準","用採購評選委員會組織準則第四條至第五條、採購評選委員會審議規","則第十
