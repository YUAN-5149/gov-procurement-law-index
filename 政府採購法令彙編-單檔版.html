title":"政府採購法第二十六條執行注意事項","short":"§26執行注意事項","date":"民國90年11月09日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL000661","articles":[{"no":"1","label":"第一點","ch":"","cat":"b","lines":["本注意事項適用於公開招標、選擇性招標及其他不以特定廠商之技術","規格為邀標標的之限制性招標。"]},{"no":"2","label":"第二點","ch":"","cat":"b","lines":["招標文件所定供不特定廠商競標之技術規格，應以達成機關於功能、","效益或特性等需求所必須者為限。如有採購較佳之功能、效益或特性","等之標的之必要，宜採最有利標決標或依政府採購法施行細則第六十","三條規定辦理。"]},{"no":"3","label":"第三點","ch":"","cat":"b","lines":["機關所擬定、採用或適用之技術規格，其在目的或效果上有無限制競","爭，應以有無逾機關所必須者認定之，而不以符合該規格之廠商家數","多寡作為判斷依據。其屬專屬權利、獨家製造或供應，無其他合適之","替代標的者，可依政府採購法第二十二條第一項第二款規定辦理。"]},{"no":"4","label":"第四點","ch":"","cat":"b","lines":["機關將不同性質之數項財物併案招標，其各項財物係可分別使用且屬","不同行業廠商供應者，應依政府採購法施行細則第六十五條允許分項","報價及分項複數決標。"]},{"no":"5","label":"第五點","ch":"","cat":"b","lines":["機關訂定招標文件之技術規格，除依「公共工程招標文件公開閱覽制","度實施要點」辦理者外，得依政府採購法第三十四條第一項規定公開","徵求廠商提供參考資料，以供研議後訂定。"]},{"no":"6","label":"第六點","ch":"","cat":"b","lines":["機關擬訂定之技術規格有國際標準或國家標準，其未能符合機關採購","需求，須於招標文件載明其他標準 (例如 JIS、ACI、ASTM 等) 或訂","定較嚴之規格者，應擇下列方式之一審查後再行辦理：","(一) 自行審查：簽報機關首長或其授權人員核准。","(二) 開會審查：簽報機關首長或其授權人員召開審查會議，並得邀請專","家學者、規劃設計者，與會協助。","(三) 委託審查：委託專業廠商、機構、團體或人士審查，並得召開會議","，邀請專家學者與會。","前項技術規格，其有審查前例者，得免重複為之。"]},{"no":"7","label":"第七點","ch":"","cat":"b","lines":["機關或受機關委託研擬招標文件內容之廠商，基於採購特性及實際需","要訂定特殊技術規格，或於招標文件要求或提及特定之商標或商名、","專利、設計或型式、特定來源地、生產者或供應者時，應依前點第一","項方式審查之。機關並應規定受委託之廠商於提出招標文件前先向機","關書面說明其必要性。"]},{"no":"8","label":"第八點","ch":"","cat":"b","lines":["機關擬訂定之技術規格無國際標準或國家標準，且無法以精確之方式","說明招標要求，而必須於招標文件要求或提及特定之廠牌時，應註明","「或同等品」字樣，其所列廠牌應符合下列情形：","(一) 所列廠牌僅供廠商參考，不得限制廠商必須採用。","(二) 所列廠牌目前均有製造、供應，容易取得，價格合理，能確保採購","品質，且無代理商、經銷商有公平交易法所稱之獨占或聯合行為之","情事。","(三) 所列廠牌之價格、功能、效益、標準及特性，均屬相當。","決標或簽約後發現有不符合前項第二款情形者，得依本注意事項","第十三點規定辦理。"]},{"no":"9","label":"第九點","ch":"","cat":"b","lines":["受機關委託提供採購規劃、設計或專案管理或代辦採購之廠商及其人","員，如有犯政府採購法第八十八條、第九十二條之罪之嫌者，應送檢","調單位查處。"]},{"no":"10","label":"第十點","ch":"","cat":"b","lines":["招標文件允許投標廠商提出同等品者，得以下列方式之一為之：","(一) 招標文件註明「或同等品」字樣，並規定廠商如欲提出同等品者","，應於投標文件內預先提出。其經審查非同等品者，為不合格之","廠商。","(二) 招標文件註明「或同等品」字樣，並規定得標廠商如欲提出同等","品者，得於使用同等品前，向機關提出，及機關審查同等品所需","時間。","廠商提出同等品時，應敘明同等品之廠牌、價格及功能、效益","、標準或特性比較表等相關資料，以供機關審查。其經審查為同等","品者，方得使用。"]},{"no":"11","label":"第十一點","ch":"","cat":"b","lines":["同等品係指經機關審查認定其功能、效益、標準或特性等不低於招","標文件所要求或提及者，並得予以檢驗或測試。廠商得標後提出之","同等品，其價格如較契約所載原要求或提及者為低，應自契約價金","中扣除；至於與同等品有關之稅捐、利潤或管理費等相關項目，如","係另列一式計價者，依同等品金額與原契約金額之比率扣減之。其","價格如較契約所載為高，應以原契約價金為準，不得加價。"]},{"no":"12","label":"第十二點","ch":"","cat":"b","lines":["機關就廠商所提出之同等品比較表等資料，應擇下列方式之一審查","之：","(一) 自行審查：簽報機關首長或其授權人員核定是否為同等品。","(二) 開會審查：簽報機關首長或其授權人員召開審查會議，並得邀請","專家學者、廠商代表、原設計者與會，以確認是否為同等品。","(三) 委託審查：委託原設計者、專業廠商、機構、團體或人士審查確","認是否為同等品。審查時得召開會議，邀請專家學者、廠商代表","、原設計者與會。","前項審查結果，其非同等品者，機關應敘明原因書面通知廠商","。","第一項同等品有審查前例者，得免重複為之。"]},{"no":"13","label":"第十三點","ch":"","cat":"b","lines":["機關同意廠商依採購契約要項第二十一點辦理者，其審查程序，得","比照前點方式辦理。"]},{"no":"14","label":"第十四點","ch":"","cat":"b","lines":["內政部七十四年十二月十九日台內營字第三五七四三八號函對於「","同等品使用時機」之相關規定，業經該部八十八年七月十二日台八","八內營字第八八○六五四三號函停止適用，機關不得再依該時機規","定辦理。已載明該時機規定者，無效。"]}]},{"id":"GL000064","title":"依政府採購法第三十一條第二項第七款認定屬影響採購公正之違反法令行為","short":"§31Ⅱ⑦影響採購公正認定","date":"民國114年07月10日","kind":"令函釋示","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000064","articles":[{"no":"1","label":"全文","ch":"","cat":"b","lines":["依政府採購法（以下簡稱本法）第三十一條第二項第七款規定認定機關辦","理採購，廠商有下列情形之一者，屬「其他經主管機關認定有影響採購公","正之違反法令行為」情形：","一、廠商或其代表人、代理人、受雇人或其他從業人員與機關人員，共同","違反本法第二十六條、第三十四條或第三十七條第一項規定。","二、有本法第五十條第一項第五款情形。","三、廠商或其代表人、代理人、受雇人或其他從業人員有本法第八十七條","、第九十條或第九十一條規定構成要件事實之一。","四、廠商或其代表人、代理人、受雇人或其他從業人員與受機關委託提供","採購規劃、設計、審查、監造、專案管理或代辦採購廠商之人員，共","同實施本法第八十八條規定構成要件事實。","五、廠商或其代表人、代理人、受雇人或其他從業人員與受機關委託提供","採購規劃、設計、專案管理或代辦採購廠商之人員，共同實施本法第","八十九條規定構成要件事實。"]}]},{"id":"FL029347","title":"政府採購招標文件公開閱覽制度實施要點","short":"公開閱覽要點","date":"民國115年03月12日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL029347","articles":[{"no":"1","label":"第一點","ch":"","cat":"b","lines":["為推動政府採購招標作業公開化、透明化，藉由招標文件公開閱覽，","徵求廠商或民眾意見，提升政府採購品質，並減少招標及履約爭議，","特訂定本要點。"]},{"no":"2","label":"第二點","ch":"","cat":"b","lines":["機關辦理查核金額以上之採購，應於公告招標前辦理招標文件之公開","閱覽。但有下列情形之一者，不在此限：","（一）依政府採購法第二十二條第一項第三款或第一百零五條第一項第一","款、第二款辦理之採購。","（二）依招標期限標準第四條之一或第十條縮短或合理訂定等標期之採購","。","（三）重複性採購。","（四）適用政府採購條約或協定之採購。","（五）拆除、疏濬等性質單純之採購。","（六）流標、廢標、終止或解除契約前已辦理公開閱覽，且重行招標增加","金額未達查核金額。","（七）因招標作業時程需要，經機關首長或其授權人員核准。","（八）涉及國家安全或機密採購。","前項以外之採購，機關得視採購性質、規模等特性，依本要點辦","理招標文件之公開閱覽。"]},{"no":"3","label":"第三點","ch":"","cat":"b","lines":["公開閱覽之文件，包括下列項目：","（一）契約樣稿。","（二）標單樣稿。","（三）切結書樣稿。","（四）投標須知樣稿。","（五）數量表及規格樣稿。","（六）其他依採購特性需要提供之相關文件樣稿（例如位置圖，圖說樣稿","，材料、技術或設備規範，安裝或施工說明書，需求說明書等）。","機關辦理採購之預算金額得與前項文件一併公開。"]},{"no":"4","label":"第四點","ch":"","cat":"b","lines":["機關辦理招標文件公開閱覽前，應將公開閱覽之採購名稱、內容摘要","、期間、地點及閱覽廠商或民眾意見之送達期限等公告週知。","前項公告，應公開於政府採購法主管機關之政府採購資訊網站，","必要時並得刊登於政府採購公報之公開徵求廠商提供參考資料公告中","。","第一項閱覽廠商或民眾意見之送達期限，至少應至公開閱覽截止","日後三日。"]},{"no":"5","label":"第五點","ch":"","cat":"b","lines":["機關辦理招標文件公開閱覽，不得少於五工作天。但以電子化方式辦","理者，不得少於五日曆天，末日為假日者順延之。"]},{"no":"6","label":"第六點","ch":"","cat":"b","lines":["機關辦理招標文件之公開閱覽，應指定專責單位或專人，負責公開閱","覽之公告、廠商或民眾意見之彙整及處理。"]},{"no":"7","label":"第七點","ch":"","cat":"b","lines":["機關應將公開閱覽之文件置於指定之適當處所，或以電子化方式公開","於政府採購法主管機關之政府採購資訊網站。","公開閱覽處所應置閱覽登記書表，以供統計人數及彙整意見。","機關得視招標地點及實際需要，分區設置閱覽處所。"]},{"no":"8","label":"第八點","ch":"","cat":"b","lines":["公開閱覽之承辦單位應將閱覽廠商或民眾之意見彙整加以列管，並送","請主辦單位處理後，再行辦理招標公告作業。","前項廠商或民眾意見之處理，應以公開方式辦理。"]},{"no":"9","label":"第九點","ch":"","cat":"b","lines":["機關辦理公開閱覽之文件，得由閱覽廠商或民眾抄寫、複印。"]},{"no":"10","label":"第十點","ch":"","cat":"b","lines":["政府採購招標文件公開閱覽作業流程如附圖。但各機關得視主辦業務","性質及機關編制情形，自行調整承辦單位及作業流程。"]},{"no":"11","label":"第十一點","ch":"","cat":"b","lines":["機關以比價方式辦理採購招標者，得準用本要點之規定辦理比價文","件之公開閱覽。"]}]},{"id":"FL051223","title":"辦理原住民族地區公共工程注意事項","short":"原住民族地區工程注意事項","date":"民國98年11月18日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL051223","articles":[{"no":"1","label":"第一點","ch":"","cat":"b","lines":["行政院公共工程委員會（以下簡稱工程會）為提升原住民族地區公共","工程品質及執行效率，特訂定本注意事項。"]},{"no":"2","label":"第二點","ch":"","cat":"b","lines":["本注意事項所稱原住民族地區，依原住民族基本法第二條第三款規定","，指原住民傳統居住，具有原住民族歷史淵源及文化特色，經中央原","住民族主管機關報請行政院核定之地區。"]},{"no":"3","label":"第三點","ch":"","cat":"b","lines":["預算編列及經費核定：","（一）中央補助機關：","1.對於原住民族地區之公共工程，依其工程困難度、特性及成本之","實際需要，個案調高原住民族地區公共工程補助經費，並應考量","原住民族地區地方機關專業人力不足，補助其委託專案管理廠商","，協助辦理工程。","2.除搶災、搶險或有時效急迫性等特殊工程外，補助機關得考量工","程技術性及複雜性等因素，提前一年補助工程規劃、設計部分之","經費。","3.補助計畫應於年度開始前完成審查，並於年度開始，預算通過後","，即予核定。","4.行政院原住民族委員會（以下簡稱原民會）：寬列「基本設施及","維持費」，以補助原住民族地區鄉（鎮、市）公所之工程維護費","用。","5.原住民族地區屬中央機關權管之公共工程，應以自行編列預算辦","理為原則，避免請地方機關代辦。","（二）工程主辦機關：","1.依政府採購法及工程經費審議相關規定，視個案情形調高工程單","價及經費，並編列合理技術服務費用，以符合原住民族地區公共","工程之特性。","2.辦理工程規劃、設計時，應依政府採購法規定，衡酌特殊個案特","性及當地市場行情予以核實編列相關預算價格，不宜泛用一般性","營建物料價格原則辦理。","3.可依機關委託技術服務廠商評選及計費辦法第四條之二規定編列","委託專案管理預算，並依政府採購法第二十二條第一項第九款規","定，公開評選委託專案管理之優勝廠商，協助機關辦理公共工程","。承辦專案管理之廠商，執行過程如發生弊端，應嚴予追究其責","任。另專案管理廠商不宜同時辦理監造業務，以避免權責不分。","（三）管理維護機關：例行性工程維護費用，中央補助額度如不足時，法","定維護機關應及早自行編列。"]},{"no":"4","label":"第四點","ch":"","cat":"b","lines":["災後復建工程經費之審議：","（一）規劃、設計階段，應依工程會所訂「原住民族災區復建工程規劃設","計注意事項」辦理規劃、設計。","（二）災後復建工程經費之提報及審議，除另有規定者外，依「中央對各","級地方政府重大天然災害救災經費處理辦法」規定辦理。","（三）機關提報經費時，應力求精確，以免造成核定經費不符實需。"]},{"no":"5","label":"第五點","ch":"","cat":"b","lines":["工程技術服務：","（一）工程主辦機關：","1.為維護技術服務廠商之設計、監造品質及避免廠商低價搶標，建","議依政府採購法第二十二條第一項第九款公開評選優勝廠商，不","宜全面採用最低價方式決標。","2.技術服務費用未達公告金額之技術服務採購，得依中央機關未達","公告金額採購招標辦法第二條第一項第三款規定，公開取得三家","以上廠商之書面報價或企劃書，並採最有利標作業手冊貳、三「","取最有利標精神擇最符合需要者」之作業程序辦理。","3.對小型或有時效急迫性之技術服務採購案，宜採合併招標或開口","契約等發包方式，以提升採購作業效率，且不得意圖規避政府採","購法之適用，而分批辦理技術服務採購。","4.如技術服務採購件數較多者，得依政府採購法第五十二條第一項","第四款採複數決標方式處理。另得於招標文件訂明依評選結果之","優勝情形，給予得標廠商不同件數或金額。","5.可依政府採購法第二十條及第二十一條規定採選擇性招標方式辦","理，預先辦理廠商資格審查，建立合格之技術服務廠商名單，並","給予經資格審查合格之技術服務廠商平等受邀參與各相關階段投","標之機會。","6.應參考工程會訂定之「公共工程技術服務契約範本」，研訂技術","服務契約，並明定技術服務廠商之主要人員資格條件。","7.對工程技術服務標價偏低決標者，應加強設計審查及督導。","（二）縣政府：","1.就所屬工程之技術服務採購案件，依前款規定辦理。","2.就全縣（含鄉、鎮、市）性質相同之小型或有時效急迫性工程技","術服務採購案，得分類後集中統籌以開口契約方式辦理招標，以","協助所轄基層機關，減輕其人力負荷。","（三）工程會：","1.不定期針對承包量異常之設計、監造技術服務廠商進行稽核或查","核，以加強控管。另將上開異常資訊公告於工程會資訊系統，提","供機關辦理技術服務廠商評選及履約管理之參考。","2.配合原民會建置原住民族文化之數位典藏系統等資料，不定期辦","理原住民族地區之技術服務廠商教育訓練。","（四）原民會：持續充實原住民族數位典藏系統內容，並協助推薦工程會","辦理原住民族文化相關訓練課程師資。"]},{"no":"6","label":"第六點","ch":"","cat":"b","lines":["工程設計：","（一）中央補助機關：","1.搶災、搶險或有時效急迫性工程應立即辦理；至於一般建設性之","工程計畫，應要求工程主辦機關給予設計者充裕時間，必要時透","過機關與當地耆老溝通及進行設計，並明定於相關補助要點內。","2.針對特殊或大型補助工程，考量補助原住民族地區地方機關外聘","專家、學者協助設計審查，或寬列工程管理費以為支應。","3.原民會：持續建置原住民族數位典藏系統，由受委託辦理公共工","程設計之廠商自行參考。","（二）工程主辦機關：","1.應於招標文件訂明，設計單位應優先參考部落耆老意見、部落原","有特色或原民會數位典藏系統等資料，納入設計，以融入當地原","住民族文化。","2.如機關內部人力或技術不足時，得外聘專家、學者協助辦理特殊","或大型補助工程之設計審查工作。","3.對災後復建工程，應依工程會所訂「原住民族災區復建工程規劃","設計注意事項」辦理設計。"]},{"no":"7","label":"第七點","ch":"","cat":"b","lines":["施工及撥款：","（一）中央補助機關：","1.調整撥款相關程序，依工作計畫進度及時撥款。","2.撥款得採下列方式辦理，但原撥款方式更有利於地方機關者，從","其規定：","（１）核定補助金額新臺幣三百萬元以上者：受補助機關於其工程預","算書經直屬縣政府審定，並依補助機關規定方式填報作業進度","後，可檢送補助金額百分之三十額度經費之領據及納入預算證","明，送補助機關請領第一期款。另於工程發包後，其工程施工","進度達百分之五十以上時，應檢送領據、納入預算證明及發包","明細表各一份，送補助機關憑撥剩餘之第二期款。","（２）核定補助金額未達新臺幣三百萬元者：於工程發包後撥付全期","補助款數額。","3.依政府採購法對原住民族地區之補助工程，辦理工程施工查核。","（二）工程主辦機關：","1.儘量依進度辦理分期付款，以提高廠商承攬意願。","2.應依工程會「公共工程施工品質管理作業要點」規定，對監造廠","商及施工廠商辦理工程督導。","3.對履約管理不良之廠商，應依契約規定處置，情節重大者應依政","府採購法第一百零一條至第一百零三條規定辦理。如技術服務廠","商所屬技師、建築師等人員有應付懲戒情事者，機關應依相關法","規報請各該主管機關處理。","（三）縣政府：","1.調整撥款相關程序，配合進度及時撥款予原住民族地區鄉（鎮、","市）公所，以利分期估驗部分款項予廠商。","2.依政府採購法對原住民族地區之公共工程，辦理工程施工查核。","（四）工程會：依政府採購法對原住民族地區之公共工程，辦理工程施工","查核。"]},{"no":"8","label":"第八點","ch":"","cat":"b","lines":["工程維護：","（一）管理維護機關：應編列維護費用，並辦理例行性之工程維護。","（二）原民會：對「基本設施及維持費」之受補助機關，辦理不定期督導","，以加強工程維護。"]},{"no":"9","label":"第九點","ch":"","cat":"b","lines":["機關工程專業人員：","（一）工程主辦機關：專業技士等人員缺額儘量透過特種考試地方政府公","務人員考試（基層特考）補實，以減低流動率。","（二）原民會：持續爭取預算，補助原住民族地區地方機關聘請工程專業","臨時人員，協助辦理「受補助工程」之督導、監造及設計審查。"]},{"no":"10","label":"第十點","ch":"","cat":"b","lines":["原住民族專業訓練及就業：","（一）工程會：協助規劃技術訓練課程。","（二）原民會：調查原住民族訓練需求，並辦理訓練及就業媒合。","（三）行政院勞工委員會職業訓練局：配合原民會辦理訓練及媒合原住民","族就業。"]},{"no":"11","label":"第十一點","ch":"","cat":"b","lines":["查核、督導、訪查及勘查：由各權責機關，透過查核、督導、訪查","及勘查等方式，督促相關機關落實本注意事項。"]}]},{"id":"GL000089","title":"機關辦理採購，得依機關辦理涉及國家安全採購之廠商資格限制條件及審查作業辦法第3條第1項第4款規定處理之情形","short":"國安採購§3Ⅰ④情形","date":"民國111年04月11日","kind":"令函釋示","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000089","articles":[{"no":"1","label":"全文","ch":"","cat":"b","lines":["行政院公共工程委員會令","發文日期：中華民國111年4月11日","發文字號：工程企字第1110100231號","依機關辦理涉及國家安全採購之廠商資格限制條件及審查作業辦法第三條","第一項第四款認定，機關辦理涉及國家安全之採購，得依採購案件之特性","及實際需要擇定「廠商代表人之犯罪紀錄」為廠商資格限制條件。本令自","即日生效。","主任委員 吳澤成",":::","行政院公共工程委員會：11010臺北市信義區松仁路3號9樓","電話總機：","02-87897500","傳真電話：02-87897800","系統版本：114.11.28","系統更新日期：115.01.06","瀏覽人數：21,648,501","回上方","$(function () {","ChangeFunUrl();","$(window).resize(function () {","ChangeFunUrl();","});","});","function ChangeFunUrl() {","//功能頁面切換：依據頁面寬度切換功能","if ($(window).width() = 0xFF01 && charCode = 0xFFE0 && charCode","$(document).ready(function () {","$(document).on(\"keydown\", function (e) {","if (e.key === \"Enter\") {","var active = document.activeElement;","console.log(\"目前焦點元素：\", active.id);","if (active && active.id === \"keyword1\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm1();","e.preventDefault(); // 阻止預設送出表單","return false;","}","if (active && active.id === \"keyword2\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm2();","e.preventDefault(); // 阻止預設送出表單","return false;","}","}","});","});"]}]},{"id":"FL045465","title":"機關辦理公共工程國際競圖注意事項","short":"國際競圖注意事項","date":"民國100年06月08日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL045465","articles":[{"no":"1","label":"第一點","ch":"","cat":"b","lines":["為增進機關辦理公共工程國際競圖（以下簡稱國際競圖）之效能，減","少採購爭議，確保採購品質，特訂定本注意事項。"]},{"no":"2","label":"第二點","ch":"","cat":"b","lines":["本注意事項所稱國際競圖，指機關辦理公共工程委託規劃設計（得包","括監造）技術服務，允許我國及外國廠商參與競圖或競標。","本注意事項所稱外國廠商，於建築工程係指非依我國法律取得建","築師資格之自然人或聘有該自然人而非依我國法律設立登記之法人或","機構；於其他公共工程係指非依我國法律設立登記得從事工程技術專","業或顧問業之法人或機構。"]},{"no":"3","label":"第三點","ch":"","cat":"b","lines":["機關辦理國際競圖，應先評估下列事項：","（一）機關、代辦機關或委辦之專案管理廠商具有辦理國際競圖之能力，","並瞭解工程之國際及國內實務慣例。","（二）用地取得無虞。","（三）工程預算無虞。如涉其他機關補助，應先取得補助機關之書面同意","。"]},{"no":"4","label":"第四點","ch":"","cat":"b","lines":["(刪除)"]},{"no":"5","label":"第五點","ch":"","cat":"b","lines":["機關辦理國際競圖，應成立專案小組，統籌審查、協調、履約管理等","事項，並負責溝通，釐清不同主管部門之審核意見與審議事宜。","前項小組成員應包含主辦機關、協辦機關、未來可能之使用及接","管單位人員，並由機關首長或其指定之一級主管以上人員擔任召集人","。"]},{"no":"6","label":"第六點","ch":"","cat":"b","lines":["機關辦理國際競圖，得採一階段或二階段方式。","採二階段方式辦理者，第一階段評選以規劃構想與專業技術應用","之原則內容為限，第二階段評選包括具體之實質設計內容。"]},{"no":"7","label":"第七點","ch":"","cat":"b","lines":["機關採一階段方式辦理國際競圖者，得於招標文件內訂明廠商投標方","式如下：","（一）我國廠商單獨或共同投標。","（二）外國廠商與我國廠商共同投標；外國廠商依我國法令取得許可者，","得在許可範圍內單獨投標。"]},{"no":"8","label":"第八點","ch":"","cat":"b","lines":["機關採二階段方式辦理國際競圖者，得於招標文件訂明辦理方式如下","：","（一）第一階段評選允許廠商暫不檢附共同投標協議書，並以下列方式之","一投標：","1.我國廠商單獨或共同投標。","2.外國廠商單獨或共同投標。","3.外國廠商與我國廠商共同投標。","（二）第二階段評選以下列方式之一投標，其採共同投標而未於第一階段","檢附共同投標協議書者，應於本階段檢附：","1.通過第一階段審查之下列廠商，以原名義投標：","（1）我國廠商。","（2）包含我國廠商之共同投標廠商。","（3）依我國法令取得許可，得在許可範圍營業之外國廠商。","2.通過第一階段審查之廠商為未依我國法令取得許可之外國廠商者","，與我國廠商共同投標。","第一階段未入選廠商，得為其他入選者於第二階段之共同投標廠","商或分包廠商。"]},{"no":"9","label":"第九點","ch":"","cat":"b","lines":["機關辦理國際競圖，其採購評選委員會委員之遴選，補充原則如下：","（一）聘請國外專家學者參與評選，相關費用依行政院訂頒「各機關聘請","國外顧問、專家及學者來台工作期間支付費用最高標準表」給付。","（二）聘請國外專家學者人數不逾評選委員總額之二分之一。","（三）評選委員名單得於徵得全體委員同意後載明於招標文件。"]},{"no":"10","label":"第十點","ch":"","cat":"b","lines":["規劃設計監造服務費用，得依「機關委託技術服務廠商評選及計費辦","法」第二十九條第一項規定簽報上級機關核定，並得依該辦法第二十","四條第一款規定，採固定服務費用或費率決標，不再議減。"]},{"no":"11","label":"第十一點","ch":"","cat":"b","lines":["（刪除）"]},{"no":"12","label":"第十二點","ch":"","cat":"b","lines":["（刪除）"]},{"no":"13","label":"第十三點","ch":"","cat":"b","lines":["國際競圖廠商之服務建議書，其圖說文字、簡報文件得以中文或英","文為之；以英文為之者，應備中文譯本，其與英文文意不符者，以","中文為準。","廠商簡報，應自備翻譯人員。","機關應備翻譯人員，協助評選委員辦理評選。","廠商簡報時間應考量翻譯所需時間。"]},{"no":"14","label":"第十四點","ch":"","cat":"b","lines":["機關對於廠商提送之服務建議書或資料，應重視智慧財產權，未經","廠商同意，不得抄襲使用。","機關對領取獎勵金之未獲選廠商，不得要求將其智慧財產權讓","與機關。"]},{"no":"15","label":"第十五點","ch":"","cat":"b","lines":["機關辦理國際競圖，其履約管理補充原則如下：","（一）履約階段成立審查委員會，辦理國際競圖之設計成果審查作業。","（二）得標廠商履約，如涉及不同機關之法定審查會議，例如環境影響","評估、水土保持計畫送審、結構外審、都市設計審議、建築技術","規則所定之性能設計送審作業等，機關須提供必要之協助。","（三）監造單位品管人員須由國外專業人士擔任者，得依「公共工程施","工品質管理作業要點」第十點第一項但書辦理。"]}]},{"id":"GL000096","title":"依投標廠商資格與特殊或巨額採購認定標準第7條第5款規定認定專案管理勞務採購為特殊採購","short":"專案管理屬特殊採購","date":"民國114年03月14日","kind":"令函釋示","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000096","articles":[{"no":"1","label":"全文","ch":"","cat":"b","lines":["行政院公共工程委員會令","發文日期：中華民國114年3月14日","發文字號：工程企字第1140100117號","依投標廠商資格與特殊或巨額採購認定標準第七條第五款規定認定專案管","理勞務採購為特殊採購；本令自即日生效。","主任委員　陳金德",":::","行政院公共工程委員會：11010臺北市信義區松仁路3號9樓","電話總機：","02-87897500","傳真電話：02-87897800","系統版本：114.11.28","系統更新日期：115.01.06","瀏覽人數：21,648,500","回上方","$(function () {","ChangeFunUrl();","$(window).resize(function () {","ChangeFunUrl();","});","});","function ChangeFunUrl() {","//功能頁面切換：依據頁面寬度切換功能","if ($(window).width() = 0xFF01 && charCode = 0xFFE0 && charCode","$(document).ready(function () {","$(document).on(\"keydown\", function (e) {","if (e.key === \"Enter\") {","var active = document.activeElement;","console.log(\"目前焦點元素：\", active.id);","if (active && active.id === \"keyword1\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm1();","e.preventDefault(); // 阻止預設送出表單","return false;","}","if (active && active.id === \"keyword2\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm2();","e.preventDefault(); // 阻止預設送出表單","return false;","}","}","});","});"]}]},{"id":"FL039843","title":"機關辦理工程保險採購注意事項","short":"工程保險注意事項","date":"民國92年01月28日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL039843","articles":[{"no":"1","label":"第一點","ch":"","cat":"b","lines":["機關辦理工程採購，其由機關自行投保可獲得對機關較有利之承保範","圍、保險費、保險條件、理賠服務等情形者，得將該工程之保險另案","辦理採購。","前項工程保險採購，其屬一定期間、性質相近或同一專案計畫內","之二以上工程者，得合併辦理招標，並得採複數決標。"]},{"no":"2","label":"第二點","ch":"","cat":"b","lines":["機關辦理工程保險採購，應依政府採購法（以下簡稱本法）施行細則","第六條規定認定採購金額，並依本法第十八條至第二十三條規定，擇","適當方式辦理招標。"]},{"no":"3","label":"第三點","ch":"","cat":"b","lines":["工程保險採購屬勞務採購；機關得視個案特性及實際需要，依本法第","三十條第一項第一款規定免收押標金或保證金或兩者均免。"]},{"no":"4","label":"第四點","ch":"","cat":"b","lines":["機關辦理工程保險採購，得依工程實際需要，就下列事項載明於招標","文件：","（一）工程內容：如工程概要、預估工期、預估工程金額、工程圖說、工","程招標文件草案、工程契約文件草案等。","（二）保險種類及承保範圍：以財政部核准之營造／安裝工程綜合保險單","基本條款及特約／附加條款為原則。","（三）保險標的：如工程採購之工程本體、機關提供之施工機具設備，及","對第三人之賠償責任等。","（四）被保險人：以機關、工程承攬廠商、工程契約全部分包廠商等為共","同被保險人。","（五）保險金額：得包括工程契約金額、機關供給材料費用等完成該工程","所需之總工程費或其預估金額，並得加保拆除清理費用、機關提供","之施工機具設備等。","（六）第三人意外責任險：載明每一個人及每一事故體傷或死亡之保險金","額，每一事故財物損害之保險金額及保險期間最高累積責任。","（七）自負額：得為一定金額或每次事故損失金額之一定比例附列最高自","負額及最低自負額。","（八）保險期間：得為自工程開工或開始履約之日起至預定驗收合格之日","止之一定期間。","（九）受益人：機關。","（十）其他附加保險：得包括鄰屋龜裂、倒塌責任險、鄰近財物險、規劃","設計專業責任險等。","（十一）保險單及批單之開立時機：得規定得標之保險公司應於決標後一","定期間內依決標條件出具保險單，並俟各工程採購決標後，依機","關通知之工程決標金額及開工或開始履約日期，出具各該工程之","正式起保批單。","（十二）機關於投保之工程決標後提供保險公司之資料：如工程契約、與","保險內容有關之工程契約變更文件或保險公司核保所需之其他資","料。","（十三）得標之保險公司逾期未開立保險單或正式起保批單之罰則。","（十四）保險費之給付方式：如一次給付、分期給付或按工程決標情形給","付等。","（十五）保險費之結算方式：得規定以工程結算金額作為實際保險金額，","依決標費率結算保險費，並得包括工程提前完工縮短保險期間之","折減方式。","（十六）工程發生工期展延之處理：得規定保險公司應就未完工部分所需","展延日期展延保險期間，及其保險費之計算。","（十七）工程發生增減契約價金之處理：得規定依決標費率增減保險費。","（十八）驗收方式：得規定以保險單及批單之簽發情形、申請理賠事項之","賠付情形等為驗收查驗項目。","（十九）保險契約於保險期間內未經機關同意之任何變更或終止，無效。","（二十）爭議處理：如依本法第八十五條之一規定向採購申訴審議委員會","申請調解，或經兩造協議提付仲裁等。","（二十一）其他必要事項。","前項第七款自負額，應考量工程性質、被保險人自行承受損失能","力及保險市場行情合理訂定之。","機關將二以上工程保險合併辦理採購者，應於招標文件分別載明","各工程概要內容及保險事項。但其內容相同者，不在此限。"]},{"no":"5","label":"第五點","ch":"","cat":"b","lines":["機關辦理工程保險採購，其保險內容特殊，須經保險公司報財政部核","准出單者，等標期應考量核准出單所需正常作業時間。"]},{"no":"6","label":"第六點","ch":"","cat":"b","lines":["機關辦理工程保險採購，得採最有利標，或依機關委託專業服務廠商","評選及計費辦法之規定，以公開評選方式擇優勝廠商採限制性招標；","未達公告金額者，得依本法第四十九條規定公開取得書面報價或企劃","書，參考最有利標精神，擇符合需要者議價。"]},{"no":"7","label":"第七點","ch":"","cat":"b","lines":["機關依前點方式辦理者，得就保險條件、保險費等事項擇列為評選（","審）項目，由投標保險公司提出方案供評選（審）。"]},{"no":"8","label":"第八點","ch":"","cat":"b","lines":["機關辦理工程採購，其自行採購工程保險者，應於工程採購之招標文","件載明下列事項：","（一）由機關自行辦理工程保險之事項。","（二）工程承攬廠商應投保之事項。","（三）遇有損失發生時，工程承攬廠商配合申請理賠之應辦事項，包括會","同辦理會勘以鑑定損失範圍、提供保險公司要求之理賠資料及文書","證件等。","（四）因可歸責於工程承攬廠商之事由，致增加機關工程保險費者，應由","工程承攬廠商負擔。","（五）工程承攬廠商履行契約所應自行負擔之風險，應不受工程保險已由","機關投保之影響。","（六）因可歸責於工程承攬廠商之事由，致發生機關須負擔工程保險之自","負額、承保範圍以外之損失、因保險標的發生毀損或滅失時為恢復","原保險金額所需加繳之保險費，概由工程承攬廠商負擔。","（七）機關就保險公司給付之賠償金，得於獲得賠償後，依修復進度核計","費用轉發予工程承攬廠商。其轉發之金額以保險公司給付之賠償金","額為限，並得扣除屬機關供給材料或提供施工機具、設備部分等之","理賠金額。","（八）工程以統包方式辦理者，工程承攬廠商應就自行辦理設計部分投保","專業責任險。"]},{"no":"9","label":"第九點","ch":"","cat":"b","lines":["機關對於保險公司出具之保險單及批單，應查證其真偽。"]},{"no":"10","label":"第十點","ch":"","cat":"b","lines":["機關辦理財物或勞務保險之採購，得準用本注意事項規定。"]}]},{"id":"FL000719","title":"機關辦理採購之廠商家數規定一覽表","short":"廠商家數一覽表","date":"民國91年07月24日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL000719","articles":[{"no":"1","label":"全文","ch":"","cat":"b","lines":["\n┌──┬────────────┬──────────────┐\n│項次│情形                    │家數規定                    │\n├──┼────────────┼──────────────┤\n│一  │以公開招標方式辦理第一次│政府採購法 (以下簡稱本法) 第│\n│    │開標。                  │四十八條第一項規定有三家以上│\n│    │                        │合格廠商投標，即應開標決標。│\n│    │                        │所稱三家以上合格廠商投標之定│\n│    │                        │義，詳本法施行細則第五十五條│\n│    │                        │。                          │\n├──┼────────────┼──────────────┤\n│二  │以公開招標方式辦理第二次│得不受本法第四十八條第一項三│\n│    │開標。                  │家廠商之限制，由招標機關決定│\n│    │                        │。                          │\n├──┼────────────┼──────────────┤\n│三  │以公開招標方式辦理第三次│無。不論金額大小均得開標。  │\n│    │以後開標。              │                            │\n├──┼────────────┼──────────────┤\n│四  │公開招標，開標後合於招標│如無本法第四十八條第一項各款│\n│    │文件規定之廠商未達三家。│情形之一，而合於招標文件規定│\n│    │                        │之廠商有低於底價或評審委員會│\n│    │                        │建議金額或可評定最有利標者，│\n│    │                        │應即決標。                  │\n├──┼────────────┼──────────────┤\n│五  │公開招標及選擇性招標之分│第二階段以後之投標及開標，無│\n│    │段投標或分段開標。      │廠商家數限制。              │\n├──┼────────────┼──────────────┤\n│六  │公開招標及選擇性招標廢標│準用本法第四十八條第二項關於│\n│    │後依原招標文件重行辦理開│第二次招標之規定。          │\n│    │標。                    │                            │\n├──┼────────────┼──────────────┤\n│七  │以選擇性招標方式為特定個│無。僅一家廠商提出資格文件亦│\n│    │案辦理之資格標。        │得開標。資格審查後，應邀請所│\n│    │                        │有符合資格之廠商投標。      │\n├──┼────────────┼──────────────┤\n│八  │依本法第二十條第二款至第│無。僅一家廠商提出資格文件亦│\n│    │五款辦理選擇性招標，為建│得辦理。                    │\n│    │立合格廠商名單辦理資格審│                            │\n│    │查。                    │                            │\n├──┼────────────┼──────────────┤\n│九  │依本法第二十條第一款辦理│有。須六家以上廠商提出資格文│\n│    │選擇性招標，為建立合格廠│件方得辦理。資格合格廠商未達│\n│    │商名單辦理資格審查。    │六家時，不得建立名單。名單建│\n│    │                        │立後依本法施行細則第二十一條│\n│    │                        │第二項之規定辦理採購。      │\n├──┼────────────┼──────────────┤\n│一○│限制性招標之比價。      │邀請二家以上廠商比價，僅一家│\n│    │                        │廠商投標，得當場改為議價辦理│\n│    │                        │ (本法施行細則第十九條) 。  │\n├──┼────────────┼──────────────┤\n│一一│本法第二十二條第一項第九│無。僅一家廠商應徵，亦得辦理│\n│    │款至第十一款之應徵廠商。│。                          │\n├──┼────────────┼──────────────┤\n│一二│未達公告金額採購之「公開│1 三家以上廠商之書面報價或企│\n│    │取得報價或企劃書」。    │  劃書。第一次公開徵求結果僅│\n│    │                        │  取得一家或二家廠商之書面報│\n│    │                        │  價或企劃書，而欲改以比價或│\n│    │                        │  議價方式辦理者，依「中央機│\n│    │                        │  關未達公告金額採購招標辦法│\n│    │                        │  」第三條之規定，經機關首長│\n│    │                        │  或其授權人員核准，得改以比│\n│    │                        │  價或議價方式辦理。其辦理第│\n│    │                        │  二次公開徵求者，得不受三家│\n│    │                        │  廠商之限制。              │\n│    │                        │2 提出書面報價或企劃書之廠商│\n│    │                        │  家數為數甚多時，得擇價格較│\n│    │                        │  低且符合需要之二家以上廠商│\n│    │                        │  比價，或擇符合需要之最低價│\n│    │                        │  廠商議價。未能完成議價時，│\n│    │                        │  得依標價次序，由價格較低者│\n│    │                        │  起，依序洽其他符合需要者議│\n│    │                        │  價。                      │\n└──┴────────────┴──────────────┘"],"mono":true}]},{"id":"GL000050","title":"押標金/保證金連帶保證書格式；押標金/保證金不可撤銷擔保信用狀格式；押標金/保證金不可撤銷擔保信用狀付款申請書；押標金擔保信用狀格式；押標金連帶保證保險單條款","short":"押標金保證金格式","date":"民國108年05月30日","kind":"令函釋示","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000050","articles":[{"no":"1","label":"全文","ch":"","cat":"b","lines":["行政院公共工程委員會令","發文日期：中華民國108年5月30日","發文字號：工程企字第1080100424號","修正「押標金／保證金連帶保證書格式」、「押標金／保證金不可撤銷擔","保信用狀格式」、「押標金／保證金不可撤銷擔保信用狀付款申請","書」、「押標金擔保信用狀格式」及「押標金連帶保證保險單條款","」，並自即日生效。","附修正「押標金／保證金連帶保證書格式」、「押標金／保證金不可撤","銷擔保信用狀格式」、「押標金／保證金不可撤銷擔保信用狀付款","申請書」、「押標金擔保信用狀格式」及「押標金連帶保證保險單","條款」","主任委員 吳澤成",":::","行政院公共工程委員會：11010臺北市信義區松仁路3號9樓","電話總機：","02-87897500","傳真電話：02-87897800","系統版本：114.11.28","系統更新日期：115.01.06","瀏覽人數：21,648,503","回上方","$(function () {","ChangeFunUrl();","$(window).resize(function () {","ChangeFunUrl();","});","});","function ChangeFunUrl() {","//功能頁面切換：依據頁面寬度切換功能","if ($(window).width() = 0xFF01 && charCode = 0xFFE0 && charCode","$(document).ready(function () {","$(document).on(\"keydown\", function (e) {","if (e.key === \"Enter\") {","var active = document.activeElement;","console.log(\"目前焦點元素：\", active.id);","if (active && active.id === \"keyword1\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm1();","e.preventDefault(); // 阻止預設送出表單","return false;","}","if (active && active.id === \"keyword2\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm2();","e.preventDefault(); // 阻止預設送出表單","return false;","}","}","});","});"]}]},{"id":"FL003755","title":"水管、電氣與建築工程合併或分開招標原則","short":"水電建築合併招標原則","date":"民國88年12月29日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL003755","articles":[{"no":"1","label":"全文","ch":"","cat":"b","lines":["機關應依下列原則辦理水管、電氣與建築工程之招標：","一、水管及電氣工程所占預算金額預估達查核金額以上者，分開辦理招標","。","二、水管及電氣工程所占預算金額預估達查核金額十分之一以上，且占其","全部工程總預算金額預估達百分之十五以上者，得允許共同投標或分","開辦理招標。","三、採預鑄工法之工程，得合併辦理招標。","四、情況特殊，分開辦理招標於施工配合顯有困難者，得報經上級機關核","准後合併辦理招標。","五、機關以分開辦理招標者，應注意界面整合問題，並於契約中明定廠商","施工配合之責任。"]}]},{"id":"FL048760","title":"機關洽請代辦工程採購執行要點","short":"洽請代辦執行要點","date":"民國98年04月22日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL048760","articles":[{"no":"1","label":"第一點","ch":"","cat":"b","lines":["為建立政府採購法（以下簡稱本法）第四十條代辦採購機制，協助非","工程專業機關辦理工程採購，以提升公共工程進度及品質，特訂定本","要點。"]},{"no":"2","label":"第二點","ch":"","cat":"b","lines":["依本法第四十條規定，機關之採購，得洽由其他具有專業能力之機關","代辦。上級機關對於未具有專業採購能力之機關，得命其洽由其他具","有專業能力之機關代辦採購。"]},{"no":"3","label":"第三點","ch":"","cat":"b","lines":["行政院所屬一級機關、直轄市及縣（市）政府應就本機關及所屬（轄","）機關所辦理之工程採購，善盡監督及協調之責。"]},{"no":"4","label":"第四點","ch":"","cat":"b","lines":["未具工程採購專業能力或人力之機關，得徵求其他無隸屬關係，但具","有工程專業能力之機關同意後代辦採購。"]},{"no":"5","label":"第五點","ch":"","cat":"b","lines":["直轄市及縣（市）政府得應中央機關之請求代辦採購，中央機關亦得","應直轄市及縣（市）政府之請求代辦採購。"]},{"no":"6","label":"第六點","ch":"","cat":"b","lines":["洽辦機關得就下列階段之採購事項，全程或分階段洽請代辦機關代辦","：","（一）規劃與可行性評估階段。","（二）工程設計階段。","（三）工程招標階段。","（四）工程施工階段。","代辦機關應盡善良管理人之注意義務，發揮專業技術協助洽辦機","關徵選合宜之履約廠商，並配合洽辦機關各項服務項目計畫期程，代","辦工程採購。"]},{"no":"7","label":"第七點","ch":"","cat":"b","lines":["代辦機關得應洽辦機關之請求，代辦採購事項如下：","（一）審查招標文件中之招標、決標程序及契約條款。","（二）辦理招標文件於公告前之公開閱覽。","（三）辦理採購公告。","（四）處理廠商領標及投標。","（五）底價審議及核定底價或提供不訂底價之建議金額。","（六）辦理開標、審標、評選、比價、議價、決標。","（七）依洽辦機關之請求，辦理訂約、履約管理及驗收。","（八）其他依本法施行細則第四十二條規定，與洽辦機關協議代辦之採購","事項。"]},{"no":"8","label":"第八點","ch":"","cat":"b","lines":["洽辦機關編列工程代辦預算，應注意下列事項：","（一）先期規劃費（可行性研究），機關應先行編列預算或籌措經費支用","，其屬具急迫性之計畫，應先循預算程序檢討支應。","（二）概算經費送審，應至遲於第一年度之預算籌編先期會審會議開始三","個月（即三月底）前，提送相關圖說送行政院審議。","（三）代辦機關應依各項作業預估期程，製作分年分月之分配預算，送請","洽辦機關配合辦理；必要時代辦機關應檢討修正要徑作業，送洽辦","機關修正預算分配數。","（四）工程契約訂有有價值之營建廢棄物可抵扣工程款或預付款者，於預","算分配時，應配合工程進度，於抵扣完成後，作合理分配。"]},{"no":"9","label":"第九點","ch":"","cat":"b","lines":["洽辦機關與代辦機關所簽訂之代辦協議書，應載明下列事項：","（一）工程名稱。","（二）工程地點。","（三）代辦範圍（包含各服務項目）。","（四）代辦期程。","（五）代辦服務費用。","（六）代辦費用之撥付（包含代辦費、設計費、工程費）。","（七）洽辦、代辦機關權責劃分。","（八）代辦機關指派之人力及其任務。","（九）終止洽辦事項。","（十）附則。","（十一）協議書份數。","（十二）附件（含費用撥付一覽表、權責劃分表、各階段辦理時程管控表","、管控里程碑）。","洽辦機關與代辦機關間之權責，除依簽訂之代辦協議書辦理外，","其履約權責劃分事項，得參採附表訂定之。","圖表附件：附件：專業採購機關代辦工程採購之權責劃分及辦理時程表.pdf附件：專業採購機關代辦工程採購之權責劃分及辦理時程表.XLS"]},{"no":"10","label":"第十點","ch":"","cat":"b","lines":["前點第一項第四款代辦期程，應遵照核定之施政計畫期限，訂定計畫","各階段重要工作項目及其「里程碑」，以為管控基準，全程掌握執行","動態，及時排除困難，以提升執行效率。各階段重要工作項目如下：","（一）先期作業階段重要工作項目，包括：可行性研究、綜合（整體）規","劃、環境影響評估、選擇（替代）方案之成本效益方案。","（二）預算編列階段重要工作項目，包括：預算編列、審查、陳報主計處","、立法院通過預算。","（三）前置作業階段重要工作項目，包括：用地取得、水土保持計畫審查","、都市計畫審議、施工階段環境保護執行計畫、請領建照、管線拆","遷及基本設計、細部設計及發包策略等。","（四）工程執行階段重要工作項目，包括：公告、決標、開工、施工階段","重要里程碑（可依交通、水利、建築等工程性質再細分為分段查驗","、分段通車、施作長度、施作面積、基礎完成、結構體完成及裝修","完成等）、竣工、驗收及接管等。"]},{"no":"11","label":"第十一點","ch":"","cat":"b","lines":["代辦機關代辦採購所需服務費用，由洽辦機關及代辦機關協議之。"]},{"no":"12","label":"第十二點","ch":"","cat":"b","lines":["代辦機關如有代辦人力不足者，得依規定進用有經驗之約聘僱人員","，並輔以在職訓練。"]},{"no":"13","label":"第十三點","ch":"","cat":"b","lines":["洽辦機關及代辦機關得視代辦工程採購之執行績效，對於代辦相關","人員，予以適當之獎勵。"]},{"no":"14","label":"第十四點","ch":"","cat":"b","lines":["未具工程採購專業能力或人力之機關，如未能適時覓得代辦機關者","，應及早因應，例如依規定進用有經驗之約聘僱人員，或依本法第","三十九條委託廠商專案管理或洽請代辦機關代辦專案管理，並參考","行政院公共工程委員會訂頒之「公共工程專案管理契約範本」辦理","。"]},{"no":"15","label":"第十五點","ch":"","cat":"b","lines":["依促進民間參與公共建設法辦理之促進民間參與公共建設計畫，按","該法第二十九條由政府投資建設之一部，機關依該法施行細則第三","十三條第一項第一款，由機關興建後交由民間機構經營或使用者，","其工程之興建應依本法辦理，並適用本要點之規定。"]},{"no":"16","label":"第十六點","ch":"","cat":"b","lines":["本要點未盡事宜，依本法及行政院公共工程委員會訂頒之相關作業","規定及範本辦理。"]}]},{"id":"FL005555","title":"特殊軍事採購適用範圍及處理辦法","short":"特殊軍事採購辦法","date":"民國93年09月08日","kind":"子法","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL005555","articles":[{"no":"1","label":"第1條","ch":"","cat":"b","lines":["本辦法依政府採購法 (以下簡稱本法) 第一百零四條第二項規定訂定之。"]},{"no":"2","label":"第2條","ch":"","cat":"b","lines":["本法第一百零四條第一項但書所稱武器，指機關槍、衝鋒槍、卡柄槍、步","槍、自動步槍、手槍、光學與化學武器、飛彈系統、戰車、砲車、裝甲車","系統、步兵多人操作武器系統、電子作戰系統、艦艇、水下武器系統、潛","艦、航空或相關武器系統、高性能偵照系統、衛星系統、自動化武器系統","及其他可發射金屬、子彈或火焰且具有殺傷力之各式槍砲。","本法第一百零四條第一項但書所稱彈藥，指前項武器所使用之各類型彈藥","及其他具有殺傷力或破壞性之各類炸彈或爆裂物。","本法第一百零四條第一項但書所稱作戰物資，指雷達、通訊器材、資訊設","備及相關軟體、化學品、陸上、海上或空中之運輸及輸送工具、燃料及潤","滑劑、糧秣、被服、裝載夾具、陣營具、醫療器材及藥品、淨水設備、地","圖影像、照片、模型儀器及文書圖表、建築工程與材料、製造或使用武器","、彈藥或作戰物資所需之材料或設備及其他足以影響戰備之物資。","本法第一百零四條第一項但書所稱與國家安全或國防目的有關之採購，指","為抵禦或防範外來之侵略、情報活動、顛覆或破壞等行為，必須辦理之採","購。"]},{"no":"3","label":"第3條","ch":"","cat":"b","lines":["本法第一百零四條第一項第一款所稱國家面臨戰爭、戰備動員或發生戰爭","，指國家遭遇明顯武力威脅、封鎖或敵國已有具體攻擊行動，國防部依戰","備規定發布應急戰備或依實際需要動員後備部隊者。","本法第一百零四條第一項第二款所稱機密或極機密，指依國家機密保護法","或軍事機密與國防秘密種類範圍等級劃分準則列為機密、極機密或絕對機","密等級者。","本法第一百零四條第一項第三款所稱時效緊急，有危及重大戰備任務之虞","者，指在經常戰備期間，因武器、彈藥或作戰物資臨時偶發事件，致經常","戰備有所缺失，不立即採購有影響應急戰備任務之虞者。"]},{"no":"4","label":"第4條","ch":"","cat":"b","lines":["軍事機關辦理本法第一百零四條第一項第一款之採購，而不適用本法規定","時，由國防部發布命令，並副知主管機關；其命令應記載不適用之條文，","未記載者，仍應適用本法之規定。"]},{"no":"5","label":"第5條","ch":"","cat":"b","lines":["軍事機關辦理前條採購，應符合下列規定：","一、辦理採購前，應經機關首長或其授權人員核准確有依前條命令辦理採","購之必要。","二、以限制性招標方式辦理者，除獨家製造、供應或承做者外，以邀請二","家以上廠商比價為原則。","三、不及與廠商簽訂契約者，應先有書面、電報或傳真協議。","四、不及與廠商確定契約總價者，應先確定單價及契約總價上限。","五、付款條件應能維護公款支用之安全性。","六、作業文件應加註「政府採購法第一百零四條第一項第一款戰爭採購」","字樣。","七、依本法第六十二條彙送之決標資料，應敘明係屬本法第一百零四條第","一項第一款辦理之採購。"]},{"no":"6","label":"第6條","ch":"","cat":"b","lines":["軍事機關辦理本法第一百零四條第一項第二款之採購，應符合下列規定：","一、查核金額以上之採購，應報經國防部核准。","二、應邀請所有經資格審查合格之廠商投標。","三、參與投標廠商均須簽具保密切結書，得標商須簽具保密合約。","四、秘密開標。","五、作業文件應加註「政府採購法第一百零四條第一項第二款秘密採購」","字樣，各級作業單位應實施全程保密，並訂定解密條件或日期。","六、依本法第六十二條彙送之決標資料，應敘明係屬本法第一百零四條第","一項第二款辦理之採購。"]},{"no":"7","label":"第7條","ch":"","cat":"b","lines":["軍事機關辦理本法第一百零四條第一項第三款之採購，應符合下列規定：","一、查核金額以上之採購，應報經國防部或其授權機關核准。","二、招標規格、廠商資格、等標期或辦理資格審查之期限，得依採購案件","之特性及實際需要訂定之。","三、作業文件應加註「政府採購法第一百零四條第一項第三款緊急採購」","字樣。"]},{"no":"8","label":"第8條","ch":"","cat":"b","lines":["軍事機關之採購兼有本法第一百零四條第一項二款以上情形者，應一併適","用本辦法相關之規定。"]},{"no":"9","label":"第9條","ch":"","cat":"b","lines":["本辦法自中華民國八十八年五月二十七日施行。","本辦法修正條文自發布日施行。"]}]},{"id":"FL039308","title":"統包作業須知","short":"統包作業須知","date":"民國103年10月24日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL039308","articles":[{"no":"1","label":"第一點","ch":"","cat":"b","lines":["行政院公共工程委員會（以下簡稱本會）為確保各機關基於效率及品","質之要求，執行政府採購法（以下簡稱本法）第二十四條及其所定統","包實施辦法（以下簡稱本辦法）之規定，特訂定本須知。"]},{"no":"2","label":"第二點","ch":"","cat":"b","lines":["機關以統包方式辦理採購前，應考量機關之人力與能力是否足以勝任","統包案之審查及管理工作。其不足以勝任者，應及早委託專案管理，","避免衍生時程延宕、審查不周、廠商減省工料、設計不當、施工品質","不佳等缺失。"]},{"no":"3","label":"第三點","ch":"","cat":"b","lines":["下列工程之新建、增建、改建、修建，得採統包方式辦理：","（一）建築物工程，例如「機關委託技術服務廠商評選及計費辦法」附表","一所列建築物工程，含其室內裝修。","（二）建築物以外之公共工程，例如道路、橋梁、水利設施、港灣、隧道","工程。","（三）設備工程，例如機械系統、號誌系統、昇降設備、冷凍空調、節能","績效工程。","（四）其他基於效率及品質之要求所辦理之工程。"]},{"no":"4","label":"第四點","ch":"","cat":"b","lines":["機關以統包辦理招標者，應撰寫機關需求書，作為招標之依據，並將","本辦法第六條規定內容，及細部設計審查事項、權責與所需時程，載","明於需求書中，列為招標文件之一；其決標原則，依個案特性採最有","利標，或依本法施行細則第六十四條之二規定辦理，並於招標文件規","定投標廠商服務建議書撰寫內容，納入評選或評分項目，落實審查。"]},{"no":"5","label":"第五點","ch":"","cat":"b","lines":["統包案完成後如需維護管理者，其設計應包含未來維護管理計畫，並","依廠商履約結果作適當修正，移交維護管理單位。"]},{"no":"6","label":"第六點","ch":"","cat":"b","lines":["機關訂定統包契約條款時，應包括下列事項：","（一）本辦法第六條至第九條規定。","（二）為完成履約標的所必須具備之工程或財物，只要符合原統包目的及","範圍，廠商應負責設計、施工、供應或安裝，不得要求增加契約價","金或補償。","（三）各細項工作之里程碑及工期計算方式、廠商資料送審期限及機關審","查作業所需時間（不包括可歸責於廠商之退件複審時間）、設計疏","失之處理措施與罰則、逾期之處理及違約金計算方式。","（四）廠商於投標時製作之價格詳細表及後續減價資料，經機關決標後為","契約文件之一；其項目及數量於決標後之細部設計與服務建議書有","差異時，除有逾越統包範疇而辦理契約變更情形者外，不得據以增","加契約價金。","（五）實際施作或供應之項目與契約所附詳細表有減少者，其金額不予給","付。但可證明移作其他變更項目之用者，不在此限。","（六）統包採購契約所附詳細表所列項目及數量係由廠商自行提列，其結","算，不適用一般工程慣用之「個別項目實作數量較契約所定數量增","減達一定比率以上時，其逾一定比率之部分，得以變更設計增減契","約價金」方式。實作數量之減少，以有正當理由者始得為之。","（七）廠商提出之品質計畫應包括設計品質計畫書，其內容至少應包括工","程內容及預算、預定設計進度及時程管控點、技術規範、組織與權","責、審查機制（審查人員之資格、經驗、審核時機、審核項目）、","設計圖說文件修正、矯正與預防措施、文件紀錄管理。"]},{"no":"7","label":"第七點","ch":"","cat":"b","lines":["機關如將營運或代操作事項納入統包範圍，其涉及經營權利金額度者","，應經財務分析，妥為訂定，並注意廠商營業支出項目是否合理，善","盡監督管理職責。","為使統包廠商履行長期可靠度與保固責任，機關得於招標文件載","明長期營運或代操作之期間、績效目標、契約價金、收費基準等條款","。"]},{"no":"8","label":"第八點","ch":"","cat":"b","lines":["採用最有利標決標之統包案件，應依本法第五十六條、「最有利標評","選辦法」規定辦理，妥善利用協商程序，並確定廠商價格合理，無浪","費公帑情形，方得決定最有利標。","招標文件所規定之評審標準，應包括廠商之技術能力、設計與計","畫之完整性及可行性、標價之合理性、完整性及正確性。"]},{"no":"9","label":"第九點","ch":"","cat":"b","lines":["機關應視統包案件之規模、複雜程度及性質，考量廠商準備投標文件","所需時間，合理訂定等標期，不宜逕以本會訂頒招標期限標準規定之","下限期限定之。"]},{"no":"10","label":"第十點","ch":"","cat":"b","lines":["機關或專案管理廠商應落實履約階段之設計審查作業，避免發生廠商","圖說過於簡略、缺漏，而機關仍接受其圖說並同意施工之情形。","主辦機關、監造單位與專案管理廠商之權責劃分，請參考本會訂","頒「統包模式之工程進度及品質管理參考手冊」第二章內容及「公共","工程履約權責劃分及管理應注意事項」附表一辦理。"]},{"no":"11","label":"第十一點","ch":"","cat":"b","lines":["機關對於統包得標廠商，應督促其切實履行契約，不得任意變更。"]},{"no":"12","label":"第十二點","ch":"","cat":"b","lines":["機關辦理統包工程，如有廠商規劃、設計錯誤、監造不實或管理不","善情形，除依本法第六十三條第二項規定追償機關遭受之損害外，","其屬承辦技師或建築師之責任者，機關應依各該專門職業及技術人","員法規，提報各該人員主管機關予以懲戒。"]}]},{"id":"GL000079","title":"機關辦理採購得依投標廠商資格與特殊或巨額採購認定標準第4條第1項第6款規定處理之情形","short":"資格標準§4Ⅰ⑥處理情形","date":"民國109年04月29日","kind":"令函釋示","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000079","articles":[{"no":"1","label":"全文","ch":"","cat":"b","lines":["行政院公共工程委員會令","發文日期：中華民國109年4月29日","發文字號：工程企字第1090100288號","基於廠商違法或違約行為，經機關依政府採購法第一百零一條第一項規定","通知後，於程序進行中，尚未依第一百零二條第三項規定刊登政府採購公","報之廠商，該廠商之履約能力已有疑義，為避免該廠商利用此空窗期繼續","參與該機關之採購，爰依投標廠商資格與特殊或巨額採購認定標準第四條","第一項第六款規定認定，該機關得於招標文件明定該廠商不具備履約能力","之基本資格，不得參與該機關之採購；本令自即日生效。","主任委員 吳澤成",":::","行政院公共工程委員會：11010臺北市信義區松仁路3號9樓","電話總機：","02-87897500","傳真電話：02-87897800","系統版本：114.11.28","系統更新日期：115.01.06","瀏覽人數：21,648,499","回上方","$(function () {","ChangeFunUrl();","$(window).resize(function () {","ChangeFunUrl();","});","});","function ChangeFunUrl() {","//功能頁面切換：依據頁面寬度切換功能","if ($(window).width() = 0xFF01 && charCode = 0xFFE0 && charCode","$(document).ready(function () {","$(document).on(\"keydown\", function (e) {","if (e.key === \"Enter\") {","var active = document.activeElement;","console.log(\"目前焦點元素：\", active.id);","if (active && active.id === \"keyword1\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm1();","e.preventDefault(); // 阻止預設送出表單","return false;","}","if (active && active.id === \"keyword2\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm2();","e.preventDefault(); // 阻止預設送出表單","return false;","}","}","});","});"]}]},{"id":"GL000095","title":"依政府採購法第五十八條處理總標價低於底價百分之八十案件之執行程序","short":"§58低於底價八成程序","date":"民國114年01月14日","kind":"令函釋示","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000095","articles":[{"no":"1","label":"全文","ch":"","cat":"d","lines":["依政府採購法第五十八條處理總標價低於底價百分之八十案件之執行程序","項次","最低標廠商總標價態樣","機關執行程序","一","合於招標文件規定之最低標廠商(以下簡稱最低標)，其總標價在底價以下，但未低於底價之百分之八十，該最低標主動表示標價錯誤，要求不決標予該廠商或不接受決標、拒不簽約。","無政府採購法(以下簡稱採購法)第五十八條之適用。不接受該最低標要求，照價決標。如最低標不接受決標或拒不簽約，依採購法第一百零一條、第一百零二條，並得依其施行細則第五十八條第二項規定處理；如有押標金，依採購法第三十一條第二項規定不予發還。","二","最低標之總標價低於底價之百分之八十，機關認為該總標價無顯不合理，無降低品質、不能誠信履約之虞或其他特殊情形。","無需通知最低標提出說明及差額保證金，照價決標予最低標。最低標如不接受決標或拒不簽約，處理方式同第一項。","三","同前。但該最低標主動表示標價錯誤，要求不決標予該廠商或不接受決標、拒不簽約。","無需通知最低標提出說明及差額保證金，不接受最低標要求，照價決標予最低標。最低標如不接受決標或拒不簽約，處理方式同第一項。","四","最低標之總標價低於底價之百分之八十，但在底價百分之七十以上，機關認為顯不合理，有降低品質、不能誠信履約之虞或其他特殊情形。","限期(由機關視個案特性及實際需要，訂定合理之期限)通知最低標提出說明，不得未經說明而逕行通知最低標提出擔保（即押標金保證金暨其他擔保作業辦法第三十條所定「差額保證金」），並視情形為下列之處理：","一、最低標於機關通知期限內提出說明，機關認為該說明合理，無需通知最低標提出差額保證金，照價決標予最低標。最低標如不接受決標或拒不簽約，依採購法第一百零一條、第一百零二條，並得依其施行細則第五十八條第二項規定處理；有押標金者，依採購法第三十一條第二項規定不予發還。","二、最低標於機關通知期限內提出說明，機關認為該說明顯不合理，有降低品質、不能誠信履約之虞或其他特殊情形者，不通知最低標提出差額保證金，逕不決標予該最低標。該最低標表示願意提出差額保證金者，機關應予拒絕。","三、最低標於機關通知期限內提出說明，機關認為該說明尚非完全合理，但如最低標繳納差額保證金，即可避免降低品質不能誠信履約之疑慮者，通知最低標於五日內(或較長期間內)提出差額保證金，繳妥後再行決標予該最低標。廠商提出差額保證金後如不接受決標或拒不簽約，依採購法第一百零一條、第一百零二條，並得依其施行細則第五十八條第二項規定處理；有押標金者，依採購法第三十一條第二項規定不予發還。","四、最低標未於機關通知期限內提出說明，或其說明尚非完全合理且未於機關通知期限內提出差額保證金者，不決標予該最低標。","五","最低標之總標價低於底價之百分之七十，機關認為顯不合理，有降低品質、不能誠信履約之虞或其他特殊情形。","限期(由機關視個案特性及實際需要，訂定合理之期限)通知最低標提出說明，並視情形為下列之處理：","一、最低標於機關通知期限內提出說明，機關認為該說明合理，無需通知最低標提出差額保證金，照價決標予最低標。最低標如不接受決標或拒不簽約，依採購法第一百零一條、第一百零二條，並得依其施行細則第五十八條第二項規定處理；有押標金者，依採購法第三十一條第二項規定不予發還。","二、最低標未於機關通知期限內提出說明，或其提出之說明經機關認為顯不合理或尚非完全合理，有降低品質、不能誠信履約之虞或其他特殊情形者，不通知最低標提出差額保證金，逕不決標予該最低標。該最低標表示願意提出差額保證金者，機關應予拒絕。"]}]},{"id":"GL000002","title":"依政府採購法施行細則第84條第1項第4款認定政府採購法第61條所稱特殊情形","short":"§61特殊情形認定","date":"民國99年03月04日","kind":"令函釋示","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000002","articles":[{"no":"1","label":"全文","ch":"","cat":"d","lines":["行政院公共工程委員會令","發文日期：中華民國99年3月4日","發文字號：工程企字第09900079840號","茲依政府採購法施行細則第八十四條第一項第四款認定機關採購公用事業","依一定費率供應之標的，除依我國締結之條約或協定辦理者外，屬政府採","購法第六十一條所稱特殊情形，免刊登決標結果之公告。","主任委員 范良銹",":::","行政院公共工程委員會：11010臺北市信義區松仁路3號9樓","電話總機：","02-87897500","傳真電話：02-87897800","系統版本：114.11.28","系統更新日期：115.01.06","瀏覽人數：21,648,498","回上方","$(function () {","ChangeFunUrl();","$(window).resize(function () {","ChangeFunUrl();","});","});","function ChangeFunUrl() {","//功能頁面切換：依據頁面寬度切換功能","if ($(window).width() = 0xFF01 && charCode = 0xFFE0 && charCode","$(document).ready(function () {","$(document).on(\"keydown\", function (e) {","if (e.key === \"Enter\") {","var active = document.activeElement;","console.log(\"目前焦點元素：\", active.id);","if (active && active.id === \"keyword1\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm1();","e.preventDefault(); // 阻止預設送出表單","return false;","}","if (active && active.id === \"keyword2\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm2();","e.preventDefault(); // 阻止預設送出表單","return false;","}","}","});","});"]}]},{"id":"GL000097","title":"機關辦理採購，不得於招標文件規定廠商之投標文件有下列情形之一者，為不合格標；其有規定者，該部分無效","short":"不得列為不合格標之情形","date":"民國114年04月01日","kind":"令函釋示","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000097","articles":[{"no":"1","label":"全文","ch":"","cat":"d","lines":["行政院公共工程委員會令","發文日期：中華民國114年4月1日","發文字號：工程企字第1140100194號","修正本會九十六年五月八日工程企字第○九六○○一八二五六○號令之內","容如下：","機關辦理採購，不得於招標文件規定廠商之投標文件有下列情形之一者，","為不合格標；其有規定者，該部分無效：","一、標封封口未蓋騎縫章。","二、投標文件未逐頁蓋章。","三、投標文件之編排、字體大小、裝訂方式、正副本標示或份數與招標文","件規定不符。","主任委員 陳金德",":::","行政院公共工程委員會：11010臺北市信義區松仁路3號9樓","電話總機：","02-87897500","傳真電話：02-87897800","系統版本：114.11.28","系統更新日期：115.01.06","瀏覽人數：21,648,494","回上方","$(function () {","ChangeFunUrl();","$(window).resize(function () {","ChangeFunUrl();","});","});","function ChangeFunUrl() {","//功能頁面切換：依據頁面寬度切換功能","if ($(window).width() = 0xFF01 && charCode = 0xFFE0 && charCode","$(document).ready(function () {","$(document).on(\"keydown\", function (e) {","if (e.key === \"Enter\") {","var active = document.activeElement;","console.log(\"目前焦點元素：\", active.id);","if (active && active.id === \"keyword1\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm1();","e.preventDefault(); // 阻止預設送出表單","return false;","}","if (active && active.id === \"keyword2\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm2();","e.preventDefault(); // 阻止預設送出表單","return false;","}","}","});","});"]}]},{"id":"FL043333","title":"各機關採購評選委員會專家學者參考名單資料庫建置及除名作業要點","short":"專家學者資料庫作業要點","date":"民國110年12月06日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL043333","articles":[{"no":"1","label":"第一點","ch":"","cat":"d","lines":["行政院公共工程委員會（以下簡稱工程會）為提升各機關採購評選委","員會專家學者參考名單資料庫（以下簡稱本資料庫）之專業性及公正","性，特訂定本要點。"]},{"no":"2","label":"第二點","ch":"","cat":"d","lines":["本資料庫中之專家學者，應具備下列資格之一，且不得為政府機關之","現職人員：","（一）有以下機關（構）及職等之主管（含副主管）經歷，且具專長相關","實務經驗十五年以上：","1.中央機關或其所屬機關、學校之薦任第九職等以上。","2.地方機關或其所屬（轄）機關、學校之薦任第八職等以上。","3.公營事業相當於薦任第九職等以上。","（二）現任或曾任公私立大專院校專任副教授以上，且具專長相關教學經","驗三年以上。","（三）現任或曾任公私立大專院校專任助理教授以上，且具專長相關教學","經驗五年以上。","（四）現任或曾任合法立案研究機構專職研究員以上，且具專長相關研究","經驗七年以上。","（五）現任或曾任合法立案研究機構專職副研究員以上，且具專長相關研","究經驗十年以上。","（六）具博士學位，且具所學專長相關專職實務或研究經驗七年以上。","（七）具碩士學位，且具所學專長相關專職實務或研究經驗十年以上。","（八）具專業證照之專門職業及技術人員，且取得證照後具有執行業務相","關實務經驗十年以上。","（九）特殊資格：前八款以外，藝、工、匠、新興科技及其他具特殊專長","之專家。","（十）曾任簡任職以上之機關（構）首長或副首長達三年以上，且具專長","相關實務經驗三年以上。","前項第一款、第四款至第八款及第十款所稱實務或研究經驗，不","包含教學、在學或兼職經驗；第二款及第三款所稱專長相關教學經驗","，指專職經驗；第四款至第七款所稱專職，指辦公時間內全部在聘僱","機關服務，並依規定支領全部時間之報酬。","中華民國九十八年八月二十日以前已納入資料庫之專家學者，不","適用前項規定。"]},{"no":"3","label":"第三點","ch":"","cat":"d","lines":["專家學者得由下列機關（構）、公會（以下簡稱推薦機關（構））審","查後推薦之：","（一）總統府、五院、國家安全會議及其所屬ㄧ級及二級機關（構）。","（二）直轄市政府、直轄市議會、縣（市）政府及縣（市）議會。","（三）公立大專院校及經教育部核准設立之公立研究機構。","（四）私立大專院校及經教育部核准設立之私立研究機構。","（五）專門職業及技術人員依法成立之公會。","符合前點第一項第一款至第七款及第十款資格者（含退休人員）","，由前項第一款至第四款之推薦機關（構）辦理審查推薦。","符合前點第一項第八款資格者，由第一項第五款之推薦機關（構","）辦理審查推薦。","符合前點第一項第九款資格者，由第一項第一款至第三款之推薦","機關（構）辦理審查推薦。"]},{"no":"4","label":"第四點","ch":"","cat":"d","lines":["推薦機關（構）應推薦品德操守良好之專家學者，就所推薦人選，審","查符合資格後，備齊各機關採購評選委員會專家學者參考名單資料庫","推薦表（如附件一至附件三，以下簡稱推薦表）及相關證明文件函送","工程會；並應於工程會指定之網路登錄相關資料。","推薦機關（構）之所屬單位或分會如欲推薦人選，應備妥受推薦","者之推薦表及相關證明文件，送交推薦機關（構）辦理審查推薦。","工程會將推薦表提報各機關採購評選委員會專家學者參考名單資","料庫審議小組（以下簡稱審議小組）審議，通過後納入本資料庫起算","有效期三年，效期屆滿前六個月內，推薦機關（構）得以書面或至本","資料庫以電子化方式續行辦理推薦作業。未辦理者，移離本資料庫。","中華民國一百零八年十月二日修正規定生效前，納入本資料庫達","二年以上者，推薦機關（構）應於修正規定生效日起一年內續行辦理","推薦作業。未辦理者，移離本資料庫。"]},{"no":"5","label":"第五點","ch":"","cat":"d","lines":["公會推薦人選以該公會會員總人數百分之十為限（不足一人者以一人","計），經公會之理事會同意，並送經中央目的事業主管機關查核最近","十年內無相關懲戒或行政處分紀錄（中央目的事業主管機關例如：建","築師公會送內政部、律師公會送法務部、會計師公會送金融監督管理","委員會、醫師公會送衛生福利部、技師公會送工程會等），填具理事","會任期及會員總人數後依前點第一項規定辦理。","公會之理事改選後，新任理事會應於上任三個月內，重行辦理審","查推薦，逾期未完成重行推薦者，視同該公會同意展延原推薦人員至","該任理事會任期屆滿之日。"]},{"no":"6","label":"第六點","ch":"","cat":"d","lines":["本資料庫之資料修正維護作業原則如下：","（一）工程會得每半年通知原推薦機關（構）及專家學者檢核及確認資料","之正確性。","（二）專家學者個人資料（包括學歷、經歷、電話、傳真、住址、電子郵","件、專長等）有異動或更正必要者，除學歷、經歷及專長應由原推","薦機關（構）上網即時更正或補充外，餘得由專家學者本人自行上","網更正或補充。","（三）前款更正或補充資料如有異常，工程會得提報審議小組審議或逕予","退回。"]},{"no":"7","label":"第七點","ch":"","cat":"d","lines":["工程會知悉本資料庫中之專家學者有下列第一款至第六款或第十二款","情形之一者，應逕予自本資料庫除名，並通知推薦機關（構）及提報","審議小組備查；有下列第七款至第十一款或第十三款情形之一者，提","報審議小組決議不予納入本資料庫或予以除名，並通知推薦機關（構","）。原推薦機關（構）知悉者，亦應檢具具體事證，提送工程會依程","序辦理：","（一）本人書面要求自本資料庫除名。","（二）原推薦機關（構）撤回推薦。","（三）犯貪污或瀆職之罪，經判刑確定。","（四）受監護或輔助宣告，尚未撤銷。","（五）專門職業及技術人員已受停止執行業務或撤銷、廢止執業執照之處","分。","（六）專門職業及技術人員有政府採購法第一百零一條第一項各款情形之","一，經機關刊登於政府採購公報。","（七）未能公正辦理政府採購評選，情節重大，經機關檢具具體事證提送","工程會。","（八）有採購人員倫理準則第七條各款情形之一。","（九）參與政府採購評選，有以下異常情形之ㄧ：","1.出席政府採購評選會議，缺席、遲到早退或未全程參與之比例偏","高。","2.私下與廠商接洽與評選有關之案件。","（十）違反採購評選委員會審議規則第十四條、第十四條之一規定，經機","關檢具具體事證提送工程會。","（十一）受破產宣告確定尚未復權。","（十二）褫奪公權尚未復權。","（十三）有事實足認不堪勝任政府採購評選任務。","本資料庫中之專家學者，屬前項第三款至第八款、第九款第二目","、第十款至第十二款情形之一，且經提報審議小組備查、決議不予納","入本資料庫或予以除名者，列入採購評選委員會組織準則第五條第五","款所定不得遴選為採購評選委員之人員名單；非本資料庫之人員，有","相同情形，經工程會提報審議小組決議者，亦同。","本資料庫中之專家學者，經傳播媒體報導參與政府採購評選疑有","違法情事（例如專家學者遭檢調單位約談、羈押或起訴），或機關、","工程會知悉專家學者疑有第一項第三款至第八款、第九款第二目、第","十款至第十二款情形之一者，工程會得先予暫時移離本資料庫，並書","面通知推薦機關（構）。","前項暫時移離本資料庫之情形，視資料蒐集或司法調查結果，依","第一項規定辦理；其無應予除名之情形，並送經審議小組審議後，重","行納入本資料庫。"]},{"no":"8","label":"第八點","ch":"","cat":"d","lines":["本資料庫之專家學者經機關徵詢同意後出席會議次數偏低，或工程會","進行資料查詢時，未能於期限內提供資料，且無正當理由，或拒絕說","明者，工程會得採行下列措施:","（一）暫停本資料庫遴選該專家學者之功能。","（二）經審議小組決議予以除名。"]},{"no":"9","label":"第九點","ch":"","cat":"d","lines":["本資料庫中之專家學者名單及不得遴選為採購評選委員之人員名單，","由工程會登載於資訊網站供機關查詢。","依第七點第一項規定除名之專家學者，工程會得將除名之事由附","記於本資料庫。"]},{"no":"10","label":"第十點","ch":"","cat":"d","lines":["審議小組辦理審議，必要時得通知推薦機關（構）或專家學者列席會","議。"]},{"no":"11","label":"第十一點","ch":"","cat":"d","lines":["專家學者認為審議小組之審議結果與事實不符，得向審議小組提出","說明，申請再審議。"]}]},{"id":"FL051975","title":"各機關採購評選委員會專家學者參考名單資料庫審議小組設置要點","short":"專家學者資料庫審議小組要點","date":"民國110年12月06日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL051975","articles":[{"no":"1","label":"第一點","ch":"","cat":"d","lines":["行政院公共工程委員會（以下簡稱本會）為提升各機關採購評選委員","會專家學者參考名單資料庫（以下簡稱資料庫）之專業性及公正性，","特設專家學者參考名單資料庫審議小組（以下簡稱審議小組）。"]},{"no":"2","label":"第二點","ch":"","cat":"d","lines":["審議小組任務如下：","（一）審議受推薦專家學者之資格、納入資料庫事項，及資料庫之專家學","者除名相關事項。","（二）審議資料庫之專家學者及非資料庫人員列入採購評選委員會組織準","則第五條第五款所定不得遴選為採購評選委員之人員名單事項。","（三）審議修訂資料庫除名原則。","（四）其他與資料庫相關事宜之審議。"]},{"no":"3","label":"第三點","ch":"","cat":"d","lines":["審議小組置召集人一人，由本會副主任委員或指定之人員派兼之；委","員七人至十一人，除召集人為當然委員外，其餘委員由本會分別就教","育部、考選部、其他相關機關及本會之高級人員聘（派）兼之。"]},{"no":"4","label":"第四點","ch":"","cat":"d","lines":["審議小組會議視業務需要不定期召開，由召集人召集並擔任主席，召","集人因故不能出席時，得指定委員一人為主席。"]},{"no":"5","label":"第五點","ch":"","cat":"d","lines":["審議小組會議之決議，應有二分之一以上委員之出席，出席委員過半","數同意行之。出席委員中外聘委員不得少於二人。","前項決議，不同意見之委員得提意見書，附於審議小組會議紀錄","，以備查考。"]},{"no":"6","label":"第六點","ch":"","cat":"d","lines":["審議小組審議除名名單前，得通知相關機關（構）提出書面意見，或","於辦理採購稽核後將稽核結果副知審議小組，並得通知當事人到場或","書面陳述意見。"]},{"no":"7","label":"第七點","ch":"","cat":"d","lines":["審議小組如作成除名決議，應將決議理由及結果函送推薦機關（構）","及當事人。"]},{"no":"8","label":"第八點","ch":"","cat":"d","lines":["審議小組委員就審議事件有下列各款情形之一者，應行迴避：","（一）與受審議之專家學者有本人、配偶、三親等以內血親或姻親，或同","財共居親屬之關係者。","（二）有其他情形足認不能公正執行職務之虞者。"]},{"no":"9","label":"第九點","ch":"","cat":"d","lines":["審議小組對外行文，以本會名義行之。"]}]},{"id":"FL028312","title":"採購評選委員會委員須知","short":"評選委員須知","date":"民國111年02月25日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL028312","articles":[{"no":"1","label":"第一點","ch":"","cat":"d","lines":["為確保依政府採購法第九十四條規定成立之採購評選委員會委員（以","下簡稱委員）公正辦理評選，避免爭議，特訂定本須知。"]},{"no":"2","label":"第二點","ch":"","cat":"d","lines":["委員應知其所擔任之工作為無給職，不以獲取報酬為目的。"]},{"no":"3","label":"第三點","ch":"","cat":"d","lines":["委員自接獲評選有關資料之時起，不得就該採購案參加投標、作為投","標廠商之分包廠商或擔任工作成員。","委員對於所知悉之招標資訊，應予保密。","委員不得與所辦採購案有利益關係之廠商私下接洽與該採購案有","關之事務。","委員於所評採購個案決標後，不得擔任得標廠商該案之履約工作","成員，或協助履約。"]},{"no":"4","label":"第四點","ch":"","cat":"d","lines":["委員應依據法令，本於專業及良知，公正執行職務，不為及不受任何","請託或關說。"]},{"no":"5","label":"第五點","ch":"","cat":"d","lines":["委員不得有採購人員倫理準則第七條規定之行為。","機關發現委員有前項行為者，應予解聘。其屬自主管機關會同教","育部、考選部及其他相關機關之建議名單遴選者，並應通知主管機關","，以作為將其自名單除名之依據。","機關對於主動求取擔任委員事宜之人員應不遴選其擔任委員。"]},{"no":"6","label":"第六點","ch":"","cat":"d","lines":["委員於被遴選前或同意擔任委員後，如有下列不得被遴選為委員或有","應辭職之情形，應主動通知機關或由機關予以解聘：","（一）犯貪污或瀆職之罪，經判刑確定者。","（二）褫奪公權尚未復權者。","（三）受破產宣告確定尚未復權者。","（四）專門職業人員已受停止執行業務或撤銷、廢止執業執照之處分者。","（五）就案件涉及本人、配偶、二親等以內親屬，或共同生活家屬之利益","者。","（六）本人或其配偶與受評選之廠商或其負責人間現有或三年內曾有僱傭","、委任或代理關係者。","（七）委員認為本人或機關認其有不能公正執行職務之虞者。","（八）有其他情形足使受評選之廠商認其有不能公正執行職務之虞，經受","評選之廠商以書面敘明理由，向機關提出，經採購評選委員會作成","決定者。"]},{"no":"7","label":"第七點","ch":"","cat":"d","lines":["委員訂定、審定評選項目及其配分或權重，不應以有利或不利於特定","廠商為目的。"]},{"no":"8","label":"第八點","ch":"","cat":"d","lines":["委員評選及出席會議，應全程參與並親自為之，不得代理，避免遲到","早退。","召集人及副召集人如均無法出席會議，應檢討會議時間之妥適性","及召集人、副召集人未出席會議之原因，並另訂時間開會，必要時得","於例假日或夜間辦理。","出席評選會議之外聘評選委員，機關得依行政院訂定「中央政府","各機關學校出席費及稿費支給要點」支給出席費及審查費，並依「國","內出差旅費報支要點」支給交通費。其有審查費者，應於開會前依機","關指定之期日前提出書面審查意見。"]},{"no":"9","label":"第九點","ch":"","cat":"d","lines":["委員辦理評選，應依招標文件之評選項目、子項及其配分或權重辦理","，不得變更或補充。其有輔以廠商簡報及現場詢答者，廠商簡報及委","員詢問事項，應與評選項目有關；廠商另外提出變更或補充資料者，","該資料應不納入評選考量。","前項簡報及現場詢答，非屬採行協商措施性質，不應要求廠商更","改投標文件內容。","委員對於不同廠商之詢問及態度，不得為無正當理由之差別待遇","；勿在廠商面前對個別廠商公開誇讚或批評。","委員評選後，應於機關備具之評分（比）表逐項載明各受評廠商","之評分或序位，並簽名或蓋章。","採購評選委員會辦理廠商評選，應就各評選項目、受評廠商資料","及工作小組初審意見，逐項討論後為之。","委員對於會議之決議有不同意見者，得要求將不同意見載入會議","紀錄或將意見書附於會議紀錄。"]},{"no":"10","label":"第十點","ch":"","cat":"d","lines":["不同委員之評選結果有明顯差異時，召集委員應提交採購評選委員會","議決或依採購評選委員會決議辦理複評。","採購評選委員會或個別委員評選結果與工作小組初審意見有異時","，應由採購評選委員會或該個別委員敘明理由，並列入會議紀錄。"]},{"no":"11","label":"第十一點","ch":"","cat":"d","lines":["委員對於受評廠商之投標文件內容及資料，除供公務上使用或法令","另有規定外，應保守秘密，並不得挪作他用。評選後亦同。","廠商之投標文件應於評選後由機關收回保存。未收回者，由委","員自行銷毀並負保密之責。"]},{"no":"12","label":"第十二點","ch":"","cat":"d","lines":["機關於評定最有利標後，將於主管機關之政府採購資訊網站公開全","部委員姓名、職業及評定最有利標會議之出席委員姓名。","採購評選委員會之會議紀錄及機關於委員評選後彙總製作之總","表，除涉及個別廠商之商業機密者外，機關將允許投標廠商申請閱","覽、抄寫、複印或攝影。","機關對於各出席委員之評分或序位評比表，除法令另有規定外","，應保守秘密，不得允許申請閱覽、抄寫、複印或攝影。"]},{"no":"13","label":"第十三點","ch":"","cat":"d","lines":["本須知由成立採購評選委員會之機關於通知委員派兼或聘兼事宜時","一併附於通知書中。"]}]},{"id":"GL000030","title":"不同投標廠商間之投標文件內容有重大異常關聯之情形","short":"重大異常關聯認定","date":"民國105年03月21日","kind":"令函釋示","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000030","articles":[{"no":"1","label":"全文","ch":"","cat":"d","lines":["行政院公共工程委員會令","發文日期：中華民國105年3月21日","發文字號：工程企字第10500080180號","機關辦理採購有「廠商投標文件所載負責人為同一人」之情形者，得","依政府採購法第五十條第一項第五款「不同投標廠商間之投標文件內容有","重大異常關聯者」處理。","主任委員 許俊逸",":::","行政院公共工程委員會：11010臺北市信義區松仁路3號9樓","電話總機：","02-87897500","傳真電話：02-87897800","系統版本：114.11.28","系統更新日期：115.01.06","瀏覽人數：21,648,491","回上方","$(function () {","ChangeFunUrl();","$(window).resize(function () {","ChangeFunUrl();","});","});","function ChangeFunUrl() {","//功能頁面切換：依據頁面寬度切換功能","if ($(window).width() = 0xFF01 && charCode = 0xFFE0 && charCode","$(document).ready(function () {","$(document).on(\"keydown\", function (e) {","if (e.key === \"Enter\") {","var active = document.activeElement;","console.log(\"目前焦點元素：\", active.id);","if (active && active.id === \"keyword1\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm1();","e.preventDefault(); // 阻止預設送出表單","return false;","}","if (active && active.id === \"keyword2\") {","// 使用者焦點在 Master 的檢索輸入欄位，才觸發整合查詢","GlobalCheckForm2();","e.preventDefault(); // 阻止預設送出表單","return false;","}","}","});","});"]}]},{"id":"FL025855","title":"中央機關共同供應契約集中採購實施要點","short":"集中採購實施要點","date":"民國103年02月05日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL025855","articles":[{"no":"1","label":"第一點","ch":"","cat":"d","lines":["行政院公共工程委員會（以下簡稱工程會）為利中央政府各機關、學","校、公營事業（以下簡稱中央機關）辦理財物、勞務集中採購，依政","府採購法第九十三條與廠商簽訂共同供應契約，經由集中採購，以節","省人力，發揮大量採購之經濟效益，提升採購執行績效，特訂定本要","點。"]},{"no":"2","label":"第二點","ch":"","cat":"d","lines":["中央機關辦理具共通性，且達相當規模之財物或勞務之集中採購，除","有特殊情形者外，應依本要點之規定。","本要點之規定，於中央機關補助地方機關辦理之財物或勞務採購","，或中央機關補助法人或團體辦理之財物或勞務採購而依政府採購法","第四條規定應適用政府採購法者，亦適用之。"]},{"no":"3","label":"第三點","ch":"","cat":"d","lines":["集中採購之訂約機關，得為下列情形之一：","（一）二以上機關共同協議，由其中一機關訂約。","（二）由中央各部、會、行、處、局、署、院等機關指定機關訂約。","（三）由工程會指定機關訂約。","工程會依前項第三款指定之訂約機關及其集中採購項目如附表，","並得視需要隨時調整之。"]},{"no":"4","label":"第四點","ch":"","cat":"d","lines":["各訂約機關應明確規範集中採購項目、品名、規格等，辦理需求調查","，規劃採購作業時程，並由適用機關自行依契約價格洽廠商訂貨、辦","理驗收、付款。","前項採購需求調查、契約公告、下單訂貨及廠商履約等事宜，除","有特殊情形者外，各機關應依工程會「共同供應契約電子採購系統」","進行電子線上作業。"]},{"no":"5","label":"第五點","ch":"","cat":"d","lines":["集中採購所需人力，由集中採購訂約機關就現有人力調度或派充之；","集中採購所需經費，集中採購訂約機關得向適用機關收取之。"]},{"no":"6","label":"第六點","ch":"","cat":"d","lines":["本要點各集中採購訂約機關應於每年年度終了十五日內，依附表格式","向工程會提供辦理成果。"]}]},{"id":"FL037158","title":"工程施工查核小組不預先通知查核作業規定","short":"不預先通知查核規定","date":"民國105年06月13日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL037158","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["為執行工程施工查核小組作業辦法第五條工程施工查核小組得不預先","通知赴工地進行查核之規定，特訂定本作業規定。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["不預先通知查核之工程：","（一）複查品質之工程。","（二）社會關注或民眾檢舉（通報）之工程。","（三）有品質不良紀錄之專案管理廠商、監造廠商或施工廠商承攬之在建","工程。","（四）工期較短工程。","（五）其他經檢討認為適合採不預先通知查核之工程。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["查核前準備事項：","（一）通知工程主辦機關之公函，採「持送」方式辦理，查核委員另專函","通知。上開函文應註明本次查核採不預先通知方式辦理。","（二）查核委員通知函不列工程名稱，且於函中註明：「貴委員至工地現","場，發現本工程與貴委員有工程施工查核小組組織準則第八條規定","應行迴避情事或現任該工程之顧問、督導委員者，請通知本查核小","組，且貴委員不得評分，但可提供查核意見供查核小組參考。」","（三）工作人員應預先準備「工程施工查核小組查核品質缺失扣點紀錄表","」空白表格提供查核委員，作為填列缺失代號及扣點項目之參考。","（四）如係工程品質複查，查核小組工作人員應將該工程歷次查核紀錄交","查核委員參考。","（五）於查核前半個工作天以傳真或其他方式通知受查核工程主辦機關配","合辦理。但如有工程地點不易尋找、交通不便或其他窒礙難行情形","，得依個案實際狀況調整，不受半個工作天之限制。"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["現場查核應注意事項：","（一）工程報告，由工程主辦機關、專案管理廠商（如無則免）、監造廠","商及施工廠商口頭報告，並答復查核委員詢問或提供相關資料。","（二）查閱文件，依下列規定辦理：","1.工地設有工務所者，應提供相關文件供查閱。","2.工地未設有工務所者，以當時置於現場之文件為主（如監造單位","監造報表及抽查驗紀錄、施工廠商自主檢查紀錄等）。如文件置","放處距離工地半小時車程以內或適當距離者，查核小組得前往文","件置放處所查閱相關文件。另如已依前點第五款通知者，應將品","管及進度管控等文件攜至工地備查。","（三）召開檢討及扣點會議，依下列規定辦理：","1.擇適當場所，召開檢討會議；如無適當場所，可逕於工地現場辦","理，指明工程主辦機關、監造單位及施工廠商相關應改進事項，","並請相關單位就所列缺失提出說明。","2.查核品質缺失扣點會議，得於工地現場或回程時再行辦理。"]}]},{"id":"FL003712","title":"公共工程趕工實施要點","short":"公共工程趕工實施要點","date":"民國96年06月15日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL003712","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["為促使公共工程承包商及監造廠商在確保公共工程契約（以下簡稱契","約）規定品質下，全力趲趕進度提前完工，以發揮工程效益，節省整","體社會成本，特訂定本要點。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["執行中工程計畫之各項工程標案或工程標案內之部分工程，有下列情","形之一者，工程主辦機關（以下簡稱機關）得檢討趕工效益，訂定趕","工期限目標及方案，報經上級機關審查同意後，與承包商及監造廠商","協商依第三點規定發給趕工費用或依第四點規定以修約之方式辦理趕","工：","（一）工程標案延後開工或進度落後，非屬承包商責任，如趲趕進度減少","工期展延，對整體工程計畫執行有助益。","（二）工程標案係在工程計畫要徑上，如能減縮工期，對整體工程計畫執","行有助益。","（三）工程標案內之部分工程，如能減縮工期，對工程計畫執行有助益或","具有重大效益（以下簡稱關鍵工程）。","機關依前項規定報上級機關時，應敘明其經費、原定完工期程與","趕工之必要性、合理性及可行性，並明確規定各項考量條件指標；其","於規劃設計階段工期估算寬鬆，而於履約階段無正當原因辦理趕工者","，上級機關應不予同意。","機關依第三點規定發給趕工費用或依第四點規定以修約之方式辦","理趕工者，應先辦理契約變更。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["機關以發給趕工費用之方式辦理趕工者，協商趕工之工程標案或關鍵","工程於達成趕工期限目標後，趕工費用計算方式如下：","（一）承包商：","1.按其較契約規定工期（含非屬承包商責任，同意展延後之工期）","或規劃完工日提前完工者，每提早完工一日，給與原契約決標總","價除以工期所得金額百分之十五之趕工費用。","2.趕工費用最高限額：決標總價之百分之三。","（二）監造廠商：按承包商趕工費用總額百分之三發給。但服務費用之計","算，不得將承包商之趕工費用納入。","限期完工工程，以限定完工日與約定開工日間之日曆天為工期。","如僅就關鍵工程辦理趕工即可達成趕工期限目標，無需就整體工","程標案辦理趕工者，依關鍵工程部分之經費、工期及前項計算方式，","計算趕工費用；未達成趕工期限目標者，不發給趕工費用。","前二項金額，均不含物價指數調整。"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["機關因個案特性及實際需要，確有必要約定高於前點所定趕工費用，","或雖未達趕工期限目標而仍具部分效益並有支付廠商趕工費用必要者","，得以修約方式辦理趕工；其增加費用之計算，應綜合考量廠商因趕","工增加之成本及因履約期限縮短所減少之成本，並以標案中之關鍵工","程為限；其辦理程序，得比照「採購契約要項」第二十點規定，通知","廠商辦理契約變更。","前項契約變更後之履約期限，應以限期完工為限。廠商如逾變更","後之履約期限，除有契約規定得免責之事由外，應依變更後之契約規","定計算逾期違約金。其逾變更後之履約期限，惟於原契約規定之履約","期限內完工者，逾期違約金計算方式如下：","（一）以每日平均值計算逾期違約金：每日金額為因工期縮短致契約價金","增加之費用除以契約變更縮短之日數。","（二）以每日不同值計算逾期違約金：每日金額按契約約定之曲線公式（","例如二次拋物曲線公式）計算。","（三）以其他方式計算逾期違約金：每日金額依契約約定之其他方式計算","。","前項逾期違約金之計算，應能反映廠商如逾期至原契約履約期限","當日竣工，機關依契約變更後契約價金扣減逾期違約金後之給付金額","，不得高於原契約金額。","廠商逾原契約規定之履約期限完工者，依原契約規定之逾期違約","金計罰。","機關對於監造部分是否併同修約，應依第一項規定辦理；如有修","正委託監造契約之必要者，依契約及機關委託技術服務廠商評選及計","費辦法規定辦理。但服務費用之計算，不得將承包商之趕工費用納入","。"]},{"no":"5","label":"第五點","ch":"","cat":"p","lines":["機關依前點規定修約時，得依個案需求及政府採購法施行細則第一百","十一條規定，協商延誤履約期限情節重大之情形，督促廠商確實趕工","。"]},{"no":"6","label":"第六點","ch":"","cat":"p","lines":["機關於接受廠商所提出須變更事項前即通知廠商先行趕工，其後未依","原通知辦理全部或一部契約變更者，應補償廠商所增加之必要費用。"]},{"no":"7","label":"第七點","ch":"","cat":"p","lines":["機關依本要點處理之個案，應將上級機關核准文件、協商紀錄或通知","、監造報表及竣工報告書等有關資料建檔，以備審查。"]},{"no":"8","label":"第八點","ch":"","cat":"p","lines":["本要點給付趕工費用所需經費或協商修約所增加之契約價金，由各機","關相關工程預算項下支應。"]}]},{"id":"FL000717","title":"採購契約變更或加減價核准監辦備查規定一覽表","short":"契約變更核准監辦一覽表","date":"民國91年03月29日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL000717","articles":[{"no":"1","label":"全文","ch":"","cat":"p","lines":["\n┌─┬───────┬───────┬─────┬──────┐\n│項│契約變更或加減│核  准  規  定│監辦規定  │  備查規定  │\n│次│價情形        │              │          │            │\n├─┼───────┼───────┼─────┼──────┤\n│一│辦理契約變更，│一  適用未達公│採購法第十│查核金額以上│\n│  │不論原契約金額│    告金額採購│三條第二項│之採購，補具│\n│  │大小，其變更部│    招標辦法之│監辦規定。│辦理結果之相│\n│  │分之累計金額未│    核准規定。│          │關文件送上級│\n│  │達公告金額。  │二  有政府採購│          │機關備查。上│\n│  │              │    法 (以下簡│          │級機關得決定│\n│  │              │    稱採購法) │          │免送備查。契│\n│  │              │    第七十二條│          │約價金變更後│\n│  │              │    第二項減價│          │屬查核金額以│\n│  │              │    收受之情形│          │上之採購者，│\n│  │              │    者，從其規│          │除本表第四項│\n│  │              │    定。      │          │之情形外，亦│\n│  │              │              │          │同。        │\n├─┼───────┼───────┼─────┼──────┤\n│二│辦理契約變更，│一  採購機關自│採購法第十│查核金額以上│\n│  │其變更部分之累│    行核准。  │三條第一項│之採購，補具│\n│  │計金額在公告金│二  有採購法第│監辦規定。│辦理結果之相│\n│  │額以上，未達查│    七十二條第│          │關文件送上級│\n│  │核金額，自累計│    二項減價收│          │機關備查。上│\n│  │金額達公告金額│    受之情形者│          │級機關得決定│\n│  │之時起。加帳累│    ，從其規定│          │免送備查。契│\n│  │計金額在公告金│    。        │          │約價金變更後│\n│  │額以上者，並須│              │          │屬查核金額以│\n│  │符合採購法第二│              │          │上之採購者，│\n│  │十二條第一項各│              │          │除本表第四項│\n│  │款情形之一。  │              │          │之情形外，亦│\n│  │              │              │          │同。        │\n│  │              │              │          │            │\n├─┼───────┼───────┼─────┼──────┤\n│三│辦理契約變更，│一  採購機關自│一  採購法│            │\n│  │其變更部分之累│    行核准。  │    第十二│            │\n│  │計金額在查核金│二  有採購法第│    條第一│            │\n│  │額以上，自累計│    七十二條第│    項上級│            │\n│  │金額達查核金額│    二項減價收│    機關監│            │\n│  │之時起。加帳累│    受之情形者│    辦規定│            │\n│  │計金額在公告金│    ，從其規定│    。    │            │\n│  │額以上者，並須│    。        │二  採購法│            │\n│  │符合採購法第二│              │    第十三│            │\n│  │十二條第一項各│              │    條第一│            │\n│  │款情形之一。  │              │    項監辦│            │\n│  │              │              │    規定。│            │\n├─┼───────┼───────┼─────┼──────┤\n│四│契約價金變更，│採購機關自行核│採購法第十│採購法第十二│\n│  │原「採購金額」│准。          │三條第一項│條第二項，補│\n│  │未達查核金額，│              │監辦規定。│具相關文件送│\n│  │契約價金於變更│              │          │上級機關備查│\n│  │後達查核金額之│              │          │。          │\n│  │當次變更。    │              │          │            │\n├─┼───────┼───────┼─────┼──────┤\n│五│未達查核金額之│採購機關自行核│          │            │\n│  │採購，不涉及契│准。          │          │            │\n│  │約價金之契約變│              │          │            │\n│  │更。          │              │          │            │\n├─┼───────┼───────┼─────┼──────┤\n│六│查核金額以上之│採購機關自行核│上級機關另│補具辦理結果│\n│  │採購，不涉及契│准。但上級機關│有規定者，│之相關文件送│\n│  │約價金之契約變│另有規定者，從│從其規定。│上級機關備查│\n│  │更。          │其規定。      │          │，上級機關得│\n│  │              │              │          │決定免送備查│\n│  │              │              │          │。但上級機關│\n│  │              │              │          │另有規定者，│\n│  │              │              │          │從其規定。  │\n├─┼───────┼───────┼─────┼──────┤\n│七│由機關決定增購│適用採購法第二│增購部分之│查核金額以上│\n│  │，且已於原招標│十二條第一項第│累計金額未│之採購，補具│\n│  │公告及招標文件│七款情形，由採│達公告金額│辦理結果之相│\n│  │敘明機關得就原│購機關自行核准│者，適用採│關文件送上級│\n│  │標的決定增購之│。            │購法第十三│機關備查，上│\n│  │期間、數量或金│              │條第二項監│級機關得決定│\n│  │額。不論原契約│              │辦規定；累│免送備查。但│\n│  │金額大小，在該│              │計金額在公│上級機關另有│\n│  │得增購之期間、│              │告金額以上│規定者，從其│\n│  │數量或金額以內│              │而未達查核│規定。      │\n│  │，依原招標文件│              │金額者，適│            │\n│  │及契約規定辦理│              │用採購法第│            │\n│  │者。          │              │十三條第一│            │\n│  │              │              │項監辦規定│            │\n│  │              │              │；累計金額│            │\n│  │              │              │在查核金額│            │\n│  │              │              │以上者，適│            │\n│  │              │              │用採購法第│            │\n│  │              │              │十二條第一│            │\n│  │              │              │項及第十三│            │\n│  │              │              │條第一項監│            │\n│  │              │              │辦規定。  │            │\n├─┼───────┼───────┼─────┼──────┤\n│八│由廠商決定增加│適用採購法第二│增加部分之│查核金額以上│\n│  │供應數量或金額│十二條第一項第│累計金額未│之採購，補具│\n│  │ (含採購契約價│十六款情形，無│達公告金額│辦理結果之相│\n│  │金之給付係依實│核准程序。    │者，適用採│關文件送上級│\n│  │際施作或供應之│              │購法第十三│機關備查，上│\n│  │項目及數量給付│              │條第二項監│級機關得決定│\n│  │) ，且已於招標│              │辦規定；累│免送備查。但│\n│  │文件敘明得增加│              │計金額在公│上級機關另有│\n│  │供應數量或金額│              │告金額以上│規定者，從其│\n│  │之上限及計價方│              │而未達查核│規定。      │\n│  │式。不論原契約│              │金額者，適│            │\n│  │金額大小，在該│              │用採購法第│            │\n│  │得增購之數量或│              │十三條第一│            │\n│  │金額以內，依原│              │項監辦規定│            │\n│  │招標文件及契約│              │；累計金額│            │\n│  │規定辦理者。  │              │在查核金額│            │\n│  │              │              │以上者，適│            │\n│  │              │              │用採購法第│            │\n│  │              │              │十二條第一│            │\n│  │              │              │項及第十三│            │\n│  │              │              │條第一項監│            │\n│  │              │              │辦規定。  │            │\n├─┼───────┼───────┼─────┼──────┤\n│九│原招標文件敘明│一  由機關決定│          │查核金額以上│\n│  │機關或廠商得就│    減購者，由│          │之採購，補具│\n│  │原標的決定減購│    採購機關自│          │辦理結果之相│\n│  │或減供應之數量│    行核准。  │          │關文件送上級│\n│  │或金額。不論原│二  由廠商決定│          │機關備查，上│\n│  │契約金額大小，│    減少供應數│          │級機關得決定│\n│  │在該得減購或減│    量或金額，│          │免送備查。但│\n│  │供應之數量或金│    不必事先徵│          │上級機關另有│\n│  │額以內，依原招│    得機關同意│          │規定者，從其│\n│  │標文件及契約所│    者，無核准│          │規定。      │\n│  │列計價方式減價│    程序。    │          │            │\n│  │。            │              │          │            │\n└─┴───────┴───────┴─────┴──────┘\n附記：\n (一) 契約變更，指原契約標的之規格、價格、數量或條款之變更，並包\n      括追加契約以外之新增工作項目；其變更，得分別適用採購法第二\n      十二條第一項各款情形為之，但變更部分之累計金額應合計之。\n (二) 變更部分之累計金額，指契約價金變更之「加帳金額」及「減帳絕\n      對值」合計之累計金額。\n (三) 契約價金於變更後達查核金額之當次以後之變更，適用查核金額以\n      上採購之規定。\n (四) 「核准規定」欄，係指機關辦理契約變更或加減價之核准權責規定\n      ，其核准與否應考量契約變更、加減價及採限制性招標辦理之適法\n      性及妥適性。「核准」，由機關首長或其授權人員為之。\n (五) 機關辦理採購，其決標金額依政府採購法第六十一條 (於政府採購\n      公報刊登決標公告) 或第六十二條 (定期彙送決標資料) 規定傳輸\n      至本會資料庫後，如有契約變更或加減價之情形，致原決標金額增\n      加者，該增加之金額，亦應依上揭規定辦理公告、彙送。\n (六) 機關辦理工程採購，其須辦理契約變更而新增非屬原契約數量清單\n      內所列之工程項目者 (不包含漏列項目) ，該新增工程項目單價編\n      列方式，應以原預算相關單價分析資料為基礎，並考慮市場價格波\n      動情形。其底價訂定，並應符合政府採購法第四十六條規定。"],"mono":true}]},{"id":"FL019235","title":"履約保證金／保固保證金連帶保證書格式","short":"履約保固保證書格式","date":"民國96年02月12日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL019235","articles":[{"no":"1","label":"全文","ch":"","cat":"p","lines":["履約保證金／保固保證金連帶保證書格式","一、立連帶保證書人（保證人）＿＿＿＿＿＿銀行＿＿＿＿分行（以下簡","稱本行）茲因（得標廠商）＿＿＿＿＿＿＿＿（以下簡稱廠商）得標","（機關名稱）＿＿＿＿＿＿＿＿＿＿＿＿（以下簡稱機關）之（採購","標的）＿＿＿＿＿＿＿＿＿＿＿＿（以下簡稱採購），依招標文件（","含其變更或補充）規定應向機關繳納履約保證金／保固保證金新臺幣","（或外幣）（中文大寫）＿＿＿＿＿＿＿＿＿＿＿＿元整（ＮＴ＄／","外幣＿＿＿＿＿＿＿＿＿＿＿＿）（以下簡稱保證總額），該履約保","證金／保固保證金由本行開具本連帶保證書負連帶保證責任。","二、機關依招標文件／契約規定認定有不發還廠商履約保證金／保固保證","金之情形者，一經機關書面通知本行後，本行當即在前開保證總額內","，依機關書面通知所載金額如數撥付，絕不推諉拖延，且無需經過任","何法律或行政程序。本行亦絕不提出任何異議，並無民法第 745  條","之權利。保證金有依契約規定遞減者，保證總額比照遞減。","三、本保證書如有發生訴訟時，本行同意以機關所在地之法院為第一審管","轄法院。","四、本保證書有效期間自本保證書簽發日起，（一）至民國年月日止。（","二）至招標文件／契約規定之期限止。","五、本保證書正本 1  式 2  份，由機關及本行各執 1  份，副本 1  份","由廠商存執。","六、本保證書由本行負責人或代表人簽署，加蓋本行印信或經理職章後生","效。","連帶保證銀行：","負責人（或代表人）：","地址：","電話：","中        華        民        國        年        月        日"]}]},{"id":"GL000023","title":"公共工程施工廠商履約情形計分要點","short":"履約情形計分要點","date":"民國112年05月05日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000023","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["行政院公共工程委員會（以下簡稱工程會）為加強公共工程管理機制","，促使公共工程施工廠商依契約規定如期如質履約並重視執行績效，","及落實政府採購法第七十條對於品質管理、環境保護、施工安全衛生","之責任，特訂定本要點。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["政府機關、公立學校、公營事業（以下簡稱機關）辦理新臺幣一百五","十萬元以上之工程採購，其施工廠商履約情形計分作業（以下簡稱計","分作業），依本要點之規定。","前項所定工程金額係指採購標案預算金額，如為複數決標則為各","項預算金額；因契約變更致金額異動者，則為變更後之契約金額。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["機關依本要點辦理計分，基本分數為七十七分，滿分為一百分，其計","分指標、計分項目及計分基準如附表一，出具之計分表格式如附表二","。"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["機關應將涉及計分且已確認之施工廠商履約事實資料，於事實發生後","之次月十日前，登錄於工程會指定之資訊網路系統（以下簡稱標案管","理系統）。未依期限登錄者，應儘速補辦。","前項機關登錄之資料，如有錯誤或遺漏，經機關自行發現或接獲","施工廠商書面通知後，應即辦理更正作業。","前項施工廠商書面通知內容如涉及履約事實認定，依法得循異議","、申訴、履約爭議處理機制或其他法定程序辦理者，機關應告知該施","工廠商依各該法定程序辦理。"]},{"no":"5","label":"第五點","ch":"","cat":"p","lines":["機關於工程驗收完成後二十日內，應將完整之計分事實資料填報於標","案管理系統，並辦理計分作業。但有特殊情形必須延期者，得經機關","首長或其授權人員核准延期，並以書面通知施工廠商延期理由及預定","完成時間。","計分內容經機關承辦人員填報，及其內部指派之審查人員覆核後","，應循行政程序由機關首長或其授權人員核定，並以書面通知施工廠","商計分結果。","前項承辦人員辦理計分作業，及審查人員辦理覆核作業，完成後","應填具檢核表，如附表三。承辦人員及審查人員不得為同一人。"]},{"no":"6","label":"第六點","ch":"","cat":"p","lines":["施工廠商對於履約計分結果如認為不符合履約事實者，得於收到書面","通知後十日內以書面向機關提出意見。逾期提出者，機關如認為其意","見有理由時，仍得處理。","施工廠商所提意見不合理者，機關應通知該廠商維持原計分結果","；意見合理者，機關應修正計分。","機關應自收受書面意見次日起十五日內將處理結果以書面通知施","工廠商。機關逾期處理者，施工廠商得以書面向該機關之上級機關反","映，由上級機關通知該機關儘速辦理。","施工廠商對前項機關之處理結果仍有意見者，得於收到書面通知","後十五日內以書面向上級機關提出意見。逾期提出者，上級機關如認","為其意見有理由時，仍得處理。","施工廠商所提意見不合理者，上級機關應通知施工廠商維持原計","分結果；意見合理者，上級機關應通知機關修正計分。","上級機關應自收受書面意見次日起十五日內將處理結果以書面通","知施工廠商及機關。","處理意見作業流程如附表四。"]},{"no":"7","label":"第七點","ch":"","cat":"p","lines":["計分所依據之事實如有變更而須修正計分結果者，機關除依計分基準","調整計分外，應於標案管理系統註明修正原因，並循第五點規定程序","辦理，以書面通知施工廠商調整後之計分結果。"]},{"no":"8","label":"第八點","ch":"","cat":"p","lines":["機關審查人員辦理覆核，應依據工程執行相關資料，審查承辦人員於","標案管理系統所填報履約事實內容之完整性，並根據計分基準檢核各","計分項目之加減分及總分之計算是否正確。如發現有錯誤或遺漏情形","，應即要求承辦人員修正。"]},{"no":"9","label":"第九點","ch":"","cat":"p","lines":["機關承辦人員及審查人員，均應確認填報於標案管理系統之計分內容","，與書面通知施工廠商計分結果之內容，二者一致。"]},{"no":"10","label":"第十點","ch":"","cat":"p","lines":["個別工程於標案管理系統登錄之計分資料，開放機關及該工程施工廠","商上網查閱。","前項資料經機關確認有政府採購法所定之異議、申訴、調解、仲","裁或訴訟等爭議處理程序者，應予以註記；並於完成爭議處理程序後","登錄處理結果。","機關得將施工廠商之履約情形計分成績，列為辦理工程採購以最","有利標或評分及格最低標決標之履約績效評選或評分項目參考。"]},{"no":"11","label":"第十一點","ch":"","cat":"p","lines":["廠商以共同投標得標之工程，就簽約廠商合併辦理計分。"]},{"no":"12","label":"第十二點","ch":"","cat":"p","lines":["因不可歸責於廠商之事由，致工程全部解除或終止契約者，機關免","辦理計分作業。部分解除或終止契約，機關計分有困難者，亦同。"]}]},{"id":"FL038990","title":"公共工程履約權責劃分及管理應注意事項","short":"履約權責劃分注意事項","date":"民國91年12月11日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL038990","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["為釐清公共工程契約權責，減少履約爭議，以確保公共工程品質及工","程進度，爰彙整相關法令規定，訂定本注意事項。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["各機關研訂各階段公共工程採購契約時，應依政府採購法 (以下簡稱","採購法) 及相關法令規定辦理，並注意下列事項：","(一) 採購標的之範圍及工作項目應於契約中明定。","(二) 採購契約標的功能、效益或特性等需求、使用材料、機具設備規格","、施工規範、驗收標準等相關書圖文件須詳實明確。","(三) 契約雙方權利義務關係及廠商不履行契約或其他違反契約情事之處","理規定及程序應於契約中明定。","(四) 應考量與相關採購契約之關連性與必要性。","(五) 未具有專業採購能力之機關，得依採購法第四十條規定，洽由其他","具有專業能力之機關代辦採購。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["機關與各廠商間之履約權責應依相關法規及簽訂之契約確實履行，其","履約權責劃分得參採附表一及附表二定之。","圖表附件：附表一 機關與各廠商間辦理公共工程之履約權責劃分表（已委託專案管理廠商時）.pdf附表二 機關與各廠商間辦理公共工程之履約權責劃分表（未委託專案管理廠商時）.pdf"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["規劃、設計、監造或專案管理廠商履約如有缺失，應視下列情節追究","其責任：","(一) 民事責任：","1.有規劃設計錯誤、監造不實或管理不善，致機關遭受損害情事者","，依採購法第六十三條及契約規定，追究其規劃設計錯誤、監造","不實或管理不善之責任。","2.得標廠商有將原契約中應自行履行之全部或其主要部分，由其他","廠商代為履行 (轉包) 之情事者，依採購法第六十六條，機關得","解除契約、終止契約或沒收保證金，並得要求損害賠償；該轉包","廠商與得標廠商對機關負連帶履行及賠償責任。","3.承造人有建築法第六十條第二款，未按核准圖說施工，而監造人","認為合格，惟經直轄市、縣 (市)  (局) 主管建築機關勘驗不合","規定，必須修改、拆除、重建或補強情事者，承造人應負賠償責","任；承造人之專任工程人員及監造人負連帶責任。","4.有履約遲延情事者，依委託契約處罰逾期違約金或併終止、解除","契約。","5.有技術服務成果不符契約規定情事者，依採購法第七十二條規定","通知廠商限期改善、重作、減價收受。","6.監造單位所派監工人員未能有效達成品質要求時，機關得依契約","及公共工程施工品質管理作業要點 (以下簡稱品管要點) 第十點","規定，隨時撤換之。","7.符合契約所定全部或部分不發還保證金之情形者，不予發還其保","證金。","(二) 採購法責任：有採購法第一百零一條規定情事並經機關將其事實及","理由通知廠商者，依同法第一百零一條至第一百零三條規定，將該","廠商刊登政府採購公報列為不良廠商。","(三) 業務法規責任：參考附表三所列相關業務法規，如發現廠商有違反","者，函送各法規主管機關處理。","(四) 刑事責任：參考附表四所列刑事法規，如發現廠商有違反者，應移","送司法機關處理。","圖表附件：附表三 規劃、設計、監造及專案管理廠商相關業務法規之懲處規定.pdf附表四 廠商辦理公共工程相關刑事法規.pdf"]},{"no":"5","label":"第五點","ch":"","cat":"p","lines":["施工廠商履約如有缺失，應視下列情節追究其責任：","(一) 民事責任：","1.得標廠商有將原契約中應自行履行之全部或其主要部分，由其他","廠商代為履行 (轉包) 之情事者，依採購法第六十六條，機關得","解除契約、終止契約或沒收保證金，並得要求損害賠償；該轉包","廠商與得標廠商對機關負連帶履行及賠償責任。","2.有履約遲延情事者，依契約規定處罰逾期違約金或併終止、解除","契約。","3.有查驗或驗收不符契約規定情事者，依採購法第七十二條規定通","知廠商限期改善、拆除、重作、減價收受。","4.符合契約所定全部或部分不發還保證金之情形者，不予發還其保","證金。","5.有建築法第六十條規定，施工不合規定或擅自施工等肇致起造人","蒙受損失情事者，由承造人負賠償責任。","6.廠商有品管要點第七點及契約所定得限期更換工地負責人及品管","人員之情事者，機關得依品管要點第四點、第七點及契約規定，","通知廠商限期更換工地負責人及品管人員。","7.廠商有施工品質不良或其他違反品管要點之情事，得依契約及品","管要點第十五點規定，暫停發放工程估驗款或為適當之處置。","(二) 採購法責任：有採購法第一百零一條規定情事並經機關將其事實及","理由通知廠商者，依同法第一百零一條至第一百零三條規定，將該","廠商刊登政府採購公報列為不良廠商。","(三) 業務法規責任：","1.施工廠商：參考附表五所列相關業務法規，如發現廠商有違反者","，函送各法規主管機關處理。","2.營造業專任工程人員：參考附表三所列相關業務法規，如發現其","有違反者，函送各法規主管機關處理。","(四) 刑事責任：參考附表四所列刑事法規，如發現廠商有違反者，應移","送司法機關處理。","圖表附件：附表五 施工廠商相關業務法規之懲處規定.pdf"]},{"no":"6","label":"第六點","ch":"","cat":"p","lines":["機關與廠商因履約而生爭議者，應依法令及契約規定，考量公共利益","及公平合理，本誠信和諧，盡力協調解決之。其未能達成協議者，得","以下列方式處理之：","(一) 依採購法第八十五條之一規定向採購申訴審議委員會申請調解。","(二) 依仲裁法規定向仲裁機構提付仲裁。","(三) 提起民事訴訟。","(四) 依契約或雙方合意之其他方式處理。"]},{"no":"7","label":"第七點","ch":"","cat":"p","lines":["機關發現採購人員有違反採購人員倫理準則規定時，應依該準則第十","二條規定採取下列必要之處置：","(一) 依公務員服務法、公務員懲戒法、公務人員考績法及其他相關規定","處置。其觸犯刑事法令如附表六者，應移送司法機關處理。","(二) 調離與採購有關之職務。","(三) 施予與採購有關之訓練。","依採購人員倫理準則第十三條規定，採購人員有違反該準則之行為，","其主管知情不予處置者，應視情節輕重，依法懲處。","圖表附件：附表六 機關人員辦理公共工程相關刑事法規.pdf"]},{"no":"8","label":"第八點","ch":"","cat":"p","lines":["本注意事項如有未盡事宜，依相關法令、各機關相關作業規定及契約","約定辦理。"]}]},{"id":"FL022977","title":"公共工程廠商延誤履約進度處理要點","short":"延誤履約進度處理要點","date":"民國91年11月22日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=FL022977","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["為有效處理公共工程廠商延誤履約進度案件，提升工程執行績效，特","訂定本要點。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["本要點所稱廠商延誤履約進度案件，依契約文件之規定認定。契約文","件未規定者，為公共工程因可歸責於廠商之事由，致施工進度落後百","分之五以上者。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["機關處理廠商延誤履約進度案件，得視機關與廠商所訂契約 (以下簡","稱契約) 之規定及廠商履約情形，依下列方式之一處理：","(一) 通知廠商限期改善。","(二) 通知連帶保證廠商履約。","(三) 以監督付款方式，由分包廠商繼續施工。","(四) 終止或解除契約，重行招標。","(五) 其他經機關認定並訂明於契約之方式。"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["機關為前點處理方式之決定或採擇，應就下列事項綜合評估：","(一) 當時工程之進展情形。","(二) 該工程對整體或後續工程可能產生之影響。","(三) 該工程之急迫性。","(四) 廠商之履約能力及意願。","(五) 機關所掌握之未付工程款、保留款及履約保證金等額度。","(六) 處理所需時間及額外成本多寡。","(七) 可能造成問題之複雜程度及發生糾紛之可能性。","(八) 與公共利益之相關性。","(九) 其他特殊考量事項。"]},{"no":"5","label":"第五點","ch":"","cat":"p","lines":["廠商延誤履約進度案件，契約訂有予以廠商限期改善規定者，機關應","依契約規定通知廠商限期改善；契約訂有連帶保證廠商者，並通知連","帶保證廠商。","如因可歸責於廠商之事由，致進度落後達一定程度，且經通知限期改","善後未積極改善者，機關得依契約規定暫停核發估驗計價款。","前項情形，如廠商提報趕工計畫經機關核可並據以實施後，其進度落","後情形經機關認定已有改善者，機關得恢復核發估驗計價款。"]},{"no":"6","label":"第六點","ch":"","cat":"p","lines":["契約訂有連帶保證廠商者，機關除應依押標金保證金暨其他擔保作業","辦法第三十三條之三規定辦理外，契約應載明連帶保證廠商之權利、","義務與責任及連帶保證廠商之更換時機。"]},{"no":"7","label":"第七點","ch":"","cat":"p","lines":["契約訂有連帶保證廠商責任規定者，如廠商延誤履約進度，經機關評","估宜由連帶保證廠商接辦時，機關應依契約規定通知連帶保證廠商履","約。","連帶保證廠商經機關通知後，於期限內未依規定履約時，機關應依契","約規定，向連帶保證廠商請求賠償。"]},{"no":"8","label":"第八點","ch":"","cat":"p","lines":["機關通知連帶保證廠商履約時，得考量公共利益及連帶保證廠商申請","之動員進場施工時間，重新核定工期；連帶保證廠商如有異議，應循","政府採購法第八十五條之一所定之履約爭議處理機制解決。"]},{"no":"9","label":"第九點","ch":"","cat":"p","lines":["連帶保證廠商接辦後，應就下列事項釐清或確認，並以書面提報機關","同意：","(一) 各項工作銜接之安排。","(二) 原分包廠商後續事宜之處理。","(三) 工程預付款扣回方式。","(四) 已施作未請領工程款廠商是否同意由其請領；同意者，其證明文件","。","(五) 工程款請領發票之開立及撥付方式。","(六) 其他應澄清或確認之事項。"]},{"no":"10","label":"第十點","ch":"","cat":"p","lines":["廠商延誤履約進度案件，如施工進度已達百分之七十五以上，機關得","經評估後，同意廠商及分包廠商共同申請採監督付款方式，由分包廠","商繼續施工。"]},{"no":"11","label":"第十一點","ch":"","cat":"p","lines":["廠商依前點規定申請採監督付款時，應先與分包廠商簽訂協議書，","將協議書依公證法送經認證；其有連帶保證廠商者，並應先徵得連","帶保證廠商同意。","前項協議書，應載明下列事項：","(一) 繼續施作工程之範圍。","(二) 廠商同意將繼續施作之各期工程估驗款之全部或一部債權，讓與","分包廠商。","(三) 廠商與分包廠商雙方同意，就分包廠商繼續施作部分，對機關連","帶負瑕疵擔保責任。","(四) 繼續施作部分工料款之支付估算、支付名冊、支付方式及工程款","支付明細表。","(五) 廠商已施作尚未領取工程款之支付方式。","(六) 工程履約保證金、差額保證金、物價指數調整費、估驗計價保留","款、驗收後尾款、其他擔保等發還或支付方式。","(七) 工程保固責任歸屬及其保固金繳交、退還方式。","(八) 工程款請領發票由廠商或分包廠商開立。","(九) 協議之生效日期。"]},{"no":"12","label":"第十二點","ch":"","cat":"p","lines":["機關於審核監督付款之申請時，應注意下列事項：","(一) 施工進度是否已達第十點所定百分之七十五以上。","(二) 各分包廠商是否具有繼續施工之能力。","(三) 廠商及分包廠商是否已提出經認證之協議書。","(四) 有連帶保證廠商者，是否已依第十一點第一項規定徵得連帶保證","廠商同意。","(五) 廠商之其他債權人是否已聲請強制執行，致監督付款無法辦理。"]},{"no":"13","label":"第十三點","ch":"","cat":"p","lines":["監督付款之付款程序如下：","(一) 廠商或分包廠商依契約及協議書規定請領工程款，並檢附工程款","支付明細表及廠商或分包廠商所開立相關請款證明文件，經機關","核實後，據以付款。","(二) 廠商已領預付款者，應先予以扣除。","(三) 機關付款時，應依協議書所定付款方式，撥付廠商或 (及) 分包","廠商。"]},{"no":"14","label":"第十四點","ch":"","cat":"p","lines":["監督付款有下列情形之一時，應予停辦：","(一) 法院通知機關執行扣押命令，致影響監督付款時。","(二) 分包廠商經機關認定無法繼續履約，或施工進度落後情形未積極","改善者。","監督付款，於支付工程尾款後停止辦理；如有剩餘款，除協議書另","有約定者外，應撥付廠商。"]},{"no":"15","label":"第十五點","ch":"","cat":"p","lines":["機關應於招標文件中訂明因廠商違約，機關得終止或解除契約之規","定，其內容應載明下列事項：","(一) 機關得通知廠商終止或解除契約之條件。","(二) 終止或解除契約後，廠商應配合辦理之事項包括負責遣散工人、","負責維護工程至機關接管為止，並配合機關辦理結算。","(三) 終止或解除契約後，機關得採取之措施。","(四) 終止或解除契約後，工程款之處理原則。","(五) 終止或解除契約後，機關所受損害之求償等。"]},{"no":"16","label":"第十六點","ch":"","cat":"p","lines":["機關辦理終止或解除契約時，應注意下列事項：","(一) 自通知廠商終止或解除契約日起，停發廠商之工程款，包括尚未","領取之工程估驗款及全部保留款等款項，且依契約規定不發還廠","商之履約保證金。","(二) 辦理工地接管時，應嚴格管理廠商與其分包廠商人員、車輛之進","出，必要時得洽商警政機關或聘僱保全人員協助辦理。","(三) 對於廠商運至工地之合格器材，應詳如清點，並依契約規定辦理","。","(四) 對於已施作完成之工作項目及數量，應會同監造單位及廠商辦理","結算，並拍照存證；廠商不會同辦理時，機關得逕行辦理結算。","必要時，得洽請公正、專業之鑑定機構協助辦理。"]},{"no":"17","label":"第十七點","ch":"","cat":"p","lines":["機關辦理重行招標之招標文件，應訂明原契約保證、保險與保固責","任之延續或更新、未完成工程項目之銜接及工期之起算等事項。"]},{"no":"18","label":"第十八點","ch":"","cat":"p","lines":["工程施工進度達百分之九十五以上，而落後未達百分之五者，得準","用本要點之規定處理。"]}]},{"id":"GL000077","title":"採購契約要項","short":"採購契約要項","date":"民國108年08月06日","kind":"行政規則","multi":false,"url":"https://lawweb.pcc.gov.tw/LawContent.aspx?id=GL000077","articles":[{"no":"1","label":"第一點","ch":"","cat":"p","lines":["(訂定依據及目的)","本要項依政府採購法 (以下簡稱本法) 第六十三條第一項規定訂定之","。","本要項內容，由機關依採購之特性及實際需要擇訂於契約。"]},{"no":"2","label":"第二點","ch":"","cat":"p","lines":["(契約得載明之事項)","機關得視採購之特性及實際需要，就下列事項擇定後載明於契約：","(一) 機關及廠商之名稱、地址及電話。","(二) 機關及廠商聯絡人之姓名及職稱。","(三) 契約所用名詞定義。","(四) 契約所含文件。","(五) 廠商工作事項或應給付標的。","(六) 機關辦理事項。","(七) 契約所用文字。","(八) 度量衡制。","(九) 簽約日期。","(十) 得標廠商應自行履行之主要部分及分包事項。","(十一) 履約標的之產地。","(十二) 證照之取得。","(十三) 履約場所管理、進度管理、環境保護、工作安全與衛生、工地環","境清潔與維護、交通維持或工作界面配合等事項。","(十四) 品質管理。","(十五) 履約監督。","(十六) 災害處理。","(十七) 履約標的須標示之文字或符號。","(十八) 履約處所或財物之收受地點及時間。","(十九) 運輸方式。","(二十) 包裝方式。","(二十一) 當事人雙方通知方式。","(二十二) 契約變更。","(二十三) 契約之轉讓。","(二十四) 查驗、測試或驗收之程序及期限。","(二十五) 履約標的之項目、數量、單價、分項金額及總價。","(二十六) 付款條件。","(二十七) 廠商應提出之文件。","(二十八) 保證金及其他擔保之種類、額度、繳納、不發還、退還及終止","等事項。","(二十九) 契約價金依物價指數調整。","(三十) 稅捐、規費及關稅之負擔。","(三十一) 履約期限。","(三十二) 逾期違約金。","(三十三) 保固或維修之期限及責任。","(三十四) 零配件供應。","(三十五) 權利及責任。","(三十六) 保險之種類、額度、投保及理賠。","(三十七) 契約之終止、解除或暫停執行。","(三十八) 履約爭議之處理。","(三十九) 準據法。","(四十) 其他與履約有關之事項。"]},{"no":"3","label":"第三點","ch":"","cat":"p","lines":["(契約文件)","契約文件包括下列內容：","(一) 契約本文及其變更或補充。","(二) 招標文件及其變更或補充。","(三) 投標文件及其變更或補充。","(四) 契約附件及其變更或補充。","(五) 依契約所提出之履約文件或資料。","前項文件，包括以書面、錄音、錄影、照相、微縮、電子數位資","料或樣品等方式呈現之原件或複製品。"]},{"no":"4","label":"第四點","ch":"","cat":"p","lines":["(契約文件之效力及優先順序)","契約所包括之各種文件，應明定其效力及優先順序。"]},{"no":"5","label":"第五點","ch":"","cat":"p","lines":["(契約文字)","契約文字應以中文書寫，其與外文文意不符者，除契約另有規定者外","，以中文為準。但下列情形得以招標文件或契約所允許之外文為準：","(一) 向國際組織、外國政府或其授權機構辦理之採購。","(二) 特殊技術或材料之圖文資料。","(三) 以限制性招標辦理之採購。","(四) 依本法第一百零六條規定辦理之採購。","(五) 國際組織、外國政府或其授權機構、公會或商會所出具之文件。","(六) 其他經機關認定確有必要者。"]},{"no":"6","label":"第六點","ch":"","cat":"p","lines":["(度量衡單位)","契約文件所使用之度量衡單位，除契約另有規定者外，以公制為原則","。"]},{"no":"7","label":"第七點","ch":"","cat":"p","lines":["(契約簽署)","簽約日期，除招標文件另有規定者外，指雙方共同完成簽約之日。","契約應備正本由機關與廠商各執乙份，並各依規定貼用印花稅票","；副本若干份。"]},{"no":"8","label":"第八點","ch":"","cat":"p","lines":["(分包廠商)","廠商不得以不具備履行契約分包事項能力或未依法登記或設立之廠商","為分包廠商。對於分包廠商履約之部分，得標廠商仍應負完全責任。","分包契約報備於機關者，亦同。","廠商擬分包之項目及分包廠商，機關得予審查。"]},{"no":"9","label":"第九點","ch":"","cat":"p","lines":["(許可文件之取得)","採購標的之進出口、供應、興建或使用涉及政府規定之許可證、執照","或其他許可文件者，依文件核發對象，由機關或廠商分別負責取得。","但屬機關取得者，機關得於契約規定由廠商代為取得，並由機關負擔","必要之費用。"]},{"no":"10","label":"第十點","ch":"","cat":"p","lines":["(履約之協調配合)","二以上得標廠商同時為機關履約，其履約事項互有關連或須互相配合","者，各得標廠商應本合作精神協調配合，避免因一方之作為而對他方","或整體履約進度造成不利影響。","機關提供之履約場所，各得標廠商有共同使用之需要者，廠商不","得拒絕其他廠商共同使用。"]},{"no":"11","label":"第十一點","ch":"","cat":"p","lines":["(財物之保全)","機關將其所有之財物運交廠商處所加工、改善或維修者，該財物之","滅失、減損或遭侵占時，廠商應負賠償責任。"]},{"no":"12","label":"第十二點","ch":"","cat":"p","lines":["(廠商工安責任)","廠商應對其工地作業及施工方法之適當性、可靠性及安全性負完全","責任。","廠商之工地作業有發生意外事件之虞時，廠商應立即採取防範","措施。發生意外時，應立即採取搶救、復原、重建及對機關與第三","人之賠償等措施。"]},{"no":"13","label":"第十三點","ch":"","cat":"p","lines":["(保管責任)","廠商於工程完成前應對進行中之該工程與其材料、施工機具及施工","場所之設施負保管責任。","工程進行中及竣工時，廠商應負責清理工地並清除施工所產生","垃圾。"]},{"no":"14","label":"第十四點","ch":"","cat":"p","lines":["(不適任人員之撤換)","廠商履約人員有不適任之情形者，機關得通知廠商撤換。廠商不得","拒絕。"]},{"no":"15","label":"第十五點","ch":"","cat":"p","lines":["(施工管理)","廠商履約施工時，應避免妨礙鄰近交通、占用道路、損害公私財物","、汙染環境或妨礙民眾生活安寧。其有違反致機關或其他第三人受","有損害者，應由廠商負責賠償。"]},{"no":"16","label":"第十六點","ch":"","cat":"p","lines":["(採購標的送達地點及時間)","採購標的之送達地點及履約處所，應於契約內訂明。","機關於前項送達地點收受採購標的之時間，應於契約內訂明。","其未訂明者，應於機關上班時間為之。"]},{"no":"17","label":"第十七點","ch":"","cat":"p","lines":["(包裝方式)","機關得視採購之特性及實際需要，就下列事項擇定採購標的之包裝","方式，於契約內訂明：","(一) 防潮、防水、防震、防破損、防變質、防鏽蝕、防曬、防鹽漬、","防污或防碰撞等。","(二) 恆溫、冷藏、冷凍或密封。","(三) 每單位包裝之重量、體積或數量。","(四) 包裝材料。","(五) 包裝內外應標示之文字或標誌或應隨附之文件。","(六) 其他必要之方式。"]},{"no":"18","label":"第十八點","ch":"","cat":"p","lines":["(限期改善)","機關於廠商履約中，若可預見其履約瑕疵，或其有其他違反契約之","情事者，得通知廠商限期改善。","廠商不於前項期限內，依照改善或履行者，機關得採行下列措","施：","(一) 使第三人改善或繼續其工作，其危險及費用，均由廠商負擔。","(二) 終止或解除契約，並得請求損害賠償。"]},{"no":"19","label":"第十九點","ch":"","cat":"p","lines":["(相互通知之方式)","機關與廠商相互間之通知，除契約另有規定者外，得以書面文件、","信函、傳真或電子郵件方式送達他方所指定之人員或處所為之。","前項通知，於送達他方或通知所載生效日生效，並以二者中較","後發生者為準。"]},{"no":"20","label":"第二十點","ch":"","cat":"p","lines":["(機關通知廠商變更契約)","機關於必要時得於契約所約定之範圍內通知廠商變更契約。除契約","另有規定外，廠商於接獲通知後應向機關提出契約標的、價金、履","約期限、付款期程或其他契約內容須變更之相關文件。","廠商於機關接受其所提出須變更之相關文件前，不得自行變更","契約。除機關另有請求者外，廠商不得因第一項之通知而遲延其履","約責任。","機關於接受廠商所提出須變更之事項前即請求廠商先行施作或","供應，其後未依原通知辦理契約變更或僅部分辦理者，應補償廠商","所增加之必要費用。"]},{"no":"21","label":"第二十一點","ch":"","cat":"p","lines":["(廠商要求變更契約)","契約約定之採購標的，其有下列情形之一者，廠商得敘明理由，","檢附規格、功能、效益及價格比較表，徵得機關書面同意後，以","其他規格、功能及效益相同或較優者代之。但不得據以增加契約","價金。其因而減省廠商履約費用者，應自契約價金中扣除：","(一) 契約原標示之廠牌或型號不再製造或供應。","(二) 契約原標示之分包廠商不再營業或拒絕供應。","(三) 因不可抗力原因必須更換。","(四) 較契約原標示者更優或對機關更有利。","(五) 契約所定技術規格違反本法第二十六條規定。","屬前項第四款情形，而有增加經費之必要，其經機關綜合評","估其總體效益更有利於機關者，得不受前項但書限制。"]},{"no":"22","label":"第二十二點","ch":"","cat":"p","lines":["(契約所定事項無效之處理)","契約所定事項如有違反法令或無法執行之部分，該部分無效。但","除去該部分，契約亦可成立者，不影響其他部分之有效性。","前項無效之部分，機關及廠商必要時得依契約原定目的更正","之。"]},{"no":"23","label":"第二十三點","ch":"","cat":"p","lines":["(契約之轉讓)","廠商不得將契約之部分或全部轉讓予他人。但因公司分割、銀行","或保險公司履行連帶保證、銀行因權利質權而生之債權或其他類","似情形致有轉讓必要，經機關書面同意者，不在此限。"]},{"no":"24","label":"第二十四點","ch":"","cat":"p","lines":["(契約變更)","契約變更，非經機關及廠商雙方之合意，作成書面紀錄，並簽名","或蓋章者，無效。"]},{"no":"25","label":"第二十五點","ch":"","cat":"p","lines":["(查驗或驗收程序及期限)","工程及財物採購契約，應訂明採購標的之查驗或驗收程序及期限","。","前項規定，於勞務採購契約準用之。"]},{"no":"26","label":"第二十六點","ch":"","cat":"p","lines":["(履約之查驗)","工程採購契約應對重點項目訂定檢查程序及檢驗標準，廠商並應","執行品質管理、環境保護、施工安全衛生之責任。","財物或勞務採購需經一定履約過程，而非以現成財物或勞務","供應者，準用前項之規定。"]},{"no":"27","label":"第二十七點","ch":"","cat":"p","lines":["(查驗作業方式及費用)","契約應訂明機關或其指定之代表，就廠商履約情形，得辦理之查","驗、測試或檢驗。","契約得訂明廠商應免費提供機關依契約辦理查驗、測試或檢","驗所必須之設備及資料。","契約規定以外之查驗、測試或檢驗，其結果不符合契約規定","者，由廠商負擔所生之費用；結果符合者，由機關負擔費用。","查驗、測試或檢驗結果不符合契約規定者，機關得予拒絕，","廠商應免費改善、拆除、重作、退貨或換貨。","廠商不得因機關辦理查驗、測試或檢驗，而免除其依契約所","應履行或承擔之責任，及費用之負擔。","機關就廠商履約標的為查驗、測試或檢驗之權利，應不受該","標的曾通過其他查驗、測試或檢驗之限制。"]},{"no":"28","label":"第二十八點","ch":"","cat":"p","lines":["(機關設備或材料之檢查及保管)","機關提供設備或材料供廠商履約者，廠商應於收受時作必要之檢","查。其經廠商收受後之滅失或減損，由廠商負責。"]},{"no":"29","label":"第二十九點","ch":"","cat":"p","lines":["(查驗或驗收前之測試)","機關辦理查驗或驗收，得於契約規定廠商就履約標的於一定場所","、期間及條件下之試車、試運轉或試用等測試程序，以作為查驗","或驗收之用。","前項試車、試運轉或試用所需費用，除契約另有規定外，由","廠商負擔。"]},{"no":"30","label":"第三十點","ch":"","cat":"p","lines":["(契約價金之記載)","契約應記載總價。無總價者應記載項目、單價及金額或數量上限。","契約總價曾經減價而確定，其所組成之各單項價格未約定調整","方式者，視同就各單項價格依同一減價比率調整。投標文件中報價","之分項價格合計數額與總價不同者，亦同。"]},{"no":"31","label":"第三十一點","ch":"","cat":"p","lines":["(契約價金之給付)","契約價金之給付，得為下列方式之一，由機關載明於契約：","(一) 依契約總價給付。","(二) 依實際施作或供應之項目及數量給付。","(三) 部分依契約標示之價金給付，部分依實際施作或供應之項目及","數量給付。","(四) 其他必要之方式。"]},{"no":"32","label":"第三十二點","ch":"","cat":"p","lines":["(契約價金之調整)","契約價金係以總價決標，且以契約總價給付，而其履約有下列情","形之一者，得調整之。但契約另有規定者，不在此限。","(一) 因契約變更致增減履約項目或數量時，就變更之部分加減賬結","算。","(二) 工程之個別項目實作數量較契約所定數量增減達百分之五以上","者，其逾百分之五之部分，變更設計增減契約價金。未達百分","之五者，契約價金不予增減。","(三) 與前二款有關之稅捐、利潤或管理費等相關項目另列一式計價","者，依結算金額與原契約金額之比率增減之。"]},{"no":"33","label":"第三十三點","ch":"","cat":"p","lines":["(工程數量清單之效用)","工程採購契約所附供廠商投標用之數量清單，其數量為估計數，","不應視為廠商完成履約所須供應或施作之實際數量。"]},{"no":"34","label":"第三十四點","ch":"","cat":"p","lines":["(契約價金給付條件)","下列契約價金給付條件，應載明於契約。","(一) 廠商請求給付前應完成之履約事項。","(二) 廠商應提出之文件。","(三) 給付金額。","(四) 給付方式。","(五) 給付期限。","契約價金依履約進度給付者，應訂明各次給付所應達成之履","約進度及廠商應提出之履約進度報告，由機關核實給付。"]},{"no":"35","label":"第三十五點","ch":"","cat":"p","lines":["(廠商請領契約價金之文件)","機關得依採購之特性及實際需要，於契約中明定廠商請領契約價","金時應提出之文件。"]},{"no":"36","label":"第三十六點","ch":"","cat":"p","lines":["(繳納預付款還款保證之情形)","機關得視需要，於契約中明定廠商得支領預付款之情形，廠商並","應先提出預付款還款保證。"]},{"no":"37","label":"第三十七點","ch":"","cat":"p","lines":["(契約價金應含之稅捐、規費及強制性保險費)","機關得視需要，於契約中明定契約價金應含廠商及其人員依中華","民國法令應繳納之稅捐、規費及強制性保險之保險費。但中華民","國以外其他國家或地區之稅捐、規費或關稅，由廠商負擔。"]},{"no":"38","label":"第三十八點","ch":"","cat":"p","lines":["(契約價金因政府行為之調整)","廠商履約遇有下列政府行為之一，致履約費用增加或減少者，契","約價金得予調整：","(一) 政府法令之新增或變更。","(二) 稅捐或規費之新增或變更。","(三) 政府管制費率之變更。","前項情形，屬中華民國政府所為，致履約成本增加者，其所","增加之必要費用，由機關負擔；致履約成本減少者，其所減少之","部分，得自契約價金中扣除。","其他國家政府所為，致履約成本增加或減少者，契約價金不","予調整。"]},{"no":"39","label":"第三十九點","ch":"","cat":"p","lines":["(契約價金依物價指數調整)","契約價金依契約規定得依物價、薪資或其指數調整者，應於契約","載明下列事項：","(一) 得調整之項目及金額。","(二) 調整所依據之物價、薪資或其指數及基期。","(三) 得調整及不予調整之情形。","(四) 調整公式。","(五) 廠商應提出之調整數據及佐證資料。","(六) 管理費及利潤不予調整。","(七) 逾履約期限之部分，以契約規定之履約期限當時之物價、薪資","或其指數為當期資料。但逾期履約係可歸責於機關者，不在此","限。"]},{"no":"40","label":"第四十點","ch":"","cat":"p","lines":["(以成本加公費法計算契約價金)","契約價金以成本加公費法計算者，應於契約訂明下列事項：","(一) 廠商應記錄各項費用並提出經機關認可之憑證，機關並得至廠商","處所辦理查核。","(二) 成本上限及逾上限時之處理。"]},{"no":"41","label":"第四十一點","ch":"","cat":"p","lines":["(期約、賄賂等不法給付之處理)","廠商不得對機關人員或受機關委託之廠商人員給予期約、賄賂、","佣金、比例金、仲介費、後謝金、回扣、餽贈、招待或其他不正","利益。分包廠商亦同。","違反前項規定者，機關得終止或解除契約，並將二倍之不正","利益自契約價款中扣除。未能扣除者，通知廠商限期給付之。"]},{"no":"42","label":"第四十二點","ch":"","cat":"p","lines":["(第三人檢驗之費用)","契約規定廠商履約標的應經第三人檢驗者，其檢驗所需費用，除","契約另有規定外，由廠商負擔。"]},{"no":"43","label":"第四十三點","ch":"","cat":"p","lines":["(履約期限之訂定)","履約期限之訂定，得為下列方式之一，由機關載明於契約：","(一) 自決標日、簽約日或機關通知日之次日起一定期間內完成契約","規定之事項。","(二) 於預先訂明之期限前完成契約規定之事項。","(三) 自廠商收到機關之信用狀、預付款或其他類似情形之次日起一","定期間內完成契約規定之事項。","(四) 就履約各重要階段或分批供應之部分分別訂明其期限。","(五) 其他約定之方式。"]},{"no":"44","label":"第四十四點","ch":"","cat":"p","lines":["(履約期間之計算)","履約期間之計算，除契約另有規定者外，得為下列方式之一，由","機關載明於契約：","(一) 以限期完成者。星期例假日、國定假日或其他休息日均應計入","。","(二) 以日曆天計者。星期例假日、國定假日或其他休息日，是否計","入，應於契約中明定。","(三) 以工作天計者。星期例假日、國定假日或其他休息日，均應不","計入。","前項履約期間，因不可抗力或有不可歸責於廠商之事由者，","得延長之；其事由未達半日者，以半日計；逾半日未達一日者，","以一日計。"]},{"no":"45","label":"第四十五點","ch":"","cat":"p","lines":["(逾期違約金之計算)","逾期違約金，為損害賠償額預定性違約金，以日為單位，擇下列","方式之一計算，載明於契約，並訂明扣抵方式：","(一) 定額。","(二) 契約金額之一定比率。","前項違約金，以契約價金總額之百分之二十為上限。","第一項扣抵方式，機關得自應付價金中扣抵；其有不足者，","得通知廠商繳納或自保證金扣抵。"]},{"no":"46","label":"第四十六點","ch":"","cat":"p","lines":["(不計逾期違約金之情形)","廠商履約有下列情形之一者，得檢具事證，以書面通知機關。機","關得審酌其情形後，延長履約期限，不計逾期違約金：","(一) 屬不可抗力所致。","(二) 不可歸責於廠商之契約變更或機關通知廠商停工。","(三) 機關應提供予廠商之資料、器材、場所或應採行之審查或同意","等配合措施，未依契約規定提供或採行。","(四) 可歸責於與機關有契約關係之其他廠商之遲延。","(五) 其他可歸責於機關或不可歸責於廠商之事由。"]},{"no":"47","label":"第四十七點","ch":"","cat":"p","lines":["(分段完工使用或移交之逾期違約金)","契約訂有分段進度及最後履約期限，屬分段完工使用或移交者，","其逾期違約金之計算原則如下：","(一) 未逾分段進度但逾最後履約期限者，扣除已分段完工使用或移","交部分之金額，計算逾最後履約期限之違約金。","(二) 逾分段進度但未逾最後履約期限者，計算逾分段進度之違約金","。","(三) 逾分段進度且逾最後履約期限者，分別計算違約金。但逾最後","履約期限之違約金，應扣除已分段完工使用或移交部分之金額","計算之。","(四) 分段完工期限與其他採購契約之進行有關者，逾分段進度，得","個別計算違約金，不受前款但書限制。"]},{"no":"48","label":"第四十八點","ch":"","cat":"p","lines":["(全部完工後使用或移交之逾期違約金)","契約訂有分段進度及最後履約期限，屬全部完工後使用或移交者","，其逾期違約金之計算原則如下：","(一) 未逾分段進度但逾最後履約期限者，計算逾最後履約期限之違","約金。","(二) 逾分段進度但未逾最後履約期限，其有逾分段進度已收取之違","約金者，於未逾最後履約期限後發還。","(三) 逾分段進度且逾最後履約期限，其有逾分段進度已收取之違約","金者，於計算逾最後履約期限之違約金時應予扣抵。","(四) 分段完工期限與其他採購契約之進行有關者，逾分段進度，得","計算違約金，不受第二款及第三款之限制。"]},{"no":"49","label":"第四十九點","ch":"","cat":"p","lines":["(不可抗力原因)","機關及廠商因天災或事變等不可抗力或不可歸責於契約當事人之","事由，致未能依時履約者，得展延履約期限；不能履約者，得免","除契約責任。"]},{"no":"50","label":"第五十點","ch":"","cat":"p","
