<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>政府採購法 圖解總表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1c1a17;--ink3:#7c766c;--line:#e3ded3;--accent:#8a1f2b;
  --sans:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--panel:#1e2229;--ink:#e9e6e0;--ink3:#8a857c;
  --line:#2c313a;--accent:#e2707c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.75}
header{max-width:960px;margin:0 auto;padding:34px 22px 10px}
header h1{margin:0;font-size:25px;font-weight:900;letter-spacing:.02em}
header p{margin:7px 0 0;font-size:12.5px;color:var(--ink3);line-height:1.9}
main{max-width:960px;margin:0 auto;padding:14px 22px 80px;display:flex;flex-direction:column;gap:26px}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px 20px}
figure h2{margin:0 0 13px;font-size:15.5px;font-weight:900;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
figure h2 .n{font:900 11px/1 ui-monospace,Consolas,monospace;color:#fff;background:var(--accent);
  padding:5px 6px;border-radius:5px;letter-spacing:.06em}
figure h2 .cat{font-size:11px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);padding:2px 9px;border-radius:999px}
.wrap{overflow-x:auto;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:16px 14px}
figcaption{font-size:12.5px;line-height:1.85;color:var(--ink3);margin-top:11px;padding-left:11px;
  border-left:3px solid var(--accent)}
footer{max-width:960px;margin:0 auto;padding:0 22px 60px;font-size:11.5px;color:var(--ink3);line-height:1.9}
@media print{
  body{background:#fff}
  header{padding-top:0}
  main{gap:0}
  figure{break-inside:avoid;page-break-inside:avoid;border:none;border-bottom:1px solid #ccc;
    border-radius:0;padding:14px 0;margin-bottom:0}
  .wrap{overflow:visible;border:none;background:none;padding:0}
}
</style>
</head>
<body>
<header>
  <h1>政府採購法 · 圖解總表</h1>
  <p>九張流程圖，一個分類一張，涵蓋金額級距、招標決策、等標期、比減價格、驗收時程、爭議雙軌、停權流程、組織關係與 GPA 適用判斷。<br>
     可直接列印（每張圖不會被切斷）。圖為學習整理，法律效果請以法規原文為準。</p>
</header>
<main>
<figure>

246" y="223" text-anchor="end" font-size="11.5" fill="currentColor">得向申訴會提起申訴</text><text x="246" y="235" text-anchor="end" font-size="9" fill="currentColor" opacity="0.5">採購法 §76</text><rect x="432" y="211" width="430" height="18" rx="9" fill="var(--accent)" fill-opacity=".16" stroke="var(--accent)" stroke-opacity=".5"/><circle cx="441" cy="220" r="3.5" fill="var(--accent)"/><text x="246" y="254" text-anchor="end" font-size="11.5" fill="currentColor">上級機關派員監辦</text><text x="246" y="266" text-anchor="end" font-size="9" fill="currentColor" opacity="0.5">採購法 §12</text><rect x="566" y="242" width="296" height="18" rx="9" fill="var(--accent)" fill-opacity=".16" stroke="var(--accent)" stroke-opacity=".5"/><circle cx="575" cy="251" r="3.5" fill="var(--accent)"/><text x="246" y="285" text-anchor="end" font-size="11.5" fill="currentColor">逐年提報使用情形及效益分析</text><text x="246" y="297" text-anchor="end" font-size="9" fill="currentColor" opacity="0.5">採購法 §111</text><rect x="706" y="273" width="156" height="18" rx="9" fill="var(--accent)" fill-opacity=".16" stroke="var(--accent)" stroke-opacity=".5"/><circle cx="715" cy="282" r="3.5" fill="var(--accent)"/></svg></div>
  <figcaption>四個門檻把採購切成五段。每一條橫槓從義務「開始適用」的那一點畫起，往右延伸——愈高金額，累積的程序義務愈多。</figcaption>
</figure>

  <figcaption>第一個岔路是「有沒有達到公告金額」，第二個岔路才是招標方式。未達公告金額時，真正的分水嶺是公告金額的十分之一（15 萬）。</figcaption>

<figure>
